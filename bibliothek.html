<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Bibliothek der Anfänge</title>

<style>
body{
  margin:0;
  background:#02040a;
  font-family:system-ui;
  color:white;
  display:flex;
  justify-content:center;
}

.wrapper{
  width:100%;
  max-width:420px;
  padding:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:12px;
}

.book{
  aspect-ratio:2/3;
  border-radius:12px;
  background-size:cover;
  background-position:center;
  box-shadow:0 0 15px rgba(120,200,255,.3);
  transition:.2s;
}

.book.active{
  transform:scale(1.08);
  box-shadow:0 0 35px rgba(120,255,200,.9);
}

/* CENTER */
.center{
  padding:10px;
  border-radius:14px;
  background:rgba(255,255,255,0.05);
  margin-bottom:12px;
}

#status{
  text-align:center;
  font-size:13px;
  margin-bottom:8px;
}

video{
  width:100%;
  border-radius:10px;
  display:none;
  margin-bottom:8px;
}

.buttons{
  display:flex;
  gap:6px;
}

button{
  flex:1;
  padding:8px;
  border:none;
  border-radius:10px;
  background:#1e3a5f;
  color:white;
  font-weight:bold;
}

/* DOT */
#dot{
  position:fixed;
  width:8px;height:8px;
  background:red;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:9999;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="grid">
<div class="book" data-id="band1" style="background-image:url('band1.png')"></div>
<div class="book" data-id="band2" style="background-image:url('band2.png')"></div>
<div class="book" data-id="band3" style="background-image:url('band3.png')"></div>
</div>

<div class="center">
<div id="status">Status: bereit</div>
<video id="cam" autoplay muted playsinline></video>

<div class="buttons">
<button onclick="startCam()">Kamera</button>
<button onclick="startTracking()">Tracking</button>
<button onclick="calibrate()">Kalibrieren</button>
</div>
</div>

<div class="grid">
<div class="book" data-id="band4" style="background-image:url('band4.png')"></div>
<div class="book" data-id="band5" style="background-image:url('band5.png')"></div>
<div class="book" data-id="band6" style="background-image:url('band6.png')"></div>
</div>

</div>

<div id="dot"></div>

<script>
const cam=document.getElementById("cam");
const dot=document.getElementById("dot");
const books=[...document.querySelectorAll(".book")];

let running=false;
let tracking=false;

function setStatus(t){
 document.getElementById("status").innerText="Status: "+t;
}

async function startCam(){
 if(running){
   cam.srcObject.getTracks().forEach(t=>t.stop());
   cam.style.display="none";
   running=false;
   return;
 }

 const stream=await navigator.mediaDevices.getUserMedia({video:true});
 cam.srcObject=stream;
 cam.style.display="block";
 running=true;
}

function calibrate(){
 localStorage.setItem("aurion_calibrated","true");
 setStatus("kalibriert ✔");
}

/* LINKS */
function openBook(id){
 const links={
  band1:"v_p_i_m.pdf",
  band2:"Insel_Gailingen_Dirk_Schaefer_cover_final.pdf",
  band3:"buch2_intuition.html",
  band4:"selbstreflexion.html",
  band5:"sternenuebung.html",
  band6:"a_v.html"
 };
 window.location.href=links[id];
}

/* TRACKING */
async function startTracking(){
 if(!running)return;

 const vision=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest");
 const fs=await vision.FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
 );

 const fl=await vision.FaceLandmarker.createFromOptions(fs,{
  baseOptions:{
   modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"
  },
  runningMode:"VIDEO",
  numFaces:1,
  outputFaceBlendshapes:true
 });

 tracking=true;
 setStatus("Tracking läuft");

 let hover=null;
 let lastBlink=0;
 let blinkCount=0;

 function loop(){
  if(!tracking)return;

  const res=fl.detectForVideo(cam,performance.now());

  if(res.faceLandmarks.length){
    const p=res.faceLandmarks[0][468];

    let x=innerWidth*(1-p.x);
    let y=innerHeight*(p.y);

    dot.style.left=x+"px";
    dot.style.top=y+"px";

    hover=null;

    books.forEach(b=>{
      const r=b.getBoundingClientRect();
      if(x>r.left && x<r.right && y>r.top && y<r.bottom){
        hover=b;
      }
    });

    books.forEach(b=>b.classList.remove("active"));
    if(hover) hover.classList.add("active");

    /* BLINK */
    const b=res.faceBlendshapes[0].categories;
    const blink=Math.max(
      b.find(c=>c.categoryName==="eyeBlinkLeft").score,
      b.find(c=>c.categoryName==="eyeBlinkRight").score
    );

    const now=Date.now();

    if(blink>0.6 && now-lastBlink>300){
      blinkCount++;
      lastBlink=now;

      if(blinkCount==2 && hover){
        openBook(hover.dataset.id);
        blinkCount=0;
      }

      setTimeout(()=>blinkCount=0,600);
    }
  }

  requestAnimationFrame(loop);
 }

 loop();
}
</script>

</body>
</html>
