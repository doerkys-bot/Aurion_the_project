<script>
const BOOKS = [
  {title:"Vom Planschbecken ins Meer", link:"a_v.html", icons:"😨 😔"},
  {title:"Intuition oder Einbildung?", link:"buch2_intuition.html", icons:"❓ 😏"},
  {title:"Selbstreflexion", link:"selbstreflexion.html", icons:"😊 😌"},
  {title:"Sternenübung", link:"sternenuebung1.html", icons:"📖 📖"},
  {title:"Aurion", link:"aurion_bibl.html", icons:"🌟 😎"},
  {title:"Vorhof zu Aurion", link:"a_v.html", icons:"📖 📖"},
  {title:"Sind Sie bereit für den nächsten Fußabdruck?", link:"Aurion_Portal.html", icons:"👣 🌑"}
];

const DURATION = 3000;
const STEP = 50;
const BOUNDS = {width: window.innerWidth, height: window.innerHeight};

const library = document.getElementById("bibliothek");
let bookElements = [];

BOOKS.forEach((b, i)=>{
  const div = document.createElement('div');
  div.className='buch';
  div.dataset.link=b.link;
  div.innerHTML=`<span>${b.title}</span><div class="icons">${b.icons}</div><div class="progress"></div><div class="notice">Leider nicht genug Aufmerksamkeit</div>`;
  library.appendChild(div);

  // Initialposition
  div.posX = Math.random()*(BOUNDS.width-180);
  div.posY = Math.random()*(BOUNDS.height-200);
  div.posZ = Math.random()*30-15;
  div.rotation = Math.random()*360;

  div.dirX = Math.random()*2-1;
  div.dirY = Math.random()*2-1;
  div.dirZ = Math.random()*0.4-0.2;
  div.rotSpeed = (Math.random()*2-1)*0.3;

  div.active = false;
  div.value = 0;
  div.clicks = 0;
  div.interval = null;

  // Zweite Reihe fixiert
  div.fixedY = (i >= 2 && i <= 3) ? BOUNDS.height/2 : null;

  bookElements.push(div);
});

// Fliegen + Rotation + Fortschritt
function updateBooks(){
  bookElements.forEach(book=>{
    const bar = book.querySelector('.progress');
    const notice = book.querySelector('.notice');

    // Fortschritt
    if(book.active) book.value += (STEP/DURATION)*100;
    else book.value -= (STEP/DURATION)*80;
    book.value=Math.max(0,Math.min(100,book.value));
    bar.style.width=book.value+'%';
    if(book.value>70){
      bar.classList.add('pulse');
      bar.style.background='linear-gradient(90deg,#8fe7ff,#fff2c0)';
    } else {
      bar.classList.remove('pulse');
      bar.style.background='linear-gradient(90deg,#6fdcff,#b6f3ff)';
    }
    if(book.value>=100){ window.location.href=book.dataset.link; }
    if(!book.active && book.value===0){ notice.style.display='block'; }

    // 3D Bewegung
    book.posX += book.dirX;
    book.posY += book.dirY;
    book.posZ += book.dirZ;

    // zweite Reihe sanft schweben
    if(book.fixedY !== null){
      book.posY = book.fixedY + Math.sin(Date.now()/1000 + book.posX/200)*20;
    }

    // Rückprall Ränder
    if(book.posX<0 || book.posX>BOUNDS.width-160) book.dirX*=-1;
    if(book.fixedY === null && (book.posY<0 || book.posY>BOUNDS.height-160)) book.dirY*=-1;
    if(book.posZ<-20 || book.posZ>20) book.dirZ*=-1;

    // Abstand zu anderen Büchern (leichte Kollision)
    bookElements.forEach(other=>{
      if(book===other) return;
      const dx = book.posX-other.posX;
      const dy = book.posY-other.posY;
      const dist = Math.sqrt(dx*dx+dy*dy);
      if(dist<180){ book.dirX += dx/dist*0.05; book.dirY += dy/dist*0.05; }
    });

    book.rotation += book.rotSpeed;

    // Größe je nach Z
    const scale = 1 + book.posZ/50;
    book.style.transform=`translate(${book.posX}px,${book.posY}px) translateZ(${book.posZ}px) rotateY(${book.rotation}deg) scale(${scale})`;
  });
}

// Interaktionen
bookElements.forEach(book=>{
  book.addEventListener('mouseenter', ()=>{ book.active=true; book.classList.add('focus'); });
  book.addEventListener('mouseleave', ()=>{ book.active=false; book.classList.remove('focus'); });
  book.addEventListener('touchstart', ()=>{ book.active=true; book.classList.add('focus'); }, {passive:true});
  book.addEventListener('touchend', ()=>{ book.active=false; book.classList.remove('focus'); });
  book.addEventListener('click', ()=>{
    book.clicks++;
    if(book.clicks>=5) window.location.href=book.dataset.link;
    setTimeout(()=>book.clicks=0,1200);
  });
});

setInterval(updateBooks, STEP);

window.addEventListener('resize', ()=>{
  BOUNDS.width=window.innerWidth;
  BOUNDS.height=window.innerHeight;
});
</script>
