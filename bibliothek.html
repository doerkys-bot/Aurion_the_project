<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Bibliothek der Anfänge</title>

<style>
body{
  margin:0;
  background:#02040a;
  font-family:system-ui;
  color:white;
  display:flex;
  justify-content:center;
}

.wrapper{
  width:100%;
  max-width:390px;
  padding:10px;
}

h1{
  text-align:center;
  font-size:1.2rem;
  margin:8px 0 12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.book{
  position:relative;
  aspect-ratio:2/3;
  border-radius:10px;
  background-size:cover;
  background-position:center;
  box-shadow:0 0 10px rgba(120,200,255,.25);
  transition:transform .18s ease, box-shadow .18s ease, opacity .2s ease;
  overflow:hidden;
  opacity:.5;
}

.book.ready{ opacity:1; }

.book.active{
  transform:scale(1.05);
  box-shadow:0 0 25px rgba(120,255,200,.9);
}

.countdown{
  position:absolute;
  left:6px;
  bottom:6px;
  background:rgba(0,0,0,0.5);
  font-size:10px;
  padding:2px 5px;
  border-radius:6px;
}

#videoWrap{
  position:fixed;
  top:10px;
  left:10px;
  width:80px;
  height:90px;
  border-radius:8px;
  overflow:hidden;
  display:none;
  z-index:9996;
}

#cam{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(1.6) translateY(-10%);
}

#dot{
  position:fixed;
  width:8px;
  height:8px;
  background:red;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:9999;
  opacity:0;
}
#dot.on{ opacity:1; }

#overload{
  position:fixed;
  inset:0;
  background:#02040a;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:30000;
}

#overloadBox{
  background:#102033;
  padding:20px;
  border-radius:14px;
  width:90%;
  max-width:360px;
  text-align:center;
}
</style>
</head>

<body>

<div id="overload">
  <div id="overloadBox">
    Willkommen in der Bibliothek der Anfänge.<br><br>
    Buch ansehen → Blick halten<br>
    Schnell öffnen → Doppelblink<br><br>
    <button id="overloadBtn">Verstanden</button>
  </div>
</div>

<div id="videoWrap">
  <video id="cam" autoplay muted playsinline></video>
</div>

<div class="wrapper">
  <h1>📚 Bibliothek der Anfänge</h1>

  <div class="grid">
    <div class="book" data-id="band1" style="background-image:url('band1.png')"></div>
    <div class="book" data-id="band2" style="background-image:url('band2.png')"></div>
    <div class="book" data-id="band3" style="background-image:url('band3.png')"></div>
  </div>

  <div class="grid">
    <div class="book" data-id="band4" style="background-image:url('band4.png')"></div>
    <div class="book" data-id="band5" style="background-image:url('band5.png')"></div>
    <div class="book" data-id="band6" style="background-image:url('band6.png')"></div>
  </div>
</div>

<div id="dot"></div>

<script type="module">

const DOT_Y_OFFSET = -25;
const DOT_SPEED_OUTSIDE = 0.12;
const DOT_SPEED_INSIDE  = 0.06;

const cam = document.getElementById("cam");
const videoWrap = document.getElementById("videoWrap");
const dot = document.getElementById("dot");
const books = [...document.querySelectorAll(".book")];
const overload = document.getElementById("overload");
const overloadBtn = document.getElementById("overloadBtn");

let running=false;
let tracking=false;
let faceLandmarker=null;
let coversReady=false;

let tx = innerWidth/2;
let ty = innerHeight/2 - 25;
let dx = innerWidth/2;
let dy = innerHeight/2 - 25;

let focusedBook=null;
let focusStart=0;
let countdownEl=null;
let countdownInt=null;

let latestBlink=0;
let lastFaceSeen=Date.now();

function openBook(id){
  const links = {
    band1: "v_p_i_m.pdf",
    band2: "Insel_Gailingen_Dirk_Schaefer_cover_final.pdf",
    band3: "buch2_intuition.html",
    band4: "selbstreflexion.html",
    band5: "sternenuebung.html",
    band6: "a_v.html"
  };
  location.href = links[id];
}

async function preload(){
  const jobs = books.map(b=>{
    return new Promise(res=>{
      const img=new Image();
      const url=b.style.backgroundImage.match(/url\("(.*)"\)/)[1];
      img.onload=res;
      img.onerror=res;
      img.src=url;
    });
  });
  await Promise.all(jobs);
  coversReady=true;
  books.forEach(b=>b.classList.add("ready"));
}
preload();

function getBook(x,y){
  if(!coversReady) return null;
  for(const b of books){
    const r=b.getBoundingClientRect();
    if(x>r.left && x<r.right && y>r.top && y<r.bottom) return b;
  }
  return null;
}

function stopCountdown(){
  if(countdownInt) clearInterval(countdownInt);
  if(countdownEl) countdownEl.remove();
  countdownInt=null;
  countdownEl=null;
}

function startCountdown(book){
  stopCountdown();
  let c=3;
  countdownEl=document.createElement("div");
  countdownEl.className="countdown";
  countdownEl.textContent=c;
  book.appendChild(countdownEl);

  countdownInt=setInterval(()=>{
    c--;
    if(countdownEl) countdownEl.textContent=c;
    if(c<=0){
      stopCountdown();
      openBook(book.dataset.id);
    }
  },1000);
}

function handleFocus(book){
  if(!book){ focusedBook=null; stopCountdown(); return; }

  if(focusedBook!==book){
    focusedBook=book;
    focusStart=Date.now();
    stopCountdown();
    return;
  }

  if(Date.now()-focusStart>1200 && !countdownInt){
    startCountdown(book);
  }
}

function dotLoop(){
  const hover=getBook(dx,dy);
  const speed=hover?DOT_SPEED_INSIDE:DOT_SPEED_OUTSIDE;

  dx+=(tx-dx)*speed;
  dy+=(ty-dy)*speed;

  dot.style.left=dx+"px";
  dot.style.top=dy+"px";

  books.forEach(b=>b.classList.toggle("active",b===hover));
  handleFocus(hover);

  requestAnimationFrame(dotLoop);
}
dotLoop();

async function loadLandmarker(){
  const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest");
  const fs = await vision.FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
  );

  return await vision.FaceLandmarker.createFromOptions(fs,{
    baseOptions:{
      modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"
    },
    runningMode:"VIDEO",
    numFaces:1,
    outputFaceBlendshapes:true
  });
}

async function start(){
  const s=await navigator.mediaDevices.getUserMedia({video:true});
  cam.srcObject=s;
  await cam.play();
  videoWrap.style.display="block";
  running=true;

  faceLandmarker=await loadLandmarker();
  tracking=true;

  function loop(){
    if(!tracking) return;

    const res=faceLandmarker.detectForVideo(cam, performance.now());
    if(res?.faceLandmarks?.length){
      lastFaceSeen=Date.now();
      const lm=res.faceLandmarks[0][468];
      tx=innerWidth*(1-lm.x);
      ty=innerHeight*(lm.y)+DOT_Y_OFFSET;
    }

    requestAnimationFrame(loop);
  }
  loop();
}

document.body.onclick=start;

overloadBtn.onclick=()=>{
  overload.style.display="none";
  dot.classList.add("on");
};

</script>

</body>
</html>
