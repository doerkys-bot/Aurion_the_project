<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Bibliothek der Anfänge</title>

<style>
body{
  margin:0;
  min-height:100vh;
  background:#ffffff;
  color:#0f1b2a;
  font-family:system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
}

h1{
  margin:1rem 0;
  color:#1b6fae;
}

.bibliothek{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1.4rem;
  max-width:900px;
  width:95%;
  padding-bottom:220px;
}

.buch{
  position:relative;
  height:160px;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 12px 26px rgba(0,0,0,.10);
  transition:.2s;
}

.cover{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.buch span{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,.84);
  padding:4px 8px;
  border-radius:6px;
  font-weight:700;
  text-align:center;
}

.buch.fixating{
  transform:scale(1.08);
  box-shadow:0 0 20px rgba(80,200,255,.30);
}

#systemDot{
  position:fixed;
  width:8px;
  height:8px;
  border-radius:50%;
  background:red;
  pointer-events:none;
  z-index:9999;
  opacity:0;
  transform:translate(-50%,-50%);
  box-shadow:0 0 8px rgba(255,0,0,.5);
}
#systemDot.on{opacity:1;}

#systemDot.blink{
  transform:translate(-50%,-50%) scale(1.8);
}
#systemDot.double{
  transform:translate(-50%,-50%) scale(2.3);
}

#videoWrap{
  position:fixed;
  bottom:92px;
  left:50%;
  transform:translateX(-50%);
  width:260px;
  height:170px;
  display:none;
  border-radius:12px;
  overflow:hidden;
  background:#000;
}

#cam{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

.controls{
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:#1b6fae;
  color:white;
  font-weight:700;
}
button:disabled{opacity:.5;}

#calTarget{
  position:fixed;
  width:20px;
  height:20px;
  border-radius:50%;
  background:#00b7ff;
  transform:translate(-50%,-50%);
  display:none;
}
</style>
</head>

<body>

<h1>📚 Bibliothek der Anfänge</h1>

<div class="bibliothek">

<div class="buch" data-href="https://doerkys-bot.github.io/Aurion_the_project/v_p_i_m.pdf">
<img src="cover1.jpg" class="cover">
<span>Vom Planschbecken ins Meer</span>
</div>

<div class="buch" data-href="Insel_Gailingen_Dirk_Schaefer_cover_final.pdf">
<img src="cover2.jpg" class="cover">
<span>Insel Gailingen</span>
</div>

<div class="buch" data-href="buch2_intuition.html">
<img src="cover3.jpg" class="cover">
<span>Intuition oder Einbildung?</span>
</div>

<div class="buch" data-href="selbstreflexion.html">
<img src="cover4.jpg" class="cover">
<span>Selbstreflexion</span>
</div>

<div class="buch" data-href="sternenuebung.html">
<img src="cover5.jpg" class="cover">
<span>Chi-Austausch</span>
</div>

<div class="buch" data-href="https://doerkys-bot.github.io/Aurion_theproject/a_v.html">
<img src="cover6.jpg" class="cover">
<span>Vorhof zu Aurion</span>
</div>

</div>

<div id="videoWrap"><video id="cam" autoplay muted playsinline></video></div>
<div id="systemDot"></div>
<div id="calTarget"></div>

<div class="controls">
<button id="btnCam">Kamera</button>
<button id="btnTrack" disabled>Tracking</button>
<button id="btnCal" disabled>Kalibrieren</button>
</div>

<script>
(() => {

const dot = document.getElementById("systemDot");
const books = [...document.querySelectorAll(".buch")];
const cam = document.getElementById("cam");

let tx = innerWidth/2;
let ty = innerHeight/2;
let dx = tx, dy = ty;

let tracking=false;
let faceLandmarker=null;

let hoverBook=null;

let calActive=false;
let calSamples=[];
let calBounds=null;

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

function applyCal(x,y){
if(!calBounds) return {x,y};
return {
x: clamp((x-calBounds.minX)/(calBounds.maxX-calBounds.minX),0,1),
y: clamp((y-calBounds.minY)/(calBounds.maxY-calBounds.minY),0,1)
};
}

function loop(){

// 👉 SMOOTH (0.22)
dx += (tx - dx) * 0.16;
dy += (ty - dy) * 0.16;

// Dämpfung
dx = Math.round(dx*10)/10;
dy = Math.round(dy*10)/10;

dot.style.left=dx+"px";
dot.style.top=dy+"px";

let target=null;

books.forEach(book=>{
const r=book.getBoundingClientRect();
const cx=r.left+r.width/2;
const cy=r.top+r.height/2;
const d=Math.hypot(dx-cx,dy-cy);
if(d<120) target={x:cx,y:cy,el:book};
});

if(target){
dx += (target.x-dx)*0.10;
dy += (target.y-dy)*0.10;
hoverBook=target.el;
}else{
hoverBook=document.elementFromPoint(dx,dy)?.closest(".buch");
}

books.forEach(b=>b.classList.toggle("fixating",b===hoverBook));

requestAnimationFrame(loop);
}
loop();

document.getElementById("btnCam").onclick=async()=>{
const s=await navigator.mediaDevices.getUserMedia({video:true});
cam.srcObject=s;
await cam.play();
document.getElementById("videoWrap").style.display="block";
document.getElementById("btnTrack").disabled=false;
};

document.getElementById("btnTrack").onclick=async()=>{
const vision=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest");
const fs=await vision.FilesetResolver.forVisionTasks(
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
);

faceLandmarker=await vision.FaceLandmarker.createFromOptions(fs,{
baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"},
runningMode:"VIDEO",
numFaces:1,
outputFaceBlendshapes:true
});

tracking=true;
document.getElementById("btnCal").disabled=false;
dot.classList.add("on");

let blinkArmed=true, pending=false, first=0;

function track(){
if(!tracking) return;

const res=faceLandmarker.detectForVideo(cam,performance.now());

if(res.faceLandmarks.length){
const p=res.faceLandmarks[0][468];

if(calActive) calSamples.push(p);

const c=applyCal(p.x,p.y);
tx=innerWidth*(1-c.x);
ty=innerHeight*c.y;
}

const cats=res.faceBlendshapes?.[0]?.categories||[];
const get=n=>cats.find(c=>c.categoryName===n)?.score||0;
const b=Math.max(get("eyeBlinkLeft"),get("eyeBlinkRight"));

const now=Date.now();

if(b<0.25){blinkArmed=true;}

if(!pending){
if(blinkArmed && b>0.55){
pending=true;
first=now;
blinkArmed=false;
dot.classList.add("blink");
setTimeout(()=>dot.classList.remove("blink"),150);
}
}else{
if(now-first<700 && b>0.5){
dot.classList.add("double");
setTimeout(()=>dot.classList.remove("double"),150);
if(hoverBook) window.location.href=hoverBook.dataset.href;
pending=false;
}
if(now-first>700) pending=false;
}

requestAnimationFrame(track);
}
track();
};

document.getElementById("btnCal").onclick=async()=>{
calActive=true;
calSamples=[];
const target=document.getElementById("calTarget");
target.style.display="block";

const pts=[
[60,60],[innerWidth-60,60],
[innerWidth-60,innerHeight-60],
[60,innerHeight-60],
[innerWidth/2,innerHeight/2]
];

let grouped=[];

for(const [x,y] of pts){
target.style.left=x+"px";
target.style.top=y+"px";
let start=calSamples.length;
await new Promise(r=>setTimeout(r,1200));
let slice=calSamples.slice(start);
if(slice.length){
let ax=slice.reduce((a,s)=>a+s.x,0)/slice.length;
let ay=slice.reduce((a,s)=>a+s.y,0)/slice.length;
grouped.push({x:ax,y:ay});
}
}

calBounds={
minX:Math.min(...grouped.map(p=>p.x)),
maxX:Math.max(...grouped.map(p=>p.x)),
minY:Math.min(...grouped.map(p=>p.y)),
maxY:Math.max(...grouped.map(p=>p.y))
};

target.style.display="none";
calActive=false;
alert("Kalibrierung fertig");
};

})();
</script>

</body>
</html>
