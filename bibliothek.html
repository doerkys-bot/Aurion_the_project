<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Bibliothek der Anfänge</title>

<style>
body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,sans-serif;
  background:radial-gradient(circle at 30% 40%, #0b1223, #05070f 80%);
  color:#eaeaea;
  display:flex;
  flex-direction:column;
  align-items:center;
}

h1{
  margin:1.5rem 0 1rem;
  color:#8cf;
  text-shadow:0 0 12px #68bfff;
}

.regal{
  width:95%;
  max-width:900px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:1.4rem;
  padding:1.5rem 1rem 3rem;
}

.buch{
  height:160px;
  background:linear-gradient(90deg,#182545,#0e162e);
  border-radius:12px;
  border:1px solid rgba(130,170,255,.25);
  box-shadow:0 10px 25px rgba(0,0,0,.55);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  transition:transform .15s, box-shadow .2s;
}

.buch:hover{
  transform:translateY(-4px);
  box-shadow:0 0 25px rgba(140,200,255,.6);
}

.buch span{
  font-size:1.05rem;
}

.icons{
  margin-top:8px;
  font-size:1.4rem;
  opacity:.85;
}

/* Dezenter Privacy-Hinweis */
#privacy-note{
  position:fixed;
  bottom:10px;
  right:10px;
  background:rgba(0,0,0,0.6);
  color:#7fd7ff;
  font-size:12px;
  padding:6px 10px;
  border-radius:6px;
  z-index:999;
}
#privacy-note a{
  color:#7fd7ff;
  text-decoration:underline;
}

footer{
  margin-bottom:1rem;
  font-size:.85rem;
  opacity:.6;
  text-align:center;
}
</style>
</head>

<body>

<h1>📚 Bibliothek der Anfänge</h1>

<div class="regal">
  <div class="buch" onclick="location.href='a_v.html'">
    <span>Vom Planschbecken ins Meer</span>
    <div class="icons">😨 😔</div>
  </div>

  <div class="buch" onclick="location.href='buch2_intuition.html'">
    <span>Intuition oder Einbildung?</span>
    <div class="icons">❓ 😏</div>
  </div>

  <div class="buch" onclick="location.href='selbstreflexion.html'">
    <span>Selbstreflexion</span>
    <div class="icons">😊 😌</div>
  </div>

  <div class="buch" onclick="location.href='sternenuebung1.html'">
    <span>Sternenübung</span>
    <div class="icons">📖 📖</div>
  </div>

  <div class="buch" onclick="location.href='aurion_bibl.html'">
    <span>Aurion</span>
    <div class="icons">🌟 😎</div>
  </div>

  <div class="buch" onclick="location.href='vorhof.html'">
    <span>Vorhof zu Aurion</span>
    <div class="icons">📖 📖</div>
  </div>
</div>

<!-- AUGENBLICKE / Privacy -->
<div id="privacy-note">
  📌 <a href="privacy.html">AUGENBLICKE / Datenschutz</a>
</div>

<footer>
  © Aurion – Bibliothek der Anfänge<br>
  Diese Bibliothek erinnert sich nicht an Namen.
</footer>

</body>
</html>
