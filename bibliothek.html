<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Bibliothek der Anfänge – 3D-Flug verbessert</title>

<style>
body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,sans-serif;
  background:radial-gradient(circle at 30% 40%, #0b1223, #05070f 80%);
  color:#eaeaea;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
}
h1{
  margin:1.2rem 0 .6rem;
  color:#8cf;
  text-shadow:0 0 12px #68bfff;
}
#bibliothek{
  width:100%;
  height:100%;
  position:relative;
}
.buch{
  position:absolute;
  height:160px;
  width:160px;
  background:linear-gradient(90deg,#182545,#0e162e);
  border-radius:10px;
  border:1px solid rgba(130,170,255,.25);
  box-shadow:0 10px 25px rgba(0,0,0,.55);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  overflow:hidden;
  will-change: transform, opacity;
  transition: transform 0.2s ease, opacity 0.3s ease, filter 0.3s ease;
}
.buch span{font-size:1.1rem;}
.icons{margin-top:8px;font-size:1.4rem;opacity:.8;}
.buch.focus{
  border-color:#9fdcff;
  box-shadow:0 0 20px rgba(160,220,255,.6);
}
.progress{
  position:absolute;
  bottom:0;
  left:0;
  height:6px;
  width:0%;
  background:linear-gradient(90deg,#6fdcff,#b6f3ff);
}
.progress.pulse{
  animation:pulse 1.2s infinite;
}
@keyframes pulse{
  0%{opacity:.7}
  50%{opacity:1}
  100%{opacity:.7}
}
.notice{
  position:absolute;
  top:6px;
  font-size:.75rem;
  opacity:.7;
  display:none;
}
footer{
  margin-bottom:1rem;
  font-size:.85rem;
  opacity:.6;
  text-align:center;
}
</style>
</head>
<body>

<h1>📚 Bibliothek der Anfänge</h1>
<div id="bibliothek"></div>
<footer>© Aurion – Bibliothek der Anfänge<br>Diese Bibliothek erinnert sich nicht an Namen.</footer>

<script>
const BOOKS = [
  {title:"Vom Planschbecken ins Meer", link:"a_v.html", icons:"😨 😔"},
  {title:"Intuition oder Einbildung?", link:"buch2_intuition.html", icons:"❓ 😏"},
  {title:"Selbstreflexion", link:"selbstreflexion.html", icons:"😊 😌"},
  {title:"Sternenübung", link:"sternenuebung1.html", icons:"📖 📖"},
  {title:"Aurion", link:"aurion_bibl.html", icons:"🌟 😎"},
  {title:"Vorhof zu Aurion", link:"a_v.html", icons:"📖 📖"},
  {title:"Sind Sie bereit für den nächsten Fußabdruck?", link:"Aurion_Portal.html", icons:"👣 🌑"}
];

const DURATION = 3000;
const STEP = 50;
const BOUNDS = {width: window.innerWidth, height: window.innerHeight};

const library = document.getElementById("bibliothek");
let bookElements = [];

BOOKS.forEach((b, i)=>{
  const div = document.createElement('div');
  div.className='buch';
  div.dataset.link=b.link;
  div.innerHTML=`<span>${b.title}</span><div class="icons">${b.icons}</div><div class="progress"></div><div class="notice">Leider nicht genug Aufmerksamkeit</div>`;
  library.appendChild(div);

  // Initialposition zufällig
  div.posX = Math.random()*(BOUNDS.width-180);
  div.posY = (i===1) ? BOUNDS.height/2-80 : Math.random()*(BOUNDS.height-200);
  div.posZ = Math.random()*30-15;

  div.dirX = (Math.random()*2-1)*0.7;  // unterschiedliche Geschwindigkeit
  div.dirY = (Math.random()*2-1)*0.7;
  div.dirZ = Math.random()*0.4-0.2;

  div.active = false;
  div.value = 0;
  div.clicks = 0;
  div.interval = null;
  bookElements.push(div);
});

// Fliegen + Fortschritt + Farb-Akzent
function updateBooks(){
  bookElements.forEach(book=>{
    const bar = book.querySelector('.progress');
    const notice = book.querySelector('.notice');

    // Fortschritt
    if(book.active) book.value += (STEP/DURATION)*100;
    else book.value -= (STEP/DURATION)*80;
    book.value=Math.max(0,Math.min(100,book.value));
    bar.style.width=book.value+'%';
    if(book.value>70){
      bar.classList.add('pulse');
      bar.style.background='linear-gradient(90deg,#8fe7ff,#fff2c0)';
    } else {
      bar.classList.remove('pulse');
      bar.style.background='linear-gradient(90deg,#6fdcff,#b6f3ff)';
    }
    if(book.value>=100){ window.location.href=book.dataset.link; }
    if(!book.active && book.value===0){ notice.style.display='block'; }

    // 3D Bewegung (außer die zweite Reihe)
    if(book!==bookElements[1]){
      book.posX += book.dirX;
      book.posY += book.dirY;
      book.posZ += book.dirZ;

      // Rückprall Ränder
      if(book.posX<0 || book.posX>BOUNDS.width-160) book.dirX*=-1;
      if(book.posY<0 || book.posY>BOUNDS.height-160) book.dirY*=-1;
      if(book.posZ<-20 || book.posZ>20) book.dirZ*=-1;

      // Abstand zu anderen Büchern (leichte Kollision)
      bookElements.forEach(other=>{
        if(book===other) return;
        const dx = book.posX-other.posX;
        const dy = book.posY-other.posY;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist<180){ book.dirX += dx/dist*0.05; book.dirY += dy/dist*0.05; }
      });
    }

    // Farb-Akzent abhängig von Tiefe
    const depthFactor = 1 - (book.posZ+20)/40;
    book.style.filter = `brightness(${0.85+depthFactor*0.3}) saturate(${0.8+depthFactor*0.4})`;

    // Transform + sanftes Ein- und Ausblenden
    book.style.transform=`translate(${book.posX}px,${book.posY}px) translateZ(${book.posZ}px)`;
    book.style.opacity = 0.7 + depthFactor*0.3;
  });
}

// Interaktionen
bookElements.forEach(book=>{
  book.addEventListener('mouseenter', ()=>{ book.active=true; book.classList.add('focus'); });
  book.addEventListener('mouseleave', ()=>{ book.active=false; book.classList.remove('focus'); });
  book.addEventListener('touchstart', ()=>{ book.active=true; book.classList.add('focus'); }, {passive:true});
  book.addEventListener('touchend', ()=>{ book.active=false; book.classList.remove('focus'); });
  book.addEventListener('click', ()=>{
    book.clicks++;
    if(book.clicks>=5) window.location.href=book.dataset.link;
    setTimeout(()=>book.clicks=0,1200);
  });
});

setInterval(updateBooks, STEP);

window.addEventListener('resize', ()=>{
  BOUNDS.width=window.innerWidth;
  BOUNDS.height=window.innerHeight;
});
</script>

</body>
</html>
