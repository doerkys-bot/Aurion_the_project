<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Bibliothek der Anfänge</title>

<style>
body{
  margin:0;
  min-height:100vh;
  background:#ffffff;
  color:#0f1b2a;
  font-family:system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-y:auto;
  overflow-x:hidden;
}

h1{ margin:1rem 0; color:#1b6fae; }

/* GRID */
.bibliothek{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1.4rem;
  max-width:900px;
  width:95%;
  padding-bottom:180px;
}

.buch{
  position:relative;
  height:160px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid rgba(80,140,210,.25);
  box-shadow:0 12px 26px rgba(0,0,0,.10);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  text-align:center;
  transition:.2s;
}

.buch.fixating{
  transform:scale(1.04);
  box-shadow:0 0 22px rgba(80,200,255,.25);
}

/* COVER */
.cover{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0.85;
}

.buch span{
  position:relative;
  z-index:2;
  background:rgba(255,255,255,0.7);
  padding:4px 8px;
  border-radius:6px;
  margin-bottom:10px;
  font-weight:600;
}

/* DOT */
#systemDot{
  position:fixed;
  width:8px;height:8px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:#ff3b3b;
  pointer-events:none;
  z-index:9998;
  opacity:0;
}
#systemDot.on{opacity:1;}

/* CAMERA */
#videoWrap{
  position:fixed;
  left:50%;
  bottom:104px;
  transform:translateX(-50%);
  width:260px;
  height:170px;
  border-radius:12px;
  overflow:hidden;
  display:none;
  z-index:9996;
}
#cam{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

/* BUTTONS */
button{
  padding:8px 12px;
  border-radius:10px;
  border:1px solid rgba(60,120,190,.25);
  background:#eef6ff;
  font-weight:700;
  cursor:pointer;
}

.controls{
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:space-around;
}
</style>
</head>

<body>

<h1>📚 Bibliothek der Anfänge</h1>

<div class="bibliothek">

  <div class="buch" data-href="https://doerkys-bot.github.io/Aurion_the_project/v_p_i_m.pdf">
    <img src="cover1.jpg" class="cover">
    <span>Vom Planschbecken ins Meer</span>
  </div>

  <div class="buch" data-href="Insel_Gailingen_Dirk_Schaefer_cover_final.pdf">
    <img src="cover2.jpg" class="cover">
    <span>Insel Gailingen</span>
  </div>

  <div class="buch" data-href="buch2_intuition.html">
    <img src="cover3.jpg" class="cover">
    <span>Intuition oder Einbildung?</span>
  </div>

  <div class="buch" data-href="selbstreflexion.html">
    <span>Selbstreflexion</span>
  </div>

  <div class="buch" data-href="sternenuebung.html">
    <span>Chi-Austausch</span>
  </div>

  <div class="buch" data-href="https://doerkys-bot.github.io/Aurion_the_project/a_v.html">
    <span>Vorhof zu Aurion</span>
  </div>

</div>

<div id="videoWrap"><video id="cam" autoplay muted playsinline></video></div>
<div id="systemDot"></div>

<div class="controls">
  <button id="btnCam">Kamera</button>
  <button id="btnTrack">Tracking</button>
</div>

<script>
const books = document.querySelectorAll(".buch");

books.forEach(b=>{
  b.addEventListener("click", ()=>{
    window.location.href = b.dataset.href;
  });
});

/* Maus fallback */
document.addEventListener("mousemove", e=>{
  const dot = document.getElementById("systemDot");
  dot.classList.add("on");
  dot.style.left = e.clientX+"px";
  dot.style.top = e.clientY+"px";

  let el = document.elementFromPoint(e.clientX,e.clientY);
  let book = el?.closest(".buch");

  books.forEach(b=>b.classList.remove("fixating"));
  if(book) book.classList.add("fixating");
});
</script>

</body>
</html>
