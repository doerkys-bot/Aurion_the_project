<script>
/* =========================================
   STABILE AUFMERKSAMKEIT – SINGLE SOURCE
========================================= */

const FULL_TIME = 3000;
const FRAME = 40;
const STEP = 100 / (FULL_TIME / FRAME);

let activeBook = null;
let progress = 0;
let loopRunning = false;

function startLoop(){
  if (loopRunning) return;
  loopRunning = true;

  setInterval(()=>{
    if (!activeBook) {
      progress = Math.max(0, progress - STEP);
    } else {
      progress = Math.min(100, progress + STEP);
    }

    document.querySelectorAll('.buch').forEach(b=>{
      const bar = b.querySelector('.progress');
      if (!bar) return;
      bar.style.width = (b === activeBook ? progress : 0) + '%';
      b.classList.toggle('attention', b === activeBook);
    });

    if (activeBook && progress >= 100) {
      location.href = activeBook.dataset.link;
    }
  }, FRAME);
}

document.querySelectorAll('.buch').forEach(book=>{
  let clicks = 0;

  /* Progress-Bar einfügen */
  const bar = document.createElement('div');
  bar.className = 'progress';
  book.appendChild(bar);

  /* DESKTOP */
  book.addEventListener('mousedown', e=>{
    e.preventDefault();
    activeBook = book;
    progress = 0;
    startLoop();
  });

  book.addEventListener('mouseup', ()=>{
    if (activeBook === book) activeBook = null;
  });

  book.addEventListener('mouseleave', ()=>{
    if (activeBook === book) activeBook = null;
  });

  /* MOBILE */
  book.addEventListener('touchstart', e=>{
    e.preventDefault();
    activeBook = book;
    progress = 0;
    startLoop();
  }, {passive:false});

  book.addEventListener('touchend', ()=>{
    if (activeBook === book) activeBook = null;
  });

  book.addEventListener('touchcancel', ()=>{
    if (activeBook === book) activeBook = null;
  });

  /* FALLBACK */
  book.addEventListener('click', ()=>{
    clicks++;
    if (clicks >= 5) location.href = book.dataset.link;
  });
});
</script>
