<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Bibliothek der Anfänge</title>

<style>
body{
  margin:0;
  min-height:100vh;
  background:#ffffff;
  color:#0f1b2a;
  font-family:system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
}

h1{
  margin:0.8rem 0;
  color:#1b6fae;
}

/* 📚 Bücher kompakter → 1 Screen */
.bibliothek{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1rem;
  max-width:520px;
  width:95%;
}

.buch{
  position:relative;
  height:120px;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 8px 18px rgba(0,0,0,.10);
  transition:.2s;
}

.cover{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.buch span{
  position:absolute;
  bottom:6px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,.9);
  padding:2px 6px;
  border-radius:6px;
  font-weight:700;
  font-size:12px;
  text-align:center;
}

.buch.fixating{
  transform:scale(1.05);
  box-shadow:0 0 16px rgba(80,200,255,.30);
}

/* 🔵 Onboarding Overlay */
#onboarding{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
  z-index:20000;
}

#onboarding h2{
  margin-bottom:12px;
}

#onboarding p{
  max-width:320px;
  line-height:1.5;
  margin-bottom:20px;
}

#onboarding button{
  padding:10px 16px;
  border:none;
  border-radius:10px;
  background:#1b6fae;
  color:white;
  font-weight:700;
}

/* Status */
#statusInfo{
  margin:10px auto;
  max-width:520px;
  width:95%;
  text-align:center;
  font-size:14px;
  font-weight:600;
  color:#1b6fae;
}

/* Kamera */
#videoWrap{
  width:220px;
  height:150px;
  display:none;
  border-radius:12px;
  overflow:hidden;
  background:#000;
  margin:6px auto;
}

#cam{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

/* Controls */
.controls{
  display:flex;
  gap:8px;
  justify-content:center;
  margin:8px 0 14px;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:8px;
  background:#1b6fae;
  color:white;
  font-weight:700;
}

#systemDot{
  position:fixed;
  width:8px;
  height:8px;
  border-radius:50%;
  background:red;
  pointer-events:none;
  z-index:9999;
  opacity:0;
  transform:translate(-50%,-50%);
}
#systemDot.on{ opacity:1; }
</style>
</head>

<body>

<!-- 🧭 Onboarding -->
<div id="onboarding">
  <h2>Willkommen</h2>
  <p>
    Diese Bibliothek wird mit deinem Blick gesteuert.<br><br>
    Fixiere ein Buch und blinzle zweimal, um es zu öffnen.
  </p>
  <button onclick="startApp()">Start</button>
</div>

<h1>📚 Bibliothek</h1>

<div class="bibliothek">
  <div class="buch" data-href="https://doerkys-bot.github.io/Aurion_the_project/v_p_i_m.pdf"><img src="cover1.jpg" class="cover"><span>Meer</span></div>
  <div class="buch" data-href="Insel_Gailingen_Dirk_Schaefer_cover_final.pdf"><img src="cover2.jpg" class="cover"><span>Insel</span></div>
  <div class="buch" data-href="buch2_intuition.html"><img src="cover3.jpg" class="cover"><span>Intuition</span></div>
  <div class="buch" data-href="selbstreflexion.html"><img src="cover4.jpg" class="cover"><span>Reflexion</span></div>
  <div class="buch" data-href="sternenuebung.html"><img src="cover5.jpg" class="cover"><span>Chi</span></div>
  <div class="buch" data-href="https://doerkys-bot.github.io/Aurion_the_project/a_v.html"><img src="cover6.jpg" class="cover"><span>Vorhof</span></div>
</div>

<div id="statusInfo">Bereit</div>

<div id="videoWrap"><video id="cam" autoplay muted playsinline></video></div>
<div id="systemDot"></div>

<div class="controls">
  <button id="btnCam">Kamera</button>
  <button id="btnTrack" disabled>Tracking</button>
</div>

<script>
let started = false;

function startApp(){
  document.getElementById("onboarding").style.display = "none";
  started = true;
}

(() => {
  const dot = document.getElementById("systemDot");
  const books = [...document.querySelectorAll(".buch")];
  const videoWrap = document.getElementById("videoWrap");
  const cam = document.getElementById("cam");

  const btnCam = document.getElementById("btnCam");
  const btnTrack = document.getElementById("btnTrack");
  const status = document.getElementById("statusInfo");

  let camRunning = false;
  let tracking = false;
  let faceLandmarker = null;

  let tx = innerWidth/2, ty = innerHeight/2;
  let dx = tx, dy = ty;

  function setStatus(t){ status.textContent = t; }

  function setDot(on){ dot.classList.toggle("on", on); }

  function openHover(){
    if(hoverBook) window.location.href = hoverBook.dataset.href;
  }

  let hoverBook = null;

  function loop(){
    dx += (tx-dx)*0.2;
    dy += (ty-dy)*0.2;

    dot.style.left = dx+"px";
    dot.style.top = dy+"px";

    hoverBook = null;

    books.forEach(b=>{
      const r=b.getBoundingClientRect();
      const cx=r.left+r.width/2;
      const cy=r.top+r.height/2;
      if(Math.hypot(dx-cx,dy-cy)<80){
        hoverBook=b;
      }
      b.classList.toggle("fixating", b===hoverBook);
    });

    requestAnimationFrame(loop);
  }
  loop();

  btnCam.onclick = async ()=>{
    if(camRunning) return;

    const s = await navigator.mediaDevices.getUserMedia({video:true});
    cam.srcObject = s;
    await cam.play();

    videoWrap.style.display="block";
    camRunning=true;
    btnTrack.disabled=false;
    setStatus("Kamera aktiv");
  };

  btnTrack.onclick = async ()=>{
    if(!camRunning) return;

    const vision = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest");
    const fs = await vision.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
    );

    faceLandmarker = await vision.FaceLandmarker.createFromOptions(fs,{
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"
      },
      runningMode:"VIDEO",
      numFaces:1,
      outputFaceBlendshapes:true
    });

    tracking=true;
    setDot(true);
    setStatus("Tracking aktiv");

    function track(){
      if(!tracking) return;

      const res = faceLandmarker.detectForVideo(cam, performance.now());

      if(res.faceLandmarks?.length){
        const p = res.faceLandmarks[0][468];
        tx = innerWidth*(1-p.x);
        ty = innerHeight*p.y;
      }

      const cats = res.faceBlendshapes?.[0]?.categories || [];
      const blink = Math.max(
        cats.find(c=>c.categoryName==="eyeBlinkLeft")?.score||0,
        cats.find(c=>c.categoryName==="eyeBlinkRight")?.score||0
      );

      if(blink>0.6){
        openHover();
      }

      requestAnimationFrame(track);
    }

    track();
  };

})();
</script>

</body>
</html>
