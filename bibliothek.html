<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Bibliothek der Anfänge</title>

<style>
body{
  margin:0;
  min-height:100vh;
  background:#ffffff;
  color:#0f1b2a;
  font-family:system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
}

h1{ margin:1rem 0; color:#1b6fae; }

.bibliothek{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1.4rem;
  max-width:900px;
  width:95%;
  padding-bottom:180px;
}

.buch{
  position:relative;
  height:160px;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 12px 26px rgba(0,0,0,.10);
  transition:.2s;
}

.cover{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.buch span{
  position:absolute;
  bottom:10px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(255,255,255,.8);
  padding:4px 8px;
  border-radius:6px;
  font-weight:700;
}

.buch.fixating{
  transform:scale(1.08);
}

#systemDot{
  position:fixed;
  width:8px;height:8px;
  border-radius:50%;
  background:red;
  pointer-events:none;
  z-index:9999;
  opacity:0;
}
#systemDot.on{opacity:1;}

#videoWrap{
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%);
  width:260px;
  height:170px;
  display:none;
}
#cam{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

.controls{
  position:fixed;
  bottom:10px;
  width:100%;
  display:flex;
  justify-content:space-around;
}
</style>
</head>

<body>

<h1>📚 Bibliothek der Anfänge</h1>

<div class="bibliothek">

<div class="buch" data-href="https://doerkys-bot.github.io/Aurion_the_project/v_p_i_m.pdf">
<img src="cover1.jpg" class="cover">
<span>Vom Planschbecken ins Meer</span>
</div>

<div class="buch" data-href="Insel_Gailingen_Dirk_Schaefer_cover_final.pdf">
<img src="cover2.jpg" class="cover">
<span>Insel Gailingen</span>
</div>

<div class="buch" data-href="buch2_intuition.html">
<img src="cover3.jpg" class="cover">
<span>Intuition oder Einbildung?</span>
</div>

<div class="buch" data-href="selbstreflexion.html">
<img src="cover4.jpg" class="cover">
<span>Selbstreflexion</span>
</div>

<div class="buch" data-href="sternenuebung.html">
<img src="cover5.jpg" class="cover">
<span>Chi-Austausch</span>
</div>

<div class="buch" data-href="https://doerkys-bot.github.io/Aurion_the_project/a_v.html">
<img src="cover6.jpg" class="cover">
<span>Vorhof zu Aurion</span>
</div>

</div>

<div id="videoWrap"><video id="cam" autoplay muted playsinline></video></div>
<div id="systemDot"></div>

<div class="controls">
<button id="btnCam">Kamera</button>
<button id="btnTrack" disabled>Tracking</button>
</div>

<script>
const dot = document.getElementById("systemDot");
const books = document.querySelectorAll(".buch");

let camRunning=false;
let tracking=false;

let tx=innerWidth/2;
let ty=innerHeight/2;
let dx=tx, dy=ty;

function setDot(on){
  dot.classList.toggle("on",on);
}

function loop(){
  dx += (tx-dx)*0.35;
  dy += (ty-dy)*0.35;

  dot.style.left=dx+"px";
  dot.style.top=dy+"px";

  let target = null;

  books.forEach(book=>{
    const rect = book.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;

    const dist = Math.hypot(dx-cx, dy-cy);

    if(dist < 120){
      target = {x:cx, y:cy, el:book};
    }
  });

  if(target){
    dx += (target.x - dx)*0.15;
    dy += (target.y - dy)*0.15;

    books.forEach(b=>b.classList.remove("fixating"));
    target.el.classList.add("fixating");
  }else{
    let el=document.elementFromPoint(dx,dy);
    let b=el?.closest(".buch");

    books.forEach(x=>x.classList.remove("fixating"));
    if(b) b.classList.add("fixating");
  }

  requestAnimationFrame(loop);
}
loop();

document.addEventListener("mousemove",e=>{
  if(!tracking){
    tx=e.clientX;
    ty=e.clientY;
  }
});

books.forEach(b=>{
  b.addEventListener("click",()=>window.location.href=b.dataset.href);
});

btnCam.onclick=async()=>{
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:true});
    cam.srcObject=stream;
    await cam.play();
    videoWrap.style.display="block";
    camRunning=true;
    btnTrack.disabled=false;
    setDot(false);
  }catch(e){
    alert("Kamera Fehler: "+e.message);
  }
};

btnTrack.onclick=async()=>{
  if(!camRunning) return alert("Erst Kamera starten");

  const vision=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest");
  const fs=await vision.FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
  );

  const fl=await vision.FaceLandmarker.createFromOptions(fs,{
    baseOptions:{
      modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"
    },
    runningMode:"VIDEO",
    numFaces:1
  });

  tracking=true;
  setDot(true);

  function track(){
    if(!tracking) return;

    const res=fl.detectForVideo(cam,performance.now());

    if(res.faceLandmarks.length){
      const p=res.faceLandmarks[0][468];
      tx=innerWidth*(1-p.x);
      ty=innerHeight*p.y;
    }

    requestAnimationFrame(track);
  }
  track();
};
</script>

</body>
</html>
