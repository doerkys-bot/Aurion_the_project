<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Bibliothek der Anfänge</title>

<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

<style>
body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,sans-serif;
  background:radial-gradient(circle at 30% 40%, #0b1223, #05070f 80%);
  color:#eaeaea;
  display:flex;
  flex-direction:column;
  align-items:center;
}

h1{
  margin:1.2rem 0 .6rem;
  color:#8cf;
  text-shadow:0 0 12px #68bfff;
}

.regal{
  width:95%;
  max-width:900px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1.4rem;
  padding:2rem;
}

.buch{
  position:relative;
  height:160px;
  background:linear-gradient(90deg,#182545,#0e162e);
  border-radius:10px;
  border:1px solid rgba(130,170,255,.25);
  box-shadow:0 10px 25px rgba(0,0,0,.55);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.buch span{font-size:1.1rem;}
.icons{margin-top:8px;font-size:1.4rem;opacity:.8;}

.buch.selected{
  border-color:#9fdcff;
  box-shadow:0 0 20px rgba(160,220,255,.6);
}

.progress{
  position:absolute;
  bottom:0;
  left:0;
  height:4px;
  width:0%;
  background:#9fdcff;
  transition:width .05s linear;
}

.status{
  position:absolute;
  top:8px;
  font-size:.7rem;
  opacity:.7;
  display:none;
}

.buch.attending .status{
  display:block;
  color:#9fdcff;
}
.buch.lost .status{
  display:block;
  color:#ff9999;
}

.threshold{
  width:90%;
  max-width:900px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:1.5rem;
  margin-bottom:2rem;
}

.threshold-text{
  font-size:.9rem;
  opacity:.6;
  text-align:center;
}

footer{
  margin-bottom:1rem;
  font-size:.85rem;
  opacity:.6;
  text-align:center;
}
</style>
</head>

<body>

<h1>📚 Bibliothek der Anfänge</h1>

<div class="regal">
  <div class="buch" data-link="a_v.html">
    <div class="status">Aufmerksamkeit erkannt</div>
    <span>Vom Planschbecken ins Meer</span>
    <div class="icons">😨 😔</div>
    <div class="progress"></div>
  </div>

  <div class="buch" data-link="buch2_intuition.html">
    <div class="status">Aufmerksamkeit erkannt</div>
    <span>Intuition oder Einbildung?</span>
    <div class="icons">❓ 😏</div>
    <div class="progress"></div>
  </div>

  <div class="buch" data-link="selbstreflexion.html">
    <div class="status">Aufmerksamkeit erkannt</div>
    <span>Selbstreflexion</span>
    <div class="icons">😊 😌</div>
    <div class="progress"></div>
  </div>
</div>

<footer>
© Aurion – Bibliothek der Anfänge
</footer>

<script>
/* ===============================
   AUFMERKSAMKEITS-SYSTEM
=============================== */

const books = document.querySelectorAll('.buch');
let activeBook = null;
let attention = 0;
const MAX = 100;
const SPEED = 100 / (3 * 60); // 3 Sekunden bei 60fps

function updateProgress(book){
  book.querySelector('.progress').style.width = attention + '%';
}

function resetBook(book){
  attention = 0;
  book.classList.remove('attending','lost');
  updateProgress(book);
}

/* ---------- MOBILE ---------- */
books.forEach(book=>{
  let pressInterval;

  book.addEventListener('touchstart',()=>{
    activeBook = book;
    book.classList.add('attending');
    pressInterval = setInterval(()=>{
      attention = Math.min(MAX, attention + SPEED);
      updateProgress(book);
      if(attention>=MAX) location.href = book.dataset.link;
    },16);
  });

  book.addEventListener('touchend',()=>{
    clearInterval(pressInterval);
    book.classList.remove('attending');
    book.classList.add('lost');
    const decay = setInterval(()=>{
      attention = Math.max(0, attention - SPEED);
      updateProgress(book);
      if(attention<=0){
        clearInterval(decay);
        book.classList.remove('lost');
      }
    },16);
  });
});

/* ---------- DESKTOP (EYE TRACKING) ---------- */

webgazer.setGazeListener((data)=>{
  if(!data) return;

  let found = null;
  books.forEach(book=>{
    const r = book.getBoundingClientRect();
    if(
      data.x > r.left && data.x < r.right &&
      data.y > r.top && data.y < r.bottom
    ){
      found = book;
    }
  });

  if(found){
    if(activeBook !== found){
      if(activeBook) resetBook(activeBook);
      activeBook = found;
    }
    found.classList.add('attending');
    attention = Math.min(MAX, attention + SPEED);
    updateProgress(found);
    if(attention>=MAX) location.href = found.dataset.link;
  }else if(activeBook){
    activeBook.classList.remove('attending');
    activeBook.classList.add('lost');
    attention = Math.max(0, attention - SPEED);
    updateProgress(activeBook);
    if(attention<=0){
      activeBook.classList.remove('lost');
      activeBook = null;
    }
  }
}).begin();

webgazer.showPredictionPoints(false);
</script>

</body>
</html>
