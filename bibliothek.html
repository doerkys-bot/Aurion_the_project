<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Bibliothek der Anfänge</title>

<style>
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at 30% 40%, #0b1223, #05070f 80%);
  font-family:system-ui,sans-serif;
  color:#eaeaea;
  overflow:hidden;
}

/* ====== BIBLIOTHEK ====== */
h1{
  text-align:center;
  margin:1.2rem 0;
  color:#8cf;
  text-shadow:0 0 10px #68bfff;
}

.regal{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1.4rem;
  padding:2rem;
  max-width:900px;
  margin:0 auto;
}

.buch{
  height:160px;
  border-radius:10px;
  background:linear-gradient(90deg,#182545,#0e162e);
  border:1px solid rgba(130,170,255,.25);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,.55);
  text-align:center;
}

.smiley-table{
  margin-top:8px;
  font-size:22px;
  display:flex;
  gap:10px;
}

/* ====== FLIEGENDES BUCH ====== */
#floatingBook{
  position:fixed;
  width:90px;
  height:120px;
  background:linear-gradient(90deg,#1b2f55,#0e162e);
  border:1px solid rgba(140,200,255,.4);
  border-radius:6px;
  box-shadow:0 0 25px rgba(120,190,255,.5);
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:6px;
  cursor:pointer;
  z-index:50;
  transition:transform .6s ease, opacity .6s ease;
}

#floatingBook.open{
  transform:scale(1.2);
}

#floatingBook.corner{
  animation: cornerDrift 6s ease-in-out infinite;
}

@keyframes cornerDrift{
  0%{ transform:translate(0,0); }
  50%{ transform:translate(4px,-4px); }
  100%{ transform:translate(0,0); }
}

#floatingBook .hint{
  font-size:.55rem;
  opacity:.7;
  margin-bottom:4px;
}

#floatingBook .title{
  font-size:.7rem;
  font-weight:bold;
}

/* ====== FOOTER ====== */
footer{
  position:absolute;
  bottom:12px;
  width:100%;
  text-align:center;
  font-size:.8rem;
  opacity:.6;
}
</style>
</head>

<body>

<h1>📚 Bibliothek der Anfänge</h1>

<div class="regal">

  <div class="buch" onclick="location.href='a_v.html'">
    Vom Planschbecken ins Meer
    <div class="smiley-table">😨 😔</div>
  </div>

  <div class="buch" onclick="location.href='buch2_intuition.html'">
    Intuition oder Einbildung?
    <div class="smiley-table">❓ 😏</div>
  </div>

  <div class="buch" onclick="location.href='selbstreflexion.html'">
    Selbstreflexion
    <div class="smiley-table">😊 😌</div>
  </div>

  <div class="buch" onclick="location.href='sternenuebung1.html'">
    Sternenübung
    <div class="smiley-table">📖 📖</div>
  </div>

  <div class="buch" onclick="location.href='aurion_bibl.html'">
    Aurion
    <div class="smiley-table">🌟 😎</div>
  </div>

  <div class="buch" onclick="location.href='a_v.html'">
    Vorhof zu Aurion
    <div class="smiley-table">📖 📖</div>
  </div>

</div>

<!-- SCHWEBENDES BUCH -->
<div id="floatingBook">
  <div class="hint">Erste Versuche wieder Felder wahrzunehmen</div>
  <div class="title">Vom Planschbecken ins Meer</div>
</div>

<footer>
© Aurion – Bibliothek der Anfänge
</footer>

<script>
let lastMove = Date.now();
let bookVisible = false;
let spawned = false;
let relaxed = false;
let holdTimer = null;

const book = document.getElementById("floatingBook");

/* Bewegung */
document.addEventListener("mousemove",()=>lastMove=Date.now());
document.addEventListener("touchstart",()=>lastMove=Date.now());

function showBook(){
  if(bookVisible || spawned) return;
  bookVisible = true;
  book.style.display="flex";
  book.style.opacity="1";
  book.style.left="60%";
  book.style.top="30%";
  book.classList.remove("corner");
}

function retreatBook(){
  if(!bookVisible) return;
  bookVisible = false;
  relaxed = true;
  book.style.left="12px";
  book.style.top="calc(100% - 150px)";
  book.style.opacity="0.45";
  book.classList.add("corner");
}

/* Fokus wird vermutet */
setInterval(()=>{
  const idle = Date.now() - lastMove;

  if(relaxed) return;

  if(idle > 3000 && !bookVisible && !spawned){
    showBook();
  }

  if(idle < 800 && bookVisible){
    retreatBook();
  }
},400);

/* Interaktion */
book.addEventListener("click",()=>{
  book.classList.add("open");
});

book.addEventListener("dblclick",()=>{
  window.open(
    "https://doerkys-bot.github.io/Aurion_the_project/Vom_Planschbecken_ins_Meer.pdf",
    "_blank"
  );
});

book.addEventListener("mousedown",()=>{
  holdTimer = setTimeout(()=>{
    book.classList.remove("open");
    retreatBook();
    spawned = true;
  },1000);
});

document.addEventListener("mouseup",()=>{
  clearTimeout(holdTimer);
});
</script>

</body>
</html>
