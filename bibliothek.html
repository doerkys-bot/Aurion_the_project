<script>
/* ===============================
   AUFMERKSAMKEITSLOGIK (FIXED)
=============================== */

const books = document.querySelectorAll('.buch');
let active = null;
let timer = null;
let countdownTimer = null;
let clicks = new Map();

const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

books.forEach(book=>{
  clicks.set(book,0);

  book.addEventListener('click', ()=>{
    clicks.set(book, clicks.get(book)+1);

    // Fallback: 5x Tippen / Klicken
    if(clicks.get(book)>=5){
      location.href = book.dataset.link;
      return;
    }

    selectBook(book);

    // 📱 MOBILE: sofort Countdown starten
    if(isTouch){
      startAttention(book);
    }
  });

  // 🖥️ DESKTOP: Aufmerksamkeit durch Verweilen
  if(!isTouch){
    book.addEventListener('mouseenter', ()=>startAttention(book));
    book.addEventListener('mouseleave', cancelAttention);
  }
});

function selectBook(book){
  cancelAttention();
  books.forEach(b=>b.classList.remove('selected','attention'));
  book.classList.add('selected');
  active = book;
}

function startAttention(book){
  if(book!==active) return;

  cancelAttention();

  let seconds = 3;
  book.classList.add('attention');
  showCountdown(book, seconds);

  timer = setTimeout(()=>{
    location.href = book.dataset.link;
  },3000);

  countdownTimer = setInterval(()=>{
    seconds--;
    showCountdown(book, seconds);
    if(seconds<=0) clearInterval(countdownTimer);
  },1000);
}

function cancelAttention(){
  clearTimeout(timer);
  clearInterval(countdownTimer);
  books.forEach(b=>{
    b.classList.remove('attention');
    const cd=b.querySelector('.countdown');
    if(cd) cd.remove();
  });
}

function showCountdown(book, sec){
  let cd = book.querySelector('.countdown');
  if(!cd){
    cd = document.createElement('div');
    cd.className = 'countdown';
    book.appendChild(cd);
  }
  cd.textContent = `Aufmerksamkeit ${sec}s`;
}

// Sicherheit bei App-Wechsel
window.addEventListener('blur', cancelAttention);
</script>
