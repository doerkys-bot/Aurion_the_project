<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Bibliothek der Anfänge</title>

<style>
body{
  margin:0;
  background:#02040a;
  font-family:system-ui,Segoe UI,Roboto,sans-serif;
  color:white;
  display:flex;
  justify-content:center;
}

.wrapper{
  width:100%;
  max-width:390px;
  padding:10px;
  box-sizing:border-box;
}

h1{
  text-align:center;
  font-size:1.2rem;
  margin:8px 0 12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.book{
  aspect-ratio:2/3;
  border-radius:10px;
  background-size:cover;
  background-position:center;
  box-shadow:0 0 10px rgba(120,200,255,.25);
}

.book.active{
  transform:scale(1.05);
  box-shadow:0 0 25px rgba(120,255,200,.9);
}

.center{
  margin:10px 0;
  padding:10px;
  border-radius:12px;
  background:rgba(255,255,255,.05);
}

#status{
  text-align:center;
  font-size:13px;
  margin-bottom:6px;
}

#videoWrap{
  width:90px;
  height:90px;
  margin:auto;
  border-radius:8px;
  overflow:hidden;
  display:none;
}

#cam{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(1.6) translateY(-10%);
}

.buttons{
  display:flex;
  gap:6px;
  margin-top:6px;
}

button{
  flex:1;
  padding:8px;
  border:none;
  border-radius:10px;
  background:#1e3a5f;
  color:white;
}

#dot{
  position:fixed;
  width:8px;
  height:8px;
  background:red;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:9999;
  opacity:0;
}
#dot.on{opacity:1;}

#calTarget{
  position:fixed;
  width:28px;
  height:28px;
  border-radius:50%;
  background:#00b7ff;
  display:none;
  transform:translate(-50%,-50%);
  z-index:10000;
}

#onboarding{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:20000;
}

#onboarding.show{display:flex;}

#onboardingBox{
  background:#102033;
  padding:18px;
  border-radius:14px;
  width:90%;
  max-width:360px;
  text-align:center;
}
</style>
</head>

<body>

<div id="onboarding">
  <div id="onboardingBox">
    Willkommen in der Bibliothek der Anfänge.<br><br>
    Starte Kamera → Tracking → Kalibrieren.<br>
    Dann ansehen + doppelt blinzeln.<br><br>
    Alles bleibt lokal im Browser.
    <br><br>
    <button id="startBtn">OK</button>
  </div>
</div>

<div class="wrapper">

<h1>📚 Bibliothek der Anfänge</h1>

<div class="grid">
<div class="book" data-id="band1" style="background-image:url('band1.png')"></div>
<div class="book" data-id="band2" style="background-image:url('band2.png')"></div>
<div class="book" data-id="band3" style="background-image:url('band3.png')"></div>
</div>

<div class="center">
<div id="status">bereit</div>

<div id="videoWrap">
<video id="cam" autoplay muted playsinline></video>
</div>

<div class="buttons">
<button id="btnCam">Cam</button>
<button id="btnTrack">Track</button>
<button id="btnCal">Kal</button>
</div>
</div>

<div class="grid">
<div class="book" data-id="band4" style="background-image:url('band4.png')"></div>
<div class="book" data-id="band5" style="background-image:url('band5.png')"></div>
<div class="book" data-id="band6" style="background-image:url('band6.png')"></div>
</div>

</div>

<div id="dot"></div>
<div id="calTarget"></div>

<script>
const cam=document.getElementById("cam");
const videoWrap=document.getElementById("videoWrap");
const dot=document.getElementById("dot");
const books=[...document.querySelectorAll(".book")];
const calTarget=document.getElementById("calTarget");

let running=false,tracking=false,faceLandmarker=null;
let tx=innerWidth/2,ty=innerHeight/2;
let dx=tx,dy=ty;

// DOT SPEED 0.18
function loopDot(){
 dx += (tx-dx)*0.18;
 dy += (ty-dy)*0.18;
 dot.style.left=dx+"px";
 dot.style.top=dy+"px";
 requestAnimationFrame(loopDot);
}
loopDot();

function openBook(id){
 const links={
  band1:"v_p_i_m.pdf",
  band2:"Insel_Gailingen_Dirk_Schaefer_cover_final.pdf",
  band3:"buch2_intuition.html",
  band4:"selbstreflexion.html",
  band5:"sternenuebung.html",
  band6:"a_v.html"
 };
 location.href=links[id];
}

// CAM
document.getElementById("btnCam").onclick=async()=>{
 if(running){
  cam.srcObject.getTracks().forEach(t=>t.stop());
  running=false;
  videoWrap.style.display="none";
  dot.classList.remove("on");
  return;
 }
 const s=await navigator.mediaDevices.getUserMedia({video:true});
 cam.srcObject=s;
 videoWrap.style.display="block";
 running=true;
};

// TRACK
document.getElementById("btnTrack").onclick=async()=>{
 if(!running)return;

 const vision=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest");
 const fs=await vision.FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
 );

 faceLandmarker=await vision.FaceLandmarker.createFromOptions(fs,{
  baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"},
  runningMode:"VIDEO",
  numFaces:1,
  outputFaceBlendshapes:true
 });

 tracking=true;
 dot.classList.add("on");

 let blinkCount=0,lastBlink=0;

 function loop(){
  if(!tracking)return;

  const res=faceLandmarker.detectForVideo(cam,performance.now());

  if(res.faceLandmarks.length){
    const p=res.faceLandmarks[0][468];
    const x=innerWidth*(1-p.x);
    const y=innerHeight*(p.y);

    tx=x;ty=y;

    let hover=null;

    books.forEach(b=>{
      const r=b.getBoundingClientRect();
      if(x>r.left&&x<r.right&&y>r.top&&y<r.bottom){
        hover=b;
      }
    });

    books.forEach(b=>b.classList.remove("active"));
    if(hover)hover.classList.add("active");

    const b=res.faceBlendshapes[0].categories;
    const blink=Math.max(
      b.find(c=>c.categoryName==="eyeBlinkLeft").score,
      b.find(c=>c.categoryName==="eyeBlinkRight").score
    );

    const now=Date.now();

    if(blink>0.6 && now-lastBlink>300){
      blinkCount++;
      lastBlink=now;

      if(blinkCount===2 && hover){
        openBook(hover.dataset.id);
        blinkCount=0;
      }

      setTimeout(()=>blinkCount=0,600);
    }
  }

  requestAnimationFrame(loop);
 }
 loop();
};

// CALIBRATION (visuell, stabil)
document.getElementById("btnCal").onclick=async()=>{
 if(!tracking)return;

 const points=[
  [50,100],
  [innerWidth-50,100],
  [innerWidth-50,innerHeight-100],
  [50,innerHeight-100],
  [innerWidth/2,innerHeight/2]
 ];

 calTarget.style.display="block";

 for(const [x,y] of points){
  calTarget.style.left=x+"px";
  calTarget.style.top=y+"px";
  await new Promise(r=>setTimeout(r,1000));
 }

 calTarget.style.display="none";
};

// onboarding
if(!localStorage.getItem("onb")){
 document.getElementById("onboarding").classList.add("show");
 document.getElementById("startBtn").onclick=()=>{
  document.getElementById("onboarding").classList.remove("show");
  localStorage.setItem("onb","1");
 };
}
</script>

</body>
</html>
