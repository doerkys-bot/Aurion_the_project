<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bibliothek der Anfänge</title>

<style>
body{
  margin:0;
  background:#0b1223;
  color:#eaeaea;
  font-family:Georgia, serif;
  text-align:center;
}

*{ box-sizing:border-box; }

h1{
  margin:20px 0 10px;
  color:#cfeeff;
  letter-spacing:0.10em;
  text-shadow:0 0 12px rgba(120,200,255,.18);
}

#controls{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

button{
  margin:0;
  padding:10px 14px;
  border-radius:10px;
  border:1px solid rgba(140,230,255,.28);
  background:rgba(20,40,80,.45);
  color:#cfeeff;
  font-weight:800;
}

button[disabled]{ opacity:.5; }

#status{
  min-height:22px;
  color:#d8f4ff;
  margin-bottom:12px;
}

#shelfGrid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  grid-template-rows:repeat(2, auto);
  gap:24px;
  max-width:820px;
  margin:24px auto 40px;
  padding:0 14px;
}

.book{
  display:block;
  position:relative;
  border-radius:12px;
  overflow:hidden;
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  border:1px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.02);
  text-decoration:none;
  color:inherit;
}

.book img{
  width:100%;
  display:block;
  aspect-ratio:0.72 / 1;
  object-fit:cover;
  background:#111;
}

.book.active{
  transform:scale(1.04);
  box-shadow:0 0 20px rgba(140,255,200,.40);
  border-color:rgba(140,255,200,.38);
}

.book.confirmFlash{
  box-shadow:0 0 40px rgba(255,255,255,.75);
}

.bookCountdown{
  position:absolute;
  left:8px;
  bottom:8px;
  min-width:28px;
  padding:3px 7px;
  border-radius:8px;
  background:rgba(0,0,0,.78);
  color:#8dffb8;
  border:1px solid rgba(120,255,180,.25);
  box-shadow:0 0 10px rgba(100,255,180,.18);
  font-size:14px;
  font-weight:700;
  line-height:1.1;
  display:none;
  pointer-events:none;
}

#gazeDot{
  position:fixed;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#ff3b3b;
  box-shadow:0 0 10px red;
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:9999;
  opacity:0;
  transition:transform .12s ease, opacity .15s ease;
}
#gazeDot.on{ opacity:1; }
#gazeDot.pulse{ transform:translate(-50%,-50%) scale(2.1); }

#videoWrap{
  position:fixed;
  top:10px;
  left:10px;
  width:86px;
  height:96px;
  display:none;
  overflow:hidden;
  border-radius:10px;
  background:#000;
  z-index:1000;
  border:1px solid rgba(140,230,255,.22);
  box-shadow:0 0 18px rgba(120,200,255,.25);
}
#cam{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(1.8) translateY(-18%);
}

#calOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.60);
  display:none;
  z-index:20000;
}
#calTarget{
  position:fixed;
  width:32px;
  height:32px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  display:none;
  z-index:20001;
  pointer-events:none;
  border:2px solid rgba(180,255,220,.95);
  box-shadow:0 0 14px rgba(140,255,220,.9), inset 0 0 10px rgba(140,255,220,.45);
  background:rgba(140,255,220,.12);
}
#calTarget.capture{
  border-color:#ffd86b;
  box-shadow:0 0 18px rgba(255,216,107,.95), inset 0 0 12px rgba(255,216,107,.45);
  background:rgba(255,216,107,.18);
}
</style>
</head>
<body>

<h1>Bibliothek der Anfänge</h1>

<div id="controls">
  <button id="btnCam">Cam</button>
  <button id="btnTrack" disabled>Track</button>
  <button id="btnCal" disabled>Kalibrieren</button>
</div>

<div id="status">Seite bereit.</div>

<div id="videoWrap"><video id="cam" autoplay muted playsinline></video></div>
<div id="gazeDot"></div>
<div id="calOverlay"></div>
<div id="calTarget"></div>

<div id="shelfGrid">
  <a class="book" href="https://doerkys-bot.github.io/Aurion_the_project/v_p_i_m.pdf">
    <img src="https://doerkys-bot.github.io/Aurion_the_project/band1.png" alt="Band 1">
    <div class="bookCountdown">3</div>
  </a>

  <a class="book" href="https://doerkys-bot.github.io/Aurion_the_project/Insel_Gailingen_Dirk_Schaefer_cover_final.pdf">
    <img src="https://doerkys-bot.github.io/Aurion_the_project/band2.png" alt="Band 2">
    <div class="bookCountdown">3</div>
  </a>

  <a class="book" href="https://doerkys-bot.github.io/Aurion_the_project/intuition_oder_einbildung.pdf">
    <img src="https://doerkys-bot.github.io/Aurion_the_project/band3.png" alt="Band 3">
    <div class="bookCountdown">3</div>
  </a>

  <a class="book" href="https://doerkys-bot.github.io/Aurion_the_project/selbstreflexion.html">
    <img src="https://doerkys-bot.github.io/Aurion_the_project/band4.png" alt="Band 4">
    <div class="bookCountdown">3</div>
  </a>

  <a class="book" href="https://doerkys-bot.github.io/Aurion_the_project/sternenuebung1.html">
    <img src="https://doerkys-bot.github.io/Aurion_the_project/band5.png" alt="Band 5">
    <div class="bookCountdown">3</div>
  </a>

  <a class="book" href="https://doerkys-bot.github.io/Aurion_the_project/a_v.html">
    <img src="https://doerkys-bot.github.io/Aurion_the_project/band6.png" alt="Band 6">
    <div class="bookCountdown">3</div>
  </a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const books = [...document.querySelectorAll(".book")];
const dot = document.getElementById("gazeDot");
const cam = document.getElementById("cam");
const videoWrap = document.getElementById("videoWrap");
const btnCam = document.getElementById("btnCam");
const btnTrack = document.getElementById("btnTrack");
const btnCal = document.getElementById("btnCal");
const statusEl = document.getElementById("status");
const calOverlay = document.getElementById("calOverlay");
const calTarget = document.getElementById("calTarget");

const PROFILE_NAME_KEY = "aurion_profile_name";
let profileName = localStorage.getItem(PROFILE_NAME_KEY);

if(!profileName){
  profileName = prompt("Profilname für vorhandene Kalibrierung eingeben:", "default") || "default";
  profileName = profileName.trim() || "default";
  localStorage.setItem(PROFILE_NAME_KEY, profileName);
}

const CAL_KEYS_TO_TRY = [
  "aurion_calibration_v3_" + profileName,
  "aurion_bibliothek_calibration_v1_" + profileName,
  "aurionALSCalibration",
  "aurion_bibliothek_calibration_v1"
];

const DOT_SMOOTH_FAR = 0.085;
const DOT_SMOOTH_NEAR = 0.040;
const DOT_SMOOTH_INSIDE = 0.018;

const MAGNET_RADIUS = 170;
const MAGNET_STRENGTH = 0.24;

const COUNTDOWN_TIME = 3000;
const LINK_STABLE_MS = 450;

let calibration = loadCalibrationFromAnyKey();

let faceMesh = null;
let camera = null;
let stream = null;
let tracking = false;

let tx = 40;
let ty = innerHeight - 40; // 🔥 unten
let dx = tx;
let dy = ty;

let active = null;
let nearest = null;
let nearestDist = Infinity;
let activeSince = 0;
let lastActive = null;

let countdownBook = null;
let countdownStart = 0;

let latestIrisRaw = { x:null, y:null };

let blinkArmed = true;
let pendingBlink = false;
let firstBlinkTs = 0;
let secondReadyByDrop = false;
let lastBlinkTs = 0;

function setStatus(msg){
  statusEl.textContent = msg;
}

function loadCalibrationFromAnyKey(){
  for(const key of CAL_KEYS_TO_TRY){
    try{
      const raw = localStorage.getItem(key);
      if(!raw) continue;
      const parsed = JSON.parse(raw);

      if(parsed?.gaze){
        const g = parsed.gaze;
        if(Number.isFinite(g.minX) && Number.isFinite(g.maxX) && Number.isFinite(g.minY) && Number.isFinite(g.maxY)){
          return { xMin:g.minX, xMax:g.maxX, yMin:g.minY, yMax:g.maxY, keyLoaded:key };
        }
      }

      if(
        Number.isFinite(parsed?.xMin) &&
        Number.isFinite(parsed?.xMax) &&
        Number.isFinite(parsed?.yMin) &&
        Number.isFinite(parsed?.yMax)
      ){
        return { xMin:parsed.xMin, xMax:parsed.xMax, yMin:parsed.yMin, yMax:parsed.yMax, keyLoaded:key };
      }
    }catch(e){}
  }

  return { xMin:null, xMax:null, yMin:null, yMax:null, keyLoaded:null };
}

function hasCalibration(){
  return Number.isFinite(calibration.xMin) &&
         Number.isFinite(calibration.xMax) &&
         Number.isFinite(calibration.yMin) &&
         Number.isFinite(calibration.yMax);
}

function saveCalibration(data){
  calibration = {
    xMin:data.xMin,
    xMax:data.xMax,
    yMin:data.yMin,
    yMax:data.yMax,
    keyLoaded:"aurion_bibliothek_calibration_v1_" + profileName
  };
  localStorage.setItem(
    "aurion_bibliothek_calibration_v1_" + profileName,
    JSON.stringify(calibration)
  );
}

function resetBlinkState(){
  blinkArmed = true;
  pendingBlink = false;
  firstBlinkTs = 0;
  secondReadyByDrop = false;
  lastBlinkTs = 0;
}

function pulseDot(){
  dot.classList.remove("pulse");
  void dot.offsetWidth;
  dot.classList.add("pulse");
  setTimeout(() => dot.classList.remove("pulse"), 150);
}

function clearCountdown(){
  if(countdownBook){
    const box = countdownBook.querySelector(".bookCountdown");
    if(box) box.style.display = "none";
  }
  countdownBook = null;
  countdownStart = 0;
}

function updateCountdown(book){
  if(!book){
    clearCountdown();
    return;
  }

  if(countdownBook !== book){
    clearCountdown();
    countdownBook = book;
    countdownStart = performance.now();
  }

  const box = countdownBook.querySelector(".bookCountdown");
  if(!box) return;

  const remain = Math.max(0, COUNTDOWN_TIME - (performance.now() - countdownStart));
  box.style.display = "block";
  box.textContent = String(Math.ceil(remain / 1000));

  if(remain <= 0){
    openActiveBook();
    clearCountdown();
  }
}

function resolveMagnet(){
  active = null;
  nearest = null;
  nearestDist = Infinity;

  let mx = tx;
  let my = ty;

  books.forEach(book => {
    book.classList.remove("active");
    const r = book.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;

    const d = Math.hypot(dx - cx, dy - cy);
    if(d < nearestDist){
      nearestDist = d;
      nearest = book;
    }

    const inside = dx > r.left && dx < r.right && dy > r.top && dy < r.bottom;
    if(inside) active = book;
  });

  if(active !== lastActive){
    lastActive = active;
    activeSince = active ? performance.now() : 0;
  }

  if(nearest && nearestDist < MAGNET_RADIUS){
    const r = nearest.getBoundingClientRect();
    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const alpha = 1 - (nearestDist / MAGNET_RADIUS);
    mx = tx + (cx - tx) * alpha * MAGNET_STRENGTH;
    my = ty + (cy - ty) * alpha * MAGNET_STRENGTH;
  }

  if(active && tracking){
  active.classList.add("active");
  updateCountdown(active);
}else{
  clearCountdown();
}

  return { x: mx, y: my };
}

function openActiveBook(){
  if(!active) return;

  pulseDot();
  active.classList.add("confirmFlash");
  setTimeout(() => active.classList.remove("confirmFlash"), 260);
  resetBlinkState();
  active.click();
}

function applyCalibrationToIris(rawX, rawY){
  let x = rawX;
  let y = rawY;

  if(hasCalibration() && calibration.xMax > calibration.xMin){
    x = (rawX - calibration.xMin) / (calibration.xMax - calibration.xMin);
  }
  if(hasCalibration() && calibration.yMax > calibration.yMin){
    y = (rawY - calibration.yMin) / (calibration.yMax - calibration.yMin);
  }

  x = Math.max(0, Math.min(1, x));
  y = Math.max(0, Math.min(1, y));

  tx = innerWidth * (1 - x);
  ty = innerHeight * y;
}

function irisCenterFromLandmarks(lm){
  const L = [lm?.[468], lm?.[469], lm?.[470], lm?.[471]].filter(Boolean);
  const R = [lm?.[473], lm?.[474], lm?.[475], lm?.[476]].filter(Boolean);

  const avgPts = arr => {
    let x = 0, y = 0;
    for(const p of arr){ x += p.x; y += p.y; }
    return { x:x/arr.length, y:y/arr.length };
  };

  if(L.length >= 2 && R.length >= 2){
    const lc = avgPts(L);
    const rc = avgPts(R);
    return { x:(lc.x + rc.x)/2, y:(lc.y + rc.y)/2 };
  }
  if(L.length >= 2) return avgPts(L);
  if(R.length >= 2) return avgPts(R);
  if(lm?.[468]) return { x:lm[468].x, y:lm[468].y };
  return null;
}

function dist(a,b){
  return Math.hypot(a.x-b.x, a.y-b.y);
}

function eyeAspectRatio(top1, top2, bottom1, bottom2, left, right){
  const v1 = dist(top1, bottom1);
  const v2 = dist(top2, bottom2);
  const h = dist(left, right) + 1e-6;
  return (v1 + v2) / (2 * h);
}

function detectBlinkFromLandmarks(lm){
  const leftEAR = eyeAspectRatio(lm[159], lm[160], lm[145], lm[144], lm[33], lm[133]);
  const rightEAR = eyeAspectRatio(lm[386], lm[385], lm[374], lm[380], lm[362], lm[263]);
  const ear = (leftEAR + rightEAR) / 2;
  return 1 - Math.max(0, Math.min(1, ear / 0.35));
}

function processBlink(blink){
  const now = performance.now();

  const BLINK_ON = 0.34;
  const BLINK_OFF = 0.15;
  const SECOND_ON = 0.27;
  const DOUBLE_WINDOW = 1700;
  const SECOND_MIN_GAP = 90;
  const COOLDOWN = 180;

  if(blink < BLINK_OFF){
    blinkArmed = true;
    if(pendingBlink) secondReadyByDrop = true;
  }

  if(pendingBlink && now > firstBlinkTs + DOUBLE_WINDOW){
    pendingBlink = false;
    secondReadyByDrop = false;
    firstBlinkTs = 0;
  }

  if(!pendingBlink){
    if(
      blinkArmed &&
      blink > BLINK_ON &&
      (now - lastBlinkTs) > COOLDOWN
    ){
      blinkArmed = false;
      pendingBlink = true;
      firstBlinkTs = now;
      secondReadyByDrop = false;
      lastBlinkTs = now;
    }
    return;
  }

  const gapOk = (now - firstBlinkTs) >= SECOND_MIN_GAP;
  const readyOk = secondReadyByDrop || gapOk;
  const stableEnough =
    active &&
    activeSince &&
    (now - activeSince) >= LINK_STABLE_MS;

  if(
    readyOk &&
    blink > SECOND_ON &&
    (now - lastBlinkTs) > COOLDOWN
  ){
    if(stableEnough){
      setStatus("Doppelblink erkannt.");
      clearCountdown();
      openActiveBook();
    }
    resetBlinkState();
    lastBlinkTs = now;
  }
}

async function initFaceMesh(){
  if(faceMesh) return;

  faceMesh = new FaceMesh({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
  });

  faceMesh.setOptions({
    maxNumFaces:1,
    refineLandmarks:true,
    minDetectionConfidence:0.5,
    minTrackingConfidence:0.5
  });

  faceMesh.onResults(results => {
    const faces = results?.multiFaceLandmarks || [];
    if(!faces.length){
      resetBlinkState();
      clearCountdown();
      return;
    }

    const lm = faces[0];
    const iris = irisCenterFromLandmarks(lm);
    if(!iris) return;

    latestIrisRaw.x = iris.x;
    latestIrisRaw.y = iris.y;

    applyCalibrationToIris(iris.x, iris.y);

    const blink = detectBlinkFromLandmarks(lm);
    processBlink(blink);
  });
}

async function startCamera(){
  stream = await navigator.mediaDevices.getUserMedia({ video:true });
  cam.srcObject = stream;
  await cam.play();
  videoWrap.style.display = "block";
  dot.classList.add("on");
  btnTrack.disabled = false;
  btnCal.disabled = false;
  setStatus(hasCalibration() ? "Kamera an. Kalibrierung geladen." : "Kamera an. Bitte kalibrieren.");
}

function stopCamera(){
  tracking = false;
  resetBlinkState();
  clearCountdown();

  try{
    if(camera && typeof camera.stop === "function") camera.stop();
  }catch(e){}

  if(stream){
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  cam.pause();
  cam.srcObject = null;
  videoWrap.style.display = "none";
  dot.classList.remove("on");
  btnTrack.disabled = true;
  btnCal.disabled = true;
  btnTrack.textContent = "Track";
  setStatus("Kamera aus.");
}

async function startTracking(){
  await initFaceMesh();

  if(!camera){
    camera = new Camera(cam, {
      onFrame: async () => {
        if(tracking && faceMesh){
          await faceMesh.send({ image: cam });
        }
      }
    });
  }

  resetBlinkState();
  tracking = true;
  await camera.start();
  btnTrack.textContent = "Tracking an";
  setStatus("Tracking gestartet.");
}

async function waitAndSample(label, durationMs = 700){
  setStatus("Kalibrierung: " + label);
  await new Promise(r => setTimeout(r, durationMs));
  if(latestIrisRaw.x == null || latestIrisRaw.y == null){
    throw new Error("Noch keine Irisdaten");
  }
  return { x:latestIrisRaw.x, y:latestIrisRaw.y };
}

async function startCalibration(){
  if(!stream){
    setStatus("Erst Cam starten.");
    return;
  }
  if(!tracking){
    setStatus("Erst Tracking starten.");
    return;
  }

  calOverlay.style.display = "block";
  calTarget.style.display = "block";

  const samples = {};
  const points = [
    {x: innerWidth * 0.18, y: innerHeight * 0.50, label:"links", key:"left"},
    {x: innerWidth * 0.82, y: innerHeight * 0.50, label:"rechts", key:"right"},
    {x: innerWidth * 0.50, y: innerHeight * 0.20, label:"oben", key:"up"},
    {x: innerWidth * 0.50, y: innerHeight * 0.80, label:"unten", key:"down"},
    {x: innerWidth * 0.50, y: innerHeight * 0.50, label:"Mitte", key:"center"}
  ];

  for(const p of points){
    calTarget.style.left = p.x + "px";
    calTarget.style.top = p.y + "px";
    calTarget.classList.remove("capture");
    await new Promise(r => setTimeout(r, 250));
    calTarget.classList.add("capture");
    samples[p.key] = await waitAndSample(p.label, 800);
    calTarget.classList.remove("capture");
    await new Promise(r => setTimeout(r, 250));
  }

  saveCalibration({
    xMin: samples.right.x,
    xMax: samples.left.x,
    yMin: samples.up.y,
    yMax: samples.down.y
  });

  calTarget.style.display = "none";
  calOverlay.style.display = "none";
  setStatus("Kalibrierung gespeichert unter " + profileName + ".");
}

btnCam.onclick = async () => {
  try{
    if(stream){
      stopCamera();
    }else{
      await startCamera();
    }
  }catch(e){
    console.error(e);
    setStatus("Kamera Fehler: " + (e.message || e));
  }
};

btnTrack.onclick = async () => {
  try{
    if(!stream){
      setStatus("Erst Cam starten.");
      return;
    }

    if(tracking){
      tracking = false;
      resetBlinkState();
      clearCountdown();
      if(camera && typeof camera.stop === "function") camera.stop();
      btnTrack.textContent = "Track";
      setStatus("Tracking gestoppt.");
      return;
    }

    await startTracking();
  }catch(e){
    console.error(e);
    setStatus("Tracking Fehler: " + (e.message || e));
  }
};

btnCal.onclick = async () => {
  try{
    await startCalibration();
  }catch(e){
    console.error(e);
    calTarget.style.display = "none";
    calOverlay.style.display = "none";
    setStatus("Kalibrierung Fehler: " + (e.message || e));
  }
};

function loop(){
  const target = resolveMagnet();

  let smooth = DOT_SMOOTH_FAR;
  if(nearest && nearestDist < MAGNET_RADIUS) smooth = DOT_SMOOTH_NEAR;
  if(active) smooth = DOT_SMOOTH_INSIDE;

  dx += (target.x - dx) * smooth;
  dy += (target.y - dy) * smooth;

  dot.style.left = dx + "px";
  dot.style.top = dy + "px";

  requestAnimationFrame(loop);
}

window.addEventListener("load", () => {
  loop();
  if(hasCalibration()){
    setStatus("Seite bereit. Kalibrierung aus " + calibration.keyLoaded + " geladen.");
  }else{
    setStatus("Seite bereit. Keine Kalibrierung gefunden.");
  }
});

window.addEventListener("resize", () => {
  if(countdownBook) updateCountdown(countdownBook);
});
</script>

</body>
</html>
