<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurion Portal</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at center, #00111a, #000000 80%);
    font-family: Arial, sans-serif;
    color: #e8faff;
}

/* ================= HEADER ================= */
header {
    text-align: center;
    padding: 40px 0 10px;
    font-size: 36px;
    color: #00dfff;
    letter-spacing: 3px;
}

/* ================= GRID ================= */
.portal-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 35px;
    padding: 60px;
    max-width: 1100px;
    margin: 0 auto;
}

/* ================= BOXEN ================= */
.room-box {
    position: relative;
    background: rgba(0,120,200,0.12);
    padding: 25px;
    border: 1px solid rgba(0,200,255,0.35);
    border-radius: 14px;
    text-align: center;
    font-size: 22px;
    color: #aeeeff;
    cursor: pointer;
    overflow: hidden;

    transform-origin: center;
    animation: breath446 14s ease-in-out infinite;
    animation-delay: var(--phase, 0s);

    transition:
        background 1.2s ease,
        box-shadow 1.2s ease;
}

/* ================= SICHTBARE 4–4–6 ATMUNG ================= */
@keyframes breath446 {
    0% {
        transform: scale(1);
        box-shadow: 0 0 10px rgba(0,200,255,0.15);
    }
    28.6% { /* ein */
        transform: scale(1.09);
        box-shadow: 0 0 28px rgba(0,200,255,0.35);
    }
    57.1% { /* halten */
        transform: scale(1.09);
        box-shadow: 0 0 28px rgba(0,200,255,0.35);
    }
    100% { /* aus */
        transform: scale(0.96);
        box-shadow: 0 0 6px rgba(0,200,255,0.12);
    }
}

/* ================= AURA ================= */
.room-box::after {
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(circle at center,
        rgba(0,200,255,0.6),
        rgba(0,0,0,0) 70%);
    opacity: var(--intensity, 0);
    transition: opacity 1.5s ease;
    pointer-events:none;
}

/* ================= TEXT ================= */
#manir {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    max-width: 900px;
    margin: 20px auto 60px;
    font-size: 16px;
    opacity: 0.9;
}
#manir div { line-height: 1.6; }
</style>
</head>

<body>

<header>AURION PORTAL</header>

<div class="portal-grid">
    <div class="room-box" id="resonanz" onclick="location.href='resonanzraum.html'">Resonanzraum</div>
    <div class="room-box" id="bibliothek" onclick="location.href='bibliothek.html'">Bibliothek</div>
    <div class="room-box" id="stern" onclick="location.href='sternenuebung.html'">Chi-Sternübung</div>
    <div class="room-box" id="ki" onclick="location.href='ki-raum.html'">KI-Raum</div>
    <div class="room-box" id="meditation" onclick="location.href='meditationsraum.html'">Meditationsraum</div>
    <div class="room-box" id="about" onclick="location.href='about_aurion.html'">About Aurion</div>
</div>

<div id="manir">
    <div>
        Wer nur hindurch will, merkt nichts.<br>
        Wer bleiben will, bleibt nicht wegen Erlaubnis –
    </div>
    <div>
        sondern weil etwas antwortet.
    </div>
</div>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCSdwVrB79RRvOOd2YMG0108f7tvIaTc7g",
  authDomain: "Auron-tracker.firebaseapp.com",
  databaseURL: "https://auron-tracker-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "Auron-tracker"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ================= ASYNCHRONE BASIS ================= */
document.querySelectorAll(".room-box").forEach(box => {
    box.style.setProperty("--phase", `-${Math.random()*14}s`);
});

/* ================= PRÄSENZ ================= */
const liveRef = ref(db, "rooms");

onValue(liveRef, snap => {
    const rooms = snap.val() || {};
    const activeRooms = [];

    Object.keys(rooms).forEach(room => {
        const count = rooms[room]?.sessions
            ? Object.keys(rooms[room].sessions).length
            : 0;

        const box = document.getElementById(room);
        if(!box) return;

        if(count > 0){
            const intensity = Math.min(count / 8, 1);
            box.style.setProperty("--intensity", intensity);

            box.style.background =
                `rgba(0, ${140 + intensity*100}, 255, ${0.18 + intensity*0.5})`;

            activeRooms.push(box);
        } else {
            box.style.setProperty("--intensity", 0);
        }
    });

    /* ================= SYNCHRONITÄT ================= */
    if(activeRooms.length > 0){
        activeRooms.forEach(box => {
            box.style.animationDelay = "0s";
            box.style.animationDuration = "14s";
        });
    }
});
</script>

</body>
</html>
