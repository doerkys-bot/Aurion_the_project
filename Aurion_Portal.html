<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurion Portal</title>

<style>
    body {
        margin: 0;
        background: #000;
        font-family: Arial, sans-serif;
        color: #fff;
        overflow-x: hidden;
    }

    /* ===== Header ===== */
    header {
        text-align: center;
        padding: 40px 0 10px;
        font-size: 32px;
        font-weight: bold;
        color: #00c8ff;
        letter-spacing: 2px;
    }

    /* ===== Laufschrift ===== */
    .ticker-wrapper {
        width: 100%;
        overflow: hidden;
        position: relative;
        height: 30px;
        margin-top: 10px;
    }

    .ticker {
        position: absolute;
        font-size: 18px;
        white-space: nowrap;
        animation: moveTicker 14s linear infinite;
        left: 0;
        top: 0;
    }

    @keyframes moveTicker {
        0% { transform: translateX(100%); }
        100% { transform: translateX(0%); }
    }

    /* ===== Links ===== */
    .link-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        padding: 60px;
        margin-top: 20px;
    }

    .portal-link {
        background: rgba(255,255,255,0.05);
        padding: 25px;
        border: 1px solid #00c8ff;
        border-radius: 10px;
        text-align: center;
        font-size: 20px;
        text-decoration: none;
        color: #00eaff;
        transition: background 0.4s, transform 0.3s ease, filter 0.6s;
        animation: subtleFloat 5s ease-in-out infinite;
        filter: brightness(1);
    }

    /* Box wird heller bei Hover */
    .portal-link:hover {
        background: rgba(0,200,255,0.25);
        transform: scale(1.1);
        filter: brightness(1.4);
    }

    @keyframes subtleFloat {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
        100% { transform: translateY(0px); }
    }

    /* ===== Besucherzähler ===== */
    #visitor-count {
        position: fixed;
        left: 15px;
        bottom: 15px;
        font-size: 15px;
        opacity: 0.85;
        background: rgba(255,255,255,0.07);
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid rgba(0,200,255,0.3);
        backdrop-filter: blur(4px);
    }
</style>
</head>

<body>

<header>AURION PORTAL</header>

<!-- ===== Laufschrift ===== -->
<div class="ticker-wrapper">
    <div class="ticker">about-aurion – Zukunft beginnt hier. Nur bis zur Mitte sichtbar.</div>
</div>

<!-- ===== Links ===== -->
<div class="link-grid">
    <a class="portal-link" href="resonanzraum.html">Resonanzraum</a>
    <a class="portal-link" href="bibliothek.html">Wissen, alte Energie-Schriften</a>
    <a class="portal-link" href="sternenuebung1.html">Chi-Sternenübung</a>
    <a class="portal-link" href="ki-raum.html">neues Wissen, Durchbrüche, Forscher</a>
    <a class="portal-link" href="meditationsraum.html">Ruhe für Körper, Geist, Seele</a>
    <a class="portal-link" href="about_aurion.html">geht Hand in Hand mit der 2. Aufmerksamkeit</a>
</div>

<!-- ===== Besucherzähler ===== -->
<div id="visitor-count">Besucher werden gezählt...</div>

<script>
/* --- Besucherzähler (lokal) --- */
let count = localStorage.getItem("aurion_visitors");

if (!count) {
    count = 1;
    localStorage.setItem("aurion_visitors", count);
} else {
    count = parseInt(count) + 1;
    localStorage.setItem("aurion_visitors", count);
}

document.getElementById("visitor-count").innerText =
    "Besucher insgesamt (dieses Gerät): " + count;

/* ====== BOX WIRD LANGSAM HELLER, WENN MAN SIE LANGE BERÜHRT ====== */
document.querySelectorAll(".portal-link").forEach(el => {
    let brightness = 1;
    let interval;

    el.addEventListener("mouseover", () => {
        interval = setInterval(() => {
            brightness += 0.015;
            if (brightness > 1.6) brightness = 1.6;
            el.style.filter = `brightness(${brightness})`;
        }, 40);
    });

    el.addEventListener("mouseout", () => {
        clearInterval(interval);
        const fade = setInterval(() => {
            brightness -= 0.03;
            if (brightness <= 1) {
                brightness = 1;
                clearInterval(fade);
            }
            el.style.filter = `brightness(${brightness})`;
        }, 40);
    });
});
</script>

</body>
</html>ml
