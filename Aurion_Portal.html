<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
html,body{
    margin:0;padding:0;overflow:hidden;
    background:#02040a;
    color:white;
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
    height:100%;width:100%;
}

/* Ebenen */
#starCanvas{ position:fixed; inset:0; z-index:0; }
#gasCanvas{ position:fixed; inset:0; z-index:1; }
#plasmaCanvas{ position:fixed; inset:0; z-index:2; }
#holoNamaste{ position:fixed; z-index:4; left:50%; top:20%; transform:translateX(-50%); }

/* Schwebende Links */
.link{
    position:absolute;
    z-index:5;
    padding:10px 14px;
    border-radius:14px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(6px);
    color:#7ecbff;
    font-weight:700;
    cursor:pointer;
    user-select:none;
    transition:transform .15s ease, box-shadow .4s ease;
}

/* Hologramm */
#holoNamaste{
    font-size:42px;
    font-weight:800;
    letter-spacing:4px;
    color:rgba(180,220,255,0.8);
    text-shadow:
        0 0 12px rgba(120,180,255,0.7),
        0 0 22px rgba(120,180,255,0.5),
        0 0 38px rgba(120,180,255,0.3);
    animation: holoPulse 4.5s ease-in-out infinite;
    pointer-events:none;
}

@keyframes holoPulse{
    0%{opacity:.8}
    50%{opacity:1}
    100%{opacity:.8}
}

/* Counter Box */
#githubCounterBox{
    position:fixed;
    left:16px;
    bottom:16px;
    z-index:50;
    padding:8px 12px;
    border-radius:10px;
    background:rgba(255,255,255,0.04);
    backdrop-filter:blur(6px);
    color:#7ecbff;
    font-weight:700;
    letter-spacing:1px;
    text-shadow:0 0 8px rgba(40,152,255,.25);
}
#githubCounterBox small{
    display:block;
    font-size:11px;
    opacity:.7;
}
</style>
</head>

<body>

<canvas id="starCanvas"></canvas>
<canvas id="gasCanvas"></canvas>
<canvas id="plasmaCanvas"></canvas>

<div id="holoNamaste">NAMASTÉ</div>

<a class="link" href="bibliothek.html">Bibliothek</a>
<a class="link" href="resonanzraum.html">Resonanzraum</a>
<a class="link" href="sternenuebung.html">Chi-Sternenübung</a>
<a class="link" href="meditationsraum.html">Meditationsraum</a>
<a class="link" href="ki-raum.html">KI-Raum</a>
<a class="link" href="gaestebuch.html">Gästebuch</a>
<a class="link" href="about_aurion.html">About</a>

<!-- GLOBAL COUNTER -->
<div id="githubCounterBox">
  <span id="counterValue">—</span>
  <small>global</small>
</div>

<script>
/* =============================
   GLOBAL GITHUB COUNTER (READ)
   ============================= */

const COUNTER_URL =
"https://raw.githubusercontent.com/doerkys-bot/Aurion_the_project/main/counter.json";

fetch(COUNTER_URL + "?t=" + Date.now())
  .then(r => r.json())
  .then(data => {
      if(typeof data.count === "number"){
          document.getElementById("counterValue").textContent =
              String(data.count).padStart(5,"0");
      } else {
          document.getElementById("counterValue").textContent = "ERR";
      }
  })
  .catch(err=>{
      console.error("Counter load failed", err);
      document.getElementById("counterValue").textContent = "—";
  });
</script>

</body>
</html>
