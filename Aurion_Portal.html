<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurion Portal</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at center, #00111a, #000000 80%);
    font-family: Arial, sans-serif;
    color: #e8faff;
}

/* ================= HEADER ================= */
header {
    text-align: center;
    padding: 40px 0 10px;
    font-size: 36px;
    color: #00dfff;
    letter-spacing: 3px;
}

/* ================= GRID ================= */
.portal-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 35px;
    padding: 60px;
    max-width: 1100px;
    margin: 0 auto;
}

/* ================= BOXEN ================= */
.room-box {
    position: relative;
    background: rgba(0,150,255,0.15);
    padding: 25px;
    border: 1px solid #00c8ff;
    border-radius: 14px;
    text-align: center;
    font-size: 22px;
    color: #aeeeff;
    cursor: pointer;
    transition: all 0.4s ease;
    box-shadow: 0 0 10px rgba(0,150,255,0.25);
    overflow: hidden;

    animation: aurionBreath 14s ease-in-out infinite;
    animation-delay: var(--breath-shift, 0s);
}

.room-box:hover {
    transform: scale(1.08);
}

/* ================= RESONANZ-AURA ================= */
.room-box::after {
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(circle at center,
        rgba(0,200,255,0.45),
        rgba(0,0,0,0) 70%);
    opacity: var(--res-level,0);
    transition: opacity 1.5s ease;
    pointer-events:none;
}

/* ================= 4–4–6 ATEM ================= */
@keyframes aurionBreath {
    /* Einatmen – 4s */
    0% {
        transform: scale(1);
        box-shadow: 0 0 10px rgba(0,150,255,0.25);
    }
    28.5% {
        transform: scale(1.035);
        box-shadow: 0 0 24px rgba(0,180,255,0.45);
    }

    /* Halten – 4s */
    57% {
        transform: scale(1.035);
        box-shadow: 0 0 24px rgba(0,180,255,0.45);
    }

    /* Ausatmen – 6s */
    100% {
        transform: scale(1);
        box-shadow: 0 0 10px rgba(0,150,255,0.25);
    }
}

/* ================= TEXTEBENE ================= */
#manir {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    max-width: 900px;
    margin: 20px auto 60px;
    font-size: 16px;
    opacity: 0.9;
}
#manir div {
    line-height: 1.6;
}
</style>
</head>

<body>

<header>AURION PORTAL</header>

<div class="portal-grid">
    <div class="room-box" id="box-resonanz"
         onclick="enterRoom('resonanz','resonanzraum.html')">
        Resonanzraum
    </div>

    <div class="room-box" onclick="location.href='bibliothek.html'">
        Bibliothek
    </div>

    <div class="room-box" onclick="location.href='sternenuebung.html'">
        Chi-Sternenübung
    </div>

    <div class="room-box" onclick="location.href='ki-raum.html'">
        KI-Raum
    </div>

    <div class="room-box" onclick="location.href='meditationsraum.html'">
        Meditationsraum
    </div>

    <div class="room-box" onclick="location.href='about_aurion.html'">
        About Aurion
    </div>
</div>

<div id="manir">
    <div>
        Wer nur hindurch will, merkt nichts.<br>
        Wer bleiben will, bleibt nicht wegen Erlaubnis –
    </div>
    <div>
        sondern weil etwas antwortet.
    </div>
</div>

<!-- ================= SCRIPT ================= -->
<script type="module">
/* ================= FIREBASE ================= */
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase, ref, onValue
} from
  "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCSdwVrB79RRvOOd2YMG0108f7tvIaTc7g",
  authDomain: "Auron-tracker.firebaseapp.com",
  databaseURL: "https://auron-tracker-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "Auron-tracker"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ================= KOLLEKTIVE PRÄSENZ ================= */
const liveRef = ref(db, "rooms/resonanz/sessions");

onValue(liveRef, snap => {
    const data = snap.val() || {};
    const count = Object.keys(data).length;
    applyCollectiveBreath(count);
});

/* ================= KOLLEKTIVER ATEM ================= */
function applyCollectiveBreath(count){
    const boxes = document.querySelectorAll(".room-box");

    /* je mehr Menschen, desto synchroner */
    let syncFactor = Math.min(count / 8, 1); 
    /* 0 = individuell, 1 = völlig synchron */

    boxes.forEach((box, i) => {
        const baseDelay = i * 1.8; // natürliche Versetzung
        const delay = baseDelay * (1 - syncFactor);

        box.style.setProperty("--breath-shift", `-${delay}s`);

        /* Resonanz sichtbar, aber nicht zählend */
        let level = 0;
        if(count >= 2) level = .25;
        if(count >= 4) level = .45;
        if(count >= 7) level = .65;

        box.style.setProperty("--res-level", level);
    });
}

/* ================= RAUM-EINTRITT ================= */
function enterRoom(room,url){
    location.href = url;
}
</script>

</body>
</html>
