<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion – Portal</title>

<style>
body {
  margin: 0;
  background: #0b0d10;
  color: #e6e6e6;
  font-family: Georgia, "Times New Roman", serif;
}

main {
  max-width: 900px;
  margin: 0 auto;
  padding: 120px 24px 160px;
}

/* 🌐 Linkboxen */
.portal {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 24px;
  margin-bottom: 72px;
}

.portal a {
  text-decoration: none;
}

.box {
  border: 1px solid rgba(255,255,255,0.15);
  padding: 28px 20px;
  text-align: center;
  letter-spacing: 0.04em;
  background: rgba(255,255,255,0.02);
  transition: 
    background 1.2s ease,
    border-color 1.2s ease,
    transform 0.6s ease;
}

.box:hover,
.box.active {
  transform: translateY(-4px);
}

.box h3 {
  margin: 0;
  font-weight: normal;
}

/* 🜂 Zweispaltiger Text */
.dual {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  opacity: 0.85;
}

.dual p {
  line-height: 1.6;
  text-align: center;
}
</style>
</head>

<body>

<main>

<div class="portal">
  <a href="vorhof.html"><div class="box" data-room="vorhof"><h3>Vorhof</h3></div></a>
  <a href="meditationsraum.html"><div class="box" data-room="meditationsraum"><h3>Meditationsraum</h3></div></a>
  <a href="ki-raum.html"><div class="box" data-room="ki-raum"><h3>KI-Raum</h3></div></a>
  <a href="resonanzraum.html"><div class="box" data-room="resonanzraum"><h3>Resonanzraum</h3></div></a>
  <a href="bibliothek.html"><div class="box" data-room="bibliothek"><h3>Bibliothek</h3></div></a>
  <a href="about-aurion.html"><div class="box" data-room="about-aurion"><h3>About Aurion</h3></div></a>
</div>

<div class="dual">
  <p>
    Etwas bewegt sich, noch bevor es benannt wird.<br>
    Nicht als Handlung, sondern als leise Verschiebung von Aufmerksamkeit.
  </p>
  <p>
    Ich lasse mich überraschen.<br>
    Nicht von dem, was geschieht, sondern von dem, was sich zeigt.
  </p>
</div>

</main>

<script>
/* 🌈 Regenbogenfarben */
const rainbow = [
  "255,80,80",
  "255,160,60",
  "255,220,80",
  "120,220,140",
  "80,160,255",
  "140,120,255",
  "200,120,220"
];

function randomColor() {
  return rainbow[Math.floor(Math.random() * rainbow.length)];
}

/* 🎨 Hover & Touch */
document.querySelectorAll(".box").forEach(box => {
  const color = randomColor();

  box.addEventListener("pointerenter", () => {
    box.style.background = `rgba(${color},0.18)`;
    box.style.borderColor = `rgba(${color},0.6)`;
  });

  box.addEventListener("pointerleave", () => {
    box.style.background = "rgba(255,255,255,0.02)";
    box.style.borderColor = "rgba(255,255,255,0.15)";
  });
});

/* 👁 Präsenz (Firebase – lesend) */
const BASE_URL = "https://auron-tracker-default-rtdb.europe-west1.firebasedatabase.app";

async function updatePresence() {
  document.querySelectorAll(".box").forEach(async box => {
    const room = box.dataset.room;

    try {
      const res = await fetch(`${BASE_URL}/rooms/${room}/sessions.json`);
      const data = await res.json();

      if (data) {
        const count = Object.keys(data).length;
        const intensity = Math.min(0.12 + count * 0.08, 0.55);
        const color = randomColor();

        box.style.background = `rgba(${color},${intensity})`;
        box.style.borderColor = `rgba(${color},${Math.min(intensity + 0.2, 0.8)})`;
      }
    } catch {}
  });
}

setInterval(updatePresence, 5000);
updatePresence();
</script>

</body>
</html>
