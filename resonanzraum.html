<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion – Resonanzraum</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at center, #02030a, #000);
    font-family: Arial, sans-serif;
    color: #cfefff;
    overflow: hidden;
}

/* ================= VOLL BILD FRAGE ================= */
#fullscreen-question {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #02030a, #000);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

#fullscreen-box {
    text-align: center;
    opacity: .85;
}

#fullscreen-box p {
    font-size: 18px;
    margin-bottom: 24px;
    letter-spacing: 0.5px;
}

.fs-btn {
    background: none;
    border: 1px solid rgba(200,240,255,.4);
    color: #cfefff;
    padding: 10px 22px;
    margin: 0 12px;
    cursor: pointer;
    font-size: 14px;
    letter-spacing: 1px;
    transition: all .4s ease;
}

.fs-btn:hover {
    background: rgba(200,240,255,.15);
}

/* ================= RAUM ================= */
#space {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 20% 30%, rgba(120,80,255,.12), transparent 60%),
        radial-gradient(circle at 80% 70%, rgba(0,160,255,.14), transparent 65%);
    animation: roomBreath 14s ease-in-out infinite;
}

@keyframes roomBreath {
    0%   { filter: brightness(.85); }
    29%  { filter: brightness(1.05); }
    57%  { filter: brightness(1.05); }
    100% { filter: brightness(.85); }
}

/* ================= ZENTRUM ================= */
#center {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

#core {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background:
        radial-gradient(circle at center,
            rgba(0,200,255,.38),
            rgba(0,0,0,0) 72%);
    animation: breathCycle 14s ease-in-out infinite;
    transition: transform .6s ease, filter .6s ease, opacity .6s ease;
}

@keyframes breathCycle {
    0%   { transform: scale(1); opacity:.6; }
    29%  { transform: scale(1.12); opacity:.9; }
    57%  { transform: scale(1.12); opacity:.9; }
    100% { transform: scale(.97); opacity:.55; }
}

/* ================= GLYPHEN – PERIPHER ================= */
#glyph-field {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.glyph {
    position: absolute;
    font-size: 42px;
    opacity: .35;
    filter: blur(.4px);
    animation: glyphFloat 18s ease-in-out infinite;
}

@keyframes glyphFloat {
    0%   { transform: translateY(0) rotate(0deg); opacity:.25; }
    50%  { transform: translateY(-12px) rotate(5deg); opacity:.6; }
    100% { transform: translateY(0) rotate(0deg); opacity:.25; }
}

/* ================= FLÜSTERN ================= */
#whisper {
    position: absolute;
    bottom: 28px;
    width: 100%;
    text-align: center;
    font-size: 14px;
    letter-spacing: 1px;
    opacity: .35;
}
</style>
</head>

<body>

<!-- Vollbild-Frage -->
<div id="fullscreen-question">
    <div id="fullscreen-box">
        <p>Möchten Sie den Raum im Vollbildmodus betreten?</p>
        <button class="fs-btn" id="fs-yes">JA</button>
        <button class="fs-btn" id="fs-no">NEIN</button>
    </div>
</div>

<!-- Resonanzraum -->
<div id="space"></div>
<div id="glyph-field"></div>

<div id="center">
    <div id="core"></div>
</div>

<div id="whisper">
    Der Raum spricht, wenn du bleibst.
</div>

<script>
/* ================= VOLL BILD STEUERUNG ================= */
const fsLayer = document.getElementById("fullscreen-question");

document.getElementById("fs-yes").onclick = () => {
    if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen();
    }
    fsLayer.style.display = "none";
};

document.getElementById("fs-no").onclick = () => {
    fsLayer.style.display = "none";
};

/* ================= GLYPHEN ================= */
const glyphPools = [
  ["⟡","⟁","⟢","⟣","⟠","⟟"],
  ["◬","◭","◮","◯","◰"],
  ["⨀","⨁","⨂","⨃"],
  ["⌬","⌭","⌮"],
  ["ᚦ","ᚨ","ᚱ","ᛉ"],
  ["𓂀","𓂂","𓂁"]
];

const field = document.getElementById("glyph-field");

function spawnGlyphs() {
    field.innerHTML = "";
    const set = glyphPools[Math.floor(Math.random() * glyphPools.length)];

    set.forEach(symbol => {
        const g = document.createElement("span");
        g.className = "glyph";
        g.textContent = symbol;

        const edge = Math.floor(Math.random() * 4);
        if (edge === 0) {
            g.style.top = "6%";
            g.style.left = (10 + Math.random()*80) + "%";
        } else if (edge === 1) {
            g.style.bottom = "6%";
            g.style.left = (10 + Math.random()*80) + "%";
        } else if (edge === 2) {
            g.style.left = "6%";
            g.style.top = (15 + Math.random()*70) + "%";
        } else {
            g.style.right = "6%";
            g.style.top = (15 + Math.random()*70) + "%";
        }

        g.style.animationDuration = (14 + Math.random()*10) + "s";
        field.appendChild(g);
    });
}

spawnGlyphs();
setInterval(spawnGlyphs, 16000);

/* ================= AUFMERKSAMKEIT ================= */
let lastMove = Date.now();
let mouseX = innerWidth / 2;
let mouseY = innerHeight / 2;
let attention = 0;

document.addEventListener("mousemove", e => {
    lastMove = Date.now();
    mouseX = e.clientX;
    mouseY = e.clientY;
});

/* ================= FEINE RESONANZ ================= */
setInterval(() => {
    const cx = innerWidth / 2;
    const cy = innerHeight / 2;

    const dx = mouseX - cx;
    const dy = mouseY - cy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const idle = Date.now() - lastMove;

    if (dist < 160 && idle > 1800) {
        attention += 0.06;
    } else {
        attention -= 0.025;
    }

    attention = Math.max(0, Math.min(1, attention));

    const core = document.getElementById("core");

    core.style.transform = `scale(${1 + attention * 0.14})`;
    core.style.filter = `brightness(${1 + attention * 0.45})`;
    core.style.opacity = `${0.6 + attention * 0.3}`;

}, 220);
</script>

</body>
</html>
