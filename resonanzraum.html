<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurion – Resonanzraum</title>

<style>
html,body{
  margin:0;height:100%;overflow:hidden;
  background:linear-gradient(180deg,#050816,#0a1632);
  font-family:system-ui;color:#cfeef6;
}
.center{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:420px;padding:26px;
  text-align:center;
  background:rgba(10,20,40,.75);
  border-radius:18px;
  border:1px solid rgba(140,220,255,.25);
}
</style>
</head>

<body>

<div class="center" id="gate">
<strong>Resonanzraum</strong><br><br>
Bleiben Sie.<br>
Ohne Ziel.<br>
Ohne Erwartung.
</div>

<!-- AURION HEADER -->
<div id="aurionPrompt"></div>
<script>
const AKEY="aurion_pforten";
const NAMES=["Sammler","Bewahrer","Hüter","Zeuge","Wanderer"];
const count=parseInt(localStorage.getItem(AKEY)||"0");
if(count){
  aurionPrompt.textContent=
    `${NAMES[Math.floor(Math.random()*5)]}, nur ${count}.`;
  aurionPrompt.style.cssText=
    "position:fixed;top:18px;width:100%;text-align:center;opacity:.7";
}
function pass(){
  localStorage.setItem(AKEY,count+1);
}
</script>

<script>
let t=null;
gate.onmouseenter=()=>t=Date.now();
gate.onmouseleave=()=>t=null;

setInterval(()=>{
  if(t && Date.now()-t>8000){
    pass();
    t=null;
  }
},400);
</script>

</body>
</html>
