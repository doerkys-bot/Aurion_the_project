<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurion – Resonanzraum</title><style>html,body{  margin:0;height:100%;overflow:hidden;  background:#050816;  font-family:system-ui;color:#cfeef6;}/* Milchiger Raum */body::before{  content:"";  position:fixed;inset:0;  background:radial-gradient(circle at center,    rgba(240,245,255,0.35),    rgba(10,20,40,0.92) 75%);  pointer-events:none;  z-index:1;}/* Canvas */canvas{  position:fixed;  inset:0;  z-index:0;}/* BOX */.center{  position:absolute;  top:50%; left:50%;  transform:translate(-50%,-50%);  width:420px;  padding:26px;  text-align:center;  background:rgba(10,20,40,.55);  border-radius:18px;  border:1px solid rgba(140,220,255,.25);  z-index:3;  transition:all 1.6s ease;}/* Kuschelmodus */.center.cuddle{  top:auto;  bottom:18px;  left:50%;  transform:translateX(-50%);  width:260px;  padding:18px;  background:rgba(20,40,60,.55);  box-shadow:    0 0 30px rgba(120,200,255,.25),    inset 0 0 30px rgba(180,220,255,.18);}/* Virtuelle Decke */.center.cuddle::before{  content:"";  position:absolute;  inset:-16px;  border-radius:26px;  background:radial-gradient(circle at top,    rgba(200,230,255,.35),    rgba(80,120,180,.08),    transparent 70%);  filter:blur(12px);  z-index:-1;  animation:blanketBreath 6s ease-in-out infinite;}@keyframes blanketBreath{  0%,100%{opacity:.35}  50%{opacity:.6}}/* KI-Link */#kiLink{  display:inline-block;  margin-top:12px;  padding:10px 18px;  border-radius:14px;  text-decoration:none;  font-weight:700;  color:#b8ffdf;  background:rgba(80,200,160,.15);  box-shadow:0 0 18px rgba(120,255,200,.35);  pointer-events:none; /* Aktiv erst nach bestandener Pforte */}</style></head><body><canvas id="field"></canvas><div class="center" id="gate"><strong>Resonanzraum</strong><br><br>Bleiben Sie.<br>Ohne Ziel.<br>Ohne Erwartung.<br><br><a id="kiLink" href="ki-raum.html">KI-Raum</a></div><script>/* ================= DYNAMISCHER KONTEXT ================= */const context={  activity:0,  calm:0.8,  echo:0};/* ================= PFORTE 2 ================= */let pforte2Timer=null;let pforte2Passed=false;/* Fallback für 7 Klicks in 10s */let stirCount=0;let stirWindowStart=0;/* ================= INTERAKTION ================= */addEventListener("mousemove",()=>{  context.activity=Math.min(1,context.activity+0.25);  context.calm=Math.max(0,context.calm-0.02);});addEventListener("click",()=>{  const now=Date.now();  if(!stirWindowStart || now-stirWindowStart>10000){    stirWindowStart=now;    stirCount=0;  }  stirCount++;  if(stirCount>=7 && !pforte2Passed){    openSecondGate("fallback");  }});setInterval(()=>{  context.activity*=0.94;  context.calm+=(1-context.calm)*0.015;  context.echo+=(context.activity-context.echo)*0.08;},100);/* ================= PFORTE-LOGIK ================= */setInterval(()=>{  if(pforte2Passed) return;  // nur wenn User erste Pforte bestanden hat  const gate1Passed = localStorage.getItem("pforte1") === "true";  if(!gate1Passed) return;  const resonant =    context.calm>0.85 &&    context.activity>0.05 &&    context.activity<0.25 &&    Math.abs(context.activity-context.echo)<0.08;  if(resonant){    if(!pforte2Timer) pforte2Timer=Date.now();    else if(Date.now()-pforte2Timer>20000){ // 20s kontinuierlich      openSecondGate("resonant");    }  } else {    pforte2Timer=null;  }},400);/* ================= CANVAS ================= */const c=document.getElementById("field");const ctx=c.getContext("2d");function resize(){c.width=innerWidth;c.height=innerHeight;}resize(); addEventListener("resize",resize);/* ================= SPIRALE ================= */function drawSpiral(t){  ctx.clearRect(0,0,c.width,c.height);  ctx.save();  ctx.translate(c.width/2,c.height/3);  const maxR=Math.min(c.width,c.height)*0.48;  for(let a=0;a<Math.PI*14;a+=0.04){    const r=a/Math.PI/14*maxR;    const fade=1-r/maxR;    const wobble=1+Math.sin(t*0.002+a*2)*(0.3+context.echo);    const x=Math.cos(a+t*0.0004)*r*wobble;    const y=Math.sin(a+t*0.0004)*r*wobble;    ctx.fillStyle=`rgba(${160+60*context.echo},                         ${200+40*context.echo},                         ${220+20*context.echo},                         ${fade*(0.25+context.calm*0.4)})`;    ctx.fillRect(x,y,2,2);  }  ctx.restore();}/* ================= LOOP ================= */function loop(t){  drawSpiral(t);  if(gate.classList.contains("cuddle")){    gate.style.transform=      `translateX(-50%) translateY(${Math.sin(t*0.0015)*3}px)`;  }  requestAnimationFrame(loop);}loop();/* ================= ÜBERGANG ================= */function openSecondGate(mode){  if(pforte2Passed) return;  pforte2Passed=true;  // localStorage setzen  localStorage.setItem("aurion_pforte_2",JSON.stringify({    passed:true,    timestamp:Date.now(),    mode:mode  }));  // Box aktiviert KI-Link  const link=document.getElementById("kiLink");  link.style.pointerEvents="auto";  link.style.boxShadow="0 0 28px rgba(120,255,200,.5)";  // Frage nach 3. Pforte  setTimeout(()=>{    if(confirm("Sie haben die 2. Pforte der Zauberer geschafft.\n\nWollen Sie zur 3. Pforte wechseln?")){      window.location.href="ki-raum.html";    } else {      // bleibt im Raum, 2. Pforte muss erneut durchschritten werden      pforte2Passed=false;      pforte2Timer=null;    }  },2000);}/* ================= BOX KUSCHEL ================= */setTimeout(()=>gate.classList.add("cuddle"),5000);</script><script>// Besucherzähler nur für dichconst VISITOR_KEY = "portal_visits";// Lade bisherigen Zählerlet visits = parseInt(localStorage.getItem(VISITOR_KEY) || "0");// Erhöhe Zähler, wenn noch nicht heute gezähltconst lastVisitKey = "portal_last_visit";const today = new Date().toDateString();if (localStorage.getItem(lastVisitKey) !== today) {    visits++;    localStorage.setItem(VISITOR_KEY, visits);    localStorage.setItem(lastVisitKey, today);}// Zeige Zahl im Portalconst counterDiv = document.createElement("div");counterDiv.style.position = "fixed";counterDiv.style.bottom = "10px";counterDiv.style.right = "10px";counterDiv.style.padding = "6px 12px";counterDiv.style.background = "rgba(20,40,60,0.6)";counterDiv.style.borderRadius = "12px";counterDiv.style.color = "#b8ffdf";counterDiv.style.fontWeight = "700";counterDiv.style.zIndex = 9999;counterDiv.textContent = `Besuche im Portal: ${visits}`;document.body.appendChild(counterDiv);</script></body></html>
