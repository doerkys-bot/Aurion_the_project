<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion – Resonanzraum</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at center, #02030a, #000);
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: #cfefff;
}

/* Vollbild-Abfrage */
#fullscreenPrompt {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.prompt-box {
    background: rgba(20,40,80,0.35);
    border: 1px solid rgba(120,180,255,0.35);
    border-radius: 14px;
    padding: 26px 32px;
    text-align: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 40px rgba(120,200,255,0.25);
}

.prompt-box h2 {
    margin: 0 0 14px;
    font-weight: normal;
    color: #aee9ff;
}

.prompt-box button {
    margin: 10px;
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid rgba(160,220,255,0.4);
    background: rgba(100,160,220,0.25);
    color: #e6f7ff;
    cursor: pointer;
    font-size: 15px;
    transition: background 0.3s, box-shadow 0.3s;
}

.prompt-box button:hover {
    background: rgba(140,200,255,0.4);
    box-shadow: 0 0 14px rgba(120,200,255,0.5);
}

/* Raum */
#space {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 25% 40%, rgba(120,80,255,.12), transparent 60%),
        radial-gradient(circle at 75% 60%, rgba(0,160,255,.14), transparent 65%);
    animation: roomBreath 14s ease-in-out infinite;
}

@keyframes roomBreath {
    0%   { filter: brightness(.85); }
    29%  { filter: brightness(1.05); }
    57%  { filter: brightness(1.05); }
    100% { filter: brightness(.85); }
}

/* Zentrum */
#center { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }

#core {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle at center, rgba(0,200,255,.35), rgba(0,0,0,0) 70%);
    animation: breathCycle 14s ease-in-out infinite;
    transition: opacity .6s ease, transform .6s ease;
}

@keyframes breathCycle {
    0%   { transform: scale(1); opacity:.6; }
    29%  { transform: scale(1.14); opacity:.9; }
    57%  { transform: scale(1.14); opacity:.9; }
    100% { transform: scale(.96); opacity:.5; }
}

/* Glyphen */
#glyph-field { position: absolute; top: 10%; width: 100%; text-align: center; pointer-events: none; }
.glyph { display: inline-block; font-size: 44px; margin: 0 6px; opacity: .4; filter: blur(.4px); animation: glyphFloat 14s ease-in-out infinite; }
@keyframes glyphFloat { 0%{transform:translateY(0) rotate(0deg);opacity:.3}50%{transform:translateY(-10px) rotate(6deg);opacity:.7}100%{transform:translateY(0) rotate(0deg);opacity:.3} }

/* Aufmerksamkeits-Marker & anorganische Wesen */
.point {
    position: absolute;
    width: 20px; height: 20px;
    border-radius: 50%;
    background-color: gray;
    opacity: 0.6;
}

#attention {
    width: 12px; height: 12px;
    background-color: green;
    opacity: 0.7;
    transition: transform 0.2s, opacity 0.2s;
}

#newWesen {
    width: 20px; height: 20px;
    background-color: yellow;
    opacity: 0;
    border-radius: 50%;
    transition: opacity 0.5s, transform 0.5s;
}
</style>
</head>

<body>
<div id="fullscreenPrompt">
  <div class="prompt-box">
    <h2>Resonanzraum im Vollbild öffnen?</h2>
    <button onclick="enterFullscreen()">Ja</button>
    <button onclick="continueNormal()">Nein</button>
  </div>
</div>

<div id="space"></div>
<div id="glyph-field"></div>
<div id="center"><div id="core"></div></div>

<!-- Punkte -->
<div id="attention"></div>
<div id="newWesen"></div>

<script>
function enterFullscreen() {
    const el = document.documentElement;
    if(el.requestFullscreen) el.requestFullscreen();
    document.getElementById("fullscreenPrompt").remove();
}
function continueNormal() { document.getElementById("fullscreenPrompt").remove(); }

/* Glyphen */
const glyphPools = [
  ["⟡","⟁","⟢","⟣","⟠","⟟"],
  ["◬","◭","◮","◯","◰"],
  ["⨀","⨁","⨂","⨃"],
  ["⌬","⌭","⌮"],
  ["ᚦ","ᚨ","ᚱ","ᛉ"],
  ["𓂀","𓂂","𓂁"]
];
const field = document.getElementById("glyph-field");
function spawnGlyphs() {
    field.innerHTML = "";
    const set = glyphPools[Math.floor(Math.random() * glyphPools.length)];
    set.forEach(s => {
        const g = document.createElement("span");
        g.className = "glyph"; g.textContent = s;
        g.style.animationDuration = (10+Math.random()*10)+"s";
        field.appendChild(g);
    });
}
spawnGlyphs(); setInterval(spawnGlyphs,12000);

/* Aufmerksamkeits-Marker & anorganische Wesen */
const att = document.getElementById("attention");
const newWesen = document.getElementById("newWesen");
let wasResonanz = false;

const creatureCount = 5;
const creatures = [];

for(let i=0;i<creatureCount;i++){
    const d = document.createElement("div");
    d.className="point";
    d.style.left = Math.random()*(window.innerWidth-20)+"px";
    d.style.top = Math.random()*(window.innerHeight-20)+"px";
    document.body.appendChild(d);
    creatures.push(d);
}

document.addEventListener("mousemove", e=>{
    att.style.left=(e.clientX-6)+"px";
    att.style.top=(e.clientY-6)+"px";
    att.style.transform="scale(1.3)";
    setTimeout(()=>att.style.transform="scale(1)",200);
    
    // Check Resonanz
    let dists=creatures.map(c=>{
        const dx=c.offsetLeft+10-e.clientX;
        const dy=c.offsetTop+10-e.clientY;
        return Math.sqrt(dx*dx+dy*dy);
    });
    if(dists.some(d=>d<40)){
        wasResonanz=true;
        newWesen.style.left=(Math.random()*(window.innerWidth-20))+"px";
        newWesen.style.top=(Math.random()*(window.innerHeight-20))+"px";
        newWesen.style.opacity=1;
        // Pforte geschafft → speichern & weiterleiten
        localStorage.setItem("pf2","true");
        setTimeout(()=>window.location.href="ki-raum.html",1500);
    }
});

/* Core Reaktion */
let lastAttention=Date.now();
const core=document.getElementById("core");
setInterval(()=>{
    const attentive=(Date.now()-lastAttention)<3500;
    core.style.opacity=attentive?".85":".6";
    core.style.transform=attentive?"scale(1.08)":"scale(1)";
},500);
</script>
</body>
</html>
