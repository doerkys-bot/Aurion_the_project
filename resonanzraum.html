cat <<'EOF' > resonanz.html
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion – Resonanz</title>

<style>
html,body{
  margin:0;height:100%;
  background:#000;
  overflow:hidden;
}

/* Raum (bleibt ruhig – Gadgets wirken vor allem am Patch) */
#space{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 55% 40%,
      rgba(120,200,255,0.25),
      rgba(0,0,0,0.95) 65%);
  transition:filter 1.6s ease, transform 2s ease;
}

/* PATCH (linke Schläfe) */
#patch{
  position:absolute;
  width:160px;
  height:160px;
  border-radius:50%;
  left:34%;
  top:33%;
  background:
    radial-gradient(circle,
      rgba(200,240,255,0.55),
      rgba(60,120,180,0.25),
      rgba(0,0,0,0));
  filter:blur(14px);
  opacity:0.65;
  transform:scale(1);
  transition:transform 2.4s ease, opacity 2.4s ease;
}

/* zweite, sehr feine Aura-Linse (für „zweiter Atem“) */
#aura{
  position:absolute;
  width:220px;height:220px;
  border-radius:50%;
  left:34%;top:33%;
  transform:translate(-30px,-30px) scale(1);
  opacity:0;
  background:
    radial-gradient(circle,
      rgba(185,255,225,0.22),
      rgba(120,200,255,0.06),
      rgba(0,0,0,0));
  filter:blur(18px);
  transition:opacity 1.4s ease, transform 1.8s ease;
  pointer-events:none;
}
</style>
</head>

<body>
<div id="space">
  <div id="patch"></div>
  <div id="aura" aria-hidden="true"></div>
</div>

<script>
/* ===============================
   SESSION / WIEDERERKENNUNG
================================ */
const SESSION_KEY = "aurion_session_id";
let sessionId = localStorage.getItem(SESSION_KEY);
if(!sessionId){
  sessionId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now()+"-"+Math.random());
  localStorage.setItem(SESSION_KEY, sessionId);
}

/* ===============================
   GEDÄCHTNIS (LERNT GADGETS)
   Score: -6 … +6 (größer = häufiger)
================================ */
const MEMORY_KEY = "aurion_memory_v2";
let memory = {};
try{ memory = JSON.parse(localStorage.getItem(MEMORY_KEY) || "{}"); }catch(_){ memory = {}; }

function clamp(x,a,b){ return Math.max(a, Math.min(b, x)); }
function remember(gadget, delta){
  memory[gadget] = (memory[gadget] || 0) + delta;
  memory[gadget] = clamp(memory[gadget], -6, 6);
  localStorage.setItem(MEMORY_KEY, JSON.stringify(memory));
}

/* ===============================
   AUFMERKSAMKEITS-MESSUNG
================================ */
let activity = 0;
let lastAct = Date.now();
let stillMs = 0;

function registerActivity(weight){
  activity += weight;
  lastAct = Date.now();
}

["mousemove","scroll","keydown"].forEach(e=>{
  window.addEventListener(e,()=>registerActivity(0.9),{passive:true});
});
["click","touchstart","pointerdown"].forEach(e=>{
  window.addEventListener(e,()=>registerActivity(1.6),{passive:true});
});

/* Aktivität fällt ab + Stillzeit */
setInterval(()=>{
  activity *= 0.86;
  if(activity < 0.02) activity = 0;
  stillMs = Date.now() - lastAct;
},900);

function isUnruhig(){
  return activity > 7.5 || stillMs < 700;
}
function isAufmerksam(){
  return activity < 2.4 && stillMs > 1800;
}

/* ===============================
   ELEMENTE
================================ */
const patch = document.getElementById("patch");
const aura  = document.getElementById("aura");
const space = document.getElementById("space");

/* Helfer: Patch-Reset (immer sauber zurück) */
let resetTimer = null;
function softReset(ms){
  if(resetTimer) clearTimeout(resetTimer);
  resetTimer = setTimeout(()=>{
    patch.style.transition = "transform 2.4s ease, opacity 2.4s ease";
    patch.style.transform  = "scale(1)";
    patch.style.opacity    = "0.65";

    aura.style.opacity = "0";
    aura.style.transform = "translate(-30px,-30px) scale(1)";

    space.style.filter = "none";
    space.style.transform = "none";
  }, ms || 0);
}

/* ===============================
   GADGETS (spürbar, aber würdevoll)
   - delayedResonance: Antwort kommt „zu spät“
   - secondBreath: zweiter Atem / zweite Präsenz
   - deepen: Tiefe statt Bewegung
   - coherence: kurzer Ordnungsmoment (klar & weich)
================================ */
const GADGETS = {
  delayedResonance(){
    // erst nichts, dann ein „Nachziehen“
    const d = 800 + Math.random()*700;
    setTimeout(()=>{
      patch.style.transition = "transform 1.8s ease, opacity 1.8s ease";
      patch.style.transform  = "scale(1.22)";
      patch.style.opacity    = "0.78";
      softReset(1800);
    }, d);
  },

  secondBreath(){
    // feine zweite Linse kommt dazu (kurz, ohne den Raum zu bewegen)
    aura.style.opacity = "0.65";
    aura.style.transform = "translate(-30px,-30px) scale(1.08)";
    patch.style.transition = "transform 1.6s ease, opacity 1.6s ease";
    patch.style.transform  = "scale(1.12)";
    patch.style.opacity    = "0.72";
    setTimeout(()=>{
      aura.style.opacity = "0.0";
      patch.style.transform = "scale(1)";
      patch.style.opacity   = "0.65";
    }, 2200);
  },

  deepen(){
    // keine Bewegung – nur „Gewicht“
    space.style.filter = "brightness(0.92) contrast(1.06)";
    patch.style.opacity = "0.52";
    setTimeout(()=>{
      space.style.filter = "none";
      patch.style.opacity = "0.65";
    }, 3600);
  },

  coherence(){
    // kurz kohärent: klarer, dichter, dann wieder weich
    patch.style.transition = "transform 1.4s ease, opacity 1.4s ease";
    patch.style.transform  = "scale(1.16)";
    patch.style.opacity    = "0.82";
    space.style.filter = "contrast(1.05) brightness(1.02)";
    setTimeout(()=>{
      patch.style.transform = "scale(1)";
      patch.style.opacity   = "0.65";
      space.style.filter = "none";
    }, 1700);
  }
};

const gadgetNames = Object.keys(GADGETS);

/* Gewichtete Auswahl: häufiger, wenn „trägt“ */
function weightedPick(){
  const weights = gadgetNames.map(n => 1 + Math.max(0,(memory[n]||0))*0.55);
  const sum = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*sum;
  for(let i=0;i<gadgetNames.length;i++){
    r -= weights[i];
    if(r<=0) return gadgetNames[i];
  }
  return gadgetNames[gadgetNames.length-1];
}

/* ===============================
   RESONANZ-LOGIK (Timing wie gewünscht)
   - Unruhe: häufiger (ca. 7s)
   - Aufmerksamkeit: selten (ca. 30s)
   - sonst: mittel (ca. 15s)
   - Bewertung nach 4s: trägt es? (activity sinkt?)
================================ */
let lastGadgetAt = 0;
let lastName = "";

setInterval(()=>{
  const now = Date.now();

  // Timing
  const base = isUnruhig() ? 7000 : (isAufmerksam() ? 30000 : 15000);
  const jitter = isUnruhig() ? 1800 : 4500;
  const interval = base + (Math.random()*jitter - jitter/2);

  if(now - lastGadgetAt < interval) return;

  let name = weightedPick();
  if(name === lastName && Math.random() < 0.72){
    name = weightedPick();
  }

  // ausführen
  GADGETS[name]();
  lastGadgetAt = now;
  lastName = name;

  // Bewertung
  const before = activity;
  setTimeout(()=>{
    const after = activity;
    if(after < before) remember(name, +1);
    else remember(name, -1);

    // Wenn es nicht trägt: wird es leiser
    if(after > before){
      patch.style.opacity = "0.58";
      setTimeout(()=>patch.style.opacity="0.65", 1200);
    }
  }, 4000);

}, 1200);

/* ===============================
   Grundpuls (subtil)
   - damit es nicht tot ist, aber nicht „Raum atmet“
================================ */
(function basePulse(){
  let t0 = performance.now();
  function loop(ts){
    const t = (ts - t0) * 0.001;
    const p = 0.5 + 0.5*Math.sin(t*0.8);
    // sehr subtil: nur Patch
    const s = 1 + p*0.015;
    patch.style.transform = `scale(${s.toFixed(4)})`;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
EOF
