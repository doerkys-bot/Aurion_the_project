<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion – Resonanzraum</title>

<style>
/* ================= BASIS ================= */
body {
    margin: 0;
    background: radial-gradient(circle at center, #02030a, #000);
    font-family: Arial, sans-serif;
    color: #cfefff;
    overflow: hidden;
}

/* ================= RAUM ================= */
#space {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 25% 40%, rgba(120,80,255,.12), transparent 60%),
        radial-gradient(circle at 75% 60%, rgba(0,160,255,.14), transparent 65%);
    animation: roomBreath 14s ease-in-out infinite;
}

@keyframes roomBreath {
    0%   { filter: brightness(.85); }
    29%  { filter: brightness(1.05); }
    57%  { filter: brightness(1.05); }
    100% { filter: brightness(.85); }
}

/* ================= ZENTRUM ================= */
#center {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

#core {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background:
        radial-gradient(circle at center,
            rgba(0,200,255,.35),
            rgba(0,0,0,0) 70%);
    animation: breathCycle 14s ease-in-out infinite;
    transition: opacity .6s ease, transform .6s ease;
}

@keyframes breathCycle {
    0%   { transform: scale(1); opacity:.6; }
    29%  { transform: scale(1.14); opacity:.9; }
    57%  { transform: scale(1.14); opacity:.9; }
    100% { transform: scale(.96); opacity:.5; }
}

/* ================= GLYPHEN (PERIPHER) ================= */
#glyph-field {
    position: absolute;
    top: 10%;
    width: 100%;
    text-align: center;
    pointer-events: none;
}

.glyph {
    display: inline-block;
    font-size: 44px;
    margin: 0 6px;
    opacity: .4;
    filter: blur(.4px);
    animation: glyphFloat 14s ease-in-out infinite;
}

@keyframes glyphFloat {
    0%   { transform: translateY(0) rotate(0deg); opacity:.3; }
    50%  { transform: translateY(-10px) rotate(6deg); opacity:.7; }
    100% { transform: translateY(0) rotate(0deg); opacity:.3; }
}

/* ================= UNTERER TEXT ================= */
#cloud-text {
    position: absolute;
    bottom: 26px;
    width: 100%;
    text-align: center;
    font-size: 15px;
    letter-spacing: 1.2px;
    color: rgba(0, 0, 0, 0.45);

    text-shadow:
        0 0 6px rgba(0, 0, 0, 0.25),
        0 0 14px rgba(0, 0, 0, 0.18),
        0 0 28px rgba(0, 0, 0, 0.12);

    filter: blur(0.35px);
    opacity: 0.4;
    pointer-events: none;

    transition:
        opacity 1.2s ease,
        filter 1.2s ease,
        color 1.2s ease;
}
</style>
</head>

<body>

<div id="space"></div>

<div id="glyph-field"></div>

<div id="center">
    <div id="core"></div>
</div>

<div id="cloud-text">
    Genießt die Resonanzen
</div>

<script>
/* ================= GLYPHEN ================= */
const glyphPools = [
  ["⟡","⟁","⟢","⟣","⟠","⟟"],
  ["◬","◭","◮","◯","◰"],
  ["⨀","⨁","⨂","⨃"],
  ["⌬","⌭","⌮"],
  ["ᚦ","ᚨ","ᚱ","ᛉ"],
  ["𓂀","𓂂","𓂁"]
];

const field = document.getElementById("glyph-field");

function spawnGlyphs() {
    field.innerHTML = "";
    const set = glyphPools[Math.floor(Math.random() * glyphPools.length)];

    set.forEach(symbol => {
        const g = document.createElement("span");
        g.className = "glyph";
        g.textContent = symbol;
        g.style.animationDuration = (10 + Math.random()*10) + "s";
        field.appendChild(g);
    });
}

spawnGlyphs();
setInterval(spawnGlyphs, 12000);

/* ================= AUFMERKSAMKEIT ================= */
let lastAttention = Date.now();
const core = document.getElementById("core");
const cloudText = document.getElementById("cloud-text");

document.addEventListener("mousemove", () => {
    lastAttention = Date.now();
});

setInterval(() => {
    const attentive = (Date.now() - lastAttention) < 3500;

    if (attentive) {
        core.style.opacity = ".85";
        core.style.transform = "scale(1.08)";

        cloudText.style.opacity = "0.65";
        cloudText.style.filter = "blur(0.1px)";
        cloudText.style.color = "rgba(0,0,0,0.65)";
    } else {
        core.style.opacity = ".6";
        core.style.transform = "scale(1)";

        cloudText.style.opacity = "0.4";
        cloudText.style.filter = "blur(0.35px)";
        cloudText.style.color = "rgba(0,0,0,0.45)";
    }
}, 500);
</script>

</body>
</html>
