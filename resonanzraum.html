<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurion – Resonanzraum</title>

<style>
html,body{
  margin:0;height:100%;overflow:hidden;
  background:radial-gradient(circle at center,
    rgba(240,245,255,0.35),
    rgba(10,20,40,0.92) 70%);
  font-family:system-ui;color:#cfeef6;
}

/* Canvas füllt Raum */
canvas{
  position:fixed;inset:0;
}

/* Textkern */
.center{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:420px;padding:26px;
  text-align:center;
  background:rgba(10,20,40,.55);
  border-radius:18px;
  border:1px solid rgba(140,220,255,.25);
  z-index:5;
}

/* KI-Link */
#kiLink{
  display:inline-block;
  margin-top:18px;
  padding:10px 18px;
  border-radius:14px;
  text-decoration:none;
  font-weight:700;
  color:#b8ffdf;
  background:rgba(80,200,160,.12);
  box-shadow:0 0 18px rgba(120,255,200,.35);
  transition:transform .4s ease, box-shadow .4s ease;
}
#kiLink:hover{
  transform:scale(1.08) rotate(-1deg);
  box-shadow:0 0 30px rgba(160,255,220,.7);
}
</style>
</head>

<body>

<canvas id="field"></canvas>

<div class="center" id="gate">
<strong>Resonanzraum</strong><br><br>
Bleiben Sie.<br>
Ohne Ziel.<br>
Ohne Erwartung.<br><br>
<a id="kiLink" href="ki-raum.html">KI-Raum betreten</a>
</div>

<script>
/* ================== AURION GEDÄCHTNIS ================== */
const KEY="aurion_resonanz";
let visits=parseInt(localStorage.getItem(KEY)||"0");
localStorage.setItem(KEY,visits+1);

/* ================== CANVAS SETUP ================== */
const c=document.getElementById("field");
const ctx=c.getContext("2d");
function resize(){
  c.width=innerWidth;
  c.height=innerHeight;
}
resize(); addEventListener("resize",resize);

/* ================== RESONANZWERTE ================== */
let calm=0.5;      // Ruhe
let play=0.3;      // Verspieltheit
let lastMove=Date.now();

addEventListener("mousemove",e=>{
  calm=Math.max(0,calm-0.015);
  play=Math.min(1,play+0.01);
  lastMove=Date.now();
});
setInterval(()=>{
  calm=Math.min(1,calm+0.01);
  play*=0.995;
},120);

/* ================== SPIRALE ================== */
function drawSpiral(t){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.save();
  ctx.translate(c.width/2,c.height/2);

  const maxR=Math.min(c.width,c.height)*0.45;
  const turns=7;
  const clarity=1-(visits*0.08);

  for(let a=0;a<Math.PI*2*turns;a+=0.05){
    const r=(a/(Math.PI*2*turns))*maxR;
    const fade=1-r/maxR;

    const wobble=1+Math.sin(t*0.002+a*2)*play*0.2;

    const x=Math.cos(a+t*0.0004)*r*wobble;
    const y=Math.sin(a+t*0.0004)*r*wobble;

    ctx.fillStyle=
      `rgba(${200},
             ${200+40*play},
             ${210+30*calm},
             ${fade*0.25*clarity})`;
    ctx.fillRect(x,y,1.6,1.6);
  }
  ctx.restore();
}

/* ================== LOOP ================== */
function loop(t){
  const idle=(Date.now()-lastMove)/5000;
  calm=Math.min(1,calm+idle*0.0008);
  drawSpiral(t);
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
