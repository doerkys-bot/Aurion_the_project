<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion – Resonanz</title>

<style>
html,body{
  margin:0;height:100%;
  background:#000;
  overflow:hidden;
}

#space{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 55% 40%,
      rgba(120,200,255,0.25),
      rgba(0,0,0,0.95) 65%);
  transition:filter 1.6s ease, transform 2s ease;
}

/* PATCH (linke Schläfe) */
#patch{
  position:absolute;
  width:160px;
  height:160px;
  border-radius:50%;
  left:34%;
  top:33%;
  background:
    radial-gradient(circle,
      rgba(200,240,255,0.55),
      rgba(60,120,180,0.25),
      rgba(0,0,0,0));
  filter:blur(14px);
  opacity:0.65;
  transform:scale(1);
  transition:all 2.4s ease;
}
</style>
</head>

<body>
<div id="space">
  <div id="patch"></div>
</div>

<script>
/* ===============================
   SESSION / WIEDERERKENNUNG
================================ */
const SESSION_KEY = "aurion_session_id";
let sessionId = localStorage.getItem(SESSION_KEY);
if(!sessionId){
  sessionId = crypto.randomUUID();
  localStorage.setItem(SESSION_KEY, sessionId);
}

/* ===============================
   GEDÄCHTNIS (LERNT GADGETS)
================================ */
const MEMORY_KEY = "aurion_memory";
let memory = JSON.parse(localStorage.getItem(MEMORY_KEY) || "{}");

/*
memory = {
  gadgetName: score (-3 … +3)
}
*/

function remember(gadget, delta){
  memory[gadget] = (memory[gadget] || 0) + delta;
  memory[gadget] = Math.max(-3, Math.min(3, memory[gadget]));
  localStorage.setItem(MEMORY_KEY, JSON.stringify(memory));
}

/* ===============================
   AUFMERKSAMKEITS-MESSUNG
================================ */
let activity = 0;
let lastMove = Date.now();

function registerActivity(weight){
  activity += weight;
  lastMove = Date.now();
}

["mousemove","click","scroll","keydown","touchstart"].forEach(e=>{
  window.addEventListener(e,()=>registerActivity(1),{passive:true});
});

/* Aktivität fällt langsam ab */
setInterval(()=>{
  activity *= 0.85;
},1000);

/* ===============================
   GADGET-REPERTOIRE
================================ */
const patch = document.getElementById("patch");
const space = document.getElementById("space");

const GADGETS = {
  pulse(){
    patch.style.transform = "scale(1.18)";
    setTimeout(()=>patch.style.transform="scale(1)",2200);
  },
  sink(){
    patch.style.opacity = "0.35";
    setTimeout(()=>patch.style.opacity="0.65",2600);
  },
  delay(){
    patch.style.transitionDuration = "4.5s";
    patch.style.transform = "scale(1.1)";
    setTimeout(()=>{
      patch.style.transitionDuration = "2.4s";
      patch.style.transform="scale(1)";
    },3800);
  },
  deepen(){
    space.style.filter="brightness(0.85)";
    setTimeout(()=>space.style.filter="brightness(1)",3000);
  }
};

function chooseGadget(){
  // Gewichtung nach Lernerfolg
  const pool = Object.keys(GADGETS);
  pool.sort((a,b)=>(memory[b]||0)-(memory[a]||0));
  return pool[Math.floor(Math.random()*Math.min(2,pool.length))];
}

/* ===============================
   RESONANZ-LOGIK
================================ */
let lastGadget = 0;
let lastActivitySnapshot = 0;

setInterval(()=>{
  const now = Date.now();
  const calm = activity < 3;
  const unruhig = activity > 8;

  let interval = unruhig ? 7000 : 30000;
  interval += (Math.random()*4000-2000);

  if(now - lastGadget < interval) return;

  const gadget = chooseGadget();
  GADGETS[gadget]();
  lastGadget = now;

  /* Bewertung nach Wirkung */
  const before = activity;
  setTimeout(()=>{
    const after = activity;
    if(after < before) remember(gadget,+1);
    else remember(gadget,-1);
  },4000);

},1200);
</script>
</body>
</html>
