<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurion – Resonanzraum</title>

<style>
html,body{
  margin:0;height:100%;overflow:hidden;
  background:#050816;
  font-family:system-ui;color:#cfeef6;
}

/* Milchiger Raum */
body::before{
  content:"";
  position:fixed;inset:0;
  background:radial-gradient(circle at center,
    rgba(240,245,255,0.35),
    rgba(10,20,40,0.92) 75%);
  pointer-events:none;
  z-index:1;
}

/* Canvas */
canvas{
  position:fixed;
  inset:0;
  z-index:0;
}

/* BOX */
.center{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:420px;
  padding:26px;
  text-align:center;
  background:rgba(10,20,40,.55);
  border-radius:18px;
  border:1px solid rgba(140,220,255,.25);
  z-index:3;
  transition:all 1.6s ease;
}

/* Kuschelmodus */
.center.cuddle{
  top:auto;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  width:260px;
  padding:18px;
  background:rgba(20,40,60,.55);
  box-shadow:
    0 0 30px rgba(120,200,255,.25),
    inset 0 0 30px rgba(180,220,255,.18);
}

/* Virtuelle Decke */
.center.cuddle::before{
  content:"";
  position:absolute;
  inset:-16px;
  border-radius:26px;
  background:radial-gradient(circle at top,
    rgba(200,230,255,.35),
    rgba(80,120,180,.08),
    transparent 70%);
  filter:blur(12px);
  z-index:-1;
  animation:blanketBreath 6s ease-in-out infinite;
}

@keyframes blanketBreath{
  0%,100%{opacity:.35}
  50%{opacity:.6}
}

/* KI-Link */
#kiLink{
  display:inline-block;
  margin-top:12px;
  padding:10px 18px;
  border-radius:14px;
  text-decoration:none;
  font-weight:700;
  color:#b8ffdf;
  background:rgba(80,200,160,.15);
  box-shadow:0 0 18px rgba(120,255,200,.35);
}
</style>
</head>

<canvas id="field"></canvas>

</div>
