<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Resonanzraum</title>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at center, #050812, #000);
  font-family: system-ui, Segoe UI, Roboto, sans-serif;
  color: rgba(220,240,255,0.65);
}

/* ===== RAUM-ATEM ===== */
@keyframes roomBreath {
  0%   { filter:brightness(.9); }
  29%  { filter:brightness(1.05); }
  57%  { filter:brightness(1.05); }
  100% { filter:brightness(.9); }
}

body{
  animation: roomBreath 14s ease-in-out infinite;
}

/* ===== ZENTRUM ===== */
#center {
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

#core {
  width:180px;
  height:180px;
  border-radius:50%;
  background:
    radial-gradient(circle at center,
      rgba(160,220,255,0.35),
      rgba(0,0,0,0) 70%);
  opacity:.55;
  transform:scale(1);
  transition:
    transform 1.2s ease,
    opacity 1.2s ease,
    filter 1.2s ease;
  animation: coreBreath 14s ease-in-out infinite;
}

@keyframes coreBreath {
  0%   { transform:scale(1); }
  29%  { transform:scale(1.12); }
  57%  { transform:scale(1.12); }
  100% { transform:scale(1); }
}

/* ===== TEXT (FAST UNSICHTBAR) ===== */
#whisper {
  position:fixed;
  bottom:24px;
  width:100%;
  text-align:center;
  font-size:14px;
  letter-spacing:1.2px;
  opacity:.28;
  pointer-events:none;
  transition:opacity 1.2s ease;
}

/* ===== FEINER NEBEL ===== */
#veil{
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 30% 40%, rgba(120,180,255,.08), transparent 60%),
    radial-gradient(circle at 70% 60%, rgba(80,140,220,.06), transparent 65%);
  pointer-events:none;
}
</style>
</head>

<body>

<div id="veil"></div>

<div id="center">
  <div id="core"></div>
</div>

<div id="whisper">
  Hier geschieht nichts auf Befehl.
</div>

<script>
/* ================= AUFMERKSAMKEIT ================= */

const core = document.getElementById("core");
const whisper = document.getElementById("whisper");

let lastActivity = Date.now();
let attentive = false;

/* Maus / Touch */
["mousemove","mousedown","touchstart","touchmove"].forEach(evt=>{
  document.addEventListener(evt,()=>{
    lastActivity = Date.now();
  });
});

/* ===== BEOBACHTUNG ===== */
setInterval(()=>{
  const now = Date.now();
  attentive = (now - lastActivity) < 4000;

  if(attentive){
    core.style.opacity = ".85";
    core.style.transform = "scale(1.18)";
    core.style.filter = "brightness(1.15)";
    whisper.style.opacity = ".55";
  } else {
    core.style.opacity = ".55";
    core.style.transform = "scale(1)";
    core.style.filter = "brightness(1)";
    whisper.style.opacity = ".28";
  }
},500);

/* ===== FALLBACK-PULS =====
   Wenn wirklich gar nichts geschieht,
   bleibt der Raum lebendig, aber still */
let fallback = 0;
setInterval(()=>{
  if(!attentive){
    fallback++;
    if(fallback > 10){
      core.style.opacity = ".65";
      core.style.transform = "scale(1.05)";
      setTimeout(()=>{
        core.style.transform = "scale(1)";
      },800);
      fallback = 0;
    }
  } else {
    fallback = 0;
  }
},1000);
</script>

</body>
</html>
