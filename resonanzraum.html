<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion – Resonanzraum</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle at center, #02030a, #000);
    font-family: Arial, sans-serif;
    color: #cfefff;
    overflow: hidden;
}

/* ================= RAUM ================= */
#space {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 25% 40%, rgba(120,80,255,.12), transparent 60%),
        radial-gradient(circle at 75% 60%, rgba(0,160,255,.14), transparent 65%);
    animation: roomBreath 18s ease-in-out infinite;
}

@keyframes roomBreath {
    0%   { filter: brightness(.85); }
    30%  { filter: brightness(1.05); }
    45%  { filter: brightness(1); }
    100% { filter: brightness(.85); }
}

/* ================= ZENTRUM ================= */
#center {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
}

#core {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background:
        radial-gradient(circle at center,
            rgba(0,200,255,.35),
            rgba(0,0,0,0) 70%);
    animation: breathCycle 18s ease-in-out infinite;
}

@keyframes breathCycle {
    0%   { transform: scale(1); opacity:.6; }     /* ein */
    22%  { transform: scale(1.14); opacity:.9; }  /* ein */
    40%  { transform: scale(1.14); opacity:.9; }  /* still */
    75%  { transform: scale(.96); opacity:.5; }   /* aus */
    100% { transform: scale(1); opacity:.6; }     /* zurück */
}

/* ================= GLYPHEN ================= */
#glyph-field {
    position: absolute;
    top: 12%;
    width: 100%;
    text-align: center;
    pointer-events: none;
}

.glyph {
    display: inline-block;
    font-size: 44px;
    margin: 0 6px;
    opacity: .5;
    filter: blur(.3px);
    animation: glyphFloat 14s ease-in-out infinite;
}

@keyframes glyphFloat {
    0%   { transform: translateY(0) rotate(0deg); opacity:.35; }
    50%  { transform: translateY(-10px) rotate(6deg); opacity:.85; }
    100% { transform: translateY(0) rotate(0deg); opacity:.35; }
}

/* ================= MOUSE-RESONANZ ================= */
body:hover #core {
    filter: brightness(1.15);
}

body:hover .glyph {
    opacity: .9;
}

/* ================= FLÜSTERN ================= */
#whisper {
    position: absolute;
    bottom: 28px;
    width: 100%;
    text-align: center;
    font-size: 14px;
    letter-spacing: 1px;
    opacity: .35;
}
</style>
</head>

<body>

<div id="space"></div>

<div id="glyph-field"></div>

<div id="center">
    <div id="core"></div>
</div>

<div id="whisper">
    Der Raum spricht, wenn du bleibst.
</div>

<script>
/* ================= UNIVERSALE SCHRIFT ================= */

/*
   Keine Sprache.
   Keine Übersetzung.
   Nur Resonanz.
*/

const glyphPools = [
  ["⟡","⟁","⟢","⟣","⟠","⟟"],
  ["◬","◭","◮","◯","◰"],
  ["⨀","⨁","⨂","⨃"],
  ["⌬","⌭","⌮"],
  ["ᚦ","ᚨ","ᚱ","ᛉ"],
  ["𓂀","𓂂","𓂁"]
];

const field = document.getElementById("glyph-field");

function spawnGlyphs() {
    field.innerHTML = "";
    const set = glyphPools[Math.floor(Math.random() * glyphPools.length)];

    set.forEach(symbol => {
        const g = document.createElement("span");
        g.className = "glyph";
        g.textContent = symbol;
        g.style.animationDuration = (10 + Math.random()*10) + "s";
        field.appendChild(g);
    });
}

/* erste Antwort */
spawnGlyphs();

/* Raum antwortet zyklisch (10–15 Sekunden) */
setInterval(spawnGlyphs, 10000 + Math.random()*5000);

/* ================= FEINE INTERAKTION ================= */
let lastMove = Date.now();

document.addEventListener("mousemove", () => {
    lastMove = Date.now();
});

/* wenn jemand bleibt (ohne Bewegung) → Ruhe vertieft sich */
setInterval(() => {
    if(Date.now() - lastMove > 6000){
        document.getElementById("core").style.opacity = ".75";
    } else {
        document.getElementById("core").style.opacity = ".6";
    }
}, 1000);
</script>

</body>
</html>
