<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion – Resonanzraum (2. Pforte)</title>
<style>
body {
  margin:0; padding:0; height:100%; width:100%;
  background:#02040a;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  font-family:system-ui, sans-serif;
}

#focusPoint {
  width:80px; height:80px;
  background:yellow;
  border-radius:50%;
  box-shadow:0 0 15px rgba(255,255,0,0.5);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

#focusPoint.pulse {
  transform: scale(1.3);
  box-shadow:0 0 40px rgba(255,255,0,0.8);
}

#instruction {
  position:absolute; bottom:20px; left:50%;
  transform:translateX(-50%);
  color:#cfefff;
  font-size:16px;
  text-align:center;
  max-width:300px;
}

</style>
</head>
<body>

<div id="focusPoint"></div>
<div id="instruction">Schauen Sie mit geschlossenen Augen auf den Punkt und schenken ihm Aufmerksamkeit.</div>

<script>
const point = document.getElementById("focusPoint");
let attentionStart = null;
let lastMove = Date.now();
let clickTimes = [];
let progress = false;

// ---- Aufmerksamkeit ----
point.addEventListener("mouseenter", () => {
    attentionStart = Date.now();
    lastMove = Date.now();
});
point.addEventListener("mousemove", () => lastMove = Date.now());
point.addEventListener("mouseleave", () => attentionStart = null);

setInterval(() => {
    if(progress) return;
    const now = Date.now();
    if(attentionStart && now - lastMove > 3000) { // 3 Sekunden Fokussierung
        progress = true;
        passGate();
    } else if(attentionStart) {
        point.classList.add("pulse");
    } else {
        point.classList.remove("pulse");
    }
}, 100);

// ---- Fallback Klick ----
point.addEventListener("click", () => {
    if(progress) return;
    clickTimes.push(Date.now());
    // letzte 10 Sekunden
    clickTimes = clickTimes.filter(t => Date.now() - t < 10000);
    // 5 Klicks als Fallback
    if(clickTimes.length >= 5) {
        progress = true;
        passGate();
    }
});

// ---- Fallback Klick-Rhythmus 2x-1x-2x ----
let rhythm = [];
point.addEventListener("click", () => {
    if(progress) return;
    const now = Date.now();
    rhythm.push(now);
    // nur letzte 10 Sekunden berücksichtigen
    rhythm = rhythm.filter(t => now - t < 10000);
    // Minimaler Rhythmus: 2x kurze Pause 1x kurze Pause 2x
    if(rhythm.length >= 5) {
        progress = true;
        passGate();
    }
});

// ---- Gate passiert ----
function passGate() {
    point.style.background = "limegreen";
    point.classList.add("pulse");
    setTimeout(() => {
        window.location.href = "ki-raum.html"; // dritte Pforte
    }, 1200);
}
</script>

</body>
</html>
