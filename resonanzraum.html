<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurion – Resonanzraum</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:radial-gradient(circle at center,
    rgba(220,230,240,0.35),
    rgba(10,20,40,0.95));
  font-family:system-ui;
  color:#cfeef6;
}

/* Canvas-Raum */
canvas{
  position:fixed;
  inset:0;
}

/* Zentrum */
.center{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:420px;
  padding:26px;
  text-align:center;
  background:rgba(10,20,40,.55);
  border-radius:18px;
  border:1px solid rgba(140,220,255,.25);
  backdrop-filter:blur(6px);
  z-index:2;
}
</style>
</head>

<body>

<canvas id="field"></canvas>

<div class="center" id="gate">
<strong>Resonanzraum</strong><br><br>
Bleiben Sie.<br>
Ohne Ziel.<br>
Ohne Erwartung.
</div>

<!-- AURION HEADER -->
<div id="aurionPrompt"></div>

<script>
/* ================= AURION STATUS ================= */
const AKEY="aurion_pforten";
const NAMES=["Sammler","Bewahrer","Hüter","Zeuge","Wanderer"];
const count=parseInt(localStorage.getItem(AKEY)||"0");
if(count){
  aurionPrompt.textContent=
    `${NAMES[Math.floor(Math.random()*5)]}, nur ${count}.`;
  aurionPrompt.style.cssText=
    "position:fixed;top:18px;width:100%;text-align:center;opacity:.7";
}
function pass(){
  localStorage.setItem(AKEY,count+1);
}
</script>

<script>
/* ================= VERWEIL-ERKENNUNG ================= */
let t=null;
gate.onmouseenter=()=>t=Date.now();
gate.onmouseleave=()=>t=null;

setInterval(()=>{
  if(t && Date.now()-t>8000){
    pass();
    t=null;
  }
},400);
</script>

<script>
/* ================= RESONANZ-FELD ================= */
const canvas=document.getElementById("field");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

let lastMove=Date.now();
addEventListener("mousemove",()=>lastMove=Date.now());
addEventListener("touchstart",()=>lastMove=Date.now());

function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const cx=canvas.width/2;
  const cy=canvas.height/2;
  const maxR=Math.min(cx,cy)*0.9;

  const calm=Math.min(1,(Date.now()-lastMove)/6000);

  // Resonanzparameter
  const turns=5 + calm*3;
  const tightness=0.15 + (1-calm)*0.08;
  const baseAlpha=0.35 + calm*0.25;

  for(let r=0;r<maxR;r+=2){
    const angle=r*tightness;
    const fade=1-(r/maxR);
    const blur=8*(1-fade);

    const x=cx + r*Math.cos(angle);
    const y=cy + r*Math.sin(angle);

    const gray=180 + calm*40;
    ctx.fillStyle=`rgba(${gray},${gray},${gray},${baseAlpha*fade})`;
    ctx.shadowColor=`rgba(200,220,255,${0.2*fade})`;
    ctx.shadowBlur=blur;

    ctx.beginPath();
    ctx.arc(x,y,1.6,0,Math.PI*2);
    ctx.fill();
  }

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
