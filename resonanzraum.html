<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aurion – Resonanz (Gadgets überall)</title>

<style>
:root{
  --flash:0;      /* 0..1 Vollbildblitz */
  --fog:0;        /* 0..1 Milchschleier */
  --twist:0;      /* 0..1 leichter Sog */
  --sh:0;         /* 0..1 Screen-Shift */
  --gate:0;       /* 0..1 Gate-Hinweis */
  --gateGlow:0;   /* 0..1 Gate-Glow */
}

html,body{
  margin:0;height:100%;
  background:#000;
  overflow:hidden;
  font-family:system-ui,Segoe UI,Roboto,sans-serif;
}

/* Grundraum */
#space{
  position:fixed; inset:0;
  background:
    radial-gradient(circle at 55% 40%,
      rgba(120,200,255,0.25),
      rgba(0,0,0,0.96) 66%);
  filter:
    brightness(calc(1 - var(--twist)*0.08 + var(--flash)*0.10))
    contrast(calc(1 + var(--flash)*0.12))
    saturate(calc(1 + var(--twist)*0.08));
  transform:
    translate(calc((var(--sh) - 0.5) * 10px), calc((0.5 - var(--sh)) * 8px));
  transition: filter 600ms ease;
}

/* Screen-Gadget-Layer */
#fx{
  position:fixed; inset:0;
  pointer-events:none;
  z-index:10;
}

/* Eckenblitz + Kantenblitz */
#fx::before{
  content:"";
  position:absolute; inset:-2px;
  opacity: var(--flash);
  background:
    radial-gradient(circle at 0% 0%, rgba(200,245,255,0.42), rgba(0,0,0,0) 36%),
    radial-gradient(circle at 100% 0%, rgba(200,245,255,0.34), rgba(0,0,0,0) 36%),
    radial-gradient(circle at 0% 100%, rgba(200,245,255,0.30), rgba(0,0,0,0) 36%),
    radial-gradient(circle at 100% 100%, rgba(200,245,255,0.40), rgba(0,0,0,0) 36%),
    linear-gradient(0deg, rgba(200,245,255,0.10), rgba(0,0,0,0) 35%),
    linear-gradient(90deg, rgba(200,245,255,0.08), rgba(0,0,0,0) 35%),
    linear-gradient(180deg, rgba(200,245,255,0.10), rgba(0,0,0,0) 35%),
    linear-gradient(270deg, rgba(200,245,255,0.08), rgba(0,0,0,0) 35%);
  filter: blur(1px);
  transition: opacity 240ms ease;
}

/* Milchige Verdichtung */
#fx::after{
  content:"";
  position:absolute; inset:0;
  opacity: var(--fog);
  background:
    radial-gradient(circle at 50% 45%,
      rgba(245,250,255,0.22),
      rgba(0,0,0,0.00) 55%),
    radial-gradient(circle at 25% 65%,
      rgba(180,240,255,0.10),
      rgba(0,0,0,0) 55%),
    radial-gradient(circle at 80% 25%,
      rgba(180,240,255,0.08),
      rgba(0,0,0,0) 55%);
  filter: blur(12px);
  transition: opacity 500ms ease;
}

/* 8 „Blicke“ überall: erscheinen zufällig irgendwo */
.blink{
  position:fixed;
  width:140px; height:140px;
  border-radius:50%;
  pointer-events:none;
  opacity:0;
  transform:scale(0.85);
  z-index:11;
  background:
    radial-gradient(circle at 35% 35%,
      rgba(240,255,255,0.45),
      rgba(120,200,255,0.16) 35%,
      rgba(0,0,0,0.00) 72%);
  filter: blur(10px);
}
.blink.on{
  opacity:1;
  transform:scale(1.05);
  transition: opacity 220ms ease, transform 620ms ease;
}
.blink.off{
  opacity:0;
  transform:scale(0.80);
  transition: opacity 520ms ease, transform 900ms ease;
}

/* „Ordnungsmoment“: Linien kurz auf dem ganzen Screen */
#gridMoment{
  position:fixed; inset:0;
  pointer-events:none;
  opacity:0;
  z-index:12;
  background:
    repeating-linear-gradient(0deg,
      rgba(185,245,255,0.00) 0px,
      rgba(185,245,255,0.00) 22px,
      rgba(185,245,255,0.08) 23px),
    repeating-linear-gradient(90deg,
      rgba(185,245,255,0.00) 0px,
      rgba(185,245,255,0.00) 22px,
      rgba(185,245,255,0.08) 23px);
  filter: blur(0.2px);
}
#gridMoment.on{
  opacity:1;
  transition: opacity 180ms ease;
}
#gridMoment.off{
  opacity:0;
  transition: opacity 600ms ease;
}

/* Nachhall: „Wellen“ laufen über den Screen */
#ripple{
  position:fixed; inset:0;
  pointer-events:none;
  opacity:0;
  z-index:13;
  background:
    radial-gradient(circle at var(--rx) var(--ry),
      rgba(185,255,225,0.22),
      rgba(120,200,255,0.08) 22%,
      rgba(0,0,0,0.00) 55%);
  filter: blur(2px);
}
#ripple.on{ opacity:1; transition: opacity 120ms ease; }
#ripple.off{ opacity:0; transition: opacity 700ms ease; }

/* Gate-Hinweis (ohne Box) */
#gateHint{
  position:fixed; left:0; right:0; bottom:0;
  height:22vh;
  z-index:30;
  pointer-events:none;
  opacity: calc(0.02 + var(--gate)*0.92);
  transition: opacity 700ms ease;
}
#gateHint::before{
  content:"";
  position:absolute;
  left:8vw; right:8vw;
  bottom:22px;
  height:9px;
  border-radius:999px;
  background:
    linear-gradient(90deg,
      rgba(160,220,255,0) 0%,
      rgba(160,220,255,0.14) 20%,
      rgba(185,255,225,0.40) 50%,
      rgba(160,220,255,0.14) 80%,
      rgba(160,220,255,0) 100%);
  filter: brightness(calc(1 + var(--gateGlow)*0.85));
  transform: translateX(-18%);
  animation: shimmer 2.4s ease-in-out infinite;
}
@keyframes shimmer{
  0%   { transform: translateX(-18%); opacity: 0.28; }
  50%  { transform: translateX(18%);  opacity: 0.95; }
  100% { transform: translateX(-18%); opacity: 0.28; }
}

/* Klickzone unten: links bleiben/reset, rechts weiter */
#gateZone{
  position:fixed; left:0; right:0; bottom:0;
  height:22vh;
  z-index:31;
  pointer-events:auto;
  background:transparent;
  touch-action: manipulation;
}

/* optional Debug: ?debug=1 */
#dbg{
  position:fixed; left:12px; bottom:12px; z-index:40;
  font: 12px/1.3 system-ui;
  color: rgba(210,245,255,0.65);
  background: rgba(0,0,0,0.18);
  border: 1px solid rgba(140,220,255,0.12);
  border-radius:10px;
  padding:6px 8px;
  user-select:none;
  pointer-events:none;
  display:none;
}
</style>
</head>

<body>
<div id="space"></div>

<div id="fx" aria-hidden="true"></div>
<div id="gridMoment" aria-hidden="true"></div>
<div id="ripple" aria-hidden="true"></div>

<!-- 8 Blicke -->
<div class="blink" id="b1"></div>
<div class="blink" id="b2"></div>
<div class="blink" id="b3"></div>
<div class="blink" id="b4"></div>
<div class="blink" id="b5"></div>
<div class="blink" id="b6"></div>
<div class="blink" id="b7"></div>
<div class="blink" id="b8"></div>

<div id="gateHint" aria-hidden="true"></div>
<div id="gateZone" aria-label="Klickzone"></div>
<div id="dbg">dbg</div>

<script>
(() => {
  const qs = new URLSearchParams(location.search);
  const DEBUG = (qs.get("debug") === "1");
  const dbg = document.getElementById("dbg");
  if(DEBUG) dbg.style.display = "block";
  const log = (s)=>{ if(DEBUG) dbg.textContent = s; };

  const root = document.documentElement;

  /* Gate 1 muss vorhanden sein */
  const GATE1_OK = (localStorage.getItem("pforte1") === "true");

  /* Session */
  const SESSION_KEY = "aurion_session_id";
  let sessionId = localStorage.getItem(SESSION_KEY);
  if(!sessionId){
    sessionId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now()+"-"+Math.random());
    localStorage.setItem(SESSION_KEY, sessionId);
  }

  /* Aktivität */
  let activity = 0;
  let lastAct = Date.now();
  let stillMs = 0;

  function bump(w){
    activity += w;
    lastAct = Date.now();
  }

  ["mousemove","scroll","keydown"].forEach(ev=>{
    addEventListener(ev, ()=>bump(0.9), {passive:true});
  });
  ["click","touchstart","pointerdown"].forEach(ev=>{
    addEventListener(ev, ()=>{ bump(1.6); burstHit(); }, {passive:true});
  });

  setInterval(()=>{
    activity *= 0.86;
    if(activity < 0.02) activity = 0;
    stillMs = Date.now() - lastAct;
  }, 900);

  function isUnruhig(){ return activity > 7.5 || stillMs < 700; }
  function isAufmerksam(){ return activity < 2.4 && stillMs > 1800; }

  function attentionScore(){
    const calmPart = Math.max(0, Math.min(1, stillMs / 8000));
    const actPart  = 1 - Math.max(0, Math.min(1, activity / 10));
    return Math.round((0.6*calmPart + 0.4*actPart) * 100);
  }

  /* Fallback 7x/10s */
  let burstCount = 0, burstStart = 0;
  function burstHit(){
    const now = Date.now();
    if(!burstStart || now - burstStart > 10000){
      burstStart = now;
      burstCount = 0;
    }
    burstCount++;
    if(burstCount >= 7){
      burstCount = 0; burstStart = 0;
      if(GATE1_OK) markGate2Passed("fallback");
    }
  }

  /* Vars */
  let flash=0,fog=0,twist=0,sh=0;
  let flashT=0,fogT=0,twistT=0,shT=0;

  function setGate(on){ root.style.setProperty("--gate", on ? "1" : "0"); }
  function setGateGlow(v){ root.style.setProperty("--gateGlow", String(v)); }

  function applyVars(){
    root.style.setProperty("--flash", flash.toFixed(4));
    root.style.setProperty("--fog", fog.toFixed(4));
    root.style.setProperty("--twist", twist.toFixed(4));
    root.style.setProperty("--sh", sh.toFixed(4));
  }

  /* ====== Gadgets überall (GANZER Screen) ====== */
  const blinks = ["b1","b2","b3","b4","b5","b6","b7","b8"].map(id=>document.getElementById(id));
  const grid = document.getElementById("gridMoment");
  const ripple = document.getElementById("ripple");

  function rand(min,max){ return min + Math.random()*(max-min); }
  function px(v){ return v.toFixed(0)+"px"; }

  function placeBlink(el){
    const size = rand(110, 220);
    el.style.width = px(size);
    el.style.height = px(size);
    // überall, auch randnah:
    el.style.left = px(rand(-20, innerWidth - size + 20));
    el.style.top  = px(rand(-20, innerHeight - size + 20));
  }

  function blinkBurst(count, lifeMs){
    // mehrere Spots gleichzeitig an komplett zufälligen Stellen
    const picks = [];
    for(let i=0;i<count;i++){
      picks.push(blinks[Math.floor(Math.random()*blinks.length)]);
    }
    picks.forEach((el, idx)=>{
      placeBlink(el);
      el.classList.remove("off");
      el.classList.add("on");
      // kleine zeitliche Staffelung, damit es „lebt“
      setTimeout(()=>{
        el.classList.remove("on");
        el.classList.add("off");
      }, lifeMs + idx*90);
    });
  }

  function gadget_blitze_ecken(){
    flashT = 1.0;
    shT = 0.85;
    setTimeout(()=>{ flashT = 0.2; shT = 0.12; }, 180);
    setTimeout(()=>{ flashT = 0.85; shT = 0.55; }, 520);
    setTimeout(()=>{ flashT = 0.0; shT = 0.0; }, 980);
  }

  function gadget_verwirrung_spots(){
    // 6–8 Spots, überall: User muss ganzen Screen scannen
    const n = Math.floor(rand(6,9));
    blinkBurst(n, 900);
  }

  function gadget_verdichtung(){
    fogT = 0.95;
    twistT = Math.max(twistT, 0.45);
    setTimeout(()=>{ fogT = 0.35; }, 2600);
    setTimeout(()=>{ fogT = 0.00; twistT = 0.00; }, 4200);
  }

  function gadget_nachhall_welle(){
    // Ripple an zufälliger Stelle, 3x
    const x = px(rand(5, 95)) , y = px(rand(5, 95));
    root.style.setProperty("--rx", x);
    root.style.setProperty("--ry", y);
    ripple.classList.add("on");
    ripple.classList.remove("off");
    setTimeout(()=>{ ripple.classList.remove("on"); ripple.classList.add("off"); }, 300);

    setTimeout(()=>{
      const x2 = px(rand(5, 95)), y2 = px(rand(5, 95));
      root.style.setProperty("--rx", x2);
      root.style.setProperty("--ry", y2);
      ripple.classList.add("on"); ripple.classList.remove("off");
      setTimeout(()=>{ ripple.classList.remove("on"); ripple.classList.add("off"); }, 340);
    }, 620);

    setTimeout(()=>{
      const x3 = px(rand(5, 95)), y3 = px(rand(5, 95));
      root.style.setProperty("--rx", x3);
      root.style.setProperty("--ry", y3);
      ripple.classList.add("on"); ripple.classList.remove("off");
      setTimeout(()=>{ ripple.classList.remove("on"); ripple.classList.add("off"); }, 420);
    }, 1180);
  }

  function gadget_ordnungsMoment(){
    grid.classList.add("on");
    grid.classList.remove("off");
    // ganz kurz — wie "Plötzlich stimmt alles"
    setTimeout(()=>{
      grid.classList.remove("on");
      grid.classList.add("off");
    }, 520);
  }

  function gadget_kurzer_widerstand(){
    shT = 0.95;
    flashT = 0.35;
    setTimeout(()=>{ shT = 0.18; flashT = 0.0; }, 220);
    setTimeout(()=>{ shT = 0.0; }, 780);
  }

  function gadget_verzoegerung(){
    // erst NICHTS… dann plötzlich überall was
    const d = 900 + Math.random()*1200;
    setTimeout(()=>{
      gadget_verwirrung_spots();
      gadget_blitze_ecken();
    }, d);
  }

  function gadget_einsinken(){
    fogT = Math.max(fogT, 0.55);
    twistT = Math.max(twistT, 0.85);
    setTimeout(()=>{ twistT = 0.25; fogT = 0.18; }, 2600);
    setTimeout(()=>{ twistT = 0.00; fogT = 0.00; }, 4200);
  }

  const GADGETS = [
    {name:"Blitze", fn:gadget_blitze_ecken},
    {name:"Verwirrung", fn:gadget_verwirrung_spots},
    {name:"Verdichtung", fn:gadget_verdichtung},
    {name:"Verzögerung", fn:gadget_verzoegerung},
    {name:"Nachhall", fn:gadget_nachhall_welle},
    {name:"Ordnung", fn:gadget_ordnungsMoment},
    {name:"Einsinken", fn:gadget_einsinken},
    {name:"Widerstand", fn:gadget_kurzer_widerstand},
  ];

  function runRandomGadget(){
    const g = GADGETS[Math.floor(Math.random()*GADGETS.length)];
    g.fn();
    if(DEBUG) log("gadget: "+g.name+" | act="+activity.toFixed(1)+" still="+Math.round(stillMs)+"ms");
  }

  /* ====== Pforte 2 ====== */
  let gateOffer=false, gate2Passed=false, resonantStart=0;
  const enterAt = Date.now();

  function markGate2Passed(mode){
    if(gate2Passed) return;
    gate2Passed = true;

    const secondsHere = Math.round((Date.now() - enterAt)/1000);
    localStorage.setItem("aurion_pforte_2", JSON.stringify({
      passed:true,
      timestamp:Date.now(),
      mode,
      seconds_here: secondsHere,
      attention: attentionScore(),
      session: sessionId
    }));

    gateOffer = true;
    setGate(true);

    // spürbarer "Ja" Impuls: überall kurze Spots + Eckenblitz
    gadget_verwirrung_spots();
    gadget_blitze_ecken();
  }

  function resetGate2(){
    gate2Passed=false; resonantStart=0; gateOffer=false;
    setGate(false);
  }

  setInterval(()=>{
    if(!GATE1_OK) return;
    if(gate2Passed) return;

    // langsamer als früher: ~32s
    const resonant =
      activity > 1.0 && activity < 4.2 &&
      stillMs > 900 && stillMs < 6500;

    if(resonant){
      if(!resonantStart) resonantStart = Date.now();
      if(Date.now() - resonantStart > 32000){
        markGate2Passed("resonant");
      }
    } else {
      resonantStart = 0;
    }
  }, 650);

  /* Timing: Unruhe 7s, Aufmerksamkeit 15s (wie du willst) */
  let lastGadgetAt = 0;
  function gadgetInterval(){
    if(isUnruhig()) return 7000;
    if(isAufmerksam()) return 15000;
    return 12000;
  }

  setInterval(()=>{
    const now = Date.now();
    const base = gadgetInterval();
    const jitter = isUnruhig() ? 1400 : 2400;
    const interval = base + (Math.random()*jitter - jitter/2);

    if(now - lastGadgetAt >= interval){
      runRandomGadget();
      lastGadgetAt = now;
    }
  }, 700);

  /* Gate-Klickzone unten: rechts -> weiter, links -> bleiben (und P2 neu) */
  const gateZone = document.getElementById("gateZone");
  function handleGateChoice(x){
    if(!gateOffer) return;
    const right = x > innerWidth/2;
    if(right){
      setGate(false);
      setTimeout(()=>location.href="ki-raum.html", 420);
    }else{
      resetGate2();
    }
  }
  gateZone.addEventListener("pointerdown",(e)=>handleGateChoice(e.clientX),{passive:true});
  gateZone.addEventListener("touchstart",(e)=>{
    const t=e.touches && e.touches[0];
    if(t) handleGateChoice(t.clientX);
  },{passive:true});

  /* Gate-Glow anim */
  let gg = 0;
  function gateGlowLoop(){
    gg += 0.022;
    if(gateOffer){
      root.style.setProperty("--gateGlow", (0.55 + 0.45*Math.sin(gg)).toFixed(4));
    }else{
      root.style.setProperty("--gateGlow", "0");
    }
    requestAnimationFrame(gateGlowLoop);
  }
  gateGlowLoop();

  /* Soft Targets */
  function lerp(a,b,t){ return a+(b-a)*t; }
  function tick(){
    flash = lerp(flash, flashT, (flashT>flash)?0.22:0.12);
    fog   = lerp(fog,   fogT,   (fogT>fog)?0.10:0.06);
    twist = lerp(twist, twistT, (twistT>twist)?0.08:0.05);
    sh    = lerp(sh,    shT,    (shT>sh)?0.18:0.10);

    // Targets zurück
    flashT = lerp(flashT, 0, 0.06);
    shT    = lerp(shT,    0, 0.05);
    fogT   = lerp(fogT,   0, 0.03);
    twistT = lerp(twistT, 0, 0.02);

    applyVars();
    requestAnimationFrame(tick);
  }
  tick();

  /* Start: sofort „Aufmerksamkeit ziehen“ (Blitz + Spots überall) */
  setTimeout(()=>{
    gadget_blitze_ecken();
    gadget_verwirrung_spots();
    setTimeout(()=>gadget_nachhall_welle(), 600);
  }, 150);

})();
</script>

</body>
</html>
