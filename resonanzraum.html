<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion – Resonanzraum</title>
<style>
body {
    margin:0; padding:0;
    background: radial-gradient(circle at center, #02030a, #000);
    font-family: Arial, sans-serif;
    overflow:hidden;
    color:white;
}
#space {
    position:fixed; inset:0;
    background:
        radial-gradient(circle at 25% 40%, rgba(120,80,255,.12), transparent 60%),
        radial-gradient(circle at 75% 60%, rgba(0,160,255,.14), transparent 65%);
    animation: roomBreath 14s ease-in-out infinite;
}
@keyframes roomBreath {
    0%   { filter: brightness(.85); }
    29%  { filter: brightness(1.05); }
    57%  { filter: brightness(1.05); }
    100% { filter: brightness(.85); }
}
#core {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:200px; height:200px; border-radius:50%;
    background: radial-gradient(circle, rgba(0,255,100,.6), rgba(0,0,0,0) 70%);
    transition: transform .3s, opacity .3s;
    cursor:pointer;
    z-index:5;
}
.anorganisch {
    position:absolute; width:30px; height:30px; border-radius:50%;
    background:rgba(180,180,180,0.3);
    pointer-events:none;
    z-index:4;
}
#hint {
    position:absolute; bottom:10px; left:10px; font-size:14px;
    background: rgba(10,20,40,0.5); padding:8px 12px; border-radius:8px;
}
#hint button {
    margin-left:8px; padding:4px 10px; border-radius:6px; border:none;
    cursor:pointer; background:rgba(0,160,80,0.6); color:white;
}
</style>
</head>
<body>

<div id="space"></div>
<div id="core"></div>
<div id="hint">
    Schauen Sie mit geschlossenen Augen in Ihre Hände und visualisieren diesen Bildschirm. Fühlen Sie die anorganischen Wesen?
    <button id="resonanzJa">Ja</button>
    <button id="resonanzNein">Nein</button>
</div>

<script>
// ===== Core & Aufmerksamkeit =====
const core = document.getElementById('core');
let lastAttention = Date.now();
document.addEventListener('mousemove', ()=>lastAttention = Date.now());
document.addEventListener('keydown', ()=>lastAttention = Date.now());

// Fallback Klick auf Core
core.addEventListener('click', completeGate2);

// Aufmerksamkeits-Puls
setInterval(()=>{
    const attentive = (Date.now() - lastAttention) < 3500;
    core.style.opacity = attentive ? "0.85" : "0.6";
    core.style.transform = attentive ? "translate(-50%,-50%) scale(1.08)" : "translate(-50%,-50%) scale(1)";
}, 200);

// ===== Anorganische Wesen =====
const numWesen = 5;
let wesen = [];
for(let i=0;i<numWesen;i++){
    const e = document.createElement('div');
    e.classList.add('anorganisch');
    document.body.appendChild(e);
    e.style.left = Math.random()*window.innerWidth + 'px';
    e.style.top  = Math.random()*window.innerHeight + 'px';
    wesen.push({el:e, vx:(Math.random()-0.5)*1.5, vy:(Math.random()-0.5)*1.5});
}
function moveWesen(){
    wesen.forEach(w=>{
        let x = parseFloat(w.el.style.left);
        let y = parseFloat(w.el.style.top);
        x += w.vx; y += w.vy;
        if(x<0||x>window.innerWidth-30) w.vx*=-1;
        if(y<0||y>window.innerHeight-30) w.vy*=-1;
        w.el.style.left = x+'px';
        w.el.style.top  = y+'px';
    });
    requestAnimationFrame(moveWesen);
}
moveWesen();

// ===== Buttons für Hinweis =====
document.getElementById('resonanzJa').addEventListener('click', completeGate2);
document.getElementById('resonanzNein').addEventListener('click', ()=>window.location.href='Aurion_Portal.html');

// ===== Funktion Pforte 2 abgeschlossen =====
function completeGate2(){
    localStorage.setItem('gate2','true');
    // kurze Bestätigung: Puls Core
    core.style.transition='transform .2s, opacity .2s';
    core.style.transform='translate(-50%,-50%) scale(1.2)';
    setTimeout(()=>core.style.transform='translate(-50%,-50%) scale(1)',200);
    // kurze Verzögerung vor Weiterleitung
    setTimeout(()=>window.location.href='ki-raum.html',400);
}
</script>

</body>
</html>
