<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion – Resonanzraum</title>

<style>
body {
    margin:0;
    background: radial-gradient(circle at center, #02030a, #000);
    font-family: Arial, sans-serif;
    color: #cfefff;
    overflow:hidden;
}

/* Vollbild-Prompt */
#fullscreenPrompt {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}
.prompt-box {
    background: rgba(20,40,80,0.35);
    border: 1px solid rgba(120,180,255,0.35);
    border-radius: 14px;
    padding: 26px 32px;
    text-align: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 40px rgba(120,200,255,0.25);
}
.prompt-box h2 { margin:0 0 14px; font-weight: normal; color:#aee9ff; }
.prompt-box button {
    margin: 10px; padding: 8px 18px;
    border-radius:8px; border:1px solid rgba(160,220,255,0.4);
    background: rgba(100,160,220,0.25); color:#e6f7ff;
    cursor:pointer; font-size:15px; transition: background 0.3s, box-shadow 0.3s;
}
.prompt-box button:hover { background: rgba(140,200,255,0.4); box-shadow:0 0 14px rgba(120,200,255,0.5); }

/* Raum */
#space {
    position: fixed; inset:0;
    background:
      radial-gradient(circle at 25% 40%, rgba(120,80,255,.12), transparent 60%),
      radial-gradient(circle at 75% 60%, rgba(0,160,255,.14), transparent 65%);
    animation: roomBreath 14s ease-in-out infinite;
}
@keyframes roomBreath {0%{filter:brightness(.85);}30%{filter:brightness(1.05);}60%{filter:brightness(1.05);}100%{filter:brightness(.85);}}

#center {position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
#core {
    width:200px; height:200px; border-radius:50%;
    background: radial-gradient(circle at center, rgba(0,200,0,.35), rgba(0,0,0,0) 70%);
    transition: opacity .6s ease, transform .6s ease;
}

/* Glyphen */
#glyph-field {position:absolute; top:10%; width:100%; text-align:center; pointer-events:none;}
.glyph {display:inline-block; font-size:44px; margin:0 6px; opacity:.4; filter:blur(.4px); animation: glyphFloat 14s ease-in-out infinite;}
@keyframes glyphFloat {0%{transform:translateY(0) rotate(0deg); opacity:.3;}50%{transform:translateY(-10px) rotate(6deg); opacity:.7;}100%{transform:translateY(0) rotate(0deg); opacity:.3;}}

/* Anorganische Wesen */
.anorganisch {
    position:absolute; width:20px; height:20px; border-radius:50%;
    background:rgba(200,200,200,0.35);
    animation: moveWesen 20s linear infinite;
}
@keyframes moveWesen {
    0% {transform: translate(0,0);}
    25% {transform: translate(80vw,10vh);}
    50% {transform: translate(60vw,70vh);}
    75% {transform: translate(20vw,80vh);}
    100% {transform: translate(0,0);}
}

/* Cloud-Text */
#cloud-text {position:absolute; bottom:26px; left:10px; font-size:15px; color:rgba(0,0,0,0.45);}
</style>
</head>

<body>

<div id="fullscreenPrompt">
  <div class="prompt-box">
    <h2>Resonanzraum im Vollbild öffnen?</h2>
    <button onclick="enterFullscreen()">Ja</button>
    <button onclick="continueNormal()">Nein</button>
  </div>
</div>

<div id="space"></div>
<div id="glyph-field"></div>
<div id="center"><div id="core"></div></div>
<div id="cloud-text">Schauen Sie mit geschlossenen Augen in Ihre Hände und visualisieren diesen Bildschirm.</div>

<script>
// Vollbild
function enterFullscreen(){document.documentElement.requestFullscreen?.(); document.getElementById("fullscreenPrompt").remove();}
function continueNormal(){document.getElementById("fullscreenPrompt").remove();}

// Glyphen
const glyphPools = [["⟡","⟁","⟢","⟣","⟠","⟟"],["◬","◭","◮","◯","◰"],["⨀","⨁","⨂","⨃"],["⌬","⌭","⌮"],["ᚦ","ᚨ","ᚱ","ᛉ"],["𓂀","𓂂","𓂁"]];
const field=document.getElementById("glyph-field");
function spawnGlyphs(){field.innerHTML=""; const set=glyphPools[Math.floor(Math.random()*glyphPools.length)]; set.forEach(s=>{const g=document.createElement("span"); g.className="glyph"; g.textContent=s; g.style.animationDuration=(10+Math.random()*10)+"s"; field.appendChild(g);});}
spawnGlyphs(); setInterval(spawnGlyphs,12000);

// Anorganische Wesen
const anorg=[];
for(let i=0;i<5;i++){const w=document.createElement("div"); w.className="anorganisch"; w.style.top=Math.random()*80+"vh"; w.style.left=Math.random()*80+"vw"; document.body.appendChild(w); anorg.push(w);}

// Aufmerksamkeits-Logik
let lastAttention=Date.now();
const core=document.getElementById("core");
document.addEventListener("mousemove",()=>lastAttention=Date.now());
setInterval(()=>{
    const attentive=(Date.now()-lastAttention)<3500;
    core.style.opacity=attentive?".85":".6";
    core.style.transform=attentive?"scale(1.08)":"scale(1)";
},500);

// Fallback-Klopfen
let tapCount=0;
let lastTap=0;
document.addEventListener("keydown",(e)=>{
    const now=Date.now();
    if(now-lastTap>1500){tapCount=0;}
    lastTap=now;
    if(e.key===" "){tapCount++; checkPforte();}
});
function checkPforte(){
    // Fallback: 2x-1x-2x
    if(tapCount===5){ // beispielhaft
        completePforte2();
    }
}

// Pforte abgeschlossen
function completePforte2(){
    localStorage.setItem("pforte2","true");
    alert("Zweite Pforte geschafft! Weiterleitung zum KI-Raum…");
    window.location.href="ki-raum.html";
}
</script>

</body>
</html>
