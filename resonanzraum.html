<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion – Resonanzraum</title>

<style>
/* ================= BASIS ================= */
body {
    margin: 0;
    background: radial-gradient(circle at center, #02030a, #000);
    font-family: Arial, sans-serif;
    overflow: hidden;
}

/* ================= ZUGANGSPRÜFUNG ================= */
#blocked {
    position:fixed;
    inset:0;
    background:#000;
    color:#8fbfff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    letter-spacing:1px;
}

/* ================= RAUM ================= */
#space {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 30% 40%, rgba(120,80,255,.12), transparent 60%),
        radial-gradient(circle at 70% 60%, rgba(0,160,255,.14), transparent 65%);
    animation: roomBreath 14s ease-in-out infinite;
}

@keyframes roomBreath {
    0%   { filter: brightness(.85); }
    50%  { filter: brightness(1.05); }
    100% { filter: brightness(.85); }
}

/* ================= ZENTRUM ================= */
#center {
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
}

#core {
    width:200px;
    height:200px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(0,200,255,.35), transparent 70%);
    animation: coreBreath 14s ease-in-out infinite;
    transition: transform 1s ease, opacity 1s ease;
}

@keyframes coreBreath {
    0%{transform:scale(1);opacity:.6}
    50%{transform:scale(1.14);opacity:.9}
    100%{transform:scale(.96);opacity:.5}
}

/* ================= GLYPHEN ================= */
#glyph-field {
    position:absolute;
    top:10%;
    width:100%;
    text-align:center;
    pointer-events:none;
}

.glyph {
    display:inline-block;
    font-size:44px;
    margin:0 6px;
    opacity:.4;
    animation:glyphFloat 14s ease-in-out infinite;
}

@keyframes glyphFloat {
    0%{transform:translateY(0) rotate(0);opacity:.3}
    50%{transform:translateY(-10px) rotate(6deg);opacity:.7}
    100%{transform:translateY(0) rotate(0);opacity:.3}
}

/* ================= ANORGANISCHE WESEN ================= */
.being {
    position:absolute;
    width:18px;
    height:18px;
    border-radius:50%;
    filter: blur(2px);
    opacity:.35;
    animation: drift 22s linear infinite;
}

@keyframes drift {
    from { transform: translate(0,0); }
    to   { transform: translate(120px,-160px); }
}
</style>
</head>

<body>

<script>
/* ================= ZUGANG 1. PFORTE ================= */
if(localStorage.getItem("aurion_pforte_1")!=="true"){
    document.body.innerHTML =
      '<div id="blocked">Der Raum erkennt dich noch nicht.</div>';
    setTimeout(()=>window.location.href="Aurion_Portal.html",4000);
}
</script>

<div id="space"></div>
<div id="glyph-field"></div>

<div id="center">
    <div id="core"></div>
</div>

<script>
/* ================= GLYPHEN ================= */
const glyphPools = [
 ["⟡","⟁","⟢","⟣","⟠","⟟"],
 ["◬","◭","◮","◯","◰"],
 ["ᚦ","ᚨ","ᚱ","ᛉ"],
 ["𓂀","𓂂","𓂁"]
];

const field = document.getElementById("glyph-field");
function spawnGlyphs(){
  field.innerHTML="";
  const set=glyphPools[Math.floor(Math.random()*glyphPools.length)];
  set.forEach(s=>{
    const g=document.createElement("span");
    g.className="glyph";
    g.textContent=s;
    g.style.animationDuration=(10+Math.random()*10)+"s";
    field.appendChild(g);
  });
}
spawnGlyphs();
setInterval(spawnGlyphs,12000);

/* ================= ANORGANISCHE WESEN ================= */
let beings=[];
function spawnBeing(extra=false){
  const b=document.createElement("div");
  b.className="being";
  b.style.left=Math.random()*100+"%";
  b.style.top=Math.random()*100+"%";
  b.style.background=extra?"rgba(180,255,220,.6)":"rgba(120,180,255,.5)";
  document.body.appendChild(b);
  beings.push(b);
}
for(let i=0;i<5;i++) spawnBeing();

/* ================= AUFMERKSAMKEIT ================= */
let lastMove=Date.now();
document.addEventListener("mousemove",()=>lastMove=Date.now());

let resonanceTime=0;
let sixthCreated=false;

setInterval(()=>{
  const attentive=(Date.now()-lastMove)<3000;
  if(attentive){
    resonanceTime+=500;
    if(resonanceTime>7000 && !sixthCreated){
      sixthCreated=true;
      spawnBeing(true);
      silentConfirmation();
    }
  } else {
    resonanceTime=Math.max(0,resonanceTime-1000);
  }
},500);

/* ================= STILLE BESTÄTIGUNG ================= */
function silentConfirmation(){
  const core=document.getElementById("core");
  core.style.transition="transform 4s ease, opacity 4s ease";
  core.style.transform="scale(1)";
  core.style.opacity=".4";

  document.getElementById("space").style.animationDuration="28s";
  document.querySelectorAll(".glyph").forEach(g=>{
    g.style.opacity=".15";
  });

  localStorage.setItem("aurion_pforte_2","true");

  setTimeout(()=>{
    window.location.href="ki-raum.html";
  },6000);
}
</script>

</body>
</html>
