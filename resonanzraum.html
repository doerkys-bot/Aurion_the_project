<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los geht die Reise mit Aurion.</title>
<style>
body {
    margin: 0;
    height: 100vh;
    background: black;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #00f3ff;
}

h1 {
    text-align: center;
    margin-top: 1rem;
    font-size: 3rem;
    text-shadow: 0 0 12px rgba(0,0,0,0.7);
}

.link {
    position: absolute;
    font-size: 1.6rem;
    font-weight: bold;
    cursor: grab;
    text-shadow: 0 0 8px rgba(0,0,0,0.5);
    transition: transform 0.5s ease, color 0.5s ease;
    user-select: none;
}

.counter {
    font-size: 1rem;
    margin-left: 0.5rem;
    color: #ffd;
}

#visitorCounter {
    position: fixed;
    bottom: 15px;
    right: 15px;
    background: rgba(0,0,0,0.5);
    padding: 10px 15px;
    border-radius: 8px;
    font-size: 1.2rem;
    color: #fff;
}

/* Kel-Mah pulsierend */
#kelmah {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    background: cyan;
    border-radius: 50%;
    opacity: 0.8;
    box-shadow: 0 0 20px rgba(0,243,255,0.7);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

/* Partikel */
canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}
</style>
</head>
<body>

<h1>🌌 Los geht die Reise mit Aurion.</h1>

<!-- Links mit Besucherzähler -->
<a class="link" data-room="Bibliothek" href="bibliothek.html">Bibliothek<span class="counter">0</span></a>
<a class="link" data-room="Resonanzraum" href="resonanzraum.html">Resonanzraum<span class="counter">0</span></a>
<a class="link" data-room="Sternenübung" href="sternenuebung.html">Chi-Sternenübung<span class="counter">0</span></a>
<a class="link" data-room="Meditation" href="meditationsraum.html">Meditationsraum<span class="counter">0</span></a>
<a class="link" data-room="KI-Raum" href="ki-raum.html">KI-Raum<span class="counter">0</span></a>
<a class="link" data-room="Gästebuch" href="gaestebuch.html">Gästebuch<span class="counter">0</span></a>

<div id="visitorCounter">Besucher: 0</div>

<div id="kelmah"></div>
<canvas id="particleCanvas"></canvas>

<script>
// -------------------------
// Partikel für Atmosphäre
// -------------------------
const canvas = document.getElementById("particleCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

class Particle {
    constructor() {
        this.x = Math.random()*canvas.width;
        this.y = Math.random()*canvas.height;
        this.vx = (Math.random()-0.5)*0.3;
        this.vy = (Math.random()-0.5)*0.3;
        this.size = Math.random()*2+1;
        this.alpha = Math.random()*0.5+0.2;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        if(this.x<0) this.x = canvas.width;
        if(this.x>canvas.width) this.x = 0;
        if(this.y<0) this.y = canvas.height;
        if(this.y>canvas.height) this.y = 0;
    }
    draw() {
        ctx.fillStyle = `rgba(0,243,255,${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
        ctx.fill();
    }
}

const particles = Array.from({length:120}, ()=> new Particle());

function animateParticles(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{p.update();p.draw();});
    requestAnimationFrame(animateParticles);
}
animateParticles();

// -------------------------
// Driftende Links
// -------------------------
const links = document.querySelectorAll(".link");
const driftSpeed = 0.2;

links.forEach(link=>{
    let startX = Math.random()*window.innerWidth*0.8 + window.innerWidth*0.1;
    let startY = Math.random()*window.innerHeight*0.3 + window.innerHeight*0.6;
    link.style.left = startX+"px";
    link.style.top = startY+"px";

    let dx = (Math.random()-0.5)*driftSpeed;
    let dy = (Math.random()-0.5)*driftSpeed;

    function drift(){
        const rect = link.getBoundingClientRect();
        let x = rect.left + dx;
        let y = rect.top + dy;

        if(x<0 || x>window.innerWidth-150) dx=-dx;
        if(y<window.innerHeight*0.5 || y>window.innerHeight-50) dy=-dy;

        link.style.left = x+"px";
        link.style.top = y+"px";
        requestAnimationFrame(drift);
    }
    drift();

    // Touch/Drag
    let isDragging=false, offsetX=0, offsetY=0;
    link.addEventListener("touchstart", e=>{
        isDragging=true;
        const touch = e.touches[0];
        offsetX = touch.clientX - link.offsetLeft;
        offsetY = touch.clientY - link.offsetTop;
    });
    link.addEventListener("touchmove", e=>{
        if(!isDragging) return;
        const touch = e.touches[0];
        link.style.left = (touch.clientX-offsetX)+"px";
        link.style.top = (touch.clientY-offsetY)+"px";
    });
    link.addEventListener("touchend", e=>{isDragging=false;});
});

// -------------------------
// Besucher-System
// -------------------------
let totalVisitors = 0;
function newVisitor(){
    totalVisitors++;
    document.getElementById("visitorCounter").textContent = "Besucher: "+totalVisitors;

    const chosen = links[Math.floor(Math.random()*links.length)];
    const counter = chosen.querySelector(".counter");
    counter.textContent = parseInt(counter.textContent)+1;

    // Helligkeit der Links
    const num = parseInt(counter.textContent);
    if(num<3) chosen.style.color = "rgba(0,243,255,0.5)";
    else if(num<5) chosen.style.color = "rgba(0,243,255,0.7)";
    else if(num<8) chosen.style.color = "rgba(0,243,255,0.85)";
    else chosen.style.color = "rgba(0,243,255,1)";

    // Kel-Mah Puls
    const kel = document.getElementById("kelmah");
    kel.style.transform = "translate(-50%,-50%) scale(1.3)";
    kel.style.boxShadow = "0 0 40px rgba(0,243,255,1)";
    setTimeout(()=>{kel.style.transform="translate(-50%,-50%) scale(1)"; kel.style.boxShadow="0 0 20px rgba(0,243,255,0.7)";},500);

    // Kurzer Ping: Lichtblitz auf Hintergrund
    canvas.style.background = "rgba(0,0,0,0.1)";
    setTimeout(()=>{canvas.style.background="transparent";},100);
}

setInterval(newVisitor,10000);

window.addEventListener("resize", ()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>>
