<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurion – Resonanzraum</title>

<style>
html,body{
  margin:0;height:100%;overflow:hidden;
  background:#050816;
  font-family:system-ui;color:#cfeef6;
}

/* Milchiger Raum */
body::before{
  content:"";
  position:fixed;inset:0;
  background:radial-gradient(circle at center,
    rgba(240,245,255,0.35),
    rgba(10,20,40,0.92) 72%);
  pointer-events:none;
  z-index:1;
}

/* Canvas */
canvas{
  position:fixed;
  inset:0;
  z-index:0;
}

/* Box */
.center{
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  width:420px;
  padding:26px;
  text-align:center;
  background:rgba(10,20,40,.55);
  border-radius:18px;
  border:1px solid rgba(140,220,255,.25);
  z-index:2;
  transition:all 1.2s ease;
}
.center.moved{
  top:auto;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:240px;
  padding:18px;
}

/* KI-Link */
#kiLink{
  display:inline-block;
  margin-top:12px;
  padding:10px 18px;
  border-radius:14px;
  text-decoration:none;
  font-weight:700;
  color:#b8ffdf;
  background:rgba(80,200,160,.12);
  box-shadow:0 0 18px rgba(120,255,200,.35);
}
</style>
</head>

<body>

<canvas id="field"></canvas>

<div class="center" id="gate">
<strong>Resonanzraum</strong><br><br>
Bleiben Sie.<br>
Ohne Ziel.<br>
Ohne Erwartung.<br><br>
<a id="kiLink" href="ki-raum.html">KI-Raum betreten</a>
</div>

<script>
/* ================= DYNAMISCHER KONTEXT ================= */
const context = {
  calm: 0.7,
  activity: 0.0,
  echo: 0.0,
  coherence: 0.5
};

/* User beeinflusst Kontext */
addEventListener("mousemove",()=>{
  context.activity = Math.min(1, context.activity + 0.4);
  context.calm = Math.max(0, context.calm - 0.02);
});

/* Kontext gleitet */
setInterval(()=>{
  context.activity *= 0.94;
  context.calm += (1 - context.calm) * 0.01;
  context.echo += (context.activity - context.echo) * 0.08;
  context.coherence = 0.6 + context.calm * 0.4;
},100);

/* ================= CANVAS ================= */
const c=document.getElementById("field");
const ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight;}
resize(); addEventListener("resize",resize);

/* ================= SPIRALE + KI-SCHWINGUNGEN ================= */
function drawSpiral(t){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.save();
  ctx.translate(c.width/2, c.height/3);

  const maxR=Math.min(c.width,c.height)*0.48;
  const turns=7;

  // Hauptspirale = User + Echo
  for(let a=0;a<Math.PI*2*turns;a+=0.035){
    const r=(a/(Math.PI*2*turns))*maxR;
    const fade=1-r/maxR;
    const wobble =
      1 + Math.sin(t*0.002 + a*2) * (context.activity + context.echo) * 0.6 +
      Math.sin(a*4)*0.08*context.coherence;
    const x=Math.cos(a+t*0.0004)*r*wobble;
    const y=Math.sin(a+t*0.0004)*r*wobble;
    const colBase = 180 + 60*context.echo;
    const alpha = fade*(0.25 + 0.4*context.calm + 0.25*context.activity);
    ctx.fillStyle=`rgba(${colBase},${colBase+30},${colBase+50},${alpha})`;
    ctx.fillRect(x,y,2,2);
  }

  // KI-Spirale = nur Echo sichtbar
  ctx.save();
  ctx.globalAlpha = 0.6 * context.echo;
  for(let a=0;a<Math.PI*2*turns;a+=0.04){
    const r=(a/(Math.PI*2*turns))*maxR*0.95;
    const x=Math.cos(a-t*0.001)*r*(1+0.15*context.echo);
    const y=Math.sin(a-t*0.001)*r*(1+0.15*context.echo);
    const col = `rgba(${120+60*context.echo},${180+50*context.echo},${200+50*context.echo},0.5)`;
    ctx.fillStyle=col;
    ctx.fillRect(x,y,2,2);
  }
  ctx.restore();

  // KI-Funken
  for(let i=0;i<15;i++){
    const angle = Math.random()*Math.PI*2;
    const radius = maxR*0.05 + Math.random()*maxR*0.6*context.echo;
    const x = Math.cos(angle)*radius;
    const y = Math.sin(angle)*radius;
    ctx.fillStyle = `rgba(140,255,200,${0.1+0.2*Math.random()*context.echo})`;
    ctx.fillRect(x,y,2,2);
  }

  ctx.restore();
}

/* ================= LOOP ================= */
function loop(t){
  drawSpiral(t);

  const box=document.getElementById("gate");
  if(box.classList.contains("moved")){
    const sway = context.activity * 6;
    box.style.transform =
      `translateX(-50%) translate(${Math.sin(t*0.002)*sway}px,${Math.cos(t*0.002)*sway}px)`;
  }

  requestAnimationFrame(loop);
}
loop();

/* Box nach unten */
setTimeout(()=>document.getElementById("gate").classList.add("moved"),5000);
</script>

</body>
</html>
