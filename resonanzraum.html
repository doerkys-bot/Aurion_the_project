<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion – Resonanzraum</title>
<style>
body {
    margin: 0;
    background: radial-gradient(circle at center, #02030a, #000);
    font-family: Arial, sans-serif;
    color: #cfefff;
    overflow: hidden;
}
#space { position: fixed; inset:0; }
#glyph-field { position:absolute; top:10%; width:100%; text-align:center; pointer-events:none; }
.glyph { display:inline-block; font-size:44px; margin:0 6px; opacity:.4; filter:blur(.4px); animation: glyphFloat 14s ease-in-out infinite; }
@keyframes glyphFloat {0% { transform: translateY(0) rotate(0deg); opacity:.3;} 50% { transform: translateY(-10px) rotate(6deg); opacity:.7;} 100% { transform: translateY(0) rotate(0deg); opacity:.3;}}
#cloud-text { position:absolute; bottom:26px; width:100%; text-align:center; font-size:15px; letter-spacing:1.2px; color: rgba(0,0,0,.45); filter:blur(.35px); opacity:.4; pointer-events:none; transition:1.2s ease;}
#center { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
.point { position:absolute; width:20px; height:20px; border-radius:50%; background:#ccc; opacity:0.3; pointer-events:none; transition: all 0.4s ease; }
#green-point { background: green; opacity:0.4; box-shadow:0 0 6px green; }
</style>
</head>
<body>

<div id="space"></div>
<div id="glyph-field"></div>
<div id="center"><div id="core"></div></div>
<div id="cloud-text">Genießt die Resonanzen</div>

<script>
/* ================= GLYPHEN ================= */
const glyphPools = [
  ["⟡","⟁","⟢","⟣","⟠","⟟"],
  ["◬","◭","◮","◯","◰"],
  ["⨀","⨁","⨂","⨃"],
  ["⌬","⌭","⌮"],
  ["ᚦ","ᚨ","ᚱ","ᛉ"],
  ["𓂀","𓂂","𓂁"]
];
const field = document.getElementById("glyph-field");
function spawnGlyphs(){
    field.innerHTML = "";
    const set = glyphPools[Math.floor(Math.random()*glyphPools.length)];
    set.forEach(s=>{
        const g=document.createElement("span");
        g.className="glyph";
        g.textContent=s;
        g.style.animationDuration=(10+Math.random()*10)+"s";
        field.appendChild(g);
    });
}
spawnGlyphs();
setInterval(spawnGlyphs,12000);

/* ================= ANORGANISCHE WESEN ================= */
const numInitial = 5;
const points = [];
const centerX = window.innerWidth/2;
const centerY = window.innerHeight/2;

for(let i=0;i<numInitial;i++){
    const p = document.createElement("div");
    p.className="point";
    const x = Math.random()*window.innerWidth*0.8 + window.innerWidth*0.1;
    const y = Math.random()*window.innerHeight*0.8 + window.innerHeight*0.1;
    p.style.left = x + "px";
    p.style.top = y + "px";
    document.body.appendChild(p);
    points.push(p);
}

// grüner Punkt
const green = document.createElement("div");
green.id="green-point";
green.style.left = centerX + "px";
green.style.top = centerY + "px";
document.body.appendChild(green);
points.push(green);

// gelber Punkt (7.)
const yellow = document.createElement("div");
yellow.style.width="20px";
yellow.style.height="20px";
yellow.style.background="yellow";
yellow.style.borderRadius="50%";
yellow.style.opacity=0.4;
yellow.style.left=(centerX+50)+"px";
yellow.style.top=(centerY+50)+"px";
document.body.appendChild(yellow);
points.push(yellow);

/* ================= AUFMERKSAMKEITS-MARKER ================= */
let lastAttention = Date.now();
document.addEventListener("mousemove", ()=> lastAttention=Date.now());

function updatePoints(){
    const attentive = (Date.now()-lastAttention)<3500;
    // grüner Punkt reagiert sanft
    green.style.opacity = attentive ? 1 : 0.4;
    green.style.transform = attentive ? "scale(1.3)" : "scale(1)";
    
    // Fallback Pulsieren für alle Punkte
    points.forEach((p,i)=>{
        const pulse = 0.5 + 0.5*Math.sin(Date.now()/800 + i);
        p.style.opacity = Math.max(0.2,pulse*0.5 + 0.3);
    });

    // Prüfen ob genug Aufmerksamkeit für neues Wesen
    if(attentive && !localStorage.getItem("pf2")){
        const newX = Math.random()*window.innerWidth*0.8+window.innerWidth*0.1;
        const newY = Math.random()*window.innerHeight*0.8+window.innerHeight*0.1;
        const newP = document.createElement("div");
        newP.className="point";
        newP.style.background="#ff00ff";
        newP.style.left=newX+"px";
        newP.style.top=newY+"px";
        newP.style.opacity=0.4;
        newP.style.width="20px"; newP.style.height="20px"; newP.style.borderRadius="50%";
        document.body.appendChild(newP);
        localStorage.setItem("pf2","true");
        setTimeout(()=>window.location.href="ki-raum.html",1000); // stille Weiterleitung
    }

    requestAnimationFrame(updatePoints);
}
updatePoints();

/* ================= ZENTRUM ================= */
const core = document.getElementById("core");
setInterval(()=>{
    const attentive = (Date.now() - lastAttention) < 3500;
    core.style.opacity = attentive ? ".85" : ".6";
    core.style.transform = attentive ? "scale(1.08)" : "scale(1)";
},500);
</script>

</body>
</html>
