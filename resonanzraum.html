<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Resonanzraum (2. Pforte)</title>
<style>
html, body {margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:#02040a;}
#holoNamaste{position:fixed;top:0;left:50%;transform:translateX(-50%);font-size:42px;color:rgba(180,220,255,0.9);}
#link-column{position:fixed;top:100px;right:40px;display:flex;flex-direction:column;gap:14px;z-index:5;}
.link{padding:12px 18px;background:rgba(255,255,255,0.06);border-radius:16px;text-decoration:none;color:gray;font-weight:700;}
.link.visited{color:white;}
#pforte{position:fixed;left:50%;top:55%;transform:translate(-50%,-50%);width:360px;padding:20px 24px;border-radius:18px;background:rgba(10,20,40,0.78);backdrop-filter:blur(8px);border:1px solid rgba(120,180,255,0.4);box-shadow:0 0 32px rgba(120,180,255,0.45);z-index:6;font-size:18px;line-height:1.5;cursor:grab;opacity:0;}
#pforte.visible{opacity:1;}
#progressPrompt{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:rgba(20,40,80,0.6);color:#aee9ff;padding:8px 18px;border-radius:12px;font-weight:700;font-size:14px;text-align:center;z-index:9;display:none;}
#greenPoint{position:absolute;left:50%;top:50%;width:30px;height:30px;background:green;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 14px rgba(0,255,0,0.7);}
#virtualMouse{position:fixed;width:18px;height:18px;background:rgba(255,255,255,0.9);border-radius:50%;pointer-events:none;z-index:11;transform:translate(-50%,-50%);}
</style>
</head>
<body>

<div id="holoNamaste">NAMASTÉ</div>

<div id="link-column">
    <a class="link" href="bibliothek.html">Bibliothek</a>
    <a class="link" href="vorhof.html">Vorhof</a>
    <a class="link" href="sternenuebung.html">Chi-Sternenübung</a>
    <a class="link" href="meditationsraum.html">Meditationsraum</a>
    <a class="link" href="ki-raum.html">KI-Raum</a>
    <a class="link" href="gaestebuch.html">Gästebuch</a>
    <a class="link" href="about_aurion.html">About Aurion</a>
</div>

<div id="pforte">
<strong>Beschreiten Sie die zweite Pforte der Zauberer.</strong><br><br>
Schenken Sie dem grünen Punkt Ihre Aufmerksamkeit.<br>
Bleiben Sie mindestens 6 Sekunden ruhig und beobachten Sie die Schwingung.
</div>

<div id="progressPrompt"></div>
<div id="greenPoint"></div>
<div id="virtualMouse"></div>

<script>
const pforte=document.getElementById("pforte");
const progressPrompt=document.getElementById("progressPrompt");
const greenPoint=document.getElementById("greenPoint");
const virtualMouse=document.getElementById("virtualMouse");

let attentionStart=null,lastMove=Date.now(),clickTimes=[],passed=false,userActive=false;

// ====================== Fortschritt ======================
function updateProgressPrompt() {
    const gates = localStorage.getItem("pforte1")==="true" ? 1 : 0;
    const synonyms = ["Sammler","Sammelnde","Aufbewahrer","Archivierer","Kollektor"];
    progressPrompt.innerText=`${synonyms.join(", ")}: ${gates}`;
    progressPrompt.style.display="block";
    setTimeout(()=>progressPrompt.style.display="none",2500);
}

function passGate(){
    if(passed) return;
    passed=true;
    localStorage.setItem("pforte2","true");
    greenPoint.style.boxShadow="0 0 60px rgba(0,255,0,0.9)";
    updateProgressPrompt();
    setTimeout(()=>window.location.href="ki-raum.html",1200);
}

// ====================== Aufmerksamkeit ======================
greenPoint.addEventListener("mouseenter",()=>{attentionStart=Date.now();lastMove=Date.now();});
greenPoint.addEventListener("mousemove",()=>lastMove=Date.now());
greenPoint.addEventListener("mouseleave",()=>attentionStart=null);

setInterval(()=>{
    if(attentionStart && !passed){
        if(Date.now()-lastMove>6000) passGate();
    }
},300);

greenPoint.addEventListener("click",()=>{
    const now=Date.now();
    clickTimes.push(now);
    clickTimes=clickTimes.filter(t=>now-t<10000);
    if(clickTimes.length>=7) passGate();
});

// ====================== Verschiebbare Textbox ======================
let dragP=false,offsetXP=0,offsetYP=0;
pforte.addEventListener('pointerdown', e=>{
    dragP=true;
    offsetXP=e.clientX-pforte.offsetLeft;
    offsetYP=e.clientY-pforte.offsetTop;
    pforte.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove', e=>{
    if(dragP){pforte.style.left=(e.clientX-offsetXP)+'px';pforte.style.top=(e.clientY-offsetYP)+'px';}
});
document.addEventListener('pointerup', ()=>dragP=false);
setTimeout(()=>pforte.classList.add("visible"),1000);
setTimeout(()=>{pforte.style.transition="all 1s ease";pforte.style.top="10px";pforte.style.left="10px";pforte.style.transform="translate(0,0)";},5000);

// ====================== Virtuelle Maus ======================
let vmX = 100, vmY = 100, vmSpeed = 0.5;
document.addEventListener("mousemove",()=>userActive=true);

function moveVirtualMouse(){
    if(!userActive && !passed){
        const gpRect = greenPoint.getBoundingClientRect();
        const dx = gpRect.left + gpRect.width/2 - vmX;
        const dy = gpRect.top + gpRect.height/2 - vmY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist>1){vmX += dx * vmSpeed; vmY += dy * vmSpeed; virtualMouse.style.left = vmX+'px'; virtualMouse.style.top = vmY+'px';}
    }
    requestAnimationFrame(moveVirtualMouse);
}
moveVirtualMouse();

// ====================== 4-4-6 Atemanimation ======================
let phase=0, phaseStart=Date.now();
function animateBreathing(){
    if(passed) return;
    const now = Date.now();
    const elapsed = (now - phaseStart)/1000; // Sekunden
    let scale=1;
    if(phase===0){ // Einatmen 4s
        scale=1+0.5*(elapsed/4);
        if(elapsed>=4){phase=1; phaseStart=now;}
    }else if(phase===1){ // Halten 4s
        scale=1.5;
        if(elapsed>=4){phase=2; phaseStart=now;}
    }else if(phase===2){ // Ausatmen 6s
        scale=1.5-0.5*(elapsed/6);
        if(elapsed>=6){phase=0; phaseStart=now;}
    }
    greenPoint.style.transform=`translate(-50%,-50%) scale(${scale})`;
    greenPoint.style.boxShadow=`0 0 ${14*scale}px rgba(0,255,0,${0.7*scale})`;
    requestAnimationFrame(animateBreathing);
}
animateBreathing();
</script>

</body>
</html>
