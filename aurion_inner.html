</a>

<div id="motto" style="position:fixed; bottom:0; left:50%; transform:translateX(-50%);
            font-size:0.9rem; font-style:italic; opacity:0.8; 
            text-shadow:0 0 6px rgba(200,220,255,0.7); display:none;">
  ✨ Zufall ist Resonanz, die dich findet ✨
</div>

<script>
// Motto nur einmal pro Sitzung anzeigen
document.addEventListener("DOMContentLoaded", function(){
  if(!sessionStorage.getItem("mottoShown")){
    const motto = document.getElementById("motto");
    motto.style.display = "block";
    sessionStorage.setItem("mottoShown", "true");
    // Motto nach 8 Sekunden wieder ausblenden
    setTimeout(()=>{ motto.style.display="none"; }, 8000);
  }
});
</script>
