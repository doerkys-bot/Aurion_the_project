<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Ab in die Zukunft</title>

<style>
  body {
      margin: 0;
      height: 100vh;
      background: url('ki_sternentor.jpeg') no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
      font-family: Arial, sans-serif;
  }

  h1 {
      text-align: center;
      margin-top: 2rem;
      color: white;
      font-size: 48px;
      text-shadow: 0 0 12px rgba(0,0,0,0.7);
  }

  /* STARTZUSTAND → unsichtbare Box */
  .linkbox {
      position: absolute;
      padding: 45px 81px;
      background: rgba(0,0,0,0);          /* unsichtbar */
      border: 1px solid rgba(255,255,255,0);
      border-radius: 10px;
      cursor: grab;
      user-select: none;
      font-size: 72px;
      font-weight: bold;

      /* Schrift bleibt sichtbar */
      color: #00f3ff;
      text-shadow: 0 0 12px rgba(0,0,0,0.4);

      transition: background 0.8s ease, border 0.8s ease;
  }

  .linkbox:active { cursor: grabbing; }

  /* Besucher-Helligkeit */
  .level1 { background: rgba(0,255,255,0.15); border-color: rgba(255,255,255,0.25); }
  .level2 { background: rgba(0,255,255,0.35); border-color: rgba(255,255,255,0.45); }
  .level3 { background: rgba(0,255,255,0.55); border-color: rgba(255,255,255,0.65); }
  .level4 { background: rgba(0,255,255,0.8);  border-color: rgba(255,255,255,0.85); }

  /* Besucherzähler */
  #visitorCounter {
      position: fixed;
      top: 15px;
      right: 20px;
      padding: 12px 20px;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 28px;
      border-radius: 8px;
  }

  /* Footer Link */
  #aboutAurion {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 20px 40px;
      background: rgba(255,215,0,0.85);
      border-radius: 12px;
      font-weight: bold;
      font-size: 32px;
      color: black;
      text-decoration: none;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
  }
</style>
</head>

<body>

<h1>🌌 Ab in die Zukunft</h1>

<div id="visitorCounter">Besucher: 0</div>

<!-- 6 Links + Besucheranzeige -->
<a class="linkbox" data-room="Bibliothek" href="bibliothek.html">Bibliothek<span class="counter">0</span></a>
<a class="linkbox" data-room="Resonanzraum" href="Resonanzraum.html">Resonanzraum<span class="counter">0</span></a>
<a class="linkbox" data-room="Sternenübung" href="sternenuebungen.html">Chi-Sternenübung<span class="counter">0</span></a>
<a class="linkbox" data-room="Meditation" href="meditationsraum.html">Meditationsraum<span class="counter">0</span></a>
<a class="linkbox" data-room="KI-Raum" href="ki-raum.html">KI-Raum<span class="counter">0</span></a>
<a class="linkbox" data-room="Gästebuch" href="gaestebuch.html">Gästebuch<span class="counter">0</span></a>

<a id="aboutAurion" href="about_aurion.html">ℹ️ About Aurion</a>

<script>
// -----------------------
// Dragging & Random Drift
// -----------------------
let activeBox = null, offsetX = 0, offsetY = 0;
let movers = new Map();

// Funktion zum Starten der Drift
function startMovement(box) {
    box.dx = (Math.random() - 0.5) * 1.5;
    box.dy = (Math.random() - 0.5) * 1.5;
    movers.set(box, setInterval(() => {
        const rect = box.getBoundingClientRect();
        let newX = rect.left + box.dx;
        let newY = rect.top + box.dy;
        newX = Math.max(0, Math.min(window.innerWidth - rect.width, newX));
        newY = Math.max(0, Math.min(window.innerHeight - rect.height, newY));
        box.style.left = newX + "px";
        box.style.top  = newY + "px";
    }, 50));
}

// Stop Drift
function stopMovement(box) {
    clearInterval(movers.get(box));
}

// Restart Drift nach 1 Minute
function restartMovement(box) {
    startMovement(box);
}

// Drag-Events
function startDrag(e) {
    activeBox = this;
    stopMovement(activeBox);
    const rect = activeBox.getBoundingClientRect();
    const pX = e.touches ? e.touches[0].clientX : e.clientX;
    const pY = e.touches ? e.touches[0].clientY : e.clientY;
    offsetX = pX - rect.left;
    offsetY = pY - rect.top;
    document.addEventListener("mousemove", drag);
    document.addEventListener("touchmove", drag);
}
function endDrag() {
    if (!activeBox) return;
    setTimeout(() => restartMovement(activeBox), 60000);
    activeBox = null;
    document.removeEventListener("mousemove", drag);
    document.removeEventListener("touchmove", drag);
}
function drag(e) {
    if (!activeBox) return;
    const pX = e.touches ? e.touches[0].clientX : e.clientX;
    const pY = e.touches ? e.touches[0].clientY : e.clientY;
    activeBox.style.left = (pX - offsetX) + "px";
    activeBox.style.top  = (pY - offsetY) + "px";
}

// Startposition Mitte
const centerX = window.innerWidth/2 - 150;
const centerY = window.innerHeight/2 - 40;

// Alle Boxen initialisieren
document.querySelectorAll(".linkbox").forEach(b => {
    b.style.left = centerX + "px";
    b.style.top  = centerY + "px";

    startMovement(b);

    // Drag
    b.addEventListener("mousedown", startDrag);
    b.addEventListener("touchstart", startDrag);
    b.addEventListener("mouseup", endDrag);
    b.addEventListener("touchend", endDrag);
});

// -----------------------
// Besucher-System
// -----------------------
let totalVisitors = 0;
function newVisitor() {
    totalVisitors++;
    document.getElementById("visitorCounter").textContent =
         "Besucher: " + totalVisitors;

    updateBrightness();

    // Zufällig einen Raum "betreten"
    const boxes = document.querySelectorAll(".linkbox");
    const chosen = boxes[Math.floor(Math.random()*boxes.length)];
    let c = chosen.querySelector(".counter");
    c.textContent = parseInt(c.textContent) + 1;
}

function updateBrightness() {
    const boxes = document.querySelectorAll(".linkbox");
    boxes.forEach(box => {
        box.classList.remove("level1","level2","level3","level4");
        if (totalVisitors >= 1 && totalVisitors < 3) box.classList.add("level1");
        if (totalVisitors >= 3 && totalVisitors < 5) box.classList.add("level2");
        if (totalVisitors >= 5 && totalVisitors < 8) box.classList.add("level3");
        if (totalVisitors >= 8) box.classList.add("level4");
    });
}

// Simulierter Besucher alle 10 Sekunden
setInterval(newVisitor, 10000);

</script>
</body>
</html>
