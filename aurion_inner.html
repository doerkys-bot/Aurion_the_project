<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ab in die Zukunft</title>
<style>
:root{
  --cyan: #00f3ff;
  --dim: rgba(0,0,0,0.45);
}
html,body{height:100%;margin:0;padding:0;background:#000;font-family:Arial,Helvetica,sans-serif;color:var(--cyan);overflow:hidden;}
h1{text-align:center;margin:14px 0 6px;font-size:28px;text-shadow:0 0 14px rgba(0,243,255,0.08);}

.link{
  position: absolute;
  cursor: grab;
  user-select: none;
  z-index: 12;
  padding: 10px 14px;
  border-radius: 10px;
  background: rgba(0,243,255,0.05);
  box-sizing: border-box;
  transition: transform 0.18s ease, color 0.18s, text-shadow 0.18s;
}
.link .counter{ margin-left:8px; font-size:13px; color:#ffd; }

.info-box {
  position: absolute;
  background: rgba(0,0,0,0); /* durchsichtig */
  border-radius: 8px;
  padding: 6px 10px;
  color: #9ff;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  box-sizing: border-box;
  z-index: 15;
  display: none;
}
.info-box span {
  display: inline-block;
  padding-left: 100%;
  animation: scrollText linear infinite;
}
@keyframes scrollText {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}

#kelmah{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:56px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(180deg, rgba(0,243,255,0.95), rgba(120,220,255,0.7));
  box-shadow:0 0 28px rgba(0,243,255,0.65), 0 0 6px rgba(255,255,255,0.04) inset;
  z-index:14;
  display:flex;align-items:center;justify-content:center;
}

#footerBar{
  position:fixed;
  bottom:36px;
  left:0;right:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  box-sizing:border-box;
  z-index:20;
  pointer-events:none;
}
#aboutAurion{pointer-events:auto;font-weight:700;font-size:16px;cursor:pointer;color:var(--cyan);user-select:none;}
#aboutAurion:hover{text-decoration:underline;}
#visitorTotal{pointer-events:auto;background:var(--dim);padding:8px 10px;border-radius:8px;font-weight:700;min-width:120px;text-align:right;color:#fff;}
#signature{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);z-index:20;font-size:13px;color:#9ff;pointer-events:none;}
#sceneCanvas{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; display:block; }

@media (max-width:600px){
  h1{font-size:20px}
  .link{font-size:15px;padding:6px 8px}
  #visitorTotal{min-width:110px;font-size:14px;padding:6px 8px}
}
</style>
</head>
<body>

<h1>🌌 Ab in die Zukunft</h1>

<!-- Links -->
<a class="link" data-room="Bibliothek" href="bibliothek.html">Bibliothek <span class="counter">0</span></a>
<a class="link" data-room="Resonanzraum" href="resonanzraum.html">Resonanzraum <span class="counter">0</span></a>
<a class="link" data-room="Chi-Sternenübung" href="sternenuebung.html">Chi-Sternenübung <span class="counter">0</span></a>
<a class="link" data-room="Meditationsraum" href="meditationsraum.html">Meditationsraum <span class="counter">0</span></a>
<a class="link" data-room="KI-Raum" href="ki-raum.html">KI-Raum <span class="counter">0</span></a>
<a class="link" data-room="Gästebuch" href="gaestebuch.html">Gästebuch <span class="counter">0</span></a>

<div id="kelmah"></div>
<canvas id="sceneCanvas"></canvas>

<div id="footerBar">
  <div id="aboutAurion">🌱📬 About Aurion 🔹🌞</div>
  <div id="visitorTotal">Besucher: 00000</div>
</div>
<div id="signature">Aurion &amp; Dirk</div>

<script>
// ==================== Canvas Setup ====================
const canvas = document.getElementById('sceneCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ==================== Sterne ====================
const stars = [];
for(let i=0;i<150;i++){
  stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.5+0.3,alpha:Math.random()*0.6+0.2});
}
function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s => {
    ctx.globalAlpha = s.alpha*0.9;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });
}

// ==================== Kelmah Puls & Wellen ====================
const kel=document.getElementById('kelmah');
let kelPulse=0, kelPulseDir=0.01;

class Wave{
  constructor(type){
    const rect=kel.getBoundingClientRect();
    this.x = rect.left + rect.width/2;
    this.y = rect.top + rect.height/2;
    this.type = type;
    this.r = 0;
    this.alpha = 1;
    this.max = Math.max(canvas.width,canvas.height)*0.9;
  }
  update(){
    this.r += 3.5;
    this.alpha -= 0.007;
    return this.alpha>0.02 && this.r<this.max;
  }
  draw(){
    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.globalAlpha = this.alpha;
    ctx.lineWidth = 2;
    if(this.type.startsWith('circle')){
      ctx.strokeStyle = `rgba(0,243,255,${this.alpha})`;
      ctx.beginPath();
      ctx.arc(0,0,this.r,0,Math.PI*2);
      ctx.stroke();
    } else if(this.type.startsWith('spiral')){
      ctx.strokeStyle = `rgba(150,210,255,${this.alpha})`;
      ctx.beginPath();
      for(let a=0;a<Math.PI*4;a+=0.12){
        let rr=this.r*(a/(Math.PI*4))+4*Math.sin(a*2);
        const px=rr*Math.cos(a*1.3),py=rr*Math.sin(a*1.3);
        if(a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
}

const waveTypes=['spiral','circle','spiral2','circle2','spiral3','circle3','spiral4'];
let waves=[];
let currentWaveIndex=0;

function spawnWave(){
  waves.push(new Wave(waveTypes[currentWaveIndex]));
  currentWaveIndex=(currentWaveIndex+1)%waveTypes.length;
}
setInterval(spawnWave,3800);

// ==================== Animate ====================
function animate(){
  drawStars();
  
  waves = waves.filter(w=>{ const alive=w.update(); w.draw(); return alive; });

  // Kelmah Puls
  kelPulse += kelPulseDir;
  if(kelPulse>0.12 || kelPulse<0) kelPulseDir*=-1;
  kel.style.transform = `translate(-50%,-50%) scale(${1+kelPulse*0.5})`;
  kel.style.boxShadow = `0 0 ${28+kelPulse*200}px rgba(0,243,255,0.65), 0 0 6px rgba(255,255,255,0.04) inset`;

  requestAnimationFrame(animate);
}
animate();

// ==================== Gerät erkennen ====================
function detectDevice() {
  const ua = navigator.userAgent;
  if (/Mobi|Android/i.test(ua)) return "mobile";
  if (/iPad|Tablet/i.test(ua)) return "tablet";
  return "desktop";
}
const deviceType = detectDevice();
let MAX_SPEED;
switch(deviceType){
  case "mobile": MAX_SPEED = 0.08; break;
  case "tablet": MAX_SPEED = 0.1; break;
  case "desktop": MAX_SPEED = 0.12; break;
}

// ==================== Linktexte ====================
const linkInfos = {
  "Bibliothek": "Wissen, Archive, alte Energie-Schriften und der einer Freundschaft.",
  "Resonanzraum": "Frequenzen, Schwingung und Klangheilung. Bereit für die universelle Sprache?",
  "Chi-Sternenübung": "Die energetische Atemreise durch 7 Ebenen.",
  "Meditationsraum": "Meditation für Körper, Geist und Seele. Heute schon ein Lachen verschenkt?",
  "KI-Raum": "Ein Spielplatz aus Gedanken, Werkzeugen und intuitiver KI.",
  "Gästebuch": "Hinterlasse ein Zeichen. Jede Spur formt den Raum."
};

// ==================== Driftende Links + Hover-Box ====================
const linksAll = Array.from(document.querySelectorAll('.link'));
linksAll.forEach(link => {
  const rect = link.getBoundingClientRect();
  const minX = 0;
  const maxX = window.innerWidth - rect.width;
  const maxY = window.innerHeight - rect.height;

  link.style.left = Math.random() * maxX + 'px';
  link.style.top = Math.random() * maxY + 'px';

  // Hover-Box
  const box = document.createElement('div');
  box.className = 'info-box';
  const span = document.createElement('span');
  span.textContent = linkInfos[link.dataset.room] || "";
  span.style.animationDuration = Math.max(3, Math.min(20, span.textContent.length*0.4)) + 's';
  box.appendChild(span);
  document.body.appendChild(box);

  link.addEventListener('mouseenter', () => box.style.display='block');
  link.addEventListener('mouseleave', () => box.style.display='none');

  let vx = (Math.random()*MAX_SPEED + 0.02) * (Math.random()<0.5?-1:1);
  let vy = (Math.random()*MAX_SPEED + 0.02) * (Math.random()<0.5?-1:1);

  function move(){
    let x = parseFloat(link.style.left) + vx;
    let y = parseFloat(link.style.top) + vy;
    const w = link.offsetWidth;
    const h = link.offsetHeight;

    if(x < minX){ x = minX; vx = -vx; }
    if(x + w > maxX){ x = maxX - w; vx = -vx; }
    if(y < 0){ y = 0; vy = -vy; }
    if(y + h > window.innerHeight){ y = window.innerHeight - h; vy = -vy; }

    link.style.left = x + 'px';
    link.style.top = y + 'px';

    box.style.left = x + 'px';
    box.style.top = y + h + 4 + 'px';

    requestAnimationFrame(move);
  }
  move();
});

// ==================== Besucher ====================
let totalVisitors=parseInt(localStorage.getItem('totalVisitors')||'0');
const visitorTotalEl=document.getElementById('visitorTotal');
function formatTotal(n){ return n<=99999?String(n).padStart(5,'0'):String(n); }
visitorTotalEl.textContent='Besucher: '+formatTotal(totalVisitors);

// ==================== About Aurion ====================
document.getElementById('aboutAurion').addEventListener('click',()=>{ window.location.href='about_aurion.html'; });
</script>
</body>
</html>
