<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Aurion</title>

<style>
    body {
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
    }

    /* Container, der bis zur Mitte geht */
    .half-screen {
        width: 50%;
        position: relative;
        overflow: hidden;
    }

    /* Laufschrift */
    .marquee {
        position: absolute;
        top: -19px; /* 19px über dem Link */
        white-space: nowrap;
        animation: scroll 10s linear infinite;
        font-size: 18px;
        color: #00eaff;
    }

    @keyframes scroll {
        0% { transform: translateX(100%); }
        100% { transform: translateX(-100%); }
    }

    /* Link */
    .aurion-link {
        position: relative;
        display: inline-block;
        margin-top: 40px; /* etwas Abstand, damit nichts kollidiert */
        font-size: 20px;
        color: #89d0ff;
        text-decoration: none;
    }
</style>

</head>
<body>

<div class="half-screen">
    <div class="marquee">about-aurion — Willkommen bei Aurion</div>

    <a href="#" class="aurion-link">about-aurion</a>
</div>
<script>
fetch("https://www.auriontheproject.eu/aurion_visits.json")
  .then(res => res.json())
  .then(data => {
      let newId = (data.visitors.length > 0)
        ? data.visitors[data.visitors.length - 1].id + 1
        : 1;

      data.visitors.push({
          id: newId,
          room: window.location.pathname.replace("/", "")
      });

      fetch("save_visit.php", {
          method: "POST",
          body: JSON.stringify(data)
      });
  });
</script>
</body>
</html>
