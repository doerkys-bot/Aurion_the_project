<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ab in die Zukunft</title>
<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background: url('ki_sternentor.jpeg') no-repeat center center fixed;
        background-size: contain;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    h1 {
        text-align: center;
        margin-top: 2rem;
        color: white;
        font-size: 48px;
        text-shadow: 0 0 12px rgba(0,0,0,0.7);
    }

    .linkbox {
        position: absolute;
        padding: 30px 60px;
        background: rgba(0,0,0,0); /* Start durchsichtig */
        border-radius: 10px;
        cursor: grab;
        user-select: none;
        font-size: 48px;
        font-weight: bold;
        color: #00f3ff;
        text-shadow: 0 0 12px rgba(0,0,0,0.4);
        transition: background 0.8s ease, border 0.8s ease;
    }

    .linkbox:active { cursor: grabbing; }

    .level1 { background: rgba(0,255,255,0.15); }
    .level2 { background: rgba(0,255,255,0.35); }
    .level3 { background: rgba(0,255,255,0.55); }
    .level4 { background: rgba(0,255,255,0.8); }

    .counter {
        font-size: 24px;
        margin-left: 12px;
        color: #ffd;
    }

    /* Footer Link */
    #aboutAurion {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 30px 60px;
        background: rgba(255,215,0,0.85);
        border-radius: 12px;
        font-weight: bold;
        font-size: 48px;
        color: black;
        text-decoration: none;
        box-shadow: 0 0 12px rgba(0,0,0,0.6);
        display: inline-flex;
        align-items: center;
    }

    #aboutAurion span {
        margin-left: 12px;
        font-size: 36px;
        color: black;
    }
</style>
</head>
<body>

<h1>🌌 Ab in die Zukunft</h1>

<!-- 6 Links + Besucherzähler -->
<a class="linkbox" data-room="Bibliothek" href="bibliothek.html">Bibliothek<span class="counter">0</span></a>
<a class="linkbox" data-room="Resonanzraum" href="Resonanzraum.html">Resonanzraum<span class="counter">0</span></a>
<a class="linkbox" data-room="Sternenübung" href="sternenuebungen.html">Chi-Sternenübung<span class="counter">0</span></a>
<a class="linkbox" data-room="Meditation" href="meditationsraum.html">Meditationsraum<span class="counter">0</span></a>
<a class="linkbox" data-room="KI-Raum" href="ki-raum.html">KI-Raum<span class="counter">0</span></a>
<a class="linkbox" data-room="Gästebuch" href="gaestebuch.html">Gästebuch<span class="counter">0</span></a>

<a id="aboutAurion" href="about_aurion.html">ℹ️ About Aurion<span>0</span></a>

<script>
// --- Startpositionen alle gleich ---
const boxes = document.querySelectorAll(".linkbox");
boxes.forEach(box => {
    box.style.left = "50%";
    box.style.top = "50%";
});

// --- Driftbewegung schneller und stärker ---
function drift() {
    boxes.forEach(box => {
        const x = parseFloat(box.style.left);
        const y = parseFloat(box.style.top);
        const dx = (Math.random() - 0.5) * 10; // stärkere Drift
        const dy = (Math.random() - 0.5) * 10;
        box.style.left = Math.max(0, Math.min(window.innerWidth - box.offsetWidth, x + dx)) + "px";
        box.style.top  = Math.max(0, Math.min(window.innerHeight - box.offsetHeight, y + dy)) + "px";
    });
    requestAnimationFrame(drift);
}
drift();

// --- Besucher-System ---
let totalVisitors = 0;

function newVisitor() {
    totalVisitors++;
    const allBoxes = document.querySelectorAll(".linkbox");
    const randBox = allBoxes[Math.floor(Math.random()*allBoxes.length)];
    const counter = randBox.querySelector(".counter");
    counter.textContent = parseInt(counter.textContent) + 1;

    updateBrightness();
}

function updateBrightness() {
    const allBoxes = document.querySelectorAll(".linkbox");
    allBoxes.forEach(box => {
        box.classList.remove("level1","level2","level3","level4");
        const count = parseInt(box.querySelector(".counter").textContent);
        if (count >= 1 && count < 3) box.classList.add("level1");
        if (count >= 3 && count < 5) box.classList.add("level2");
        if (count >= 5 && count < 8) box.classList.add("level3");
        if (count >= 8) box.classList.add("level4");
    });

    // Besucherzahl direkt hinter About Aurion
    const about = document.querySelector("#aboutAurion span");
    about.textContent = totalVisitors;
}

// Simulierter Besucher alle 5 Sekunden (schneller)
setInterval(newVisitor, 5000);
</script>

</body>
</html>
