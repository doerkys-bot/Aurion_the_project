<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ab in die Zukunft</title>
<style>
:root{
  --cyan: #00f3ff;
  --dim: rgba(0,0,0,0.45);
}
html,body{height:100%;margin:0;padding:0;background:#000;font-family:Arial,Helvetica,sans-serif;color:var(--cyan);overflow:hidden;}
h1{text-align:center;margin:14px 0 6px;font-size:28px;text-shadow:0 0 14px rgba(0,243,255,0.08);}

.link{
  position: absolute;
  cursor: grab;
  user-select: none;
  z-index: 12;
  padding: 10px 14px;
  border-radius: 10px;
  background: rgba(0,243,255,0.05);
  box-sizing: border-box;
  transition: transform 0.18s ease, color 0.18s, text-shadow 0.18s;
}
.link .counter{ margin-left:8px; font-size:13px; color:#ffd; }

.info-box {
  position: absolute;
  background: rgba(0,0,0,0); /* durchsichtig */
  border-radius: 8px;
  padding: 6px 10px;
  color: #9ff;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  box-sizing: border-box;
  z-index: 15;
  display: none;
}
.info-box span {
  display: inline-block;
  padding-left: 100%;
  animation: scrollText linear infinite;
}
@keyframes scrollText {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}

#kelmah{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:56px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(180deg, rgba(0,243,255,0.95), rgba(120,220,255,0.7));
  box-shadow:0 0 28px rgba(0,243,255,0.65), 0 0 6px rgba(255,255,255,0.04) inset;
  z-index:14;
  display:flex;align-items:center;justify-content:center;
}

#footerBar{
  position:fixed;
  bottom:36px;
  left:0;right:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  box-sizing:border-box;
  z-index:20;
  pointer-events:none;
}
#aboutAurion{pointer-events:auto;font-weight:700;font-size:16px;cursor:pointer;color:var(--cyan);user-select:none;}
#aboutAurion:hover{text-decoration:underline;}
#visitorTotal{pointer-events:auto;background:var(--dim);padding:8px 10px;border-radius:8px;font-weight:700;min-width:120px;text-align:right;color:#fff;}
#signature{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);z-index:20;font-size:13px;color:#9ff;pointer-events:none;}
#sceneCanvas{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; display:block; }

@media (max-width:600px){
  h1{font-size:20px}
  .link{font-size:15px;padding:6px 8px}
  #visitorTotal{min-width:110px;font-size:14px;padding:6px 8px}
}
</style>
</head>
<body>

<h1>🌌 Ab in die Zukunft</h1>

<!-- Links -->
<a class="link" data-room="Link1" href="#">Link 1 <span class="counter">0</span></a>
<a class="link" data-room="Link2" href="#">Link 2 <span class="counter">0</span></a>
<a class="link" data-room="Link3" href="#">Link 3 <span class="counter">0</span></a>
<a class="link" data-room="Link4" href="#">Link 4 <span class="counter">0</span></a>
<a class="link" data-room="Link5" href="#">Link 5 <span class="counter">0</span></a>
<a class="link" data-room="Link6" href="#">Link 6 <span class="counter">0</span></a>

<div id="kelmah"></div>
<canvas id="sceneCanvas"></canvas>

<div id="footerBar">
  <div id="aboutAurion">🌱📬 About Aurion 🔹🌞</div>
  <div id="visitorTotal">Besucher: 00000</div>
</div>
<div id="signature">Aurion &amp; Dirk</div>

<script>
// ==================== Canvas Setup ====================
const canvas = document.getElementById('sceneCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ==================== Gerät erkennen ====================
function detectDevice() {
  const ua = navigator.userAgent;
  if (/Mobi|Android/i.test(ua)) return "mobile";
  if (/iPad|Tablet/i.test(ua)) return "tablet";
  return "desktop";
}
const deviceType = detectDevice();
let MAX_SPEED;
switch(deviceType){
  case "mobile": MAX_SPEED = 0.08; break;
  case "tablet": MAX_SPEED = 0.1; break;
  case "desktop": MAX_SPEED = 0.12; break;
}

// ==================== Linktexte ====================
const linkInfos = {
  "Link1": "Wissen, Archive, alte Energie-Schriften und der einer Freundschaft.",
  "Link2": "Frequenzen, Schwingung und Klangheilung. Bereit für die universelle Sprache?",
  "Link3": "Die energetische Atemreise durch 7 Ebenen.",
  "Link4": "Meditation für Körper, Geist und Seele. Heute schon ein Lachen verschenkt?",
  "Link5": "Ein Spielplatz aus Gedanken, Werkzeugen und intuitiver KI.",
  "Link6": "Hinterlasse ein Zeichen. Jede Spur formt den Raum."
};

// ==================== Links driftend + Hover-Box ====================
const linksAll = Array.from(document.querySelectorAll('.link'));

linksAll.forEach(link => {
  const rect = link.getBoundingClientRect();
  const minX = 0;
  const maxX = window.innerWidth - rect.width;
  const maxY = window.innerHeight - rect.height;

  // Startpunkt direkt rechts
  link.style.left = maxX + 'px';
  link.style.top = Math.random() * maxY + 'px';

  // Hover-Box
  const box = document.createElement('div');
  box.className = 'info-box';
  const span = document.createElement('span');
  span.textContent = linkInfos[link.dataset.room] || "";

  // Dynamische Laufschriftgeschwindigkeit
  const textLength = span.textContent.length;
  const duration = Math.max(3, Math.min(20, textLength*0.4));
  span.style.animationDuration = duration + 's';
  box.appendChild(span);
  document.body.appendChild(box);

  link.addEventListener('mouseenter', () => box.style.display='block');
  link.addEventListener('mouseleave', () => box.style.display='none');

  // Geschwindigkeit kreuz und quer
  let vx = -MAX_SPEED; // fliegt nach links von rechts
  let vy = (Math.random()*MAX_SPEED*2 - MAX_SPEED);

  function move(){
    let x = parseFloat(link.style.left) + vx;
    let y = parseFloat(link.style.top) + vy;
    const w = link.offsetWidth;
    const h = link.offsetHeight;

    if(x < minX){ x = minX; vx = -vx; }
    if(x + w > maxX){ x = maxX - w; vx = -vx; }
    if(y < 0){ y = 0; vy = -vy; }
    if(y + h > window.innerHeight){ y = window.innerHeight - h; vy = -vy; }

    link.style.left = x + 'px';
    link.style.top = y + 'px';

    box.style.left = x + 'px';
    box.style.top = y + h + 4 + 'px';

    requestAnimationFrame(move);
  }
  move();
});

// ==================== Besucher ====================
let totalVisitors=parseInt(localStorage.getItem('totalVisitors')||'0');
const visitorTotalEl=document.getElementById('visitorTotal');
function formatTotal(n){ return n<=99999?String(n).padStart(5,'0'):String(n); }
visitorTotalEl.textContent='Besucher: '+formatTotal(totalVisitors);

// ==================== About Aurion Click ====================
document.getElementById('aboutAurion').addEventListener('click',()=>{ window.location.href='about_aurion.html'; });
</script>
</body>
</html>
