<!DOCTYPE html><html lang="de">
<head>
<meta charset="UTF-8">
<style>
  body {
      margin: 0;
      height: 100vh;
      background: url('ki_sternentor.jpeg') no-repeat center center fixed;
      background-size: contain;
      overflow: hidden;
      font-family: Arial, sans-serif;
  }h1 { text-align: center; margin-top: 2rem; color: white; font-size: 48px; text-shadow: 0 0 12px rgba(0,0,0,0.7); }

.linkbox { position: absolute; padding: 20px 40px; background: rgba(0,0,0,0.4); border-radius: 10px; cursor: grab; user-select: none; font-size: 1.6rem; font-weight: bold; color: #00f3ff; text-shadow: 0 0 12px rgba(0,0,0,0.6); border: 2px solid rgba(0,255,255,0.4); }

#visitorCounter { position: fixed; top: 15px; right: 20px; padding: 12px 20px; background: rgba(0,0,0,0.5); color: white; font-size: 28px; border-radius: 8px; }

#aboutAurion { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 6px 12px; background: rgba(255,215,0,0.85); border-radius: 12px; font-weight: bold; font-size: 1rem; color: black; text-decoration: none; box-shadow: 0 0 8px rgba(0,0,0,0.6); display: flex; align-items: center; gap: 8px; } </style>

</head>
<body><h1>🌌 Ab in die Zukunft</h1><div id="visitorCounter">Besucher: 0</div><!-- Sichtbare Startpositionen verteilt --><a class="linkbox" data-room="Bibliothek" href="bibliothek.html" style="top:20%; left:30%">Bibliothek <span class="counter">0</span></a> <a class="linkbox" data-room="Resonanzraum" href="Resonanzraum.html" style="top:55%; left:25%">Resonanzraum <span class="counter">0</span></a> <a class="linkbox" data-room="Sternenübung" href="sternenuebungen.html" style="top:35%; left:60%">Chi-Sternenübung <span class="counter">0</span></a> <a class="linkbox" data-room="Meditation" href="meditationsraum.html" style="top:70%; left:50%">Meditationsraum <span class="counter">0</span></a> <a class="linkbox" data-room="KI-Raum" href="ki-raum.html" style="top:45%; left:15%">KI-Raum <span class="counter">0</span></a> <a class="linkbox" data-room="Gästebuch" href="gaestebuch.html" style="top:25%; left:75%">Gästebuch <span class="counter">0</span></a>

<a id="aboutAurion" href="about_aurion.html">ℹ️ About Aurion</a>

<script>
const boxes = document.querySelectorAll('.linkbox');
const driftSpeed = 0.25;

boxes.forEach(box => {
    let dx = (Math.random() - 0.5) * driftSpeed;
    let dy = (Math.random() - 0.5) * driftSpeed;

    function drift() {
        const rect = box.getBoundingClientRect();
        let x = rect.left + dx;
        let y = rect.top + dy;

        if (x < 0 || x > window.innerWidth - rect.width) dx = -dx;
        if (y < 0 || y > window.innerHeight - rect.height) dy = -dy;

        box.style.left = x + 'px';
        box.style.top = y + 'px';
        requestAnimationFrame(drift);
    }
    drift();
});

let totalVisitors = 0;

function newVisitor(){
    totalVisitors++;
    document.getElementById('visitorCounter').textContent = 'Besucher: ' + totalVisitors;

    const box = boxes[Math.floor(Math.random()*boxes.length)];
    const counter = box.querySelector('.counter');
    counter.textContent = parseInt(counter.textContent) + 1;
}

setInterval(newVisitor, 10000);
</script></body>
</html>
