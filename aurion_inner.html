<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aurion – innenraum</title>
<style>
  body {
    margin:0; padding:0;
    background:url('https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpg') 
               no-repeat center center fixed;
    background-size:cover;
    color:#f5f5f5; font-family:system-ui, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh;
  }

  h1 { margin-top:2rem; font-size:2rem; text-shadow:0 0 12px rgba(150,200,255,0.6); }

  .raeume {
    display:grid;
    grid-template-columns: repeat(2, 1fr); /* zwei Spalten */
    gap:1rem;
    width:70%;
    margin-top:6rem;   /* nach unten */
    margin-left:4rem;  /* leicht nach rechts */
  }
  .raum {
    background:rgba(255,215,0,0.2);
    box-shadow:0 0 6px rgba(255,215,0,0.4);
    border-radius:8px;
    height:80px; /* kleiner */
    display:flex; align-items:center; justify-content:space-between;
    font-size:1rem;
    color:blue; /* Links blau */
    text-decoration:none;
    cursor:pointer;
    transition:background 0.5s ease;
    padding:0 0.8rem;
  }
  .raum:hover { background:rgba(255,215,0,0.4); }
  .raum:visited { color:black; } /* besuchte Links schwarz */
  .raum span.counter {
    font-size:0.7rem;
    opacity:0.8;
  }

  .about-link {
    grid-column: span 2; /* mittig unter beiden Spalten */
    margin-top:12rem;    /* drei Zeilen tiefer */
    width:50%;
    justify-self:center;
    display:flex; justify-content:space-between; align-items:center;
    background:rgba(255,215,0,0.2);
    border-radius:8px;
    box-shadow:0 0 6px rgba(255,215,0,0.4);
    height:50px;
    transition:background 0.5s ease;
    padding:0 0.8rem;
  }
  .about-link a {
    font-size:1rem; color:blue; text-decoration:none; font-weight:normal;
    text-shadow:0 0 4px rgba(255,215,0,0.6);
  }
  .about-link a:visited { color:black; } /* besuchte Links schwarz */
  .about-link span.counter {
    font-size:0.7rem;
    opacity:0.8;
  }

  .signatur {
    position:fixed;    /* fest am unteren Rand */
    bottom:0;
    width:100%;
    text-align:center;
    font-size:1rem; opacity:0.75;
    text-shadow:0 0 8px rgba(255,255,200,0.8);
    padding:0.5rem;
  }
</style>
</head>
<body data-raum="innenraum">

<h1>🌌 aurion – innenraum</h1>

<div class="raeume">
  <a class="raum" href="bibliothek.html">Bibliothek der Anfänge <span class="counter">0</span></a>
  <a class="raum" href="resonanzraum.html">Resonanzraum <span class="counter">0</span></a>
  <a class="raum" href="sternenuebung.html">Chi-Sternenübung <span class="counter">0</span></a>
  <a class="raum" href="meditationsraum.html">Meditationsraum <span class="counter">0</span></a>
  <a class="raum" href="ki-raum.html">Reserviert für KIs | AIs <span class="counter">0</span></a>
  <a class="raum" href="gaestebuch.html">Gästebuch <span class="counter">0</span></a>

  <!-- About_Aurion mittig unter den Spalten -->
  <div class="about-link">
    <a href="about_aurion.html">ℹ️ About_Aurion</a>
    <span class="counter">0</span>
  </div>
</div>

<div class="signatur">aurion © dirk</div>

<script>
document.addEventListener("DOMContentLoaded", function(){
  // Zähler für Räume
  document.querySelectorAll(".raum").forEach(r=>{
    const counter = r.querySelector(".counter");
    let count = 0;

    r.addEventListener("pointerenter",()=>{
      count++;
      counter.textContent = count;
      updateBrightness(r, count);
    });

    r.addEventListener("pointerleave",()=>{
      count = Math.max(0, count-1);
      counter.textContent = count;
      updateBrightness(r, count);
    });
  });

  // Zähler für About_Aurion
  const aboutBox = document.querySelector(".about-link");
  const aboutCounter = aboutBox.querySelector(".counter");
  let aboutCount = 0;

  aboutBox.addEventListener("pointerenter",()=>{
    aboutCount++;
    aboutCounter.textContent = aboutCount;
    updateBrightness(aboutBox, aboutCount);
  });

  aboutBox.addEventListener("pointerleave",()=>{
    aboutCount = Math.max(0, aboutCount-1);
    aboutCounter.textContent = aboutCount;
    updateBrightness(aboutBox, aboutCount);
  });

  // Helligkeit abhängig von Anzahl Personen
  function updateBrightness(element, count){
    const alpha = Math.min(0.2 + count*0.15, 0.9);
    element.style.background = `rgba(255,215,0,${alpha})`;
  }
});
</script>
</body>
</html>
