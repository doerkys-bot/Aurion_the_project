<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion – Bewegliche Links</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: url('https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpg')
                no-repeat center center fixed;
    background-size: cover;
    font-family: system-ui, Arial, sans-serif;
  }

  h1 {
    text-align: center;
    margin-top: 2rem;
    color: white;
    text-shadow: 0 0 12px rgba(200,200,255,0.8);
  }

  /* Jede Linkbox einzeln verschiebbar */
  .raum {
    position: absolute;
    touch-action: none;  /* wichtig für Handy */
    cursor: grab;
    background: rgba(255,215,0,0.25);
    border-radius: 8px;
    padding: 1rem;
    width: 180px;
    text-align: center;
    backdrop-filter: blur(4px);
    color: white;
    font-size: 1rem;
    box-shadow: 0 0 8px rgba(255,215,0,0.5);
    user-select: none;
  }

  .raum:active {
    cursor: grabbing;
  }
</style>
</head>

<body>

<h1>🌌 Aurion – Bewegliche Links</h1>

<!-- Die 6 oberen Linkboxen -->
<div class="raum" style="top:150px; left:200px;">Bibliothek</div>
<div class="raum" style="top:150px; left:420px;">Resonanzraum</div>
<div class="raum" style="top:150px; left:640px;">Chi-Sternenübung</div>
<div class="raum" style="top:250px; left:200px;">Meditationsraum</div>
<div class="raum" style="top:250px; left:420px;">KI-Raum</div>
<div class="raum" style="top:250px; left:640px;">Gästebuch</div>

<!-- Die unteren zwei Links -->
<div class="raum" style="bottom:250px; left:50%; transform:translateX(-120%);">About Aurion</div>
<div class="raum" style="bottom:250px; left:50%; transform:translateX(20%);">Kontakt</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".raum").forEach(makeDraggable);

  function makeDraggable(el) {
    let offsetX = 0, offsetY = 0;

    el.addEventListener("pointerdown", pointerDown);

    function pointerDown(e) {
      e.preventDefault();

      // Finger oder Maus
      const startX = e.clientX || e.touches?.[0].clientX;
      const startY = e.clientY || e.touches?.[0].clientY;

      const rect = el.getBoundingClientRect();
      offsetX = startX - rect.left;
      offsetY = startY - rect.top;

      document.addEventListener("pointermove", pointerMove);
      document.addEventListener("pointerup", pointerUp);
    }

    function pointerMove(e) {
      const x = e.clientX || e.touches?.[0]?.clientX;
      const y = e.clientY || e.touches?.[0]?.clientY;

      el.style.left = (x - offsetX) + "px";
      el.style.top = (y - offsetY) + "px";
    }

    function pointerUp() {
      document.removeEventListener("pointermove", pointerMove);
      document.removeEventListener("pointerup", pointerUp);
    }
  }
});
</script>

</body>
</html>
