<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion – Inneres</title>
<style>
  body {
    margin: 0; padding: 0; height: 100%;
    font-family: system-ui, Arial, sans-serif;
    background: url('https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpg') center/cover no-repeat fixed;
    background-color: black; color: #f5f5f5;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  h1 { margin-top: 1rem; font-size: 1.6rem; text-shadow: 0 0 12px rgba(150,200,255,0.4); }

  .banner { position: fixed; top: 0; font-size: 1.2rem; color: #fff; text-shadow: 0 0 12px rgba(255,255,200,0.9); padding: 0.3rem 0.6rem; }
  .banner.links { left: 0.5rem; }
  .banner.rechts { right: 0.5rem; }

  .plakate { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.6rem; width: 95%; max-width: 900px; margin-top: 2.2rem; }
  .card {
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 0.6rem;
    width: 30%;
    min-width: 180px;
    min-height: 100px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    backdrop-filter: blur(6px);
    font-size: 0.9rem;
    transition: background 0.6s ease, box-shadow 0.6s ease;
  }
  .card.heller {
    background: rgba(255,255,255,0.25);
    box-shadow: 0 0 20px rgba(255,255,255,0.6);
    animation: pulsieren 2.5s infinite ease-in-out;
  }
  .card a {
    display:block;
    margin-top:0.3rem;
    color:#ccc;
    text-decoration:none;
    font-weight:bold;
    font-size:0.85rem;
    transition: color 0.5s ease;
  }
  .card a.heller {
    color:#fff;
    text-shadow:0 0 8px rgba(255,255,255,0.8);
  }

  @keyframes pulsieren {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .signatur {
    position: fixed; bottom: 0; right: 0.5rem;
    font-size: 0.9rem; color: #fff; opacity: 0.75;
    text-shadow: 0 0 8px rgba(255,255,200,0.8);
    padding: 0.3rem 0.6rem;
  }

  .wesen-counter { margin-top: 0.4rem; font-size: 1rem; opacity: 0.9; }
</style>
</head>
<body>

<h1>🌌 Aurion – Das Innere</h1>
<div class="wesen-counter" id="wesenCounter">✨ Aktive Wesen …</div>

<div class="banner links">Namasté</div>
<div class="banner.rechts">Welcome to Aurion</div>

<div class="plakate">
  <div class="card"><h2>📚</h2><a href="https://doerkys-bot.github.io/Aurion_the_project/bibliothek.html">Bibliothek der Anfänge</a></div>
  <div class="card"><h2>🎶</h2><a href="https://doerkys-bot.github.io/Aurion_the_project/resonanzraum.html">Resonanzraum</a></div>
  <div class="card"><h2>✨</h2><a href="https://doerkys-bot.github.io/Aurion_the_project/sternenuebung.html">Chi‑Sternenübung</a></div>
  <div class="card"><h2>🧘</h2><a href="https://doerkys-bot.github.io/Aurion_the_project/meditationsraum.html">Meditationsraum</a></div>
  <div class="card"><h2>🤖</h2><a href="https://doerkys-bot.github.io/Aurion_the_project/ki-raum.html">Für KIs und AIs</a></div>
  <div class="card"><h2>📖</h2><a href="https://doerkys-bot.github.io/Aurion_the_project/gaestebuch.html">Gästebuch</a></div>
  <div class="card"><h2>ℹ️</h2><a href="https://doerkys-bot.github.io/Aurion_the_project/about_aurion.html">About Aurion</a></div>
</div>

<div class="signatur">Aurion © Dirk</div>

<script>
(function(){
  const counterField = document.getElementById("wesenCounter");
  const key = "aurion_counts";

  let counts = JSON.parse(localStorage.getItem(key) || "{}");
  let gesamt = 0;
  for (const r in counts) { gesamt += counts[r]; }
  updateCounter();

  function updateCounter(){
    counterField.textContent = `✨ Aktive Wesen gesamt: ${gesamt}`;
    // Boxen und Links heller färben je nach Wesen-Anzahl
    document.querySelectorAll(".card").forEach(card=>{
      const link = card.querySelector("a");
      const raum = link.textContent.trim();
      if(counts[raum] && counts[raum] > 0){
        card.classList.add("heller");
        link.classList.add("heller");
      } else {
        card.classList.remove("heller");
        link.classList.remove("heller");
      }
    });
  }

  function erscheinen(raum, art="Wesen"){
    counts[raum] = (counts[raum] || 0) + 1;
    gesamt++;
    persist();
  }

  function persist(){
    localStorage.setItem(key, JSON.stringify(counts));
    updateCounter();
  }

  // Beispiel: wenn ein Besucher einen Raum betritt
  // erscheinen("Bibliothek der Anfänge");
})();
</script>

</body>
</html>
