<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurion</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    color:#00f3ff;
    font-family:Arial;
    overflow:hidden;
}

/* Zentrumskugel */
#kelmah{
    position:absolute;
    width:60px;
    height:60px;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    background:linear-gradient(180deg,rgba(0,243,255,0.95),rgba(120,220,255,0.7));
    box-shadow:0 0 28px rgba(0,243,255,0.65),0 0 6px rgba(255,255,255,0.04) inset;
    z-index:2;
}

/* Links */
.link{
    position:absolute;
    font-weight:bold;
    padding:8px 14px;
    border-radius:6px;
    background:rgba(0,0,0,0.25);
    cursor:pointer;
    z-index:5;
    white-space:nowrap;
}

/* Laufschrift */
.marquee{
    position:fixed;
    white-space:nowrap;
    font-size:14px;
    color:#fff;
    background:rgba(0,0,0,0.4);
    padding:4px 10px;
    border-radius:4px;
    pointer-events:none;
    display:none;
    z-index:9999;
}

/* Footer Bar */
#footerBar{
    position:fixed;
    bottom:6px;
    width:100%;
    display:flex;
    justify-content:space-between;
    padding:0 18px;
    font-weight:bold;
    z-index:20;
}
</style>
</head>
<body>

<div id="kelmah"></div>

<!-- Links mit Besucherzahlen -->
<a class="link" data-room="bibliothek">Bibliothek <span class="count"></span></a>
<a class="link" data-room="resonanzraum">Resonanzraum <span class="count"></span></a>
<a class="link" data-room="stern">Chi-Sternenübung <span class="count"></span></a>
<a class="link" data-room="meditation">Meditationsraum <span class="count"></span></a>
<a class="link" data-room="ki">KI-Raum <span class="count"></span></a>
<a class="link" data-room="gaestebuch">Gästebuch <span class="count"></span></a>

<!-- about-aurion -->
<a class="link" id="aboutAurion" data-room="about">About-Aurion</a>

<div class="marquee" id="marquee"></div>

<div id="footerBar">
    <div id="aurionLabel">🤖🤖 About_Aurion</div>
    <div id="visitorTotal">Gesamtbesucher: 0</div>
</div>

<script>
// ------ Linktexte ------
const linkDescriptions = {
    bibliothek:"Bibliothek: Wissen, Archive, alte Energie-Schriften.",
    resonanzraum:"Resonanzraum: Frequenzen, Klang, Energie.",
    stern:"Chi-Sternenübung: Atemreise durch die Ebenen.",
    meditation:"Meditationsraum: Stille, Heilung, Bewusstsein. Schebken Sie mir ein Lachen?",
    ki:"KI-Raum: Werkzeuge, Gedanken, Intelligenz. Bei Glück ist hier eine KI.",
    gaestebuch:"Gästebuch: Hinterlasse eine Spur. Jede Spur formt den Raum.",
    about:"About-Aurion: Angefangen hat alles mit der 2. Aufmerkamkeit nach C. Castaneda."
};

const marquee = document.getElementById("marquee");
let activeMarquee=null;
let animationFrame=null;

// -------------------------------------------------
// *** LAUFSCHRIFT-FUNKTION (mit 9.5px Offset)
// -------------------------------------------------
function startMarquee(link){
    if(activeMarquee && activeMarquee!==link){
        marquee.style.display="none";
        cancelAnimationFrame(animationFrame);
    }
    activeMarquee=link;

    const room = link.dataset.room;
    marquee.textContent = linkDescriptions[room] || "";
    marquee.style.display="block";

    const rect = link.getBoundingClientRect();
    marquee.style.top = (rect.top - marquee.offsetHeight - 9.5) + "px";
    marquee.style.left = "-300px";

    let offset = -marquee.offsetWidth;
    const speed = 1.2;

    function animate(){
        offset += speed;
        marquee.style.left = offset + "px";

        if(offset > window.innerWidth){
            marquee.style.display="none";
            activeMarquee=null;
            return;
        }
        animationFrame = requestAnimationFrame(animate);
    }

    animate();
}

// -------------------------------------------------
// Besucher-Daten (Fake-Simulation kann entfernt werden)
// -------------------------------------------------
let visitorData={
    total:193,
    rooms:{
        bibliothek:2,
        resonanzraum:1,
        stern:0,
        meditation:3,
        ki:1,
        gaestebuch:0
    }
};

// -------------------------------------------------
// Besucherzahlen aktualisieren
// -------------------------------------------------
function updateVisitorCounts(){
    document.getElementById("visitorTotal").textContent =
        "Gesamtbesucher: " + visitorData.total;

    document.querySelectorAll(".link").forEach(link=>{
        const r = link.dataset.room;
        link.querySelector(".count").textContent =
            " ("+ visitorData.rooms[r] +")";
    });
}

updateVisitorCounts();

// -------------------------------------------------
// Hover-Events für Laufschrift
// -------------------------------------------------
document.querySelectorAll(".link").forEach(link=>{
    link.addEventListener("mouseenter",()=>startMarquee(link));
    link.addEventListener("mouseleave",()=>{
        marquee.style.display="none";
        activeMarquee=null;
        cancelAnimationFrame(animationFrame);
    });
});

// -------------------------------------------------
// Link-Positionen um Kel-Mah herum (Kreis)
// -------------------------------------------------
function positionLinks(){
    const links = document.querySelectorAll(".link:not(#aboutAurion)");
    const centerX = window.innerWidth/2;
    const centerY = window.innerHeight/2;
    const radius = 230;

    let angleStep = (2*Math.PI)/links.length;
    let angle = -Math.PI/2;

    links.forEach(link=>{
        const x = centerX + Math.cos(angle)*radius;
        const y = centerY + Math.sin(angle)*radius;

        link.style.left = (x - link.offsetWidth/2)+"px";
        link.style.top = (y - link.offsetHeight/2)+"px";

        angle += angleStep;
    });

    // about-aurion unten links in der Footer-Leiste ausgerichtet
    const about = document.getElementById("aboutAurion");
    const footerLeft = document.getElementById("aurionLabel").getBoundingClientRect();

    about.style.top = (footerLeft.top - 32) + "px";
    about.style.left = footerLeft.left + "px";
}

positionLinks();
window.addEventListener("resize",positionLinks);
</script>

</body>
</html>
