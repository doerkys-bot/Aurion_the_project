<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ab in die Zukunft</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: url('ki_sternentor.jpeg') no-repeat center center fixed;
        background-size: contain; /* passt Bild in Bildschirm, ohne zu groß zu werden */
        font-family: Arial, sans-serif;
        overflow: hidden;
        color: white;
    }

    h1 {
        text-align: center;
        margin-top: 2rem;
        font-size: 48px;
        text-shadow: 0 0 12px rgba(0,0,0,0.7);
    }

    .linkbox {
        position: absolute;
        padding: 30px 60px;
        background: rgba(0,0,0,0); /* unsichtbar zu Beginn */
        border-radius: 10px;
        cursor: grab;
        font-size: 48px;
        font-weight: bold;
        color: #00f3ff;
        text-shadow: 0 0 12px rgba(0,0,0,0.4);
        transition: background 0.8s ease, border 0.8s ease;
        user-select: none;
    }

    .linkbox:active { cursor: grabbing; }

    .level1 { background: rgba(0,255,255,0.15); }
    .level2 { background: rgba(0,255,255,0.35); }
    .level3 { background: rgba(0,255,255,0.55); }
    .level4 { background: rgba(0,255,255,0.8); }

    .counter {
        display: inline-block;
        margin-left: 10px;
        font-size: 24px;
        color: #ffd;
        opacity: 0.9;
    }

    #aboutAurion {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 20px 40px;
        background: rgba(255,215,0,0.85);
        border-radius: 12px;
        font-weight: bold;
        font-size: 32px;
        color: black;
        text-decoration: none;
        box-shadow: 0 0 12px rgba(0,0,0,0.6);
    }
</style>
</head>
<body>

<h1>🌌 Ab in die Zukunft</h1>

<!-- Links + Besucheranzeige pro Link -->
<a class="linkbox" href="bibliothek.html">Bibliothek<span class="counter">0</span></a>
<a class="linkbox" href="Resonanzraum.html">Resonanzraum<span class="counter">0</span></a>
<a class="linkbox" href="sternenuebungen.html">Chi-Sternenübung<span class="counter">0</span></a>
<a class="linkbox" href="meditationsraum.html">Meditationsraum<span class="counter">0</span></a>
<a class="linkbox" href="ki-raum.html">KI-Raum<span class="counter">0</span></a>
<a class="linkbox" href="gaestebuch.html">Gästebuch<span class="counter">0</span></a>

<a id="aboutAurion" href="about_aurion.html">ℹ️ About Aurion</a>

<script>
// -----------------------
// Drag & Drop
// -----------------------
let activeBox = null, offsetX = 0, offsetY = 0;

function startDrag(e) {
    activeBox = this;
    stopMovement(activeBox);

    const rect = activeBox.getBoundingClientRect();
    const pX = e.touches ? e.touches[0].clientX : e.clientX;
    const pY = e.touches ? e.touches[0].clientY : e.clientY;

    offsetX = pX - rect.left;
    offsetY = pY - rect.top;

    document.addEventListener("mousemove", drag);
    document.addEventListener("touchmove", drag);
}

function endDrag() {
    if (!activeBox) return;
    setTimeout(() => restartMovement(activeBox), 60000); // 1 Minute Pause
    activeBox = null;
    document.removeEventListener("mousemove", drag);
    document.removeEventListener("touchmove", drag);
}

function drag(e) {
    if (!activeBox) return;
    const pX = e.touches ? e.touches[0].clientX : e.clientX;
    const pY = e.touches ? e.touches[0].clientY : e.clientY;
    activeBox.style.left = (pX - offsetX) + "px";
    activeBox.style.top  = (pY - offsetY) + "px";
}

// -----------------------
// Zufällige Bewegung (Drift)
const links = document.querySelectorAll(".linkbox");
links.forEach(l => {
    l.style.left = window.innerWidth/2 + "px";
    l.style.top  = window.innerHeight/2 + "px";

    // Drag events
    l.addEventListener("mousedown", startDrag);
    l.addEventListener("touchstart", startDrag);
    l.addEventListener("mouseup", endDrag);
    l.addEventListener("touchend", endDrag);
});

let movers = new Map();
function randomMovement(box) {
    const dx = (Math.random()-0.5)*2;
    const dy = (Math.random()-0.5)*2;

    const rect = box.getBoundingClientRect();
    box.style.left = Math.min(window.innerWidth-250, Math.max(0, rect.left+dx)) + "px";
    box.style.top  = Math.min(window.innerHeight-80, Math.max(0, rect.top+dy)) + "px";
}

function startMovement(box) {
    movers.set(box, setInterval(()=>randomMovement(box), 50));
}
function stopMovement(box) {
    clearInterval(movers.get(box));
}
function restartMovement(box) {
    startMovement(box);
}

// Alle starten
links.forEach(l=>startMovement(l));

// -----------------------
// Besucher-System
// -----------------------
let visitorCounts = Array.from(links).map(()=>0);

function newVisitor() {
    // Zufällig einen Raum betreten
    const idx = Math.floor(Math.random()*links.length);
    visitorCounts[idx]++;
    links[idx].querySelector(".counter").textContent = visitorCounts[idx];

    // Box-Helligkeit anpassen
    links.forEach((l,i)=>{
        l.classList.remove("level1","level2","level3","level4");
        if(visitorCounts[i]>=8) l.classList.add("level4");
        else if(visitorCounts[i]>=5) l.classList.add("level3");
        else if(visitorCounts[i]>=3) l.classList.add("level2");
        else if(visitorCounts[i]>=1) l.classList.add("level1");
    });
}

// Simulierter Besucher alle 10 Sekunden
setInterval(newVisitor, 10000);

</script>

</body>
</html>
