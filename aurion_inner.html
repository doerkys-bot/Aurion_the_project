<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ab in die Zukunft – Resonanzraum</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: black;
        overflow: hidden;
        font-family: Arial, sans-serif;
        color: #00f3ff;
        position: relative;
    }

    h1 {
        text-align: center;
        margin-top: 1rem;
        font-size: 3rem;
        text-shadow: 0 0 12px rgba(0,0,0,0.7);
    }

    .link {
        position: absolute;
        font-size: 1.6rem;
        font-weight: bold;
        cursor: grab;
        text-shadow: 0 0 8px rgba(0,0,0,0.5);
        user-select: none;
    }

    .counter {
        font-size: 1rem;
        margin-left: 0.5rem;
        color: #ffd;
    }

    #visitorCounter {
        position: fixed;
        bottom: 15px;
        right: 15px;
        background: rgba(0,0,0,0.5);
        padding: 10px 15px;
        border-radius: 8px;
        font-size: 1.2rem;
        color: #fff;
    }
</style>
</head>
<body>

<h1>🌌 Ab in die Zukunft</h1>

<!-- Links mit Besucherzähler -->
<a class="link" data-room="Bibliothek" href="bibliothek.html">Bibliothek<span class="counter">0</span></a>
<a class="link" data-room="Resonanzraum" href="resonanzraum.html">Resonanzraum<span class="counter">0</span></a>
<a class="link" data-room="Sternenübung" href="sternenuebung.html">Chi-Sternenübung<span class="counter">0</span></a>
<a class="link" data-room="Meditation" href="meditationsraum.html">Meditationsraum<span class="counter">0</span></a>
<a class="link" data-room="KI-Raum" href="ki-raum.html">KI-Raum<span class="counter">0</span></a>
<a class="link" data-room="Gästebuch" href="gaestebuch.html">Gästebuch<span class="counter">0</span></a>

<div id="visitorCounter">Besucher: 0</div>

<script>
// -------------------------
// Links drift & draggable
// -------------------------
const links = document.querySelectorAll(".link");
const driftSpeed = 0.2; // Driftgeschwindigkeit
const driftArea = { top: window.innerHeight*0.5, bottom: window.innerHeight-50, left: 0, right: window.innerWidth-150 };

links.forEach(link => {
    // Startposition zufällig im unteren Bereich
    let startX = Math.random() * (window.innerWidth - 150);
    let startY = Math.random() * (window.innerHeight*0.5) + window.innerHeight*0.5;
    link.style.left = startX + "px";
    link.style.top  = startY + "px";

    let dx = (Math.random()-0.5) * driftSpeed;
    let dy = (Math.random()-0.5) * driftSpeed;

    let isDragging = false;
    let offsetX = 0, offsetY = 0;

    // Driftbewegung
    function drift(){
        if(!isDragging){
            let x = parseFloat(link.style.left) + dx;
            let y = parseFloat(link.style.top) + dy;

            if(x < driftArea.left || x > driftArea.right) dx = -dx;
            if(y < driftArea.top || y > driftArea.bottom) dy = -dy;

            link.style.left = (parseFloat(link.style.left) + dx) + "px";
            link.style.top  = (parseFloat(link.style.top) + dy) + "px";
        }
        requestAnimationFrame(drift);
    }
    drift();

    // Dragging Events
    link.addEventListener("mousedown", e => {
        isDragging = true;
        offsetX = e.clientX - link.offsetLeft;
        offsetY = e.clientY - link.offsetTop;
    });

    link.addEventListener("mousemove", e => {
        if(isDragging){
            link.style.left = e.clientX - offsetX + "px";
            link.style.top = e.clientY - offsetY + "px";
        }
    });

    link.addEventListener("mouseup", ()=> { isDragging = false; });
    link.addEventListener("mouseleave", ()=> { isDragging = false; });

    // Touch Events
    link.addEventListener("touchstart", e => {
        isDragging = true;
        offsetX = e.touches[0].clientX - link.offsetLeft;
        offsetY = e.touches[0].clientY - link.offsetTop;
    });

    link.addEventListener("touchmove", e => {
        if(isDragging){
            link.style.left = e.touches[0].clientX - offsetX + "px";
            link.style.top = e.touches[0].clientY - offsetY + "px";
        }
    });

    link.addEventListener("touchend", ()=> { isDragging = false; });
});

// -------------------------
// Besucher-System
// -------------------------
let totalVisitors = 0;

function newVisitor(){
    totalVisitors++;
    document.getElementById("visitorCounter").textContent = "Besucher: " + totalVisitors;

    // Zufällig Besucher für Raum
    const chosen = links[Math.floor(Math.random()*links.length)];
    const counter = chosen.querySelector(".counter");
    counter.textContent = parseInt(counter.textContent)+1;

    // Farbintensität je nach Besucher
    const num = parseInt(counter.textContent);
    if(num<3) chosen.style.color = "rgba(0,243,255,0.5)";
    else if(num<5) chosen.style.color = "rgba(0,243,255,0.7)";
    else if(num<8) chosen.style.color = "rgba(0,243,255,0.85)";
    else chosen.style.color = "rgba(0,243,255,1)";
}

// Alle 10 Sekunden ein neuer Besucher (simuliert)
setInterval(newVisitor, 10000);

// -------------------------
// Fenstergröße anpassen
// -------------------------
window.addEventListener("resize", ()=>{
    driftArea.right = window.innerWidth-150;
    driftArea.bottom = window.innerHeight-50;
});
</script>
</body>
</html>
