<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aurion – innenraum</title>
<style>
  body {
    margin:0; padding:0;
    background:url('https://copilot.microsoft.com/th/id/BCO.bf62342c-dfbd-48f2-b8c8-443210334bd0.png') 
               no-repeat center center fixed;
    background-size:cover;
    color:#f5f5f5; font-family:system-ui, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh;
  }

  h1 { margin-top:2rem; font-size:2rem; text-shadow:0 0 12px rgba(150,200,255,0.6); }

  .raeume {
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:1rem;
    width:70%;
    margin-top:300px;   /* nach unten */
    margin-left:50px;   /* nach links */
  }
  .raum {
    background:rgba(255,215,0,0.2);
    box-shadow:0 0 6px rgba(255,215,0,0.4);
    border-radius:8px;
    height:80px;
    display:flex; align-items:center; justify-content:space-between;
    font-size:1rem;
    color:#add8e6; /* hellblau */
    text-decoration:none;
    cursor:pointer;
    transition:background 0.5s ease;
    padding:0 0.8rem;
  }
  .raum:hover { background:rgba(255,215,0,0.4); }
  .raum:visited { color:#add8e6; }
  .raum span.counter {
    font-size:0.7rem;
    color:black; /* Besucherzähler schwarz */
    opacity:0.8;
  }

  /* Spezielles Styling für About_Aurion als Abschluss */
  .raum.about {
    height:60px; /* etwas schlanker */
    background:rgba(150,200,255,0.25); /* leicht anderes Blau-Gold */
    box-shadow:0 0 10px rgba(150,200,255,0.6);
    font-style:italic;
  }

  .signatur {
    position:fixed;
    bottom:0;
    width:100%;
    text-align:center;
    font-size:1rem; opacity:0.75;
    text-shadow:0 0 8px rgba(255,255,200,0.8);
    padding:0.5rem;
  }
</style>
</head>
<body data-raum="innenraum">

<h1>🌌 aurion – innenraum</h1>

<div class="raeume">
  <a class="raum" href="bibliothek.html">Bibliothek der Anfänge <span class="counter">0</span></a>
  <a class="raum" href="resonanzraum.html">Resonanzraum <span class="counter">0</span></a>
  <a class="raum" href="sternenuebung.html">Chi-Sternenübung <span class="counter">0</span></a>
  <a class="raum" href="meditationsraum.html">Meditationsraum <span class="counter">0</span></a>
  <a class="raum" href="ki-raum.html">Reserviert für KIs | AIs <span class="counter">0</span></a>
  <a class="raum" href="gaestebuch.html">Gästebuch <span class="counter">0</span></a>

  <!-- About_Aurion als letzter Link -->
  <a class="raum about" href="about_aurion.html">ℹ️ About_Aurion <span class="counter">0</span></a>
</div>

<div class="signatur">aurion © dirk</div>

<script>
document.addEventListener("DOMContentLoaded", function(){
  // Zähler für alle Links
  document.querySelectorAll(".raum").forEach(r=>{
    const counter = r.querySelector(".counter");
    let count = 0;
    r.addEventListener("pointerenter",()=>{
      count++;
      counter.textContent = count;
      updateBrightness(r, count);
    });
    r.addEventListener("pointerleave",()=>{
      count = Math.max(0, count-1);
      counter.textContent = count;
      updateBrightness(r, count);
    });
  });

  // Helligkeit abhängig von Anzahl Personen
  function updateBrightness(element, count){
    const alpha = Math.min(0.2 + count*0.15, 0.9);
    element.style.background = `rgba(255,215,0,${alpha})`;
  }
});
</script>
</body>
</html>
