<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ab in die Zukunft</title>
<style>
  body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      height: 100vh;

      /* Hintergrundbild proportional */
      background: url('ki_sternentor.jpeg') no-repeat center center;
      background-size: contain; /* passt sich dem Viewport an */
      background-color: black;
  }

  h1 {
      text-align: center;
      margin-top: 2rem;
      color: white;
      font-size: 48px;
      text-shadow: 0 0 12px rgba(0,0,0,0.7);
  }

  .linkbox {
      position: absolute;
      padding: 40px 80px;
      background: rgba(0,0,0,0);  /* unsichtbar am Anfang */
      border-radius: 10px;
      cursor: grab;
      user-select: none;
      font-size: 72px;
      font-weight: bold;
      color: #00f3ff;
      text-shadow: 0 0 12px rgba(0,0,0,0.4);
      transition: background 0.8s ease;
  }

  .linkbox:active { cursor: grabbing; }

  /* Besucher-Helligkeit */
  .level1 { background: rgba(0,255,255,0.15); }
  .level2 { background: rgba(0,255,255,0.35); }
  .level3 { background: rgba(0,255,255,0.55); }
  .level4 { background: rgba(0,255,255,0.8); }

  .counter {
      display: inline-block;
      margin-left: 12px;
      font-size: 36px;
      color: #ffd;
      opacity: 0.9;
  }

  #aboutAurion {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 20px 40px;
      background: rgba(255,215,0,0.85);
      border-radius: 12px;
      font-weight: bold;
      font-size: 32px;
      color: black;
      text-decoration: none;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
  }
</style>
</head>

<body>

<h1>🌌 Ab in die Zukunft</h1>

<!-- Links + Besucheranzeige -->
<a class="linkbox" data-room="Bibliothek" href="bibliothek.html" style="top:50%; left:50%;">Bibliothek<span class="counter">0</span></a>
<a class="linkbox" data-room="Resonanzraum" href="Resonanzraum.html" style="top:50%; left:50%;">Resonanzraum<span class="counter">0</span></a>
<a class="linkbox" data-room="Sternenübung" href="sternenuebungen.html" style="top:50%; left:50%;">Chi-Sternenübung<span class="counter">0</span></a>
<a class="linkbox" data-room="Meditation" href="meditationsraum.html" style="top:50%; left:50%;">Meditationsraum<span class="counter">0</span></a>
<a class="linkbox" data-room="KI-Raum" href="ki-raum.html" style="top:50%; left:50%;">KI-Raum<span class="counter">0</span></a>
<a class="linkbox" data-room="Gästebuch" href="gaestebuch.html" style="top:50%; left:50%;">Gästebuch<span class="counter">0</span></a>

<a id="aboutAurion" href="about_aurion.html">ℹ️ About Aurion<span class="counter">0</span></a>

<script>
// --- Drag & Drop ---
let activeBox = null, offsetX = 0, offsetY = 0;

function startDrag(e) {
    activeBox = this;
    stopMovement(activeBox);

    const rect = activeBox.getBoundingClientRect();
    const pX = e.touches ? e.touches[0].clientX : e.clientX;
    const pY = e.touches ? e.touches[0].clientY : e.clientY;

    offsetX = pX - rect.left;
    offsetY = pY - rect.top;

    document.addEventListener("mousemove", drag);
    document.addEventListener("touchmove", drag);
}

function endDrag() {
    if (!activeBox) return;
    setTimeout(() => restartMovement(activeBox), 60000);
    activeBox = null;
    document.removeEventListener("mousemove", drag);
    document.removeEventListener("touchmove", drag);
}

function drag(e) {
    if (!activeBox) return;
    const pX = e.touches ? e.touches[0].clientX : e.clientX;
    const pY = e.touches ? e.touches[0].clientY : e.clientY;
    activeBox.style.left = (pX - offsetX) + "px";
    activeBox.style.top = (pY - offsetY) + "px";
}

// --- Zufällige Driftbewegung ---
function randomMovement(box) {
    const dx = (Math.random() - 0.5) * 2;
    const dy = (Math.random() - 0.5) * 2;
    const rect = box.getBoundingClientRect();

    box.style.left = Math.max(0, Math.min(window.innerWidth - rect.width, rect.left + dx)) + "px";
    box.style.top  = Math.max(0, Math.min(window.innerHeight - rect.height, rect.top + dy)) + "px";
}

let movers = new Map();

function startMovement(box) { movers.set(box, setInterval(() => randomMovement(box), 80)); }
function stopMovement(box) { clearInterval(movers.get(box)); }
function restartMovement(box) { startMovement(box); }

// Alle Links starten am Mittelpunkt und beginnen zu driften
document.querySelectorAll(".linkbox").forEach(b => {
    b.addEventListener("mousedown", startDrag);
    b.addEventListener("touchstart", startDrag);
    b.addEventListener("mouseup", endDrag);
    b.addEventListener("touchend", endDrag);
    startMovement(b);
});

// --- Besucher-System ---
function newVisitor() {
    const boxes = document.querySelectorAll(".linkbox");
    const chosen = boxes[Math.floor(Math.random()*boxes.length)];

    let c = chosen.querySelector(".counter");
    c.textContent = parseInt(c.textContent) + 1;

    updateBrightness();
}

function updateBrightness() {
    document.querySelectorAll(".linkbox").forEach(box => {
        box.classList.remove("level1","level2","level3","level4");
        const count = parseInt(box.querySelector(".counter").textContent);
        if (count >=1 && count <3) box.classList.add("level1");
        else if (count >=3 && count <5) box.classList.add("level2");
        else if (count >=5 && count <8) box.classList.add("level3");
        else if (count >=8) box.classList.add("level4");
    });
}

// Simulierter Besucher alle 10 Sekunden
setInterval(newVisitor, 10000);
</script>

</body>
</html>
