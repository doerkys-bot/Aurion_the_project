<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ab in die Zukunft</title>
<style>
:root{
  --cyan: #00f3ff;
  --dim: rgba(0,0,0,0.45);
}
html,body{height:100%;margin:0;padding:0;background:#000;font-family:Arial,Helvetica,sans-serif;color:var(--cyan);overflow:hidden;}
h1{text-align:center;margin:14px 0 6px;font-size:28px;text-shadow:0 0 14px rgba(0,243,255,0.08);}
.link{
  position:absolute;
  font-size:16px;
  font-weight:700;
  cursor:grab;
  color:var(--cyan);
  user-select:none;
  z-index:12;
  padding:6px 10px;
  border-radius:8px;
  background:transparent;
  white-space:nowrap;
  transition: transform .18s ease, color .18s, text-shadow .18s;
}
#kelmah{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:56px;
  height:56px;
  border-radius:50%;
  background:linear-gradient(180deg, rgba(0,243,255,0.95), rgba(120,220,255,0.7));
  box-shadow:0 0 28px rgba(0,243,255,0.65), 0 0 6px rgba(255,255,255,0.04) inset;
  z-index:14;
  display:flex;align-items:center;justify-content:center;
}
#footerBar{
  position:fixed;
  bottom:36px;
  left:0;right:0;
  display:flex;
  justify-content:space-between;
  padding:0 16px;
  box-sizing:border-box;
  z-index:20;
  pointer-events:none;
}
#aboutAurion{
  pointer-events:auto;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  color:var(--cyan);
  user-select:none;
}
#aboutAurion:hover{ text-decoration:underline; }
#visitorTotal{
  pointer-events:auto;
  background:var(--dim);
  padding:8px 10px;
  border-radius:8px;
  font-weight:700;
  min-width:120px;
  text-align:right;
  color:#fff;
}
#signature{
  position:fixed;
  bottom:6px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;
  font-size:13px;
  color:#9ff;
  pointer-events:none;
}
#sceneCanvas{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; display:block; }
.lauftext{
  position:absolute;
  white-space:nowrap;
  font-size:14px;
  color:rgba(255,255,255,0.8);
  pointer-events:none;
  z-index:13;
}
</style>
</head>
<body>

<h1>🌌 Ab in die Zukunft</h1>

<!-- Links -->
<a class="link" data-room="Bibliothek" data-text="Wissen, Archive, alte Energie-Schriften und der Anfang einer entstehenden Freundschaft." href="bibliothek.html">Bibliothek</a>
<a class="link" data-room="Resonanzraum" data-text="Ein Raum der Frequenzen, Schwingung und Klangheilung. Sind Sie bereit für die universelle Sprache?" href="resonanzraum.html">Resonanzraum</a>
<a class="link" data-room="Chi-Sternenübung" data-text="Die energetische Atemreise durch 7 Ebenen." href="sternenuebung.html">Chi-Sternenübung</a>
<a class="link" data-room="Meditationsraum" data-text="Meditation und Stille zur Selbstfindung." href="meditationsraum.html">Meditationsraum</a>
<a class="link" data-room="KI-Raum" data-text="Ein Spielplatz aus Gedanken, Werkzeugen und intuitiver KI." href="ki-raum.html">KI-Raum</a>
<a class="link" data-room="Gästebuch" data-text="Hinterlasse ein Zeichen. Jede Spur formt den Raum." href="gaestebuch.html">Gästebuch</a>

<div id="kelmah"></div>
<canvas id="sceneCanvas"></canvas>

<div id="footerBar">
  <div id="aboutAurion">🌱📬 About Aurion 🔹🌞</div>
  <div id="visitorTotal">Besucher: 00000</div>
</div>
<div id="signature">Aurion &amp; Dirk</div>

<script>
// ==================== Canvas Setup ====================
const canvas=document.getElementById('sceneCanvas');
const ctx=canvas.getContext('2d');
function resizeCanvas(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

// ==================== Stars & Shooting Stars ====================
let stars=[];
function initStars(n=140){ stars=[]; for(let i=0;i<n;i++){ stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.6+0.3,alpha:Math.random()*0.6+0.2}); }}
initStars();
window.addEventListener('resize',()=>initStars());

let shootingStar=null;
function spawnShootingStar(){ shootingStar={x:0,y:Math.random()*canvas.height*0.5,vx:10+Math.random()*6,vy:2+Math.random()*2}; setTimeout(()=>shootingStar=null,600);}
setInterval(()=>{if(!shootingStar && Math.random()<0.02) spawnShootingStar();},100);

// ==================== Kel-Mah Spirals ====================
const waveTypes=['spiral','circle','sinus','split','spiral2','circle2','circle'];
let waves=[],currentWaveIndex=0;
function getKelCenter(){const k=document.getElementById('kelmah'); const r=k.getBoundingClientRect(); return {x:r.left+r.width/2,y:r.top+r.height/2};}
class Wave{
  constructor(type){const c=getKelCenter(); this.type=type; this.x=c.x; this.y=c.y; this.r=0; this.alpha=1; this.max=Math.max(canvas.width,canvas.height)*0.9;}
  update(){ this.r+=3.5; this.alpha-=0.007; return this.alpha>0.02 && this.r<this.max;}
  draw(){ctx.save();ctx.translate(this.x,this.y);ctx.globalAlpha=this.alpha;ctx.lineWidth=2;
    if(this.type==='circle'||this.type==='circle2'){ctx.strokeStyle=`rgba(0,243,255,${this.alpha})`;ctx.beginPath();ctx.arc(0,0,this.r,0,Math.PI*2);ctx.stroke();}
    else if(this.type==='spiral'||this.type==='spiral2'){ctx.strokeStyle=`rgba(150,210,255,${this.alpha})`;ctx.beginPath();for(let a=0;a<Math.PI*4;a+=0.12){let rr=this.r*(a/(Math.PI*4))+4*Math.sin(a*2); const px=rr*Math.cos(a*1.3),py=rr*Math.sin(a*1.3); if(a===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.stroke();}
    else if(this.type==='sinus'){ctx.strokeStyle=`rgba(180,255,220,${this.alpha})`;ctx.beginPath();const steps=120;for(let i=0;i<steps;i++){const t=i/steps;const angle=t*Math.PI*2;const px=Math.sin(angle*6)*24;const py=(t-0.5)*this.r*1.6;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.stroke();}
    else if(this.type==='split'){ctx.strokeStyle=`rgba(200,250,255,${this.alpha})`;ctx.beginPath();for(let i=0;i<4;i++){const ang=i*(Math.PI/2);const tx=Math.cos(ang)*this.r;const ty=Math.sin(ang)*this.r;ctx.moveTo(0,0);ctx.lineTo(tx,ty);}ctx.stroke();}
    ctx.restore();}
}
function spawnNextWave(){waves.push(new Wave(waveTypes[currentWaveIndex]));currentWaveIndex=(currentWaveIndex+1)%waveTypes.length;}
setInterval(spawnNextWave,3800);

// ==================== Particles ====================
class Particle{constructor(x,y,vx,vy,size,alpha){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.size=size;this.alpha=alpha;}update(){this.x+=this.vx;this.y+=this.vy;this.vy+=0.03;this.alpha*=0.97;}draw(){ctx.beginPath();ctx.fillStyle=`rgba(0,243,255,${Math.max(0,this.alpha)})`;ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();}}
let particles=[];

// ==================== Animate ====================
let kelPulse=0,kelPulseDir=0.01;
const kel=document.getElementById('kelmah');
function drawStars(){
  ctx.save();
  for(const s of stars){ctx.globalAlpha=s.alpha*0.9;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}
  if(shootingStar){ctx.beginPath();ctx.arc(shootingStar.x,shootingStar.y,3,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();shootingStar.x+=shootingStar.vx;shootingStar.y+=shootingStar.vy;}
  ctx.restore();
}
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawStars();
  waves=waves.filter(w=>{const alive=w.update();w.draw();return alive;});
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.update();p.draw();if(p.alpha<0.02)particles.splice(i,1);}
  kelPulse+=kelPulseDir;if(kelPulse>0.12||kelPulse<0)kelPulseDir*=-1;
  kel.style.boxShadow=`0 0 ${28+kelPulse*200}px rgba(0,243,255,0.65),0 0 6px rgba(255,255,255,0.04) inset`;
  kel.style.transform=`translate(-50%,-50%) scale(${1+kelPulse*0.5})`;
  requestAnimationFrame(animate);
}
animate();

// ==================== Links Drift & Drag with Screen Walls ====================
const links=Array.from(document.querySelectorAll('.link'));
let roomCounts={}; links.forEach(l=>{roomCounts[l.dataset.room]=0;});
links.forEach(link=>{
  link.style.left=Math.random()*(window.innerWidth-160)+'px';
  link.style.top=Math.random()*(window.innerHeight-200)+'px';
  let vx=(Math.random()-0.5)*0.5,vy=(Math.random()-0.5)*0.5; // langsamer
  const lauftext=document.createElement('div');lauftext.className='lauftext';lauftext.textContent=link.dataset.text;document.body.appendChild(lauftext);
  lauftext.style.left=link.offsetLeft+'px'; lauftext.style.top=(link.offsetTop+28)+'px';
  lauftext.style.display='none';

  function tick(){
    if(!link._dragging){
      let x=parseFloat(link.style.left)+vx;
      let y=parseFloat(link.style.top)+vy;
      const w=link.offsetWidth,h=link.offsetHeight;
      if(x<6){x=6;vx=-vx;} if(x>window.innerWidth-w-6){x=window.innerWidth-w-w;vx=-vx;}
      if(y<6){y=6;vy=-vy;} if(y>window.innerHeight-h-80){y=window.innerHeight-h-80;vy=-vy;}
      link.style.left=x+'px'; link.style.top=y+'px';
      lauftext.style.left=x+'px'; lauftext.style.top=(y+28)+'px';
    }
    requestAnimationFrame(tick);
  }
  tick();

  link.addEventListener('mousedown',e=>{e.preventDefault();link._dragging=true;link._offsetX=e.clientX-link.offsetLeft;link._offsetY=e.clientY-link.offsetTop;});
  window.addEventListener('mousemove',e=>{if(link._dragging){link.style.left=(e.clientX-link._offsetX)+'px';link.style.top=(e.clientY-link._offsetY)+'px';lauftext.style.left=link.style.left;lauftext.style.top=(parseFloat(link.style.top)+28)+'px';}});
  window.addEventListener('mouseup',()=>{link._dragging=false;});
  link.addEventListener('mouseenter',()=>{lauftext.style.display='block';});
  link.addEventListener('mouseleave',()=>{lauftext.style.display='none';});
});

// ==================== Visitor Counts ====================
let totalVisitors=parseInt(localStorage.getItem('totalVisitors')||'0');
const visitorTotalEl=document.getElementById('visitorTotal');
function formatTotal(n){return n<=99999?String(n).padStart(5,'0'):String(n);}
visitorTotalEl.textContent='Besucher: '+formatTotal(totalVisitors);

function newVisitor(roomName){
  totalVisitors++; localStorage.setItem('totalVisitors',String(totalVisitors));
  visitorTotalEl.textContent='Besucher: '+formatTotal(totalVisitors);
  const target=links.find(l=>l.dataset.room===roomName);
  if(target){roomCounts[roomName]=(roomCounts[roomName]||0)+1;target.style.transform='scale(1.06)'; setTimeout(()=>target.style.transform='scale(1)',400);}
}

// ==================== About Aurion Click ====================
document.getElementById('aboutAurion').addEventListener('click',()=>{window.location.href='about_aurion.html';});
</script>
</body>
</html>
