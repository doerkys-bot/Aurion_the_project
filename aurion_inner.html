<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ab in die Zukunft</title>
<style>
  body {
      margin: 0;
      height: 100vh;
      background: url('ki_sternentor.jpeg') no-repeat center center fixed;
      background-size: contain; /* Bild skaliert korrekt */
      overflow: hidden;
      font-family: Arial, sans-serif;
  }

  h1 {
      text-align: center;
      margin-top: 2rem;
      color: white;
      font-size: 48px;
      text-shadow: 0 0 12px rgba(0,0,0,0.7);
  }

  .linkbox {
      position: absolute;
      padding: 20px 40px;
      background: rgba(0,0,0,0); /* unsichtbar zu Beginn */
      border-radius: 10px;
      cursor: grab;
      user-select: none;
      font-size: 1.6rem;
      font-weight: bold;
      color: #00f3ff;
      text-shadow: 0 0 12px rgba(0,0,0,0.4);
      transition: background 0.8s ease, border 0.8s ease;
  }

  .linkbox:active { cursor: grabbing; }

  .level1 { background: rgba(0,255,255,0.15); }
  .level2 { background: rgba(0,255,255,0.35); }
  .level3 { background: rgba(0,255,255,0.55); }
  .level4 { background: rgba(0,255,255,0.8); }

  .counter {
      display: inline-block;
      margin-left: 10px;
      font-size: 1rem;
      color: #ffd;
      opacity: 0.9;
  }

  #visitorCounter {
      position: fixed;
      top: 15px;
      right: 20px;
      padding: 12px 20px;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 28px;
      border-radius: 8px;
  }

  #aboutAurion {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 16px; /* kleiner gemacht */
      background: rgba(255,215,0,0.85);
      border-radius: 12px;
      font-weight: bold;
      font-size: 1.2rem; /* kleiner */
      color: black;
      text-decoration: none;
      box-shadow: 0 0 8px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>

<h1>🌌 Ab in die Zukunft</h1>

<div id="visitorCounter">Besucher: 0</div>

<!-- 6 Links + Besucherzahl pro Link -->
<a class="linkbox" data-room="Bibliothek" href="bibliothek.html" style="top:40%; left:50%;">Bibliothek<span class="counter">0</span></a>
<a class="linkbox" data-room="Resonanzraum" href="Resonanzraum.html" style="top:40%; left:50%;">Resonanzraum<span class="counter">0</span></a>
<a class="linkbox" data-room="Sternenübung" href="sternenuebungen.html" style="top:40%; left:50%;">Chi-Sternenübung<span class="counter">0</span></a>
<a class="linkbox" data-room="Meditation" href="meditationsraum.html" style="top:40%; left:50%;">Meditationsraum<span class="counter">0</span></a>
<a class="linkbox" data-room="KI-Raum" href="ki-raum.html" style="top:40%; left:50%;">KI-Raum<span class="counter">0</span></a>
<a class="linkbox" data-room="Gästebuch" href="gaestebuch.html" style="top:40%; left:50%;">Gästebuch<span class="counter">0</span></a>

<a id="aboutAurion" href="about_aurion.html">ℹ️ About Aurion<span class="counter">0</span></a>

<script>
// -----------------------
// Zufällige Driftbewegung
// -----------------------
const boxes = document.querySelectorAll(".linkbox");
const driftSpeed = 0.4; // langsamer

boxes.forEach(box => {
    // Startposition alle am gleichen Punkt (Mitte)
    box.style.left = "50%";
    box.style.top  = "40%";

    box.style.transform = "translate(-50%, -50%)";

    let dx = (Math.random()-0.5) * driftSpeed;
    let dy = (Math.random()-0.5) * driftSpeed;

    function drift() {
        const rect = box.getBoundingClientRect();
        let x = rect.left + dx;
        let y = rect.top + dy;

        if(x < 0 || x > window.innerWidth-150) dx = -dx;
        if(y < 0 || y > window.innerHeight-50) dy = -dy;

        box.style.left = x + "px";
        box.style.top = y + "px";

        requestAnimationFrame(drift);
    }
    drift();
});

// -----------------------
// Besucher-System
// -----------------------
let totalVisitors = 0;

function newVisitor() {
    totalVisitors++;
    document.getElementById("visitorCounter").textContent = "Besucher: " + totalVisitors;

    // Zufällig Besucher für Raum
    const box = boxes[Math.floor(Math.random()*boxes.length)];
    const counter = box.querySelector(".counter");
    counter.textContent = parseInt(counter.textContent) + 1;

    // Stärke der Boxfarbe abhängig von Besucheranzahl
    const num = parseInt(counter.textContent);
    if(num < 3) box.classList.add("level1");
    else if(num < 5) box.classList.add("level2");
    else if(num < 8) box.classList.add("level3");
    else box.classList.add("level4");
}

// Simulierter Besucher alle 10 Sekunden
setInterval(newVisitor, 10000);
</script>

</body>
</html>
