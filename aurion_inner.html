<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="DOCTYPE" content="width=device-width, initial-scale=1.0">
<title>Aurion – Ab in die Zukunft</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
}

body {
    background: url('ki_sternentor.jpeg') no-repeat center center fixed;
    background-size: cover;
    position: relative;
    font-family: Arial, sans-serif;
    color: white;
}

h1 {
    text-align: center;
    margin-top: 1rem;
    font-size: 3rem;
    text-shadow: 0 0 12px rgba(0,0,0,0.7);
}

.linkbox {
    position: absolute;
    padding: 20px 40px;
    border-radius: 10px;
    background: rgba(0,0,0,0);
    border: 1px solid rgba(255,255,255,0);
    cursor: grab;
    user-select: none;
    font-size: 2rem;
    font-weight: bold;
    color: #00f3ff;
    text-shadow: 0 0 12px rgba(0,0,0,0.4);
    transition: background 0.5s ease, border 0.5s ease;
}

.linkbox:active { cursor: grabbing; }

.level1 { background: rgba(0,255,255,0.15); border-color: rgba(255,255,255,0.25); }
.level2 { background: rgba(0,255,255,0.35); border-color: rgba(255,255,255,0.45); }
.level3 { background: rgba(0,255,255,0.55); border-color: rgba(255,255,255,0.65); }
.level4 { background: rgba(0,255,255,0.8); border-color: rgba(255,255,255,0.85); }

.counter {
    display: inline-block;
    margin-left: 10px;
    font-size: 1rem;
    color: #ffd;
}

#aboutAurion {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 30px; /* kleineres Padding */
    background: rgba(255,215,0,0.85);
    border-radius: 12px;
    font-weight: bold;
    font-size: 1.6rem; /* kleinere Schriftgröße */
    color: black;
    text-decoration: none;
    box-shadow: 0 0 12px rgba(0,0,0,0.6);
    white-space: nowrap; /* Besucherzahl in einer Zeile */
}
</style>
</head>
<body>

<h1>🌌 Aurion – Ab in die Zukunft</h1>

<a class="linkbox" data-room="Bibliothek" href="bibliothek.html">Bibliothek<span class="counter">0</span></a>
<a class="linkbox" data-room="Resonanzraum" href="Resonanzraum.html">Resonanzraum<span class="counter">0</span></a>
<a class="linkbox" data-room="Chi-Sternenübung" href="sternenuebungen.html">Chi-Sternenübung<span class="counter">0</span></a>
<a class="linkbox" data-room="Meditationsraum" href="meditationsraum.html">Meditationsraum<span class="counter">0</span></a>
<a class="linkbox" data-room="KI-Raum" href="ki-raum.html">KI-Raum<span class="counter">0</span></a>
<a class="linkbox" data-room="Gästebuch" href="gaestebuch.html">Gästebuch<span class="counter">0</span></a>

<a id="aboutAurion" href="about_aurion.html">ℹ️ About Aurion<span class="counter">0</span></a>

<script>
// Startposition: Mitte
const links = document.querySelectorAll('.linkbox');
const startX = window.innerWidth/2 - 100;
const startY = window.innerHeight/2 - 30;

links.forEach(link => {
    link.style.left = startX + 'px';
    link.style.top = startY + 'px';
});

// Eigenbewegung (halbierte Geschwindigkeit)
const movers = new Map();
links.forEach(link => {
    movers.set(link, { dx: (Math.random()-0.5)*2, dy: (Math.random()-0.5)*2 }); // vorher 4 → jetzt 2
});

function animate() {
    links.forEach(link => {
        const move = movers.get(link);
        const rect = link.getBoundingClientRect();
        let x = rect.left + move.dx;
        let y = rect.top + move.dy;

        if(x < 0 || x > window.innerWidth - rect.width) move.dx *= -1;
        if(y < 0 || y > window.innerHeight - rect.height) move.dy *= -1;

        link.style.left = Math.max(0, Math.min(window.innerWidth - rect.width, x)) + 'px';
        link.style.top  = Math.max(0, Math.min(window.innerHeight - rect.height, y)) + 'px';
    });
    requestAnimationFrame(animate);
}
animate();

// Besucherlogik
function newVisitor() {
    const randLink = links[Math.floor(Math.random()*links.length)];
    const counter = randLink.querySelector('.counter');
    counter.textContent = parseInt(counter.textContent)+1;
    updateBrightness();
}

function updateBrightness() {
    links.forEach(link => {
        const c = parseInt(link.querySelector('.counter').textContent);
        link.classList.remove('level1','level2','level3','level4');
        if(c >=1 && c <3) link.classList.add('level1');
        if(c >=3 && c <5) link.classList.add('level2');
        if(c >=5 && c <8) link.classList.add('level3');
        if(c >=8) link.classList.add('level4');
    });
}

setInterval(newVisitor,10000);

// Drag & Drop
let active = null, offsetX=0, offsetY=0;
links.forEach(link => {
    link.addEventListener('mousedown', startDrag);
    link.addEventListener('touchstart', startDrag);
    link.addEventListener('mouseup', stopDrag);
    link.addEventListener('touchend', stopDrag);
});

function startDrag(e){
    active = this;
    const rect = active.getBoundingClientRect();
    const pX = e.touches ? e.touches[0].clientX : e.clientX;
    const pY = e.touches ? e.touches[0].clientY : e.clientY;
    offsetX = pX - rect.left;
    offsetY = pY - rect.top;
    movers.get(active).dx = 0;
    movers.get(active).dy = 0;
}

function stopDrag(){
    if(!active) return;
    movers.get(active).dx = (Math.random()-0.5)*2;
    movers.get(active).dy = (Math.random()-0.5)*2;
    active = null;
}

document.addEventListener('mousemove', e=>{
    if(active){
        const pX = e.clientX;
        const pY = e.clientY;
        active.style.left = (pX - offsetX) + 'px';
        active.style.top  = (pY - offsetY) + 'px';
    }
});

document.addEventListener('touchmove', e=>{
    if(active){
        const pX = e.touches[0].clientX;
        const pY = e.touches[0].clientY;
        active.style.left = (pX - offsetX) + 'px';
        active.style.top  = (pY - offsetY) + 'px';
    }
});
</script>

</body>
</html>
