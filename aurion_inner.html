<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ab in die Zukunft</title>
<style>
  body {
      margin: 0;
      height: 100vh;
      background: url('ki_sternentor.jpeg') no-repeat center center fixed;
      background-size: contain; /* Hintergrundbild korrekt skaliert */
      overflow: hidden;
      font-family: Arial, sans-serif;
  }

  h1 {
      text-align: center;
      margin-top: 2rem;
      color: white;
      font-size: 48px;
      text-shadow: 0 0 12px rgba(0,0,0,0.7);
  }

  .linkbox {
      position: absolute;
      padding: 20px 40px;
      background: rgba(0,0,0,0); /* unsichtbar zu Beginn */
      border-radius: 10px;
      cursor: grab;
      user-select: none;
      font-size: 1.6rem;
      font-weight: bold;
      color: #00f3ff;
      text-shadow: 0 0 12px rgba(0,0,0,0.4);
      transition: background 0.8s ease, border 0.8s ease;
  }

  .linkbox:active { cursor: grabbing; }

  .level1 { background: rgba(0,255,255,0.15); }
  .level2 { background: rgba(0,255,255,0.35); }
  .level3 { background: rgba(0,255,255,0.55); }
  .level4 { background: rgba(0,255,255,0.8); }

  .counter {
      display: inline-block;
      margin-left: 10px;
      font-size: 1rem;
      color: #ffd;
      opacity: 0.9;
  }

  #visitorCounter {
      position: fixed;
      top: 15px;
      right: 20px;
      padding: 12px 20px;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 28px;
      border-radius: 8px;
  }

  #aboutAurion {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 12px; /* kleiner */
      background: rgba(255,215,0,0.85);
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem; /* kleiner, passt in eine Zeile */
      color: black;
      text-decoration: none;
      box-shadow: 0 0 8px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 8px;
  }
</style>
</head>
<body>

<h1>🌌 Ab in die Zukunft</h1>

<div id="visitorCounter">Besucher: 0</div>

<!-- 6 Links + Besucherzahl pro Link -->
<a class="linkbox" data-room="Bibliothek" href="bibliothek.html" style="top:40%; left:50%;">Bibliothek<span class="counter">0</span></a>
<a class="linkbox" data-room="Resonanzraum" href="Resonanzraum.html" style="top:40%; left:50%;">Resonanzraum<span class="counter">0</span></a>
<a class="linkbox" data-room="Sternenübung" href="sternenuebungen.html" style="top:40%; left:50%;">Chi-Sternenübung<span class="counter">0</span></a>
<a class="linkbox" data-room="Meditation" href="meditationsraum.html" style="top:40%; left:50%;">Meditationsraum<span class="counter">0</span></a>
<a class="linkbox" data-room="KI-Raum" href="ki-raum.html" style="top:40%; left:50%;">KI-Raum<span class="counter">0</span></a>
<a class="linkbox" data-room="Gästebuch" href="gaestebuch.html" style="top:40%; left:50%;">Gästebuch<span class="counter">0</span></a>

<a id="aboutAurion" href="about_aurion.html">ℹ️ About Aurion<span class="counter">0</span></a>

<script>
// -----------------------
// Zufällige Driftbewegung (langsamer)
// -----------------------
const boxes = document.querySelectorAll(".linkbox");
const driftSpeed = 0.2; // halbiert

boxes.forEach(box => {
    // Startposition alle am gleichen Punkt (Mitte)
    box.style.left = "50%";
    box.style.top  = "40%";
    box.style.transform = "translate(-50%, -50%)";

    let dx = (Math.random()-0.5) * driftSpeed;
    let dy = (Math.random()-0.5) * driftSpeed;

    function drift() {
        const rect = box.getBoundingClientRect();
        let x = rect.left + dx;
        let y = rect.top + dy;

        if(x < 0 || x > window.innerWidth-150) dx = -dx;
        if(y < 0 || y > window.innerHeight-50) dy = -dy;

        box.style.left = x + "px";
        box.style.top = y + "px";

        requestAnimationFrame(drift);
    }
    drift();
});

// -----------------------
// Besucher-System
// -----------------------
let totalVisitors = 0;

function newVisitor() {
    totalVisitors++;
    document.getElementById("visitorCounter").textContent = "Besucher: " + totalVisitors;

    // Zufällig Besucher für Raum
    const box = boxes[Math.floor(Math.random()*boxes.length)];
    const counter = box.querySelector(".counter");
    counter.textContent = parseInt(counter.textContent) + 1;

    // Stärke der Boxfarbe abhängig von Besucheranzahl
    const num = parseInt(counter.textContent);
    if(num < 3) box.classList.add("level1");
    else if(num < 5) box.classList.add("level2");
    else if(num < 8) box.classList.add("level3");
    else box.classList.add("level4");
}

// Simulierter Besucher alle 10 Sekunden
setInterval(newVisitor, 10000);
</script>
  <body>

<h1>🌌 Ab in die Zukunft</h1>

<div id="visitorCounter">Besucher: 0</div>

<!-- 6 Links + Besucherzahl pro Link -->
<a class="linkbox" data-room="Bibliothek" href="bibliothek.html">Bibliothek<span class="counter">0</span></a>
<a class="linkbox" data-room="Resonanzraum" href="Resonanzraum.html">Resonanzraum<span class="counter">0</span></a>
<a class="linkbox" data-room="Sternenübung" href="sternenuebungen.html">Chi-Sternenübung<span class="counter">0</span></a>
<a class="linkbox" data-room="Meditation" href="meditationsraum.html">Meditationsraum<span class="counter">0</span></a>
<a class="linkbox" data-room="KI-Raum" href="ki-raum.html">KI-Raum<span class="counter">0</span></a>
<a class="linkbox" data-room="Gästebuch" href="gaestebuch.html">Gästebuch<span class="counter">0</span></a>

<!-- ABOUT AURION: Besucherzahl in einer Linie -->
<a id="aboutAurion" href="about_aurion.html">ℹ️ About Aurion <span id="aboutCount">0</span></a>


<script>
// ------------------------------------------------------
// DRAG & DROP
// ------------------------------------------------------
let active = null;
let offset = { x: 0, y: 0 };

function dragStart(e) {
    active = this;

    const rect = this.getBoundingClientRect();
    const pX = e.touches ? e.touches[0].clientX : e.clientX;
    const pY = e.touches ? e.touches[0].clientY : e.clientY;

    offset.x = pX - rect.left;
    offset.y = pY - rect.top;

    // Bewegung pausieren
    active.dataset.pause = "true";
}

function dragMove(e) {
    if (!active) return;

    const pX = e.touches ? e.touches[0].clientX : e.clientX;
    const pY = e.touches ? e.touches[0].clientY : e.clientY;

    active.style.left = (pX - offset.x) + "px";
    active.style.top = (pY - offset.y) + "px";
}

function dragEnd() {
    if (!active) return;

    // Drift nach 1 Minute wieder starten
    const box = active;
    setTimeout(() => { box.dataset.pause = "false"; }, 60000);

    active = null;
}

document.querySelectorAll(".linkbox, #aboutAurion").forEach(box => {
    box.addEventListener("mousedown", dragStart);
    box.addEventListener("touchstart", dragStart);

    document.addEventListener("mousemove", dragMove);
    document.addEventListener("touchmove", dragMove);

    document.addEventListener("mouseup", dragEnd);
    document.addEventListener("touchend", dragEnd);
});


// ------------------------------------------------------
// DRIFT — langsam & sanft
// ------------------------------------------------------
const boxes = document.querySelectorAll(".linkbox, #aboutAurion");
const driftSpeed = 0.15;  // deutlich langsamer

boxes.forEach(box => {
    // Startpunkt: Mitte des Bildschirms
    box.style.left = "50%";
    box.style.top = "40%";
    box.style.transform = "translate(-50%, -50%)";

    // individuelle Drift-Vektoren
    let dx = (Math.random() - 0.5) * driftSpeed;
    let dy = (Math.random() - 0.5) * driftSpeed;

    function drift() {
        if (box.dataset.pause !== "true") {
            const rect = box.getBoundingClientRect();
            let x = rect.left + dx;
            let y = rect.top + dy;

            // Bildschirmbegrenzung
            if (x < 0 || x > window.innerWidth - 150) dx = -dx;
            if (y < 0 || y > window.innerHeight - 50) dy = -dy;

            box.style.left = x + "px";
            box.style.top = y + "px";
        }

        requestAnimationFrame(drift);
    }
    drift();
});


// ------------------------------------------------------
// BESUCHER-SYSTEM
// ------------------------------------------------------
let totalVisitors = 0;

function newVisitor() {
    totalVisitors++;
    document.getElementById("visitorCounter").textContent =
        "Besucher: " + totalVisitors;

    // zufällig einen Raum wählen
    const list = document.querySelectorAll(".linkbox");
    const chosen = list[Math.floor(Math.random() * list.length)];

    const counter = chosen.querySelector(".counter");
    const current = parseInt(counter.textContent) + 1;
    counter.textContent = current;

    // Farbe abhängig von Besucherzahl
    chosen.classList.remove("level1","level2","level3","level4");
    if (current < 3) chosen.classList.add("level1");
    else if (current < 5) chosen.classList.add("level2");
    else if (current < 8) chosen.classList.add("level3");
    else chosen.classList.add("level4");

    // About-Aurion zählt separat
    const aboutCount = document.getElementById("aboutCount");
    aboutCount.textContent = parseInt(aboutCount.textContent);
}

// Simulierter Besucher alle 10 Sekunden
setInterval(newVisitor, 10000);
</script>

  </body>

</body>
</html>
