<!DOCTYPE html><html lang="de">
<head>
<meta charset="UTF-8">
<title>Aurion – Innerer Raum</title><style>
  body {
      margin: 0;
      height: 100vh;
      background: url('ki_sternentor.jpeg') no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
      font-family: Arial, sans-serif;
  }

  h1 {
      text-align: center;
      margin-top: 2rem;
      color: white;
      font-size: 48px;
      text-shadow: 0 0 12px rgba(0,0,0,0.7);
  }

  .linkbox {
      position: absolute;
      padding: 45px 81px;
      background: rgba(0,0,0,0);
      border: 1px solid rgba(255,255,255,0);
      border-radius: 10px;
      font-size: 72px;
      font-weight: bold;
      color: #00f3ff;
      text-shadow: 0 0 12px rgba(0,0,0,0.4);
      transition: background 0.8s ease, border 0.8s ease, left 0.1s linear, top 0.1s linear;
      cursor: grab;
      user-select: none;
  }

  .linkbox:active { cursor: grabbing; }

  .level1 { background: rgba(0,255,255,0.15); border-color: rgba(255,255,255,0.25); }
  .level2 { background: rgba(0,255,255,0.35); border-color: rgba(255,255,255,0.45); }
  .level3 { background: rgba(0,255,255,0.55); border-color: rgba(255,255,255,0.65); }
  .level4 { background: rgba(0,255,255,0.8);  border-color: rgba(255,255,255,0.85); }

  .counter {
      display: block;
      margin-top: 10px;
      font-size: 30px;
      color: #ffd;
      opacity: 0.9;
  }

  #visitorCounter {
      position: fixed;
      top: 15px;
      right: 20px;
      padding: 12px 20px;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 28px;
      border-radius: 8px;
  }

  #aboutAurion {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 20px 40px;
      background: rgba(255,215,0,0.85);
      border-radius: 12px;
      font-weight: bold;
      font-size: 32px;
      color: black;
      text-decoration: none;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
  }
</style></head><body><h1>🌌 Aurion – Innerer Raum</h1><div id="visitorCounter">Besucher: 0</div><a class="linkbox" data-room="Bibliothek"        href="bibliothek.html"      style="top:18%; left:10%;">Bibliothek<span class="counter">0</span></a> <a class="linkbox" data-room="Resonanzraum"      href="Resonanzraum.html"    style="top:38%; left:25%;">Resonanzraum<span class="counter">0</span></a> <a class="linkbox" data-room="Sternenübung"      href="sternenuebungen.html" style="top:60%; left:20%;">Chi-Sternenübung<span class="counter">0</span></a> <a class="linkbox" data-room="Meditation"        href="meditationsraum.html" style="top:20%; left:60%;">Meditationsraum<span class="counter">0</span></a> <a class="linkbox" data-room="KI-Raum"           href="ki-raum.html"         style="top:45%; left:70%;">KI-Raum<span class="counter">0</span></a> <a class="linkbox" data-room="Gästebuch"         href="gaestebuch.html"      style="top:70%; left:50%;">Gästebuch<span class="counter">0</span></a>

<a id="aboutAurion" href="about_aurion.html">ℹ️ About Aurion</a>

<script>
let movers = new Map();
let activeBox = null, offsetX = 0, offsetY = 0;

document.querySelectorAll(".linkbox").forEach(box => {
    function animate() {
        if (movers.get(box).moving && !activeBox) {
            let x = parseFloat(box.style.left);
            let y = parseFloat(box.style.top);
            x += (Math.random() - 0.5) * 1.5;
            y += (Math.random() - 0.5) * 1.5;
            box.style.left = Math.max(0, Math.min(window.innerWidth-250, x)) + "px";
            box.style.top  = Math.max(0, Math.min(window.innerHeight-80, y)) + "px";
        }
        requestAnimationFrame(animate);
    }

    movers.set(box, { moving: true });
    animate();

    box.addEventListener("mousedown", e => {
        activeBox = box;
        movers.get(box).moving = false;
        const rect = box.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        document.addEventListener("mousemove", drag);
        document.addEventListener("mouseup", drop);
    });

    box.addEventListener("touchstart", e => {
        activeBox = box;
        movers.get(box).moving = false;
        const rect = box.getBoundingClientRect();
        offsetX = e.touches[0].clientX - rect.left;
        offsetY = e.touches[0].clientY - rect.top;
        document.addEventListener("touchmove", drag);
        document.addEventListener("touchend", drop);
    });

    function drag(e) {
        if (!activeBox) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        activeBox.style.left = (clientX - offsetX) + "px";
        activeBox.style.top  = (clientY - offsetY) + "px";
    }

    function drop() {
        if (!activeBox) return;
        setTimeout(() => movers.get(activeBox).moving = true, 60000);
        activeBox = null;
        document.removeEventListener("mousemove", drag);
        document.removeEventListener("mouseup", drop);
        document.removeEventListener("touchmove", drag);
        document.removeEventListener("touchend", drop);
    }
});

let totalVisitors = 0;

function newVisitor() {
    totalVisitors++;
    document.getElementById("visitorCounter").textContent = "Besucher: " + totalVisitors;

    const boxes = document.querySelectorAll(".linkbox");
    const chosen = boxes[Math.floor(Math.random()*boxes.length)];

    let c = chosen.querySelector(".counter");
    c.textContent = parseInt(c.textContent)+1;

    updateBrightness();
}

function updateBrightness() {
    document.querySelectorAll(".linkbox").forEach(box => {
        const count = parseInt(box.querySelector(".counter").textContent);
        box.classList.remove("level1","level2","level3","level4");

        if (count >= 1 && count < 3) box.classList.add("level1");
        if (count >= 3 && count < 5) box.classList.add("level2");
        if (count >= 5 && count < 8) box.classList.add("level3");
        if (count >= 8) box.classList.add("level4");
    });
}

setInterval(newVisitor, 10000);
</script></body>
</html>
