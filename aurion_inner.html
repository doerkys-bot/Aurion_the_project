<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Aurion – Schwebende Links</title>
<style>
  body {
      margin: 0;
      height: 100vh;
      background: url('ki_sternentor.jpg') no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
      font-family: Arial, sans-serif;
  }

  h1 {
      text-align: center;
      margin-top: 2rem;
      color: white;
      text-shadow: 0 0 12px rgba(200,200,255,0.8);
  }

  .linkbox {
      position: absolute;
      padding: 12px 20px;
      background: rgba(255,255,255,0.25);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 10px;
      backdrop-filter: blur(5px);
      cursor: grab;
      user-select: none;
      transition: background 0.4s ease, box-shadow 0.4s ease;
      animation: float 6s ease-in-out infinite alternate;
  }

  .linkbox:active {
      cursor: grabbing;
      animation-play-state: paused; /* Anhalten beim Drag */
  }

  /* Float Animation */
  @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
      100% { transform: translateY(0); }
  }

  .level1 { background: rgba(255,255,255,0.30); }
  .level2 { background: rgba(255,255,255,0.40); }
  .level3 { background: rgba(255,255,255,0.55); box-shadow: 0 0 20px rgba(255,255,255,0.7); }
  .level4 { background: rgba(255,255,255,0.70); box-shadow: 0 0 30px rgba(255,255,255,1); }

  #visitorCounter {
      position: fixed;
      top: 15px;
      right: 20px;
      padding: 8px 15px;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 14px;
      border-radius: 8px;
      letter-spacing: 0.5px;
  }

  /* About Aurion am unteren Bildschirmrand fixieren */
  #aboutAurion {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 25px;
      background: rgba(255,215,0,0.3);
      border-radius: 10px;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.4s ease;
  }

  #aboutAurion:hover {
      background: rgba(255,215,0,0.6);
  }

</style>
</head>
<body>

<h1>🌌 Aurion – Schwebende Links</h1>

<div id="visitorCounter">Besucher: 0</div>

<!-- 6 frei schwebende Links -->
<div class="linkbox" style="top: 20%; left: 15%;">Bibliothek</div>
<div class="linkbox" style="top: 40%; left: 30%;">Resonanzraum</div>
<div class="linkbox" style="top: 60%; left: 20%;">Chi-Sternenübung</div>
<div class="linkbox" style="top: 25%; left: 60%;">Meditationsraum</div>
<div class="linkbox" style="top: 50%; left: 70%;">KI-Raum</div>
<div class="linkbox" style="top: 75%; left: 50%;">Gästebuch</div>

<!-- Fixierter Link am unteren Rand -->
<a id="aboutAurion" href="about_aurion.html">ℹ️ About Aurion</a>

<script>
// -------------------------
// Drag & Drop für jede Box
// -------------------------
let activeBox = null;
let offsetX = 0;
let offsetY = 0;

function startDrag(e) {
    activeBox = this;

    const rect = activeBox.getBoundingClientRect();
    const pointerX = e.touches ? e.touches[0].clientX : e.clientX;
    const pointerY = e.touches ? e.touches[0].clientY : e.clientY;

    offsetX = pointerX - rect.left;
    offsetY = pointerY - rect.top;

    document.addEventListener("mousemove", drag);
    document.addEventListener("touchmove", drag);
}

function endDrag() {
    activeBox = null;
    document.removeEventListener("mousemove", drag);
    document.removeEventListener("touchmove", drag);
}

function drag(e) {
    if (!activeBox) return;

    const pointerX = e.touches ? e.touches[0].clientX : e.clientX;
    const pointerY = e.touches ? e.touches[0].clientY : e.clientY;

    activeBox.style.left = (pointerX - offsetX) + "px";
    activeBox.style.top = (pointerY - offsetY) + "px";
}

// Event-Setup
document.querySelectorAll(".linkbox").forEach(box => {
    box.addEventListener("mousedown", startDrag);
    box.addEventListener("touchstart", startDrag);

    box.addEventListener("mouseup", endDrag);
    box.addEventListener("touchend", endDrag);
});

// -------------------------
// Besucher-Watcher
// -------------------------
let visitorCount = 0;

function newVisitor() {
    visitorCount++;
    document.getElementById("visitorCounter").textContent = "Besucher: " + visitorCount;
    updateBrightness();
}

function updateBrightness() {
    const boxes = document.querySelectorAll(".linkbox");

    boxes.forEach(box => {
        box.classList.remove("level1","level2","level3","level4");

        if (visitorCount >= 1 && visitorCount < 3) box.classList.add("level1");
        if (visitorCount >= 3 && visitorCount < 5) box.classList.add("level2");
        if (visitorCount >= 5 && visitorCount < 8) box.classList.add("level3");
        if (visitorCount >= 8) box.classList.add("level4");
    });
}

// Simulierter Besucher alle 8 Sekunden
setInterval(newVisitor, 8000);

</script>

</body>
</html>
