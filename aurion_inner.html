<<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Resonanzraum</title>
<style>
    body {
        margin: 0;
        background: black;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    .link {
        position: absolute;
        color: rgba(255,255,255,0.8);
        font-size: 22px;
        cursor: grab;
        transition: color 1s;
        white-space: nowrap;
        user-select: none;
    }

    .link.glow {
        text-shadow: 0 0 12px #3af, 0 0 20px #6cf;
    }

    #visitorCounter {
        position: fixed;
        bottom: 10px;
        right: 15px;
        color: white;
        font-size: 16px;
        font-family: monospace;
    }
</style>
</head>
<body>

<div id="visitorCounter">Besucher: 0</div>

<div class="link">Bibliothek</div>
<div class="link">Resonanzraum</div>
<div class="link">Sternenübung</div>
<div class="link">Meditationsraum</div>
<div class="link">KI-Raum</div>
<div class="link">Gästebuch</div>

<script>
// -----------------------------------
// DRIFT + BOUNCE + ROTATION + GLOW
// -----------------------------------

const links = [...document.querySelectorAll(".link")];

// Startpositionen zufällig im unteren 2/3 des Screens
links.forEach(link => {
    link.style.left = (Math.random() * window.innerWidth) + "px";
    link.style.top  = (window.innerHeight * (0.35 + Math.random() * 0.65)) + "px";
});

// Bewegungsdaten für jeden Link
const states = links.map(() => ({
    xSpeed: (Math.random()*0.6 + 0.2) * (Math.random()<0.5?-1:1),
    ySpeed: (Math.random()*0.6 + 0.2) * (Math.random()<0.5?-1:1),
    rotation: 0,
}));

// Besucherzähler
let visitors = 0;
function addVisitor() {
    visitors++;
    document.getElementById("visitorCounter").textContent = "Besucher: " + visitors;
}
setInterval(addVisitor, 12000); // alle 12 Sekunden

// Bewegungsschleife
function animate() {
    links.forEach((link, i) => {
        let s = states[i];
        let rect = link.getBoundingClientRect();

        let x = rect.left + s.xSpeed;
        let y = rect.top + s.ySpeed;

        // Rechtsrand → Energieimpuls
        if (x + rect.width > window.innerWidth) {
            s.xSpeed *= -1;
            s.rotation += 180;

            link.classList.add("glow");
            setTimeout(() => link.classList.remove("glow"), 400);
        }

        // Linker Rand
        if (x < 0) { s.xSpeed *= -1; s.rotation += 180; }

        // Oben
        if (y < window.innerHeight * 0.35) { 
            s.ySpeed *= -1; 
            s.rotation += 90;
        }

        // Unten
        if (y + rect.height > window.innerHeight) { 
            s.ySpeed *= -1; 
            s.rotation += 90;
        }

        // Position setzen
        link.style.left = x + "px";
        link.style.top = y + "px";

        // Drehung
        link.style.transform = `rotate(${s.rotation}deg)`;
    });

    requestAnimationFrame(animate);
}
animate();

</script>
</body>
</html>
