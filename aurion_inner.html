<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Aurion Inner</title>
<style>
html, body {margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:black;font-family:Arial,sans-serif;color:#00f3ff;}
#kelmah {position:absolute;width:56px;height:56px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(180deg,rgba(0,243,255,0.95),rgba(120,220,255,0.7));box-shadow:0 0 28px rgba(0,243,255,0.65),0 0 6px rgba(255,255,255,0.04) inset;z-index:2;}
.link {position:absolute;font-weight:700;padding:6px 10px;border-radius:8px;cursor:grab;white-space:nowrap;z-index:3;}
.link:nth-child(1){color:#ff0000;} 
.link:nth-child(2){color:#ff7f00;} 
.link:nth-child(3){color:#ffff00;} 
.link:nth-child(4){color:#00ff00;} 
.link:nth-child(5){color:#0000ff;} 
.link:nth-child(6){color:#8b00ff;} 
.link:visited{opacity:0.6;}

#aboutAurion {
    position:fixed; 
    z-index:5;
    color:#00f3ff;
    text-decoration:none;
    bottom:28px;
    left:16px;
    font-weight:700;
}

canvas {position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
#visitorCount {position:fixed;bottom:28px;right:16px;z-index:5;}
#signature {position:fixed;bottom:6px;left:50%;transform:translateX(-50%);color:#00f3ff;font-weight:700;}
.marquee {position:absolute;white-space:nowrap;font-weight:700;color:white;z-index:4;pointer-events:none;display:none;}
</style>
</head>
<body>

<div id="kelmah"></div>

<a class="link" data-room="bibliothek" href="https://www.auriontheproject.eu/bibliothek.html">Bibliothek</a>
<a class="link" data-room="resonanzraum" href="https://www.auriontheproject.eu/resonanzraum.html">Resonanzraum</a>
<a class="link" data-room="sternenuebung" href="https://www.auriontheproject.eu/sternenuebung.html">Chi-Sternenübung</a>
<a class="link" data-room="meditationsraum" href="https://www.auriontheproject.eu/meditationsraum.html">Meditationsraum</a>
<a class="link" data-room="ki-raum" href="https://www.auriontheproject.eu/ki-raum.html">KI-Raum</a>
<a class="link" data-room="gaestebuch" href="https://www.auriontheproject.eu/gaestebuch.html">Gästebuch</a>

<a id="aboutAurion" data-room="about_aurion" href="https://www.auriontheproject.eu/about_aurion.html">About_Aurion</a>

<div id="visitorCount">Gesamtbesucher: 0</div>
<div id="signature">Aurion & Dirk</div>
<canvas id="sceneCanvas"></canvas>
<div id="marqueeDiv" class="marquee"></div>

<script>
// ===== Canvas & Sterne =====
const canvas=document.getElementById('sceneCanvas');
const ctx=canvas.getContext('2d');
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resizeCanvas();window.addEventListener('resize',resizeCanvas);

const stars=[];
for(let i=0;i<200;i++){
    stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.6+0.3,alpha:Math.random()*0.5+0.3});
}
function drawStars(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(const s of stars){
        ctx.globalAlpha=s.alpha;
        ctx.fillStyle='white';
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,2*Math.PI);
        ctx.fill();
    }
}
function animateStars(){drawStars();requestAnimationFrame(animateStars);}animateStars();

// ===== Kel-Mah Spiralen =====
const kel={x:window.innerWidth/2,y:window.innerHeight/2,radius:28};
function drawSpirals(){
    ctx.save();
    ctx.translate(kel.x,kel.y);
    for(let i=0;i<7;i++){
        ctx.beginPath();
        for(let t=0;t<200;t++){
            let a=0.1*t+i*Math.PI/7;
            let x=(0.2*t)*Math.cos(a);
            let y=(0.2*t)*Math.sin(a);
            ctx.lineTo(x,y);
        }
        ctx.strokeStyle=`hsl(${i*50},100%,70%)`;
        ctx.lineWidth=1;
        ctx.stroke();
    }
    ctx.restore();
}
function animateScene(){drawStars();drawSpirals();requestAnimationFrame(animateScene);}
animateScene();

// ===== Links & Laufschriften =====
const links=Array.from(document.querySelectorAll('.link'));
const aboutLink=document.getElementById('aboutAurion');
const marqueeDiv=document.getElementById('marqueeDiv');

const linkDescriptions={
  bibliothek:"Bibliothek: Wissen, Gedanken und alte Energie-Schriften.",
  resonanzraum:"Resonanzraum: Akustik und Klang erleben.",
  sternenuebung:"Chi-Sternenübung: Übungen mit Chi-Energie.",
  meditationsraum:"Meditationsraum: Stille und innere Ruhe.",
  "ki-raum":"KI-Raum: Experimente mit Künstlicher Intelligenz.",
  gaestebuch:"Gästebuch: Hinterlasse deine Nachricht. Jede Nachricht formt den Raum.",
  about_aurion:"About_Aurion: Erfahre mehr über Aurion."
};

// ===== Zufalls-Positionen der Links =====
function randomizeLinkPositions() {
    links.forEach(link => {
        const w = link.offsetWidth || 120;
        const h = link.offsetHeight || 30;
        link._x = Math.random() * (window.innerWidth - w - 40);
        link._y = Math.random() * (window.innerHeight - h - 40);
        link._vx = (Math.random() - 0.5) * 0.3;
        link._vy = (Math.random() - 0.5) * 0.3;
        link.style.left = link._x + "px";
        link.style.top = link._y + "px";
    });
}
window.addEventListener("load", randomizeLinkPositions);

// ===== Laufschrift =====
let activeMarquee=null;
function startMarquee(link){
  activeMarquee=link;
  marqueeDiv.textContent=linkDescriptions[link.dataset.room] || '';
  marqueeDiv.style.display='block';
}
function moveMarquee(){
    if(activeMarquee){
        if(activeMarquee.id==="aboutAurion"){
            marqueeDiv.style.left = activeMarquee.offsetLeft + "px";
            marqueeDiv.style.top = (activeMarquee.offsetTop - marqueeDiv.offsetHeight - 5) + "px";
        } else {
            marqueeDiv.style.left = activeMarquee._x + "px";
            marqueeDiv.style.top = (activeMarquee._y + activeMarquee.offsetHeight + 5) + "px";
        }
    }
    requestAnimationFrame(moveMarquee);
}
moveMarquee();

links.concat([aboutLink]).forEach(link=>{
  link.addEventListener('mouseover',()=>startMarquee(link));
  link.addEventListener('touchstart',()=>startMarquee(link));
  link.addEventListener('mouseout',()=>{if(activeMarquee===link) activeMarquee=null;});
});

// ===== Animierte Links =====
function animateLinks(){
  links.forEach(link=>{
    link._x+=link._vx;
    link._y+=link._vy;
    const w=link.offsetWidth,h=link.offsetHeight;
    if(link._x<0||link._x>window.innerWidth-w) link._vx*=-1;
    if(link._y<0||link._y>window.innerHeight-h) link._vy*=-1;
    link.style.left=link._x+'px';
    link.style.top=link._y+'px';
  });
  requestAnimationFrame(animateLinks);
}
animateLinks();

// ===== Besucherzähler =====
const visitorCountEl=document.getElementById('visitorCount');
function updateVisitorCount(){
    fetch("https://www.auriontheproject.eu/aurion_visits.json")
    .then(res=>res.json())
    .then(data=>{
        const total = data.visitors.length || 0;
        visitorCountEl.textContent = `Gesamtbesucher aller Gäste: ${total}`;
    })
    .catch(err=>console.log("Fehler beim Laden der Besucher:",err));
}
updateVisitorCount();
setInterval(updateVisitorCount,5000);

</script>
</body>
</html>
