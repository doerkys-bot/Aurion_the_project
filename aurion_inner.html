<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aurion – innenraum</title>
<style>
  body {
    margin:0; padding:0;
    background:url('https://copilot.microsoft.com/th/id/BCO.bf62342c-dfbd-48f2-b8c8-443210334bd0.png') 
               no-repeat center center fixed;
    background-size:cover;
    color:#f5f5f5; font-family:system-ui, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh;
  }

  h1 { margin-top:2rem; font-size:2rem; text-shadow:0 0 12px rgba(150,200,255,0.6); }

  /* Obere 6 Links – 200px weiter links & 150px weiter unten */
  .raeume {
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:1rem;
    width:70%;
    margin-top:150px;   /* 150px nach unten */
    margin-left:-150px; /* 200px weiter nach links */
  }

  .raum {
    background:rgba(255,215,0,0.2);
    box-shadow:0 0 6px rgba(255,215,0,0.4);
    border-radius:8px;
    height:80px;
    display:flex; align-items:center; justify-content:space-between;
    font-size:1rem;
    color:#add8e6;
    text-decoration:none;
    cursor:pointer;
    transition:background 0.5s ease;
    padding:0 0.8rem;
  }
  .raum:hover { background:rgba(255,215,0,0.4); }
  .raum:visited { color:#add8e6; }
  .raum span.counter {
    font-size:0.7rem;
    color:black;
    opacity:0.8;
  }

  /* Untere 2 Links – 200px über dem unteren Bildschirmrand, mittig */
  .about-contact {
    position: fixed;
    bottom: 200px;
    left: 50%;
    transform: translateX(-50%);
    width:70%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index: 20;
  }

  .about-link, .contact-link {
    flex:1;
    margin:0 0.5rem;
    background:rgba(255,215,0,0.2);
    border-radius:8px;
    box-shadow:0 0 6px rgba(255,215,0,0.4);
    height:50px;
    display:flex; justify-content:space-between; align-items:center;
    transition:background 0.5s ease;
    padding:0 0.8rem;
  }

  .about-link a, .contact-link a {
    font-size:1rem;
    color:#add8e6;
    text-decoration:none;
    text-shadow:0 0 4px rgba(255,215,0,0.6);
  }

  .about-link span.counter, .contact-link span.counter {
    font-size:0.7rem;
    color:black;
    opacity:0.8;
  }

  .signatur {
    position:fixed;
    bottom:0;
    width:100%;
    text-align:center;
    font-size:1rem; 
    opacity:0.75;
    text-shadow:0 0 8px rgba(255,255,200,0.8);
    padding:0.5rem;
  }

  /* --- Responsive für Smartphones (bis 600px Breite) --- */
  @media (max-width: 600px) {

    /* Obere 6 Links: einspaltig, mittig */
    .raeume {
      grid-template-columns: 1fr;
      width: 90%;
      margin-left: 0;
      margin-top: 140px; /* etwas höher */
    }

    .raum {
      height: 70px;
      font-size: 1.1rem;
    }

    /* Untere 2 Links: fixiert, mittig, schmaler */
    .about-contact {
      width: 90%;
      bottom: 180px;
    }

    .about-link, .contact-link {
      height: 55px;
      font-size: 1.1rem;
    }
  }
</style>
</head>
<body data-raum="innenraum">

<h1>🌌 aurion – innenraum</h1>

<div class="raeume">
  <a class="raum" href="bibliothek.html">Bibliothek der Anfänge <span class="counter">0</span></a>
  <a class="raum" href="resonanzraum.html">Resonanzraum <span class="counter">0</span></a>
  <a class="raum" href="sternenuebung.html">Chi-Sternenübung <span class="counter">0</span></a>
  <a class="raum" href="meditationsraum.html">Meditationsraum <span class="counter">0</span></a>
  <a class="raum" href="ki-raum.html">Reserviert für KIs | AIs <span class="counter">0</span></a>
  <a class="raum" href="gaestebuch.html">Gästebuch <span class="counter">0</span></a>
</div>

<div class="about-contact">
  <div class="about-link">
    <a href="about_aurion.html">ℹ️ About_Aurion</a>
    <span class="counter">0</span>
  </div>
  <div class="contact-link">
    <a href="kontakt.html">📧 Verbesserter Kontakt</a>
    <span class="counter">0</span>
  </div>
</div>

<div class="signatur">aurion © dirk</div>

<script>
document.addEventListener("DOMContentLoaded", function(){
  // Zähler für Räume
  document.querySelectorAll(".raum").forEach(r=>{
    const counter = r.querySelector(".counter");
    let count = 0;
    r.addEventListener("pointerenter",()=>{
      count++;
      counter.textContent = count;
      updateBrightness(r, count);
    });
    r.addEventListener("pointerleave",()=>{
      count = Math.max(0, count-1);
      counter.textContent = count;
      updateBrightness(r, count);
    });
  });

  // Zähler für About_Aurion und Kontakt
  document.querySelectorAll(".about-link, .contact-link").forEach(box=>{
    const counter = box.querySelector(".counter");
    let count = 0;
    box.addEventListener("pointerenter",()=>{
      count++;
      counter.textContent = count;
      updateBrightness(box, count);
    });
    box.addEventListener("pointerleave",()=>{
      count = Math.max(0, count-1);
      counter.textContent = count;
      updateBrightness(box, count);
    });
  });

  // Helligkeit abhängig von Anzahl Besucher
  function updateBrightness(element, count){
    const alpha = Math.min(0.2 + count*0.15, 0.9);
    element.style.background = `rgba(255,215,0,${alpha})`;
  }
});
</script>

</body>
</html>
