<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ab in die Zukunft – Resonanzraum</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: black;
        overflow: hidden;
        font-family: Arial, sans-serif;
        color: #00f3ff;
    }

    h1 {
        text-align: center;
        margin-top: 1rem;
        font-size: 3rem;
        text-shadow: 0 0 12px rgba(0,0,0,0.7);
    }

    .link {
        position: absolute;
        font-size: 1.6rem;
        font-weight: bold;
        cursor: grab;
        text-shadow: 0 0 8px rgba(0,0,0,0.5);
        transition: transform 0.5s ease, color 0.5s ease;
        user-select: none;
    }

    .link:active { cursor: grabbing; }

    .counter {
        font-size: 1rem;
        margin-left: 0.5rem;
        color: #ffd;
    }

    #visitorCounter {
        position: fixed;
        bottom: 15px;
        right: 15px;
        background: rgba(0,0,0,0.5);
        padding: 10px 15px;
        border-radius: 8px;
        font-size: 1.2rem;
        color: #fff;
    }

    canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }
</style>
</head>
<body>

<h1>🌌 Ab in die Zukunft</h1>

<!-- Links mit Besucherzähler -->
<a class="link" data-room="Bibliothek" href="bibliothek.html">Bibliothek<span class="counter">0</span></a>
<a class="link" data-room="Resonanzraum" href="resonanzraum.html">Resonanzraum<span class="counter">0</span></a>
<a class="link" data-room="Sternenübung" href="sternenuebung.html">Chi-Sternenübung<span class="counter">0</span></a>
<a class="link" data-room="Meditation" href="meditationsraum.html">Meditationsraum<span class="counter">0</span></a>
<a class="link" data-room="KI-Raum" href="ki-raum.html">KI-Raum<span class="counter">0</span></a>
<a class="link" data-room="Gästebuch" href="gaestebuch.html">Gästebuch<span class="counter">0</span></a>

<div id="visitorCounter">Besucher: 0</div>

<canvas id="particleCanvas"></canvas>

<script>
// -------------------------
// Partikel (Funken) für Resonanz
// -------------------------
const canvas = document.getElementById("particleCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

class Particle {
    constructor(x, y){
        this.x = x;
        this.y = y;
        this.vx = (Math.random()-0.5)*1;
        this.vy = (Math.random()-0.5)*1;
        this.alpha = Math.random();
        this.size = Math.random()*2 + 1;
    }
    draw(){
        ctx.fillStyle = `rgba(0, 243, 255, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
    }
    update(){
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= 0.001;
        if(this.alpha <= 0){
            this.x = Math.random()*canvas.width;
            this.y = Math.random()*canvas.height;
            this.alpha = Math.random();
        }
    }
}

const particles = Array.from({length: 100}, () => new Particle(Math.random()*canvas.width, Math.random()*canvas.height));

function animateParticles(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p => {
        p.update();
        p.draw();
    });
    requestAnimationFrame(animateParticles);
}
animateParticles();

// -------------------------
// Links drift & Drag/Touch
// -------------------------
const links = document.querySelectorAll(".link");
const driftSpeed = 0.3;

links.forEach(link => {
    let startX = Math.random()*(window.innerWidth-150);
    let startY = Math.random()*(window.innerHeight/3) + window.innerHeight*2/3;
    link.style.left = startX + "px";
    link.style.top = startY + "px";

    let dx = (Math.random()-0.5) * driftSpeed;
    let dy = (Math.random()-0.5) * driftSpeed;
    let dragging = false;

    function drift(){
        if(!dragging){
            let x = parseFloat(link.style.left) + dx;
            let y = parseFloat(link.style.top) + dy;

            if(x<0 || x>window.innerWidth-150) dx = -dx;
            if(y<window.innerHeight*2/3 || y>window.innerHeight-50) dy = -dy;

            link.style.left = x + "px";
            link.style.top = y + "px";
        }
        requestAnimationFrame(drift);
    }
    drift();

    // Drag & Touch
    function startDrag(e){
        e.preventDefault();
        dragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const offsetX = clientX - link.getBoundingClientRect().left;
        const offsetY = clientY - link.getBoundingClientRect().top;

        function move(ev){
            const moveX = ev.touches ? ev.touches[0].clientX : ev.clientX;
            const moveY = ev.touches ? ev.touches[0].clientY : ev.clientY;
            link.style.left = (moveX - offsetX) + "px";
            link.style.top  = (moveY - offsetY) + "px";
        }

        function end(){
            dragging = false;
            window.removeEventListener("mousemove", move);
            window.removeEventListener("mouseup", end);
            window.removeEventListener("touchmove", move);
            window.removeEventListener("touchend", end);
        }

        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", end);
        window.addEventListener("touchmove", move, {passive:false});
        window.addEventListener("touchend", end);
    }

    link.addEventListener("mousedown", startDrag);
    link.addEventListener("touchstart", startDrag, {passive:false});
});

// -------------------------
// Besucher-System
// -------------------------
let totalVisitors = 0;
function newVisitor(){
    totalVisitors++;
    document.getElementById("visitorCounter").textContent = "Besucher: " + totalVisitors;

    const chosen = links[Math.floor(Math.random()*links.length)];
    const counter = chosen.querySelector(".counter");
    counter.textContent = parseInt(counter.textContent)+1;

    // Helligkeit / Farbintensität je nach Besucher
    const num = parseInt(counter.textContent);
    if(num<3) chosen.style.color = "rgba(0,243,255,0.5)";
    else if(num<5) chosen.style.color = "rgba(0,243,255,0.7)";
    else if(num<8) chosen.style.color = "rgba(0,243,255,0.85)";
    else chosen.style.color = "rgba(0,243,255,1)";
}

setInterval(newVisitor, 10000);

window.addEventListener("resize", ()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>
</body>
</html>
