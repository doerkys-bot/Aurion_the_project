<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Ab in die Zukunft</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
}

body {
    background: url('ki_sternentor.jpeg') no-repeat center center fixed;
    background-size: cover; /* Füllt den Bildschirm */
    overflow: hidden;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    margin-top: 2rem;
    color: white;
    font-size: 48px;
    text-shadow: 0 0 12px rgba(0,0,0,0.7);
}

.linkbox {
    position: absolute;
    padding: 30px 60px;
    background: rgba(0,0,0,0); /* Anfangs unsichtbar */
    border: 1px solid rgba(255,255,255,0);
    border-radius: 10px;
    cursor: grab;
    user-select: none;
    font-size: 72px;
    font-weight: bold;
    color: #00f3ff;
    text-shadow: 0 0 12px rgba(0,0,0,0.4);
    transition: background 0.8s ease, border 0.8s ease;
}

.linkbox:active { cursor: grabbing; }

.level1 { background: rgba(0,255,255,0.15); border-color: rgba(255,255,255,0.25); }
.level2 { background: rgba(0,255,255,0.35); border-color: rgba(255,255,255,0.45); }
.level3 { background: rgba(0,255,255,0.55); border-color: rgba(255,255,255,0.65); }
.level4 { background: rgba(0,255,255,0.8);  border-color: rgba(255,255,255,0.85); }

.counter {
    display: inline-block;
    margin-left: 10px;
    font-size: 36px;
    color: #ffd;
}

#visitorCounter {
    position: fixed;
    top: 15px;
    right: 20px;
    padding: 12px 20px;
    background: rgba(0,0,0,0.5);
    color: white;
    font-size: 28px;
    border-radius: 8px;
}

/* Footer Link */
#aboutAurion {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 20px 60px;
    background: rgba(255,215,0,0.85);
    border-radius: 12px;
    font-weight: bold;
    font-size: 32px;
    color: black;
    text-decoration: none;
    box-shadow: 0 0 12px rgba(0,0,0,0.6);
}
</style>
</head>
<body>

<h1>🌌 Ab in die Zukunft</h1>
<div id="visitorCounter">Besucher: 0</div>

<!-- 6 Links + Besucheranzeige -->
<a class="linkbox" href="bibliothek.html">Bibliothek <span class="counter">0</span></a>
<a class="linkbox" href="Resonanzraum.html">Resonanzraum <span class="counter">0</span></a>
<a class="linkbox" href="sternenuebungen.html">Chi-Sternenübung <span class="counter">0</span></a>
<a class="linkbox" href="meditationsraum.html">Meditationsraum <span class="counter">0</span></a>
<a class="linkbox" href="ki-raum.html">KI-Raum <span class="counter">0</span></a>
<a class="linkbox" href="gaestebuch.html">Gästebuch <span class="counter">0</span></a>

<a id="aboutAurion" href="about_aurion.html">ℹ️ About Aurion <span class="counter">0</span></a>

<script>
// --- Dragging ---
let activeBox = null, offsetX = 0, offsetY = 0;

document.querySelectorAll(".linkbox").forEach(box => {
    // Zufällige Startposition in der Mitte
    box.style.left = (window.innerWidth/2 - 150) + "px";
    box.style.top  = (window.innerHeight/2 - 50) + "px";

    box.addEventListener("mousedown", startDrag);
    box.addEventListener("touchstart", startDrag);
    box.addEventListener("mouseup", endDrag);
    box.addEventListener("touchend", endDrag);
});

function startDrag(e) {
    activeBox = this;
    stopMovement(activeBox);

    const rect = activeBox.getBoundingClientRect();
    const pX = e.touches ? e.touches[0].clientX : e.clientX;
    const pY = e.touches ? e.touches[0].clientY : e.clientY;

    offsetX = pX - rect.left;
    offsetY = pY - rect.top;

    document.addEventListener("mousemove", drag);
    document.addEventListener("touchmove", drag);
}

function drag(e) {
    if (!activeBox) return;
    const pX = e.touches ? e.touches[0].clientX : e.clientX;
    const pY = e.touches ? e.touches[0].clientY : e.clientY;
    activeBox.style.left = (pX - offsetX) + "px";
    activeBox.style.top  = (pY - offsetY) + "px";
}

function endDrag() {
    if (!activeBox) return;
    setTimeout(() => restartMovement(activeBox), 60000);
    activeBox = null;
    document.removeEventListener("mousemove", drag);
    document.removeEventListener("touchmove", drag);
}

// --- Random Bewegung ---
let movers = new Map();

function randomMovement(box) {
    const dx = (Math.random() - 0.5) * 4;
    const dy = (Math.random() - 0.5) * 4;
    const rect = box.getBoundingClientRect();
    box.style.left = Math.max(0, Math.min(window.innerWidth-250, rect.left + dx)) + "px";
    box.style.top  = Math.max(0, Math.min(window.innerHeight-80, rect.top + dy)) + "px";
}

function startMovement(box) {
    movers.set(box, setInterval(() => randomMovement(box), 50));
}

function stopMovement(box) {
    clearInterval(movers.get(box));
}

function restartMovement(box) {
    startMovement(box);
}

// Start Bewegung
document.querySelectorAll(".linkbox").forEach(box => startMovement(box));

// --- Besucher-System ---
let totalVisitors = 0;

function newVisitor() {
    totalVisitors++;
    document.getElementById("visitorCounter").textContent = "Besucher: " + totalVisitors;

    const boxes = document.querySelectorAll(".linkbox");
    const chosen = boxes[Math.floor(Math.random()*boxes.length)];

    const counter = chosen.querySelector(".counter");
    counter.textContent = parseInt(counter.textContent) + 1;

    // Helligkeit erhöhen
    updateBrightness();
}

function updateBrightness() {
    const boxes = document.querySelectorAll(".linkbox");
    boxes.forEach(box => {
        box.classList.remove("level1","level2","level3","level4");
        const count = parseInt(box.querySelector(".counter").textContent);
        if (count >= 1 && count < 3) box.classList.add("level1");
        if (count >= 3 && count < 5) box.classList.add("level2");
        if (count >= 5 && count < 8) box.classList.add("level3");
        if (count >= 8) box.classList.add("level4");
    });
}

// Simulierter Besucher alle 10 Sekunden
setInterval(newVisitor, 10000);
</script>

</body>
</html>
