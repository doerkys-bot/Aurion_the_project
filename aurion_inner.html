<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion – Startseite</title>

<style>

/* Hintergrundbild */
body {
    margin: 0;
    padding: 0;
    background: url('https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpg') 
                no-repeat center center fixed;
    background-size: cover;
    font-family: Arial, sans-serif;
}

/* Obere 6 Links */
.link-grid {
    position: absolute;
    top: 150px;     /* wie gewünscht */
    left: 200px;    /* wie gewünscht */
    display: grid;
    grid-template-columns: repeat(3, auto);
    gap: 1.5rem;
}

/* Untere 2 Links – 200px über dem Rand */
.about-contact {
    position: fixed;
    bottom: 200px;  /* perfekte Position auf allen Geräten */
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 2rem;
}

/* Buttons */
button {
    padding: 12px 20px;
    font-size: 1rem;
    cursor: pointer;
    background: rgba(255,255,255,0.8);
    border: none;
    border-radius: 10px;
    backdrop-filter: blur(6px);
    transition: 0.3s;
}

button:hover {
    background: rgba(255,255,255,1);
}

/* Handy: alles proportional runterskalieren */
@media (max-width: 600px) {

    .link-grid {
        top: 20vw;        
        left: 10vw;       
        grid-template-columns: repeat(2, auto);
        gap: 4vw;
    }

    .about-contact {
        bottom: 20vw;    
        gap: 6vw;
    }

    button {
        padding: 3vw 5vw;
        font-size: 4vw;
    }
}

</style>
</head>

<body>

<!-- Die oberen 6 Links -->
<div class="link-grid">
    <button onclick="location.href='#1'">Link 1</button>
    <button onclick="location.href='#2'">Link 2</button>
    <button onclick="location.href='#3'">Link 3</button>
    <button onclick="location.href='#4'">Link 4</button>
    <button onclick="location.href='#5'">Link 5</button>
    <button onclick="location.href='#6'">Link 6</button>
</div>

<!-- Die unteren 2 Links -->
<div class="about-contact">
    <button onclick="location.href='#about'">About</button>
    <button onclick="location.href='#contact'">Contact</button>
</div>

</body>
</html>
