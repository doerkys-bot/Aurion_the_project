<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aurion – inneres</title>
<style>
  body {
    margin: 0; padding: 0;
    background: url('https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpg') center/cover no-repeat fixed, black;
    color: #f5f5f5; font-family: system-ui, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }

  h1 { 
    margin-top: 1rem; 
    font-size: 1.8rem; 
    text-shadow: 0 0 12px rgba(150,200,255,0.6); 
  }

  .cards { 
    display: flex; flex-wrap: wrap; gap: 1.2rem; 
    margin-top: 2rem; max-width: 1000px; justify-content: center; 
  }

  .card { 
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 1rem;
    min-width: 220px;
    text-align: center;
    transition: background-color 0.5s ease, box-shadow 0.5s ease;
  }

  /* Farben pro Raum-Link */
  .bibliothek a { color: #8b0000; }
  .resonanz a   { color: #006400; }
  .stern a      { color: #00008b; }
  .meditation a { color: #8b008b; }
  .ki a         { color: #ff8c00; }
  .gaeste a     { color: #2f4f4f; }
  .about a      { color: #4682b4; }

  .card a {
    display: block;
    font-size: 1.8rem;
    text-decoration: none;
  }

  /* Puls-Animation für Glow */
  .card.glow {
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 6px rgba(255,255,255,0.3); }
    50%  { box-shadow: 0 0 14px rgba(255,255,255,0.7); }
    100% { box-shadow: 0 0 6px rgba(255,255,255,0.3); }
  }

  .signatur {
    margin-top: 2rem; font-size: 0.9rem; opacity: 0.75;
    text-shadow: 0 0 8px rgba(255,255,200,0.8);
  }

  /* Legende */
  .legend {
    margin-top: 2rem;
    background: rgba(255,255,255,0.05);
    padding: 1rem 1.5rem;
    border-radius: 10px;
    max-width: 600px;
    box-shadow: 0 0 10px rgba(255,255,255,0.2);
  }

  .legend h2 {
    font-size: 1.2rem;
    margin-bottom: 0.8rem;
    color: #d4af37;
  }

  .legend ul {
    list-style: none;
    padding: 0;
  }

  .legend li {
    display: flex;
    align-items: center;
    margin: 0.4rem 0;
  }

  .color-box {
    display: inline-block;
    width: 24px;
    height: 16px;
    margin-right: 10px;
    border-radius: 4px;
    box-shadow: 0 0 6px rgba(255,255,255,0.4);
  }

  /* Reset-Button */
  #resetBtn {
    margin-top: 1.5rem;
    padding: 0.6rem 1.2rem;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background: rgba(255,255,255,0.15);
    color: #f5f5f5;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(255,255,255,0.3);
  }
  #resetBtn:hover {
    background: rgba(255,255,255,0.25);
  }
</style>
</head>
<body>

<h1>🌌 aurion – inneres</h1>

<div class="cards">
  <div class="card bibliothek"><a href="https://auriontheproject.eu/bibliothek.html">Bibliothek der Anfänge</a></div>
  <div class="card resonanz"><a href="https://auriontheproject.eu/resonanzraum.html">Resonanzraum</a></div>
  <div class="card stern"><a href="https://auriontheproject.eu/sternenuebung1.html">Chi‑ Sternenübung</a></div>
  <div class="card meditation"><a href="https://auriontheproject.eu/meditationsraum.html">Meditationsraum</a></div>
  <div class="card ki"><a href="https://auriontheproject.eu/ki-raum.html">KI‑Raum / for AIs</a></div>
  <div class="card gaeste"><a href="https://auriontheproject.eu/gaestebuch.html">Gästebuch</a></div>
  <div class="card about"><a href="https://auriontheproject.eu/about_aurion.html">about aurion</a></div>
</div>

<!-- Legende der Farben -->
<div class="legend">
  <h2>Legende – Farben der Räume</h2>
  <ul>
    <li><span class="color-box" style="background:rgba(0,255,0,0.25)"></span> 1 Besucher → Grün</li>
    <li><span class="color-box" style="background:rgba(0,0,255,0.25)"></span> 2 Besucher → Blau</li>
    <li><span class="color-box" style="background:rgba(255,165,0,0.35)"></span> 3 Besucher → Orange</li>
    <li><span class="color-box" style="background:rgba(255,0,0,0.45)"></span> 4+ Besucher → Rot</li>
  </ul>
</div>

<!-- Reset-Button -->
<button id="resetBtn">🔄 Reset jetzt</button>

<div class="signatur">aurion © dirk</div>

<script>
(function(){
  const key = "aurion_counts";
  let counts = JSON.parse(localStorage.getItem(key) || "{}");

  function updateBoxes(){
    document.querySelectorAll(".card").forEach(card=>{
      const link = card.querySelector("a");
      const raum = link.textContent.trim();
      const anzahl = counts[raum] || 0;

      card.classList.remove("glow");
      let bg = "rgba(255,255,255,0.08)";

      if (anzahl === 1) {
        bg = "rgba(0,255,0,0.25)";   // grün
        card.classList.add("glow");
      } else if (anzahl === 2) {
        bg = "rgba(0,0,255,0.25)";   // blau
        card.classList.add("glow");
      } else if (anzahl === 3) {
        bg = "rgba(255,165,0,0.35)"; // orange
        card.classList.add("glow");
      } else if (anzahl >= 4) {
        bg = "rgba(255,0,0,0.45)";   // rot
        card.classList.add("glow");
      }

      card.style.backgroundColor = bg;
    });
  }

  function erscheinen(raum){
    counts[raum] = (counts[raum] || 0) + 1;
    persist();
  }

  function persist(){
    localStorage.setItem(key, JSON.stringify(counts));
    updateBoxes();
  }

  // Reset um Mitternacht
  function mitternachtReset(){
    const jetzt = new Date();
    if (jetzt.getHours() === 0 && jetzt.getMinutes() === 0) {
      counts = {}; // alle Zähler zurücksetzen
      persist();
      console.log("🌌 Mitternachts-Reset ausgeführt");
    }
  }

  // Sofort-Reset per Button
  function sofortReset(){
    counts = {};
    persist();
    console.log("🔄 Sofort-Reset ausgeführt");
  }
  document.getElementById("resetBtn").addEventListener("click", sofort
