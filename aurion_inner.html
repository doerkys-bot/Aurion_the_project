<script>
const boxes = document.querySelectorAll(".linkbox");
const driftSpeed = 0.05; // langsam, sanft

boxes.forEach(box => {
    box.style.position = "absolute";
    box.style.left = (window.innerWidth/2) + "px";
    box.style.top = (window.innerHeight*0.2) + "px";
    box.style.width = "180px";
    box.style.height = "50px";
    box.style.background = "rgba(0,0,0,0.2)";
    box.style.padding = "10px";
    box.style.borderRadius = "8px";

    // zufällige Driftrichtung
    let dx = (Math.random()-0.5) * driftSpeed * 10;
    let dy = (Math.random()-0.5) * driftSpeed * 10;

    function drift() {
        if(!box.dragging){
            let x = parseFloat(box.style.left);
            let y = parseFloat(box.style.top);

            x += dx;
            y += dy;

            if(x < 0 || x > window.innerWidth-180) dx = -dx;
            if(y < 0 || y > window.innerHeight-50) dy = -dy;

            box.style.left = x + "px";
            box.style.top = y + "px";
        }
        requestAnimationFrame(drift);
    }
    drift();

    // Drag & Drop
    let offsetX=0, offsetY=0;
    box.addEventListener("mousedown", e=>{
        box.dragging = true;
        offsetX = e.clientX - box.offsetLeft;
        offsetY = e.clientY - box.offsetTop;

        function move(e){
            box.style.left = (e.clientX - offsetX) + "px";
            box.style.top = (e.clientY - offsetY) + "px";
        }
        function end(){
            box.dragging = false;
            dx = (Math.random()-0.5) * driftSpeed * 10;
            dy = (Math.random()-0.5) * driftSpeed * 10;

            document.removeEventListener("mousemove", move);
            document.removeEventListener("mouseup", end);
        }

        document.addEventListener("mousemove", move);
        document.addEventListener("mouseup", end);
    });
});
</script>
