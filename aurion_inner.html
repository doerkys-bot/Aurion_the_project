<!-- Kimäßiger Link für About Aurion -->
<a id="aboutAurion" href="about_aurion.html">ℹ️ About Aurion<span class="counter">0</span></a>

<style>
#aboutAurion {
    position: absolute;
    left: 50%;
    top: 20%; /* oben im Raum, kimäßig herausgehoben */
    transform: translate(-50%, -50%);
    font-size: 1.8rem;
    font-weight: bold;
    color: cyan;
    text-shadow: 0 0 12px rgba(0,243,255,0.6);
    transition: transform 0.5s ease, text-shadow 0.5s ease, color 0.5s ease;
    pointer-events: auto;
}
</style>

<script>
// Kimäßige Bewegung / Puls für About Aurion
const about = document.getElementById("aboutAurion");
let pulseDir = 1;

function pulseAbout() {
    let scale = 1 + 0.02 * pulseDir;
    about.style.transform = `translate(-50%, -50%) scale(${scale})`;
    pulseDir *= -1;
    setTimeout(pulseAbout, 700);
}
pulseAbout();

// Besucher-Update für About Aurion
function updateAboutVisitor() {
    const counter = about.querySelector(".counter");
    counter.textContent = parseInt(counter.textContent) + 1;
    
    // Puls stärker bei Besucher
    about.style.transform = "translate(-50%, -50%) scale(1.1)";
    setTimeout(()=> about.style.transform = "translate(-50%, -50%) scale(1)", 400);
}
</script>
