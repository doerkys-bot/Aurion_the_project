<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aurion – innenraum</title>
<style>
  body {
    margin:0; padding:0;
    background:url('https://copilot.microsoft.com/th/id/BCO.bf62342c-dfbd-48f2-b8c8-443210334bd0.png') 
               no-repeat center center fixed;
    background-size:cover;
    font-family:system-ui, Arial, sans-serif;
    color:#f5f5f5;
    height:100vh;
    overflow:hidden;
  }

  h1 { margin-top:2rem; text-align:center; text-shadow:0 0 12px rgba(150,200,255,0.6); }

  /* Verschiebbare Box mit den 6 Links */
  .raeume-box {
    position:absolute;
    top:100px; left:100px; /* Startposition */
    width:70%;
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap:1rem;
    cursor:move; /* zeigt an, dass verschiebbar */
  }
  .raum {
    background:rgba(255,215,0,0.2);
    box-shadow:0 0 6px rgba(255,215,0,0.4);
    border-radius:8px;
    height:80px;
    display:flex; align-items:center; justify-content:space-between;
    font-size:1rem;
    color:#add8e6;
    text-decoration:none;
    padding:0 0.8rem;
    transition:background 0.5s ease;
  }
  .raum:hover { background:rgba(255,215,0,0.4); }
  .raum span.counter { font-size:0.7rem; color:black; opacity:0.8; }

  /* Fixierter About-Link unten mittig */
  .about-fixed {
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(150,200,255,0.25);
    box-shadow:0 0 10px rgba(150,200,255,0.6);
    border-radius:8px;
    padding:0.5rem 1rem;
    color:#add8e6;
    text-decoration:none;
    font-style:italic;
  }
  .about-fixed span.counter { font-size:0.7rem; color:black; opacity:0.8; }
</style>
</head>
<body>

<h1>🌌 aurion – innenraum</h1>

<div class="raeume-box" id="raeumeBox">
  <a class="raum" href="bibliothek.html">Bibliothek der Anfänge <span class="counter">0</span></a>
  <a class="raum" href="resonanzraum.html">Resonanzraum <span class="counter">0</span></a>
  <a class="raum" href="sternenuebung.html">Chi-Sternenübung <span class="counter">0</span></a>
  <a class="raum" href="meditationsraum.html">Meditationsraum <span class="counter">0</span></a>
  <a class="raum" href="ki-raum.html">Reserviert für KIs | AIs <span class="counter">0</span></a>
  <a class="raum" href="gaestebuch.html">Gästebuch <span class="counter">0</span></a>
</div>

<a class="about-fixed" href="about_aurion.html">ℹ️ About_Aurion <span class="counter">0</span></a>

<script>
// Drag-Funktion für die Box
const box = document.getElementById("raeumeBox");
let isDown = false, offset = [0,0];

box.addEventListener('mousedown', function(e){
  isDown = true;
  offset = [box.offsetLeft - e.clientX, box.offsetTop - e.clientY];
});
document.addEventListener('mouseup', ()=> isDown=false);
document.addEventListener('mousemove', function(e){
  if(isDown){
    box.style.left = (e.clientX + offset[0]) + 'px';
    box.style.top  = (e.clientY + offset[1]) + 'px';
  }
});
</script>

</body>
</html>
