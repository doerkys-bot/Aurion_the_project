<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Aurion – Ab in die Zukunft</title>
<style>
  body {
      margin: 0;
      height: 100vh;
      background: url('ki_sternentor.jpeg') no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
      font-family: Arial, sans-serif;
  }

  h1 {
      text-align: center;
      margin-top: 2rem;
      color: white;
      font-size: 48px;
      text-shadow: 0 0 12px rgba(0,0,0,0.7);
  }

  .linkbox {
      position: absolute;
      padding: 45px 81px; /* 225% der Originalgröße */
      background: rgba(0,0,0,0.35);
      color: #00f3ff;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 10px;
      cursor: grab;
      user-select: none;
      transition: background 0.4s, color 0.4s, transform 0.4s;
      font-size: 72px;       /* 225% der Originalgröße */
      font-weight: bold;
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }

  .linkbox:active {
      cursor: grabbing;
  }

  /* Helligkeit je Besucherlevel */
  .level1 { background: rgba(0,255,255,0.35); }
  .level2 { background: rgba(0,255,255,0.55); }
  .level3 { background: rgba(0,255,255,0.75); }
  .level4 { background: rgba(0,255,255,0.9); }

  #visitorCounter {
      position: fixed;
      top: 15px;
      right: 20px;
      padding: 8px 15px;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 24px;
      border-radius: 8px;
  }

  #aboutAurion {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 20px 40px;
      background: rgba(255,215,0,0.8);
      border-radius: 12px;
      font-weight: bold;
      font-size: 32px;
      color: #000;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 0 12px rgba(0,0,0,0.6);
      transition: background 0.3s, transform 0.3s;
  }

  #aboutAurion:hover {
      background: rgba(255,215,0,1);
      transform: translateX(-50%) scale(1.05);
  }
</style>
</head>
<body>

<h1>🌌 Aurion – Ab in die Zukunft</h1>

<div id="visitorCounter">Besucher: 0</div>

<!-- 6 verschiebbare Links -->
<a class="linkbox" href="https://doerkys-bot.github.io/Aurion_the_project.html/bibliothek.html" style="top:20%; left:10%;">Bibliothek</a>
<a class="linkbox" href="https://doerkys-bot.github.io/Aurion_the_project.html/Resonanzraum.html" style="top:45%; left:25%;">Resonanzraum</a>
<a class="linkbox" href="https://doerkys-bot.github.io/Aurion_the_project.html/sternenuebungen.html" style="top:65%; left:20%;">Chi-Sternenübung</a>
<a class="linkbox" href="https://doerkys-bot.github.io/Aurion_the_project.html/meditationsraum.html" style="top:25%; left:60%;">Meditationsraum</a>
<a class="linkbox" href="https://doerkys-bot.github.io/Aurion_the_project.html/ki-raum.html" style="top:50%; left:70%;">KI-Raum</a>
<a class="linkbox" href="https://doerkys-bot.github.io/Aurion_the_project.html/gaestebuch.html" style="top:75%; left:50%;">Gästebuch</a>

<!-- Footer-Link -->
<a id="aboutAurion" href="https://doerkys-bot.github.io/Aurion_the_project.html/about_aurion.html">ℹ️ About Aurion</a>

<script>
// Dragging
let activeBox = null, offsetX = 0, offsetY = 0;

function startDrag(e) {
    activeBox = this;
    const rect = activeBox.getBoundingClientRect();
    const pointerX = e.touches ? e.touches[0].clientX : e.clientX;
    const pointerY = e.touches ? e.touches[0].clientY : e.clientY;
    offsetX = pointerX - rect.left;
    offsetY = pointerY - rect.top;
    document.addEventListener("mousemove", drag);
    document.addEventListener("touchmove", drag);
}

function endDrag() {
    activeBox = null;
    document.removeEventListener("mousemove", drag);
    document.removeEventListener("touchmove", drag);
}

function drag(e) {
    if (!activeBox) return;
    const pointerX = e.touches ? e.touches[0].clientX : e.clientX;
    const pointerY = e.touches ? e.touches[0].clientY : e.clientY;
    activeBox.style.left = (pointerX - offsetX) + "px";
    activeBox.style.top = (pointerY - offsetY) + "px";
}

document.querySelectorAll(".linkbox").forEach(box => {
    box.addEventListener("mousedown", startDrag);
    box.addEventListener("touchstart", startDrag);
    box.addEventListener("mouseup", endDrag);
    box.addEventListener("touchend", endDrag);
});

// Besucher-Simulation
let visitorCount = 0;

function newVisitor() {
    visitorCount++;
    document.getElementById("visitorCounter").textContent = "Besucher: " + visitorCount;
    updateBrightness();
}

function updateBrightness() {
    document.querySelectorAll(".linkbox").forEach(box => {
        box.classList.remove("level1","level2","level3","level4");
        if (visitorCount >= 1 && visitorCount < 3) box.classList.add("level1");
        if (visitorCount >= 3 && visitorCount < 5) box.classList.add("level2");
        if (visitorCount >= 5 && visitorCount < 8) box.classList.add("level3");
        if (visitorCount >= 8) box.classList.add("level4");
    });
}

// alle 8 Sekunden ein neuer Besucher
setInterval(newVisitor, 8000);

</script>
</body>
</html>
