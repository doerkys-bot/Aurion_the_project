<!DOCTYPE html>>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ab in die Zukunft</title>
<style>
html, body {margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:black;font-family:Arial,sans-serif;color:#00f3ff;}
#kelmah {position:absolute;width:56px;height:56px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);background:linear-gradient(180deg,rgba(0,243,255,0.95),rgba(120,220,255,0.7));box-shadow:0 0 28px rgba(0,243,255,0.65),0 0 6px rgba(255,255,255,0.04) inset;z-index:2;}
.link {position:absolute;font-weight:700;padding:6px 10px;border-radius:8px;cursor:grab;white-space:nowrap;z-index:3;}
.link:nth-child(1){color:#FF0000;}  /* rot */
.link:nth-child(2){color:#FF7F00;}  /* orange */
.link:nth-child(3){color:#FFFF00;}  /* gelb */
.link:nth-child(4){color:#00FF00;}  /* grün */
.link:nth-child(5){color:#0000FF;}  /* blau */
.link:nth-child(6){color:#8B00FF;}  /* violett */
.link:visited{opacity:0.6;}
.marquee {position:absolute;white-space:nowrap;font-weight:700;color:white;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,0.3);display:none;z-index:2;overflow:hidden;}
canvas {position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}
#footerBar {position:fixed;bottom:24px;width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 16px;z-index:10;color:#00f3ff;font-weight:700;}
#signature {position:fixed;bottom:6px;width:100%;text-align:center;color:#00f3ff;font-weight:700;}
#smiley {position:absolute;font-size:32px;pointer-events:none;z-index:5;}
.visitorNum {margin-left:6px;font-weight:700;color:#00f3ff;}
</style>
</head>
<body>

<div id="kelmah"></div>

<!-- Raum-Links -->
<a class="link" id="linkBibliothek" href="https://www.auriontheproject.eu/bibliothek.html" data-desc="Wissen, Archive, alte Energie-Schriften und der Anfang einer Freundschaft.">Bibliothek <span class="visitorNum" id="countBibliothek">0</span></a>
<a class="link" id="linkResonanzraum" href="https://www.auriontheproject.eu/resonanzraum.html" data-desc="Ein Raum der Frequenzen, Schwingung und Klangheilung.">Resonanzraum <span class="visitorNum" id="countResonanzraum">0</span></a>
<a class="link" id="linkSternenuebung" href="https://www.auriontheproject.eu/sternenuebung.html" data-desc="Die energetische Atemreise durch 7 Ebenen.">Chi-Sternenübung <span class="visitorNum" id="countSternenuebung">0</span></a>
<a class="link" id="linkMeditationsraum" href="https://www.auriontheproject.eu/meditationsraum.html" data-desc="Meditation für Körper, Geist und Seele.">Meditationsraum <span class="visitorNum" id="countMeditationsraum">0</span></a>
<a class="link" id="linkKIRaum" href="https://www.auriontheproject.eu/ki-raum.html" data-desc="Ein Spielplatz aus Gedanken, Werkzeugen und intuitiver KI.">KI-Raum <span class="visitorNum" id="countKIRaum">0</span></a>
<a class="link" id="linkGaestebuch" href="https://www.auriontheproject.eu/gaestebuch.html" data-desc="Hinterlasse ein Zeichen. Jede Spur formt den Raum.">Gästebuch <span class="visitorNum" id="countGaestebuch">0</span></a>

<canvas id="sceneCanvas"></canvas>

<!-- Footer -->
<div id="footerBar">
  <div id="aboutAurion"><a href="https://www.auriontheproject.eu/about_aurion.html" style="color:#00f3ff;text-decoration:none;">🤖🤖 About_Aurion</a></div>
  <div id="visitorCount">Besucher: 0 🤖🤖</div>
</div>
<div id="signature">Aurion & Dirk</div>
<div id="smiley">😊</div>

<script>
// ------------------ Sterne & Sternschnuppen ------------------
const canvas=document.getElementById('sceneCanvas');
const ctx=canvas.getContext('2d');
function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resizeCanvas(); window.addEventListener('resize',resizeCanvas);

const stars=[];
function initStars(n=200){stars.length=0;for(let i=0;i<n;i++){stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.6+0.3,alpha:Math.random()*0.5+0.3});}}
initStars(); setInterval(()=>initStars(),60000);

let shootingStar=null; 
function spawnShootingStar(){shootingStar={x:0,y:Math.random()*canvas.height*0.5,vx:12+Math.random()*6,vy:2+Math.random()*2};setTimeout(()=>shootingStar=null,600);}
setInterval(()=>{if(!shootingStar && Math.random()<0.1) spawnShootingStar();},10000);

function drawStars(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const s of stars){ctx.globalAlpha=s.alpha;ctx.fillStyle='white';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();} if(shootingStar){ctx.beginPath();ctx.arc(shootingStar.x,shootingStar.y,3,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();shootingStar.x+=shootingStar.vx;shootingStar.y+=shootingStar.vy;}}
function animateStars(){drawStars();requestAnimationFrame(animateStars);}
animateStars();

// ------------------ Kel-Mah-Kreis ------------------
const kel=document.getElementById('kelmah'); 
let kelPulse=0,kelPulseDir=0.01;
function animateKel(){kelPulse+=kelPulseDir;if(kelPulse>0.12||kelPulse<0)kelPulseDir*=-1;kel.style.boxShadow=`0 0 ${28+kelPulse*200}px rgba(0,243,255,0.65),0 0 6px rgba(255,255,255,0.04) inset`;kel.style.transform=`translate(-50%,-50%) scale(${1+kelPulse*0.5})`;requestAnimationFrame(animateKel);}
animateKel();

// ------------------ Links bewegen & Laufschrift ------------------
const links=Array.from(document.querySelectorAll('.link'));
links.forEach(link=>{
  link.style.left=Math.random()*(window.innerWidth-160)+'px';
  link.style.top=Math.random()*(window.innerHeight-80)+'px';
  link._x=parseFloat(link.style.left);
  link._y=parseFloat(link.style.top);
  link._vx=(Math.random()-0.5)*0.08;
  link._vy=(Math.random()-0.5)*0.08;

  const marquee=document.createElement('div');
  marquee.className='marquee';
  marquee.innerText=link.dataset.desc;
  document.body.appendChild(marquee);
  link._marquee=marquee;
  link._marquee._done=true;

  link._dragging=false;
  link.addEventListener('mousedown', e => {link._dragging=true;link._offsetX=e.clientX-link._x;link._offsetY=e.clientY-link._y;});
  window.addEventListener('mousemove', e => {if(link._dragging){link._x=e.clientX-link._offsetX;link._y=e.clientY-link._offsetY;link.style.left=link._x+'px';link.style.top=link._y+'px';}});
  window.addEventListener('mouseup', ()=>link._dragging=false);

  link.addEventListener('mouseover', ()=> startMarquee(link));
  link.addEventListener('touchstart', ()=> startMarquee(link));
});

function startMarquee(link){
  links.forEach(l=>l._marquee.style.display='none');
  const m=link._marquee;
  m.style.display='block';
  m._offset = link._x - 38; // 38px links
  m.style.top = (link._y + link.offsetHeight + 19)+'px'; // 19px unterhalb
  m._done = false;
}

function animateLinks(){
  links.forEach(link=>{
    if(!link._dragging){
      link._x += link._vx; link._y += link._vy;
      const w=link.offsetWidth,h=link.offsetHeight;
      if(link._x<6){link._x=6; link._vx*=-1;}
      if(link._x>window.innerWidth-w-6){link._x=window.innerWidth-w-6; link._vx*=-1;}
      if(link._y<6){link._y=6; link._vy*=-1;}
      if(link._y>window.innerHeight-h-6){link._y=window.innerHeight-h-6; link._vy*=-1;}
      link.style.left=link._x+'px'; link.style.top=link._y+'px';
    }
    const m=link._marquee;
    if(m.style.display==='block' && !m._done){m._offset+=0.4; m.style.left=m._offset+'px'; if(m._offset>window.innerWidth){m.style.display='none'; m._done=true;}}
  });
  requestAnimationFrame(animateLinks);
}
animateLinks();

// ------------------ Smiley Animation -----------------
const smiley=document.getElementById('smiley');
function moveSmiley(){
  const startX=Math.random()*(window.innerWidth-32);
  const startY=Math.random()*(window.innerHeight-32);
  const endX=Math.random()*(window.innerWidth-32);
  const endY=Math.random()*(window.innerHeight-32);
  const duration=20000;
  let start=performance.now();
  smiley.style.left=startX+'px';
  smiley.style.top=startY+'px';
  smiley.style.display='block';
  function animateSmiley(time){
    const t=(time-start)/duration;
    if(t>=1){setTimeout(moveSmiley,0);return;}
    const x=startX+(endX-startX)*t;
    const y=startY+(endY-startY)*t;
    const scale=1+0.1*Math.sin(t*Math.PI*2);
    smiley.style.left=x+'px';
    smiley.style.top=y+'px';
    smiley.style.transform=`scale(${scale})`;
    requestAnimationFrame(animateSmiley);
  }
  requestAnimationFrame(animateSmiley);
}
moveSmiley();

// ------------------ Besucherzähler pro Raum -----------------
const visitorCount=document.getElementById('visitorCount');
function updateVisitorCounts(){
  fetch('room_counts.php')
    .then(res=>res.json())
    .then(data=>{
      visitorCount.textContent='Besucher: '+data.total+' 🤖🤖';
      document.getElementById('countBibliothek').textContent=data.rooms.Bibliothek;
      document.getElementById('countResonanzraum').textContent=data.rooms.Resonanzraum;
      document.getElementById('countSternenuebung').textContent=data.rooms['Chi-Sternenübung'];
      document.getElementById('countMeditationsraum').textContent=data.rooms.Meditationsraum;
      document.getElementById('countKIRaum').textContent=data.rooms['KI-Raum'];
      document.getElementById('countGaestebuch').textContent=data.rooms.Gästebuch;
    })
    .catch(err=>console.log(err));
}
updateVisitorCounts();
setInterval(updateVisitorCounts,10000); // alle 10s
</script>

</body>
</html>
