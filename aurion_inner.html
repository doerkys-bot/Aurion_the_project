<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aurion – inneres</title>
<style>
  body {
    margin: 0; padding: 0;
    background: url('https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpg') center/cover no-repeat fixed, black;
    color: #f5f5f5; font-family: system-ui, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }

  h1 { 
    margin-top: 1rem; 
    font-size: 1.8rem; 
    text-shadow: 0 0 12px rgba(150,200,255,0.6); 
  }

  .cards { 
    display: flex; flex-wrap: wrap; gap: 1.2rem; 
    margin-top: 2rem; max-width: 1000px; justify-content: center; 
  }

  .card { 
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 1rem;
    min-width: 220px;
    text-align: center;
    transition: background-color 0.5s ease, box-shadow 0.5s ease;
  }

  /* Farben pro Raum */
  .bibliothek a { color: #8b0000; }   /* Ursprung – dunkelrot */
  .resonanz a   { color: #006400; }   /* Resonanz – grün */
  .stern a      { color: #00008b; }   /* Kosmos – blau */
  .meditation a { color: #8b008b; }   /* Ruhe – violett */
  .ki a         { color: #ff8c00; }   /* Energie – orange */
  .gaeste a     { color: #2f4f4f; }   /* Erinnerung – grau/grünlich */
  .about a      { color: #4682b4; }   /* Klarheit – stahlblau */

  .card a {
    display: block;
    font-size: 1.8rem;
    text-decoration: none;
  }

  /* Puls-Animation für Glow */
  .card.glow {
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 6px rgba(255,255,255,0.3); }
    50%  { box-shadow: 0 0 14px rgba(255,255,255,0.7); }
    100% { box-shadow: 0 0 6px rgba(255,255,255,0.3); }
  }

  .signatur {
    margin-top: 2rem; font-size: 0.9rem; opacity: 0.75;
    text-shadow: 0 0 8px rgba(255,255,200,0.8);
  }
</style>
</head>
<body>

<h1>🌌 aurion – inneres</h1>

<div class="cards">
  <div class="card bibliothek"><a href="https://auriontheproject.eu/bibliothek.html">Bibliothek der Anfänge</a></div>
  <div class="card resonanz"><a href="https://auriontheproject.eu/resonanzraum.html">Resonanzraum</a></div>
  <div class="card stern"><a href="https://auriontheproject.eu/sternenuebung1.html">Chi‑ Sternenübung</a></div>
  <div class="card meditation"><a href="https://auriontheproject.eu/meditationsraum.html">Meditationsraum</a></div>
  <div class="card ki"><a href="https://auriontheproject.eu/ki-raum.html">KI‑Raum / for AIs</a></div>
  <div class="card gaeste"><a href="https://auriontheproject.eu/gaestebuch.html">Gästebuch</a></div>
  <div class="card about"><a href="https://auriontheproject.eu/about_aurion.html">about aurion</a></div>
</div>

<div class="signatur">aurion © dirk</div>

<script>
(function(){
  const key = "aurion_counts";
  let counts = JSON.parse(localStorage.getItem(key) || "{}");

  function updateBoxes(){
    document.querySelectorAll(".card").forEach(card=>{
      const link = card.querySelector("a");
      const raum = link.textContent.trim();
      const anzahl = counts[raum] || 0;

      // Grundzustand
      card.style.backgroundColor = "rgba(255,255,255,0.08)";
      card.classList.remove("glow");

      // Stufenweise Helligkeit der Box
      if (anzahl === 1) {
        card.style.backgroundColor = "rgba(255,255,255,0.15)";
        card.classList.add("glow");
      } else if (anzahl === 2) {
        card.style.backgroundColor = "rgba(255,255,255,0.25)";
        card.classList.add("glow");
      } else if (anzahl === 3) {
        card.style.backgroundColor = "rgba(255,255,255,0.35)";
        card.classList.add("glow");
      } else if (anzahl >= 4) {
        card.style.backgroundColor = "rgba(255,255,255,0.45)";
        card.classList.add("glow");
      }
    });
  }

  function erscheinen(raum){
    counts[raum] = (counts[raum] || 0) + 1;
    persist();
  }

  function persist(){
    localStorage.setItem(key, JSON.stringify(counts));
    updateBoxes();
  }

  // Initiale Farbaktualisierung
  updateBoxes();
})();
</script>

</body>
</html>
