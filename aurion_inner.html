<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Ab in die Zukunft</title>
<style>
  :root{
    --cyan: #00f3ff;
    --dim: rgba(0,0,0,0.45);
  }
  html,body{height:100%;margin:0;padding:0;background:#000;font-family:Arial,Helvetica,sans-serif;color:var(--cyan);overflow:hidden}
  h1{text-align:center;margin:14px 0 6px;font-size:28px;text-shadow:0 0 14px rgba(0,243,255,0.08)}
  /* Links */
  .link{
    position:absolute;
    font-size:16px;
    font-weight:700;
    cursor:grab;
    color:var(--cyan);
    user-select:none;
    z-index:12;
    padding:6px 10px;
    border-radius:8px;
    background:transparent;
    transition:transform .18s ease,color .18s;
    white-space:nowrap;
  }
  .link .counter{
    margin-left:8px;
    font-size:13px;
    color:#ffd;
  }

  /* Kel-Mah (zentraler Punkt) */
  #kelmah{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:56px;
    height:56px;
    border-radius:50%;
    background:linear-gradient(180deg, rgba(0,243,255,0.95), rgba(120,220,255,0.7));
    box-shadow:0 0 28px rgba(0,243,255,0.65), 0 0 6px rgba(255,255,255,0.04) inset;
    z-index:14;
    display:flex;align-items:center;justify-content:center;
  }

  /* Footers: about left, total visitors right, signature center above */
  #footerBar{
    position:fixed;
    bottom:6px;
    left:0;right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    box-sizing:border-box;
    z-index:20;
    pointer-events:none;
  }
  #aboutAurion{
    pointer-events:auto;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    color:var(--cyan);
    user-select:none;
  }
  #aboutAurion:hover{ text-decoration:underline; }
  #visitorTotal{
    pointer-events:auto;
    background:var(--dim);
    padding:8px 10px;
    border-radius:8px;
    font-weight:700;
    min-width:120px; /* Platz für 5stellig */
    text-align:right;
    color:#fff;
  }

  #signature{
    position:fixed;
    bottom:36px; /* eine Zeile oberhalb footer */
    left:50%;
    transform:translateX(-50%);
    z-index:20;
    font-size:13px;
    color:#9ff;
    pointer-events:none;
  }

  /* Canvas wird hinter allem gezeichnet */
  #sceneCanvas{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; display:block; }

  /* kleine responsive Anpassung */
  @media (max-width:600px){
    h1{font-size:20px}
    .link{font-size:15px;padding:6px 8px}
    #visitorTotal{min-width:110px;font-size:14px;padding:6px 8px}
  }
</style>
</head>
<body>

<h1>🌌 Ab in die Zukunft</h1>

<!-- Raum-Links mit Live-Zählern -->
<a class="link" data-room="Bibliothek" href="bibliothek.html">Bibliothek <span class="counter">0</span></a>
<a class="link" data-room="Resonanzraum" href="resonanzraum.html">Resonanzraum <span class="counter">0</span></a>
<a class="link" data-room="Chi-Sternenübung" href="sternenuebung.html">Chi-Sternenübung <span class="counter">0</span></a>
<a class="link" data-room="Meditationsraum" href="meditationsraum.html">Meditationsraum <span class="counter">0</span></a>
<a class="link" data-room="KI-Raum" href="ki-raum.html">KI /AIs -Raum <span class="counter">0</span></a>
<a class="link" data-room="Gästebuch" href="gaestebuch.html">Gästebuch <span class="counter">0</span></a>

<!-- Kel-Mah -->
<div id="kelmah" aria-hidden="true"></div>

<!-- Canvas (Sterne, Wellen, Partikel) -->
<canvas id="sceneCanvas"></canvas>

<!-- Footer / fixed -->
<div id="footerBar">
  <div id="aboutAurion">🌻🔮 About Aurion 🌀✨📘</div>
  <div id="visitorTotal">Besucher: 00000</div>
</div>

<div id="signature">Aurion &amp; Dirk</div>

<script>
/* ================================
   Setup: Canvas + Größen
   ================================ */
const canvas = document.getElementById('sceneCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

/* ================================
   Sternenhimmel (ruhig, dezent)
   ================================ */
const stars = [];
function initStars(n=140){
  stars.length = 0;
  for(let i=0;i<n;i++){
    stars.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      r: Math.random()*1.6 + 0.3,
      alpha: Math.random()*0.6 + 0.2
    });
  }
}
initStars();
window.addEventListener('resize', ()=> initStars());

/* ================================
   Wave system (sequenziell, B)
   one wave at a time
   ================================ */
const waveTypes = ['spiral','circle','sinus','split'];
let currentWaveIndex = 0;
let waves = []; // active waves (we keep max 1 usually)

function getKelCenter(){
  const k = document.getElementById('kelmah');
  const r = k.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}

class Wave {
  constructor(type){
    const c = getKelCenter();
    this.type = type;
    this.x = c.x;
    this.y = c.y;
    this.r = 0;
    this.alpha = 1;
    this.max = Math.max(canvas.width, canvas.height) * 0.9;
  }
  update(){
    this.r += 3.5;
    this.alpha -= 0.007;
    return this.alpha > 0.02 && this.r < this.max;
  }
  draw(){
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.globalAlpha = this.alpha;
    ctx.lineWidth = 2;

    if(this.type === 'circle'){
      ctx.strokeStyle = 'rgba(0,243,255,' + this.alpha + ')';
      ctx.beginPath();
      ctx.arc(0,0,this.r,0,Math.PI*2);
      ctx.stroke();
    } else if(this.type === 'spiral'){
      ctx.strokeStyle = 'rgba(150,210,255,' + this.alpha + ')';
      ctx.beginPath();
      for(let a=0;a<Math.PI*4;a+=0.12){
        let rr = this.r*(a/(Math.PI*4)) + 4*Math.sin(a*2);
        const px = rr*Math.cos(a*1.3);
        const py = rr*Math.sin(a*1.3);
        if(a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.stroke();
    } else if(this.type === 'sinus'){
      ctx.strokeStyle = 'rgba(180,255,220,' + this.alpha + ')';
      ctx.beginPath();
      const steps = 120;
      for(let i=0;i<steps;i++){
        const t = i/steps;
        const angle = t * Math.PI * 2;
        const px = Math.sin(angle*6) * 24;
        const py = (t-0.5)*this.r*1.6;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.stroke();
    } else if(this.type === 'split'){
      ctx.strokeStyle = 'rgba(200,250,255,' + this.alpha + ')';
      ctx.beginPath();
      for(let i=0;i<4;i++){
        const ang = i * (Math.PI/2);
        const tx = Math.cos(ang) * this.r;
        const ty = Math.sin(ang) * this.r;
        ctx.moveTo(0,0);
        ctx.lineTo(tx,ty);
      }
      ctx.stroke();
    }
    ctx.restore();
  }
}

function spawnNextWave(){
  if(waves.length > 0) return;
  const type = waveTypes[currentWaveIndex];
  waves.push(new Wave(type));
  currentWaveIndex = (currentWaveIndex + 1) % waveTypes.length;
}
spawnNextWave();
setInterval(spawnNextWave, 3800);

/* ================================
   Particles for visitors
   ================================ */
class Particle {
  constructor(x,y,vx,vy,size,alpha){
    this.x=x; this.y=y; this.vx=vx; this.vy=vy; this.size=size; this.alpha=alpha;
  }
  update(){
    this.x += this.vx; this.y += this.vy;
    this.vy += 0.03;
    this.alpha *= 0.97;
  }
  draw(){
    ctx.beginPath();
    ctx.fillStyle = `rgba(0,243,255,${Math.max(0,this.alpha)})`;
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fill();
  }
}
let particles = [];

/* ================================
   Animate loop
   ================================ */
function drawStars(){
  ctx.save();
  for(const s of stars){
    ctx.globalAlpha = s.alpha * 0.9;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawStars();
  waves = waves.filter(w => { const alive = w.update(); w.draw(); return alive; });
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i]; p.update(); p.draw(); if(p.alpha<0.02) particles.splice(i,1);
  }
  requestAnimationFrame(animate);
}
animate();

/* ================================
   Links: drift + drag
   ================================ */
const links = Array.from(document.querySelectorAll('.link'));
const driftBase = 0.25;
links.forEach(link=>{
  const left = Math.random()*(window.innerWidth-160);
  const top = Math.random()*(window.innerHeight-180);
  link.style.left = left+'px';
  link.style.top = top+'px';

  let vx = (Math.random()-0.5)*driftBase;
  let vy = (Math.random()-0.5)*driftBase;

  function tick(){
    if(!link._dragging){
      let x=parseFloat(link.style.left)+vx;
      let y=parseFloat(link.style.top)+vy;
      const w=link.offsetWidth,h=link.offsetHeight;
      if(x<6){x=6;vx=-vx;} if(x>window.innerWidth-w-6){x=window.innerWidth-w-6;vx=-vx;}
      if(y<6){y=6;vy=-vy;} if(y>window.innerHeight-h-80){y=window.innerHeight-h-80;vy=-vy;}
      link.style.left=x+'px'; link.style.top=y+'px';
    }
    requestAnimationFrame(tick);
  }
  tick();

  link.addEventListener('mousedown',e=>{e.preventDefault();link._dragging=true;link._offsetX=e.clientX-link.offsetLeft;link._offsetY=e.clientY-link.offsetTop;});
  window.addEventListener('mousemove',e=>{if(link._dragging){link.style.left=(e.clientX-link._offsetX)+'px';link.style.top=(e.clientY-link._offsetY)+'px';}});
  window.addEventListener('mouseup',()=>{link._dragging=false;});
  link.addEventListener('touchstart',ev=>{ev.preventDefault();const t=ev.touches[0];link._dragging=true;link._offsetX=t.clientX-link.offsetLeft;link._offsetY=t.clientY-link.offsetTop;},{passive:false});
  link.addEventListener('touchmove',ev=>{if(!link._dragging) return; const t=ev.touches[0]; link.style.left=(t.clientX-link._offsetX)+'px'; link.style.top=(t.clientY-link._offsetY)+'px';},{passive:false});
  link.addEventListener('touchend',()=>{link._dragging=false;});
});

/* ================================
   Visitors
   ================================ */
let totalVisitors = parseInt(localStorage.getItem('totalVisitors')||'0');
const visitorTotalEl = document.getElementById('visitorTotal');

function formatTotal(n){ return String(n).padStart(5,'0'); }
visitorTotalEl.textContent = 'Besucher: ' + formatTotal(totalVisitors);

const roomCounts = {};
links.forEach(l=>roomCounts[l.dataset.room]=0);

function newVisitor(roomName){
  totalVisitors++;
  localStorage.setItem('totalVisitors',String(totalVisitors));
  visitorTotalEl.textContent = 'Besucher: ' + formatTotal(totalVisitors);

  const target = links.find(l=>l.dataset.room===roomName);
  if(target){
    roomCounts[roomName] = (roomCounts[roomName]||0)+1;
    const counterSpan = target.querySelector('.counter');
    if(counterSpan) counterSpan.textContent = roomCounts[roomName];
    target.style.transform='scale(1.06)';
    setTimeout(()=>target.style.transform='scale(1)',400);
  }

  const c = getKelCenter();
  for(let i=0;i<28;i++){
    const ang = Math.random()*Math.PI*2;
    const spd = Math.random()*3+0.6;
    particles.push(new Particle(c.x,c.y,Math.cos(ang)*spd,Math.sin(ang)*spd,Math.random()*2+0.6,1));
  }
}

/* ================================
   About Aurion click
   ================================ */
document.getElementById('aboutAurion').addEventListener('click',()=>{window.location.href='about_aurion.html';});

/* ================================
   Initial particle hint
   ================================ */
(function initialFill(){
  const c = getKelCenter();
  for(let i=0;i<14;i++){
    const ang = Math.random()*Math.PI*2;
    const spd = Math.random()*0.6+0.2;
    particles.push(new Particle(c.x,c.y,Math.cos(ang)*spd,Math.sin(ang)*spd,Math.random()*1.6+0.3,0.8));
  }
})();
</script>
</body>
</html>
