<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>About Aurion</title>
<style>
  body {
      margin: 0;
      height: 100vh;
      background: url('ki_sternentor.jpeg') no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
      font-family: Arial, sans-serif;
      color: white;
  }

  h1 {
      text-align: center;
      margin-top: 2rem;
      font-size: 48px;
      text-shadow: 0 0 12px rgba(0,0,0,0.7);
  }

  .linkbox {
      position: absolute;
      padding: 30px 60px;
      background: rgba(0,0,0,0); /* unsichtbar zu Beginn */
      border-radius: 12px;
      font-size: 36px;
      font-weight: bold;
      color: #00f3ff;
      text-shadow: 0 0 8px rgba(0,0,0,0.4);
      cursor: grab;
      user-select: none;
      transition: background 0.8s ease, border 0.8s ease;
  }
  .linkbox:active { cursor: grabbing; }

  /* Besucher-Helligkeit */
  .level1 { background: rgba(0,255,255,0.15); }
  .level2 { background: rgba(0,255,255,0.35); }
  .level3 { background: rgba(0,255,255,0.55); }
  .level4 { background: rgba(0,255,255,0.8); }

  .counter {
      display: block;
      font-size: 24px;
      margin-top: 5px;
      color: #ffd;
  }

  #visitorCounter {
      position: fixed;
      top: 15px;
      right: 20px;
      padding: 12px 20px;
      background: rgba(0,0,0,0.5);
      border-radius: 8px;
      font-size: 28px;
  }
</style>
</head>

<body>
<h1>ℹ️ About Aurion</h1>

<div id="visitorCounter">Besucher insgesamt: 0</div>

<!-- Links innerhalb des Raums -->
<a class="linkbox" href="bibliothek.html" data-room="Bibliothek">Bibliothek<span class="counter">0</span></a>
<a class="linkbox" href="resonanzraum.html" data-room="Resonanzraum">Resonanzraum<span class="counter">0</span></a>
<a class="linkbox" href="sternenuebungen.html" data-room="Chi-Sternenübung">Chi-Sternenübung<span class="counter">0</span></a>
<a class="linkbox" href="meditationsraum.html" data-room="Meditationsraum">Meditationsraum<span class="counter">0</span></a>
<a class="linkbox" href="ki-raum.html" data-room="KI-Raum">KI-Raum<span class="counter">0</span></a>
<a class="linkbox" href="gaestebuch.html" data-room="Gästebuch">Gästebuch<span class="counter">0</span></a>

<script>
// ----------------------
// Drag & Drift
// ----------------------
let activeBox = null, offsetX = 0, offsetY = 0;
let movers = new Map();

// Drift starten
function startMovement(box) {
    box.dx = (Math.random()-0.5)*1.5;
    box.dy = (Math.random()-0.5)*1.5;
    movers.set(box, setInterval(() => {
        const rect = box.getBoundingClientRect();
        let newX = rect.left + box.dx;
        let newY = rect.top + box.dy;
        newX = Math.max(0, Math.min(window.innerWidth - rect.width, newX));
        newY = Math.max(0, Math.min(window.innerHeight - rect.height, newY));
        box.style.left = newX + "px";
        box.style.top  = newY + "px";
    }, 50));
}

// Drift stoppen
function stopMovement(box) {
    clearInterval(movers.get(box));
}

// Drift nach 1 Minute wieder starten
function restartMovement(box) {
    startMovement(box);
}

// Drag-Events
function startDrag(e) {
    activeBox = this;
    stopMovement(activeBox);

    const rect = activeBox.getBoundingClientRect();
    const pX = e.touches ? e.touches[0].clientX : e.clientX;
    const pY = e.touches ? e.touches[0].clientY : e.clientY;

    offsetX = pX - rect.left;
    offsetY = pY - rect.top;

    document.addEventListener("mousemove", drag);
    document.addEventListener("touchmove", drag);
}

function drag(e) {
    if (!activeBox) return;
    const pX = e.touches ? e.touches[0].clientX : e.clientX;
    const pY = e.touches ? e.touches[0].clientY : e.clientY;

    activeBox.style.left = (pX - offsetX) + "px";
    activeBox.style.top  = (pY - offsetY) + "px";
}

function endDrag() {
    if (!activeBox) return;
    setTimeout(() => restartMovement(activeBox), 60000);
    activeBox = null;
    document.removeEventListener("mousemove", drag);
    document.removeEventListener("touchmove", drag);
}

// ----------------------
// Initialisierung
// ----------------------
const centerX = window.innerWidth/2 - 150;
const centerY = window.innerHeight/2 - 40;

document.querySelectorAll(".linkbox").forEach(b => {
    b.style.left = centerX + "px";
    b.style.top  = centerY + "px";

    startMovement(b);

    b.addEventListener("mousedown", startDrag);
    b.addEventListener("touchstart", startDrag);
    b.addEventListener("mouseup", endDrag);
    b.addEventListener("touchend", endDrag);
});

// ----------------------
// Besucher-System
// ----------------------
let totalVisitors = 0;
function newVisitor() {
    totalVisitors++;
    document.getElementById("visitorCounter").textContent =
         "Besucher insgesamt: " + totalVisitors;

    updateBrightness();

    // Zufälligen Raum betreten
    const boxes = document.querySelectorAll(".linkbox");
    const chosen = boxes[Math.floor(Math.random()*boxes.length)];
    const c = chosen.querySelector(".counter");
    c.textContent = parseInt(c.textContent) + 1;
}

function updateBrightness() {
    document.querySelectorAll(".linkbox").forEach(box => {
        box.classList.remove("level1","level2","level3","level4");
        if (totalVisitors >=1 && totalVisitors<3) box.classList.add("level1");
        if (totalVisitors >=3 && totalVisitors<5) box.classList.add("level2");
        if (totalVisitors >=5 && totalVisitors<8) box.classList.add("level3");
        if (totalVisitors >=8) box.classList.add("level4");
    });
}

// Simulierter Besucher alle 10 Sekunden
setInterval(newVisitor, 10000);

</script>
</body>
</html>
