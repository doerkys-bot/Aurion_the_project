<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ab in die Zukunft</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: url('https://doerkys-bot.github.io/Aurion_the_project.html/ki_sternentor.jpeg') no-repeat center center fixed;
        background-size: contain; /* Hintergrundbild korrekt skaliert */
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    h1 {
        text-align: center;
        margin-top: 2rem;
        color: white;
        font-size: 48px;
        text-shadow: 0 0 12px rgba(0,0,0,0.7);
    }

    .linkbox {
        position: absolute;
        padding: 15px 25px;
        background: rgba(0,0,0,0.3);
        border-radius: 10px;
        font-size: 1.5rem;
        font-weight: bold;
        color: #00f3ff;
        text-shadow: 0 0 8px rgba(0,0,0,0.7);
        cursor: grab;
        user-select: none;
        transition: background 0.3s ease;
    }

    .linkbox:active { cursor: grabbing; }
</style>
</head>
<body>

<h1>🌌 Ab in die Zukunft</h1>

<!-- Links -->
<a class="linkbox" href="bibliothek.html" style="top:20%; left:20%;">Bibliothek</a>
<a class="linkbox" href="Resonanzraum.html" style="top:40%; left:40%;">Resonanzraum</a>
<a class="linkbox" href="sternenuebungen.html" style="top:60%; left:30%;">Chi-Sternenübung</a>
<a class="linkbox" href="meditationsraum.html" style="top:25%; left:60%;">Meditationsraum</a>
<a class="linkbox" href="ki-raum.html" style="top:50%; left:70%;">KI-Raum</a>
<a class="linkbox" href="gaestebuch.html" style="top:75%; left:50%;">Gästebuch</a>
<a id="aboutAurion" class="linkbox" href="about_aurion.html" style="top:85%; left:50%;">ℹ️ About Aurion</a>

<script>
let activeBox = null;
let offsetX = 0;
let offsetY = 0;

document.querySelectorAll('.linkbox').forEach(box => {
    box.addEventListener('mousedown', startDrag);
    box.addEventListener('touchstart', startDrag);
    box.addEventListener('mouseup', endDrag);
    box.addEventListener('touchend', endDrag);
});

function startDrag(e) {
    activeBox = this;
    const rect = activeBox.getBoundingClientRect();
    const pointerX = e.touches ? e.touches[0].clientX : e.clientX;
    const pointerY = e.touches ? e.touches[0].clientY : e.clientY;
    offsetX = pointerX - rect.left;
    offsetY = pointerY - rect.top;
    document.addEventListener("mousemove", drag);
    document.addEventListener("touchmove", drag);
}

function drag(e) {
    if (!activeBox) return;
    const pointerX = e.touches ? e.touches[0].clientX : e.clientX;
    const pointerY = e.touches ? e.touches[0].clientY : e.clientY;
    activeBox.style.left = (pointerX - offsetX) + "px";
    activeBox.style.top = (pointerY - offsetY) + "px";
}

function endDrag() {
    activeBox = null;
    document.removeEventListener("mousemove", drag);
    document.removeEventListener("touchmove", drag);
}
</script>

</body>
</html>
