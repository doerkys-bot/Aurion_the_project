<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ab in die Zukunft</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        overflow: hidden;
        height: 100vh;

        /* Hintergrund proportional und zentriert, nicht zu groß */
        background: url('ki_sternentor.jpeg') no-repeat center center;
        background-size: contain;
        background-attachment: fixed;
        background-color: black;
    }

    h1 {
        text-align: center;
        margin-top: 2rem;
        color: white;
        font-size: 48px;
        text-shadow: 0 0 12px rgba(0,0,0,0.7);
    }

    .linkbox {
        position: absolute;
        padding: 30px 60px;
        background: rgba(0,0,0,0.2);
        border-radius: 12px;
        cursor: grab;
        user-select: none;
        font-size: 36px;
        font-weight: bold;
        color: #00f3ff;
        text-shadow: 0 0 12px rgba(0,0,0,0.4);
        transition: background 0.8s ease;
    }

    .linkbox:active { cursor: grabbing; }

    .counter {
        display: inline-block;
        margin-left: 15px;
        font-size: 24px;
        color: #ffd;
    }

    #aboutAurion {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 20px 40px;
        background: rgba(255,215,0,0.85);
        border-radius: 12px;
        font-weight: bold;
        font-size: 32px;
        color: black;
        text-decoration: none;
        box-shadow: 0 0 12px rgba(0,0,0,0.6);
    }

    #aboutAurion .counter {
        margin-left: 15px;
        font-size: 24px;
        color: #000;
    }
</style>
</head>
<body>

<h1>🌌 Ab in die Zukunft</h1>

<!-- Links starten alle am gleichen Punkt -->
<a class="linkbox" href="bibliothek.html" style="top:50%; left:50%;">Bibliothek<span class="counter">0</span></a>
<a class="linkbox" href="Resonanzraum.html" style="top:50%; left:50%;">Resonanzraum<span class="counter">0</span></a>
<a class="linkbox" href="sternenuebung.html" style="top:50%; left:50%;">Chi-Sternenübung<span class="counter">0</span></a>
<a class="linkbox" href="meditationsraum.html" style="top:50%; left:50%;">Meditationsraum<span class="counter">0</span></a>
<a class="linkbox" href="ki-raum.html" style="top:50%; left:50%;">KI-Raum<span class="counter">0</span></a>
<a class="linkbox" href="gaestebuch.html" style="top:50%; left:50%;">Gästebuch<span class="counter">0</span></a>

<!-- Footer Link -->
<a id="aboutAurion" href="about_aurion.html">ℹ️ About Aurion<span class="counter">0</span></a>

<script>
// Drag & Drop
let activeBox = null, offsetX = 0, offsetY = 0;

function startDrag(e) {
    activeBox = this;
    stopMovement(activeBox);
    const rect = activeBox.getBoundingClientRect();
    const pX = e.touches ? e.touches[0].clientX : e.clientX;
    const pY = e.touches ? e.touches[0].clientY : e.clientY;
    offsetX = pX - rect.left;
    offsetY = pY - rect.top;
    document.addEventListener("mousemove", drag);
    document.addEventListener("touchmove", drag);
}

function drag(e) {
    if (!activeBox) return;
    const pX = e.touches ? e.touches[0].clientX : e.clientX;
    const pY = e.touches ? e.touches[0].clientY : e.clientY;
    activeBox.style.left = (pX - offsetX) + "px";
    activeBox.style.top = (pY - offsetY) + "px";
}

function endDrag() {
    if (!activeBox) return;
    setTimeout(() => restartMovement(activeBox), 60000);
    activeBox = null;
    document.removeEventListener("mousemove", drag);
    document.removeEventListener("touchmove", drag);
}

document.querySelectorAll(".linkbox").forEach(box => {
    box.addEventListener("mousedown", startDrag);
    box.addEventListener("touchstart", startDrag);
    box.addEventListener("mouseup", endDrag);
    box.addEventListener("touchend", endDrag);
});

// Eigenbewegung der Links (starten am gleichen Punkt)
let movers = new Map();
function randomMovement(box) {
    const dx = (Math.random() - 0.5) * 2.5;
    const dy = (Math.random() - 0.5) * 2.5;
    const rect = box.getBoundingClientRect();
    box.style.left = Math.max(0, Math.min(window.innerWidth - rect.width, rect.left + dx)) + "px";
    box.style.top  = Math.max(0, Math.min(window.innerHeight - rect.height, rect.top + dy)) + "px";
}

function startMovement(box) {
    movers.set(box, setInterval(() => randomMovement(box), 80));
}

function stopMovement(box) {
    clearInterval(movers.get(box));
}

function restartMovement(box) {
    startMovement(box);
}

// Startbewegung aller Boxen
document.querySelectorAll(".linkbox").forEach(b => startMovement(b));

// Besucherzähler pro Link
function newVisitor() {
    const boxes = document.querySelectorAll(".linkbox");
    const chosen = boxes[Math.floor(Math.random() * boxes.length)];
    let c = chosen.querySelector(".counter");
    c.textContent = parseInt(c.textContent) + 1;

    // Hintergrundfarbe abhängig von Besucherzahl
    const count = parseInt(c.textContent);
    const alpha = Math.min(0.15 + count * 0.05, 0.8);
    chosen.style.backgroundColor = `rgba(0,0,128,${alpha})`;
}

// Simulierter Besucher alle 8 Sekunden
setInterval(newVisitor, 8000);

</script>
</body>
</html>
