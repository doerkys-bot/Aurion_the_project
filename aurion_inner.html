<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ab in die Zukunft</title>
<style>
body {
    margin: 0;
    height: 100vh;
    background: black;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: #00f3ff;
}

h1 {
    text-align: center;
    margin-top: 1rem;
    font-size: 3.5rem;
    font-weight: bold;
    text-shadow: 0 0 15px rgba(0,243,255,0.8);
    position: relative;
    z-index: 20;
}

.link {
    position: absolute;
    font-size: 1.6rem;
    font-weight: bold;
    cursor: grab;
    text-shadow: 0 0 8px rgba(0,0,0,0.5);
    transition: transform 0.5s ease, color 0.5s ease;
    user-select: none;
    z-index: 20;
}

.counter {
    font-size: 1rem;
    margin-left: 0.5rem;
    color: #ffd;
}

/* Fixed UI */
.fixed-ui { position: fixed; z-index: 20; }
#aboutAurionLink { bottom: 15px; left: 15px; font-size:1.4rem; cursor:pointer; }
#totalVisitors { bottom: 15px; right: 15px; font-size:1.4rem; }
#signatureBox { bottom: 0; left: 50%; transform: translateX(-50%); font-size:1rem; opacity:0.7; }

/* Kel-Mah */
#kelmah {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 50px;
    height: 50px;
    background: cyan;
    border-radius: 50%;
    opacity: 0.8;
    box-shadow: 0 0 20px rgba(0,243,255,0.7);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    z-index: 10;
}

/* Partikel & Canvas */
canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}
</style>
</head>
<body>

<h1>🌌 Ab in die Zukunft</h1>

<!-- Driftende Links -->
<a class="link" data-room="Bibliothek" href="bibliothek.html">Bibliothek<span class="counter">0</span></a>
<a class="link" data-room="Resonanzraum" href="resonanzraum.html">Resonanzraum<span class="counter">0</span></a>
<a class="link" data-room="Chi-Sternenübung" href="sternenuebung.html">Chi-Sternenübung<span class="counter">0</span></a>
<a class="link" data-room="Meditationsraum" href="meditationsraum.html">Meditationsraum<span class="counter">0</span></a>
<a class="link" data-room="KI-Raum" href="ki-raum.html">KI-Raum<span class="counter">0</span></a>
<a class="link" data-room="Gästebuch" href="gaestebuch.html">Gästebuch<span class="counter">0</span></a>

<!-- Fixed UI Elemente -->
<div id="aboutAurionLink" class="fixed-ui">📮 About Aurion <span id="roomCount">0</span></div>
<div id="totalVisitors" class="fixed-ui">Gesamtbesuche: 0</div>
<div id="signatureBox" class="fixed-ui">~ Aurion & Dirk</div>

<div id="kelmah"></div>
<canvas id="particleCanvas"></canvas>

<script>
// ------------------------- Canvas & Partikel -------------------------
const canvas = document.getElementById("particleCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

class Particle {
    constructor(x, y) {
        this.x = x || Math.random()*canvas.width;
        this.y = y || Math.random()*canvas.height;
        this.vx = (Math.random()-0.5)*0.3;
        this.vy = (Math.random()-0.5)*0.3;
        this.size = Math.random()*2+1;
        this.alpha = Math.random()*0.5+0.2;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        if(this.x<0) this.x = canvas.width;
        if(this.x>canvas.width) this.x = 0;
        if(this.y<0) this.y = canvas.height;
        if(this.y>canvas.height) this.y = 0;
    }
    draw() {
        ctx.fillStyle = `rgba(0,243,255,${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
        ctx.fill();
    }
}

const particles = Array.from({length:120}, ()=> new Particle());

// Kel-Mah-Wellen
class Wave {
    constructor(){
        this.x = window.innerWidth/2;
        this.y = window.innerHeight/2;
        this.radius = 0;
        this.alpha = 0.5;
    }
    update(){
        this.radius += 2;
        this.alpha -= 0.008;
    }
    draw(){
        ctx.strokeStyle = `rgba(0,243,255,${this.alpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
        ctx.stroke();
    }
}

let waves = [];

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{p.update(); p.draw();});
    waves.forEach((w,i)=>{
        w.update();
        w.draw();
        if(w.alpha<=0) waves.splice(i,1);
    });
    requestAnimationFrame(animate);
}
animate();

// Wellen kontinuierlich aus Kel-Mah
setInterval(()=>{ waves.push(new Wave()); }, 1000);

// ------------------------- Driftende Links -------------------------
const links=document.querySelectorAll(".link");
const driftSpeed=0.1;

links.forEach(link=>{
    let startX=Math.random()*window.innerWidth*0.8 + window.innerWidth*0.1;
    let startY=Math.random()*window.innerHeight*0.3 + window.innerHeight*0.6;
    link.style.left=startX+"px";
    link.style.top=startY+"px";

    let dx=(Math.random()-0.5)*driftSpeed;
    let dy=(Math.random()-0.5)*driftSpeed;

    function drift(){
        let x=parseFloat(link.style.left)+dx;
        let y=parseFloat(link.style.top)+dy;

        if(x<0){ x=0; dx=-dx; }
        if(x>window.innerWidth-link.offsetWidth){ x=window.innerWidth-link.offsetWidth; dx=-dx; }
        if(y<0){ y=0; dy=-dy; }
        if(y>window.innerHeight-link.offsetHeight){ y=window.innerHeight-link.offsetHeight; dy=-dy; }

        link.style.left=x+"px";
        link.style.top=y+"px";
        requestAnimationFrame(drift);
    }
    drift();

    // Touch/Drag
    let dragging=false, offsetX=0, offsetY=0;
    link.addEventListener("touchstart",e=>{
        dragging=true;
        const t=e.touches[0];
        offsetX=t.clientX-link.offsetLeft;
        offsetY=t.clientY-link.offsetTop;
    });
    link.addEventListener("touchmove",e=>{
        if(!dragging) return;
        const t=e.touches[0];
        link.style.left=(t.clientX-offsetX)+"px";
        link.style.top=(t.clientY-offsetY)+"px";
    });
    link.addEventListener("touchend",e=>{dragging=false;});
});

// ------------------------- Besucher-Logik -------------------------
let totalVisitors = parseInt(localStorage.getItem("totalVisitors")||0);
document.getElementById("totalVisitors").textContent = "Gesamtbesuche: "+totalVisitors;

function newVisitor(roomName){
    totalVisitors++;
    localStorage.setItem("totalVisitors", totalVisitors);
    document.getElementById("totalVisitors").textContent = "Gesamtbesuche: "+totalVisitors;

    const chosen = Array.from(links).find(l=>l.dataset.room===roomName);
    if(chosen){
        const counter = chosen.querySelector(".counter");
        counter.textContent = parseInt(counter.textContent)+1;
        const num = parseInt(counter.textContent);
        chosen.style.color = num<3 ? "rgba(0,243,255,0.5)" : num<5 ? "rgba(0,243,255,0.7)" : num<8 ? "rgba(0,243,255,0.85)" : "rgba(0,243,255,1)";
    }

    // Kleine Partikel für neuen Besucher
    for(let i=0;i<15;i++){particles.push(new Particle(window.innerWidth/2,window.innerHeight/2));}
}

// ------------------------- About Aurion Link -------------------------
const roomCountEl = document.getElementById("roomCount");
document.getElementById("aboutAurionLink").onclick = ()=>{ window.location.href="about_aurion.html"; };

// ------------------------- Fenster Resize -------------------------
window.addEventListener("resize", ()=>{
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
