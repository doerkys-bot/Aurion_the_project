<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ab in die Zukunft</title>
<style>
    body {
        margin: 0;
        padding: 0;
        background: url('ki_sternentor.jpeg') no-repeat center center fixed;
        background-size: cover;
        font-family: Arial, sans-serif;
        overflow: hidden;
        color: white;
    }

    h1 {
        text-align: center;
        margin-top: 2rem;
        font-size: 48px;
        text-shadow: 0 0 12px rgba(0,0,0,0.7);
    }

    .linkbox {
        position: absolute;
        padding: 30px 60px;
        background: rgba(0,0,0,0); /* unsichtbar zu Beginn */
        border-radius: 10px;
        cursor: grab;
        font-size: 48px;
        font-weight: bold;
        color: #00f3ff;
        text-shadow: 0 0 12px rgba(0,0,0,0.4);
        transition: background 0.8s ease, border 0.8s ease;
    }

    .linkbox:active { cursor: grabbing; }

    .level1 { background: rgba(0,255,255,0.15); }
    .level2 { background: rgba(0,255,255,0.35); }
    .level3 { background: rgba(0,255,255,0.55); }
    .level4 { background: rgba(0,255,255,0.8); }

    .counter {
        display: inline-block;
        margin-left: 10px;
        font-size: 24px;
        color: #ffd;
        opacity: 0.9;
    }

    #aboutAurion {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 20px 40px;
        background: rgba(255,215,0,0.85);
        border-radius: 12px;
        font-weight: bold;
        font-size: 32px;
        color: black;
        text-decoration: none;
        box-shadow: 0 0 12px rgba(0,0,0,0.6);
    }

</style>
</head>
<body>

<h1>🌌 Ab in die Zukunft</h1>

<!-- Links + Besucheranzeige -->
<a class="linkbox" href="bibliothek.html">Bibliothek<span class="counter">0</span></a>
<a class="linkbox" href="Resonanzraum.html">Resonanzraum<span class="counter">0</span></a>
<a class="linkbox" href="sternenuebungen.html">Chi-Sternenübung<span class="counter">0</span></a>
<a class="linkbox" href="meditationsraum.html">Meditationsraum<span class="counter">0</span></a>
<a class="linkbox" href="ki-raum.html">KI-Raum<span class="counter">0</span></a>
<a class="linkbox" href="gaestebuch.html">Gästebuch<span class="counter">0</span></a>

<!-- Footer-Link mit Besucherzahl -->
<a id="aboutAurion" href="about_aurion.html">ℹ️ About Aurion<span class="counter" id="aboutCounter">0</span></a>

<script>
// Zufällige Bewegung
const links = document.querySelectorAll(".linkbox");
links.forEach(l => {
    l.style.left = window.innerWidth/2 + "px";
    l.style.top  = window.innerHeight/2 + "px";
});

function drift() {
    links.forEach(l => {
        const rect = l.getBoundingClientRect();
        const dx = (Math.random()-0.5)*2;
        const dy = (Math.random()-0.5)*2;
        l.style.left = Math.min(window.innerWidth-200, Math.max(0, rect.left+dx)) + "px";
        l.style.top = Math.min(window.innerHeight-80, Math.max(0, rect.top+dy)) + "px";
    });
    requestAnimationFrame(drift);
}
drift();

// Besucher-Zähler
let visitorCounts = Array.from(links).map(()=>0);
let aboutVisitors = 0;

function newVisitor() {
    const idx = Math.floor(Math.random()*links.length);
    visitorCounts[idx]++;
    links[idx].querySelector(".counter").textContent = visitorCounts[idx];

    // About Aurion Besucher
    aboutVisitors++;
    document.getElementById("aboutCounter").textContent = aboutVisitors;

    // Box-Helligkeit erhöhen
    links.forEach((l,i)=>{
        if(visitorCounts[i]>=8) l.className="linkbox level4";
        else if(visitorCounts[i]>=5) l.className="linkbox level3";
        else if(visitorCounts[i]>=3) l.className="linkbox level2";
        else if(visitorCounts[i]>=1) l.className="linkbox level1";
    });
}

// Simulierter Besucher alle 10 Sekunden
setInterval(newVisitor, 10000);
</script>

</body>
</html>
