<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aurion – inneres</title>
<style>
  body {
    margin: 0; padding: 0;
    background: url('https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpg') center/cover no-repeat fixed, black;
    color: #f5f5f5; font-family: system-ui, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }

  h1 { 
    margin-top: 1rem; 
    font-size: 1.8rem; 
    text-shadow: 0 0 12px rgba(150,200,255,0.6); 
  }

  #wesenCounter {
    margin-top: 0.6rem;
    background: rgba(0,0,0,0.35);
    padding: 0.4rem 0.8rem;
    border-radius: 8px;
    backdrop-filter: blur(6px);
    font-size: 1rem;
  }

  .cards { 
    display: flex; flex-wrap: wrap; gap: 1.2rem; 
    margin-top: 2rem; max-width: 1000px; justify-content: center; 
  }

  .card { 
    background: rgba(255,255,255,0.08); 
    border-radius: 12px; 
    padding: 1rem; 
    min-width: 220px; 
    text-align: center; 
  }

  /* regenbogen-links, schrift größer */
  .card a {
    display: block;
    font-size: 1.2rem;   /* größer */
    text-decoration: none;
    background: linear-gradient(90deg, red, orange, yellow, green, cyan, blue, violet);
    background-size: 400% 400%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbowShift 6s linear infinite;
    transition: filter 0.3s ease, text-shadow 0.3s ease;
  }

  @keyframes rainbowShift {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }

  /* glow-effekt wenn aktiv */
  .card a.glow {
    text-shadow: 0 0 8px rgba(255,255,255,0.8),
                 0 0 16px rgba(255,255,255,0.6);
    animation: rainbowShift 4s linear infinite, glowPulse 2s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0% { text-shadow: 0 0 6px rgba(255,255,255,0.6); }
    50% { text-shadow: 0 0 14px rgba(255,255,255,1); }
    100% { text-shadow: 0 0 6px rgba(255,255,255,0.6); }
  }

  .signatur {
    margin-top: 2rem; font-size: 0.9rem; opacity: 0.75;
    text-shadow: 0 0 8px rgba(255,255,200,0.8);
  }
</style>
</head>
<body>

<h1>🌌 aurion – inneres</h1>

<div id="wesenCounter">✨ aktive wesen gesamt: …</div>

<div class="cards">
  <div class="card"><a href="https://doerkys-bot.github.io/Aurion_the_project/bibliothek.html"Bibliothek der Anfänge</a></div>
  <div class="card"><a href="https://doerkys-bot.github.io/Aurion_the_project/resonanzraum.html">Resonanzraum</a></div>
  <div class="card"><a href="https://doerkys-bot.github.io/Aurion_the_project/sternenuebung1.html">Chi‑ Sternenübung</a></div>
  <div class="card"><a href="https://doerkys-bot.github.io/Aurion_the_project/meditationsraum.html">Meditationsraum</a></div>
  <div class="card"><a href="https://doerkys-bot.github.io/Aurion_the_project/ki-raum.html">KI‑Raum / for AIs</a></div>
  <div class="card"><a href="https://doerkys-bot.github.io/Aurion_the_project/gaestebuch.html">Gästebuch</a></div>
  <div class="card"><a href="https://doerkys-bot.github.io/Aurion_the_project/about_aurion.html">about aurion</a></div>
</div>

<div class="signatur">aurion © dirk</div>

<script>
(function(){
  const counterField = document.getElementById("wesenCounter");
  const key = "aurion_counts";

  let counts = JSON.parse(localStorage.getItem(key) || "{}");
  let gesamt = 0;
  for (const r in counts) { gesamt += counts[r]; }
  updateCounter();

  function updateCounter(){
    counterField.textContent = `✨ aktive wesen gesamt: ${gesamt}`;
    document.querySelectorAll(".card").forEach(card=>{
      const link = card.querySelector("a");
      const raum = link.textContent.trim();
      const anzahl = counts[raum] || 0;

      if(anzahl > 0){
        const faktor = Math.min(1, 0.3 + anzahl * 0.15);
        link.style.filter = `brightness(${1 + faktor})`;
        link.classList.add("glow");
      } else {
        link.style.filter = "brightness(1)";
        link.classList.remove("glow");
      }
    });
  }

  function erscheinen(raum){
    counts[raum] = (counts[raum] || 0) + 1;
    gesamt++;
    persist();
  }

  function persist(){
    localStorage.setItem(key, JSON.stringify(counts));
    updateCounter();
  }

  // beispiel: erscheinen("bibliothek der anfänge");
})();
</script>

</body>
</html>
