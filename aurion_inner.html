<body>

<h1>🌌 Ab in die Zukunft</h1>

<div id="visitorCounter">Besucher: 0</div>

<!-- 6 Links + Besucherzahl pro Link -->
<a class="linkbox" data-room="Bibliothek" href="bibliothek.html" style="left:50%; top:20%;">Bibliothek<span class="counter">0</span></a>
<a class="linkbox" data-room="Resonanzraum" href="Resonanzraum.html" style="left:50%; top:20%;">Resonanzraum<span class="counter">0</span></a>
<a class="linkbox" data-room="Sternenübung" href="sternenuebungen.html" style="left:50%; top:20%;">Chi-Sternenübung<span class="counter">0</span></a>
<a class="linkbox" data-room="Meditation" href="meditationsraum.html" style="left:50%; top:20%;">Meditationsraum<span class="counter">0</span></a>
<a class="linkbox" data-room="KI-Raum" href="ki-raum.html" style="left:50%; top:20%;">KI-Raum<span class="counter">0</span></a>
<a class="linkbox" data-room="Gästebuch" href="gaestebuch.html" style="left:50%; top:20%;">Gästebuch<span class="counter">0</span></a>

<a id="aboutAurion" href="about_aurion.html">ℹ️ About Aurion<span class="counter">0</span></a>

<script>
const boxes = document.querySelectorAll(".linkbox");
const driftSpeed = 0.1; // halbierte Geschwindigkeit
const movers = new Map();

boxes.forEach(box => {
    // Startposition in Pixel (50% Breite, 20% Höhe)
    box.style.left = (window.innerWidth/2) + "px";
    box.style.top = (window.innerHeight*0.2) + "px";

    let dx = (Math.random()-0.5) * driftSpeed * window.innerWidth;
    let dy = (Math.random()-0.5) * driftSpeed * window.innerHeight;

    function drift() {
        if(!movers.has(box) || movers.get(box)) {
            let x = parseFloat(box.style.left);
            let y = parseFloat(box.style.top);

            x += dx;
            y += dy;

            // Ränder berücksichtigen
            if(x < 0 || x > window.innerWidth-150) dx = -dx;
            if(y < 0 || y > window.innerHeight-50) dy = -dy;

            box.style.left = x + "px";
            box.style.top  = y + "px";
        }
        requestAnimationFrame(drift);
    }
    drift();

    // Drag & Drop (frei über gesamte Fläche)
    let offsetX=0, offsetY=0;
    box.addEventListener("mousedown", e=>{
        movers.set(box,false); 
        offsetX = e.clientX - box.offsetLeft;
        offsetY = e.clientY - box.offsetTop;

        function move(e){
            box.style.left = (e.clientX - offsetX) + "px";
            box.style.top = (e.clientY - offsetY) + "px";
        }
        function end(){
            document.removeEventListener("mousemove", move);
            document.removeEventListener("mouseup", end);
            setTimeout(()=>movers.set(box,true),60000);
        }

        document.addEventListener("mousemove", move);
        document.addEventListener("mouseup", end);
    });

    // Touch Events
    box.addEventListener("touchstart", e=>{
        movers.set(box,false);
        const touch = e.touches[0];
        offsetX = touch.clientX - box.offsetLeft;
        offsetY = touch.clientY - box.offsetTop;

        function move(e){
            const t = e.touches[0];
            box.style.left = (t.clientX - offsetX) + "px";
            box.style.top = (t.clientY - offsetY) + "px";
        }
        function end(){
            document.removeEventListener("touchmove", move);
            document.removeEventListener("touchend", end);
            setTimeout(()=>movers.set(box,true),60000);
        }
        document.addEventListener("touchmove", move);
        document.addEventListener("touchend", end);
    });

    movers.set(box,true);
});

// Besucher-System wie gehabt
let totalVisitors = 0;
function newVisitor() {
    totalVisitors++;
    document.getElementById("visitorCounter").textContent = "Besucher: " + totalVisitors;
    const box = boxes[Math.floor(Math.random()*boxes.length)];
    const counter = box.querySelector(".counter");
    counter.textContent = parseInt(counter.textContent) + 1;
    const num = parseInt(counter.textContent);
    if(num < 3) box.classList.add("level1");
    else if(num < 5) box.classList.add("level2");
    else if(num < 8) box.classList.add("level3");
    else box.classList.add("level4");
}
setInterval(newVisitor, 10000);

// Boxen nach 10 Sekunden transparent
setTimeout(() => {
    boxes.forEach(box => box.style.background = "rgba(0,0,0,0)");
}, 10000);
</script>
