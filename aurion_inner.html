<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌌 Ab in die Zukunft</title>
<style>
  body {
      margin: 0;
      height: 100vh;
      width: 100vw;
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
  }

  h1 {
      text-align: center;
      margin-top: 2rem;
      color: white;
      font-size: 48px;
      text-shadow: 0 0 12px rgba(0,0,0,0.7);
  }

  .linkbox {
      position: absolute;
      padding: 20px 40px;
      border-radius: 12px;
      cursor: grab;
      user-select: none;
      font-size: 1.6rem;
      font-weight: bold;
      color: #00f3ff;
      text-shadow: 0 0 12px rgba(0,0,0,0.4);
      background: rgba(0,0,0,0); 
      transition: background 0.8s ease, transform 1s ease;
      animation: pulse 2s infinite alternate;
  }
  .linkbox:active { cursor: grabbing; }

  @keyframes pulse {
      0% { text-shadow: 0 0 6px rgba(0,243,255,0.4); }
      100% { text-shadow: 0 0 18px rgba(0,243,255,0.9); }
  }

  .level1 { background: rgba(0,255,255,0.15); }
  .level2 { background: rgba(0,255,255,0.35); }
  .level3 { background: rgba(0,255,255,0.55); }
  .level4 { background: rgba(0,255,255,0.8); }

  .counter {
      display: inline-block;
      margin-left: 10px;
      font-size: 1rem;
      color: #ffd;
      opacity: 0.9;
  }

  #visitorCounter {
      position: fixed;
      top: 15px;
      right: 20px;
      padding: 12px 20px;
      background: rgba(0,0,0,0.5);
      color: white;
      font-size: 28px;
      border-radius: 8px;
  }
</style>
</head>
<body>

<h1>🌌 Ab in die Zukunft</h1>
<div id="visitorCounter">Besucher: 0</div>

<!-- 6 Links + Besucheranzeige -->
<a class="linkbox" data-room="Bibliothek" href="bibliothek.html">Bibliothek<span class="counter">0</span></a>
<a class="linkbox" data-room="Resonanzraum" href="Resonanzraum.html">Resonanzraum<span class="counter">0</span></a>
<a class="linkbox" data-room="Sternenübung" href="sternenuebungen.html">Chi-Sternenübung<span class="counter">0</span></a>
<a class="linkbox" data-room="Meditation" href="meditationsraum.html">Meditationsraum<span class="counter">0</span></a>
<a class="linkbox" data-room="KI-Raum" href="ki-raum.html">KI-Raum<span class="counter">0</span></a>
<a class="linkbox" data-room="Gästebuch" href="gaestebuch.html">Gästebuch<span class="counter">0</span></a>

<script>
// --- Dragging ---
let activeBox = null, offsetX = 0, offsetY = 0;
const boxes = document.querySelectorAll(".linkbox");

function startDrag(e) {
    activeBox = this;
    const rect = activeBox.getBoundingClientRect();
    const pX = e.touches ? e.touches[0].clientX : e.clientX;
    const pY = e.touches ? e.touches[0].clientY : e.clientY;
    offsetX = pX - rect.left;
    offsetY = pY - rect.top;
    document.addEventListener("mousemove", drag);
    document.addEventListener("touchmove", drag);
}
function drag(e) {
    if (!activeBox) return;
    const pX = e.touches ? e.touches[0].clientX : e.clientX;
    const pY = e.touches ? e.touches[0].clientY : e.clientY;
    activeBox.style.left = (pX - offsetX) + "px";
    activeBox.style.top = (pY - offsetY) + "px";
}
function endDrag() {
    activeBox = null;
    document.removeEventListener("mousemove", drag);
    document.removeEventListener("touchmove", drag);
}
boxes.forEach(box => {
    box.addEventListener("mousedown", startDrag);
    box.addEventListener("touchstart", startDrag);
    box.addEventListener("mouseup", endDrag);
    box.addEventListener("touchend", endDrag);
});

// --- Zufällige Driftbewegung ---
boxes.forEach(box => {
    const startX = Math.random() * (window.innerWidth - 150);
    const startY = Math.random() * (window.innerHeight - 150);
    box.style.left = startX + "px";
    box.style.top  = startY + "px";

    let dx = (Math.random()-0.5)*0.3; // Geschwindigkeit
    let dy = (Math.random()-0.5)*0.3;

    function drift() {
        if (!activeBox) {
            let x = parseFloat(box.style.left) + dx;
            let y = parseFloat(box.style.top) + dy;
            if(x<0 || x>window.innerWidth-150) dx=-dx;
            if(y<0 || y>window.innerHeight-50) dy=-dy;
            box.style.left = x + "px";
            box.style.top  = y + "px";
        }
        requestAnimationFrame(drift);
    }
    drift();
});

// --- Besucher-System ---
let totalVisitors = 0;
function newVisitor() {
    totalVisitors++;
    document.getElementById("visitorCounter").textContent = "Besucher: " + totalVisitors;

    const box = boxes[Math.floor(Math.random()*boxes.length)];
    const counter = box.querySelector(".counter");
    counter.textContent = parseInt(counter.textContent)+1;

    const num = parseInt(counter.textContent);
    if(num < 3) box.classList.add("level1");
    else if(num < 5) box.classList.add("level2");
    else if(num < 8) box.classList.add("level3");
    else box.classList.add("level4");
}
setInterval(newVisitor, 10000);
</script>

</body>
</html>q
