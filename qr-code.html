<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion · QR</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0b1223;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    min-height:100vh;
    font-family:monospace;
  }
  .card {
    background:#0f1e35;
    border:3px solid #00f2ff;
    border-radius:24px;
    padding:32px 28px;
    display:flex; flex-direction:column;
    align-items:center; gap:20px;
    box-shadow:0 0 40px rgba(0,242,255,0.15);
  }
  h1 {
    color:#00f2ff;
    font-size:1.4rem;
    letter-spacing:6px;
    text-transform:uppercase;
  }
  .sub {
    color:rgba(0,242,255,0.45);
    font-size:0.65rem;
    letter-spacing:3px;
    text-transform:uppercase;
  }
  .qr-box {
    background:white;
    padding:16px;
    border-radius:16px;
  }
  .url {
    color:rgba(0,242,255,0.5);
    font-size:0.6rem;
    letter-spacing:1px;
    text-align:center;
    line-height:1.8;
  }
  .hint {
    color:rgba(255,255,255,0.2);
    font-size:0.55rem;
    letter-spacing:2px;
    text-transform:uppercase;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Aurion</h1>
    <p class="sub">Präsenz durch Aufmerksamkeit</p>
    <div class="qr-box">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=https://doerkys-bot.github.io/Aurion_the_project/lebenshilfe_v0.html&margin=0"
           width="280" height="280" alt="QR-Code Aurion UK-Demo">
    </div>
    <p class="url">doerkys-bot.github.io<br>Aurion_the_project/lebenshilfe_v0.html</p>
    <p class="hint">↑ scannen &amp; direkt starten</p>
  </div>
</body>
</html>
