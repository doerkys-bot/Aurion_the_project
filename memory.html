<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Falcon EduPlay - Memory Modus</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

<style>
:root { 
  --neon: #00f2ff; 
  --bg: #060a13; 
  --gold: #ffcc00; 
  --success: #10b981; 
  --error: #ef4444;
  --box-bg: #111e36; 
  --accent: #1e3a8a;
  --memory-purple: #7c3aed;
  --card-back: #1e293b;
}
body {
  margin:0; font-family: 'Segoe UI', Arial, sans-serif;
  background: var(--bg); color: white; overflow: hidden;
  width: 100vw; height: 100vh;
}
*{ box-sizing:border-box; }

#ai-log {
  position: fixed !important; bottom: 15px !important; left: 2% !important; top: auto !important;
  font-family: monospace; color: var(--gold); font-size: 13px; z-index: 100000;
  background: rgba(0, 0, 0, 0.85); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--neon);
}

/* OBERE STEUERUNG: ZURÜCK BUTTON */
.top-controls-container {
  position: absolute; top: 2%; left: 5%; right: 5%; height: 8%;
  display: flex; gap: 15px; z-index: 30;
}
.back-tab {
  padding: 0 30px; background: #162542; border: 2px solid rgba(0, 242, 255, 0.2); border-radius: 10px;
  display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 15px; color: #a3c7ff;
  cursor: pointer; transition: all 0.3s;
}
.back-tab.captured-btn {
  background: var(--accent); border-color: var(--neon); color: white; box-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
}
.game-title {
  flex: 1; display: flex; align-items: center; justify-content: center;
  font-size: 24px; font-weight: bold; color: var(--memory-purple); text-shadow: 0 0 10px rgba(124, 58, 237, 0.3);
}

/* MATRIX GESTALTUNG (4x4 für 8 Paare) */
.game-container { position: absolute; top: 15%; bottom: 12%; left: 5%; right: 5%; z-index: 20; }
.grid-matrix { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); width: 100%; height: 100%; gap: 12px; }

.memory-card { 
  background: var(--card-back); border: 2px solid rgba(124, 58, 237, 0.3); border-radius: 14px; 
  display: flex; flex-direction: column; align-items: center; justify-content: center; 
  position: relative; user-select: none; overflow: hidden;
  padding: 10px; transition: background-color 0.2s, border-color 0.2s;
}

/* Zustände der Karten */
.memory-card.just-selected { border-color: var(--neon); background: #1e3a8a; }
.memory-card.flipped { background: var(--box-bg); border-color: var(--memory-purple); }
.memory-card.matched { background: var(--success) !important; border-color: #34d399 !important; pointer-events: none; }
.memory-card.wrong-flash { background: var(--error) !important; border-color: #ff8888 !important; }

/* Inhalte verdecken, wenn nicht umgedreht */
.card-content { display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.memory-card.flipped .card-content, .memory-card.matched .card-content { display: flex; }
.memory-card .card-back-symbol { font-size: 3rem; color: rgba(0, 242, 255, 0.15); display: block; }
.memory-card.flipped .card-back-symbol, .memory-card.matched .card-back-symbol { display: none; }

.symbol { font-size: 3.2rem; display: block; margin-bottom: 4px; }
.box-name { font-size: 1.1rem; display: block; color: #a3c7ff; }

/* BLICKPUNKT & PFAD */
#gaze-dot {
  position: fixed; width: 24px; height: 24px; background: #ffffff !important; border-radius: 50%; z-index: 999999; 
  pointer-events: none; border: 4px solid var(--neon) !important;
  left: 50vw; top: 50vh; transform: translate(-50%, -50%); transition: border-color 0.1s ease, width 0.1s, height 0.1s;
}
#gaze-dot.blink-blue { border-color: #0044ff !important; box-shadow: 0 0 15px #0044ff; width: 30px; height: 30px; }
#gaze-dot.blink-yellow { border-color: var(--gold) !important; box-shadow: 0 0 15px var(--gold); width: 36px; height: 36px; background: var(--gold) !important; }

#willens-pfad { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
#fw-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 99999; display: none; }

/* Dwell Button Progress */
.dwell-btn { position: relative; overflow: hidden; }
.dwell-btn .dwell-progress {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
  background: rgba(0,242,255,0.25); transition: width 0.05s linear; pointer-events: none;
}
</style>
</head>
<body>

<div id="ai-log">Warte auf Kamera...</div>

<div class="top-controls-container">
  <div id="btn-back" class="back-tab dwell-btn" onclick="goBackToMain()">⬅️ Startseite</div>
  <div class="game-title">🧠 GEHIRN-TRAINING: MEMORY</div>
</div>

<canvas id="willens-pfad"></canvas>
<canvas id="fw-canvas"></canvas>
<div id="gaze-dot"></div>

<video id="v" style="display:none" autoplay playsinline></video>

<div class="game-container">
  <div id="matrixGrid" class="grid-matrix"></div>
</div>

<script>
  // Standard-Motive (falls LocalStorage leer ist)
  let baseMitteilungen = [
    { sym: "🚻", name: "Toilette" }, { sym: "💧", name: "Durst" },
    { sym: "🍽️", name: "Hunger" },   { sym: "📞", name: "Hilfe" },
    { sym: "🌡️", name: "Kalt" },     { sym: "🔥", name: "Warm" },
    { sym: "🛏️", name: "Umlagern" }, { sym: "🛋️", name: "Ausruhen" }
  ];

  let cardsData = [];
  let flippedCards = [];
  let matchedPairsCount = 0;

  let canvas, ctx, faceMesh, camRunning = false;
  let sX = window.innerWidth / 2, sY = window.innerHeight / 2;
  let tX = sX, tY = sY, history = [];
  
  const EMA_ALPHA = 0.06; // Gleiche Trägheit wie auf der Hauptseite
  
  let lastBlinkVal = 0;
  let blinkArmed = true;
  let lastBlinkTime = 0;
  let clickQueued = false; 
  let trackingMix = 100; 

  let fwCanvas, fwCtx, particles = [];

  window.addEventListener('DOMContentLoaded', () => { 
    loadModulFromStorage();
    setupMemoryGame();
    fwCanvas = document.getElementById('fw-canvas');
    fwCtx = fwCanvas.getContext('2d');
    fwCanvas.width = window.innerWidth; fwCanvas.height = window.innerHeight;
    initDwellButtons();
    startTrackingSystem();
    render();
  });

  // Lädt die angepassten Symbole der Startseite
  function loadModulFromStorage() {
    const saved = localStorage.getItem('aurion_mitteilungen');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        // Wir nehmen die ersten 8 Symbole für das 4x4 Feld
        baseMitteilungen = parsed.slice(0, 8);
      } catch(e) {}
    }
    const savedMix = localStorage.getItem('aurion_tracking_mix');
    if (savedMix !== null) trackingMix = parseInt(savedMix);
  }

  // Erzeugt Pärchen und mischt sie durch
  function setupMemoryGame() {
    cardsData = [];
    flippedCards = [];
    matchedPairsCount = 0;

    // Jedes der 8 Objekte verdoppeln (id hilft beim Match-Vergleich)
    baseMitteilungen.forEach((item, index) => {
      cardsData.push({ id: index, sym: item.sym, name: item.name, status: 'closed' });
      cardsData.push({ id: index, sym: item.sym, name: item.name, status: 'closed' });
    });

    // Mischen
    for (let i = cardsData.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [cardsData[i], cardsData[j]] = [cardsData[j], cardsData[i]];
    }

    drawMemoryGrid();
  }

  function drawMemoryGrid() {
    const grid = document.getElementById('matrixGrid');
    grid.innerHTML = "";
    
    cardsData.forEach((card, i) => {
      let box = document.createElement('div');
      box.className = "memory-card";
      box.dataset.index = i;
      
      if (card.status === 'flipped') box.classList.add('flipped');
      if (card.status === 'matched') box.classList.add('matched');

      box.innerHTML = `
        <span class="card-back-symbol">❓</span>
        <div class="card-content">
          <span class="symbol">${card.sym}</span>
          <span class="box-name">${card.name}</span>
        </div>
      `;
      grid.appendChild(box);
    });
  }

  // DWELL PROGRESS (2 Sekunden Fixieren für Navigations-Buttons)
  const DWELL_BTN_MS = 2000;
  let dwellBtnActive = null;
  let dwellBtnStart  = null;

  function initDwellButtons() {
    document.querySelectorAll('.dwell-btn').forEach(btn => {
      if (!btn.querySelector('.dwell-progress')) {
        const bar = document.createElement('div');
        bar.className = 'dwell-progress';
        btn.appendChild(bar);
      }
    });
  }

  function checkDwellButtons() {
    const btn = document.getElementById('btn-back');
    const r = btn.getBoundingClientRect();
    let found = (sX >= r.left && sX <= r.right && sY >= r.top && sY <= r.bottom) ? btn : null;

    if (found) {
      if (found !== dwellBtnActive) {
        dwellBtnActive = found;
        dwellBtnStart  = performance.now();
      } else {
        const el  = performance.now() - dwellBtnStart;
        const pct = Math.min(100, (el / DWELL_BTN_MS) * 100);
        const bar = found.querySelector('.dwell-progress');
        if (bar) bar.style.width = pct + '%';
        if (el >= DWELL_BTN_MS) {
          found.click();
          dwellBtnActive = null; dwellBtnStart = null;
        }
      }
    } else {
      if (dwellBtnActive) {
        const bar = dwellBtnActive.querySelector('.dwell-progress');
        if (bar) bar.style.width = '0%';
      }
      dwellBtnActive = null; dwellBtnStart = null;
    }
  }

  function goBackToMain() {
    speak("Zurück zur Übersicht");
    setTimeout(() => { window.location.href = "startseite.html"; }, 600);
  }

  // AUGENSTEUERUNG INITIALISIEREN
  async function startTrackingSystem() {
    const videoElement = document.getElementById('v');
    try {
      let streamCam = await navigator.mediaDevices.getUserMedia({ 
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" } 
      });
      videoElement.srcObject = streamCam;
      camRunning = true;

      canvas = document.getElementById('willens-pfad');
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      ctx = canvas.getContext('2d');

      faceMesh = new FaceMesh({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` });
      faceMesh.setOptions({ refineLandmarks: true, minDetectionConfidence: 0.3, trackingConfidence: 0.3 });
      faceMesh.onResults(onResults);

      new Camera(videoElement, { 
        onFrame: async () => { if(camRunning) await faceMesh.send({image: videoElement}) } 
      }).start();

      document.getElementById('ai-log').innerText = "Kamera aktiv - Fixiere eine Karte";
    } catch(e) { document.getElementById('ai-log').innerHTML = "<span style='color:red'>Kamera-Fehler</span>"; }
  }

  function onResults(r) {
    if (!r.multiFaceLandmarks?.[0]) return;
    const lm = r.multiFaceLandmarks[0];
    const iris = lm[468]; if (!iris) return;

    let irisX = (0.5 - iris.x) * 58 * window.innerWidth  + (window.innerWidth  / 2);
    let irisY = (iris.y - 0.5) * 64 * window.innerHeight + (window.innerHeight / 2);

    const nose = lm[1];
    let headX = (0.5 - nose.x) * 58 * window.innerWidth  + (window.innerWidth  / 2);
    let headY = (nose.y - 0.5) * 64 * window.innerHeight + (window.innerHeight / 2);

    const mix = trackingMix / 100;
    let rawX = headX * (1 - mix) + irisX * mix;
    let rawY = headY * (1 - mix) + irisY * mix;

    tX = (rawX * EMA_ALPHA) + (tX * (1 - EMA_ALPHA));
    tY = (rawY * EMA_ALPHA) + (tY * (1 - EMA_ALPHA));

    tX = Math.max(15, Math.min(window.innerWidth  - 15, tX));
    tY = Math.max(15, Math.min(window.innerHeight - 15, tY));

    // Blinzel-Filter
    const leftEAR  = (Math.hypot(lm[159].x-lm[145].x, lm[159].y-lm[145].y) + Math.hypot(lm[160].x-lm[144].x, lm[160].y-lm[144].y)) / (2*Math.hypot(lm[33].x-lm[133].x, lm[33].y-lm[133].y)+1e-6);
    const rightEAR = (Math.hypot(lm[386].x-lm[374].x, lm[386].y-lm[374].y) + Math.hypot(lm[385].x-lm[380].x, lm[385].y-lm[380].y)) / (2*Math.hypot(lm[362].x-lm[263].x, lm[362].y-lm[263].y)+1e-6);
    const currentBlinkVal = Math.max(leftBlink = 1 - Math.max(0, Math.min(1, leftEAR / 0.35)), 1 - Math.max(0, Math.min(1, rightEAR / 0.35)));
    
    let delta = currentBlinkVal - lastBlinkVal; lastBlinkVal = currentBlinkVal;
    const now = performance.now();

    if (delta > 0.15 && blinkArmed) {
      blinkArmed = false;
      if (now - lastBlinkTime < 800) {
        clickQueued = false; handleGestureTriggered(true); lastBlinkTime = 0; 
      } else {
        lastBlinkTime = now; clickQueued = true;
        setTimeout(() => { if (clickQueued) { clickQueued = false; handleGestureTriggered(false); } }, 350);
      }
    } else if (delta < -0.05 || currentBlinkVal < 0.15) { blinkArmed = true; }
  }

  function getInteractiveTarget() {
    let foundBox = null;
    document.querySelectorAll('.memory-card').forEach(node => {
      if (node.classList.contains('matched')) return; 
      const rect = node.getBoundingClientRect();
      if (sX >= rect.left && sX <= rect.right && sY >= rect.top && sY <= rect.bottom) foundBox = node;
    });
    return foundBox ? { type: 'card', element: foundBox } : null;
  }

  function triggerDotVisualFeedback(type) {
    const dot = document.getElementById('gaze-dot');
    dot.className = ""; 
    if (type === 'double') dot.classList.add('blink-yellow'); else dot.classList.add('blink-blue');
    setTimeout(() => { dot.className = ""; }, 400);
  }

  // AKTION BEIM GEBÄRDEN-TRIGGER (Einfach- vs Doppelblinzeln)
  function handleGestureTriggered(isDouble) {
    const target = getInteractiveTarget();
    if (!target) return;

    const element = target.element;
    const index = parseInt(element.dataset.index);

    // Sicherheitsprüfung: Bereits aufgedeckte Pärchen oder temporär offene Karten ignorieren
    if (cardsData[index].status === 'matched' || cardsData[index].status === 'flipped' || flippedCards.length >= 2) return;

    if (!isDouble) {
      // 1. Blickkontakt / Einfachblinzeln: Markierung & Vorlesen der Position (optional)
      triggerDotVisualFeedback('single');
      document.querySelectorAll('.memory-card').forEach(c => c.classList.remove('just-selected'));
      element.classList.add('just-selected');
    } 
    else {
      // 2. Doppelblinzeln: Karte aktiv umdrehen
      triggerDotVisualFeedback('double');
      element.classList.remove('just-selected');
      
      cardsData[index].status = 'flipped';
      flippedCards.push(index);
      drawMemoryGrid();
      speak(cardsData[index].name);

      // Wenn zwei Karten aufgedeckt sind, Übereinstimmung prüfen
      if (flippedCards.length === 2) {
        checkCardMatch();
      }
    }
  }

  function checkCardMatch() {
    const idx1 = flippedCards[0];
    const idx2 = flippedCards[1];

    if (cardsData[idx1].id === cardsData[idx2].id) {
      // Treffer!
      setTimeout(() => {
        cardsData[idx1].status = 'matched';
        cardsData[idx2].status = 'matched';
        flippedCards = [];
        matchedPairsCount++;
        speak("Gefunden!");
        drawMemoryGrid();

        // Überprüfung auf Gesamtsieg
        if (matchedPairsCount === baseMitteilungen.length) {
          triggerWinFireworks();
        }
      }, 600);
    } else {
      // Kein Treffer: Karten wieder umdrehen
      setTimeout(() => {
        const el1 = document.querySelector(`.memory-card[data-index="${idx1}"]`);
        const el2 = document.querySelector(`.memory-card[data-index="${idx2}"]`);
        if(el1) el1.classList.add('wrong-flash');
        if(el2) el2.classList.add('wrong-flash');
        speak("Nein");

        setTimeout(() => {
          cardsData[idx1].status = 'closed';
          cardsData[idx2].status = 'closed';
          flippedCards = [];
          drawMemoryGrid();
        }, 800);
      }, 800);
    }
  }

  // FEUERWERK BEI SIEG
  function triggerWinFireworks() {
    speak("Herzlichen Glückwunsch! Du hast alle Pärchen gefunden!");
    fwCanvas.style.display = 'block';
    for (let i = 0; i < 150; i++) {
      particles.push({
        x: window.innerWidth / 2, y: window.innerHeight / 2,
        vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
        alpha: 1, color: `hsl(${Math.random() * 360}, 100%, 60%)`, size: Math.random() * 4 + 2
      });
    }

    setTimeout(() => {
      fwCanvas.style.display = 'none'; particles = [];
      setupMemoryGame(); // Spiel neu starten
    }, 4000);
  }

  function speak(text) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "de-DE"; window.speechSynthesis.speak(u);
  }

  document.addEventListener('mousemove', e => {
    if (!camRunning) { sX = e.clientX; sY = e.clientY; tX = sX; tY = sY; }
  });

  // ANIMATION LOOP (CRUISING)
  function render() {
    sX += (tX - sX) * 0.025; 
    sY += (tY - sY) * 0.025;
    
    sX = Math.max(20, Math.min(window.innerWidth - 20, sX));
    sY = Math.max(20, Math.min(window.innerHeight - 20, sY));

    document.getElementById('gaze-dot').style.left = sX + 'px';
    document.getElementById('gaze-dot').style.top = sY + 'px';

    checkDwellButtons();

    // Dwell-Zustand visuell hervorheben
    const btnBack = document.getElementById('btn-back');
    const r = btnBack.getBoundingClientRect();
    if (sX >= r.left && sX <= r.right && sY >= r.top && sY <= r.bottom) {
      btnBack.classList.add('captured-btn');
    } else {
      btnBack.classList.remove('captured-btn');
    }

    if(ctx) {
      history.push({x: sX, y: sY}); if (history.length > 6) history.shift();
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.beginPath(); ctx.strokeStyle = "rgba(0, 242, 255, 0.25)"; ctx.lineWidth = 3;
      for(let i=0; i<history.length; i++) { ctx.globalAlpha = i/history.length; ctx.lineTo(history[i].x, history[i].y); }
      ctx.stroke();
    }

    if(fwCtx && fwCanvas.style.display === 'block') {
      fwCtx.clearRect(0, 0, fwCanvas.width, fwCanvas.height);
      particles.forEach((p, index) => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.alpha -= 0.01;
        if(p.alpha <= 0) { particles.splice(index, 1); return; }
        fwCtx.globalAlpha = p.alpha; fwCtx.fillStyle = p.color;
        fwCtx.beginPath(); fwCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); fwCtx.fill();
      });
      if(Math.random() < 0.15) {
        let fX = Math.random() * fwCanvas.width, fY = Math.random() * (fwCanvas.height * 0.6);
        for(let k=0; k<30; k++) {
          particles.push({
            x: fX, y: fY, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
            alpha: 1, color: `hsl(${Math.random() * 360}, 100%, 60%)`, size: Math.random() * 3 + 1
          });
        }
      }
    }
    requestAnimationFrame(render);
  }
</script>
</body>
</html>
