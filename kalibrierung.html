<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Kalibrierung – Augenblick</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>
<style>
body, html{margin:0;width:100%;height:100%;background:#05070f;color:#dfefff;font-family:system-ui,sans-serif;overflow:hidden;}
#header{position:fixed;top:0;width:100%;text-align:center;padding:10px;background:rgba(0,0,0,.7);font-size:14px;z-index:10;}
#feedback{position:fixed;top:40px;width:100%;text-align:center;font-size:20px;color:#aef;z-index:10;}
.point{position:absolute;width:26px;height:26px;border-radius:50%;background:#3fa9f5;box-shadow:0 0 15px #3fa9f5;}
svg{position:absolute;width:60px;height:60px;pointer-events:none;}
circle.bg{stroke:#1c2b44;stroke-width:6;fill:none;}
circle.fg{stroke:#7fd7ff;stroke-width:6;fill:none;stroke-dasharray:157;stroke-dashoffset:157;}
#save{position:fixed;top:50%;width:100%;text-align:center;font-size:22px;color:#aef;display:none;}
</style>
</head>
<body>
<div id="header">Kalibrierung – schenke den Punkten kurz deine Aufmerksamkeit</div>
<div id="feedback"></div>
<div id="save">Weiter so! ✔</div>

<script>
// 9 Fixpunkte
const positions=[];
for(let y=0;y<3;y++){for(let x=0;x<3;x++){positions.push({x:(x+1)/4*innerWidth,y:(y+1)/4*innerHeight});}}
let index=0, fixation=0, FIX_TIME=1200, STEP=50;
const history=[], MAX_HISTORY=20;
const feedback = document.getElementById("feedback");
const saveEl = document.getElementById("save");

function createPoint(pos){
  const p=document.createElement("div");p.className="point";
  p.style.left=(pos.x-13)+"px"; p.style.top=(pos.y-13)+"px";
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS,"svg");
  svg.innerHTML=`<circle class="bg" cx="30" cy="30" r="25"/><circle class="fg" cx="30" cy="30" r="25"/>`;
  p.appendChild(svg); document.body.appendChild(p);
  return {el:p, ring:svg.querySelector(".fg")};
}

let point=createPoint(positions[index]);

// WebGazer
let gazeX = innerWidth/2, gazeY = innerHeight/2;
webgazer.setRegression("ridge").setTracker("clmtrackr").showVideo(false).showPredictionPoints(false).begin();
webgazer.setGazeListener(data=>{
  if(!data) return;
  gazeX += (data.x - gazeX)*0.1; gazeY += (data.y - gazeY)*0.1;
});

// Fixation Check
setInterval(()=>{
  const dx=gazeX-positions[index].x, dy=gazeY-positions[index].y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<40){fixation+=STEP; point.ring.style.strokeDashoffset=157*(1-fixation/FIX_TIME);}
  else{fixation=Math.max(0,fixation-STEP*2); point.ring.style.strokeDashoffset=157;}
  
  if(fixation>=FIX_TIME){
    document.body.removeChild(point.el); index++; fixation=0;
    feedback.textContent="Weiter so!";
    setTimeout(()=>feedback.textContent="",600);
    if(index>=positions.length){
      localStorage.setItem("eyeCalibration","true");
      saveEl.style.display="block";
      setTimeout(()=>location.href="bibliothek_aug.html",1200);
    }else{point=createPoint(positions[index]);}
  }
},STEP);
</script>
</body>
</html>
