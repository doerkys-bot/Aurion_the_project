<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>📚 Bibliothek der Anfänge – Augenblick</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

<style>
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at 30% 40%, #0b1223, #05070f 80%);
  color:#eaeaea;
  font-family:system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
}
h1{
  margin:1.2rem 0;
  color:#8cf;
  font-weight:600;
}
.regal{
  width:95%;
  max-width:900px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1.4rem;
  padding:2.2rem;
}
.buch{
  position:relative;
  height:160px;
  background:linear-gradient(90deg,#182545,#0e162e);
  border-radius:12px;
  border:1px solid rgba(130,170,255,.25);
  box-shadow:0 10px 25px rgba(0,0,0,.55);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  user-select:none;
  touch-action:none;
}
.buch span{font-weight:600;}
.icons{margin-top:8px;font-size:1.4rem;}
.ring{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  opacity:0;
}
.buch.fixating .ring{opacity:1;}
.ring svg{width:72px;height:72px;}
.ring circle{fill:none;stroke-width:6;}
.ring .bg{stroke:rgba(255,255,255,.18);}
.ring .fg{
  stroke:#7fd7ff;
  stroke-linecap:round;
  stroke-dasharray:176;
  stroke-dashoffset:176;
}
#gazeDot{
  position:fixed;
  width:14px;
  height:14px;
  border-radius:50%;
  background:rgba(140,220,255,.95);
  box-shadow:0 0 14px rgba(140,220,255,.9);
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:9999;
}
</style>
</head>

<body>
<h1>📚 Bibliothek der Anfänge</h1>
<div class="regal">
  <div class="buch" data-link="vorhof.html"><span>Vorhof zu Aurion</span><div class="icons">📖 📖</div><div class="ring"><svg><circle class="bg" cx="36" cy="36" r="28"/><circle class="fg" cx="36" cy="36" r="28"/></svg></div></div>
  <div class="buch" data-link="selbstreflexion.html"><span>Selbstreflexion</span><div class="icons">😊 😌</div><div class="ring"><svg><circle class="bg" cx="36" cy="36" r="28"/><circle class="fg" cx="36" cy="36" r="28"/></svg></div></div>
  <div class="buch" data-link="sternenuebung1.html"><span>Sternenübung</span><div class="icons">📖 📖</div><div class="ring"><svg><circle class="bg" cx="36" cy="36" r="28"/><circle class="fg" cx="36" cy="36" r="28"/></svg></div></div>
  <div class="buch" data-link="aurion_bibl.html"><span>Aurion</span><div class="icons">🌟 😎</div><div class="ring"><svg><circle class="bg" cx="36" cy="36" r="28"/><circle class="fg" cx="36" cy="36" r="28"/></svg></div></div>
  <div class="buch" data-link="a_v.html"><span>Vom Planschbecken ins Meer</span><div class="icons">😨 😔</div><div class="ring"><svg><circle class="bg" cx="36" cy="36" r="28"/><circle class="fg" cx="36" cy="36" r="28"/></svg></div></div>
</div>

<div id="gazeDot"></div>

<script>
/* ---------------- Kalibrierungsprüfung ---------------- */
const calibration = JSON.parse(localStorage.getItem("eyeCalibrationData") || "[]");
const REQUIRED_POINTS = 9; // 3x3 Kalibrierung
if(calibration.length<REQUIRED_POINTS){
  alert("Bitte zuerst die Augen-Kalibrierung durchführen!");
  location.href="kalibrierung.html";
}

/* ---------------- Touch / Maus Fixation ---------------- */
const books=[...document.querySelectorAll(".buch")];
const FIX_TIME=1500;
let activeBook=null,startTime=null;

books.forEach(book=>{
  const ring=book.querySelector(".fg");
  book.addEventListener("pointerdown",e=>{
    e.preventDefault(); activate(book); startTime=performance.now(); animate();
  });
  book.addEventListener("pointerup",reset);
  book.addEventListener("pointerleave",reset);
  function animate(){
    if(activeBook!==book) return;
    const progress=Math.min(1,(performance.now()-startTime)/FIX_TIME);
    ring.style.strokeDashoffset=176-progress*176;
    if(progress>=1) location.href=book.dataset.link;
    else requestAnimationFrame(animate);
  }
});
function activate(book){reset(); activeBook=book; book.classList.add("fixating");}
function reset(){if(activeBook){activeBook.classList.remove("fixating"); activeBook.querySelector(".fg").style.strokeDashoffset=176;} activeBook=null;}

/* ---------------- Dot & Atmung ---------------- */
const gazeDot=document.getElementById("gazeDot");
let breathPhase=0, breathTimer=0;
function animateDot(now){
  const BREATH_SPEEDS=[4000,4000,6000];
  const BREATH_AMPLITUDES=[6,2,8];
  breathTimer+=16;
  if(breathTimer>BREATH_SPEEDS[breathPhase]){
    breathTimer=0;
    breathPhase=(breathPhase+1)%3;
  }
  const t=breathTimer/BREATH_SPEEDS[breathPhase];
  let offset=0;
  if(breathPhase===0) offset=BREATH_AMPLITUDES[0]*Math.sin(Math.PI*t);
  if(breathPhase===1) offset=BREATH_AMPLITUDES[1]*Math.sin(Math.PI*t);
  if(breathPhase===2) offset=-BREATH_AMPLITUDES[2]*Math.sin(Math.PI*t);
  gazeDot.style.left=innerWidth/2+offset+"px";
  gazeDot.style.top=innerHeight/2+"px";
  requestAnimationFrame(animateDot);
}
requestAnimationFrame(animateDot);

/* ---------------- WebGazer für Desktop ---------------- */
if(window.innerWidth>768){
  webgazer.setRegression("ridge").setGazeListener(data=>{
    if(!data) return;
    gazeDot.style.display="block";
    gazeDot.style.left=data.x+"px";
    gazeDot.style.top=data.y+"px";
    const el=document.elementFromPoint(data.x,data.y);
    const book=el?.closest(".buch");
    if(book){
      if(activeBook!==book){reset();activate(book); startTime=performance.now(); animate();}
      const progress=Math.min(1,(performance.now()-startTime)/FIX_TIME);
      book.querySelector(".fg").style.strokeDashoffset=176-progress*176;
      if(progress>=1) location.href=book.dataset.link;
    } else {reset();}
  }).begin().showVideo(false).showPredictionPoints(false);
}
</script>
</body>
</html>
