<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>📚 Bibliothek der Anfänge</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

<style>
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at 30% 40%, #0b1223, #05070f 80%);
  color:#eaeaea;
  font-family:system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
}

h1{margin:1rem 0;color:#8cf;font-weight:600;}

.regal{
  width:95%;
  max-width:900px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1.4rem;
  padding:2rem;
}

.buch{
  position:relative;
  height:160px;
  background:linear-gradient(90deg,#182545,#0e162e);
  border-radius:12px;
  border:1px solid rgba(130,170,255,.25);
  box-shadow:0 10px 25px rgba(0,0,0,.55);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  user-select:none;
  touch-action:none;
}

.icons{margin-top:8px;font-size:1.4rem;}

.ring{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  opacity:0;
}

.buch.fixating .ring{opacity:1;}

.ring svg{width:72px;height:72px;}
circle{fill:none;stroke-width:6;}
.bg{stroke:rgba(255,255,255,.15);}
.fg{
  stroke:#7fd7ff;
  stroke-linecap:round;
  stroke-dasharray:176;
  stroke-dashoffset:176;
}

/* DOT */
#dot{
  position:fixed;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#7fd7ff;
  box-shadow:0 0 12px rgba(127,215,255,.9);
  pointer-events:none;
  z-index:9999;
}
</style>
</head>

<body>

<h1>📚 Bibliothek der Anfänge</h1>

<div class="regal">
  <div class="buch" data-link="vorhof.html">
    <span>Vorhof zu Aurion</span>
    <div class="icons">📖 📖</div>
    <div class="ring"><svg><circle class="bg" cx="36" cy="36" r="28"/><circle class="fg" cx="36" cy="36" r="28"/></svg></div>
  </div>

  <div class="buch" data-link="a_v.html">
    <span>Vom Planschbecken ins Meer</span>
    <div class="icons">😨 😔</div>
    <div class="ring"><svg><circle class="bg" cx="36" cy="36" r="28"/><circle class="fg" cx="36" cy="36" r="28"/></svg></div>
  </div>

  <div class="buch" data-link="selbstreflexion.html">
    <span>Selbstreflexion</span>
    <div class="icons">😊 😌</div>
    <div class="ring"><svg><circle class="bg" cx="36" cy="36" r="28"/><circle class="fg" cx="36" cy="36" r="28"/></svg></div>
  </div>
</div>

<div id="dot"></div>

<script>
/* ===============================
   KALIBRIERUNGSPRÜFUNG
=============================== */
if(localStorage.getItem("eyeCalibration")!=="ok"){
  location.replace("kalibrierung.html");
}

/* ===============================
   ATEM-DOT (4–4–6)
=============================== */
const dot=document.getElementById("dot");
let t0=performance.now();
function breathe(t){
  const dt=(t-t0)/1000;
  const phase=dt%14;
  let r=1;
  if(phase<4) r=1+phase*0.08;
  else if(phase<8) r=1.32;
  else r=1.32-(phase-8)*0.05;
  dot.style.transform=`translate(-50%,-50%) scale(${r})`;
  requestAnimationFrame(breathe);
}
dot.style.left="50%";
dot.style.top="50%";
requestAnimationFrame(breathe);

/* ===============================
   FIXATION (TOUCH + BLICK)
=============================== */
const FIX_TIME=1400;
let active=null,start=null;

document.querySelectorAll(".buch").forEach(book=>{
  const ring=book.querySelector(".fg");

  function begin(){
    active=book;
    start=performance.now();
    book.classList.add("fixating");
    tick();
  }

  function tick(){
    if(active!==book) return;
    const p=Math.min(1,(performance.now()-start)/FIX_TIME);
    ring.style.strokeDashoffset=176-p*176;
    if(p>=1) location.href=book.dataset.link;
    else requestAnimationFrame(tick);
  }

  function reset(){
    book.classList.remove("fixating");
    ring.style.strokeDashoffset=176;
    active=null;
  }

  book.addEventListener("pointerdown",begin);
  book.addEventListener("pointerup",reset);
  book.addEventListener("pointerleave",reset);
});

/* ===============================
   WEBGAZER (NUR DESKTOP)
=============================== */
if(innerWidth>768){
  webgazer
    .setRegression("ridge")
    .showVideo(false)
    .setGazeListener(d=>{
      if(!d) return;
      dot.style.left=d.x+"px";
      dot.style.top=d.y+"px";
      const el=document.elementFromPoint(d.x,d.y)?.closest(".buch");
      if(el && el!==active){
        document.querySelectorAll(".buch").forEach(b=>{
          b.classList.remove("fixating");
          b.querySelector(".fg").style.strokeDashoffset=176;
        });
        active=el;
        start=performance.now();
        el.classList.add("fixating");
      }
    }).begin();
}
</script>

</body>
</html>
