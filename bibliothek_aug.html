<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📚 Bibliothek der Anfänge – Augenblicke</title>

<style>
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at 30% 40%, #0b1223, #05070f 80%);
  color:#eaeaea;
  font-family:system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
}

h1{margin:1rem;color:#8cf}

/* ===== REGAL ===== */
.regal{
  width:95%;
  max-width:900px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1.4rem;
  padding:2rem;
}

.buch{
  position:relative;
  height:160px;
  background:linear-gradient(90deg,#182545,#0e162e);
  border-radius:12px;
  border:1px solid rgba(130,170,255,.25);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.icons{margin-top:8px;font-size:1.4rem}

/* ===== FIXATIONSRING ===== */
.ring{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  opacity:0;
}
.buch.fixating .ring{opacity:1}

.ring svg{width:70px;height:70px}
circle{
  fill:none;
  stroke-width:6;
}
.bg{stroke:rgba(255,255,255,.15)}
.fg{
  stroke:#7fd7ff;
  stroke-linecap:round;
  stroke-dasharray:176;
  stroke-dashoffset:176;
}

/* ===== SYSTEM DOT ===== */
#systemDot{
  position:fixed;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#555;
  box-shadow:0 0 10px rgba(255,255,255,.2);
  transform:translate(-50%,-50%);
  pointer-events:none;
  transition:background .4s, box-shadow .4s;
  z-index:1000;
}

/* ===== ATMUNG ===== */
#breath{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:60px;
  height:60px;
  border-radius:50%;
  border:3px solid #446;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  opacity:.8;
}
</style>
</head>

<body>

<h1>📚 Bibliothek der Anfänge</h1>

<div class="regal">
  <div class="buch" data-link="a_v.html">
    <span>Vom Planschbecken ins Meer</span>
    <div class="icons">😨 😔</div>
    <div class="ring"><svg>
      <circle class="bg" cx="35" cy="35" r="28"/>
      <circle class="fg" cx="35" cy="35" r="28"/>
    </svg></div>
  </div>

  <div class="buch" data-link="buch2_intuition.html">
    <span>Intuition oder Einbildung?</span>
    <div class="icons">❓ 😏</div>
    <div class="ring"><svg>
      <circle class="bg" cx="35" cy="35" r="28"/>
      <circle class="fg" cx="35" cy="35" r="28"/>
    </svg></div>
  </div>

  <div class="buch" data-link="selbstreflexion.html">
    <span>Selbstreflexion</span>
    <div class="icons">😊 😌</div>
    <div class="ring"><svg>
      <circle class="bg" cx="35" cy="35" r="28"/>
      <circle class="fg" cx="35" cy="35" r="28"/>
    </svg></div>
  </div>
</div>

<div id="systemDot"></div>
<div id="breath">4-4-6</div>

<script>
/* ===== SYSTEM DOT – FREI FÜHREND ===== */
let dot = {x:innerWidth/2,y:innerHeight/2, tx:null, ty:null};
const systemDot=document.getElementById("systemDot");

/* langsame autonome Drift */
setInterval(()=>{
  if(dot.tx===null){
    dot.tx=Math.random()*innerWidth;
    dot.ty=Math.random()*innerHeight;
  }
  dot.x+=(dot.tx-dot.x)*0.005;
  dot.y+=(dot.ty-dot.y)*0.005;
  if(Math.hypot(dot.tx-dot.x,dot.ty-dot.y)<20){
    dot.tx=null; dot.ty=null;
  }
  systemDot.style.left=dot.x+"px";
  systemDot.style.top =dot.y+"px";
},16);

/* ===== ATMUNG 4-4-6 ===== */
let phase=0, t=0;
let coherent=false;

setInterval(()=>{
  t+=1;
  if(phase===0 && t>=4){phase=1;t=0;}
  if(phase===1 && t>=4){phase=2;t=0;}
  if(phase===2 && t>=6){phase=0;t=0;}

  coherent = (phase!==1); // halten + ausatmen ruhig
  systemDot.style.background = coherent ? "#4f4" : "#555";
  systemDot.style.boxShadow = coherent
    ? "0 0 18px rgba(100,255,180,.9)"
    : "0 0 10px rgba(255,255,255,.2)";
},1000);

/* ===== FIXATION ===== */
const books=[...document.querySelectorAll(".buch")];
const FIX_TIME=1600;

setInterval(()=>{
  books.forEach(b=>{
    const r=b.getBoundingClientRect();
    const inside=
      dot.x>r.left && dot.x<r.right &&
      dot.y>r.top && dot.y<r.bottom;

    const ring=b.querySelector(".fg");
    b.progress=b.progress||0;

    if(inside && coherent){
      b.progress+=50;
      b.classList.add("fixating");
    }else{
      b.progress=Math.max(0,b.progress-80);
      b.classList.remove("fixating");
    }

    ring.style.strokeDashoffset=176-(b.progress/FIX_TIME)*176;

    if(b.progress>=FIX_TIME){
      location.href=b.dataset.link;
    }
  });
},50);
</script>

</body>
</html>
