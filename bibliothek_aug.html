<script>
// --- Konfiguration ---
const books = document.querySelectorAll(".buch");
const gazeDot = document.getElementById("gazeDot");
let gazeX = window.innerWidth/2, gazeY = window.innerHeight/2;
let mouseX = gazeX, mouseY = gazeY;
const smoothFactor = 0.12;
const FIXATION_TIME = 1500; // ms
const STEP = 30;
let gazeHistory = [];

// Mausbewegung erfassen
window.addEventListener('mousemove', e=>{
    mouseX = e.clientX;
    mouseY = e.clientY;
});

// Fortschritt pro Buch
books.forEach(book=>{
  book.progress = book.querySelector(".progress");
  book.value = 0;
});

// WebGazer starten
webgazer.setRegression('ridge').setGazeListener(data=>{
  if(!data || !data.x || !data.y) return;

  gazeHistory.push({x:data.x, y:data.y});
  if(gazeHistory.length>5) gazeHistory.shift();

  const avg = gazeHistory.reduce((acc,v)=>({x:acc.x+v.x, y:acc.y+v.y}), {x:0,y:0});
  const count = gazeHistory.length;

  const gazeTargetX = (avg.x/count);
  const gazeTargetY = (avg.y/count);

  // Kombination Maus + Gaze: 50% Einfluss
  const targetX = 0.5*gazeTargetX + 0.5*mouseX;
  const targetY = 0.5*gazeTargetY + 0.5*mouseY;

  gazeX += (targetX - gazeX) * smoothFactor;
  gazeY += (targetY - gazeY) * smoothFactor;

  gazeDot.style.left = (gazeX-9)+'px';
  gazeDot.style.top = (gazeY-9)+'px';

  // Fixation
  books.forEach(book=>{
    const r = book.getBoundingClientRect();
    const inside = gazeX>r.left && gazeX<r.right && gazeY>r.top && gazeY<r.bottom;
    if(inside) book.value += STEP/FIXATION_TIME*100;
    else book.value -= STEP/FIXATION_TIME*60;
    book.value=Math.max(0,Math.min(100,book.value));
    book.progress.style.width = book.value+'%';
    if(book.value>=100) window.location.href=book.dataset.link;
  });

}).begin();

webgazer.showVideo(false);
webgazer.showPredictionPoints(false);
window.addEventListener("beforeunload", ()=>webgazer.end());
</script>
