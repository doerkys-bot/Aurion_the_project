<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Bibliothek der Anfänge – Augenblicke</title>
<style>
body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,sans-serif;
  background:radial-gradient(circle at 30% 40%, #0b1223, #05070f 80%);
  color:#eaeaea;
  display:flex;
  flex-direction:column;
  align-items:center;
}
h1{
  margin:1rem 0;
  color:#8cf;
  text-shadow:0 0 12px #68bfff;
}
.bibliothek{
  display:flex;
  flex-wrap:wrap;
  gap:1rem;
  justify-content:center;
  max-width:900px;
}
.buch{
  position:relative;
  width:180px;
  height:160px;
  background:linear-gradient(90deg,#182545,#0e162e);
  border-radius:10px;
  border:1px solid rgba(130,170,255,.25);
  box-shadow:0 6px 18px rgba(0,0,0,.6);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.buch span{font-size:1rem;}
.icons{margin-top:6px;font-size:1.3rem;opacity:.8;}
.ring{
  position:absolute;
  inset:-6px;
  border-radius:50%;
  border:3px solid rgba(0,255,150,0);
  pointer-events:none;
}
#status{
  margin:0.6rem;
  font-size:.8rem;
  opacity:.7;
}
#quality{
  width:120px;
  height:6px;
  background:#333;
  border-radius:4px;
  overflow:hidden;
  margin-bottom:0.5rem;
}
#quality span{
  display:block;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff4,#4f4);
  transition:width .3s;
}
#systemDot{
  position:fixed;
  width:16px;
  height:16px;
  border-radius:50%;
  background:green;
  pointer-events:none;
  box-shadow:0 0 12px green;
  transform:translate(-50%,-50%);
  z-index:1000;
}
#breathingBar{
  width:100px;
  height:10px;
  background:#222;
  border-radius:5px;
  overflow:hidden;
  margin-bottom:1rem;
}
#breathingBar span{
  display:block;
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#4ff,#44f);
  transition:width 0.1s linear;
}
</style>
</head>
<body>

<h1>📚 Bibliothek der Anfänge</h1>
<div id="status">System-Dot initialisiert…</div>
<div id="breathingBar"><span></span></div>
<div id="quality"><span></span></div>
<div class="bibliothek" id="bibliothek"></div>
<div id="systemDot"></div>

<footer>© Aurion – Die Bibliothek klickt nicht zurück</footer>

<script>
// ----------- Konfiguration -----------
const BOOKS = [
  {title:"Vom Planschbecken ins Meer", link:"a_v.html", icons:"😨 😔"},
  {title:"Intuition oder Einbildung?", link:"buch2_intuition.html", icons:"❓ 😏"},
  {title:"Selbstreflexion", link:"selbstreflexion.html", icons:"😊 😌"},
  {title:"Sternenübung", link:"sternenuebung1.html", icons:"📖 📖"},
  {title:"Aurion", link:"aurion_bibl.html", icons:"🌟 😎"},
  {title:"Vorhof zu Aurion", link:"vorhof.html", icons:"📖 📖"}
];
const FIX_TIME = 1600; // ms für Fixationsring
const STEP = 30;       // Update Intervall

// ----------- Elemente -----------
const lib = document.getElementById("bibliothek");
const systemDot = document.getElementById("systemDot");
const breathingBar = document.querySelector("#breathingBar span");
const status = document.getElementById("status");

let books=[];
let dot={x:window.innerWidth/2,y:window.innerHeight/2};
let target={x:dot.x,y:dot.y};
let breathingPhase=0; // 0=Ein,1=Halten,2=Aus
let breathTime=0;
let breathValue=0;

// ----------- Bücher erstellen -----------
BOOKS.forEach(b=>{
  const el=document.createElement("div");
  el.className="buch";
  el.innerHTML=`<span>${b.title}</span><div class="icons">${b.icons}</div><div class="ring"></div>`;
  el.link=b.link;
  el.progress=0;
  lib.appendChild(el);
  books.push(el);
});

// ----------- Atmung simulieren (4-4-6) -----------
function updateBreathing(dt){
  const phaseTimes=[4000,4000,6000]; // ms
  breathTime += dt;
  if(breathTime>phaseTimes[breathingPhase]){
    breathTime -= phaseTimes[breathingPhase];
    breathingPhase=(breathingPhase+1)%3;
  }
  let value=0;
  if(breathingPhase===0) value = breathTime/phaseTimes[0]; // Ein
  if(breathingPhase===1) value = 1; // Halten
  if(breathingPhase===2) value = 1 - (breathTime/phaseTimes[2]); // Aus
  breathValue=value;
  breathingBar.style.width = (value*100)+"%";
}

// ----------- System-Dot-Bewegung -----------
function updateDot(dt){
  const dx = target.x - dot.x;
  const dy = target.y - dot.y;
  const dist = Math.sqrt(dx*dx+dy*dy);
  const speed = dist/1600*dt; // 1.6s für komplette Bewegung
  if(dist>1){
    dot.x += dx/dist*speed;
    dot.y += dy/dist*speed;
  }
  systemDot.style.left=dot.x+"px";
  systemDot.style.top=dot.y+"px";
  // Farbänderung bei korrekter Atmung
  if(breathValue>0.95) systemDot.style.background="lime";
  else systemDot.style.background="green";
}

// ----------- Hauptlogik Fixation -----------
function update(dt){
  updateBreathing(dt);
  updateDot(dt);

  books.forEach(b=>{
    const r=b.getBoundingClientRect();
    let inside = dot.x>r.left && dot.x<r.right && dot.y>r.top && dot.y<r.bottom;
    if(inside && breathValue>0.95){
      b.progress += STEP;
      b.querySelector(".ring").style.borderColor=`rgba(0,255,150,${b.progress/FIX_TIME})`;
      if(b.progress>=FIX_TIME){
        localStorage.setItem("lastBook",b.link);
        location.href=b.link;
      }
    } else {
      b.progress=Math.max(0,b.progress-STEP);
      b.querySelector(".ring").style.borderColor=`rgba(0,255,150,${b.progress/FIX_TIME})`;
    }
  });
}

// ----------- Maus-Backup -----------
books.forEach(b=>{
  b.addEventListener("mouseenter",()=>{target.x=b.getBoundingClientRect().left+b.offsetWidth/2;target.y=b.getBoundingClientRect().top+b.offsetHeight/2;});
  b.addEventListener("mouseleave",()=>{target.x=dot.x; target.y=dot.y;});
  b.addEventListener("click",()=>location.href=b.link);
});

// ----------- Loop -----------
let lastTime=performance.now();
function loop(){
  const now=performance.now();
  const dt=now-lastTime;
  lastTime=now;
  update(dt);
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
