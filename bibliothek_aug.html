<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Bibliothek der Anfänge – Augenblicke</title>

<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

<style>
body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,sans-serif;
  background:radial-gradient(circle at 30% 40%, #0b1223, #05070f 80%);
  color:#eaeaea;
  display:flex;
  flex-direction:column;
  align-items:center;
}
h1{
  margin:1rem 0;
  color:#8cf;
  text-shadow:0 0 12px #68bfff;
}
.bibliothek{
  display:flex;
  flex-wrap:wrap;
  gap:1rem;
  justify-content:center;
  max-width:900px;
}
.buch{
  position:relative;
  width:180px;
  height:160px;
  background:linear-gradient(90deg,#182545,#0e162e);
  border-radius:10px;
  border:1px solid rgba(130,170,255,.25);
  box-shadow:0 6px 18px rgba(0,0,0,.6);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.buch span{font-size:1rem;}
.icons{margin-top:6px;font-size:1.3rem;opacity:.8;}

.ring{
  position:absolute;
  inset:-6px;
  border-radius:50%;
  border:3px solid rgba(0,255,150,0);
  pointer-events:none;
}

.buch.active .ring{
  border-color:rgba(0,255,150,.8);
}

#status{
  margin:0.6rem;
  font-size:.8rem;
  opacity:.7;
}
#quality{
  width:120px;
  height:6px;
  background:#333;
  border-radius:4px;
  overflow:hidden;
}
#quality span{
  display:block;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff4,#4f4);
  transition:width .3s;
}
footer{
  margin:1rem;
  font-size:.8rem;
  opacity:.6;
}
</style>
</head>

<body>

<h1>📚 Bibliothek der Anfänge</h1>
<div id="status">WebGazer initialisiert…</div>
<div id="quality"><span></span></div>

<div class="bibliothek" id="bibliothek"></div>

<footer>© Aurion – Die Bibliothek klickt nicht zurück</footer>

<script>
const BOOKS = [
  {title:"Vom Planschbecken ins Meer", link:"a_v.html", icons:"😨 😔"},
  {title:"Intuition oder Einbildung?", link:"buch2_intuition.html", icons:"❓ 😏"},
  {title:"Selbstreflexion", link:"selbstreflexion.html", icons:"😊 😌"},
  {title:"Sternenübung", link:"sternenuebung1.html", icons:"📖 📖"},
  {title:"Aurion", link:"aurion_bibl.html", icons:"🌟 😎"},
  {title:"Vorhof zu Aurion", link:"vorhof.html", icons:"📖 📖"}
];

const FIX_TIME = 1500;   // ms – bewusst kurz & ruhig
const STEP = 50;

const lib = document.getElementById("bibliothek");
const qualityBar = document.querySelector("#quality span");
const status = document.getElementById("status");

let books = [];
let gaze = {x:null,y:null,quality:0};

BOOKS.forEach(b=>{
  const el=document.createElement("div");
  el.className="buch";
  el.innerHTML=`
    <span>${b.title}</span>
    <div class="icons">${b.icons}</div>
    <div class="ring"></div>
  `;
  el.link=b.link;
  el.progress=0;
  el.active=false;
  lib.appendChild(el);
  books.push(el);

  // Maus-Fallback
  el.addEventListener("mouseenter",()=>el.active=true);
  el.addEventListener("mouseleave",()=>el.active=false);
  el.addEventListener("click",()=>location.href=el.link);
});

// ---- WebGazer ----
webgazer
  .setGazeListener((data,ts)=>{
    if(!data) return;
    gaze.x=data.x;
    gaze.y=data.y;

    // einfache Qualitätsabschätzung
    gaze.quality=Math.min(100,Math.max(0,
      100-Math.abs(data.x-window.innerWidth/2)/5
    ));
    qualityBar.style.width=gaze.quality+"%";
  })
  .begin();

status.textContent="👁️ Blick aktiv – Maus jederzeit möglich";

function update(){
  books.forEach(b=>{
    const r=b.getBoundingClientRect();
    let inside=false;

    if(gaze.x && gaze.y){
      inside=
        gaze.x>r.left && gaze.x<r.right &&
        gaze.y>r.top  && gaze.y<r.bottom;
    }

    if(inside || b.active){
      b.progress+=STEP;
      b.classList.add("active");
    }else{
      b.progress-=STEP*0.8;
      b.classList.remove("active");
    }

    b.progress=Math.max(0,Math.min(FIX_TIME,b.progress));
    b.querySelector(".ring").style.borderColor=
      `rgba(0,255,150,${b.progress/FIX_TIME})`;

    if(b.progress>=FIX_TIME){
      localStorage.setItem("lastBook",b.link);
      location.href=b.link;
    }
  });
}

setInterval(update,STEP);
</script>

</body>
</html>
