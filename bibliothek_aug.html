<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Augenblick-Kalibrierung</title>
<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>
<style>
body{
  margin:0;
  font-family: system-ui, sans-serif;
  background:#0b1223;
  color:#eaeaea;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}
h1{color:#8cf;text-align:center;margin:1rem;}

.calibration-point{
  width:40px;
  height:40px;
  border-radius:50%;
  background:rgba(0,200,255,0.5);
  position:absolute;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:bold;
  user-select:none;
}

#progressRing{
  width:60px;
  height:60px;
  border:4px solid rgba(0,200,255,0.6);
  border-radius:50%;
  position:absolute;
  pointer-events:none; /* Ring blockiert keine Klicks */
}

#webgazerVideoFeed{
  position: fixed !important;
  top: 10px;
  right: 10px;
  width: 120px !important;
  height: 90px !important;
  z-index: 9999 !important;
  border: 2px solid #7fd7ff;
  border-radius: 8px;
}

#status{
  position: fixed;
  top: 10px;
  left: 10px;
  color: #7fd7ff;
  font-family: monospace;
  background: rgba(0,0,0,0.6);
  padding: 6px 10px;
  border-radius: 6px;
}
</style>
</head>
<body>

<h1>Kalibriere deine Augen</h1>
<div id="status">Fortschritt: 0 / 9 Punkte</div>

<script>
const POINTS = 9;
let clickedPoints = 0;

// WebGazer Setup
webgazer.setRegression('ridge')
  .setGazeListener((data, elapsedTime) => {
    // hier kann man Gaze-Daten nutzen, falls nötig
  }).begin();

webgazer.showVideo(true);
webgazer.showPredictionPoints(false);

// Kalibrierungspunkte generieren
const positions = [
  [10,10],[50,10],[90,10],
  [10,50],[50,50],[90,50],
  [10,90],[50,90],[90,90]
]; // in Prozent
const bodyWidth = window.innerWidth;
const bodyHeight = window.innerHeight;

positions.forEach((pos,i)=>{
  const point = document.createElement('div');
  point.className='calibration-point';
  point.style.left = `calc(${pos[0]}% - 20px)`;
  point.style.top = `calc(${pos[1]}% - 20px)`;
  point.textContent=i+1;
  document.body.appendChild(point);

  const progress = document.createElement('div');
  progress.id='progressRing';
  point.appendChild(progress);

  point.addEventListener('click', ()=>{
    point.style.background='rgba(0,200,255,1)';
    clickedPoints++;
    document.getElementById('status').textContent=`Fortschritt: ${clickedPoints} / 9 Punkte`;
    if(clickedPoints===POINTS){
      alert('Kalibrierung abgeschlossen!'); 
      // Hier kann man weiterleiten z.B. window.location.href='bibliothek.html';
    }
  });
});

</script>
</body>
</html>
