<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Augenblick-Kalibrierung</title>
<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>
<style>
body{
  margin:0;
  font-family: system-ui, sans-serif;
  background:#0b1223;
  color:#eaeaea;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
}
h1{color:#8cf;text-align:center;margin:1rem;}

.calibration-point{
  width:50px;
  height:50px;
  border-radius:50%;
  background:rgba(0,200,255,0.5);
  position:absolute;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:bold;
  user-select:none;
  transition: background 0.3s;
}

.progressRing{
  width:60px;
  height:60px;
  border:4px solid rgba(0,200,255,0.6);
  border-radius:50%;
  position:absolute;
  pointer-events:none; 
  box-sizing:border-box;
  transform: rotate(-90deg);
  overflow:hidden;
}

.progressFill{
  width:100%;
  height:100%;
  border-radius:50%;
  clip: rect(0px,60px,60px,30px);
  position:absolute;
}

.progressFill .fill{
  width:100%;
  height:100%;
  border:4px solid #7fd7ff;
  border-radius:50%;
  position:absolute;
  clip: rect(0px,30px,60px,0px);
  transform: rotate(0deg);
  transform-origin: center;
  transition: transform 0.5s linear;
}

#webgazerVideoFeed{
  position: fixed !important;
  top: 10px;
  right: 10px;
  width: 120px !important;
  height: 90px !important;
  z-index: 9999 !important;
  border: 2px solid #7fd7ff;
  border-radius: 8px;
}

#status{
  position: fixed;
  top: 10px;
  left: 10px;
  color: #7fd7ff;
  font-family: monospace;
  background: rgba(0,0,0,0.6);
  padding: 6px 10px;
  border-radius: 6px;
}
</style>
</head>
<body>

<h1>Kalibriere deine Augen</h1>
<div id="status">Fortschritt: 0 / 9 Punkte</div>

<script>
const POINTS = 9;
let clickedPoints = 0;

// WebGazer Setup
webgazer.setRegression('ridge')
  .setGazeListener((data, elapsedTime) => {
    // Gaze-Daten können genutzt werden
  }).begin();

webgazer.showVideo(true);
webgazer.showPredictionPoints(false);

// Kalibrierungspunkte generieren (etwas nach innen verschoben: 10%→15%, 50%→50%, 90%→85%)
const positions = [
  [15,15],[50,15],[85,15],
  [15,50],[50,50],[85,50],
  [15,85],[50,85],[85,85]
];

positions.forEach((pos,i)=>{
  const point = document.createElement('div');
  point.className='calibration-point';
  point.style.left = `calc(${pos[0]}% - 25px)`; // -Radius/2
  point.style.top = `calc(${pos[1]}% - 25px)`;
  point.textContent=i+1;

  // Fortschrittsring
  const ring = document.createElement('div');
  ring.className='progressRing';
  const fill = document.createElement('div');
  fill.className='progressFill';
  const innerFill = document.createElement('div');
  innerFill.className='fill';
  fill.appendChild(innerFill);
  ring.appendChild(fill);
  point.appendChild(ring);

  document.body.appendChild(point);

  point.addEventListener('click', ()=>{
    point.style.background='rgba(0,200,255,1)';
    clickedPoints++;
    document.getElementById('status').textContent=`Fortschritt: ${clickedPoints} / 9 Punkte`;

    // Ring-Füllung animieren
    innerFill.style.transform = 'rotate(180deg)';
    setTimeout(()=>{ innerFill.style.transform='rotate(360deg)'; }, 500);

    if(clickedPoints===POINTS){
      alert('Kalibrierung abgeschlossen!');
      // window.location.href='bibliothek.html';
    }
  });
});
</script>
</body>
</html>
