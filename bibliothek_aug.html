<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Bibliothek der Anfänge</title>

<style>
/* ====== GRUND ====== */
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at 30% 40%, #0b1223, #05070f 80%);
  color:#eaeaea;
  font-family:system-ui,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
}

h1{
  margin:1rem 0;
  color:#8cf;
  text-shadow:0 0 12px #68bfff;
}

/* ====== BIBLIOTHEK ====== */
.bibliothek{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:1.4rem;
  max-width:900px;
  width:95%;
}

.buch{
  position:relative;
  height:160px;
  background:linear-gradient(90deg,#182545,#0e162e);
  border-radius:12px;
  border:1px solid rgba(130,170,255,.25);
  box-shadow:0 10px 25px rgba(0,0,0,.6);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.icons{
  margin-top:8px;
  font-size:1.4rem;
  opacity:.85;
}

/* ====== FIXATIONSRING ====== */
.ring{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  opacity:0;
}

.buch.fixating .ring{opacity:1;}

svg{width:72px;height:72px;}

circle.bg{
  fill:none;
  stroke:rgba(255,255,255,.15);
  stroke-width:6;
}

circle.fg{
  fill:none;
  stroke:#7fd7ff;
  stroke-width:6;
  stroke-linecap:round;
  stroke-dasharray:176;
  stroke-dashoffset:176;
}

/* ====== SYSTEM DOT ====== */
#systemDot{
  position:fixed;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#4fbfff;
  box-shadow:0 0 18px rgba(120,200,255,.9);
  transform:translate(-50%,-50%);
  pointer-events:none;
  transition:background .4s, box-shadow .4s;
}

/* ====== ATMUNG ====== */
#breath{
  position:fixed;
  bottom:18px;
  font-size:.85rem;
  opacity:.7;
}
</style>
</head>

<body>

<h1>📚 Bibliothek der Anfänge</h1>

<div class="bibliothek">
  <div class="buch" data-link="v_p_i_m.html">
    <span>Vom Planschbecken ins Meer</span>
    <div class="icons">😨 😔</div>
    <div class="ring">
      <svg><circle class="bg" cx="36" cy="36" r="28"/><circle class="fg" cx="36" cy="36" r="28"/></svg>
    </div>
  </div>

  <div class="buch" data-link="buch2_intuition.html">
    <span>Intuition oder Einbildung?</span>
    <div class="icons">❓ 😏</div>
    <div class="ring"><svg><circle class="bg" cx="36" cy="36" r="28"/><circle class="fg" cx="36" cy="36" r="28"/></svg></div>
  </div>

  <div class="buch" data-link="selbstreflexion.html">
    <span>Selbstreflexion</span>
    <div class="icons">😊 😌</div>
    <div class="ring"><svg><circle class="bg" cx="36" cy="36" r="28"/><circle class="fg" cx="36" cy="36" r="28"/></svg></div>
  </div>

  <div class="buch" data-link="sternenuebung.html">
    <span>Sternenübung</span>
    <div class="icons">📖 📖</div>
    <div class="ring"><svg><circle class="bg" cx="36" cy="36" r="28"/><circle class="fg" cx="36" cy="36" r="28"/></svg></div>
  </div>

  <div class="buch" data-link="aurion_bibl.html">
    <span>Aurion</span>
    <div class="icons">🌟 😎</div>
    <div class="ring"><svg><circle class="bg" cx="36" cy="36" r="28"/><circle class="fg" cx="36" cy="36" r="28"/></svg></div>
  </div>

  <div class="buch" data-link="a_v.html">
    <span>Vorhof zu Aurion</span>
    <div class="icons">📖 📖</div>
    <div class="ring"><svg><circle class="bg" cx="36" cy="36" r="28"/><circle class="fg" cx="36" cy="36" r="28"/></svg></div>
  </div>
</div>

<div id="systemDot"></div>
<div id="breath">Atmung: 4 – 4 – 6</div>

<script>
/* ====== PARAMETER ====== */
const FIX_TIME = 1600;
const STEP = 16;

/* ====== SYSTEM DOT ====== */
let sys = {x:innerWidth/2, y:innerHeight/2};
let mouse = {x:sys.x, y:sys.y};

addEventListener("mousemove",e=>{
  mouse.x=e.clientX;
  mouse.y=e.clientY;
});

/* ====== ATMUNG ====== */
let breathPhase=0;
setInterval(()=>{
  breathPhase=(breathPhase+1)%14;
},1000);

function calm(){
  return breathPhase>=4 && breathPhase<=9;
}

/* ====== UPDATE ====== */
const dot=document.getElementById("systemDot");
const books=[...document.querySelectorAll(".buch")];

setInterval(()=>{
  // langsame Bewegung (Absicht)
  sys.x+=(mouse.x-sys.x)*0.02;
  sys.y+=(mouse.y-sys.y)*0.02;

  dot.style.left=sys.x+"px";
  dot.style.top=sys.y+"px";

  if(calm()){
    dot.style.background="#6fffd2";
    dot.style.boxShadow="0 0 22px rgba(120,255,220,.9)";
  }else{
    dot.style.background="#4fbfff";
    dot.style.boxShadow="0 0 14px rgba(120,200,255,.6)";
  }

  books.forEach(b=>{
    const r=b.getBoundingClientRect();
    const inside=
      sys.x>r.left && sys.x<r.right &&
      sys.y>r.top && sys.y<r.bottom &&
      mouse.x>r.left && mouse.x<r.right;

    const ring=b.querySelector(".fg");

    b.progress=b.progress||0;

    if(inside && calm()){
      b.classList.add("fixating");
      b.progress+=STEP;
    }else{
      b.classList.remove("fixating");
      b.progress=Math.max(0,b.progress-STEP*2);
    }

    ring.style.strokeDashoffset=176*(1-b.progress/FIX_TIME);

    if(b.progress>=FIX_TIME){
      location.href=b.dataset.link;
    }
  });
},STEP);
</script>

</body>
</html>
