<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gästebuch von Aurion</title>

<style>
body{
  font-family: Georgia, serif;
  background:#0b1223;
  color:#eaeaea;
  display:flex;
  flex-direction:column;
  align-items:center;
  margin:0;
  padding:20px 0 40px 0;
}

h1{
  margin:0 0 16px 0;
}

.buch-container{
  background:rgba(0,0,0,0.6);
  padding:2rem;
  border-radius:12px;
  width:90%;
  max-width:900px;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:4px;
}

input, textarea{
  width:100%;
  margin-top:0.4rem;
  padding:0.8rem;
  background:#111827;
  color:white;
  border-radius:8px;
  border:none;
  outline:none;
  font-size:1rem;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.button-row{
  margin-top:1rem;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  padding:0.7rem 1rem;
  background:#445;
  color:#ccf;
  border:1px solid #88f;
  border-radius:8px;
}

#keyboardArea{
  width:100%;
  margin-top:20px;
  position:relative;
}

.row{
  display:grid;
  gap:6px;
  margin-bottom:6px;
}

.r10{ grid-template-columns:repeat(10,1fr); }
.r9{ grid-template-columns:repeat(9,1fr); }
.r5{ grid-template-columns:1.2fr 1.2fr 1.2fr 2fr 1.5fr; }

.key{
  background:#1a2233;
  border:1px solid #4a5a7a;
  border-radius:10px;
  padding:14px;
  text-align:center;
  font-size:20px;
  user-select:none;
  transition:transform .12s ease, background .12s ease, border-color .12s ease, box-shadow .12s ease;
}

.key.hovered{
  transform:scale(1.18);
  background:#2c3f66;
  border-color:#4cc9f0;
  box-shadow:0 0 18px rgba(76,201,240,.30);
  z-index:2;
}

#eintraege{
  width:90%;
  max-width:900px;
  margin-top:18px;
}

.eintrag{
  background:rgba(255,255,255,0.06);
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
}

#gazeCursor{
  position:fixed;
  width:26px;
  height:26px;
  border:3px solid cyan;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:9999;
  display:none;
}

#statusBottom{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:26px;
  background:black;
  color:#9ae6b4;
  font-family:monospace;
  font-size:13px;
  text-align:center;
  line-height:26px;
}
</style>
</head>

<body>
  <h1>📖 Gästebuch von Aurion</h1>

  <div class="buch-container">
    <label for="name">Name</label>
    <input type="text" id="name">

    <label for="nachricht">Nachricht</label>
    <textarea id="nachricht" rows="5" readonly></textarea>

    <div class="button-row">
      <button type="button" onclick="eintragen()">Eintragen</button>
      <button type="button" id="toggleEyeMode">Augenmodus ein</button>
    </div>

    <div id="keyboardArea">
      <div class="row r10">
        <div class="key selectable" data-value="Q">Q</div>
        <div class="key selectable" data-value="W">W</div>
        <div class="key selectable" data-value="E">E</div>
        <div class="key selectable" data-value="R">R</div>
        <div class="key selectable" data-value="T">T</div>
        <div class="key selectable" data-value="Z">Z</div>
        <div class="key selectable" data-value="U">U</div>
        <div class="key selectable" data-value="I">I</div>
        <div class="key selectable" data-value="O">O</div>
        <div class="key selectable" data-value="P">P</div>
      </div>

      <div class="row r9">
        <div class="key selectable" data-value="A">A</div>
        <div class="key selectable" data-value="S">S</div>
        <div class="key selectable" data-value="D">D</div>
        <div class="key selectable" data-value="F">F</div>
        <div class="key selectable" data-value="G">G</div>
        <div class="key selectable" data-value="H">H</div>
        <div class="key selectable" data-value="J">J</div>
        <div class="key selectable" data-value="K">K</div>
        <div class="key selectable" data-value="L">L</div>
      </div>

      <div class="row r5">
        <div class="key selectable" data-value=".">.</div>
        <div class="key selectable" data-value=",">,</div>
        <div class="key selectable" data-value="?">?</div>
        <div class="key selectable" data-value="SPACE">Leer</div>
        <div class="key selectable" data-value="BACK">←</div>
      </div>
    </div>
  </div>

  <div id="eintraege"></div>
  <div id="gazeCursor"></div>
  <div id="statusBottom">Bereit</div>

<script>
const nachricht = document.getElementById("nachricht");
const nameInput = document.getElementById("name");
const keys = document.querySelectorAll(".key");
const statusBottom = document.getElementById("statusBottom");
const toggleEyeMode = document.getElementById("toggleEyeMode");
const keyboardArea = document.getElementById("keyboardArea");
const eintraege = document.getElementById("eintraege");
const gazeCursor = document.getElementById("gazeCursor");

let eyeModeOn = false;
let hoveredKey = null;
let currentEyeKey = null;
let dwellTimer = null;
let repeatTimer = null;
let backspaceInterval = null;

const DWELL_START = 600;
const DWELL_REPEAT = 120;

function setStatus(text){
  statusBottom.textContent = text;
}

function updatePreviewText(v){
  if(v === "SPACE") return "Leerzeichen";
  if(v === "BACK") return "Löschen";
  return "Taste: " + v;
}

function activateKey(key){
  if(!key) return;
  const v = key.dataset.value;

  if(v === "BACK"){
    nachricht.value = nachricht.value.slice(0, -1);
  }else if(v === "SPACE"){
    nachricht.value += " ";
  }else{
    nachricht.value += v;
  }

  setStatus(updatePreviewText(v));
}

function stopDwell(){
  if(dwellTimer) clearTimeout(dwellTimer);
  if(repeatTimer) clearInterval(repeatTimer);
  dwellTimer = null;
  repeatTimer = null;
}

function startDwell(key){
  stopDwell();
  currentEyeKey = key;

  dwellTimer = setTimeout(() => {
    activateKey(key);

    repeatTimer = setInterval(() => {
      activateKey(key);
    }, DWELL_REPEAT);
  }, DWELL_START);
}

function clearHover(){
  keys.forEach(k => k.classList.remove("hovered"));
}

function setHoveredKey(key){
  if(currentEyeKey === key) return;

  stopDwell();
  clearHover();
  currentEyeKey = key;

  if(key){
    key.classList.add("hovered");
    startDwell(key);
  }
}

function updateHoverByCursor(x, y){
  const el = document.elementFromPoint(x, y);
  const key = el ? el.closest(".key") : null;
  setHoveredKey(key);
}

keys.forEach(key => {
  key.addEventListener("touchstart", () => {
    clearHover();
    key.classList.add("hovered");
    hoveredKey = key;
    activateKey(key);

    if(key.dataset.value === "BACK"){
      backspaceInterval = setInterval(() => {
        nachricht.value = nachricht.value.slice(0, -1);
        setStatus("Löschen");
      }, 120);
    }
  }, { passive: true });

  key.addEventListener("touchend", () => {
    clearInterval(backspaceInterval);
    backspaceInterval = null;
  });

  key.addEventListener("touchcancel", () => {
    clearInterval(backspaceInterval);
    backspaceInterval = null;
  });

  key.addEventListener("mousedown", () => {
    clearHover();
    key.classList.add("hovered");
    hoveredKey = key;
    activateKey(key);

    if(key.dataset.value === "BACK"){
      backspaceInterval = setInterval(() => {
        nachricht.value = nachricht.value.slice(0, -1);
        setStatus("Löschen");
      }, 120);
    }
  });

  key.addEventListener("mouseup", () => {
    clearInterval(backspaceInterval);
    backspaceInterval = null;
  });

  key.addEventListener("mouseleave", () => {
    clearInterval(backspaceInterval);
    backspaceInterval = null;
  });
});

toggleEyeMode.addEventListener("click", () => {
  eyeModeOn = !eyeModeOn;
  gazeCursor.style.display = eyeModeOn ? "block" : "none";
  toggleEyeMode.textContent = eyeModeOn ? "Augenmodus aus" : "Augenmodus ein";
  setStatus(eyeModeOn ? "Augenmodus aktiv" : "Augenmodus aus");
  stopDwell();
  clearHover();
});

document.addEventListener("touchmove", e => {
  if(!eyeModeOn) return;
  const x = e.touches[0].clientX;
  const y = e.touches[0].clientY;
  gazeCursor.style.left = x + "px";
  gazeCursor.style.top = y + "px";
  updateHoverByCursor(x, y);
}, { passive: true });

document.addEventListener("mousemove", e => {
  if(!eyeModeOn) return;
  const x = e.clientX;
  const y = e.clientY;
  gazeCursor.style.left = x + "px";
  gazeCursor.style.top = y + "px";
  updateHoverByCursor(x, y);
});

document.addEventListener("touchend", () => {
  stopDwell();
});

document.addEventListener("mouseup", () => {
  stopDwell();
});

function eintragen(){
  const name = nameInput.value.trim() || "🜂 Ein Gast";
  const text = nachricht.value.trim();
  if(!text){
    setStatus("Keine Nachricht");
    return;
  }

  const div = document.createElement("div");
  div.className = "eintrag";
  div.innerHTML = "<strong>" + name + "</strong><br>" + text.replace(/\n/g, "<br>");
  eintraege.prepend(div);

  nameInput.value = "";
  nachricht.value = "";
  setStatus("Eintrag gespeichert");
}
</script>
  <script type="module">
  import AurionEyeTrackingEngine from "./eyeTrackingEngine.js";

  const cam = document.getElementById("cam");
  const dot = document.getElementById("dot");
  const status = document.getElementById("status");
  const calInfo = document.getElementById("calInfo");
  const calTarget = document.getElementById("calTarget");

  let tx = innerWidth / 2;
  let ty = innerHeight / 2;
  let dx = tx;
  let dy = ty;

  function dotLoop(){
    dx += (tx - dx) * 0.28;
    dy += (ty - dy) * 0.28;
    dot.style.left = dx + "px";
    dot.style.top = dy + "px";
    requestAnimationFrame(dotLoop);
  }
  dotLoop();

  const engine = new AurionEyeTrackingEngine({
    video: cam,
    onStatus: text => {
      status.textContent = text;
    },
    onGaze: gaze => {
      tx = gaze.x;
      ty = gaze.y;
    },
    onBlink: () => {
      dot.classList.remove("blink", "double");
      void dot.offsetWidth;
      dot.classList.add("blink");
      setTimeout(() => dot.classList.remove("blink"), 140);
    },
    onDoubleBlink: () => {
      dot.classList.remove("blink", "double");
      void dot.offsetWidth;
      dot.classList.add("double");
      setTimeout(() => dot.classList.remove("double"), 140);

      const el = document.elementFromPoint(dx, dy)?.closest(".book, .link, button");
      if (el) el.click();
    },
    onSleepChange: sleeping => {
      document.body.style.filter = sleeping ? "brightness(0.72)" : "brightness(1)";
    }
  });

  document.getElementById("btnCam").onclick = async () => {
    await engine.startCamera();
  };

  document.getElementById("btnTrack").onclick = async () => {
    await engine.startTracking();
  };

  document.getElementById("btnCal").onclick = async () => {
    await engine.runFivePointCalibration({ calInfoEl: calInfo, calTargetEl: calTarget });
  };

  document.getElementById("btnDot").onclick = () => {
    const enabled = engine.toggleDot();
    dot.style.opacity = enabled ? "1" : "0";
    document.getElementById("btnDot").textContent = enabled ? "Dot aus" : "Dot an";
  };
</script>

</body>
</html>
