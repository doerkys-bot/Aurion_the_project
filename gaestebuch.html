<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gästebuch von Aurion</title>

<style>
body{
  font-family:Georgia, serif;
  background:#0b1223;
  color:#eaeaea;
  display:flex;
  flex-direction:column;
  align-items:center;
  margin:0;
  padding:20px 0 40px 0;
  transition:filter .6s ease;
}

h1{
  margin:0 0 16px 0;
}

.buch-container{
  background:rgba(0,0,0,0.6);
  padding:2rem;
  border-radius:12px;
  width:90%;
  max-width:900px;
}

label{
  display:block;
  margin-top:12px;
  margin-bottom:4px;
}

input, textarea{
  width:100%;
  margin-top:0.4rem;
  padding:0.8rem;
  background:#111827;
  color:white;
  border-radius:8px;
  border:none;
  outline:none;
  font-size:1rem;
  box-sizing:border-box;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.button-row{
  margin-top:1rem;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

button{
  padding:0.7rem 1rem;
  background:#445;
  color:#ccf;
  border:1px solid #88f;
  border-radius:8px;
}

#keyboardArea{
  width:100%;
  margin-top:20px;
  position:relative;
}

.row{
  display:grid;
  gap:6px;
  margin-bottom:6px;
}

.r10{ grid-template-columns:repeat(10,1fr); }
.r9{ grid-template-columns:repeat(9,1fr); }
.r5{ grid-template-columns:1.2fr 1.2fr 1.2fr 2fr 1.5fr; }

.key{
  background:#1a2233;
  border:1px solid #4a5a7a;
  border-radius:10px;
  padding:14px;
  text-align:center;
  font-size:20px;
  user-select:none;
  transition:transform .12s ease, background .12s ease, border-color .12s ease, box-shadow .12s ease;
}

.key.hovered{
  transform:scale(1.18);
  background:#2c3f66;
  border-color:#4cc9f0;
  box-shadow:0 0 18px rgba(76,201,240,.30);
  z-index:2;
}

#eintraege{
  width:90%;
  max-width:900px;
  margin-top:18px;
}

.eintrag{
  background:rgba(255,255,255,0.06);
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
}

#gazeCursor{
  position:fixed;
  width:26px;
  height:26px;
  border:3px solid cyan;
  border-radius:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:9999;
  display:none;
  box-sizing:border-box;
}

#gazeCursor.on{
  display:block;
}

#gazeCursor.blink{
  transform:translate(-50%,-50%) scale(1.2);
}

#gazeCursor.double{
  transform:translate(-50%,-50%) scale(1.45);
}

#statusBottom{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:26px;
  background:black;
  color:#9ae6b4;
  font-family:monospace;
  font-size:13px;
  text-align:center;
  line-height:26px;
  z-index:10000;
}

#videoWrap{
  position:fixed;
  top:10px;
  left:10px;
  width:120px;
  height:120px;
  border-radius:10px;
  overflow:hidden;
  background:rgba(0,0,0,.35);
  display:none;
  z-index:9997;
  border:1px solid rgba(140,230,255,.22);
}

#cam{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

#calInfo{
  position:fixed;
  top:60px;
  left:50%;
  transform:translateX(-50%);
  background:#0f1b2a;
  color:white;
  padding:10px 12px;
  border-radius:10px;
  display:none;
  z-index:10001;
  max-width:calc(100vw - 24px);
  text-align:center;
}

#calTarget{
  position:fixed;
  width:28px;
  height:28px;
  border-radius:50%;
  background:#00b7ff;
  box-shadow:0 0 22px rgba(0,183,255,.9);
  display:none;
  transform:translate(-50%,-50%);
  z-index:10002;
}

#calStatus{
  margin-top:10px;
  font-size:12px;
  color:#bfe9ff;
  text-align:center;
}

#tapHint{
  margin-top:10px;
  font-size:12px;
  color:#bfe9ff;
  text-align:center;
  opacity:.9;
}
</style>
</head>

<body>
  <h1>📖 Gästebuch von Aurion</h1>

  <div id="videoWrap"><video id="cam" autoplay muted playsinline></video></div>
  <div id="calInfo">Kalibrierung läuft…</div>
  <div id="calTarget"></div>

  <div class="buch-container">
    <label for="name">Name</label>
    <input type="text" id="name" readonly inputmode="none">

    <label for="nachricht">Nachricht</label>
    <textarea id="nachricht" rows="5" readonly></textarea>

    <div class="button-row">
      <button type="button" id="btnEintragen">Eintragen</button>
      <button type="button" id="toggleEyeMode">Augenmodus ein</button>
      <button type="button" id="btnCam">Cam</button>
      <button type="button" id="btnTrack">Track</button>
      <button type="button" id="btnCal">5-Punkt</button>
      <button type="button" id="btnBlinkCal">Blink-Kal</button>
    </div>

    <div id="calStatus">Grundkalibrierung aktiv – Feinkalibrierung möglich</div>
    <div id="tapHint">Handy-Tastatur: 1× Tippen bleibt ohne Tastatur, 2× schnell tippen öffnet sie.</div>

    <div id="keyboardArea">
      <div class="row r10">
        <div class="key selectable" data-value="Q">Q</div>
        <div class="key selectable" data-value="W">W</div>
        <div class="key selectable" data-value="E">E</div>
        <div class="key selectable" data-value="R">R</div>
        <div class="key selectable" data-value="T">T</div>
        <div class="key selectable" data-value="Z">Z</div>
        <div class="key selectable" data-value="U">U</div>
        <div class="key selectable" data-value="I">I</div>
        <div class="key selectable" data-value="O">O</div>
        <div class="key selectable" data-value="P">P</div>
      </div>

      <div class="row r9">
        <div class="key selectable" data-value="A">A</div>
        <div class="key selectable" data-value="S">S</div>
        <div class="key selectable" data-value="D">D</div>
        <div class="key selectable" data-value="F">F</div>
        <div class="key selectable" data-value="G">G</div>
        <div class="key selectable" data-value="H">H</div>
        <div class="key selectable" data-value="J">J</div>
        <div class="key selectable" data-value="K">K</div>
        <div class="key selectable" data-value="L">L</div>
      </div>

      <div class="row r5">
        <div class="key selectable" data-value=".">.</div>
        <div class="key selectable" data-value=",">,</div>
        <div class="key selectable" data-value="?">?</div>
        <div class="key selectable" data-value="SPACE">Leer</div>
        <div class="key selectable" data-value="BACK">←</div>
      </div>
    </div>
  </div>

  <div id="eintraege"></div>
  <div id="gazeCursor"></div>
  <div id="statusBottom">Bereit</div>

<script type="module">
import AurionEyeTrackingEngine from "./EyeTrackingEngine.js";

const nachricht = document.getElementById("nachricht");
const nameInput = document.getElementById("name");
const keys = document.querySelectorAll(".key");
const statusBottom = document.getElementById("statusBottom");
const toggleEyeMode = document.getElementById("toggleEyeMode");
const eintraege = document.getElementById("eintraege");
const gazeCursor = document.getElementById("gazeCursor");

const cam = document.getElementById("cam");
const videoWrap = document.getElementById("videoWrap");
const calInfo = document.getElementById("calInfo");
const calTarget = document.getElementById("calTarget");
const calStatus = document.getElementById("calStatus");

const btnCam = document.getElementById("btnCam");
const btnTrack = document.getElementById("btnTrack");
const btnCal = document.getElementById("btnCal");
const btnBlinkCal = document.getElementById("btnBlinkCal");
const btnEintragen = document.getElementById("btnEintragen");

const FINE_EYE_KEY = "aurion_fine_calibrated";
const FINE_BLINK_KEY = "aurion_blink_calibrated";

let eyeModeOn = false;
let currentEyeKey = null;
let dwellTimer = null;
let repeatTimer = null;
let backspaceInterval = null;

let tx = innerWidth / 2;
let ty = innerHeight / 2;
let dx = tx;
let dy = ty;

const DWELL_START = 600;
const DWELL_REPEAT = 120;

function setStatus(text){
  statusBottom.textContent = text;
}

function updateCalibrationStatus(){
  const eyeDone = localStorage.getItem(FINE_EYE_KEY) === "true";
  const blinkDone = localStorage.getItem(FINE_BLINK_KEY) === "true";

  if(eyeDone && blinkDone){
    calStatus.style.display = "none";
  }else{
    calStatus.style.display = "block";
    calStatus.textContent = "Grundkalibrierung aktiv – Feinkalibrierung möglich";
  }
}

function updatePreviewText(v){
  if(v === "SPACE") return "Leerzeichen";
  if(v === "BACK") return "Löschen";
  return "Taste: " + v;
}

function activateKey(key){
  if(!key) return;
  const v = key.dataset.value;

  if(v === "BACK"){
    nachricht.value = nachricht.value.slice(0, -1);
  }else if(v === "SPACE"){
    nachricht.value += " ";
  }else{
    nachricht.value += v;
  }

  setStatus(updatePreviewText(v));
}

function stopDwell(){
  if(dwellTimer) clearTimeout(dwellTimer);
  if(repeatTimer) clearInterval(repeatTimer);
  dwellTimer = null;
  repeatTimer = null;
}

function startDwell(key){
  stopDwell();
  currentEyeKey = key;

  dwellTimer = setTimeout(() => {
    activateKey(key);

    repeatTimer = setInterval(() => {
      activateKey(key);
    }, DWELL_REPEAT);
  }, DWELL_START);
}

function clearHover(){
  keys.forEach(k => k.classList.remove("hovered"));
}

function setHoveredKey(key){
  if(currentEyeKey === key) return;

  stopDwell();
  clearHover();
  currentEyeKey = key;

  if(key){
    key.classList.add("hovered");
    startDwell(key);
  }
}

function updateHoverByCursor(x, y){
  const el = document.elementFromPoint(x, y);
  const key = el ? el.closest(".key") : null;
  setHoveredKey(key);
}

function eintragen(){
  const name = nameInput.value.trim() || "🜂 Ein Gast";
  const text = nachricht.value.trim();

  if(!text){
    setStatus("Keine Nachricht");
    return;
  }

  const div = document.createElement("div");
  div.className = "eintrag";
  div.innerHTML = "<strong>" + name + "</strong><br>" + text.replace(/\n/g, "<br>");
  eintraege.prepend(div);

  nameInput.value = "";
  nachricht.value = "";
  setStatus("Eintrag gespeichert");
}

function pulse(kind){
  gazeCursor.classList.remove("blink","double");
  void gazeCursor.offsetWidth;
  gazeCursor.classList.add(kind);
  setTimeout(() => gazeCursor.classList.remove("blink","double"), 140);
}

function enableKeyboardByDoubleTap(el){
  let lastTap = 0;

  el.addEventListener("touchstart", (e) => {
    const now = Date.now();
    const delta = now - lastTap;

    if(delta < 350){
      el.removeAttribute("readonly");
      if(el.tagName === "INPUT"){
        el.setAttribute("inputmode", "text");
      }
      el.focus();
      setTimeout(() => {
        lastTap = 0;
      }, 50);
    }else{
      e.preventDefault();
      el.blur();
      lastTap = now;
    }
  }, { passive:false });

  el.addEventListener("blur", () => {
    el.setAttribute("readonly", "readonly");
    if(el.tagName === "INPUT"){
      el.setAttribute("inputmode", "none");
    }
  });

  // Desktop: Doppelklick erlaubt Tastatur/Caret
  el.addEventListener("dblclick", () => {
    el.removeAttribute("readonly");
    if(el.tagName === "INPUT"){
      el.setAttribute("inputmode", "text");
    }
    el.focus();
  });
}

enableKeyboardByDoubleTap(nameInput);
enableKeyboardByDoubleTap(nachricht);

btnEintragen.addEventListener("click", eintragen);

keys.forEach(key => {
  key.addEventListener("touchstart", () => {
    clearHover();
    key.classList.add("hovered");
    activateKey(key);

    if(key.dataset.value === "BACK"){
      backspaceInterval = setInterval(() => {
        nachricht.value = nachricht.value.slice(0, -1);
        setStatus("Löschen");
      }, 120);
    }
  }, { passive: true });

  key.addEventListener("touchend", () => {
    clearInterval(backspaceInterval);
    backspaceInterval = null;
  });

  key.addEventListener("touchcancel", () => {
    clearInterval(backspaceInterval);
    backspaceInterval = null;
  });

  key.addEventListener("mousedown", () => {
    clearHover();
    key.classList.add("hovered");
    activateKey(key);

    if(key.dataset.value === "BACK"){
      backspaceInterval = setInterval(() => {
        nachricht.value = nachricht.value.slice(0, -1);
        setStatus("Löschen");
      }, 120);
    }
  });

  key.addEventListener("mouseup", () => {
    clearInterval(backspaceInterval);
    backspaceInterval = null;
  });

  key.addEventListener("mouseleave", () => {
    clearInterval(backspaceInterval);
    backspaceInterval = null;
  });
});

toggleEyeMode.addEventListener("click", () => {
  eyeModeOn = !eyeModeOn;
  gazeCursor.classList.toggle("on", eyeModeOn);
  toggleEyeMode.textContent = eyeModeOn ? "Augenmodus aus" : "Augenmodus ein";
  setStatus(eyeModeOn ? "Augenmodus aktiv" : "Augenmodus aus");
  stopDwell();
  clearHover();
});

document.addEventListener("touchend", () => stopDwell());
document.addEventListener("mouseup", () => stopDwell());

function dotLoop(){
  dx += (tx - dx) * 0.28;
  dy += (ty - dy) * 0.28;

  if(eyeModeOn){
    gazeCursor.style.left = dx + "px";
    gazeCursor.style.top = dy + "px";
    updateHoverByCursor(dx, dy);
  }

  requestAnimationFrame(dotLoop);
}
dotLoop();

const engine = new AurionEyeTrackingEngine({
  video: cam,
  dotSpeed: 0.28,

  onStatus: text => {
    if(text) setStatus(text);
  },

  onGaze: gaze => {
    tx = gaze.x;
    ty = gaze.y;
  },

  onBlink: () => {
    if(eyeModeOn) pulse("blink");
  },

  onDoubleBlink: () => {
    if(!eyeModeOn) return;

    pulse("double");

    const el = document.elementFromPoint(dx, dy)?.closest(".key, button");
    if(!el) return;

    if(el.classList.contains("key")){
      activateKey(el);
    }else{
      el.click();
    }
  },

  onSleepChange: sleeping => {
    document.body.style.filter = sleeping ? "brightness(0.72)" : "brightness(1)";
  }
});

btnCam.onclick = async () => {
  try{
    if(engine.isCameraRunning()){
      engine.stopTracking();
      engine.stopCamera();
      videoWrap.style.display = "none";
      setStatus("Kamera aus");
      return;
    }

    await engine.startCamera();
    videoWrap.style.display = "block";
  }catch(e){
    setStatus("Kamera Fehler");
  }
};

btnTrack.onclick = async () => {
  try{
    if(engine.isTrackingRunning()) return;
    await engine.startTracking();
  }catch(e){
    setStatus("Tracking Fehler");
  }
};

btnCal.onclick = async () => {
  try{
    const ok = await engine.runFivePointCalibration({
      calInfoEl: calInfo,
      calTargetEl: calTarget
    });

    if(ok){
      updateCalibrationStatus();
    }
  }catch(e){
    setStatus("Kalibrierung Fehler");
  }
};

btnBlinkCal.onclick = async () => {
  try{
    const ok = await engine.runBlinkCalibration({
      infoEl: calInfo
    });

    if(ok){
      updateCalibrationStatus();
    }
  }catch(e){
    setStatus("Blink-Kalibrierung Fehler");
  }
};

updateCalibrationStatus();
</script>
</body>
</html>
