<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Aurion – MEIN ZWEITES BUCH</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Deaktiviert normales Scrollen, da wir das Auge nutzen */
            background-color: #02040a;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Dieser Container wird von der Engine per translateY bewegt */
        #content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            will-change: transform;
        }

        /* Der Frame für das PDF */
        iframe {
            width: 100vw;
            height: 1000vh; /* Genug Höhe für das gesamte Buch */
            border: none;
        }

        /* Eine kleine Status-Anzeige oben rechts */
        #ui-status {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            color: #8dffb8;
            border: 1px solid rgba(141, 255, 184, 0.3);
            z-index: 100;
            pointer-events: none;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div id="ui-status">MEIN ZWEITES BUCH • EyeTracking aktiv</div>

    <div id="content">
        <iframe src="https://docs.google.com/viewer?url=https://doerkys-bot.github.io/Aurion_the_project/Insel_Gailingen_Dirk_Schaefer_cover_final.pdf&embedded=true"></iframe>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <script src="https://doerkys-bot.github.io/Aurion_the_project/aurion-engine.js"></script>

    <script>
        // Start-Sequenz sobald das Fenster bereit ist
        window.onload = () => {
            // Wir prüfen, ob die Engine geladen wurde
            if (typeof Aurion !== 'undefined') {
                // Modus 'scroll' aktiviert dein Gaspedal
                Aurion.start('scroll');
                console.log("Aurion-Engine erfolgreich im Scroll-Modus gestartet.");
            } else {
                console.error("Fehler: aurion-engine.js wurde nicht gefunden oder das Objekt 'Aurion' ist nicht definiert.");
                alert("Die EyeTracking-Engine konnte nicht geladen werden.");
            }
        };
    </script>

</body>
</html>
