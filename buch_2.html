<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Aurion – Das 2. Buch</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; 
            background-color: #02040a;
            color: white;
            font-family: system-ui, sans-serif;
        }

        /* Dieser Container wird von der Engine bewegt */
        #content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            will-change: transform;
            transition: transform 0.1s ease-out; 
        }

        iframe {
            width: 100vw;
            height: 1000vh; 
            border: none;
            display: block;
        }

        #ui-status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid #8dffb8;
            color: #8dffb8;
            font-size: 14px;
            z-index: 1000;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(141, 255, 184, 0.2);
        }

        /* Die Kamera bleibt aktiv, wird aber unsichtbar gemacht */
        #cam {
            display: none;
        }
    </style>
</head>
<body>

    <div id="ui-status">📖 Das 2. Buch • System bereit</div>

    <video id="cam" autoplay muted playsinline></video>

    <div id="content">
        <iframe src="https://docs.google.com/viewer?url=https://doerkys-bot.github.io/Aurion_the_project/Insel_Gailingen_Dirk_Schaefer_cover_final.pdf&embedded=true"></iframe>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://doerkys-bot.github.io/Aurion_the_project/aurion-engine.js"></script>

    <script>
        window.onload = async () => {
            const statusLabel = document.getElementById('ui-status');
            
            if (typeof Aurion !== 'undefined') {
                try {
                    await Aurion.start('scroll');
                    statusLabel.innerHTML = "📖 Das 2. Buch • Scroll aktiv";
                } catch (e) {
                    statusLabel.innerHTML = "⚠️ Kamera nicht bereit";
                    console.error(e);
                }
            } else {
                statusLabel.innerHTML = "❌ Engine fehlt";
                statusLabel.style.color = "red";
            }
        };

        // Sicherheits-Schleife für die Bewegung
        setInterval(() => {
            const container = document.getElementById('content');
            if (container && typeof Aurion !== 'undefined' && Aurion.currentY !== undefined) {
                container.style.transform = `translateY(${Aurion.currentY}px)`;
            }
        }, 20);
    </script>

</body>
</html>
