<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Aurion OS - Kommunikation</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <script src="aurion_engine.js"></script>

    <style>
        body { margin: 0; background: #0b1223; color: white; font-family: sans-serif; overflow: hidden; }

        /* Bereich für das Textfeld und Mikrofon */
        #commHeader { 
            margin-top: 160px; /* Platz für die TopBar der Engine */
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 20px; 
            padding: 20px;
        }

        #outputDisplay { 
            width: 60%; 
            background: white; 
            color: black; 
            padding: 20px; 
            border-radius: 12px; 
            font-size: 32px; 
            font-weight: bold; 
            text-align: center;
            border: 5px solid #5a3d8a;
        }

        #micSymbol { font-size: 50px; }

        /* Die Scroll-Zone für die 13 Mitteilungen */
        .aurion-scroll { 
            height: calc(100vh - 350px); 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            scrollbar-width: none; /* Versteckt Scrollbar für sauberen Look */
        }

        /* Styling der Buttons - Die Engine nutzt die Klasse 'aurion-btn' */
        .aurion-btn { 
            width: 80%; 
            max-width: 600px; 
            background: #1e293b; 
            border: 4px solid #334155; 
            color: white; 
            border-radius: 20px; 
            font-size: 35px; 
            padding: 30px; 
            margin-bottom: 20px; 
            cursor: pointer; 
            text-align: center;
        }

        /* Der Fokus-Zustand, wenn der Dot drauf liegt (wird von Engine gesteuert) */
        .focused { 
            border-color: #fbbf24 !important; 
            background: #2a5f9f !important; 
            transform: scale(1.05); 
        }

        #startOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 18, 35, 0.9); z-index: 30000;
            display: flex; justify-content: center; align-items: center;
        }
    </style>
</head>
<body>

    <div id="startOverlay">
        <button class="aurion-btn" onclick="aurion.start(); document.getElementById('startOverlay').style.display='none';">
            SYSTEM STARTEN
        </button>
    </div>

    <div id="commHeader">
        <div id="micSymbol">🎙️</div>
        <div id="outputDisplay">Bereit...</div>
    </div>

    <div class="aurion-scroll">
        <div class="aurion-btn" onclick="speak(this)">🎙️ FREIE MITTEILUNG</div>
        <div class="aurion-btn" onclick="speak(this)">JA</div>
        <div class="aurion-btn" onclick="speak(this)">NEIN</div>
        <div class="aurion-btn" onclick="speak(this)">DURST</div>
        <div class="aurion-btn" onclick="speak(this)">HUNGER</div>
        <div class="aurion-btn" onclick="speak(this)">HILFE</div>
        <div class="aurion-btn" onclick="speak(this)">TOILETTE</div>
        <div class="aurion-btn" onclick="speak(this)">MIR IST KALT</div>
        <div class="aurion-btn" onclick="speak(this)">MIR IST WARM</div>
        <div class="aurion-btn" onclick="speak(this)">PAUSE BITTE</div>
        <div class="aurion-btn" onclick="speak(this)">MUSIK AN</div>
        <div class="aurion-btn" onclick="speak(this)">LICHT AN/AUS</div>
        <div class="aurion-btn" onclick="speak(this)">DANKE</div>
    </div>

    <script>
        // Kleine Hilfsfunktion für die Sprachausgabe auf dieser Seite
        function speak(el) {
            const text = el.innerText.replace('🎙️ ', '');
            document.getElementById('outputDisplay').innerText = text;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
    </script>

</body>
</html>
