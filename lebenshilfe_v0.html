<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Aurion Pro - Lebenshilfe Hybrid Edition</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
    body { margin:0; font-family:sans-serif; background:#0b1223; color:white; overflow:hidden; width:100vw; height:100vh; touch-action: manipulation; }
    
    #topBar { position:fixed; top:0; left:0; width:100%; background:#08111f; padding:15px; z-index:1000; border-bottom: 5px solid #16a34a; text-align: center; }
    
    #silhouetteRow { display: flex; justify-content: center; gap: 40px; margin-bottom: 10px; height: 50px; }
    .silContainer { width: 50px; height: 50px; }
    .silPath path, .silPath ellipse { stroke:#334155; stroke-width:6; fill:none; transition: 0.3s; }
    .active-sil path, .active-sil ellipse { stroke:#16a34a !important; filter: drop-shadow(0 0 8px #16a34a); }

    #controlPanel { display: flex; justify-content: center; gap: 15px; margin-bottom: 15px; }
    .sysBtn { padding: 12px 25px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; color: white; }
    .start { background: #16a34a; }
    .calib { background: #fbbf24; color: black; }
    .stop { background: #dc2626; }

    #outputContainer { display: flex; align-items: center; justify-content: center; gap: 10px; width: 95%; max-width: 1100px; margin: 0 auto 15px auto; }
    .commBox { background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 10px 20px; font-size: 35px; transition: all 0.3s ease; }
    .active-comm { background: rgba(22, 163, 74, 0.4); border-color: #16a34a; box-shadow: 0 0 20px #16a34a; transform: scale(1.1); }

    #outputDisplay { flex-grow: 1; background:white; color:black; padding:15px; border-radius:10px; font-size:26px; font-weight:bold; border: 4px solid #5a3d8a; text-align: center; min-height: 40px; }

    #quickRow { display: flex; justify-content: center; gap: 15px; padding: 20px; background: rgba(22, 163, 74, 0.1); border-bottom: 2px solid #1e293b; }
    .quickBtn { flex: 1; max-width: 350px !important; padding: 45px !important; font-size: 45px !important; font-weight: 900 !important; border: 5px solid #fbbf24 !important; background: #17345d; color: white; }

    #content { margin-top: 600px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-bottom: 100px; }
    .choiceBtn { width: 90%; max-width: 800px; background:#1e293b; border: 2px solid #334155; color: white; border-radius: 12px; font-size: 28px; padding: 25px; text-align: center; cursor: pointer; user-select: none; }
    .focused { border-color: #fbbf24 !important; background: #2a5f9f !important; transform: scale(1.02); }

    /* Schlaf Overlay */
    #sleepOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:15000; flex-direction: column; justify-content: center; align-items: center; pointer-events: none; }

    /* Gaze Cursor & Loader */
    #gazeWrapper { position:fixed; z-index:16000; transform:translate(-50%, -50%); pointer-events: none; display:none; }
    #gazeCursor { width:35px; height:35px; background:red; border-radius:50%; border: 3px solid white; }
    #loaderRing { position: absolute; top: -12.5px; left: -12.5px; width: 60px; height: 60px; border-radius: 50%; border: 5px solid rgba(22, 163, 74, 0.3); border-top: 5px solid #16a34a; display: none; animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="sleepOverlay">
    <div style="font-size: 120px;">💤</div>
    <h1 style="font-size: 50px; color: #fbbf24;">RUHEMODUS</h1>
    <p style="font-size: 24px;">Sage: "Wach auf" oder Mund 2 Sek. öffnen</p>
</div>

<div id="topBar">
    <div id="silhouetteRow">
        <svg id="silCam" class="silContainer silPath" viewBox="0 0 200 200"><path d="M40 70h120v70H40zM70 70V50h60v20M100 105a15 15 0 100-30 15 15 0 000 30z"/></svg>
        <svg id="silEye" class="silContainer silPath" viewBox="0 0 200 200"><ellipse cx="100" cy="60" rx="30" ry="35"></ellipse><path d="M60 160c10-40 30-60 40-60s30 20 40 60"></path></svg>
    </div>

    <div id="controlPanel">
        <button class="sysBtn start" onclick="engine.powerOn()">SYSTEM STARTEN</button>
        <button class="sysBtn stop" onclick="location.reload()">AUS</button>
    </div>
    
    <div id="outputContainer">
        <div class="commBox" id="boxMic">🎙️</div>
        <div id="outputDisplay">Bereit...</div>
        <div class="commBox" id="boxSpeak">🔊</div>
    </div>

    <div id="quickRow">
        <div class="choiceBtn quickBtn" onclick="engine.manualTrigger(this)">JA</div>
        <div class="choiceBtn quickBtn" style="border-color:#dc2626 !important" onclick="engine.manualTrigger(this)">HILFE</div>
        <div class="choiceBtn quickBtn" onclick="engine.manualTrigger(this)">NEIN</div>
    </div>
</div>

<div id="content">
    <div class="choiceBtn" onclick="engine.manualTrigger(this)">DURST</div>
    <div class="choiceBtn" onclick="engine.manualTrigger(this)">HUNGER</div>
    <div class="choiceBtn" onclick="engine.manualTrigger(this)">UMLAGERN</div>
</div>

<div id="gazeWrapper">
    <div id="loaderRing"></div>
    <div id="gazeCursor"></div>
</div>

<script>
class AurionEngine {
    constructor() {
        this.isRunning = false;
        this.isAsleep = false;
        this.cx = window.innerWidth/2; this.cy = window.innerHeight/2;
        this.mouthStart = 0;
        this.synth = window.speechSynthesis;

        // Spracherkennung für Befehle
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            this.recognition = new SpeechRecognition();
            this.recognition.lang = 'de-DE';
            this.recognition.continuous = true;
            this.recognition.onresult = (e) => this.handleVoiceCommand(e);
            this.recognition.onend = () => { if(this.isRunning) try { this.recognition.start(); } catch(e) {} };
        }

        setInterval(() => this.updateLoop(), 30);
    }

    async powerOn() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({video: true});
            const video = document.createElement("video");
            video.srcObject = stream; await video.play();
            
            const fm = new FaceMesh({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
            fm.setOptions({maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.7});
            fm.onResults(r => this.processFace(r));
            
            new Camera(video, {onFrame: async() => await fm.send({image: video}), width: 640, height: 480}).start();
            this.isRunning = true;
            document.getElementById("gazeWrapper").style.display = "block";
            try { this.recognition.start(); } catch(e) {}
            this.synth.speak(new SpeechSynthesisUtterance("System aktiv"));
        } catch(e) { alert("Fehler beim Starten!"); }
    }

    handleVoiceCommand(event) {
        const cmd = event.results[event.results.length - 1][0].transcript.toLowerCase();
        if (!this.isAsleep && (cmd.includes("schlaf ein") || cmd.includes("schlafen"))) {
            this.setSleep(true);
        } else if (this.isAsleep && (cmd.includes("wach auf") || cmd.includes("aufwachen"))) {
            this.setSleep(false);
        }
    }

    setSleep(state) {
        if (this.isAsleep === state) return;
        this.isAsleep = state;
        document.getElementById("sleepOverlay").style.display = state ? "flex" : "none";
        document.getElementById("gazeWrapper").style.opacity = state ? "0.3" : "1.0";
        document.getElementById("loaderRing").style.display = "none";
        this.mouthStart = 0;
        this.synth.cancel();
        this.synth.speak(new SpeechSynthesisUtterance(state ? "Ruhemodus" : "System bereit"));
    }

    processFace(r) {
        if(!r.multiFaceLandmarks?.length) return;
        const lm = r.multiFaceLandmarks[0];
        const loader = document.getElementById("loaderRing");

        // Mund-Geste (Beide Richtungen)
        const mouthDist = Math.abs(lm[13].y - lm[14].y);
        if (mouthDist > 0.05) { 
            if (this.mouthStart === 0) { this.mouthStart = Date.now(); loader.style.display = "block"; }
            if (Date.now() - this.mouthStart > 2000) this.setSleep(!this.isAsleep);
        } else { this.mouthStart = 0; loader.style.display = "none"; }

        if (this.isAsleep) return;

        // Blinzeln & Gaze
        const ear = (Math.abs(lm[159].y - lm[145].y) + Math.abs(lm[386].y - lm[374].y)) / 2;
        if (ear < 0.018) {
            if (!this.isClosed) {
                this.isClosed = true;
                document.getElementById("silEye").classList.add("active-sil");
                this.triggerSelection();
            }
        } else { 
            this.isClosed = false; 
            document.getElementById("silEye").classList.remove("active-sil");
        }

        let tx = (1 - (lm[468].x - 0.42) / (0.58 - 0.42)) * window.innerWidth;
        let ty = ((lm[468].y - 0.42) / (0.58 - 0.42)) * window.innerHeight;
        this.cx = this.cx + (tx - this.cx) * 0.18;
        this.cy = this.cy + (ty - this.cy) * 0.18;
    }

    triggerSelection() {
        const target = document.querySelector(".focused");
        if(target && !this.isAsleep && !this.synth.speaking) {
            const txt = target.innerText;
            document.getElementById("outputDisplay").innerText = txt;
            this.synth.speak(new SpeechSynthesisUtterance(txt));
        }
    }

    manualTrigger(el) {
        document.querySelectorAll(".choiceBtn").forEach(b => b.classList.remove("focused"));
        el.classList.add("focused");
        this.triggerSelection();
    }

    updateLoop() {
        if(!this.isRunning) return;
        const wrapper = document.getElementById("gazeWrapper");
        wrapper.style.left = this.cx + "px"; wrapper.style.top = this.cy + "px";
        if(!this.isAsleep) {
            const el = document.elementFromPoint(this.cx, this.cy);
            if (el?.classList.contains("choiceBtn")) {
                document.querySelectorAll(".choiceBtn").forEach(b => b.classList.remove("focused"));
                el.classList.add("focused");
            }
        }
    }
}
const engine = new AurionEngine();
</script>
</body>
</html>
