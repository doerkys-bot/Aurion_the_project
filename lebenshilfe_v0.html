<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8" /><title>Aurion Pro - WfbM Finale (Mic-Glow Edition)</title><script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script><script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script><style>    body, html { margin:0; padding:0; width:100vw; height:100vh; overflow:hidden; background:#0b1223; color:white; font-family:sans-serif; }        #viewport { display: flex; width: 300vw; height: 100vh; transform: translateX(-100vw); transition: 0.8s cubic-bezier(0.16, 1, 0.3, 1); }    .page { width: 100vw; height: 100vh; flex-shrink: 0; position: relative; box-sizing: border-box; overflow: hidden; }    #topBar { position:fixed; top:0; left:0; width:100%; background:#08111f; padding:15px; z-index:1000; border-bottom: 8px solid #16a34a; text-align: center; transition: 0.5s; }    .status-sleeping { border-color: #ef4444 !important; opacity: 0.8; }    /* Mikrofon Icon Style */    #micIcon { width: 50px; height: 50px; fill: #334155; transition: 0.3s; filter: drop-shadow(0 0 0px transparent); }    .mic-active { fill: #16a34a !important; filter: drop-shadow(0 0 15px #16a34a) !important; }    #outputContainer { display: flex; align-items: center; justify-content: center; gap: 20px; width: 95%; max-width: 1100px; margin: 180px auto 10px auto; }    #outputDisplay { flex-grow: 1; background:white; color:black; padding:20px; border-radius:10px; font-size:28px; font-weight:bold; border: 4px solid #5a3d8a; text-align: center; min-height: 40px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }        #scrollBox { height: calc(100vh - 420px); overflow-y: auto; padding: 20px; scrollbar-width: none; display: flex; flex-direction: column; align-items: center; }        .choiceBtn { width: 90%; max-width: 850px; background:#1e293b; border: 4px solid #334155; color: white; border-radius: 15px; font-size: 26px; padding: 18px; text-align: center; transition: 0.2s; margin: 8px auto; display: block; cursor: pointer; text-transform: uppercase; }    .focused { border-color: #fbbf24 !important; background: #2a5f9f !important; transform: scale(1.03); box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); }    .content-card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 30px; width: 90%; max-width: 1200px; margin: 160px auto 20px auto; border: 1px solid rgba(255,255,255,0.1); overflow-y: auto; max-height: 75vh; }    .gl-notizfeld { background: #ffffff; color: #000000; padding: 15px; border-radius: 8px; min-height: 60px; font-size: 18px; border: 3px solid #5a3d8a; width: 95%; outline: none; margin-bottom: 10px; }    #gazeWrapper { position:fixed; z-index:16000; transform:translate(-50%, -50%); pointer-events: none; display: none; }    #gazeCursor { width:30px; height:30px; background:red; border-radius:50%; border: 2px solid white; box-shadow: 0 0 15px black; }    .lost-gaze { background: orange !important; opacity: 0.5; }</style></head><body><div id="topBar">    <button class="choiceBtn" style="display:inline-block; width:auto; font-size:16px; padding:10px 20px; background:#16a34a;" onclick="engine.powerOn()">SYSTEM START</button>    <button class="choiceBtn" style="display:inline-block; width:auto; font-size:16px; padding:10px 20px; background:#ef4444;" onclick="engine.powerOff()">STOPP</button></div><div id="viewport">    <!-- Seite 3 (UK-Infos) -->    <div class="page" id="page3">        <div class="content-card" style="text-align: center;">            <h1 style="color:#fbbf24;">UK-Vorgaben</h1>            <div class="choiceBtn">SGB IX KONFORM</div>            <div class="choiceBtn">AUSGLEICH DER BEHINDERUNG</div>            <div class="choiceBtn" id="goHome3" style="background:#16a34a;">ZURÜCK</div>        </div>    </div>    <!-- Seite 1 (Hauptmenü mit leuchtendem Mic) -->    <div class="page" id="page1">        <div id="outputContainer">            <!-- Das neue Mikrofon Icon -->            <svg id="micIcon" viewBox="0 0 24 24">                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>            </svg>            <div id="outputDisplay">Bereit...</div>        </div>        <div id="scrollBox">            <div class="choiceBtn" id="voiceTrigger" style="background:#5a3d8a;">🎙️ EIGENE SPRACHE STARTEN</div>            <div class="choiceBtn">ICH BRAUCHE HILFE</div>            <div class="choiceBtn">BITTE TRINKEN</div>            <div class="choiceBtn">ICH HABE HUNGER</div>            <div class="choiceBtn">TOILETTE BITTE</div>            <div class="choiceBtn">DANKE SCHÖN</div>            <div class="choiceBtn">JA</div>            <div class="choiceBtn">NEIN</div>        </div>    </div>    <!-- Seite 2 (Doku) -->    <div class="page" id="page2">        <div class="content-card">            <h2 style="color:#fbbf24;">Dokumentation</h2>            <div id="text1" class="gl-notizfeld" contenteditable="true">Beobachtung: </div>            <div class="choiceBtn dictate-trigger" onclick="engine.startDictation('text1')">🎙️ DIKTIEREN</div>            <div class="choiceBtn" id="goHome2" style="background:#16a34a;">ZURÜCK</div>        </div>    </div></div><div id="gazeWrapper"><div id="gazeCursor"></div></div><video id="videoElement" style="display:none;" playsinline></video><script>class AurionEngine {    constructor() {        this.isRunning = false;        this.isSleeping = false;        this.toggleCooldown = false;        this.rawX = window.innerWidth/2; this.rawY = window.innerHeight/2;        this.smoothX = window.innerWidth/2; this.smoothY = window.innerHeight/2;        this.smoothing = 0.12;        this.page = 1;        this.lastDataTime = Date.now();        this.mouthTimer = null;        this.synth = window.speechSynthesis;                const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;        if (Speech) {            this.recognition = new Speech();            this.recognition.lang = 'de-DE';                        // VISUELLES FEEDBACK: Mic leuchtet wenn es hört            this.recognition.onstart = () => {                document.getElementById("micIcon").classList.add("mic-active");            };            this.recognition.onend = () => {                document.getElementById("micIcon").classList.remove("mic-active");                if(this.isRunning) this.recognition.start();             };            this.recognition.onresult = (e) => {                const text = e.results[0][0].transcript.toLowerCase();                if (text.includes("schlafen")) this.sleep();                else if (text.includes("wach")) this.wakeUp();                else if (this.activeFieldId) {                    document.getElementById(this.activeFieldId).innerText = text;                    this.activeFieldId = null;                } else {                    document.getElementById("outputDisplay").innerText = text;                    this.synth.cancel(); this.synth.speak(new SpeechSynthesisUtterance(text));                }            };        }        setInterval(() => this.updateLoop(), 25);    }    async powerOn() {        const videoElement = document.getElementById('videoElement');        const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});        faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: true, minDetectionConfidence: 0.7 });        faceMesh.onResults((r) => this.processFace(r));        this.cam = new Camera(videoElement, { onFrame: async () => await faceMesh.send({image: videoElement}), width: 640, height: 480 });        this.cam.start();        this.isRunning = true;        this.recognition.start();        document.getElementById("gazeWrapper").style.display = "block";    }    triggerToggle() {        if (this.toggleCooldown) return;        this.toggleCooldown = true;        if (this.isSleeping) this.wakeUp(); else this.sleep();        setTimeout(() => { this.toggleCooldown = false; }, 3000);     }    wakeUp() {        this.isSleeping = false;        this.recognition.stop();         document.getElementById("topBar").classList.remove("status-sleeping");        this.synth.cancel();        let u = new SpeechSynthesisUtterance("System wach");        u.onend = () => { if(this.isRunning) this.recognition.start(); };        this.synth.speak(u);    }    sleep() {        this.isSleeping = true;        this.recognition.stop();        document.getElementById("topBar").classList.add("status-sleeping");        this.synth.cancel();        let u = new SpeechSynthesisUtterance("System schläft");        u.onend = () => { if(this.isRunning) this.recognition.start(); };        this.synth.speak(u);    }    processFace(r) {        if (!r.multiFaceLandmarks?.length || !this.isRunning) {            if (Date.now() - this.lastDataTime > 2000) {                this.rawX = window.innerWidth/2; this.rawY = window.innerHeight/2;                document.getElementById("gazeCursor").classList.add("lost-gaze");            }            return;        }        this.lastDataTime = Date.now();        document.getElementById("gazeCursor").classList.remove("lost-gaze");        const lm = r.multiFaceLandmarks[0];        const dist = (p1, p2) => Math.sqrt(Math.pow(lm[p1].x-lm[p2].x, 2) + Math.pow(lm[p1].y-lm[p2].y, 2));                const mar = dist(13, 14) / dist(78, 308);        if (mar > 0.55) {            if (!this.mouthTimer) this.mouthTimer = setTimeout(() => { this.triggerToggle(); this.mouthTimer = null; }, 1000);        } else if (mar < 0.25) {            if (this.mouthTimer) { clearTimeout(this.mouthTimer); this.mouthTimer = null; }        }        if (this.isSleeping) return;        this.rawX = (1 - (lm[4].x - 0.38) / 0.24) * window.innerWidth;        this.rawY = ((lm[4].y - 0.38) / 0.24) * window.innerHeight;        const closed = (dist(159, 145) / dist(33, 133) < 0.14);        if (closed && !this.leftEyeClosed) {            this.leftEyeClosed = true;            if (Date.now() - this.lastBlinkTime < 600) this.execute(this.currentTarget);            this.lastBlinkTime = Date.now();        } else if (!closed) this.leftEyeClosed = false;    }    updateLoop() {        if (!this.isRunning || this.isSleeping) return;        this.smoothX += (this.rawX - this.smoothX) * this.smoothing;        this.smoothY += (this.rawY - this.smoothY) * this.smoothing;        const x = this.smoothX, y = this.smoothY;        const gw = document.getElementById("gazeWrapper");        gw.style.left = `${x}px`; gw.style.top = `${y}px`;        if (this.page === 1) {            const sb = document.getElementById("scrollBox");            if (y < 200) sb.scrollTop -= 10;            else if (y > window.innerHeight - 150) sb.scrollTop += 10;        }        if (!this.navLocked) {            if (this.page === 1) {                if (x < 60) this.setPage(0);                if (x > window.innerWidth - 60) this.setPage(2);            } else if (this.page === 0 && x > window.innerWidth - 60) this.setPage(1);            else if (this.page === 2 && x < 60) this.setPage(1);        }        const el = document.elementFromPoint(x, y);        if(el?.classList.contains("choiceBtn") || el?.classList.contains("dictate-trigger")) {            if(this.currentTarget !== el) {                this.currentTarget = el;                document.querySelectorAll(".choiceBtn, .dictate-trigger").forEach(b => b.classList.remove("focused"));                el.classList.add("focused");            }        }    }    setPage(p) {        this.page = p; this.navLocked = true;        document.getElementById("viewport").style.transform = `translateX(-${p * 100}vw)`;        setTimeout(() => { this.navLocked = false; }, 1200);    }    execute(el) {        if (!el) return;        if (el.id === "voiceTrigger") { this.activeFieldId = null; }        else if (el.classList.contains("dictate-trigger")) { /* Diktat über Field ID gesteuert */ }        else if (el.id.includes("goHome")) this.setPage(1);        else {            document.getElementById("outputDisplay").innerText = el.innerText;            this.synth.cancel(); this.synth.speak(new SpeechSynthesisUtterance(el.innerText));        }    }    startDictation(id) {        this.activeFieldId = id;        this.synth.speak(new SpeechSynthesisUtterance("Ich höre zu"));    }}const engine = new AurionEngine();</script></body></html>
