<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aurion Reader V18.0 - Long Read</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #gate { position: fixed; inset: 0; background: #050a14; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        #btn { padding: 30px; border-radius: 20px; background: #32d74b; border: none; font-size: 20px; font-weight: bold; }
        #debug { position: fixed; top: 10px; left: 10px; color: #007aff; z-index: 1100; font-size: 14px; background: rgba(0,0,0,0.7); }
        
        /* Das Sichtfenster */
        #viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Der endlose Buch-Container */
        #content { 
            width: 100%;
            height: 5000vh; /* Platz für alle 134 Seiten */
            position: absolute;
            top: 0;
            transition: transform 0.1s linear; /* Fließende Bewegung */
        }

        #pdf-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div id="debug">System bereit</div>
<div id="gate">
    <button id="btn" onclick="ignite()">BUCH LESEN (74 SEITEN)</button>
</div>

<div id="viewport">
    <div id="content" id="bookLayer">
        <iframe id="pdf-frame" src="https://docs.google.com/viewer?url=https://doerkys-bot.github.io/Aurion_the_project/v_p_i_m.pdf&embedded=true"></iframe>
    </div>
</div>

<video id="v" style="display:none" playsinline muted></video>

<script>
let currentY = 0;
let speed = 0;

async function ignite() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const v = document.getElementById('v');
        v.srcObject = stream;
        await v.play();

        const fm = new FaceMesh({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
        fm.setOptions({maxNumFaces: 1, minDetectionConfidence: 0.3});

        fm.onResults((r) => {
            if (r.multiFaceLandmarks?.[0]) {
                document.getElementById('gate').style.display = 'none';
                const n = r.multiFaceLandmarks[0][1];
                
                // GASPEDAL-LOGIK:
                // Wir berechnen die Abweichung von der Mitte (0.5)
                const offset = n.y - 0.5; 
                
                // Wenn der Kopf weit genug bewegt wird, setzen wir die Geschwindigkeit
                if (Math.abs(offset) > 0.05) {
                    speed = offset * 50; // Je weiter der Kopf, desto schneller
                } else {
                    speed = 0; // Totzone in der Mitte zum ruhigen Lesen
                }
                
                document.getElementById('debug').innerText = "Speed: " + speed.toFixed(1);
            }
        });

        // Die Animations-Schleife (läuft 60 mal pro Sekunde)
        function update() {
            if (speed !== 0) {
                currentY -= speed; 
                // Begrenzung, damit man nicht ins Unendliche scrollt
                if (currentY > 0) currentY = 0;
                document.getElementById('content').style.transform = `translateY(${currentY}px)`;
            }
            requestAnimationFrame(update);
        }
        update();

        const cam = new Camera(v, { onFrame: async () => { await fm.send({image: v}); } });
        cam.start();
    } catch (err) { alert("Fehler!"); }
}
</script>
</body>
</html>
