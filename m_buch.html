<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Vom Planschbecken ins Meer · Dirk Schäfer</title>
<style>
:root{--bg:#060a13;--neon:#00f2ff;--gold:#ffcc00;--text:#e8e0d0;}
*{box-sizing:border-box;margin:0;padding:0;}
body,html{background:var(--bg);color:var(--text);font-family:Georgia,serif;
  width:100vw;height:100vh;overflow:hidden;}

/* ── TITELSEITE ── */
#title-page{
  position:fixed;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 24px;gap:20px;
  background:radial-gradient(ellipse at 50% 30%,#0a1e3a 0%,#060a13 70%);
}
.tp-label{
  color:rgba(0,242,255,0.3);font-family:monospace;
  font-size:0.6rem;letter-spacing:4px;text-transform:uppercase;
}
.tp-title{
  color:var(--neon);font-size:1.8rem;letter-spacing:4px;
  text-transform:uppercase;font-family:monospace;text-align:center;
  text-shadow:0 0 30px rgba(0,242,255,0.3);
}
.tp-sub{
  color:rgba(232,224,208,0.5);font-size:0.85rem;
  font-style:italic;text-align:center;line-height:1.6;
}
.tp-author{
  color:var(--gold);font-family:monospace;font-size:0.75rem;
  letter-spacing:3px;text-align:center;
}
.tp-divider{
  width:60px;height:1px;background:rgba(0,242,255,0.2);
}
.tp-start{
  background:rgba(0,242,255,0.07);border:2px solid var(--neon);
  border-radius:12px;padding:14px 32px;color:var(--neon);
  font-family:monospace;font-size:0.85rem;letter-spacing:4px;
  text-transform:uppercase;cursor:pointer;margin-top:8px;
  transition:background 0.2s,box-shadow 0.2s;
}
.tp-start:hover{
  background:rgba(0,242,255,0.14);
  box-shadow:0 0 24px rgba(0,242,255,0.2);
}

/* ── CONSENT OVERLAY ── */
#consent{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(160deg,#060e1f 0%,#0b1a2e 60%,#0a1525 100%);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 20px;overflow-y:auto;
}
#consent.show{display:flex;}
.cb{max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;}
.cb-lang{display:flex;gap:8px;justify-content:flex-end;}
.lb{background:transparent;border:1.5px solid rgba(0,242,255,0.3);border-radius:8px;
  color:rgba(0,242,255,0.5);font-family:monospace;font-size:0.65rem;letter-spacing:2px;
  padding:5px 12px;cursor:pointer;transition:all 0.2s;}
.lb.active{border-color:#00f2ff;color:#00f2ff;background:rgba(0,242,255,0.08);}
.cb-title{text-align:center;}
.cb-title h1{color:#00f2ff;font-size:1.4rem;letter-spacing:5px;
  text-transform:uppercase;font-family:monospace;margin-bottom:4px;}
.cb-title p{color:rgba(255,255,255,0.4);font-size:0.7rem;letter-spacing:2px;}
.cb-phil{background:rgba(0,242,255,0.04);border-left:3px solid rgba(0,242,255,0.25);
  border-radius:0 10px 10px 0;padding:12px 16px;
  color:rgba(255,255,255,0.65);font-size:0.85rem;line-height:1.7;font-style:italic;}
.cb-points{display:flex;flex-direction:column;gap:8px;}
.cp{display:flex;align-items:flex-start;gap:10px;
  background:rgba(255,255,255,0.03);border-radius:10px;padding:10px 12px;
  border:1px solid rgba(255,255,255,0.06);}
.cp-icon{font-size:1.2rem;flex-shrink:0;}
.cp-text{font-size:0.75rem;color:rgba(255,255,255,0.55);line-height:1.55;}
.cp-text strong{color:rgba(255,255,255,0.85);display:block;margin-bottom:2px;}
.cb-priv-btn{background:none;border:none;color:rgba(0,242,255,0.4);
  font-size:0.68rem;letter-spacing:2px;cursor:pointer;text-decoration:underline;
  font-family:monospace;text-align:center;padding:4px;}
.cb-priv{display:none;background:rgba(0,0,0,0.4);border-radius:10px;
  padding:14px;border:1px solid rgba(0,242,255,0.1);
  font-size:0.7rem;color:rgba(255,255,255,0.45);line-height:1.75;}
.cb-priv.open{display:block;}
.cb-priv h3{color:rgba(0,242,255,0.55);font-size:0.65rem;letter-spacing:3px;
  text-transform:uppercase;margin-bottom:8px;}
.cb-start{background:rgba(0,242,255,0.07);border:2px solid #00f2ff;
  border-radius:12px;padding:15px;width:100%;color:#00f2ff;font-family:monospace;
  font-size:0.88rem;letter-spacing:4px;text-transform:uppercase;cursor:pointer;
  transition:background 0.2s;}
.cb-start:hover{background:rgba(0,242,255,0.14);}
.cb-badge{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.cb-badge span{font-size:0.57rem;color:rgba(0,242,255,0.3);
  padding:3px 9px;border:1px solid rgba(0,242,255,0.12);border-radius:20px;}
</style>
</head>
<body>

<!-- TITELSEITE -->
<div id="title-page">
  <p class="tp-label">Bibliothek der Anfänge · Band 1</p>
  <h1 class="tp-title">Vom Planschbecken<br>ins Meer</h1>
  <div class="tp-divider"></div>
  <p class="tp-sub">Tagebuch eines Gehirngeschädigten</p>
  <p class="tp-author">Dirk Schäfer · 2. Auflage 2009</p>
  <button class="tp-start" onclick="showConsent()">Buch öffnen</button>
</div>

<!-- CONSENT -->
<div id="consent">
  <div class="cb">
    <div class="cb-lang">
      <button class="lb active" onclick="setLang('de')">DE</button>
      <button class="lb" onclick="setLang('en')">EN</button>
    </div>
    <div class="cb-title">
      <h1>Aurion · Bibliothek</h1>
      <p id="c-sub"></p>
    </div>
    <div class="cb-phil" id="c-phil"></div>
    <div class="cb-points" id="c-points"></div>
    <button class="cb-priv-btn" id="c-priv-btn"
      onclick="document.getElementById('c-priv').classList.toggle('open')"></button>
    <div class="cb-priv" id="c-priv">
      <h3 id="c-priv-title"></h3>
      <div id="c-priv-body"></div>
    </div>
    <div class="cb-badge" id="c-badge"></div>
    <button class="cb-start" id="c-start" onclick="startReading()"></button>
  </div>
</div>

<script>
const T = {
  de:{
    sub:'Präsenz durch Aufmerksamkeit',
    phil:'Dieses Buch liest sich mit den Augen. Dein Blick ist der Cursor — keine Hände nötig. Für diese Funktion braucht die Seite Zugriff auf deine Kamera.',
    points:[
      {icon:'📷', title:'Kamera',
       text:'Wird zur Blicksteuerung verwendet. Kamerabild bleibt lokal — es wird nichts gespeichert oder übertragen.'},
      {icon:'🎙', title:'Mikrofon',
       text:'Optional für Sprachsteuerung. Nicht erforderlich für das Lesen.'},
      {icon:'🌐', title:'Externe Bibliothek',
       text:'MediaPipe wird einmalig von jsdelivr.net geladen — dabei wird die IP-Adresse kurz übermittelt.'},
    ],
    privBtn:'Datenschutz lesen',
    privTitle:'Datenschutzhinweis',
    privBody:'<strong>Kamerabild:</strong> Echtzeit, lokal, nicht gespeichert, nicht übertragen.<br><br><strong>Mikrofon:</strong> Nur bei aktiver Sprachsteuerung, nicht gespeichert.<br><br><strong>Externe Dienste:</strong> jsdelivr.net — IP-Adresse einmalig beim Laden.<br><br><strong>Rechtsgrundlage:</strong> Einwilligung gem. Art. 6 Abs. 1 lit. a DSGVO.<br><br><strong>Widerruf:</strong> Seite schließen genügt.<br><br><strong>Cookies / localStorage:</strong> Keine.',
    start:'Verstanden &amp; Lesen beginnen',
    badges:['🔒 Kein Server','📱 Nur lokal','📖 Aurion Bibliothek'],
  },
  en:{
    sub:'Presence through Attention',
    phil:'This book reads itself with your eyes. Your gaze is the cursor — no hands needed. For this feature, the page needs access to your camera.',
    points:[
      {icon:'📷', title:'Camera',
       text:'Used for gaze control. The camera image stays local — nothing is stored or transmitted.'},
      {icon:'🎙', title:'Microphone',
       text:'Optional for voice control. Not required for reading.'},
      {icon:'🌐', title:'External Library',
       text:'MediaPipe is loaded once from jsdelivr.net — your IP address is briefly transmitted.'},
    ],
    privBtn:'Read Privacy Notice',
    privTitle:'Privacy Notice',
    privBody:'<strong>Camera image:</strong> Real-time, local, not stored, not transmitted.<br><br><strong>Microphone:</strong> Only when voice control is active, not stored.<br><br><strong>External services:</strong> jsdelivr.net — IP address transmitted once on load.<br><br><strong>Legal basis:</strong> Consent under Art. 6(1)(a) GDPR / UK GDPR.<br><br><strong>Withdrawal:</strong> Closing the page is sufficient.<br><br><strong>Cookies / localStorage:</strong> None.',
    start:'Understood &amp; Start Reading',
    badges:['🔒 No Server','📱 Local Only','📖 Aurion Library'],
  }
};

let lang = 'de';

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lb').forEach(b =>
    b.classList.toggle('active', b.textContent === l.toUpperCase()));
  render();
}

function render() {
  const t = T[lang];
  document.getElementById('c-sub').textContent     = t.sub;
  document.getElementById('c-phil').textContent    = t.phil;
  document.getElementById('c-points').innerHTML    = t.points.map(p =>
    `<div class="cp"><div class="cp-icon">${p.icon}</div>
     <div class="cp-text"><strong>${p.title}</strong>${p.text}</div></div>`
  ).join('');
  document.getElementById('c-priv-btn').textContent  = t.privBtn;
  document.getElementById('c-priv-title').textContent = t.privTitle;
  document.getElementById('c-priv-body').innerHTML    = t.privBody;
  document.getElementById('c-start').innerHTML        = t.start;
  document.getElementById('c-badge').innerHTML        = t.badges.map(b =>
    `<span>${b}</span>`).join('');
}

function showConsent() {
  document.getElementById('consent').classList.add('show');
  render();
}

async function startReading() {
  // Kamera + Mikrofon anfragen bevor Weiterleitung
  try {
    await navigator.mediaDevices.getUserMedia({video:true, audio:true});
  } catch(e) {
    // Nur Kamera versuchen wenn Mikrofon verweigert
    try { await navigator.mediaDevices.getUserMedia({video:true}); } catch(e2) {}
  }
  window.location.href =
    'https://doerkys-bot.github.io/Aurion_the_project/v_p_i_m.html?consent=done';
}
</script>
</body>
</html>
