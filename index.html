<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aurion – Intro mit Spiralen</title>

<style>
:root{
  --bg:#030305;
  --accent:#9fe8ff;
  --text:#aee6ff;
}

html,body{
  height:100%;
  margin:0;
  background:var(--bg);
  overflow:hidden;
  font-family:"Segoe UI",system-ui,Arial,sans-serif;
}

/* Canvas */
#webCanvas{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}

/* Links */
.links{
  position:fixed;
  z-index:3;
  display:none;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

.links a{
  position:relative;
  display:block;
  color:#00f3ff;
  text-decoration:none;
  font-weight:700;
  padding:6px 10px;
  margin:10px 0;
}

/* Kel-Mah */
#kelmah{
  position:absolute;
  width:56px;
  height:56px;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:linear-gradient(
    180deg,
    rgba(0,243,255,0.95),
    rgba(120,220,255,0.7)
  );
  box-shadow:0 0 28px rgba(0,243,255,0.65),
             0 0 6px rgba(255,255,255,0.04) inset;
  z-index:2;
}

/* Mystic Light */
#mysticLight{
  position:absolute;
  width:16px;
  height:16px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(255,255,255,1),
    rgba(0,243,255,0.5));
  z-index:4;
  pointer-events:none;
}

/* Laufschrift */
.marquee{
  position:absolute;
  white-space:nowrap;
  pointer-events:none;
  color:#00f3ff;
  font-weight:700;
}
</style>
</head>

<body>

<canvas id="webCanvas"></canvas>
<div id="kelmah"></div>
<div id="mysticLight"></div>

<div class="links" id="linkContainer">
  <a href="bibliothek.html">Bibliothek</a>
  <a href="resonanzraum.html">Resonanzraum</a>
  <a href="sternenuebung.html">Chi-Sternenübung</a>
  <a href="meditationsraum.html">Meditationsraum</a>
  <a href="ki-raum.html">KI-Raum</a>
  <a href="gaestebuch.html">Gästebuch</a>
</div>

<script>
/* ============================================
   CANVAS INTRO
============================================ */

const canvas=document.getElementById('webCanvas');
const ctx=canvas.getContext('2d');
let W=canvas.width=innerWidth, H=canvas.height=innerHeight;

window.addEventListener('resize',()=>{
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
});

const WEB_COUNT=5,
      RADIUS=Math.min(W,H)*0.28,
      DURATION=4200,
      RINGS=7,
      RADIALS=12;

const COLORS=[
  "rgba(190,220,255,0.95)",
  "rgba(160,200,255,0.9)",
  "rgba(130,185,255,0.85)",
  "rgba(100,170,255,0.72)",
  "rgba(80,150,255,0.62)"
];

const webs=[],particles=[];
let burstHappened=false;
let start=performance.now();

function rand(a,b){return a+Math.random()*(b-a);}
function lerp(a,b,t){return a+(b-a)*t;}

for(let i=0;i<WEB_COUNT;i++){
  const angle=Math.random()*Math.PI*2;
  const dx=Math.cos(angle)*RADIUS*0.18*(Math.random()*0.8+0.2);
  const dy=Math.sin(angle)*RADIUS*0.18*(Math.random()*0.8+0.2);

  webs.push({
    cx:W/2+dx,
    cy:H/2+dy,
    radius:RADIUS*(0.58+Math.random()*0.7),
    rings:RINGS,
    radials:RADIALS,
    color:COLORS[i%COLORS.length],
    phase:Math.random()*Math.PI*2
  });
}

function drawWeb(w,t){
  const rad=w.radius*(0.85+0.15*Math.sin(w.phase+t*6));
  ctx.save();
  ctx.translate(w.cx,w.cy);
  ctx.strokeStyle=w.color;
  ctx.globalAlpha=lerp(0.18,0.95,t);

  for(let r=0;r<w.radials;r++){
    const a=r/w.radials*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad);
    ctx.stroke();
  }
  for(let ring=1;ring<=w.rings;ring++){
    ctx.beginPath();
    ctx.arc(0,0,rad*ring/(w.rings+0.2),0,Math.PI*2);
    ctx.stroke();
  }
  ctx.restore();
}

function burstWeb(w){
  for(let r=0;r<w.radials;r++){
    const a=r/w.radials*Math.PI*2;
    const speed=2+Math.random()*3;

    particles.push({
      x: w.cx+Math.cos(a)*w.radius*0.6,
      y: w.cy+Math.sin(a)*w.radius*0.6,
      vx: Math.cos(a)*speed*(0.8+Math.random()*0.6),
      vy: Math.sin(a)*speed*(0.8+Math.random()*0.6),
      born: performance.now(),
      life: 800+Math.random()*900,
      color: w.color,
      size: 2+Math.random()*2
    });
  }
}

function loop(now){
  const elapsed=now-start;
  ctx.clearRect(0,0,W,H);

  if(!burstHappened){
    const t=Math.min(1,elapsed/DURATION);
    webs.forEach(w=>drawWeb(w,t));
  }

  const nowMs=performance.now();
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    const age=nowMs-p.born;

    if(age>p.life){particles.splice(i,1); continue;}

    const t=age/p.life;

    p.vx*=0.995;
    p.vy*=0.995;
    p.vy+=0.012;
    p.x+=p.vx;
    p.y+=p.vy;

    ctx.globalAlpha=1-t;
    ctx.fillStyle=p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size*(1-0.3*t),0,Math.PI*2);
    ctx.fill();
  }

  ctx.globalAlpha=1;

  if(!burstHappened && elapsed>=DURATION){
    burstHappened=true;
    webs.forEach(w=>burstWeb(w));
    setTimeout(afterBurst,420);
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* ============================================
   NACH DEM BURST
============================================ */

function afterBurst(){
  canvas.style.display='none';
  document.getElementById('linkContainer').style.display='block';

  startKelMahSpirals();
  moveMysticLight();
  startMarquee();  // <<<<<<<< LAUFSCHRIFT START
}

/* ============================================
   KEL-MAH SPIRALEN
============================================ */

const kel=document.getElementById('kelmah');

function startKelMahSpirals(){
  setInterval(()=>{
    kel.style.transform=
      `translate(-50%,-50%) scale(${1+0.2*Math.sin(performance.now()/300)})`;
  },90);
}

/* ============================================
   MYSTIC LIGHT
============================================ */

const light=document.getElementById('mysticLight');

function moveMysticLight(){
  const sx=Math.random()*(W-16);
  const sy=Math.random()*(H-16);
  const ex=Math.random()*(W-16);
  const ey=Math.random()*(H-16);
  const duration=12000;
  let t0=performance.now();

  function anim(t){
    let k=(t-t0)/duration;
    if(k>=1){moveMysticLight();return;}

    light.style.left = sx+(ex-sx)*k+"px";
    light.style.top  = sy+(ey-sy)*k+"px";
    light.style.transform=`scale(${1+0.2*Math.sin(k*Math.PI*4)})`;

    requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
}

/* ============================================
   LAUFSCHRIFT
============================================ */

function startMarquee(){
  const links = document.querySelectorAll('#linkContainer a');
  const center = W/2;
  const offset = 57;

  links.forEach(link=>{
    const rect = link.getBoundingClientRect();
    const linkCenter = rect.left + rect.width/2;

    const isLeft = linkCenter < center;

    const baseX = link.offsetLeft;
    const startX = isLeft ? baseX + offset : baseX - offset;
    const endX   = baseX;

    const span=document.createElement("span");
    span.className="marquee";
    span.innerText=link.innerText;
    span.style.left=startX+"px";
    span.style.top=link.offsetTop+"px";

    link.parentElement.appendChild(span);

    let start=null;
    const duration=6000+Math.random()*3000;

    function run(ts){
      if(!start) start=ts;
      let t=(ts-start)/duration;

      if(t<1){
        span.style.left = startX + (endX-startX)*t + "px";
        requestAnimationFrame(run);
      }else{
        span.style.left = startX+"px";
        start = performance.now();
        requestAnimationFrame(run);
      }
    }

    requestAnimationFrame(run);
  });
}

</script>

</body>
</html>
