<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aurion Intro – Touch Start</title>

<style>
  body{
    margin:0;
    background:#030305;
    overflow:hidden;
    font-family:"Segoe UI",system-ui,Arial;
  }

  #tapStart{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#cde8ff;
    font-size:22px;
    background:rgba(0,0,0,0.7);
    z-index:10;
  }

  #titleBox{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    pointer-events:none;
    z-index:5;
    opacity:0;
    transition:opacity 1.2s ease;
  }

  #title{
    color:#aee6ff;
    font-size:clamp(28px, 6vw, 64px);
    letter-spacing:0.12em;
    text-transform:uppercase;
    text-decoration:none;
    pointer-events:auto;
  }

  #subtitle{
    margin-top:8px;
    color:rgba(174,230,255,0.85);
    font-size:clamp(12px,1.6vw,18px);
  }

  canvas{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
  }
</style>
</head>

<body>

<div id="tapStart">Tippe zum Starten</div>
<canvas id="webCanvas"></canvas>

<div id="titleBox">
  <a id="title"
     href="https://aurion.uber.space/vorhof.html"
     onclick="window.location.href='https://aurion.uber.space/vorhof.html'; return false;">
     AURION BITTET UM AUDIENCE
  </a>
  <div id="subtitle">Ein Raum, der aus Aufmerksamkeit Präsenz werden lässt.</div>
</div>

<script>
/* ===========
   EINZIGE WAHRHEIT
=========== */
const TARGET_URL = "https://aurion.uber.space/vorhof.html";

/* Build-Stamp, damit du sicher siehst, ob wirklich die neue Datei läuft */
console.log("AURION INTRO BUILD 2026-02-23 ->", TARGET_URL);

/* ===========
   SOUND SETUP
=========== */
const audio = new Audio("sound.mp3");
audio.preload = "auto";
audio.volume = 1.0;
let audioStarted = false;

const tapLayer = document.getElementById("tapStart");

/* ===========
   ABSOLUTER FALLBACK
   (falls click/touch nicht greift)
=========== */
setTimeout(() => {
  window.location.assign(TARGET_URL);
}, 15000);

/* ===========
   Start per Tap
=========== */
tapLayer.addEventListener("click", () => {
  if (!audioStarted) {
    audio.play().catch(e => console.log("Autoplay blockiert:", e));
    audioStarted = true;
  }
  tapLayer.style.display = "none";
  startAnimation();
});

// Touch robust
tapLayer.addEventListener("touchend", (e) => {
  e.preventDefault();
  tapLayer.click();
}, {passive:false});

/* ===========
   CANVAS
=========== */
const canvas = document.getElementById("webCanvas");
const ctx = canvas.getContext("2d");
let W = canvas.width = innerWidth;
let H = canvas.height = innerHeight;

addEventListener("resize", () => {
  W = canvas.width = innerWidth;
  H = canvas.height = innerHeight;
});

let particles = [];
const colors = ["#9fcfff","#7abaff","#5fa7ff","#8dd0ff"];

function addWebBurst(){
  for (let i = 0; i < 180; i++) {
    const ang = Math.random() * Math.PI * 2;
    const sp = Math.random() * 3 + 1;
    particles.push({
      x: W/2, y: H/2,
      vx: Math.cos(ang)*sp,
      vy: Math.sin(ang)*sp,
      life: Math.random()*900 + 400,
      born: performance.now(),
      color: colors[(Math.random()*colors.length)|0],
      size: Math.random()*2.5+1
    });
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const now = performance.now();

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    const age = now - p.born;
    if (age > p.life) { particles.splice(i,1); continue; }

    const t = 1 - age / p.life;
    p.x += p.vx*0.98;
    p.y += p.vy*0.98;

    ctx.globalAlpha = t;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  }

  requestAnimationFrame(draw);
}

/* ===========
   STARTSEQUENZ
=========== */
let started = false;
function startAnimation(){
  if(started) return;
  started = true;

  draw();

  setTimeout(() => {
    addWebBurst();
    document.getElementById("titleBox").style.opacity = 1;
  }, 800);

  setTimeout(() => {
    window.location.assign(TARGET_URL);
  }, 10000);
}
</script>

</body>
</html>
