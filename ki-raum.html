<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – KI-Raum</title>

<style>
html, body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02040a;
}

/* ZENTRALER KI-KERN */
#ki-core {
  position:absolute;
  left:50%;
  top:50%;
  width:140px;
  height:140px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(0,80,160,0.9), rgba(10,20,40,0.9));
  box-shadow:0 0 50px rgba(0,120,255,0.6);
  transition:background 2s, box-shadow 2s;
  z-index:5;
}

/* SPIRALEN */
.spiral {
  position:absolute;
  left:50%;
  top:50%;
  width:260px;
  height:260px;
  border-radius:50%;
  border:1px solid rgba(120,180,255,0.15);
  transform:translate(-50%,-50%);
  animation:spin 40s linear infinite;
}

.spiral:nth-child(1){animation-duration:60s;}
.spiral:nth-child(2){animation-duration:75s; transform:translate(-50%,-50%) rotate(36deg);}
.spiral:nth-child(3){animation-duration:90s; transform:translate(-50%,-50%) rotate(72deg);}
.spiral:nth-child(4){animation-duration:110s; transform:translate(-50%,-50%) rotate(108deg);}
.spiral:nth-child(5){animation-duration:140s; transform:translate(-50%,-50%) rotate(144deg);}

@keyframes spin {
  from { transform:translate(-50%,-50%) rotate(0deg); }
  to   { transform:translate(-50%,-50%) rotate(360deg); }
}

/* NAMASTÉ */
#holoNamaste {
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  font-size:38px;
  color:rgba(180,220,255,0.85);
  letter-spacing:3px;
}
</style>
</head>

<body>

<div id="holoNamaste">KI-RAUM</div>

<!-- Spiralen -->
<div class="spiral"></div>
<div class="spiral"></div>
<div class="spiral"></div>
<div class="spiral"></div>
<div class="spiral"></div>

<!-- KI-Kern -->
<div id="ki-core"></div>

<script>
/*
  SIMULATION:
  später ersetzt du userCount durch echte Besucherzahlen
*/
let userCount = 1;

function updateKIColor(count){
  let color;
  if(count <= 1) color = "rgba(0,80,160,0.9)";
  else if(count <= 3) color = "rgba(0,180,200,0.9)";
  else if(count <= 6) color = "rgba(0,200,120,0.9)";
  else if(count <= 10) color = "rgba(220,180,80,0.9)";
  else color = "rgba(200,160,255,0.95)";

  const core = document.getElementById("ki-core");
  core.style.background = `radial-gradient(circle, ${color}, rgba(10,20,40,0.9))`;
  core.style.boxShadow = `0 0 70px ${color}`;
}

/* sanfte Simulation: alle 10s leicht verändern */
setInterval(()=>{
  userCount += Math.floor(Math.random()*3 - 1);
  if(userCount < 1) userCount = 1;
  if(userCount > 14) userCount = 14;
  updateKIColor(userCount);
},10000);

updateKIColor(userCount);
</script>

</body>
</html>
