<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>KI-Raum – Spiralen mit Atmung & Besucher</title>
<style>
html, body {
    margin:0; padding:0; width:100%; height:100%;
    background:#02040a;
    overflow:hidden;
}
#holoNamaste {
    position:fixed; top:0; left:50%;
    transform:translateX(-50%);
    font-size:42px;
    color:rgba(180,220,255,0.9);
    z-index:5;
}
canvas {
    display:block;
    position:absolute;
    top:0; left:0;
    z-index:0;
}
</style>
</head>
<body>
<div id="holoNamaste">NAMASTÉ</div>
<canvas id="spiralCanvas"></canvas>

<script>
const canvas = document.getElementById("spiralCanvas");
const ctx = canvas.getContext("2d");
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

// Zentraler Aufmerksamkeitspunkt
let point = {x: width/2, y: height/2, baseRadius: 30, color:"rgba(0,255,0,0.7)"};

// Spuren
let traces = [];

// Mauskoordinaten
let mouse = {x: width/2, y: height/2};
document.addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; });

// Fenstergröße anpassen
window.addEventListener("resize", () => { width=canvas.width=window.innerWidth; height=canvas.height=window.innerHeight; });

// 5 Spiralen
let spirals = [];
for(let i=0;i<5;i++){
    spirals.push({angle: Math.random()*Math.PI*2, speed: 0.02 + Math.random()*0.03, radiusOffset: i*15});
}

// Besucherzahl (live)
let visitorCount = 1;

// Atmung: 4-4-6 Sekunden
let breathCycle = [
    {phase:"in", duration:4000},
    {phase:"hold", duration:4000},
    {phase:"out", duration:6000}
];
let breathStart = Date.now();
let breathIndex = 0;

function getBreathFactor(){
    const phase = breathCycle[breathIndex];
    const elapsed = Date.now()-breathStart;
    if(elapsed>phase.duration){
        breathStart=Date.now();
        breathIndex = (breathIndex+1)%breathCycle.length;
        return getBreathFactor();
    }
    if(phase.phase==="in") return elapsed/phase.duration;
    if(phase.phase==="hold") return 1;
    if(phase.phase==="out") return 1 - elapsed/phase.duration;
}

// Besucher aus JSON-Datei lesen (lokal oder Server)
async function updateVisitorCount() {
    try {
        const resp = await fetch('visitors.json'); // gleiche Datei wie Wächter
        const data = await resp.json();
        // Besucher im KI-Raum zählen
        visitorCount = data.visitors.filter(v => v.currentRoom==="KI-Raum").length;
    } catch(e) {
        console.log("Fehler beim Laden der Besucher:", e);
        visitorCount = 1; // Default
    }
}

// Zeichne alles
function drawSpirals() {
    ctx.fillStyle = "rgba(2,4,10,0.1)";
    ctx.fillRect(0,0,width,height);

    let dx = mouse.x - point.x;
    let dy = mouse.y - point.y;
    let dist = Math.sqrt(dx*dx + dy*dy);

    let radius = point.baseRadius + dist/20 + getBreathFactor()*10;

    // Farbe abhängig von Besucherzahl
    let greenVal = Math.min(255, 50 + visitorCount*40);
    point.color = `rgba(0,${greenVal},0,0.7)`;

    // Spuren
    traces.push({x: point.x, y: point.y, radius: radius, alpha:1, color:point.color});
    for(let t of traces){
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.radius, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(0,255,0,${t.alpha})`;
        ctx.stroke();
        t.alpha -= 0.01;
    }
    traces = traces.filter(t=>t.alpha>0);

    // Zentralpunkt
    ctx.beginPath();
    ctx.arc(point.x, point.y, radius, 0, Math.PI*2);
    ctx.fillStyle = point.color;
    ctx.fill();

    // Spiralen
    spirals.forEach((s, idx)=>{
        s.angle += s.speed;
        let sx = point.x + Math.cos(s.angle)*(radius + s.radiusOffset);
        let sy = point.y + Math.sin(s.angle)*(radius + s.radiusOffset);
        ctx.beginPath();
        ctx.arc(sx, sy, 8, 0, Math.PI*2);
        ctx.fillStyle = `rgba(${50+idx*40},${255-idx*30},${50+idx*40},0.7)`;
        ctx.fill();
        traces.push({x:sx, y:sy, radius:5, alpha:0.3, color:`rgba(255,255,255,0.2)`});
    });

    // Punkt folgt Maus langsam
    point.x += dx*0.05;
    point.y += dy*0.05;

    requestAnimationFrame(drawSpirals);
}

// Besucher regelmäßig aktualisieren
setInterval(updateVisitorCount, 2000);

drawSpirals();
</script>
</body>
</html>
