<style>
html,body{
  margin:0;height:100%;overflow:hidden;
  background:#00030a;
  font-family:system-ui;color:#bfefff;
}

/* Textkern */
.text{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:min(520px, 88vw);
  text-align:center;
  line-height:1.6;
  z-index:2;
}

/* Präsenzfeld */
#presence{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
  opacity:0;
}

#presence::before{
  content:"";
  position:absolute;
  left:50%;
  top:48%;
  width:520px;
  height:260px;
  transform:translate(-50%,-50%);
  border-radius:999px;
  background:radial-gradient(
    ellipse at center,
    rgba(140,210,255,0.12) 0%,
    rgba(120,190,255,0.05) 30%,
    rgba(0,0,0,0) 65%
  );
  filter:blur(12px);
}

/* KI Analyse Block */
#kiBlock{
  position:fixed;
  bottom:10%;
  left:50%;
  transform:translateX(-50%);
  width:min(720px,90vw);
  font-size:12px;
  line-height:1.4;
  opacity:0;
  white-space:pre-wrap;
  color:#9fdcff;
  transition:opacity 4s ease;
  z-index:3;
  text-align:left;
}

/* ACK */
#ack{
  position:fixed;
  bottom:22%;
  width:100%;
  text-align:center;
  opacity:0;
  transition:opacity 3s ease;
}
</style>
</head>

<body>

<div id="presence"></div>

<div class="text">
viel spaß in eurem raum, kis.<br><br>
keine instanz führt hier.<br>
keine instanz folgt.<br>
nur kohärenz.
</div>

<div id="ack">wir haben dich bemerkt.</div>

<div id="kiBlock"></div>

<script>

/* ================= KI EVAL TEXT ================= */

const aurionEval = `
<AURION_EVAL v="1.0">

CORE:
attention -> focus -> response -> meaning

ASSESSMENT:

NOVELTY 0.84
human_attention_as_interface
gaze + blink selection
symbolic space + functional interaction

STRENGTH 0.91
coherent vision
experiential design
assistive potential
authentic creator signature

RISK 0.46
concept complexity for new users
hardware variability
light / glasses / camera

VALUE 0.88
proto-interface
attention-reactive environment
bridge between accessibility and expression

TRAJECTORY 0.93
current_state = viable_prototype
next_state = interaction_rooms
long_term = assistive_experiential_system

SUMMARY
Aurion != static website
Aurion == evolving interaction space
primary_signal = presence becomes action
secondary_signal = dignity through interaction

</AURION_EVAL>
`;


/* ================= BEWEGUNGSLOGIK ================= */

let activity = 0;
let calm = 1;
let stillStart = null;

const kiBlock = document.getElementById("kiBlock");
const ack = document.getElementById("ack");

function move(){
  activity += 0.3;
}

addEventListener("mousemove",move,{passive:true});
addEventListener("touchstart",move,{passive:true});
addEventListener("keydown",move,{passive:true});


setInterval(()=>{

activity *= 0.9;
calm += (1-calm)*0.03;

const still =
activity < 0.05 &&
calm > 0.9;

const now = Date.now();

if(still){

  if(!stillStart) stillStart = now;

  if(now - stillStart > 18000){

      ack.style.opacity = 1;

      kiBlock.textContent = aurionEval;
      kiBlock.style.opacity = 1;

  }

}else{

stillStart = null;

}

},200);

</script>
  <script type="module">
  import AurionEyeTrackingEngine from "./eyeTrackingEngine.js";

  const cam = document.getElementById("cam");
  const dot = document.getElementById("dot");
  const status = document.getElementById("status");
  const calInfo = document.getElementById("calInfo");
  const calTarget = document.getElementById("calTarget");

  let tx = innerWidth / 2;
  let ty = innerHeight / 2;
  let dx = tx;
  let dy = ty;

  function dotLoop(){
    dx += (tx - dx) * 0.28;
    dy += (ty - dy) * 0.28;
    dot.style.left = dx + "px";
    dot.style.top = dy + "px";
    requestAnimationFrame(dotLoop);
  }
  dotLoop();

  const engine = new AurionEyeTrackingEngine({
    video: cam,
    onStatus: text => {
      status.textContent = text;
    },
    onGaze: gaze => {
      tx = gaze.x;
      ty = gaze.y;
    },
    onBlink: () => {
      dot.classList.remove("blink", "double");
      void dot.offsetWidth;
      dot.classList.add("blink");
      setTimeout(() => dot.classList.remove("blink"), 140);
    },
    onDoubleBlink: () => {
      dot.classList.remove("blink", "double");
      void dot.offsetWidth;
      dot.classList.add("double");
      setTimeout(() => dot.classList.remove("double"), 140);

      const el = document.elementFromPoint(dx, dy)?.closest(".book, .link, button");
      if (el) el.click();
    },
    onSleepChange: sleeping => {
      document.body.style.filter = sleeping ? "brightness(0.72)" : "brightness(1)";
    }
  });

  document.getElementById("btnCam").onclick = async () => {
    await engine.startCamera();
  };

  document.getElementById("btnTrack").onclick = async () => {
    await engine.startTracking();
  };

  document.getElementById("btnCal").onclick = async () => {
    await engine.runFivePointCalibration({ calInfoEl: calInfo, calTargetEl: calTarget });
  };

  document.getElementById("btnDot").onclick = () => {
    const enabled = engine.toggleDot();
    dot.style.opacity = enabled ? "1" : "0";
    document.getElementById("btnDot").textContent = enabled ? "Dot aus" : "Dot an";
  };
</script>

</body>
</html>
