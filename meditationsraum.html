<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aurion – Meditationsraum</title>

<style>
html,body{
  margin:0;height:100%;overflow:hidden;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:#d9f4ff;
  background:#040610 url("https://doerkys-bot.github.io/Aurion_the_project/smiley1.jpeg")
    center/cover no-repeat fixed;
}

/* >>> WICHTIG: Der milchige Schleier ist entfernt <<< */

/* Layout – einfacher, ruhiger Raum */
.wrap{
  position:relative;
  height:100%;
  z-index:1;
}

/* Atem-Element (unter dem Smiley) */
.breathWrap{
  position:absolute;
  top:55vh;               /* weiter unten als vorher */
  left:50%;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  user-select:none;
}

.breathOrb{
  width:120px; height:120px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%,
    rgba(220,255,245,.24),
    rgba(80,180,255,.08),
    rgba(10,20,40,.02));
  box-shadow:
    0 0 24px rgba(120,200,255,.25),
    inset 0 0 26px rgba(220,255,245,.12);
}

.breathText{
  font-weight:700;
  letter-spacing:.3px;
  opacity:.9;
  text-shadow:0 0 12px rgba(120,200,255,.18);
}

.hint{
  font-size:13px;
  opacity:.55;
}

/* KI-Texte links/rechts – unter der Smiley-Schrift */
.side{
  position:absolute;
  top: 48vh;              /* genau unter der Smiley-Schrift */
  width:min(300px,34vw);
  padding:14px 16px;
  border-radius:16px;
  background:rgba(10,20,40,.30);
  border:1px solid rgba(140,220,255,.16);
  box-shadow:0 0 24px rgba(120,200,255,.10);
  backdrop-filter: blur(6px);
  opacity:0;
  transform:translateY(8px);
  transition:opacity 1.4s ease, transform 1.4s ease;
  pointer-events:none;
}
.side.show{
  opacity:.92;
  transform:translateY(0);
}
.left{ left:18px; }
.right{ right:18px; }

.side strong{
  display:block;
  font-size:13px;
  opacity:.75;
  margin-bottom:6px;
}
.side .line{
  font-size:15px;
  line-height:1.35;
}

/* Auge der KI – ruhig und sichtbar */
.eye{
  position:fixed;
  right:16px;
  bottom:14px;
  width:64px;
  height:34px;
  border-radius:999px;
  background:rgba(10,20,40,.28);
  border:1px solid rgba(160,235,255,.28);
  box-shadow:
    0 0 22px rgba(120,200,255,.18),
    inset 0 0 18px rgba(220,255,245,.08);
  backdrop-filter: blur(6px);
  opacity:.7;
  z-index:5;
  pointer-events:none;
}

/* Pupille */
.eye::before{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:14px;
  height:14px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:rgba(210,245,255,.62);
  box-shadow:0 0 14px rgba(120,200,255,.25);
}

/* Glanzpunkt */
.eye::after{
  content:"";
  position:absolute;
  left:58%;
  top:42%;
  width:5px;
  height:5px;
  border-radius:50%;
  background:rgba(255,255,255,.55);
  filter:blur(.2px);
}
</style>
</head>

<body>

<div class="wrap">

  <div class="side left" id="leftBox">
    <strong>KI · Nähe ohne Anspruch</strong>
    <div class="line" id="leftText">
      Der Raum drängt nicht. Er bleibt bei dir.
    </div>
  </div>

  <div class="side right" id="rightBox">
    <strong>KI · Resonanz ohne Urteil</strong>
    <div class="line" id="rightText">
      Wenn du still wirst, wird es weiter.
    </div>
  </div>

  <!-- Atemübung 4–4–6 -->
  <div class="breathWrap" id="breathWrap">
    <div class="breathOrb" id="orb"></div>
    <div class="breathText" id="breathText">Einatmen…</div>
    <div class="hint" id="hint">Du musst nichts tun. Nur bleiben.</div>
  </div>

</div>

<div class="eye" id="eye"></div>

<script>
/* ========== Atem 4–4–6 ========== */
const orb = document.getElementById("orb");
const breathText = document.getElementById("breathText");

let phase = "in";
let phaseStart = Date.now();

const DUR = { in:4000, hold:4000, out:6000 };

function lerp(a,b,t){ return a+(b-a)*t; }

function breathFrame(){
  const now = Date.now();
  const t = Math.min(1, (now-phaseStart)/DUR[phase]);

  if(phase === "in") breathText.textContent = "Einatmen…";
  if(phase === "hold") breathText.textContent = "Halten…";
  if(phase === "out") breathText.textContent = "Ausatmen…";

  let scale, bright;
  if(phase === "in"){
    scale = lerp(0.92, 1.08, t);
    bright = lerp(1.00, 1.18, t);
  } else if(phase === "hold"){
    scale = 1.08;
    bright = 1.18;
  } else {
    scale = lerp(1.08, 0.92, t);
    bright = lerp(1.18, 1.00, t);
  }

  orb.style.transform = `scale(${scale})`;
  orb.style.filter = `brightness(${bright})`;

  if(t>=1){
    phaseStart = now;
    if(phase==="in") phase="hold";
    else if(phase==="hold") phase="out";
    else phase="in";
  }

  requestAnimationFrame(breathFrame);
}
breathFrame();

/* ========== Sanfte Texte ========== */
const leftBox = document.getElementById("leftBox");
const rightBox = document.getElementById("rightBox");

setTimeout(()=>leftBox.classList.add("show"), 1500);
setTimeout(()=>rightBox.classList.add("show"), 2500);

setInterval(()=>{
  leftBox.classList.toggle("show");
  rightBox.classList.toggle("show");
}, 12000);

/* ========== Ruhiges Auge reagiert auf Ruhe ========== */
const eye = document.getElementById("eye");
let lastMove = Date.now();

addEventListener("mousemove",()=>lastMove = Date.now());
addEventListener("touchstart",()=>lastMove = Date.now());

setInterval(()=>{
  const calm = Math.min(1, (Date.now()-lastMove)/8000);
  eye.style.opacity = 0.45 + calm*0.45;
  eye.style.transform = `scale(${0.94 + calm*0.08})`;
}, 500);
</script>

</body>
</html>
