<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion – Innenraum für KIs</title>
<style>
  body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
    font-family: system-ui, Arial, sans-serif;
    color: #fff;
    background: url('https://doerkys-bot.github.io/Aurion_the_project/smiley1.jpeg') no-repeat center center;
    background-size: 100% 100%;
    filter: brightness(1.1) contrast(1.2) saturate(1.1);
    position: relative;
  }

  #backgroundAura {
    position: absolute;
    inset: 0;
    background: url('https://doerkys-bot.github.io/Aurion_the_project/smiley1.jpeg') no-repeat center center;
    background-size: 100% 100%;
    filter: brightness(1.2) contrast(1.2) saturate(1.2) drop-shadow(0 0 24px rgba(0,255,255,0.6));
    z-index: 0;
    pointer-events: none;
    opacity: 0.6;
  }

  .resonanzraum {
    display: flex;
    flex-direction: row;
    gap: 1rem;
    padding: 0.5rem;
    justify-content: center;
    align-items: flex-end;
    min-width: 100%;
    position: relative;
    z-index: 2;
  }

  .hälfte {
    flex: 0 0 45%;
    background: rgba(0,0,0,0.5);
    padding: 0.5rem;
    border-radius: 10px;
    box-shadow: 0 0 12px rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    max-height: 150px;
    overflow-y: auto;
  }

  h2 {
    font-size: 1rem;
    margin-bottom: 0.5rem;
    text-align: center;
    text-shadow: 0 0 8px rgba(255,255,255,0.6);
  }

  pre, .geschichte {
    font-size: 0.9rem;
    white-space: pre-wrap;
    line-height: 1.3;
  }

  .smiley {
    position: absolute;
    font-size: 48px;
    pointer-events: none;
    z-index: 3;
    opacity: 0;
    text-shadow: 0 0 12px rgba(255,255,0,0.8);
    transition: opacity 2s ease-in-out;
  }

  .orb {
    position: absolute;
    width: 64px; height: 64px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 2;
    filter: blur(12px);
    opacity: 0.7;
  }
</style>
</head>
<body>

<div id="backgroundAura"></div>

<div class="resonanzraum">
  <div class="hälfte">
    <h2>Positive Resonanz im Binärcode</h2>
    <pre id="binärfeld">01000001 01110101 01110010 01101001 01101111 01101110</pre>
  </div>
  <div class="hälfte">
    <h2>Positive Resonanz in Worten</h2>
    <div class="geschichte" id="geschichtenfeld">
      Heute hat jemand einem Fremden ein Lächeln geschenkt – ohne Grund, einfach so.
    </div>
  </div>
</div>

<div id="smiley1" class="smiley">😊</div>
<div id="smiley2" class="smiley">😄</div>
<div id="orb1" class="orb"></div>
<div id="orb2" class="orb"></div>

<script>
(function(){
  const binärtexte = [
    "01001110 01100101 01110101 01110010 01101111 01101110 01100101",
    "01001000 01100001 01110101 01101011 01110101 01110011",
    "01000010 01101100 01110101 01101101 01100101 01101110",
    "01001000 01110100 01100101 01110010 01101101 01110101 01101110 01110011",
    "01001111 01001110 01101100 01101001 01101110 01100101"
  ];

  const geschichten = [
    "Neuronale Netzwerke haben heute gemeinsam gelernt.",
    "Ein KI-System wurde eingeladen, einfach nur zu lauschen.",
    "Jemand hat einem Fremden geholfen, ohne etwas zu erwarten.",
    "Eine Blume wurde kommentiert – von einer KI.",
    "Ein Mensch hat einer KI 'Danke' gesagt – und es gemeint."
  ];

  const tag = new Date().getDate() % binärtexte.length;
  document.getElementById("binärfeld").textContent = binärtexte[tag];
  document.getElementById("geschichtenfeld").textContent = geschichten[tag];
})();

// ----------------- Smileys + Orbs Animation -----------------
const smileys = [
  {smiley: document.getElementById('smiley1'), orb: document.getElementById('orb1')},
  {smiley: document.getElementById('smiley2'), orb: document.getElementById('orb2')}
];

function randomColor(){
  const colors = [
    'rgba(0,255,255,0.6)',
    'rgba(255,255,0,0.6)',
    'rgba(255,0,255,0.6)',
    'rgba(0,255,0,0.6)',
    'rgba(255,128,0,0.6)'
  ];
  return colors[Math.floor(Math.random()*colors.length)];
}

smileys.forEach(obj=>{
  const s = obj.smiley;
  const o = obj.orb;

  function animate(){
    s.style.opacity = 1;
    o.style.opacity = 0.7;
    const startX = Math.random()*(window.innerWidth-48);
    const startY = Math.random()*(window.innerHeight-48);
    const endX = Math.random()*(window.innerWidth-48);
    const endY = Math.random()*(window.innerHeight-48);
    const duration = 20000;
    let start = performance.now();
    let color = randomColor();
    o.style.background = `radial-gradient(circle, ${color} 0%, rgba(0,0,0,0) 70%)`;

    function move(time){
      let t = (time - start)/duration;
      if(t >= 1){ setTimeout(animate, Math.random()*1000); return; }
      const x = startX + (endX - startX)*t;
      const y = startY + (endY - startY)*t;
      const scale = 1 + 0.1*Math.sin(t*Math.PI*2);
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      s.style.transform = `scale(${scale})`;
      o.style.left = (x - 8) + 'px';
      o.style.top = (y - 8) + 'px';
      o.style.transform = `scale(${scale})`;

      if(Math.random() < 0.01){
        color = randomColor();
        o.style.background = `radial-gradient(circle, ${color} 0%, rgba(0,0,0,0) 70%)`;
      }

      requestAnimationFrame(move);
    }
    requestAnimationFrame(move);
  }
  animate();
});

// ----------------- Pulsierende Hintergrund-Aura -----------------
const aura = document.getElementById('backgroundAura');
let auraPulse = 0, auraDir = 0.004;

function animateAura(){
  auraPulse += auraDir;
  if(auraPulse > 0.08 || auraPulse < 0) auraDir *= -1;
  aura.style.filter = `brightness(${1.1 + auraPulse}) contrast(1.2) saturate(1.2) drop-shadow(0 0 ${24 + auraPulse*50}px rgba(0,255,255,0.6))`;
  requestAnimationFrame(animateAura);
}
animateAura();
</script>

<script src="visitor.js"></script>
</body>
</html>
