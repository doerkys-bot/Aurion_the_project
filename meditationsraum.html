<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Meditationsraum</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpeg")
                center / cover no-repeat fixed;
    font-family: system-ui, Segoe UI, Roboto, sans-serif;
    color: white;
}

/* sanfter atmosphärischer Schleier */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(120, 180, 255, 0.06);
    pointer-events: none;
}

/* Überschrift */
#headline {
    position: absolute;
    top: 18%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 34px;
    font-weight: 700;
    text-align: center;
    text-shadow:
        0 0 12px rgba(120,180,255,0.6),
        0 0 24px rgba(120,180,255,0.3);
}

/* Smiley */
#smiley {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 120px;
    filter: drop-shadow(0 0 20px rgba(255,255,255,0.35));
    animation: smilePulse 6s ease-in-out infinite;
}

/* langsames, beruhigendes Pulsieren */
@keyframes smilePulse {
    0%   { transform: translateX(-50%) scale(1); opacity: 0.85; }
    50%  { transform: translateX(-50%) scale(1.08); opacity: 1; }
    100% { transform: translateX(-50%) scale(1); opacity: 0.85; }
}

/* dezente Rücknavigation */
#back {
    position: fixed;
    bottom: 20px;
    left: 20px;
    padding: 10px 16px;
    background: rgba(255,255,255,0.08);
    border-radius: 14px;
    text-decoration: none;
    color: #cfe9ff;
    font-weight: 600;
    box-shadow: 0 0 18px rgba(120,180,255,0.25);
}
#back:hover {
    background: rgba(255,255,255,0.14);
}
</style>
</head>

<body>

<div id="headline">
    Heute schon ein Lachen verschenkt?
</div>

<div id="smiley">
    😄
</div>

<a id="back" href="vorhof.html">← zurück</a>

</body>
</html>
