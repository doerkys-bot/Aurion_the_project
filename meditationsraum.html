cat <<'EOF' > ~/html/meditationsraum.html
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurion – Ankunft (Bewegung)</title>

<style>
:root{
  --img: url("https://doerkys-bot.github.io/Aurion_the_project/smiley1.jpeg");

  /* linke Schläfe + Offset */
  --tx: calc(34% + 25px);
  --ty: calc(33% + 38px);

  /* Patch */
  --r: 190px;
  --p: 0;

  /* Power */
  --push: 1.6;

  /* Ankunfts-Impuls (0..1, einmalig) */
  --arrive: 0;
}

html,body{
  margin:0;height:100%;overflow:hidden;background:#000;
}

/* Smiley bleibt ruhig */
body{
  background-image: var(--img);
  background-repeat:no-repeat;
  background-position:center 35%;
  background-size:100%;
}

/* ===== PATCH ===== */
.templePatch{
  position:fixed; inset:0; pointer-events:none; z-index:2;
  background-image: var(--img);
  background-repeat:no-repeat;
  background-position:center 35%;
  background-size:100%;

  -webkit-mask-image:
    radial-gradient(circle var(--r) at var(--tx) var(--ty),
      #000 0%, #000 65%, transparent 82%);
  mask-image:
    radial-gradient(circle var(--r) at var(--tx) var(--ty),
      #000 0%, #000 65%, transparent 82%);

  transform-origin: var(--tx) var(--ty);

  /* Körperliche Bewegung */
  transform:
    translate(
      calc((var(--p) - 0.5) * 3.5px * var(--push)
           + var(--arrive) * -4px),
      calc((0.5 - var(--p)) * 2.5px * var(--push))
    )
    scale(
      calc(
        1
        + var(--p) * 0.028 * var(--push)
        + var(--arrive) * 0.06
      )
    );

  filter:
    contrast(calc(1 + var(--p) * 0.08 + var(--arrive) * 0.10))
    saturate(calc(1 + var(--p) * 0.05));
}

/* ===== TIEFE / MULDE ===== */
.templeDepth{
  position:fixed; inset:0; pointer-events:none; z-index:3;

  -webkit-mask-image:
    radial-gradient(circle var(--r) at var(--tx) var(--ty),
      #000 0%, #000 65%, transparent 84%);
  mask-image:
    radial-gradient(circle var(--r) at var(--tx) var(--ty),
      #000 0%, #000 65%, transparent 84%);

  background:
    radial-gradient(
      circle calc(var(--r) * 0.75) at var(--tx) var(--ty),
      rgba(0,0,0,
        calc(
          0.14
          + var(--p) * 0.32 * var(--push)
          + var(--arrive) * 0.28
        )
      ),
      rgba(0,0,0,0) 72%
    );

  mix-blend-mode:multiply;
  opacity:.95;
}
</style>
</head>

<body>
<div class="templePatch"></div>
<div class="templeDepth"></div>

<script>
(() => {
  const root = document.documentElement;
  const set = (n,v)=>root.style.setProperty(n,v);
  const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
  const ease=(k)=>k*k*(3-2*k);

  /* 4-4-6 */
  const IN=4000, HOLD=4000, OUT=6000;
  let phase="in", t0=performance.now();

  /* Ankunft: einmaliges Sammeln */
  let arrive=0;
  let arrived=false;
  const ARRIVE_IN=1200;
  const ARRIVE_OUT=1800;
  let a0=performance.now();

  function loop(ts){
    /* ===== Atem ===== */
    const t = ts - t0;
    let p=0;

    if(phase==="in"){
      const k=Math.min(1,t/IN); p=ease(k);
      if(k>=1){ phase="hold"; t0=ts; }
    } else if(phase==="hold"){
      p=1; if(t>=HOLD){ phase="out"; t0=ts; }
    } else {
      const k=Math.min(1,t/OUT); p=1-ease(k);
      if(k>=1){ phase="in"; t0=ts; }
    }

    /* ===== Ankunfts-Impuls ===== */
    if(!arrived){
      const at = ts - a0;
      if(at < ARRIVE_IN){
        arrive = ease(at/ARRIVE_IN);
      } else if(at < ARRIVE_IN + ARRIVE_OUT){
        arrive = 1 - ease((at-ARRIVE_IN)/ARRIVE_OUT);
      } else {
        arrive = 0;
        arrived = true;
      }
    }

    /* winzige Lebendigkeit */
    p = clamp(p + Math.sin(ts*0.001)*0.02, 0, 1);

    set("--p", p.toFixed(4));
    set("--arrive", arrive.toFixed(4));

    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
EOF
