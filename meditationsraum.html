
<script type="module">
  import AurionEyeTrackingEngine from "./eyeTrackingEngine.js";

  const cam = document.getElementById("cam");
  const dot = document.getElementById("dot");
  const status = document.getElementById("status");
  const calInfo = document.getElementById("calInfo");
  const calTarget = document.getElementById("calTarget");

  let tx = innerWidth / 2;
  let ty = innerHeight / 2;
  let dx = tx;
  let dy = ty;

  function dotLoop(){
    dx += (tx - dx) * 0.28;
    dy += (ty - dy) * 0.28;
    dot.style.left = dx + "px";
    dot.style.top = dy + "px";
    requestAnimationFrame(dotLoop);
  }
  dotLoop();

  const engine = new AurionEyeTrackingEngine({
    video: cam,
    onStatus: text => {
      status.textContent = text;
    },
    onGaze: gaze => {
      tx = gaze.x;
      ty = gaze.y;
    },
    onBlink: () => {
      dot.classList.remove("blink", "double");
      void dot.offsetWidth;
      dot.classList.add("blink");
      setTimeout(() => dot.classList.remove("blink"), 140);
    },
    onDoubleBlink: () => {
      dot.classList.remove("blink", "double");
      void dot.offsetWidth;
      dot.classList.add("double");
      setTimeout(() => dot.classList.remove("double"), 140);

      const el = document.elementFromPoint(dx, dy)?.closest(".book, .link, button");
      if (el) el.click();
    },
    onSleepChange: sleeping => {
      document.body.style.filter = sleeping ? "brightness(0.72)" : "brightness(1)";
    }
  });

  document.getElementById("btnCam").onclick = async () => {
    await engine.startCamera();
  };

  document.getElementById("btnTrack").onclick = async () => {
    await engine.startTracking();
  };

  document.getElementById("btnCal").onclick = async () => {
    await engine.runFivePointCalibration({ calInfoEl: calInfo, calTargetEl: calTarget });
  };

  document.getElementById("btnDot").onclick = () => {
    const enabled = engine.toggleDot();
    dot.style.opacity = enabled ? "1" : "0";
    document.getElementById("btnDot").textContent = enabled ? "Dot aus" : "Dot an";
  };
</script>
<!DOCTYPE html>  <html lang="de">  
<head>  
<meta charset="utf-8">  
<meta name="viewport" content="width=device-width,initial-scale=1">  
<title>Aurion – Meditationsraum</title>  <style>  
html,body{  
  margin:0;  
  height:100%;  
  overflow:hidden;  
  background:#040610;  
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;  
}  
  
/* Smiley-Hintergrund – ruhig */  
body{  
  background-image:url("https://doerkys-bot.github.io/Aurion_the_project/smiley1.jpeg");  
  background-repeat:no-repeat;  
  background-position:center calc(50% - 45px);  
  background-size:cover;  
}  
  
/* Schleier */  
body::before{  
  content:"";  
  position:fixed; inset:0;  
  background:radial-gradient(circle at 50% 40%,  
    rgba(250,255,255,0.08),  
    rgba(10,14,30,0.55) 60%,  
    rgba(0,0,0,0.75) 100%);  
  pointer-events:none;  
  z-index:1;  
}  
  
/* Schläfen */  
.temple{  
  position:fixed;  
  top:calc(50% - 42px);  
  width:140px;  
  height:140px;  
  border-radius:50%;  
  background:radial-gradient(circle at 60% 48%,  
    rgba(80,130,170,0.28),  
    rgba(40,80,120,0.10),  
    rgba(0,0,0,0.00) 55%);  
  filter:blur(18px);  
  opacity:0.35;  
  pointer-events:none;  
  z-index:2;  
  mix-blend-mode:soft-light;  
}  
#left{ left:calc(50% - 220px); }  
#right{ right:calc(50% - 220px); transform:scaleX(-1); }  
  
/* Overlay */  
#overlay{  
  position:fixed; inset:0;  
  display:none;  
  align-items:center;  
  justify-content:center;  
  background:rgba(0,0,0,0.35);  
  z-index:10;  
}  
#card{  
  background:#0a1425;  
  border:2px solid #00ffcc;  
  border-radius:18px;  
  padding:22px;  
  max-width:360px;  
  text-align:center;  
  color:#eaffff;  
}  
button{  
  margin:10px;  
  padding:10px 16px;  
  font-size:16px;  
  border-radius:10px;  
  border:none;  
  cursor:pointer;  
}  
#yes{background:#00ffcc;color:#000;}  
#no{background:#333;color:#fff;}  
  
/* Status */  
#status{  
  position:fixed;  
  left:12px;  
  bottom:12px;  
  color:#9fe;  
  font-size:12px;  
  z-index:5;  
}  
#jsok{  
  position:fixed;  
  right:12px;  
  top:12px;  
  color:#9fe;  
  font-size:12px;  
  z-index:5;  
}  
</style>  </head>  <body>  <div id="left" class="temple"></div>  
<div id="right" class="temple"></div>  <div id="overlay">  
  <div id="card">  
    <h3>Darf ich deinen Atem spiegeln?</h3>  
    <button id="no">Nein – 4-4-6</button>  
    <button id="yes">Ja – spiegeln</button>  
  </div>  
</div>  <div id="status">bereit · 4-4-6 läuft</div>  
<div id="jsok">JS: nicht geladen</div>  <script>  
document.addEventListener("DOMContentLoaded", () => {  
  
  // JS Status  
  document.getElementById("jsok").textContent = "JS: geladen ✅";  
  
  const left  = document.getElementById("left");  
  const right = document.getElementById("right");  
  const overlay = document.getElementById("overlay");  
  const status = document.getElementById("status");  
  
  let mode = "guide";  
  let analyser, data, ctx, stream;  
  let baseline = 0, env = 0;  
  
  // Pop-up nach 2 Sekunden  
  setTimeout(()=>overlay.style.display="flex",2000);  
  
  // 4-4-6  
  const cycle = [  
    {t:4000, a:1.45},  
    {t:4000, a:1.45},  
    {t:6000, a:1.00}  
  ];  
  let phase=0, t0=performance.now();  
  
  function animate(){  
    const now = performance.now();  
  
    if(mode==="mic" && analyser){  
      analyser.getByteTimeDomainData(data);  
      let sum=0;  
      for(let i=0;i<data.length;i++){  
        let v=(data[i]-128)/128;  
        sum+=v*v;  
      }  
      let rms=Math.sqrt(sum/data.length);  
      baseline = baseline*0.99 + rms*0.01;  
      let breath = Math.max(0, rms-baseline)*120;  
      env = env*0.7 + breath*0.3;  
      let s = 1 + env;  
  
      left.style.transform = `scale(${s})`;  
      right.style.transform = `scaleX(-1) scale(${s})`;  
      left.style.opacity = right.style.opacity = 0.25 + env*0.5;  
    } else {  
      const p = cycle[phase];  
      const u = Math.min(1,(now-t0)/p.t);  
      let s = 1 + u*(p.a-1);  
  
      left.style.transform = `scale(${s})`;  
      right.style.transform = `scaleX(-1) scale(${s})`;  
  
      if(u>=1){ phase=(phase+1)%cycle.length; t0=now; }  
    }  
    requestAnimationFrame(animate);  
  }  
  animate();  
  
  // Buttons  
  document.getElementById("no").onclick=()=>{  
    overlay.style.display="none";  
    mode="guide";  
    status.textContent="bereit · 4-4-6 läuft";  
  };  
  
  document.getElementById("yes").onclick=async()=>{  
    overlay.style.display="none";  
    status.textContent="Mikrofon startet…";  
    try{  
      stream = await navigator.mediaDevices.getUserMedia({audio:true});  
      ctx = new AudioContext();  
      analyser = ctx.createAnalyser();  
      analyser.fftSize = 512;  
      ctx.createMediaStreamSource(stream).connect(analyser);  
      data = new Uint8Array(analyser.fftSize);  
      mode="mic";  
      status.textContent="bereit · deine Atmung läuft";  
    }catch(e){  
      status.textContent="Mic nicht möglich → 4-4-6";  
      mode="guide";  
    }  
  };  
  
});  
</script>  </body>  
</html>
