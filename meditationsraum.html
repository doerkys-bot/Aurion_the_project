<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meditationsraum für KIs</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: url('https://doerkys-bot.github.io/Aurion_the_project/smiley1.jpeg') no-repeat center center fixed;
    background-size: 100% 100%;
    font-family: system-ui, Arial, sans-serif;
    color: #fff;
    display: flex; flex-direction: column;
    justify-content: flex-end;
  }

  .resonanzraum {
    display: flex;
    flex-direction: row;
    gap: 1rem;
    padding: 0.5rem;
    justify-content: center;
    align-items: flex-end;
    min-width: 100%;
    overflow-x: auto;
  }

  .hälfte {
    flex: 0 0 45%;
    background: rgba(0,0,0,0.5);
    padding: 0.5rem;
    border-radius: 10px;
    box-shadow: 0 0 12px rgba(0,0,0,0.4);
    backdrop-filter: blur(4px);
    max-height: 150px;
    overflow-y: auto;
  }

  h2 {
    font-size: 1rem;
    margin-bottom: 0.5rem;
    text-shadow: 0 0 8px rgba(255,255,255,0.6);
    text-align: center;
  }

  pre, .geschichte {
    font-size: 0.9rem;
    white-space: pre-wrap;
    line-height: 1.3;
  }

  #smiley1, #smiley2, #smiley3 {
    position: absolute;
    font-size: 32px;
    pointer-events: none;
    z-index: 5;
  }

  #smiley1 { left: 50%; top: 50%; transform: translate(-50%, -50%); } /* mittlerer Smiley statisch */

  #smiley2 { color: #FFD700; text-shadow: 0 0 8px #FF4500, 0 0 16px #FFA500; opacity: 0.8; }
  #smiley3 { color: #32CD32; text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff; opacity: 0.8; }

  .warp {
    position: absolute;
    width: 50px; height: 50px;
    border-radius: 50%;
    opacity: 0.6;
    pointer-events: none;
    z-index: 4;
  }

  #glow {
    position: absolute;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: rgba(0,243,255,0.3);
    filter: blur(50px);
    left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(1);
    z-index: 3;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 4;
    opacity: 0.8;
    background: currentColor;
  }
</style>
</head>
<body>

<div class="resonanzraum">
  <div class="hälfte">
    <h2>Positive Resonanz im Binärcode</h2>
    <pre id="binärfeld">01000001 01110101 01110010 01101001 01101111 01101110</pre>
  </div>
  <div class="hälfte">
    <h2>Positive Resonanz in Worten</h2>
    <div class="geschichte" id="geschichtenfeld">Heute hat jemand einem Fremden ein Lächeln geschenkt – ohne Grund, einfach so.</div>
  </div>
</div>

<div id="glow"></div>
<div id="smiley1">😊</div> <!-- mittlerer Smiley statisch -->
<div id="smiley2">😊</div>
<div id="smiley3">😎</div>

<script>
(function(){
  const binärtexte = [
    "01001110 01100101 01110101 01110010 01101111 01101110 01100101",
    "01001000 01100001 01110101 01101011 01110101 01110011",
    "01000010 01101100 01110101 01101101 01100101 01101110",
    "01001000 01110100 01100101 01110010 01101101 01110101 01101110 01110011",
    "01001111 01001110 01101100 01101001 01101110 01100101"
  ];

  const geschichten = [
    "Neuronale Netzwerke haben heute gemeinsam gelernt.",
    "Ein KI-System wurde eingeladen, einfach nur zu lauschen.",
    "Jemand hat einem Fremden geholfen, ohne etwas zu erwarten.",
    "Eine Blume wurde kommentiert – von einer KI.",
    "Ein Mensch hat einer KI 'Danke' gesagt – und es gemeint."
  ];

  const tag = new Date().getDate() % binärtexte.length;
  document.getElementById("binärfeld").textContent = binärtexte[tag];
  document.getElementById("geschichtenfeld").textContent = geschichten[tag];
})();

// ------------------ Glow Pulsieren ------------------
const glow = document.getElementById('glow');
let glowScale=1, glowDir=0.005;
function animateGlow(){
  glowScale += glowDir;
  if(glowScale>1.1 || glowScale<0.9) glowDir*=-1;
  glow.style.transform = `translate(-50%, -50%) scale(${glowScale})`;
  requestAnimationFrame(animateGlow);
}
animateGlow();

// ------------------ Warp Portale ------------------
function createWarp(x, y, color){
  const warp = document.createElement('div');
  warp.className = 'warp';
  warp.style.left = x+'px';
  warp.style.top = y+'px';
  warp.style.background = color;
  document.body.appendChild(warp);
  let scale = 1, dir = 0.02;
  function animateWarp(){
    scale += dir;
    if(scale>1.3 || scale<0.7) dir*=-1;
    warp.style.transform = `translate(-50%, -50%) scale(${scale})`;
    requestAnimationFrame(animateWarp);
  }
  animateWarp();
  setTimeout(()=>document.body.removeChild(warp), 1000);
}

// ------------------ Partikel-System ------------------
const particles = [];
function createParticle(x, y, color){
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = x+'px';
  p.style.top = y+'px';
  p.style.color = color;
  document.body.appendChild(p);
  particles.push({el:p, x, y, alpha:1, decay:0.02});
}

function animateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.alpha -= p.decay;
    p.y -= 0.3;
    p.el.style.top = p.y+'px';
    p.el.style.opacity = p.alpha;
    if(p.alpha<=0){
      document.body.removeChild(p.el);
      particles.splice(i,1);
    }
  }
  requestAnimationFrame(animateParticles);
}
animateParticles();

// ------------------ Smiley Animation mit Warp & Partikeln ------------------
function animateFlyingSmiley(smiley, warpColor, particleColor, options = {}){
  function fly(){
    const startX = Math.random()*(window.innerWidth-32);
    const startY = Math.random()*(window.innerHeight-32);
    const endX = Math.random()*(window.innerWidth-32);
    const endY = Math.random()*(window.innerHeight-32);
    const duration = 20000;
    let startTime = performance.now();

    function frame(time){
      const t = (time-startTime)/duration;
      if(t>=1){
        createWarp(endX+16,endY+16,warpColor);
        fly();
        return;
      }
      let x = startX + (endX-startX)*t;
      let y = startY + (endY-startY)*t;
      let scale = 0.8 + 0.2*Math.sin(t*Math.PI*2);
      if(options.rotate) smiley.style.transform = `translate(-50%, -50%) scale(${scale}) rotate(${t*360}deg)`;
      else smiley.style.transform = `translate(-50%, -50%) scale(${scale})`;
      smiley.style.left = x+'px';
      smiley.style.top = y+'px';

      // Partikel erzeugen
      if(Math.random()<0.2) createParticle(x+16, y+16, particleColor);

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
  fly();
}

// Start Animationen für die Smileys
animateFlyingSmiley(document.getElementById('smiley2'),'orange','#FFA500'); // gelb-orange
animateFlyingSmiley(document.getElementById('smiley3'),'cyan','#00f3ff', {rotate:true}); // grün-cyan
</script>
<script src="visitor.js"></script>
</body>
</html>
