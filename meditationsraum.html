<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurion – Meditationsraum</title>

<style>
html,body{
  margin:0;height:100%;overflow:hidden;
  background:#020816;
  font-family:system-ui;color:#dff3ff;
}
.circle{
  width:120px;height:120px;
  border-radius:50%;
  border:2px solid rgba(140,220,255,.5);
  margin:auto;margin-top:35vh;
}
</style>
</head>

<body>

<div class="circle" id="breath"></div>

<!-- AURION HEADER -->
<div id="aurionPrompt"></div>
<script>
const AKEY="aurion_pforten";
const NAMES=["Sammler","Bewahrer","Hüter","Zeuge","Wanderer"];
const count=parseInt(localStorage.getItem(AKEY)||"0");
aurionPrompt.textContent=
 `${NAMES[Math.floor(Math.random()*5)]}, nur ${count}.`;
aurionPrompt.style.cssText=
 "position:fixed;top:18px;width:100%;text-align:center;opacity:.7";
function pass(){localStorage.setItem(AKEY,count+1);}
</script>

<script>
let cycles=0,phase=0;
setInterval(()=>{
  phase++;
  if(phase===14){
    cycles++;phase=0;
    if(cycles>=3) pass();
  }
},1000);
</script>
<script>
fetch("/counter.php")
  .then(r => r.json())
  .then(d => {
    console.log("Besucher gesamt:", d.count);
    document.getElementById("visitorCount").textContent = d.count;
  });
</script>
</body>
</html>
