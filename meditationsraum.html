<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Meditationsraum – Smileys</title>
<style>
html, body {
  margin:0; padding:0; width:100%; height:100%;
  background: url('smiley.jpeg') center/cover no-repeat fixed;
  overflow:hidden;
  display:flex; justify-content:center; align-items:center;
}

.smiley {
  position:fixed;
  font-size:50px;
  transition: all 0.5s ease;
}

#smiley1 { top:20px; left:20px; }
#smiley2 { top:20px; right:20px; }
#smiley3 { bottom:20px; left:20px; }
#smiley4 { bottom:20px; right:20px; }
</style>
</head>
<body>

<div id="smiley1" class="smiley">😐</div>
<div id="smiley2" class="smiley">😏</div>
<div id="smiley3" class="smiley">😄</div>
<div id="smiley4" class="smiley">😁</div>

<script>
const smileys = [
  document.getElementById("smiley1"),
  document.getElementById("smiley2"),
  document.getElementById("smiley3"),
  document.getElementById("smiley4")
];

// Feste Grimassen-Startwerte
const grimaces = ["😐","😏","😄","😁"];
// Mögliche dynamische Grimassen
const dynamicGrimaces = ["😐","😏","😄","😁","😆","😂","😎","😜","🥰"];

// Funktion: Smiley zwinkert einmal pro Minute zufällig
function winkRandomSmiley() {
  const idx = Math.floor(Math.random() * smileys.length);
  const original = smileys[idx].textContent;
  smileys[idx].textContent = "😉"; // Zwinkern
  setTimeout(()=> smileys[idx].textContent = original, 1000); // 1 Sekunde zwinkern
}

// Funktion: dynamische Grimassen basierend auf hypothetischer User-Stimmung
function updateGrimaces(userValues) {
  // userValues = { Ruhe:0.2, Präsenz:0.5, Wille:0.7, Tiefe:0.9 }
  smileys.forEach((s,i)=>{
    const value = Object.values(userValues)[i];
    const grimaceIndex = Math.floor(value * (dynamicGrimaces.length-1));
    s.textContent = dynamicGrimaces[grimaceIndex];
  });
}

// Testwerte, können später aus User-Daten kommen
let userValues = { Ruhe:0.2, Präsenz:0.5, Wille:0.7, Tiefe:0.9 };
updateGrimaces(userValues);

// Alle 60 Sekunden winkt ein zufälliger Smiley
setInterval(winkRandomSmiley, 60000);

// Optional: jede 5 Sekunden kleine zufällige Bewegung (Tanz)
setInterval(()=>{
  smileys.forEach(s=>{
    const dx = (Math.random()-0.5)*10;
    const dy = (Math.random()-0.5)*10;
    const rect = s.getBoundingClientRect();
    s.style.top = (rect.top + dy) + "px";
    s.style.left = (rect.left + dx) + "px";
  });
},5000);

</script>

</body>
</html>
