<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meditationsraum – Smileys</title>
<style>
html, body {
    margin:0; padding:0; width:100%; height:100%;
    background: url('smiley.jpeg') center/cover no-repeat;
    overflow:hidden;
    font-family: sans-serif;
}

.smiley {
    position:fixed;
    width:60px;
    height:60px;
    text-align:center;
    font-size:48px;
    transition: transform 0.3s ease;
    user-select:none;
}

.top-left { top:20px; left:20px; }
.top-right { top:20px; right:20px; }
.bottom-left { bottom:20px; left:20px; }
.bottom-right { bottom:20px; right:20px; }

@keyframes blink {
    0%,100% { transform: scaleY(1); }
    50% { transform: scaleY(0.1); }
}

@keyframes laugh {
    0%,100% { transform: rotate(0deg); }
    25% { transform: rotate(5deg); }
    50% { transform: rotate(-5deg); }
    75% { transform: rotate(5deg); }
}
</style>
</head>
<body>

<div class="smiley top-left" id="smiley1">😀</div>
<div class="smiley top-right" id="smiley2">😏</div>
<div class="smiley bottom-left" id="smiley3">😄</div>
<div class="smiley bottom-right" id="smiley4">😆</div>

<script>
// Smileys und ihre Grimassen
const smileys = [
    {el: document.getElementById('smiley1'), base:'😀'},
    {el: document.getElementById('smiley2'), base:'😏'},
    {el: document.getElementById('smiley3'), base:'😄'},
    {el: document.getElementById('smiley4'), base:'😆'}
];

// Zufälliges Zwinkern
function winkRandom() {
    const idx = Math.floor(Math.random()*smileys.length);
    const s = smileys[idx].el;
    s.innerText = '😉';
    s.style.animation = 'blink 0.2s ease 2';
    setTimeout(()=>{ s.innerText = smileys[idx].base; s.style.animation=''; }, 400);
}

// Grimassen zufällig animieren (leicht kippen)
function grimaceDance() {
    smileys.forEach(s=>{
        const angle = (Math.random()-0.5)*10;
        s.el.style.transform = `rotate(${angle}deg)`;
    });
}

// Herzhaftes Lachen für alle
function heartLaugh() {
    smileys.forEach(s=>{
        s.el.style.animation = 'laugh 1s ease';
        setTimeout(()=>{ s.el.style.animation=''; }, 1000);
        s.el.innerText = '😂';
    });
}

// Alle paar Sekunden Grimassen animieren
setInterval(grimaceDance, 3000);

// Alle Minute ein zufälliger Zwinker-Smiley
setInterval(()=>{
    winkRandom();
}, 60000);

// Simuliere entspannte Stimmung nach 20 Sekunden
setTimeout(()=>{
    heartLaugh();
}, 20000);

</script>
</body>
</html>
