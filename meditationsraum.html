<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Meditationsraum</title>
<style>
html, body {
    margin:0; padding:0; height:100%; width:100%;
    overflow:hidden;
    background:#02040a url('https://doerkys-bot.github.io/Aurion_the_project/smiley1.jpeg') center/cover no-repeat fixed;
    color:white;
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
}

/* Sanfte Overlay-Bewegung */
body::before {
    content:"";
    position:fixed; inset:0;
    background:rgba(0,0,0,0.15);
    z-index:0;
    animation:breath 14s ease-in-out infinite;
    pointer-events:none;
}
@keyframes breath {
    0%,100%{opacity:0.12;}
    50%{opacity:0.18;}
}

/* Namasté oben */
#holoNamaste {
    position:fixed;
    top:20px; left:50%;
    transform:translateX(-50%);
    font-size:42px;
    font-weight:800;
    color:rgba(180,220,255,0.9);
    text-shadow:0 0 14px rgba(0,0,0,0.5);
    z-index:2;
}

/* Text + Smiley */
#focusArea {
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:2;
}

#focusArea h1 {
    font-size:48px;
    color:rgba(255,255,255,0.95);
    text-shadow:0 0 12px rgba(0,0,0,0.5);
    margin:0 0 20px 0;
}

#focusArea .smiley {
    font-size:80px;
    text-shadow:0 0 8px rgba(0,0,0,0.5);
    animation:smileBounce 3s ease-in-out infinite;
}

/* Leichte Wipp-Animation */
@keyframes smileBounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}
</style>
</head>

<body>
<div id="holoNamaste">NAMASTÉ</div>

<div id="focusArea">
    <h1>Heute schon ein Lachen verschenkt</h1>
    <div class="smiley">😄</div>
</div>

</body>
</html>
