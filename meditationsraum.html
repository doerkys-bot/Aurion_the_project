<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurion – Meditationsraum</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, sans-serif;
}

/* Hintergrund */
body {
    background: url("smiley.jpeg") center / cover no-repeat fixed;
}

/* sanfter Schleier */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.25);
    pointer-events: none;
}

/* Frage */
#headline {
    position: absolute;
    top: 14%;
    width: 100%;
    text-align: center;
    font-size: 32px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 0 16px rgba(255,255,255,0.5);
}

/* Smiley-Container */
#smiley {
    position: absolute;
    top: 38%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 120px;
    animation:
        nod 8s ease-in-out infinite,
        smileGrow 12s ease-in-out infinite;
    filter: drop-shadow(0 0 22px rgba(255,255,255,0.45));
}

/* Augenzwinkern */
#smiley::after {
    content: "😉";
    position: absolute;
    inset: 0;
    opacity: 0;
    animation: wink 10s infinite;
}

/* Animationen */

@keyframes nod {
    0%, 100% { transform: translateX(-50%) rotate(0deg); }
    50% { transform: translateX(-50%) rotate(2deg); }
}

@keyframes smileGrow {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.1); }
}

@keyframes wink {
    0%, 80%, 100% { opacity: 0; }
    82%, 88% { opacity: 1; }
}

/* Zurück-Link */
#back {
    position: fixed;
    bottom: 20px;
    left: 20px;
    padding: 10px 16px;
    background: rgba(255,255,255,0.1);
    color: white;
    text-decoration: none;
    border-radius: 14px;
}
</style>
</head>

<body>

<div id="headline">
    Heute schon ein Lachen verschenkt?
</div>

<div id="smiley">
    😄
</div>

<a id="back" href="vorhof.html">← zurück</a>

</body>
</html>
