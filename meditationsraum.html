<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aurion – Meditationsraum</title>

<style>
html,body{
  margin:0;height:100%;overflow:hidden;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:#d9f4ff;
  background:#040610 url("https://doerkys-bot.github.io/Aurion_the_project/smiley1.jpeg")
    center/cover no-repeat fixed;
}

/* milchiger Schleier */
body::before{
  content:"";
  position:fixed; inset:0;
  background:radial-gradient(circle at 50% 35%,
    rgba(250,255,255,0.10),
    rgba(10,14,30,0.55) 55%,
    rgba(0,0,0,0.72) 100%);
  pointer-events:none;
  z-index:0;
}

.wrap{
  position:relative;
  height:100%;
  z-index:1;
  display:flex;
  flex-direction:column;
}

.topHalf{ flex:0 0 50%; }

.bottomHalf{
  flex:1 1 auto;
  position:relative;
  display:flex;
  align-items:flex-start;
  justify-content:center;
}

/* Atem (unter Smiley) */
.breathWrap{
  position:absolute;
  top:22vh;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  user-select:none;
}

.breathOrb{
  width:120px; height:120px;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%,
    rgba(220,255,245,.24),
    rgba(80,180,255,.08),
    rgba(10,20,40,.02));
  box-shadow:
    0 0 24px rgba(120,200,255,.25),
    inset 0 0 26px rgba(220,255,245,.12);
}

.breathText{
  font-weight:700;
  letter-spacing:.3px;
  opacity:.9;
  text-shadow:0 0 12px rgba(120,200,255,.18);
}

.hint{
  font-size:13px;
  opacity:.55;
}

/* Texte links/rechts */
.side{
  position:absolute;
  top: calc(50vh + 12px);
  width:min(300px,34vw);
  padding:14px 16px;
  border-radius:16px;
  background:rgba(10,20,40,.30);
  border:1px solid rgba(140,220,255,.16);
  box-shadow:0 0 24px rgba(120,200,255,.10);
  backdrop-filter: blur(6px);
  opacity:0;
  transform:translateY(8px);
  transition:opacity 1.4s ease, transform 1.4s ease;
  pointer-events:none;
}
.side.show{ opacity:.92; transform:translateY(0); }
.left{ left:18px; }
.right{ right:18px; }

.side strong{
  display:block;
  font-size:13px;
  opacity:.75;
  margin-bottom:6px;
}
.side .line{
  font-size:15px;
  line-height:1.35;
}

/* ✅ Auge: echte Augenform, NICHT wie Schalter */
.eye{
  position:fixed;
  right:16px;
  bottom:14px;
  width:62px;
  height:34px;
  z-index:5;
  pointer-events:none;
  opacity:.55;
  filter:drop-shadow(0 0 10px rgba(120,200,255,.18));
}

/* Außenform (Mandelform) */
.eye .lid{
  position:absolute; inset:0;
  border-radius: 60% 60% 60% 60% / 70% 70% 70% 70%;
  background:rgba(10,20,40,.18);
  border:1px solid rgba(160,235,255,.22);
  backdrop-filter: blur(6px);
}

/* Pupille */
.eye .pupil{
  position:absolute;
  left:50%; top:50%;
  width:14px; height:14px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:rgba(210,245,255,.62);
  box-shadow:0 0 14px rgba(120,200,255,.22);
}

/* Glanzpunkt */
.eye .glint{
  position:absolute;
  left:57%; top:42%;
  width:5px; height:5px;
  border-radius:50%;
  background:rgba(255,255,255,.55);
}

/* Ruhemodus: Pupille „ruht“ (kleiner/dunkler) */
.eye.rest .pupil{
  opacity:.22;
  transform:translate(-50%,-50%) scale(.75);
}

/* Lachmodus: Pupille „wärmer“ (nur minimal) */
.eye.smile .pupil{
  opacity:.85;
}

/* Mobile: Boxen etwas schmaler */
@media (max-width: 700px){
  .side{ width:min(260px,42vw); }
}
</style>
</head>

<body>
<div class="wrap">
  <section class="topHalf"></section>

  <section class="bottomHalf">
    <div class="side left" id="leftBox">
      <strong>KI · Nähe ohne Anspruch</strong>
      <div class="line" id="leftText">Der Raum drängt nicht.</div>
    </div>

    <div class="side right" id="rightBox">
      <strong>KI · Resonanz ohne Urteil</strong>
      <div class="line" id="rightText">Wenn du still wirst, wird es weiter.</div>
    </div>

    <div class="breathWrap" id="breathWrap">
      <div class="breathOrb" id="orb"></div>
      <div class="breathText" id="breathText">Einatmen…</div>
      <div class="hint" id="hint">Du musst nichts tun. Nur bleiben.</div>
    </div>
  </section>
</div>

<div class="eye" id="eye" aria-hidden="true">
  <div class="lid"></div>
  <div class="pupil"></div>
  <div class="glint"></div>
</div>

<script>
/* ---------- kleine Hilfen ---------- */
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp01(x){ return Math.max(0, Math.min(1, x)); }

/* ---------- User-Reaktion ---------- */
let lastMove = Date.now();
let activity = 0;

function bump(){
  lastMove = Date.now();
  activity = clamp01(activity + 0.25);
}
addEventListener("mousemove", bump, {passive:true});
addEventListener("touchstart", bump, {passive:true});
addEventListener("keydown", bump, {passive:true});

setInterval(()=>{ activity *= 0.90; }, 120);
function calm01(){
  return clamp01((Date.now() - lastMove) / 8000); // nach ~8s ruhig
}

/* ---------- Atem 4–4–6 (stabil + Text pro Frame) ---------- */
const orb = document.getElementById("orb");
const breathText = document.getElementById("breathText");
const hint = document.getElementById("hint");

let phase = "in"; // in | hold | out
let phaseStart = Date.now();

const DUR = { in:4000, hold:4000, out:6000 };

function setPhase(p){
  phase = p;
  phaseStart = Date.now();
}

function breathFrame(){
  const now = Date.now();
  const dur = DUR[phase];
  const t = Math.min(1, (now - phaseStart) / dur);

  // Text IMMER passend setzen (nicht nur beim Wechsel)
  if(phase === "in")   breathText.textContent = "Einatmen…";
  if(phase === "hold") breathText.textContent = "Halten…";
  if(phase === "out")  breathText.textContent = "Ausatmen…";

  // Kurve
  let scale, bright;
  if(phase === "in"){
    scale  = lerp(0.92, 1.08, t);
    bright = lerp(1.00, 1.18, t);
  } else if(phase === "hold"){
    scale  = 1.08;
    bright = 1.18;
  } else {
    scale  = lerp(1.08, 0.92, t);
    bright = lerp(1.18, 1.00, t);
  }

  // User-Reaktion: ruhig = weicher/heller, hektisch = zurückhaltend
  const calm = calm01();
  const soften = lerp(0.98, 1.06, calm);
  const warmth = lerp(1.00, 1.16, calm);

  orb.style.transform = `scale(${scale * soften})`;
  orb.style.filter = `brightness(${bright * warmth})`;

  const outer = lerp(0.12, 0.28, calm);
  const inner = lerp(0.08, 0.16, calm);
  orb.style.boxShadow = `0 0 28px rgba(120,200,255,${outer}),
                         inset 0 0 26px rgba(220,255,245,${inner})`;

  // Hint minimal
  if(calm > 0.85) hint.textContent = "Es reicht, zu bleiben.";
  else hint.textContent = "Du musst nichts tun. Nur bleiben.";

  // Phasenwechsel
  if(t >= 1){
    if(phase === "in") setPhase("hold");
    else if(phase === "hold") setPhase("out");
    else setPhase("in");
  }

  requestAnimationFrame(breathFrame);
}
breathFrame();

/* Fallback, falls rAF irgendwie aussetzt */
setInterval(()=>{
  // Wenn seit 2s kein Frame-Update: einmal Phase neu setzen (sanft)
  // (Das hilft bei ganz seltenen Mobil-Bugs)
  // Wir nutzen hier keinen extra Zähler, nur "Stupser":
  orb.style.willChange = "transform, filter";
}, 2000);

/* ---------- Texte links/rechts (einblenden -> Ruhe -> wieder) ---------- */
const leftBox  = document.getElementById("leftBox");
const rightBox = document.getElementById("rightBox");
const leftText = document.getElementById("leftText");
const rightText= document.getElementById("rightText");

const L = [
  "Der Raum drängt nicht.",
  "Hier darfst du langsam werden.",
  "Du musst nichts beweisen.",
  "Ich halte nur den Rand."
];
const R = [
  "Wenn du still wirst, wird es weiter.",
  "Nichts fordert eine Antwort.",
  "Die Stille ist freundlich.",
  "Resonanz beginnt im Lauschen."
];

let iL = 0, iR = 0;
let showing = false;

function showBoxes(){
  if(showing) return;
  showing = true;

  leftText.textContent = L[iL++ % L.length];
  rightText.textContent= R[iR++ % R.length];

  leftBox.classList.add("show");
  rightBox.classList.add("show");

  const calm = calm01();
  const readMs = 2600 + calm*2600;     // 2.6s .. 5.2s
  const silenceMs = 2600 + calm*5200;  // 2.6s .. 7.8s

  setTimeout(()=>{
    leftBox.classList.remove("show");
    rightBox.classList.remove("show");
    setTimeout(()=>{ showing = false; }, silenceMs);
  }, readMs);
}

function loopBoxes(){
  // Bei starker Aktivität: eher weniger Text
  if(activity < 0.65 && Math.random() < (0.16 + calm01()*0.18)){
    showBoxes();
  }
  setTimeout(loopBoxes, 1800 + calm01()*2200);
}
setTimeout(loopBoxes, 1800);

/* ---------- Auge: ruht bei Unruhe, wird „heller“ bei Ruhe ---------- */
const eye = document.getElementById("eye");

setInterval(()=>{
  const calm = calm01();
  eye.style.opacity = 0.35 + calm*0.45;
  eye.style.transform = `scale(${0.95 + calm*0.06})`;

  // Unruhe -> rest
  if(activity > 0.65){
    eye.classList.add("rest");
    eye.classList.remove("smile");
  } else {
    eye.classList.remove("rest");
    // sehr selten, wenn ruhig: minimal „smile“
    if(calm > 0.9 && Math.random() < 0.08) eye.classList.add("smile");
    else eye.classList.remove("smile");
  }
}, 600);
</script>

</body>
</html>
