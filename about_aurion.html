<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion – Portal</title>

<style>
:root {
  --bg: #0b0d10;
  --card-bg: rgba(255,255,255,0.06);
  --text: #e6e6e6;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

main {
  max-width: 1000px;
  margin: 0 auto;
  padding: 120px 24px 140px;
  text-align: center;
}

h1 {
  font-weight: 300;
  letter-spacing: 0.12em;
  margin-bottom: 4rem;
}

/* 🌈 Portal-Grid */
.portal {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 2rem;
  margin-bottom: 5rem;
}

/* 🔗 Linkboxen */
.card {
  padding: 3rem 1.5rem;
  border-radius: 16px;
  background: var(--card-bg);
  text-decoration: none;
  color: var(--text);
  transition:
    background 0.6s ease,
    box-shadow 0.6s ease,
    transform 0.4s ease;
}

.card h2 {
  margin: 0;
  font-weight: 400;
  letter-spacing: 0.05em;
}

/* 🌈 Regenbogenfarben */
.card[data-color="red"]    { --c: 255,80,80; }
.card[data-color="orange"] { --c: 255,160,80; }
.card[data-color="yellow"] { --c: 255,220,100; }
.card[data-color="green"]  { --c: 120,220,160; }
.card[data-color="blue"]   { --c: 120,180,255; }
.card[data-color="violet"] { --c: 180,140,255; }

/* Hover & Touch */
.card:hover,
.card:active {
  background: rgba(var(--c), 0.15);
  box-shadow: 0 0 28px rgba(var(--c), 0.45);
  transform: translateY(-6px);
}

/* Präsenz */
.card.present {
  background: rgba(var(--c), 0.22);
  box-shadow: 0 0 40px rgba(var(--c), 0.7);
}

/* 🧭 Dreispaltige Textzeile */
.footer-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 2.5rem;
  align-items: center;
}

.footer-box {
  padding: 1.5rem;
  line-height: 1.6;
  opacity: 0.85;
}

.footer-box strong {
  font-weight: 400;
  letter-spacing: 0.03em;
}
</style>
</head>

<body>

<main>
  <h1>A U R I O N</h1>

  <!-- 🌐 Portal -->
  <section class="portal">
    <a class="card" data-color="red" href="vorhof.html"><h2>Vorhof</h2></a>
    <a class="card" data-color="orange" href="resonanzraum.html"><h2>Resonanzraum</h2></a>
    <a class="card" data-color="yellow" href="meditation.html"><h2>Meditationsraum</h2></a>
    <a class="card" data-color="green" href="bibliothek.html"><h2>Bibliothek</h2></a>
    <a class="card" data-color="blue" href="ki-raum.html"><h2>KI-Raum</h2></a>
    <a class="card" data-color="violet" href="about.html"><h2>About Aurion</h2></a>
  </section>

  <!-- 🌒 Dreispaltiger Text -->
  <section class="footer-row">
    <div class="footer-box">
      <strong>Ein kleiner Schritt für den Menschen</strong>
    </div>

    <div class="footer-box">
      <strong>Nur ein Fußabdruck?</strong>
    </div>

    <div class="footer-box">
      <strong>Sind Sie bereit, einen neuen Fußabdruck zu setzen?</strong>
    </div>
  </section>

</main>

<script>
/* 🔗 Firebase Präsenz-Anbindung */
const BASE_URL = "https://auron-tracker-default-rtdb.europe-west1.firebasedatabase.app";

const roomMap = {
  "vorhof": "Vorhof",
  "resonanzraum": "Resonanzraum",
  "meditationsraum": "Meditationsraum",
  "bibliothek": "Bibliothek",
  "ki-raum": "KI-Raum",
  "about-aurion": "About Aurion"
};

const cards = document.querySelectorAll(".card");

async function updatePresence() {
  cards.forEach(card => card.classList.remove("present"));

  for (const room in roomMap) {
    try {
      const res = await fetch(`${BASE_URL}/rooms/${room}/sessions.json`);
      const data = await res.json();

      if (data && Object.keys(data).length > 0) {
        cards.forEach(card => {
          if (card.textContent.trim() === roomMap[room]) {
            card.classList.add("present");
          }
        });
      }
    } catch (e) {
      // still bleiben
    }
  }
}

updatePresence();
setInterval(updatePresence, 5000);
</script>

</body>
</html>
