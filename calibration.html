<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Augen-Kalibrierung – 9 Punkte</title>
<style>
body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0b1223;
  overflow:hidden;
}
#cameraPreview{
  position:fixed;
  top:10px;
  right:10px;
  width:120px;
  height:90px;
  border:2px solid #7fd7ff;
  border-radius:6px;
  object-fit:cover;
  z-index:1;
}
#calibration{
  position:relative;
  width:100%;
  height:100%;
}
.point{
  position:absolute;
  width:50px;
  height:50px;
  background:rgba(0,200,255,0.7);
  border-radius:50%;
  cursor:pointer;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
  font-weight:bold;
  user-select:none;
  z-index:2;
  font-size:1rem;
}
.point.done{
  background:linear-gradient(90deg,#7fffd4,#00aaff);
}
#progressRing{
  position:absolute;
  width:60px;
  height:60px;
  border:4px solid rgba(127,215,255,0.4);
  border-radius:50%;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%) rotate(-90deg);
  z-index:3;
  display:none;
}
#progressRing .fill{
  position:absolute;
  width:100%;
  height:100%;
  clip:rect(0 60px 60px 0);
  border-radius:50%;
  border:4px solid #7fffd4;
  transform:rotate(0deg);
  transform-origin:center;
}
</style>
</head>
<body>

<video id="cameraPreview" autoplay muted playsinline></video>
<div id="calibration"></div>
<div id="progressRing"><div class="fill"></div></div>

<script>
// Kamera starten
const video = document.getElementById('cameraPreview');
navigator.mediaDevices.getUserMedia({video:true})
.then(stream => video.srcObject = stream)
.catch(err => alert("Kamera konnte nicht gestartet werden: "+err.message));

const calibDiv = document.getElementById('calibration');
let completed = 0;

function getPoints(){
  const w = window.innerWidth;
  const h = window.innerHeight;
  const margin = 0.1; // 10% Rand
  return [
    {x:w*margin, y:h*margin},                 // links oben
    {x:w*0.5-25, y:h*margin},                 // mitte oben
    {x:w*(1-margin)-50, y:h*margin},         // rechts oben
    {x:w*margin, y:h*0.5-25},                 // links mitte
    {x:w*0.5-25, y:h*0.5-25},                 // mitte mitte
    {x:w*(1-margin)-50, y:h*0.5-25},         // rechts mitte
    {x:w*margin, y:h*(1-margin)-50},         // links unten
    {x:w*0.5-25, y:h*(1-margin)-50},         // mitte unten
    {x:w*(1-margin)-50, y:h*(1-margin)-50}   // rechts unten
  ];
}

let points = getPoints();

function createPoints(){
  calibDiv.innerHTML=''; // alte Punkte löschen
  points.forEach((p,i)=>{
    const pt = document.createElement('div');
    pt.className='point';
    pt.style.left = `${p.x}px`;
    pt.style.top = `${p.y}px`;
    pt.textContent = i+1;
    calibDiv.appendChild(pt);

    const ring = document.getElementById('progressRing');
    const fill = ring.querySelector('.fill');
    function updateProgress(){
      const deg = (completed/points.length)*360;
      fill.style.transform = `rotate(${deg}deg)`;
    }
    const activate = ()=>{
      if(!pt.classList.contains('done')){
        pt.classList.add('done');
        completed++;
        updateProgress();
        if(completed===points.length){
          ring.style.display='none';
          video.style.display='none'; // Kamerabild ausblenden
          alert("Kalibrierung abgeschlossen!");
        }
      }
    };
    pt.addEventListener('click', activate);
    pt.addEventListener('touchstart', activate, {passive:true});
  });
}

// Zeige Fortschrittsring
document.getElementById('progressRing').style.display='block';
createPoints();

// Punkte bei Resize neu setzen
window.addEventListener('resize', ()=>{
  points = getPoints();
  createPoints();
});
</script>

</body>
</html>
