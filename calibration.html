<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👁️ Kalibrierung – Augenblicke</title>

<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

<style>
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#05070f;
  color:#cfeaff;
  font-family:system-ui,sans-serif;
  overflow:hidden;
}

/* Überschrift */
h1{
  position:fixed;
  top:10px;
  width:100%;
  text-align:center;
  font-size:1.1rem;
  opacity:.85;
}

/* Kalibrierpunkte */
.point{
  position:absolute;
  width:26px;
  height:26px;
  border-radius:50%;
  border:2px solid #7fd7ff;
  background:rgba(127,215,255,0.15);
  transform:translate(-13px,-13px);
  cursor:pointer;
  transition:transform .2s, background .2s;
}

.point.done{
  background:#7fd7ff;
  border-color:#bff0ff;
}

/* Gaze-Cursor (nur Feedback!) */
#gaze{
  position:fixed;
  width:14px;
  height:14px;
  border-radius:50%;
  background:rgba(140,200,255,0.5);
  pointer-events:none;
  transform:translate(-7px,-7px);
  transition:left .08s linear, top .08s linear;
}

/* Hinweis */
#hint{
  position:fixed;
  bottom:10px;
  width:100%;
  text-align:center;
  font-size:.8rem;
  opacity:.7;
}
</style>
</head>

<body>

<h1>👁️ Kalibrierung – bitte jeden Punkt 3× anklicken</h1>
<div id="gaze"></div>
<div id="hint">Der Blickpunkt dient nur zur Orientierung</div>

<script>
/* --- WebGazer Grundeinstellung --- */
webgazer
  .showVideo(true)
  .showFaceOverlay(false)
  .showFaceFeedbackBox(false)
  .setGazeListener((data)=>{
    if(!data) return;
    const g=document.getElementById("gaze");
    g.style.left=data.x+"px";
    g.style.top=data.y+"px";
  })
  .begin();

/* --- Kalibrierpunkte --- */
const points=[];
const clicksNeeded=3;
const grid=[0.15,0.5,0.85];

grid.forEach(y=>{
  grid.forEach(x=>{
    const p=document.createElement("div");
    p.className="point";
    p.style.left=(window.innerWidth*x)+"px";
    p.style.top=(window.innerHeight*y)+"px";
    p.clicks=0;

    p.addEventListener("click",()=>{
      p.clicks++;

      // Trainingsdaten an WebGazer
      webgazer.recordScreenPosition(
        p.getBoundingClientRect().left + 13,
        p.getBoundingClientRect().top + 13,
        "click"
      );

      // Visuelles Feedback
      p.style.transform=`translate(-13px,-13px) scale(${1 - p.clicks*0.15})`;

      if(p.clicks>=clicksNeeded){
        p.classList.add("done");
        p.style.pointerEvents="none";
      }

      // Alle Punkte fertig?
      if(points.every(pt=>pt.clicks>=clicksNeeded)){
        setTimeout(()=>{
          webgazer.pause();
          window.location.href="bibliothek_aug.html";
        },800);
      }
    });

    document.body.appendChild(p);
    points.push(p);
  });
});
</script>

</body>
</html>
