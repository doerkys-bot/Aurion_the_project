<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>📚 Kalibrierung – Bibliothek der Anfänge</title>
<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>
<style>
body{
  margin:0;
  height:100vh;
  background:#0b1223;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:#eaeaea;
  font-family:system-ui,sans-serif;
}
h1{margin-bottom:1rem;color:#8cf;text-align:center;}
#points{
  display:grid;
  grid-template-columns:100px 100px 100px;
  grid-template-rows:100px 100px 100px;
  gap:50px;
  justify-items:center;
  align-items:center;
}
.point{
  width:40px;
  height:40px;
  border-radius:50%;
  border:2px solid #7fd7ff;
  background:rgba(127,215,255,0.1);
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}
.point.active{background:rgba(127,215,255,0.2);}
.progress-ring{
  width:40px;
  height:40px;
  border-radius:50%;
  position:absolute;
  top:0; left:0;
  clip: rect(0 40px 40px 20px);
}
.progress-fill{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#7fd7ff;
  clip: rect(0 20px 40px 0);
  transform: rotate(0deg);
}
#status{
  margin-top:2rem;
  font-size:1rem;
}
#next{
  margin-top:1rem;
  padding:0.5rem 1rem;
  font-size:1rem;
  background:#7fd7ff;
  color:#0b1223;
  border:none;
  border-radius:6px;
  cursor:pointer;
  display:none;
}
</style>
</head>
<body>

<h1>📚 Kalibrierung</h1>
<div id="points">
  <div class="point" data-index="0"></div>
  <div class="point" data-index="1"></div>
  <div class="point" data-index="2"></div>
  <div class="point" data-index="3"></div>
  <div class="point" data-index="4"></div>
</div>
<div id="status">Bitte jeden Punkt 2 Sekunden ansehen</div>
<button id="next">Zur Bibliothek</button>

<script>
const FIXATION_TIME = 2000; // 2 Sekunden pro Punkt
const points = document.querySelectorAll(".point");
const status = document.getElementById("status");
const nextBtn = document.getElementById("next");
let current = 0;

// Progress-Ring erstellen
points.forEach(point=>{
  const ring = document.createElement("div");
  ring.classList.add("progress-ring");
  const fill = document.createElement("div");
  fill.classList.add("progress-fill");
  ring.appendChild(fill);
  point.appendChild(ring);
});

function activatePoint(i){
  if(i >= points.length) return done();
  const point = points[i];
  point.classList.add("active");
  const fill = point.querySelector(".progress-fill");
  const start = Date.now();
  const interval = setInterval(()=>{
    const percent = Math.min(100, (Date.now()-start)/FIXATION_TIME*100);
    fill.style.transform = `rotate(${percent*3.6}deg)`;
    if(percent>=100){
      clearInterval(interval);
      point.classList.remove("active");
      current++;
      status.textContent = `Punkte: ${current} / ${points.length}`;
      activatePoint(current);
    }
  },50);
}

// WebGazer starten (nur intern, kein Dot sichtbar)
webgazer.setRegression("ridge")
.setGazeListener(()=>{}).begin();
webgazer.showVideo(false);
webgazer.showPredictionPoints(false);
window.addEventListener("beforeunload",()=>webgazer.end());

// Kalibrierung starten
activatePoint(current);

// Fertig
function done(){
  status.textContent = "Kalibrierung abgeschlossen!";
  localStorage.setItem("aurion_gaze_calibration", JSON.stringify({time:Date.now()}));
  nextBtn.style.display="inline-block";
}
nextBtn.addEventListener("click", ()=>{location.href="library.html";});
</script>

</body>
</html>
