<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Aurion – Kalibrierung 2.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { background: #000; color: #00fbff; font-family: monospace; margin: 0; overflow: hidden; }
        #target-container { position: absolute; width: 80px; height: 80px; transform: translate(-50%, -50%); transition: 0.5s ease; }
        #progress-svg { transform: rotate(-90deg); width: 80px; height: 80px; }
        #progress-bar { fill: none; stroke: #00fbff; stroke-width: 4; stroke-dasharray: 226; stroke-dashoffset: 226; transition: stroke-dashoffset 0.1s linear; }
        #inner-dot { position: absolute; inset: 25px; background: rgba(0,251,255,0.2); border-radius: 50%; transition: 0.3s; }
        .fixed { background: #ffcc00 !important; } /* Farbe bei Fixation */
        .done { background: #00ffaa !important; box-shadow: 0 0 30px #00ffaa; }
        .hint { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    </style>
</head>
<body>
    <video id="cam" style="position:fixed; opacity:0.1; width:100px;"></video>
    <div id="target-container">
        <svg id="progress-svg"><circle id="progress-bar" cx="40" cy="40" r="36"></circle></svg>
        <div id="inner-dot"></div>
    </div>
    <div class="hint"><h2 id="msg">PUNKT 1</h2><p id="sub">Anschauen für 2 Sek.</p></div>

    <script>
        const points = [{x:15,y:15},{x:85,y:15},{x:15,y:85},{x:85,y:85},{x:50,y:50}];
        let current = 0, lastBlink = 0, focusStart = 0;
        const bar = document.getElementById('progress-bar');
        const dot = document.getElementById('inner-dot');

        function update() {
            document.getElementById('target-container').style.left = points[current].x + "%";
            document.getElementById('target-container').style.top = points[current].y + "%";
            bar.style.strokeDashoffset = 226;
            dot.className = ""; focusStart = 0;
        }

        function onResults(res) {
            if (!res.multiFaceLandmarks[0]) return;
            const p = res.multiFaceLandmarks[0];
            const nose = p[4];
            const dist = Math.hypot((1-nose.x)*100 - points[current].x, nose.y*100 - points[current].y);
            const eyeDist = Math.abs(p[159].y - p[145].y);

            if (dist < 8) {
                if (!focusStart) focusStart = Date.now();
                let elapsed = Date.now() - focusStart;
                let progress = Math.min(elapsed / 2000, 1);
                bar.style.strokeDashoffset = 226 - (226 * progress);
                
                if (progress >= 1) {
                    dot.classList.add('fixed');
                    document.getElementById('sub').innerText = "JETZT DOPPELBLINK!";
                }
            } else {
                focusStart = 0; bar.style.strokeDashoffset = 226;
                dot.classList.remove('fixed');
                document.getElementById('sub').innerText = "Anschauen für 2 Sek.";
            }

            if (eyeDist < 0.012 && focusStart && (Date.now() - focusStart >= 2000)) {
                let now = Date.now();
                if (now - lastBlink > 80 && now - lastBlink < 450) {
                    dot.className = "done";
                    setTimeout(() => {
                        current++;
                        if(current < points.length) { update(); document.getElementById('msg').innerText = "PUNKT " + (current+1); }
                        else { window.history.back(); }
                    }, 500);
                }
                lastBlink = now;
            }
        }

        const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
        faceMesh.setOptions({maxNumFaces:1, refineLandmarks:true});
        faceMesh.onResults(onResults);
        new Camera(document.getElementById('cam'), {onFrame: async() => {await faceMesh.send({image:document.getElementById('cam')})}}).start();
        update();
    </script>
</body>
</html>
