<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Augen-Kalibrierung</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

<style>
body{
  margin:0;
  background:#05070f;
  color:#cfefff;
  font-family:system-ui,sans-serif;
  overflow:hidden;
}

/* Kamera */
#webgazerVideoFeed{
  position:fixed;
  bottom:10px;
  right:10px;
  width:180px;
  border-radius:8px;
  opacity:.85;
  z-index:5;
}

/* Kalibrierpunkte */
.point{
  position:fixed;
  width:26px;
  height:26px;
  border-radius:50%;
  background:#7fd7ff;
  box-shadow:0 0 16px #7fd7ff;
  transform:translate(-13px,-13px);
  opacity:.85;
  transition:opacity .3s, transform .3s;
}
.point.done{
  opacity:.15;
  transform:translate(-13px,-13px) scale(.6);
}

/* Gaze Cursor */
#gaze{
  position:fixed;
  width:28px;
  height:28px;
  border-radius:50%;
  background:rgba(120,220,255,.35);
  box-shadow:0 0 18px rgba(120,220,255,.6);
  pointer-events:none;
  transform:translate(-14px,-14px);
  transition:left .15s linear, top .15s linear;
  z-index:20;
}

/* Anzeigen */
.panel{
  position:fixed;
  left:10px;
  background:rgba(0,0,0,.6);
  padding:6px 10px;
  border-radius:6px;
  font-size:12px;
  font-family:monospace;
}
#quality{ top:10px; }
#light{ top:46px; }

/* Hinweis */
#hint{
  position:fixed;
  bottom:10px;
  left:10px;
  font-size:12px;
  opacity:.6;
}
</style>
</head>

<body>

<div id="quality" class="panel">Qualität: —</div>
<div id="light" class="panel">Licht: —</div>
<div id="gaze"></div>
<div id="hint">Bleibe ruhig · Kein Klick nötig</div>

<script>
/* ---------- Kalibrierpunkte ---------- */
const points=[];
const grid=[0.1,0.5,0.9];

grid.forEach(y=>{
  grid.forEach(x=>{
    const p=document.createElement("div");
    p.className="point";
    p.style.left=(window.innerWidth*x)+"px";
    p.style.top=(window.innerHeight*y)+"px";
    document.body.appendChild(p);
    p.done=false;
    points.push(p);
  });
});

/* ---------- WebGazer ---------- */
webgazer
  .showVideo(true)
  .showFaceOverlay(false)
  .showFaceFeedbackBox(false)
  .setGazeListener(onGaze)
  .begin();

/* ---------- Gaze Cursor + Qualität ---------- */
let lastX=null,lastY=null;
let stability=0;
let focusCounter=Array(points.length).fill(0);

function onGaze(data){
  if(!data) return;

  // Gaze Cursor
  const gaze=document.getElementById("gaze");
  gaze.style.left=data.x+"px";
  gaze.style.top=data.y+"px";

  // Qualität
  if(lastX!==null){
    const dx=data.x-lastX;
    const dy=data.y-lastY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    stability=stability*0.9+Math.min(dist,100)*0.1;

    document.getElementById("quality").textContent=
      "Qualität: "+
      (stability<15?"sehr ruhig":stability<35?"ok":"unruhig");
  }
  lastX=data.x; lastY=data.y;

  // Punkte-Fokus
  points.forEach((p,i)=>{
    if(p.done) return;
    const r=p.getBoundingClientRect();
    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;
    const d=Math.hypot(data.x-cx,data.y-cy);

    if(d<35){
      focusCounter[i]++;
      if(focusCounter[i]>40){
        p.done=true;
        p.classList.add("done");
        webgazer.recordScreenPosition(cx,cy,"click");
      }
    }else{
      focusCounter[i]=Math.max(0,focusCounter[i]-1);
    }
  });

  // Fertig?
  if(points.every(p=>p.done)){
    setTimeout(()=>{
      window.location.href="bibliothek_aug.html";
    },800);
  }
}

/* ---------- Lichtindikator ---------- */
setInterval(()=>{
  const v=document.getElementById("webgazerVideoFeed");
  if(!v) return;

  const c=document.createElement("canvas");
  c.width=40; c.height=30;
  const ctx=c.getContext("2d");
  ctx.drawImage(v,0,0,40,30);
  const d=ctx.getImageData(0,0,40,30).data;

  let sum=0;
  for(let i=0;i<d.length;i+=4){
    sum+=(d[i]+d[i+1]+d[i+2])/3;
  }
  const avg=sum/(d.length/4);

  document.getElementById("light").textContent=
    "Licht: "+(avg<60?"zu dunkel":avg<110?"ok":"sehr gut");
},1500);
</script>

</body>
</html>
