<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👁️ Augenblicke – Kalibrierung</title>

<script src="https://webgazer.cs.brown.edu/webgazer.js"></script>

<style>
body{
  margin:0;
  background:#0b1223;
  color:#eaeaea;
  font-family:system-ui,sans-serif;
  overflow:hidden;
}

h1{
  text-align:center;
  color:#8cf;
  margin:1rem 0;
}

/* Kamera */
#webgazerVideoFeed{
  position:fixed !important;
  top:10px;
  right:10px;
  width:160px !important;
  height:120px !important;
  border-radius:10px;
  border:2px solid #7fd7ff;
  z-index:9999;
}

/* Status */
#status{
  position:fixed;
  top:10px;
  left:10px;
  background:rgba(0,0,0,.6);
  color:#7fd7ff;
  padding:6px 10px;
  border-radius:6px;
  font-family:monospace;
  z-index:9999;
}

/* Punkte */
.point{
  position:absolute;
  width:90px;
  height:90px;
  border-radius:50%;
  background:rgba(0,200,255,.25);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.4rem;
  color:#fff;
}

/* Ring */
.ring{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:50%;
  border:6px solid rgba(0,200,255,.3);
  pointer-events:none;
}

.fill{
  position:absolute;
  width:100%;
  height:100%;
  border-radius:50%;
  border:6px solid #7fd7ff;
  clip-path:polygon(50% 50%, 100% 0, 100% 100%);
  transform:rotate(0deg);
  transform-origin:center;
  transition:transform .1s linear;
}
</style>
</head>

<body>
<h1>👁️ Kalibriere deinen Blick</h1>
<div id="status">0 / 9</div>

<script>
const positions = [
  [15,15],[50,15],[85,15],
  [15,50],[50,50],[85,50],
  [15,85],[50,85],[85,85]
];

const HOLD_TIME = 1200; // ms pro Punkt
let points = [];
let finished = 0;

// Kamera & WebGazer starten
webgazer.setRegression("ridge")
.setGazeListener(data=>{
  if(!data) return;

  const x = data.x;
  const y = data.y;

  points.forEach(p=>{
    if(p.done) return;

    const r = p.el.getBoundingClientRect();
    const inside = x>r.left && x<r.right && y>r.top && y<r.bottom;

    if(inside){
      p.time += 60;
      const percent = Math.min(p.time/HOLD_TIME,1);
      p.fill.style.transform = `rotate(${percent*360}deg)`;

      if(percent===1){
        p.done = true;
        finished++;
        document.getElementById("status").textContent =
          `${finished} / 9`;
        p.el.style.background = "rgba(0,200,255,.6)";
      }
    } else {
      p.time = Math.max(0,p.time-40);
      const percent = p.time/HOLD_TIME;
      p.fill.style.transform = `rotate(${percent*360}deg)`;
    }
  });

  if(finished===9){
    setTimeout(()=>{
      window.location.href="bibliothek_aug.html";
    },600);
  }
}).begin();

webgazer.showVideo(true);
webgazer.showPredictionPoints(false);

// Punkte erzeugen
positions.forEach((p,i)=>{
  const el = document.createElement("div");
  el.className="point";
  el.style.left = `calc(${p[0]}% - 45px)`;
  el.style.top  = `calc(${p[1]}% - 45px)`;
  el.textContent = i+1;

  const ring = document.createElement("div");
  ring.className="ring";
  const fill = document.createElement("div");
  fill.className="fill";

  ring.appendChild(fill);
  el.appendChild(ring);
  document.body.appendChild(el);

  points.push({el, fill, time:0, done:false});
});
</script>
</body>
</html>
