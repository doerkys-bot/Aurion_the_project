<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof (MP stable · Iris-Kalibrierung · Dwell+Blink)</title>
<!-- AURION_BUILD: 2026-02-12_mpstable_iris4_dwell3_blink2_anchor2s -->

<style>
html,body{
  margin:0;height:100%;overflow:hidden;
  background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpeg") center/cover no-repeat fixed;
  font-family:system-ui,Segoe UI,Roboto,sans-serif;
  color:white;
}

/* ===== HUD ===== */
#hud{
  position:fixed;
  top:12px;
  right:50px; /* HUD etwas nach links, damit man oben rechts besser sieht */
  background:rgba(0,0,0,.62);
  color:#9fefff;
  padding:10px 14px;
  border-radius:10px;
  font-size:12px;
  font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  z-index:9999;
  max-width:72vw;
  box-shadow:0 0 20px rgba(120,200,255,.35);
}
#hud .row{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
#hud .btnrow{margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;}
#hud button{
  padding:7px 10px;
  border-radius:9px;
  border:1px solid rgba(140,230,255,.28);
  background:rgba(20,40,80,.40);
  color:#cfeeff;
  cursor:pointer;
  font-weight:800;
  pointer-events:auto;
  touch-action:manipulation;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
}
#hud button:hover{ background:rgba(40,80,140,.55); }
#hud button[disabled]{opacity:.5; cursor:not-allowed;}

/* ===== LINKS ===== */
.link{
  position:absolute;
  padding:12px 18px;
  border-radius:16px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(6px);
  color:#cfeeff;
  text-decoration:none;
  font-weight:700;
  box-shadow:0 0 22px rgba(80,160,255,.18);
  transition:transform .20s ease, box-shadow .20s ease, background .20s ease;
  z-index:6;
  user-select:none;
}
.link.glow{
  transform:scale(1.10);
  background:rgba(140,255,200,.15);
  box-shadow:0 0 45px rgba(120,255,200,.90);
}

/* ===== DOT ===== */
#gazeDot{
  position:fixed;
  width:26px;height:26px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(120,255,200,.98), rgba(0,120,80,.85));
  box-shadow:0 0 24px rgba(120,255,200,.95), 0 0 70px rgba(120,255,200,.35);
  pointer-events:none;
  z-index:9998;
  opacity:1;
}

/* ===== TICKER ===== */
#ticker{
  position:fixed;
  left:12px; right:12px; bottom:10px;
  height:32px;
  overflow:hidden;
  background:rgba(10,20,40,.62);
  border-radius:10px;
  box-shadow:0 0 20px rgba(120,200,255,.35);
  z-index:20;
  display:flex;
  align-items:center;
}
#ticker span{
  white-space:nowrap;
  padding-left:100%;
  font-weight:700;
  color:#8fe4ff;
}

/* ===== Cam Overlay ===== */
#videoWrap{
  position:fixed;
  right:10px;
  bottom:52px; /* über ticker */
  width:220px;
  height:165px;
  border-radius:12px;
  overflow:hidden;
  background:rgba(0,0,0,.35);
  border:1px solid rgba(140,230,255,.22);
  box-shadow:0 0 18px rgba(120,200,255,.25);
  z-index:30;
  display:none;
}
#cam{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1); /* Selfie */
}
#camBadge{
  position:absolute;
  left:8px; top:8px;
  padding:4px 8px;
  border-radius:999px;
  font-weight:900;
  font-size:12px;
  background:rgba(0,0,0,.55);
  color:#cfeeff;
  border:1px solid rgba(160,220,255,.20);
}

/* ===== Kalibrierpunkt ===== */
#calPt{
  position:fixed;
  width:34px;height:34px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle, rgba(255,255,255,.95), rgba(255,220,120,.92));
  box-shadow:0 0 26px rgba(255,240,180,.75);
  z-index:9000;
  display:none;
}
#calPt::after{
  content:"";
  position:absolute; inset:-10px;
  border-radius:50%;
  border:2px solid rgba(255,240,180,.35);
}
</style>
</head>

<body>

<div id="hud">
  <div class="row" id="row1">JS: … | Links: … | Cam: aus | MP: aus</div>
  <div class="row" id="row2">Blick: –</div>
  <div class="row" id="row3">Kalibrierung: ausstehend | Dwell: –</div>
  <div class="row" id="row4">MirrorX: AN (Taste M) | Anchor: 2s</div>
  <div class="row" id="row5" style="color:#ffd0d0;">Fehler: –</div>
  <div class="btnrow">
    <button id="btnCam">Kamera starten</button>
    <button id="btnMP" disabled>Tracking starten</button>
    <button id="btnCal" disabled>Kalibrieren (Iris)</button>
  </div>
</div>

<div id="videoWrap">
  <video id="cam" playsinline autoplay muted></video>
  <div id="camBadge">FACE: –</div>
</div>

<div id="calPt" title="Kalibrierpunkt"></div>
<div id="gazeDot"></div>

<div id="ticker"><span id="tickerText">Aurion · Vorhof · Berühre einen Link…</span></div>

<!-- Links (GitHub-Basis) -->
<a class="link" href="https://doerkys-bot.github.io/Aurion_the_project/bibliothek.html" data-text="Bibliothek – Wissen und alte Energie-Schriften">Bibliothek</a>
<a class="link" href="https://doerkys-bot.github.io/Aurion_the_project/resonanzraum.html" data-text="Resonanzraum – Begegnung, Schwingung, Nähe">Resonanzraum</a>
<a class="link" href="https://doerkys-bot.github.io/Aurion_the_project/sternenuebung.html" data-text="Chi-Sternenübung – Austausch jenseits von Sprache">Chi-Sternenübung</a>
<a class="link" href="https://doerkys-bot.github.io/Aurion_the_project/meditationsraum.html" data-text="Meditationsraum – Sammlung und Stille">Meditationsraum</a>
<a class="link" href="https://doerkys-bot.github.io/Aurion_the_project/ki-raum.html" data-text="KI-Raum – bewusste Ko-Präsenz">KI-Raum</a>
<a class="link" href="https://doerkys-bot.github.io/Aurion_the_project/gaestebuch.html" data-text="Gästebuch – Spuren hinterlassen">Gästebuch</a>
<a class="link" href="https://doerkys-bot.github.io/Aurion_the_project/about_aurion.html" data-text="About Aurion – Ursprung & Projekt">About Aurion</a>

<script>
(() => {
  // ===== HUD / UI =====
  const row1 = document.getElementById("row1");
  const row2 = document.getElementById("row2");
  const row3 = document.getElementById("row3");
  const row4 = document.getElementById("row4");
  const row5 = document.getElementById("row5");

  const btnCam = document.getElementById("btnCam");
  const btnMP  = document.getElementById("btnMP");
  const btnCal = document.getElementById("btnCal");

  const videoWrap = document.getElementById("videoWrap");
  const cam = document.getElementById("cam");
  const camBadge = document.getElementById("camBadge");

  const calPt = document.getElementById("calPt");
  const dotEl = document.getElementById("gazeDot");

  const tickerText = document.getElementById("tickerText");
  const links = [...document.querySelectorAll(".link")];

  // ===== Helpers =====
  let jsTick = 0;
  function clamp01(v){ return Math.max(0, Math.min(1, v)); }
  function setError(msg){ row5.textContent = "Fehler: " + (msg || "–"); }
  function hudLine1(extra){
    row1.textContent = `JS: OK(${jsTick}) | Links: ${linksOk ? "OK" : "…"} | Cam: ${cam.srcObject ? "läuft" : "aus"} | MP: ${mpState}`;
    if(extra) row1.textContent += " | " + extra;
  }

  // ===== Links Kreis =====
  let linksOk = false;
  function placeLinksCircle(){
    const cx = innerWidth/2, cy = innerHeight/2;
    const r = Math.min(innerWidth, innerHeight) * 0.32;
    const step = (2*Math.PI) / links.length;

    links.forEach((l,i)=>{
      const a = i*step - Math.PI/2;
      // erst wenn Größen bekannt sind, stimmt offsetWidth
      l.style.left = (cx + r*Math.cos(a) - l.offsetWidth/2) + "px";
      l.style.top  = (cy + r*Math.sin(a) - l.offsetHeight/2) + "px";
    });

    linksOk = true;
    hudLine1();
  }
  addEventListener("load", ()=>setTimeout(placeLinksCircle, 180));
  addEventListener("resize", ()=>setTimeout(placeLinksCircle, 80));

  // ===== Ticker (adaptive Geschwindigkeit) =====
  let tickerPos = 0;
  let tickerSpeed = 1.2;    // wird adaptiv gesetzt
  let tickerActive = true;
  let lastInterestTs = performance.now();
  let lastMsg = "";

  function setTicker(msg){
    const m = (msg || "Aurion · Vorhof · Berühre einen Link…");
    if(m !== lastMsg){
      lastMsg = m;
      tickerText.textContent = m + "   ";
      tickerPos = innerWidth; // sofort neu starten
    }
    lastInterestTs = performance.now();
  }

  // Interesse: wenn du targetest oder kürzlich targetest → langsam
  function updateTickerSpeed(isTargeting){
    const idle = performance.now() - lastInterestTs;
    if(isTargeting){
      tickerSpeed = 0.8;      // neugierig/aufmerksam → langsamer
    }else if(idle < 1600){
      tickerSpeed = 1.2;
    }else{
      tickerSpeed = 2.4;      // Desinteresse/leer → schneller
    }
  }

  function tickerLoop(){
    tickerPos -= tickerSpeed;
    tickerText.style.transform = `translateX(${tickerPos}px)`;
    if(tickerPos < -tickerText.offsetWidth) tickerPos = innerWidth;
    requestAnimationFrame(tickerLoop);
  }
  tickerLoop();

  // Hover/Touch auf Link zeigt Text
  links.forEach(l=>{
    l.addEventListener("mouseenter", ()=>setTicker(l.dataset.text || l.textContent));
    l.addEventListener("touchstart", ()=>setTicker(l.dataset.text || l.textContent), {passive:true});
  });

  // ===== Dot / Target / Anchor =====
  // Anchor: 15px nach links (wie du wolltest)
  function anchorPoint(){
    return { x: innerWidth/2 - 15, y: innerHeight/2 };
  }

  let targetX = anchorPoint().x;
  let targetY = anchorPoint().y;
  let dotX = targetX, dotY = targetY;
  const smooth = 0.10;

  // 2-sec Regel: wenn keine Blickdaten → Anchor
  let lastGazeTs = 0;

  function smoothDot(){
    dotX += (targetX - dotX) * smooth;
    dotY += (targetY - dotY) * smooth;

    dotEl.style.left = dotX + "px";
    dotEl.style.top  = dotY + "px";

    requestAnimationFrame(smoothDot);
  }
  smoothDot();

  function applyAnchorIfNoData(){
    if(mpRunning){
      const noDataFor = (performance.now() - lastGazeTs);
      if(noDataFor > 2000){
        const a = anchorPoint();
        targetX = a.x; targetY = a.y;
        // hart setzen, damit es sich wirklich "heim" anfühlt
        dotX = a.x; dotY = a.y;
        dotEl.style.left = a.x + "px";
        dotEl.style.top  = a.y + "px";
      }
    }
    requestAnimationFrame(applyAnchorIfNoData);
  }
  applyAnchorIfNoData();

  // ===== Dwell → Glow → Redirect (3s) =====
  const DWELL_MS = 3000;
  let dwellLink = null;
  let dwellStart = 0;

  let isCalibrating = false;
  let navArmed = false;
  let mpRunning = false;
  let mpState = "aus";
  let mirrorX = true; // AN
  let irisCal = null;
  let irisLastRaw = null; // {x,y}

  try { irisCal = JSON.parse(localStorage.getItem("irisCal") || "null"); } catch(e){ irisCal=null; }

  function linkHit(x,y){
    for(const l of links){
      const r = l.getBoundingClientRect();
      if(x>=r.left && x<=r.right && y>=r.top && y<=r.bottom) return l;
    }
    return null;
  }

  function dwellLoop(){
    if(!navArmed || isCalibrating){
      links.forEach(l=>l.classList.remove("glow"));
      row3.textContent = (irisCal ? "Kalibrierung: ✓" : "Kalibrierung: ausstehend") + " | Dwell: –";
      updateTickerSpeed(false);
      requestAnimationFrame(dwellLoop);
      return;
    }

    const hit = linkHit(dotX, dotY);
    links.forEach(l=>l.classList.remove("glow"));

    if(hit){
      hit.classList.add("glow");
      setTicker(hit.dataset.text || hit.textContent);
      updateTickerSpeed(true);

      if(dwellLink !== hit){
        dwellLink = hit;
        dwellStart = performance.now();
      }else{
        const t = performance.now() - dwellStart;
        const pct = Math.min(100, Math.round((t/DWELL_MS)*100));
        row3.textContent = `Kalibrierung: ✓ | Dwell: ${pct}%`;
        if(t >= DWELL_MS){
          location.href = hit.href;
          dwellStart = performance.now() + 999999; // falls Back
        }
      }
    }else{
      dwellLink = null;
      row3.textContent = `Kalibrierung: ✓ | Dwell: –`;
      updateTickerSpeed(false);
    }

    requestAnimationFrame(dwellLoop);
  }
  dwellLoop();

  // ===== Cam-Kernel (robuste Events) =====
  async function startCam(){
    setError("–");
    btnCam.disabled = true;
    try{
      const md = navigator.mediaDevices;
      if(!md) throw new Error("navigator.mediaDevices fehlt (HTTPS?)");
      if(!md.getUserMedia) throw new Error("getUserMedia fehlt");

      const stream = await md.getUserMedia({
        video:{ facingMode:"user", width:{ideal:640}, height:{ideal:480} },
        audio:false
      });

      cam.srcObject = stream;
      await cam.play();

      videoWrap.style.display = "block";
      btnCam.textContent = "Kamera stoppen";
      btnCam.disabled = false;
      btnMP.disabled = false;

      hudLine1();
    }catch(e){
      setError(e?.name ? (e.name+": "+e.message) : (e?.message || String(e)));
      btnCam.disabled = false;
      btnCam.textContent = "Kamera starten";
      hudLine1();
      console.error(e);
    }
  }

  function stopCam(){
    setError("–");
    const s = cam.srcObject;
    if(s && s.getTracks) s.getTracks().forEach(t=>t.stop());
    cam.srcObject = null;

    videoWrap.style.display = "none";
    btnCam.textContent = "Kamera starten";

    // Tracking stoppen (sicher)
    stopMP();

    btnMP.disabled = true;
    btnCal.disabled = true;

    hudLine1();
  }

  ["click","pointerup","touchend","mouseup"].forEach(ev=>{
    btnCam.addEventListener(ev, (e)=>{
      e.preventDefault(); e.stopPropagation();
      if(cam.srcObject) stopCam();
      else startCam();
    }, {passive:false});
  });

  // ===== MediaPipe (MP) =====
  let visionMod = null;
  let landmarker = null;
  let rafId = 0;

  async function startMP(){
    if(!cam.srcObject){
      setError("Starte zuerst die Kamera.");
      return;
    }
    setError("–");

    btnMP.disabled = true;
    mpState = "lade…";
    hudLine1();

    try{
      // import
      visionMod = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest");
      const FilesetResolver = visionMod.FilesetResolver;
      const FaceLandmarker = visionMod.FaceLandmarker;
      if(!FilesetResolver || !FaceLandmarker) throw new Error("visionTasks Import unvollständig");

      const fileset = await FilesetResolver.forVisionTasks("/vendor/mp/wasm");

      landmarker = await FaceLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: "/vendor/mp/models/face_landmarker.task" },
        outputFaceBlendshapes: true,
        runningMode: "VIDEO",
        numFaces: 1
      });

      mpRunning = true;
      mpState = "läuft";
      btnCal.disabled = false;
      btnMP.textContent = "Tracking stoppen";
      btnMP.disabled = false;

      // nach Start: noch nicht navigieren, bis kalibriert
      navArmed = !!irisCal;
      row3.textContent = (irisCal ? "Kalibrierung: ✓" : "Kalibrierung: ausstehend") + " | Dwell: –";

      hudLine1();
      tickMP();

    }catch(e){
      mpRunning = false;
      mpState = "Fehler";
      btnMP.textContent = "Tracking starten";
      btnMP.disabled = false;
      btnCal.disabled = true;
      setError(e?.message || String(e));
      hudLine1();
      console.error(e);
    }
  }

  function stopMP(){
    mpRunning = false;
    mpState = "aus";
    navArmed = false;
    isCalibrating = false;

    btnMP.textContent = "Tracking starten";
    btnMP.disabled = cam.srcObject ? false : true;
    btnCal.disabled = true;

    camBadge.textContent = "FACE: –";
    camBadge.style.color = "#cfeeff";

    if(rafId) cancelAnimationFrame(rafId);
    rafId = 0;
    landmarker = null;

    hudLine1();
  }

  ["click","pointerup","touchend","mouseup"].forEach(ev=>{
    btnMP.addEventListener(ev, (e)=>{
      e.preventDefault(); e.stopPropagation();
      if(mpRunning) stopMP();
      else startMP();
    }, {passive:false});
  });

  // ===== Iris-Mapping =====
  function applyIrisCal(gxRaw, gyRaw){
    if(!irisCal){
      return { gx: clamp01(gxRaw), gy: clamp01(gyRaw) };
    }
    const gx = clamp01((gxRaw - irisCal.xMin) / Math.max(1e-6, (irisCal.xMax - irisCal.xMin)));
    const gy = clamp01((gyRaw - irisCal.yMin) / Math.max(1e-6, (irisCal.yMax - irisCal.yMin)));
    return { gx, gy };
  }

  // ===== Blink / Doppelzwinker (Blendshapes) =====
  // Hinweis: auf manchen Geräten schwanken Werte stark – wir machen es "empfindlicher".
  const BLINK_TH = 0.28;          // niedrig = empfindlicher
  const DOUBLE_MS = 850;          // Zeitfenster
  const BLINK_COOLDOWN = 180;     // Debounce
  let lastBlinkTs = 0;
  let lastBlinkEdgeTs = 0;
  let blinkArmed = true;

  function getBlendshapeScore(res, name){
    try{
      const bs = res.faceBlendshapes?.[0];
      if(!bs || !bs.categories) return 0;
      for(const c of bs.categories){
        if(c.categoryName === name) return c.score || 0;
      }
      return 0;
    }catch(_){
      return 0;
    }
  }

  function handleBlink(res){
    const l = getBlendshapeScore(res, "eyeBlinkLeft");
    const r = getBlendshapeScore(res, "eyeBlinkRight");
    const blink = Math.max(l, r);

    row2.textContent = row2.textContent.replace(/ \| Blink:.*$/,"") + ` | Blink: ${Math.round(blink*100)}%`;

    const now = performance.now();
    if(now - lastBlinkTs < BLINK_COOLDOWN) return;

    if(blinkArmed && blink >= BLINK_TH){
      blinkArmed = false;
      lastBlinkTs = now;

      // Doppelzwinker erkennen
      if(now - lastBlinkEdgeTs <= DOUBLE_MS){
        lastBlinkEdgeTs = 0;

        // Doppelzwinker-Aktion: Link bestätigen (sofort weiter)
        if(navArmed && !isCalibrating){
          const hit = linkHit(dotX, dotY);
          if(hit){
            setTicker("Doppelzwinker ✓ → " + (hit.dataset.text || hit.textContent));
            location.href = hit.href;
          }
        }
      }else{
        lastBlinkEdgeTs = now;
      }
    }

    if(blink < (BLINK_TH*0.55)){
      blinkArmed = true;
    }
  }

  // ===== MP Tick =====
  function tickMP(){
    if(!mpRunning || !landmarker) return;

    const ts = performance.now();
    const res = landmarker.detectForVideo(cam, ts);

    const ok = !!(res && res.faceLandmarks && res.faceLandmarks.length>0);
    if(ok){
      camBadge.textContent = "FACE: OK";
      camBadge.style.color = "#9cffb0";
    }else{
      camBadge.textContent = "FACE: –";
      camBadge.style.color = "#cfeeff";
    }

    if(ok){
      // Iris-Indices: Left 468..471, Right 473..476
      const lm = res.faceLandmarks[0];

      const li = lm[468] || lm[469] || lm[470] || lm[471];
      const ri = lm[473] || lm[474] || lm[475] || lm[476];

      // Eye-box für Normierung (weniger Kopfneigung)
      const lb = { minX: 1e9, maxX: -1e9, minY: 1e9, maxY: -1e9 };
      const rb = { minX: 1e9, maxX: -1e9, minY: 1e9, maxY: -1e9 };

      // Links Auge Randpunkte (robust)
      const Lidx = [33,133,159,145,153,144,155,154,157,173];
      const Ridx = [362,263,386,374,380,373,381,382,384,398];

      for(const i of Lidx){
        const p = lm[i]; if(!p) continue;
        lb.minX = Math.min(lb.minX, p.x); lb.maxX = Math.max(lb.maxX, p.x);
        lb.minY = Math.min(lb.minY, p.y); lb.maxY = Math.max(lb.maxY, p.y);
      }
      for(const i of Ridx){
        const p = lm[i]; if(!p) continue;
        rb.minX = Math.min(rb.minX, p.x); rb.maxX = Math.max(rb.maxX, p.x);
        rb.minY = Math.min(rb.minY, p.y); rb.maxY = Math.max(rb.maxY, p.y);
      }

      // Roh-Iris relativ zur Eye-Box (0..1), dann auf Bildschirm projizieren
      // Wichtig: Wir wollen "iris stärker" → hier ist die eigentliche Iris-Info
      let gxRaw = 0.5, gyRaw = 0.5;

      if(li && ri){
        const lx = clamp01((li.x - lb.minX) / Math.max(1e-6, (lb.maxX - lb.minX)));
        const ly = clamp01((li.y - lb.minY) / Math.max(1e-6, (lb.maxY - lb.minY)));
        const rx = clamp01((ri.x - rb.minX) / Math.max(1e-6, (rb.maxX - rb.minX)));
        const ry = clamp01((ri.y - rb.minY) / Math.max(1e-6, (rb.maxY - rb.minY)));

        // Mittel beider Iriden
        gxRaw = (lx + rx) / 2;
        gyRaw = (ly + ry) / 2;
      }

      irisLastRaw = { x: gxRaw, y: gyRaw };

      // MirrorX anwenden (vor Mapping, damit Mapping konsistent bleibt)
      if(mirrorX) gxRaw = 1 - gxRaw;

      const mapped = applyIrisCal(gxRaw, gyRaw);
      const gx = mapped.gx;
      const gy = mapped.gy;

      // Auf Bildschirm
      targetX = gx * innerWidth;
      targetY = gy * innerHeight;

      lastGazeTs = performance.now();
      row2.textContent = `Blick: ${Math.round(gx*100)}% / ${Math.round(gy*100)}% (IRIS)`;

      // Blink
      handleBlink(res);
    }else{
      row2.textContent = "Blick: – (kein Gesicht)";
    }

    rafId = requestAnimationFrame(tickMP);
  }

  // ===== Mini-Iris-Kalibrierung (4 Punkte) =====
  function rectHit(el, x, y, pad=16){
    if(!el) return false;
    const rr = el.getBoundingClientRect();
    return (x>=rr.left-pad && x<=rr.right+pad && y>=rr.top-pad && y<=rr.bottom+pad);
  }

  async function miniIrisCalibration(){
    if(!mpRunning){
      setError("Starte erst Tracking.");
      return;
    }
    setError("–");
    isCalibrating = true;
    navArmed = false;
    dwellLink = null;

    setTicker("Mini-Iris-Kalibrierung: Schau auf den Punkt und tippe ihn.");

    // 4 Punkte im Kreis (links/rechts/oben/unten) – innerhalb des Linkkreises
    const cx = innerWidth/2, cy = innerHeight/2;
    const r  = Math.min(innerWidth, innerHeight) * 0.22;

    const pts = [
      {name:"L", x: cx - r, y: cy},
      {name:"R", x: cx + r, y: cy},
      {name:"T", x: cx,     y: cy - r},
      {name:"B", x: cx,     y: cy + r},
    ];

    // Safety gegen HUD & Cam
    const hudEl = document.getElementById("hud");
    const vidEl = document.getElementById("videoWrap");
    const safePts = pts.map(p=>{
      let x=p.x, y=p.y;
      if(rectHit(hudEl,x,y,18)) x -= 70;
      if(vidEl && vidEl.style.display!=="none" && rectHit(vidEl,x,y,18)) y -= 70;
      return {...p,x,y};
    });

    const sample = { L:null, R:null, T:null, B:null };
    calPt.style.display = "block";

    for(const p of safePts){
      calPt.style.left = p.x + "px";
      calPt.style.top  = p.y + "px";
      calPt.style.transform = "translate(-50%,-50%) scale(1)";
      await new Promise(r=>setTimeout(r,120));

      await new Promise((resolve)=>{
        calPt.onclick = ()=>{
          if(!irisLastRaw){
            setError("Noch keine Irisdaten – Gesicht ruhig in die Cam.");
            return;
          }
          // wir speichern die ROHWERTE (nach MirrorX-Korrektur? -> NEIN: roh ist roh, konsistent im Loop)
          sample[p.name] = { x: irisLastRaw.x, y: irisLastRaw.y };
          resolve();
        };
      });

      calPt.style.transform = "translate(-50%,-50%) scale(0.86)";
      await new Promise(r=>setTimeout(r,90));
      calPt.style.transform = "translate(-50%,-50%) scale(1)";
      await new Promise(r=>setTimeout(r,90));
    }

    calPt.style.display = "none";

    // Grenzen
    let xMin = Math.min(sample.L?.x ?? 0.45, sample.R?.x ?? 0.55);
    let xMax = Math.max(sample.L?.x ?? 0.45, sample.R?.x ?? 0.55);
    let yMin = Math.min(sample.T?.y ?? 0.45, sample.B?.y ?? 0.55);
    let yMax = Math.max(sample.T?.y ?? 0.45, sample.B?.y ?? 0.55);

    // Safety: wenn zu eng → nicht übernehmen
    if(Math.abs(xMax-xMin) < 0.03 || Math.abs(yMax-yMin) < 0.03){
      setError("Kalibrierung zu eng – bitte länger fixieren und erneut.");
      isCalibrating = false;
      return;
    }

    irisCal = { xMin, xMax, yMin, yMax, t: Date.now() };
    localStorage.setItem("irisCal", JSON.stringify(irisCal));

    isCalibrating = false;
    navArmed = true;
    row3.textContent = "Kalibrierung: ✓ | Dwell: –";
    setTicker("Kalibriert ✓  (Dwell 3s oder Doppelzwinker)");
    setError("–");
  }

  ["click","pointerup","touchend","mouseup"].forEach(ev=>{
    btnCal.addEventListener(ev, (e)=>{
      e.preventDefault(); e.stopPropagation();
      miniIrisCalibration();
    }, {passive:false});
  });

  // ===== Mirror Toggle (Taste M) =====
  addEventListener("keydown", (e)=>{
    if((e.key||"").toLowerCase() === "m"){
      mirrorX = !mirrorX;
      row4.textContent = `MirrorX: ${mirrorX ? "AN" : "AUS"} (Taste M) | Anchor: 2s`;
    }
  });

  // ===== Init / heartbeat =====
  setInterval(()=>{ jsTick++; hudLine1(); }, 1000);
  mpState = "aus";
  hudLine1();
  setError("–");
  setTicker("Aurion · Vorhof · Berühre einen Link…");

  // Wenn Kalibrierung schon da: anzeigen
  if(irisCal){
    row3.textContent = "Kalibrierung: ✓ | Dwell: –";
  }else{
    row3.textContent = "Kalibrierung: ausstehend | Dwell: –";
  }

  // MP Button Status initial
  btnMP.disabled = !cam.srcObject;

})();
</script>
