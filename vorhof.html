<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
html, body {
    margin:0; padding:0; height:100%; width:100%;
    overflow:hidden;
    background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpeg") center/cover no-repeat fixed;
    color:white;
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
}

body::before {
    content:"";
    position:fixed; inset:0;
    background:rgba(120,180,255,0.08);
    z-index:0;
    animation:spaceBreath 14s ease-in-out infinite;
    pointer-events:none;
}
@keyframes spaceBreath {
    0%{opacity:0.05;}
    30%{opacity:0.14;}
    60%{opacity:0.14;}
    100%{opacity:0.05;}
}

#holoNamaste {
    position:fixed; top:0; left:50%;
    transform:translateX(-50%);
    z-index:4;
    font-size:42px;
    font-weight:800;
    letter-spacing:4px;
    color:rgba(180,220,255,0.9);
    text-shadow:0 0 14px rgba(120,180,255,0.7),
                0 0 28px rgba(120,180,255,0.45),
                0 0 48px rgba(120,180,255,0.25);
    animation:holoPulse 5s ease-in-out infinite;
    pointer-events:none;
}
@keyframes holoPulse{0%,100%{opacity:.75}50%{opacity:1}}

/* ===== Feste Link-Spalte ===== */
#link-column {
    position:fixed;
    top:120px;
    right:40px;
    display:flex;
    flex-direction:column;
    gap:14px;
    z-index:5;
}

.link {
    padding:12px 18px;
    background:rgba(255,255,255,0.06);
    border-radius:16px;
    text-decoration:none;
    color:gray;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 0 22px rgba(80,160,255,0.18);
}
.link.visited { color:white; }

/* ===== Beipackzettel ===== */
#beipackzettel {
    position:fixed;
    top:53px; left:38px;
    width:320px; z-index:7;
    border-radius:14px;
    box-shadow:0 0 30px rgba(120,180,255,0.35);
    transition: opacity 2s ease, width 0.4s ease;
    cursor:zoom-in;
}
#beipackzettel.minimized { opacity:0.15; width:160px; }

/* ===== Textbox / Pforte ===== */
#pforte {
    position:fixed;
    left:50%; top:55%;
    transform:translate(-50%,-50%);
    width:360px;
    padding:20px 24px;
    border-radius:18px;
    background:rgba(10,20,40,0.78);
    backdrop-filter:blur(8px);
    border:1px solid rgba(120,180,255,0.4);
    box-shadow:0 0 32px rgba(120,180,255,0.45);
    z-index:6;
    font-size:18px;
    line-height:1.5;
    cursor:grab;
    opacity:0;
}
#pforte.visible { opacity:1; }

/* ===== Sammler-Prompt ===== */
#sammlerPrompt {
    position:fixed;
    top:70px; left:50%;
    transform:translateX(-50%);
    background:rgba(20,40,80,0.45);
    color:#aee9ff;
    padding:10px 16px;
    border-radius:12px;
    font-size:16px;
    font-weight:600;
    box-shadow:0 0 22px rgba(120,200,255,0.35);
    z-index:8;
    display:none;
}
</style>
</head>

<body>

<div id="holoNamaste">NAMASTÉ</div>

<!-- Feste Link-Spalte -->
<div id="link-column">
    <a class="link" href="bibliothek.html">Bibliothek</a>
    <a class="link" href="resonanzraum.html">Resonanzraum</a>
    <a class="link" href="sternenuebung.html">Chi-Sternenübung</a>
    <a class="link" href="meditationsraum.html">Meditationsraum</a>
    <a class="link" href="ki-raum.html">KI-Raum</a>
    <a class="link" href="gaestebuch.html">Gästebuch</a>
    <a class="link" href="about_aurion.html">About Aurion</a>
</div>

<img id="beipackzettel" src="https://doerkys-bot.github.io/Aurion_the_project/beipackzettel.jpeg">

<div id="pforte">
<strong>Ein Weg in die 2. Aufmerksamkeit.<br>
Beschreiten Sie die erste Pforte der Zauberer.</strong><br><br>
Versuchen Sie mit geschlossenen Augen sich selber in die Hände zu schauen.<br>
Finden Sie im Geist ihre Hände.
</div>

<div id="sammlerPrompt"></div>

<script>
/* ================= BEIPACK & Pforte ================= */
const beipack = document.getElementById("beipackzettel");
const pforte = document.getElementById("pforte");
const sammlerPrompt = document.getElementById("sammlerPrompt");

// Beipack minimieren, danach Textbox sichtbar
setTimeout(()=>{
    beipack.classList.add("minimized");
    setTimeout(()=>pforte.classList.add("visible"),1000);
},10000);

beipack.addEventListener("click",()=>window.open(beipack.src,"_blank"));

/* ================= Pforte verschiebbar ================= */
let dragP=false, offsetXP=0, offsetYP=0;
pforte.addEventListener("pointerdown", e=>{
    dragP=true;
    offsetXP=e.clientX - pforte.offsetLeft;
    offsetYP=e.clientY - pforte.offsetTop;
    pforte.setPointerCapture(e.pointerId);
});
document.addEventListener("pointermove", e=>{
    if(dragP){
        pforte.style.left=(e.clientX-offsetXP)+'px';
        pforte.style.top=(e.clientY-offsetYP)+'px';
    }
});
document.addEventListener("pointerup", ()=>dragP=false);

/* ================= ERSTE PFORTE ================= */
let attentionStart=null, lastMove=Date.now(), clickTimes=[], passed=false;

function passGate(){
    if(passed) return;
    passed = true;
    localStorage.setItem("pforte1","true");

    // Sammler-Prompt
    const sammlerCount = Object.values(localStorage).filter(v=>v==="true").length;
    const synonyms = ["Sammler","Sammlerwesen","Aufmerksamkeits-Sammler","Bewusstseins-Sammler","Tor-Sammler"];
    sammlerPrompt.textContent = `${synonyms[Math.floor(Math.random()*synonyms.length)]}: ${sammlerCount}`;
    sammlerPrompt.style.display="block";

    pforte.style.boxShadow="0 0 60px rgba(180,240,255,0.9)";
    setTimeout(()=>{ window.location.href="resonanzraum.html"; },1200);
}

/* ---- Aufmerksamkeit (6s Ruhe) ---- */
pforte.addEventListener("mouseenter",()=>{ attentionStart=Date.now(); lastMove=Date.now(); });
pforte.addEventListener("mousemove",()=>{ lastMove=Date.now(); });
pforte.addEventListener("mouseleave",()=>{ attentionStart=null; });

setInterval(()=>{
    if(attentionStart && !passed){
        const now = Date.now();
        if(now - lastMove > 6000){
            passGate();
        }
    }
},300);

/* ---- Fallback: 7 Klicks / 10s ---- */
pforte.addEventListener("click",()=>{
    const now = Date.now();
    clickTimes.push(now);
    clickTimes = clickTimes.filter(t=>now-t<10000);
    if(clickTimes.length >=7){
        passGate();
    }
});
</script>

</body>
</html>
