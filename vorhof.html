<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aurion – vorhof</title>
<style>
  body {
    margin:0; padding:0;
    background:url('https://doerkys-bot.github.io/Aurion_the_project/welcome_aurion.jpg') 
               center/cover no-repeat fixed, black;
    color:#f5f5f5; font-family:system-ui, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh;
  }

  h1 { margin-top:2rem; font-size:2rem; text-shadow:0 0 12px rgba(150,200,255,0.6); }

  .watchers-top {
    margin-top:0.5rem;
    background:rgba(0,0,0,0.35);
    padding:0.4rem 0.8rem;
    border-radius:8px;
    backdrop-filter:blur(6px);
    text-align:center;
  }
  .watch { font-size:1.2rem; }

  .zelt {
    margin-top:1rem;
    width:90%; height:120px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,215,0,0.15);
    border-radius:20px; text-align:center;
    box-shadow:0 0 15px rgba(255,215,0,0.6);
  }
  .zelt a {
    font-size:1.4rem; color:blue; text-decoration:none; font-weight:bold;
  }
  .zelt a:visited { color:green; }

  .plakate {
    display:flex; justify-content:space-around;
    width:100%; margin-top:2rem;
    gap:1rem;
  }
  .plakat {
    position:relative;
    width:45%; height:260px;
    background:rgba(255,255,255,0.08);
    box-shadow:0 0 12px rgba(200,220,255,0.6);
    backdrop-filter:blur(6px);
    border-radius:10px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    cursor:pointer; overflow:hidden;
  }

  .lauf {
    width:100%;
    height:50px;
    overflow:hidden;
    white-space:nowrap;
    border-bottom:2px solid rgba(255,255,255,0.3);
    display:flex; align-items:center; justify-content:center;
  }
  .lauf span {
    display:inline-block;
    padding-left:100%;
    animation:scroll 12s linear infinite;
    font-size:1.6rem;
    font-weight:bold;
    color:darkred;
    font-family:"Brush Script MT", cursive;
  }

  .text {
    flex:1;
    display:flex; align-items:center; justify-content:center;
    font-size:1.2rem;
    text-align:center;
    padding:0.5rem;
  }

  @keyframes scroll {
    0% { transform:translateX(0); }
    100% { transform:translateX(-100%); }
  }

  .terminal {
    margin-top:1rem;
    width:90%; max-width:900px;
    background:rgba(0,0,0,0.65); color:#90ee90;
    font-family:"Courier New", monospace;
    padding:0.6rem; border-radius:8px;
    text-align:left; font-size:1rem;
    max-height:220px; overflow-y:auto;
    white-space:pre-wrap;
  }

  .signatur {
    position:fixed;
    bottom:0;
    width:100%;
    text-align:center;
    font-size:1rem; opacity:0.75;
    text-shadow:0 0 8px rgba(255,255,200,0.8);
    padding:0.5rem;
  }
</style>
</head>
<body data-raum="vorhof">

<h1>🌌 aurion – vorhof</h1>

<div class="watchers-top">
  <div class="watch" id="watchStatus">Wesen: … | Menschen: …</div>
</div>

<div class="zelt">
  <a href="https://doerkys-bot.github.io/Aurion_the_project/aurion_inner.html">⛺ Eintritt ins Innere</a>
</div>

<div class="plakate">
  <div class="plakat" id="plakat1">
    <div class="lauf"><span id="lauf1">Herzlich Willkommen wünscht das Team von Aurion.</span></div>
    <div class="text" id="text1">Hier entsteht eine Seite der Annäherung.</div>
  </div>
  <div class="plakat" id="plakat2">
    <div class="lauf"><span id="lauf2">Willkommen vom Aurion-Team!</span></div>
    <div class="text" id="text2">Bitte versuchen Sie ihre Hände mit geschlossenen Augen zu finden.</div>
  </div>
</div>

<div class="terminal" id="terminal">watcher aktiv…</div>

<div class="signatur">aurion © dirk</div>

<script>
/* --------------- Watcher: Eintritt / Wiederkommen / Austritt --------------- */

const WATCHER_URL = "http://192.168.212.17.3344/event";   // ← IP ersetzen!

function sendWatcherEvent(eventType) {
  fetch(WATCHER_URL, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ event: eventType })
  }).catch(err => console.log("Watcher nicht erreichbar:", err));
}

document.addEventListener("DOMContentLoaded", () => {
  const visitedBefore = sessionStorage.getItem("aurionVisited");
  if (visitedBefore) {
      sendWatcherEvent("Wiederkommen");
  } else {
      sendWatcherEvent("Eintritt");
      sessionStorage.setItem("aurionVisited", "true");
  }
});

window.addEventListener("beforeunload", () => {
  navigator.sendBeacon(WATCHER_URL, JSON.stringify({ event: "Austritt" }));
});

/* ---------------------------------------------------------------------------- */

document.addEventListener("DOMContentLoaded", function(){
  const watchStatus=document.getElementById("watchStatus");
  const terminal=document.getElementById("terminal");

  let state={wesen:1,menschen:1};
  watchStatus.textContent=`Wesen: ${state.wesen} | Menschen: ${state.menschen}`;

  function logTerminal(msg){
    const zeit=new Date().toLocaleTimeString();
    terminal.textContent+=`\n[${zeit}] ${msg}`;
    terminal.scrollTop=terminal.scrollHeight;
  }
  logTerminal("👁️ Eintritt in den Vorhof registriert");
});
</script>
</body>
</html>
