<!-- Besucher Counter Fetch -->
<script>
function updateVisitorCounter() {
    fetch("counter.php")
        .then(r => r.text())
        .then(count => {
            document.getElementById("visitorBox").textContent =
                "Besucher gesamt: " + count;
        })
        .catch(() => {
            document.getElementById("visitorBox").textContent =
                "Besucher gesamt: ?";
        });
}

setInterval(updateVisitorCounter, 6000);
updateVisitorCounter();
</script>
