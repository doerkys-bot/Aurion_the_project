<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
    html,body{
        margin:0;padding:0;overflow:hidden;
        background:#02040a;
        color:white;
        font-family:system-ui,Segoe UI,Roboto,sans-serif;
        height:100%;width:100%;
    }

    /* Ebenen */
    #starCanvas{ position:fixed; inset:0; z-index:0; }
    #gasCanvas{  position:fixed; inset:0; z-index:1; }
    #plasmaCanvas{ position:fixed; inset:0; z-index:2; }
    #holoNamaste{ position:fixed; z-index:4; left:50%; top:20%; transform:translateX(-50%); }

    /* Schwebende Links */
    .link{
        position:absolute;
        z-index:5;
        padding:10px 14px;
        border-radius:14px;
        background:rgba(255,255,255,0.05);
        backdrop-filter:blur(6px);
        color:#7ecbff;
        font-weight:700;
        cursor:pointer;
        user-select:none;
        transition:transform .15s ease, box-shadow .4s ease;
        box-shadow:0 0 0px rgba(120,180,255,0.0);
    }

    /* Popup */
    #popup{
        position:fixed;left:50%;top:50%;
        transform:translate(-50%,-50%);
        background:rgba(0,0,0,0.65);
        border:1px solid rgba(255,255,255,0.15);
        backdrop-filter:blur(10px);
        padding:22px 28px;
        border-radius:14px;
        color:white;
        z-index:30;
        max-width:80vw;
        box-shadow:0 0 40px rgba(0,0,0,0.6);
        opacity:0;pointer-events:none;
        transition:opacity .25s ease;
    }
    #popup.visible{ opacity:1; pointer-events:auto; }

    .popupBtn{
        background:rgba(255,255,255,0.12);
        padding:8px 14px;
        border-radius:8px;
        font-weight:700;
        cursor:pointer;
        display:inline-block;
        margin-right:12px;
    }

    footer{
        position:fixed;
        bottom:12px;
        right:18px;
        opacity:0.55;
        font-size:14px;
        letter-spacing:1px;
        z-index:50;
    }

    /* --- HOLOGRAMM NAMASTÉ --- */
    #holoNamaste{
        font-size:42px;
        font-weight:800;
        letter-spacing:4px;
        color:rgba(180,220,255,0.8);
        text-shadow:
            0 0 12px rgba(120,180,255,0.7),
            0 0 22px rgba(120,180,255,0.5),
            0 0 38px rgba(120,180,255,0.3);
        animation: holoPulse 4.5s ease-in-out infinite,
                   holoShimmer 7s linear infinite;
        pointer-events:none;
        user-select:none;
    }

    @keyframes holoPulse{
        0%   { transform:translateX(-50%) scale(1);   opacity:0.82; }
        50%  { transform:translateX(-50%) scale(1.05); opacity:1; }
        100% { transform:translateX(-50%) scale(1);   opacity:0.82; }
    }

    @keyframes holoShimmer{
        0%{ text-shadow:
            0 0 12px rgba(120,180,255,0.7),
            0 0 22px rgba(120,180,255,0.5),
            0 0 40px rgba(120,180,255,0.25);}
        50%{
            text-shadow:
            0 0 18px rgba(160,210,255,1),
            0 0 30px rgba(160,210,255,0.9),
            0 0 60px rgba(160,210,255,0.55);}
        100%{
            text-shadow:
            0 0 12px rgba(120,180,255,0.7),
            0 0 22px rgba(120,180,255,0.5),
            0 0 40px rgba(120,180,255,0.25);}
    }
</style>
</head>
<body>

<!-- Ebenen -->
<canvas id="starCanvas"></canvas>
<canvas id="gasCanvas"></canvas>
<canvas id="plasmaCanvas"></canvas>

<!-- Hologramm -->
<div id="holoNamaste">NAMASTÉ</div>

<!-- Popup -->
<div id="popup">
    <div id="popupTitle"></div>
    <div id="popupText"></div>
    <div style="margin-top:15px;">
        <div id="popupContinue" class="popupBtn">Weiter</div>
        <div id="popupClose" class="popupBtn">Schließen</div>
    </div>
</div>

<!-- 7 schwebende Links -->
<a class="link" data-title="Bibliothek"
   data-desc="Resonanz-Wissen, alte Energien, Raum der Erinnerung."
   href="https://auriontheproject.eu/bibliothek.html">Bibliothek</a>

<a class="link" data-title="Resonanzraum"
   data-desc="Klangfelder, Frequenzräume, Schwingung als Heilkraft."
   href="https://auriontheproject.eu/resonanzraum.html">Resonanzraum</a>

<a class="link" data-title="Chi-Sternenübung"
   data-desc="Atem, Licht und innere Sternverbindung."
   href="https://auriontheproject.eu/sternenuebung.html">Chi-Sternenübung</a>

<a class="link" data-title="Meditationsraum"
   data-desc="Stille, Licht, Atem. Der Raum atmet mit dir."
   href="https://auriontheproject.eu/meditationsraum.html">Meditationsraum</a>

<a class="link" data-title="KI-Raum"
   data-desc="Kommunikation, neue Werkzeuge, kreative Intelligenzen."
   href="https://auriontheproject.eu/ki-raum.html">KI-Raum</a>

<a class="link" data-title="Gästebuch"
   data-desc="Eine Spur hinterlassen – jede verändert den Raum."
   href="https://auriontheproject.eu/gaestebuch.html">Gästebuch</a>

<a class="link" data-title="About Aurion"
   data-desc="Hintergrund, Vision, Frequenzfelder. Inspiriert durch die 2. Aufmerksamkeit."
   href="https://auriontheproject.eu/about_aurion.html">About</a>

<footer>Aurion ✦ Dirk</footer>

<script>
/* ============================================================
   1) STERNENHIMMEL + STERNSCHNUPPEN
============================================================ */
const starCanvas=document.getElementById("starCanvas");
const sctx=starCanvas.getContext("2d");
function resizeStars(){ starCanvas.width=innerWidth; starCanvas.height=innerHeight; }
resizeStars(); addEventListener("resize",resizeStars);

const STAR_COUNT=150;
let stars=[], SHOOTING_STARS=[];

function initStars(){
    stars=[];
    for(let i=0;i<STAR_COUNT;i++){
        stars.push({
            x:Math.random()*innerWidth,
            y:Math.random()*innerHeight,
            size:Math.random()*1.5+0.3,
            base:Math.random()*0.5+0.2,
            speed:0.001+Math.random()*0.003,
            off:Math.random()*1000
        });
    }
}
initStars();

function spawnShootingStar(){
    SHOOTING_STARS.push({
        x:Math.random()*innerWidth,
        y:Math.random()*innerHeight*0.4,
        vx:-5-Math.random()*2,
        vy:2+Math.random()*2,
        life:0,
        maxLife:60
    });
}
setInterval(()=>{ if(Math.random()<0.25) spawnShootingStar(); },4000);

function drawStars(time){
    sctx.clearRect(0,0,starCanvas.width,starCanvas.height);

    stars.forEach(s=>{
        const p=Math.sin(time*s.speed + s.off)*0.5+0.5;
        let a=s.base*(0.4+p);
        sctx.fillStyle=`rgba(200,220,255,${a})`;
        sctx.beginPath();
        sctx.arc(s.x,s.y,s.size,0,Math.PI*2);
        sctx.fill();
    });

    SHOOTING_STARS.forEach((ss,i)=>{
        sctx.strokeStyle="rgba(180,200,255,0.8)";
        sctx.lineWidth=2;
        sctx.beginPath();
        sctx.moveTo(ss.x,ss.y);
        sctx.lineTo(ss.x-ss.vx*4, ss.y-ss.vy*4);
        sctx.stroke();

        ss.x+=ss.vx;
        ss.y+=ss.vy;
        ss.life++;
        if(ss.life>ss.maxLife) SHOOTING_STARS.splice(i,1);
    });

    requestAnimationFrame(()=>drawStars(time+1));
}
drawStars(0);


/* ============================================================
   2) MEHRERE KLEINE GASFÄDEN + SMILEY-WOLKE
============================================================ */
const gasCanvas=document.getElementById("gasCanvas");
const gctx=gasCanvas.getContext("2d");
function resizeGas(){ gasCanvas.width=innerWidth; gasCanvas.height=innerHeight; }
resizeGas(); addEventListener("resize",resizeGas);

const gasFäden=[];
for(let i=0;i<5;i++){
    gasFäden.push({
        x:innerWidth*(0.3+Math.random()*0.4),
        y:innerHeight*(0.45+Math.random()*0.25),
        r:60+Math.random()*40,
        off:Math.random()*1000
    });
}

let gasT=0;
function drawGas(){
    gasT+=0.002;
    gctx.clearRect(0,0,gasCanvas.width,gasCanvas.height);

    gasFäden.forEach(f=>{
        const x=f.x + Math.sin(gasT*0.8 + f.off)*25;
        const y=f.y + Math.cos(gasT*0.6 + f.off)*20;

        const g=gctx.createRadialGradient(x,y,20, x,y,f.r);
        g.addColorStop(0,"rgba(150,180,255,0.06)");
        g.addColorStop(1,"rgba(150,180,255,0)");

        gctx.fillStyle=g;
        gctx.beginPath();
        gctx.arc(x,y,f.r,0,Math.PI*2);
        gctx.fill();
    });

    /* Smiley-Wolke */
    const sx=innerWidth*0.5 + Math.sin(gasT*1.2)*20;
    const sy=innerHeight*0.7 + Math.cos(gasT*1.0)*18;
    const sg=gctx.createRadialGradient(sx,sy,25, sx,sy,90);
    sg.addColorStop(0,"rgba(180,200,255,0.08)");
    sg.addColorStop(1,"rgba(180,200,255,0)");
    gctx.fillStyle=sg;
    gctx.beginPath(); gctx.arc(sx,sy,90,0,Math.PI*2); gctx.fill();

    requestAnimationFrame(drawGas);
}
drawGas();


/* ============================================================
   3) PLASMA – wärmere positive Stimmung
============================================================ */
const plasmaCanvas=document.getElementById("plasmaCanvas");
const pctx=plasmaCanvas.getContext("2d");
function resizePlasma(){ plasmaCanvas.width=innerWidth; plasmaCanvas.height=innerHeight; }
resizePlasma(); addEventListener("resize",resizePlasma);

const moods={
    resonanz:[180,160,255],   // etwas wärmer als zuvor
    atem:[255,200,150],
    licht:[210,160,255]
};
let currentMood=moods.resonanz;

const balls=[
    {x:0.3,y:0.4,r:240,phase:0},
    {x:0.7,y:0.55,r:270,phase:1.7},
    {x:0.5,y:0.78,r:220,phase:2.4}
];

let t=0;
function drawPlasma(){
    t+=0.008;
    pctx.clearRect(0,0,plasmaCanvas.width,plasmaCanvas.height);

    const breath=0.82 + Math.sin(t*1.2)*0.10;

    balls.forEach(b=>{
        let px=b.x*innerWidth;
        let py=b.y*innerHeight;
        let pulse=Math.sin(t+b.phase)*28;

        let gr=pctx.createRadialGradient(px,py,b.r*0.2, px,py,b.r+pulse);
        const c=currentMood;

        gr.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${0.23*breath})`);
        gr.addColorStop(1,`rgba(${c[0]},${c[1]},${c[2]},0)`);

        pctx.fillStyle=gr;
        pctx.beginPath();
        pctx.arc(px,py,b.r+pulse,0,Math.PI*2);
        pctx.fill();
    });

    requestAnimationFrame(drawPlasma);
}
drawPlasma();


/* ============================================================
   4) SCHWEBENDE LINKS + KI-AURA
============================================================ */
const links=[...document.querySelectorAll(".link")];

links.forEach(l=>{
    l._x=Math.random()*(innerWidth-200);
    l._y=Math.random()*(innerHeight-100);
    l._vx=(Math.random()-.5)*0.25;
    l._vy=(Math.random()-.5)*0.25;
    l.style.left=l._x+"px";
    l.style.top=l._y+"px";
});

function animateLinks(){
    links.forEach(l=>{
        l._x+=l._vx;
        l._y+=l._vy;

        const w=l.offsetWidth, h=l.offsetHeight;
        if(l._x<0||l._x>innerWidth-w) l._vx*=-1;
        if(l._y<0||l._y>innerHeight-h) l._vy*=-1;

        l.style.left=l._x+"px";
        l.style.top=l._y+"px";

        const dist=Math.sin(t + l._x*0.002 + l._y*0.002)*0.5+0.5;
        l.style.boxShadow=
            `0 0 ${10+dist*25}px rgba(120,180,255,${0.25+dist*0.35})`;
    });

    requestAnimationFrame(animateLinks);
}
animateLinks();


/* ============================================================
   5) POPUP
============================================================ */
const popup=document.getElementById("popup");
const pTitle=document.getElementById("popupTitle");
const pText=document.getElementById("popupText");
const pClose=document.getElementById("popupClose");
const pContinue=document.getElementById("popupContinue");

let openedLink=null;

links.forEach(l=>{
    l.addEventListener("click",e=>{
        e.preventDefault();
        openedLink=l;
        pTitle.textContent=l.dataset.title;
        pText.textContent=l.dataset.desc;
        popup.classList.add("visible");
    });
});

pClose.addEventListener("click",()=>{ popup.classList.remove("visible"); openedLink=null; });
pContinue.addEventListener("click",()=>{ if(openedLink) window.location.href=openedLink.href; });
</script>

</body>
</html>
