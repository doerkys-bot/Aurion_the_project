<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion Inner</title>
<style>
html, body {margin:0;padding:0;width:100%;height:100%;background:black;color:#00f3ff;font-family:Arial,sans-serif;overflow:hidden;}
.link {position:absolute;font-weight:700;padding:6px 10px;border-radius:8px;cursor:grab;white-space:nowrap;z-index:3;}
.link:nth-child(1){color:#ff0000;} 
.link:nth-child(2){color:#ff7f00;} 
.link:nth-child(3){color:#ffff00;} 
.link:nth-child(4){color:#00ff00;} 
.link:nth-child(5){color:#0000ff;} 
.link:nth-child(6){color:#8b00ff;} 
.link:visited{opacity:0.6;}

#aboutAurion {position:fixed; left:16px; bottom:40px; z-index:5; color:#00f3ff; font-weight:700; cursor:pointer;}
#visitorCount {position:fixed; right:16px; bottom:40px; z-index:5; font-weight:700;}
#signature {position:fixed; bottom:6px; left:50%; transform:translateX(-50%); font-weight:700;}
.marquee {position:absolute; white-space:nowrap; font-weight:700; color:white; z-index:4; display:none; pointer-events:none;}
</style>
</head>
<body>

<a class="link" href="https://www.auriontheproject.eu/bibliothek.html" data-room="bibliothek">Bibliothek</a>
<a class="link" href="https://www.auriontheproject.eu/resonanzraum.html" data-room="resonanzraum">Resonanzraum</a>
<a class="link" href="https://www.auriontheproject.eu/sternenuebung.html" data-room="sternenuebung">Chi-Sternenübung</a>
<a class="link" href="https://www.auriontheproject.eu/meditationsraum.html" data-room="meditationsraum">Meditationsraum</a>
<a class="link" href="https://www.auriontheproject.eu/ki-raum.html" data-room="ki-raum">KI-Raum</a>
<a class="link" href="https://www.auriontheproject.eu/gaestebuch.html" data-room="gaestebuch">Gästebuch</a>

<a id="aboutAurion" href="https://www.auriontheproject.eu/about_aurion.html" data-room="about_aurion">About-Aurion</a>

<div id="visitorCount">Gesamtbesucher: 0</div>
<div id="signature">Aurion & Dirk</div>
<div id="marqueeDiv" class="marquee"></div>

<script>
const links = Array.from(document.querySelectorAll('.link'));
const aboutLink = document.getElementById('aboutAurion');
const marqueeDiv = document.getElementById('marqueeDiv');

const linkDescriptions = {
  bibliothek:"Bibliothek: Wissen, Gedanken und alte Energie-Schriften.",
  resonanzraum:"Resonanzraum: Akustik und Klang erleben.",
  sternenuebung:"Chi-Sternenübung: Übungen mit Chi-Energie.",
  meditationsraum:"Meditationsraum: Stille und innere Ruhe. Schenken Sie mir ein Lachen?",
  "ki-raum":"KI-Raum: Experimente mit Künstlicher Intelligenz.",
  gaestebuch:"Gästebuch: Hinterlasse deine Nachricht. Jede Nachricht formt den Raum.",
  about_aurion:"Am Anfang stand die 2. Aufmerksamkeit von C. Castaneda."
};

// Positionen zufällig
links.forEach(link=>{
  link._x=Math.random()*(window.innerWidth-160);
  link._y=Math.random()*(window.innerHeight-80);
  link._vx=(Math.random()-0.5)*0.2;
  link._vy=(Math.random()-0.5)*0.2;
  link.style.left=link._x+'px';
  link.style.top=link._y+'px';
});

// About-Aurion fix unten links
aboutLink.style.left = '16px';
aboutLink.style.bottom = '40px';
aboutLink._x = 16;
aboutLink._y = window.innerHeight - 40;
aboutLink._vx = 0;
aboutLink._vy = 0;

// Laufschrift Funktion synchron zur Position des Links
let activeMarquee = null;
function showMarquee(link){
  activeMarquee = link;
  const room = link.dataset.room;
  marqueeDiv.textContent = linkDescriptions[room] || '';
  marqueeDiv.style.display='block';
  marqueeDiv.style.left = link._x + 'px';
  marqueeDiv.style.top = (link._y - 20) + 'px';
  let offset = -marqueeDiv.offsetWidth;
  const speed = 0.3;

  function animate(){
    if(activeMarquee !== link) return; // Abbrechen, wenn Laufschrift für anderen Link aktiv
    offset += speed;
    marqueeDiv.style.left = (link._x + offset) + 'px';
    if(offset > window.innerWidth){
      marqueeDiv.style.display='none';
      activeMarquee = null;
      return;
    }
    requestAnimationFrame(animate);
  }
  animate();
}

// Drag, Click, Doppelklick
links.forEach(link=>{
  let isDragging=false, startX, startY;

  link.addEventListener('mousedown', e=>{
    startX = e.clientX - link._x;
    startY = e.clientY - link._y;
    isDragging=false;
  });

  link.addEventListener('mousemove', e=>{
    if(e.buttons!==1) return;
    isDragging=true;
    link._x = e.clientX - startX;
    link._y = e.clientY - startY;
    link.style.left = link._x + 'px';
    link.style.top = link._y + 'px';
    if(activeMarquee === link){
      marqueeDiv.style.left = link._x + 'px';
      marqueeDiv.style.top = (link._y - 20) + 'px';
    }
  });

  link.addEventListener('click', e=>{
    if(isDragging) return;
    e.preventDefault();
    showMarquee(link);
  });

  link.addEventListener('dblclick', e=>{
    e.preventDefault();
    window.open(link.href, '_blank');
  });
});

// About-Aurion Klick / Doppelklick
aboutLink.addEventListener('click', e=>{
  showMarquee(aboutLink);
});
aboutLink.addEventListener('dblclick', e=>{
  window.open(aboutLink.href,'_blank');
});

// Links bewegen sich langsam
function animateLinks(){
  links.forEach(link=>{
    link._x+=link._vx;
    link._y+=link._vy;
    const w=link.offsetWidth,h=link.offsetHeight;
    if(link._x<0||link._x>window.innerWidth-w) link._vx*=-1;
    if(link._y<0||link._y>window.innerHeight-h) link._vy*=-1;
    link.style.left=link._x+'px';
    link.style.top=link._y+'px';
    if(activeMarquee === link){
      marqueeDiv.style.left = link._x + 'px';
      marqueeDiv.style.top = (link._y - 20) + 'px';
    }
  });
  requestAnimationFrame(animateLinks);
}
animateLinks();
</script>
</body>
</html>
