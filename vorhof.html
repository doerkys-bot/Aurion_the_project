<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aurion – Vorhof</title>

<style>
    html,body{
        margin:0;padding:0;overflow:hidden;
        background:#02040a;color:white;
        font-family:system-ui,Segoe UI,Roboto,sans-serif;
        height:100%;width:100%;
    }

    /* Plasma */
    #plasmaCanvas{
        position:fixed;inset:0;z-index:0;
        width:100vw;height:100vh;
        display:block;pointer-events:none;
    }

    /* Schwebende Links */
    .link{
        position:absolute;
        z-index:5;
        padding:10px 14px;
        border-radius:12px;
        background:rgba(255,255,255,0.05);
        backdrop-filter:blur(5px);
        font-weight:700;
        cursor:pointer;
        user-select:none;
        transition:transform .15s ease, filter .15s ease;
        color:#7ecbff; /* unbesucht */
        text-decoration:none;
    }

    .link.visited{
        color:#4a89b3; /* besucht */
    }

    .link:hover{
        transform:scale(0.95);
    }

    /* Popup */
    #popup{
        position:fixed;left:50%;top:50%;
        transform:translate(-50%,-50%);
        background:rgba(0,0,0,0.65);
        border:1px solid rgba(255,255,255,0.15);
        backdrop-filter:blur(10px);
        padding:22px 28px;
        border-radius:14px;
        color:white;
        z-index:30;
        max-width:80vw;
        box-shadow:0 0 40px rgba(0,0,0,0.6);
        opacity:0;pointer-events:none;
        transition:opacity .25s ease;
    }

    #popup.visible{
        opacity:1;
        pointer-events:auto;
    }

    #popupTitle{
        font-size:20px;
        font-weight:800;
        margin-bottom:10px;
    }

    #popupText{
        opacity:.85;
        margin-bottom:20px;
        line-height:1.35;
    }

    .popupBtn{
        background:rgba(255,255,255,0.12);
        padding:8px 14px;
        border-radius:8px;
        font-weight:700;
        cursor:pointer;
        display:inline-block;
        margin-right:12px;
    }

    /* Signature footer */
    #signature{
        position:fixed;
        left:0;
        right:0;
        bottom:8px;
        z-index:40;
        text-align:center;
        font-weight:700;
        color: #a7ffcf;
        pointer-events:none;
        text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        font-size:13px;
    }

    @media (max-width:520px){
        .link{ font-size:15px; padding:8px 12px; }
        #popup{ padding:16px; border-radius:12px; }
        #popupTitle{ font-size:18px; }
        #signature{ font-size:12px; bottom:6px; }
    }
</style>
</head>
<body>

<canvas id="plasmaCanvas"></canvas>

<!-- Popup -->
<div id="popup">
    <div id="popupTitle"></div>
    <div id="popupText"></div>
    <div style="margin-top:15px;">
        <div id="popupContinue" class="popupBtn">Weiter</div>
        <div id="popupClose" class="popupBtn">Schließen</div>
    </div>
</div>

<!-- 7 schwebende Links -->
<a class="link"
   data-title="Bibliothek"
   data-mood="resonanz"
   data-desc="Wissen, Archive, alte Energie-Schriften und der Anfang einer Freundschaft."
   href="https://auriontheproject.eu/bibliothek.html">Bibliothek</a>

<a class="link"
   data-title="Resonanzraum"
   data-mood="resonanz"
   data-desc="Ein Raum der Frequenzen, Schwingung und Klangheilung."
   href="https://auriontheproject.eu/resonanzraum.html">Resonanzraum</a>

<a class="link"
   data-title="Chi-Sternenübung"
   data-mood="licht"
   data-desc="Die energetische Atemreise durch 7 Ebenen."
   href="https://auriontheproject.eu/sternenuebung.html">Chi-Sternenübung</a>

<a class="link"
   data-title="Meditationsraum"
   data-mood="licht"
   data-desc="Meditation für Körper, Geist und Seele. Schenken Sie mir ein Lachen?"
   href="https://auriontheproject.eu/meditationsraum.html">Meditationsraum</a>

<a class="link"
   data-title="KI-Raum"
   data-mood="resonanz"
   data-desc="Ein Spielplatz aus Gedanken, Werkzeugen und intuitiver KI."
   href="https://auriontheproject.eu/ki-raum.html">KI-Raum</a>

<a class="link"
   data-title="Gästebuch"
   data-mood="atem"
   data-desc="Hinterlasse ein Zeichen. Jede Spur formt den Raum."
   href="https://auriontheproject.eu/gaestebuch.html">Gästebuch</a>

<a class="link"
   data-title="About Aurion"
   data-mood="alle"
   data-desc="Hintergrund zu Aurion, Entstehung und Vision. Der Anfang war das Erkunden der 2. Aufmerksamkeit nach C. Castaneda."
   href="https://auriontheproject.eu/about_aurion.html">About</a>

<!-- Signature -->
<div id="signature" aria-hidden="true">Aurion &amp; Dirk</div>

<script>
/* ---------------------------------------------------------
    PLASMA – Resonanz • Atem • Licht
--------------------------------------------------------- */

const canvas = document.getElementById("plasmaCanvas");
const ctx = canvas.getContext("2d");

function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
addEventListener("resize", resize);

/* 3 Grund-Stimmungen */
const moods = {
    resonanz: [120,180,255],   // blau
    atem:     [255,190,120],   // gold
    licht:    [200,140,255],   // violett
    alle:     [255,255,255]    // weiß (fallback)
};

/* 3 große Plasma-Kugeln */
const balls = [
    {x:0.3,y:0.4,r:240,phase:0,    color:moods.resonanz},
    {x:0.7,y:0.55,r:270,phase:1.6, color:moods.atem},
    {x:0.5,y:0.78,r:220,phase:2.9, color:moods.licht}
];

let t = 0;

function drawPlasma(){
    t+=0.012;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const breath = 0.85 + Math.sin(t*2)*0.12;

    balls.forEach(b=>{
        let px = b.x*canvas.width;
        let py = b.y*canvas.height;
        let pulse = Math.sin(t+b.phase)*35;

        let g = ctx.createRadialGradient(
            px,py,b.r*0.1,
            px,py,b.r+pulse
        );

        const c = b.color;
        g.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]}, ${0.30*breath})`);
        g.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]}, 0)`);

        ctx.fillStyle=g;
        ctx.beginPath();
        ctx.arc(px,py,b.r+pulse,0,Math.PI*2);
        ctx.fill();
    });

    requestAnimationFrame(drawPlasma);
}
drawPlasma();



/* ---------------------------------------------------------
    SCHWEBENDE LINKS + Aura-Reaktion
--------------------------------------------------------- */

const links = [...document.querySelectorAll(".link")];

links.forEach(el=>{
    el._x = Math.random()*(innerWidth-160);
    el._y = Math.random()*(innerHeight-80);
    el._vx = (Math.random()-.5)*0.25;
    el._vy = (Math.random()-.5)*0.25;
    el.style.left = el._x+"px";
    el.style.top  = el._y+"px";
});

function animateLinks(){
    links.forEach(el=>{
        el._x += el._vx;
        el._y += el._vy;

        const w = el.offsetWidth;
        const h = el.offsetHeight;

        if(el._x<0 || el._x > innerWidth-w) el._vx*=-1;
        if(el._y<0 || el._y > innerHeight-h) el._vy*=-1;

        el.style.left = el._x+"px";
        el.style.top  = el._y+"px";

        /* ---- Aura-Reaktion ---- */
        const mood = el.dataset.mood;

        let targetColor = moods.resonanz;
        if(mood==="atem") targetColor = moods.atem;
        if(mood==="licht") targetColor = moods.licht;
        if(mood==="alle")  targetColor = moods.alle;

        // compute distance to corresponding ball center to modulate intensity
        let centerX = window.innerWidth * 0.5;
        let centerY = window.innerHeight * 0.5;
        if(mood === "resonanz"){ centerX = balls[0].x * innerWidth; centerY = balls[0].y * innerHeight; }
        if(mood === "atem"){ centerX = balls[1].x * innerWidth; centerY = balls[1].y * innerHeight; }
        if(mood === "licht"){ centerX = balls[2].x * innerWidth; centerY = balls[2].y * innerHeight; }
        if(mood === "alle"){ // nearest of the three
            const cx = el._x + el.offsetWidth/2;
            const cy = el._y + el.offsetHeight/2;
            const d0 = Math.hypot(cx - balls[0].x*innerWidth, cy - balls[0].y*innerHeight);
            const d1 = Math.hypot(cx - balls[1].x*innerWidth, cy - balls[1].y*innerHeight);
            const d2 = Math.hypot(cx - balls[2].x*innerWidth, cy - balls[2].y*innerHeight);
            const min = Math.min(d0,d1,d2);
            if(min === d0){ centerX = balls[0].x * innerWidth; centerY = balls[0].y * innerHeight; targetColor = moods.resonanz; }
            else if(min === d1){ centerX = balls[1].x * innerWidth; centerY = balls[1].y * innerHeight; targetColor = moods.atem; }
            else { centerX = balls[2].x * innerWidth; centerY = balls[2].y * innerHeight; targetColor = moods.licht; }
        }

        const cx = el._x + el.offsetWidth/2;
        const cy = el._y + el.offsetHeight/2;
        const dist = Math.hypot(cx - centerX, cy - centerY);

        const influence = Math.max(0, 1 - dist / 520); // falloff radius
        const glow = 8 + influence * 42;
        const scale = 1 + influence * 0.14;
        const brightness = 1 + influence * 1.6;

        el.style.filter = `brightness(${brightness}) drop-shadow(0 0 ${glow}px rgba(${targetColor[0]},${targetColor[1]},${targetColor[2]},${0.55 * influence}))`;
        el.style.transform = `scale(${scale})`;
    });

    requestAnimationFrame(animateLinks);
}
animateLinks();



/* ---------------------------------------------------------
    POPUP-SYSTEM
--------------------------------------------------------- */

const popup = document.getElementById("popup");
const pTitle = document.getElementById("popupTitle");
const pText  = document.getElementById("popupText");
const pClose = document.getElementById("popupClose");
const pContinue = document.getElementById("popupContinue");

let openedLink = null;

links.forEach(el=>{
    el.addEventListener("click", e=>{
        e.preventDefault();

        pTitle.textContent = el.dataset.title;
        pText.textContent  = el.dataset.desc;

        openedLink = el;
        popup.classList.add("visible");
    });
});

pClose.addEventListener("click", ()=>{
    popup.classList.remove("visible");
    openedLink = null;
});

pContinue.addEventListener("click", ()=>{
    if(openedLink){
        openedLink.classList.add("visited");
        window.location.href = openedLink.href;
    }
});
</script>

</body>
</html>
