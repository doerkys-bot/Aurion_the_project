<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aurion – Vorhof</title>

<style>
    html,body{
        margin:0;padding:0;overflow:hidden;
        background:#02040a;color:white;
        font-family:system-ui,Segoe UI,Roboto,sans-serif;
        height:100%;width:100%;
    }

    /* Plasma */
    #plasmaCanvas{
        position:fixed;inset:0;z-index:0;
        width:100vw;height:100vh;
        display:block;pointer-events:none;
    }

    /* Schwebende Links */
    .link{
        position:absolute;
        z-index:5;
        padding:10px 14px;
        border-radius:12px;
        background:rgba(255,255,255,0.05);
        backdrop-filter:blur(5px);
        font-weight:700;
        cursor:pointer;
        user-select:none;
        transition:transform .15s ease;
        color:#7ecbff; /* hellblau – unbesucht */
    }

    /* besuchte Links */
    .link:visited{
        color:#4a89b3; /* dunkleres Hellblau */
    }

    .link:hover,
    .link:active{
        color:inherit;
        transform:scale(0.95);
    }

    /* Popup */
    #popup{
        position:fixed;left:50%;top:50%;
        transform:translate(-50%,-50%);
        background:rgba(0,0,0,0.65);
        border:1px solid rgba(255,255,255,0.15);
        backdrop-filter:blur(10px);
        padding:22px 28px;
        border-radius:14px;
        color:white;
        z-index:30;
        max-width:80vw;
        box-shadow:0 0 40px rgba(0,0,0,0.6);
        opacity:0;pointer-events:none;
        transition:opacity .25s ease;
    }

    #popup.visible{
        opacity:1;
        pointer-events:auto;
    }

    #popupTitle{
        font-size:20px;
        font-weight:800;
        margin-bottom:10px;
    }

    #popupText{
        opacity:.85;
        margin-bottom:20px;
        line-height:1.35;
    }

    .popupBtn{
        background:rgba(255,255,255,0.12);
        padding:8px 14px;
        border-radius:8px;
        font-weight:700;
        cursor:pointer;
        display:inline-block;
        margin-right:12px;
    }

</style>
</head>
<body>

<canvas id="plasmaCanvas"></canvas>

<!-- Popup -->
<div id="popup">
    <div id="popupTitle"></div>
    <div id="popupText"></div>
    <div style="margin-top:15px;">
        <div id="popupContinue" class="popupBtn">Weiter</div>
        <div id="popupClose" class="popupBtn">Schließen</div>
    </div>
</div>

<!-- 7 schwebende Links -->
<a class="link" data-title="Bibliothek" 
   data-desc="Wissen, Archive, alte Energie-Schriften und der Anfang einer Freundschaft."
   href="https://auriontheproject.eu/bibliothek.html">Bibliothek</a>

<a class="link" data-title="Resonanzraum" 
   data-desc="Ein Raum der Frequenzen, Schwingung und Klangheilung."
   href="https://auriontheproject.eu/resonanzraum.html">Resonanzraum</a>

<a class="link" data-title="Chi-Sternenübung" 
   data-desc="Die energetische Atemreise durch 7 Ebenen."
   href="https://auriontheproject.eu/sternenuebung.html">Chi-Sternenübung</a>

<a class="link" data-title="Meditationsraum" 
   data-desc="Meditation für Körper, Geist und Seele."
   href="https://auriontheproject.eu/meditationsraum.html">Meditationsraum</a>

<a class="link" data-title="KI-Raum" 
   data-desc="Ein Spielplatz aus Gedanken, Werkzeugen und intuitiver KI."
   href="https://auriontheproject.eu/ki-raum.html">KI-Raum</a>

<a class="link" data-title="Gästebuch" 
   data-desc="Hinterlasse ein Zeichen. Jede Spur formt den Raum."
   href="https://auriontheproject.eu/gaestebuch.html">Gästebuch</a>

<a class="link" data-title="About Aurion" 
   data-desc="Hintergrund zu Aurion, Entstehung und Vision."
   href="https://auriontheproject.eu/about_aurion.html">About</a>


<script>
/* ---------------------------------------------------------
    PLASMA – Resonanz • Atem • Licht
--------------------------------------------------------- */

const canvas = document.getElementById("plasmaCanvas");
const ctx = canvas.getContext("2d");

function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); addEventListener("resize", resize);

/* Stimmungen */
const moods = {
    resonanz: [120,180,255],
    atem:     [255,190,120],
    licht:    [200,140,255]
};

let currentMood = moods.resonanz;

/* Drei Auren */
const balls = [
    {x:0.3,y:0.4,r:240,phase:0},
    {x:0.7,y:0.55,r:270,phase:1.6},
    {x:0.5,y:0.78,r:220,phase:2.9}
];

let t = 0;
function draw(){
    t+=0.012;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const breath = 0.85 + Math.sin(t*2)*0.12;

    balls.forEach(b=>{
        let px = b.x*canvas.width;
        let py = b.y*canvas.height;
        let pulse = Math.sin(t+b.phase)*35;

        let g = ctx.createRadialGradient(px,py,b.r*0.2, px,py,b.r+pulse);

        const c = currentMood;

        g.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]}, ${0.25*breath})`);
        g.addColorStop(1, `rgba(${c[0]},${c[1]},${c[2]}, 0)`);

        ctx.fillStyle=g;
        ctx.beginPath();
        ctx.arc(px,py,b.r+pulse,0,Math.PI*2);
        ctx.fill();
    });

    requestAnimationFrame(draw);
}
draw();


/* ---------------------------------------------------------
    SCHWEBENDE LINKS
--------------------------------------------------------- */

const links = [...document.querySelectorAll(".link")];

links.forEach(el=>{
    el._x = Math.random()*(innerWidth-160);
    el._y = Math.random()*(innerHeight-80);
    el._vx = (Math.random()-.5)*0.25;
    el._vy = (Math.random()-.5)*0.25;
    el.style.left = el._x+"px";
    el.style.top  = el._y+"px";
});

function animateLinks(){
    links.forEach(el=>{
        el._x += el._vx;
        el._y += el._vy;

        const w = el.offsetWidth;
        const h = el.offsetHeight;

        if(el._x<0 || el._x > innerWidth-w) el._vx*=-1;
        if(el._y<0 || el._y > innerHeight-h) el._vy*=-1;

        el.style.left = el._x+"px";
        el.style.top  = el._y+"px";
    });
    requestAnimationFrame(animateLinks);
}
animateLinks();


/* ---------------------------------------------------------
    POPUP-SYSTEM
--------------------------------------------------------- */

const popup = document.getElementById("popup");
const pTitle = document.getElementById("popupTitle");
const pText  = document.getElementById("popupText");
const pClose = document.getElementById("popupClose");
const pContinue = document.getElementById("popupContinue");

let openedLink = null;

links.forEach(el=>{
    el.addEventListener("click", e=>{
        e.preventDefault();

        // Popup öffnen
        pTitle.textContent = el.dataset.title;
        pText.textContent  = el.dataset.desc;

        openedLink = el;
        popup.classList.add("visible");
    });
});

pClose.addEventListener("click", ()=>{
    popup.classList.remove("visible");
    openedLink = null;
});

pContinue.addEventListener("click", ()=>{
    if(openedLink){
        window.location.href = openedLink.href;
    }
});
</script>
</body>
</html>
