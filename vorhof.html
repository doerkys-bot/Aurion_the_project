<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
html,body{
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    overflow:hidden;
    background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpg")
               center/cover no-repeat fixed;
    color:white;
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
}

/* 🌬 Raum-Atmung */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(120,180,255,0.08);
    z-index:0;
    animation:spaceBreath 14s ease-in-out infinite;
    pointer-events:none;
}

body.attuned::before{
    background:rgba(120,180,255,0.04);
    animation-duration:20s;
}

@keyframes spaceBreath{
    0%{opacity:0.05;}
    30%{opacity:0.14;}
    60%{opacity:0.14;}
    100%{opacity:0.05;}
}

/* 🙏 NAMASTÉ */
#holoNamaste{
    position:fixed;
    left:50%;
    top:calc(10% - 38px); /* 38px nach oben */
    transform:translateX(-50%);
    z-index:4;
    font-size:42px;
    font-weight:800;
    letter-spacing:4px;
    color:rgba(180,220,255,0.9);
    text-shadow:
        0 0 14px rgba(120,180,255,0.7),
        0 0 28px rgba(120,180,255,0.45),
        0 0 48px rgba(120,180,255,0.25);
    animation:holoPulse 5s ease-in-out infinite;
    pointer-events:none;
}

@keyframes holoPulse{
    0%,100%{opacity:.75}
    50%{opacity:1}
}

/* 🔗 Links */
.link{
    position:absolute;
    z-index:5;
    padding:14px 20px;
    border-radius:18px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(6px);
    box-shadow:0 0 22px rgba(80,160,255,0.18);
}

.link span{
    display:inline-block;
    font-weight:700;
    color:black; /* unbenutzt = schwarz */
}

/* besuchte Links */
.link.visited span{
    color:white;
}

/* 📍 Link-Positionen */
.link:nth-of-type(1){top:32%; left:20%;}
.link:nth-of-type(2){top:40%; left:55%;}
.link:nth-of-type(3){top:50%; left:28%;}
.link:nth-of-type(4){top:58%; left:60%;}
.link:nth-of-type(5){top:68%; left:22%;}
.link:nth-of-type(6){top:72%; left:55%;}
.link:nth-of-type(7){top:84%; left:40%;}

/* 📦 Beipackzettel */
#beipackzettel{
    position:fixed;
    top:8%;
    right:6%;
    width:320px;
    z-index:7;
    border-radius:14px;
    box-shadow:0 0 30px rgba(120,180,255,0.35);
    transition:all 2s ease;
    cursor:pointer;
}

#beipackzettel.minimized{
    width:80px;
    height:auto;
    opacity:0.3;
    top:90%;
}

/* 🧭 TEXTBOX */
#pforte{
    position:fixed;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    width:360px;
    padding:20px 24px;
    border-radius:18px;
    background:rgba(10,20,40,0.78);
    backdrop-filter:blur(8px);
    border:1px solid rgba(120,180,255,0.4);
    box-shadow:0 0 32px rgba(120,180,255,0.45);
    z-index:6;
    font-size:15px;
    line-height:1.5;
    cursor:grab;
    opacity:0;
    pointer-events:auto;
}

#pforte.visible{
    opacity:1;
}
</style>
</head>

<body>

<div id="holoNamaste">NAMASTÉ</div>

<a class="link" href="bibliothek.html"><span>Bibliothek</span></a>
<a class="link" href="resonanzraum.html"><span>Resonanzraum</span></a>
<a class="link" href="sternenuebung.html"><span>Chi-Sternenübung</span></a>
<a class="link" href="meditationsraum.html"><span>Meditationsraum</span></a>
<a class="link" href="ki-raum.html"><span>KI-Raum</span></a>
<a class="link" href="gaestebuch.html"><span>Gästebuch</span></a>
<a class="link" href="about_aurion.html"><span>About Aurion</span></a>

<img id="beipackzettel"
     src="https://doerkys-bot.github.io/Aurion_the_project/b_1_p.jpeg"
     title="Beipackzettel">

<div id="pforte">
<strong>Ein Weg in die 2. Aufmerksamkeit</strong><br><br>
Tun Sie mir den Gefallen und versuchen Sie,<br>
mit geschlossenen Augen in Ihre Hände zu schauen.<br>
Finden Sie im Geist Ihre Hände.
</div>

<script>
const pforte = document.getElementById("pforte");
const beipack = document.getElementById("beipackzettel");

let dragging = false;
let offsetX = 0, offsetY = 0;
let firstMove = false;

// 15 Sekunden Timer: Beipackzettel minimieren, Textbox anzeigen
setTimeout(() => {
    beipack.classList.add("minimized");
    pforte.classList.add("visible");
}, 15000);

// Drag & Drop Textbox
pforte.addEventListener("pointerdown", e => {
    dragging = true;
    pforte.setPointerCapture(e.pointerId);
    pforte.style.cursor = "grabbing";

    const rect = pforte.getBoundingClientRect();
    pforte.style.left = rect.left + "px";
    pforte.style.top  = rect.top + "px";
    pforte.style.transform = "none";

    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
});

document.addEventListener("pointermove", e => {
    if (!dragging) return;
    pforte.style.left = (e.clientX - offsetX) + "px";
    pforte.style.top  = (e.clientY - offsetY) + "px";

    if (!firstMove){
        firstMove = true;
        document.body.classList.add("attuned");
    }
});

document.addEventListener("pointerup", () => {
    dragging = false;
    pforte.style.cursor = "grab";
});

// Links langsam kreuz und quer (ultra sanft)
const links = document.querySelectorAll(".link");
links.forEach(link => {
    let x=0, y=0;
    let dx = (Math.random() * 0.02 + 0.005) * (Math.random()<0.5?-1:1);
    let dy = (Math.random() * 0.02 + 0.005) * (Math.random()<0.5?-1:1);

    function animate(){
        x += dx;
        y += dy;

        if(x>30 || x<-30) dx*=-1;
        if(y>30 || y<-30) dy*=-1;

        link.style.transform = `translate(${x}px,${y}px) rotate(${x*0.8}deg)`;

        requestAnimationFrame(animate);
    }
    animate();
});

// Beipackzettel anklickbar zum Wiederherstellen
beipack.addEventListener("click", () => {
    beipack.classList.remove("minimized");
});

// Lokales visited Tracking
links.forEach(link => {
    const key = "visited_" + link.getAttribute("href");
    if(localStorage.getItem(key)) link.classList.add("visited");
    link.addEventListener("click", () => {
        localStorage.setItem(key, true);
        link.classList.add("visited");
    });
});
</script>

</body>
</html>
