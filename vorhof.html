<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpeg")
               center/cover no-repeat fixed;
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
    color:white;
}

/* Raum-Atmung */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(120,180,255,0.07);
    animation:breath 18s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
}
body.attuned::before{
    background:rgba(120,180,255,0.035);
}

@keyframes breath{
    0%,100%{opacity:.05}
    50%{opacity:.14}
}

/* NAMASTÉ */
#holoNamaste{
    position:fixed;
    top:0;
    left:50%;
    transform:translateX(-50%);
    padding-top:10px;
    font-size:42px;
    letter-spacing:4px;
    font-weight:800;
    color:rgba(200,230,255,.95);
    text-shadow:0 0 30px rgba(120,180,255,.7);
    pointer-events:none;
    z-index:5;
}

/* Links */
.link{
    position:absolute;
    padding:14px 20px;
    border-radius:18px;
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(6px);
    box-shadow:0 0 18px rgba(80,160,255,.18);
    cursor:pointer;
    z-index:3;
}
.link span{
    display:inline-block;
    font-weight:700;
    pointer-events:none;
}

/* Linkfarben */
.link.unvisited span{ color:#7a8fa8; }
.link.visited span{ color:#ffffff; }

/* Beipackzettel */
#beipack{
    position:fixed;
    top:8%;
    right:6%;
    width:320px;
    border-radius:14px;
    box-shadow:0 0 30px rgba(120,180,255,.35);
    transition:all .6s ease;
    cursor:pointer;
    z-index:6;
}
#beipack.min{
    width:110px;
    opacity:.6;
}

/* Textbox */
#pforte{
    position:fixed;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    width:360px;
    padding:22px;
    border-radius:18px;
    background:rgba(10,20,40,.8);
    backdrop-filter:blur(8px);
    border:1px solid rgba(120,180,255,.4);
    box-shadow:0 0 32px rgba(120,180,255,.45);
    font-size:15px;
    line-height:1.55;
    cursor:grab;
    opacity:0;
    z-index:4;
}
#pforte.visible{opacity:1;}
</style>
</head>

<body>

<div id="holoNamaste">NAMASTÉ</div>

<a class="link" href="bibliothek.html"><span>Bibliothek</span></a>
<a class="link" href="resonanzraum.html"><span>Resonanzraum</span></a>
<a class="link" href="sternenuebung.html"><span>Chi-Sternenübung</span></a>
<a class="link" href="meditationsraum.html"><span>Meditationsraum</span></a>
<a class="link" href="ki-raum.html"><span>KI-Raum</span></a>
<a class="link" href="gaestebuch.html"><span>Gästebuch</span></a>
<a class="link" href="about_aurion.html"><span>About Aurion</span></a>

<img id="beipack"
     src="https://doerkys-bot.github.io/Aurion_the_project/b_1_p.jpeg">

<div id="pforte">
<strong>Ein Weg in die 2. Aufmerksamkeit</strong><br>
<em>Begehen Sie die erste Pforte der Zauberer.</em><br><br>
Tun Sie mir den Gefallen und versuchen Sie,<br>
mit geschlossenen Augen in Ihre Hände zu schauen.<br>
Finden Sie im Geist Ihre Hände.
</div>

<script>
/* ===== LINK-BEWEGUNG IM STERNENTOR ===== */
const links=[...document.querySelectorAll(".link")];
const W=window.innerWidth,H=window.innerHeight;
const cx=W/2,cy=H/2;
const rx=W*0.32,ry=H*0.28;

links.forEach((l,i)=>{
  const v=localStorage.getItem("v_"+l.href);
  l.classList.add(v?"visited":"unvisited");
  l.onclick=()=>localStorage.setItem("v_"+l.href,1);

  l.a=Math.random()*Math.PI*2;
  l.s=0.00015+Math.random()*0.00025;
  l.r=Math.random()*Math.PI*2;
});

function animate(){
  links.forEach(l=>{
    l.a+=l.s;
    l.r+=l.s*0.6;

    const x=cx+Math.cos(l.a)*rx;
    const y=cy+Math.sin(l.a)*ry;

    l.style.left=x+"px";
    l.style.top=y+"px";
    l.style.transform=`rotate(${l.r}rad)`;
    l.querySelector("span").style.transform=`rotate(${-l.r}rad)`;
  });
  requestAnimationFrame(animate);
}
animate();

/* ===== Beipackzettel ===== */
const beipack=document.getElementById("beipack");
setTimeout(()=>beipack.classList.add("min"),15000);
beipack.onclick=()=>beipack.classList.toggle("min");

/* ===== Textbox ===== */
const p=document.getElementById("pforte");
setTimeout(()=>p.classList.add("visible"),15000);

let drag=false,ox=0,oy=0,first=false;
p.addEventListener("pointerdown",e=>{
 drag=true;
 p.setPointerCapture(e.pointerId);
 const r=p.getBoundingClientRect();
 ox=e.clientX-r.left; oy=e.clientY-r.top;
 p.style.left=r.left+"px"; p.style.top=r.top+"px";
 p.style.transform="none";
});
document.addEventListener("pointermove",e=>{
 if(!drag)return;
 p.style.left=e.clientX-ox+"px";
 p.style.top=e.clientY-oy+"px";
 if(!first){document.body.classList.add("attuned");first=true;}
});
document.addEventListener("pointerup",()=>drag=false);
</script>

</body>
</html>
