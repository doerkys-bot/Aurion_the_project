<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
html, body {
    margin:0; padding:0; height:100%; width:100%;
    overflow:hidden;
    background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpeg")
        center/cover no-repeat fixed;
    color:white;
    font-family:system-ui, Segoe UI, Roboto, sans-serif;
}

/* sanfte Raumatmung */
body::before {
    content:"";
    position:fixed; inset:0;
    background:rgba(120,180,255,0.08);
    pointer-events:none;
    animation:spaceBreath 14s ease-in-out infinite;
}
@keyframes spaceBreath {
    0%,100%{opacity:0.05}
    40%,60%{opacity:0.14}
}

/* Titel */
#holoNamaste {
    position:fixed;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    font-size:40px;
    letter-spacing:4px;
    font-weight:800;
    color:rgba(180,220,255,0.9);
    text-shadow:0 0 20px rgba(120,180,255,0.6);
    z-index:10;
}

/* Links im Sternentor */
.link {
    position:absolute;
    z-index:8;
    padding:12px 18px;
    border-radius:16px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(6px);
    color:rgba(220,220,220,0.7);
    font-weight:700;
    text-decoration:none;
    transition:transform .3s ease, color .3s ease, box-shadow .3s ease;
}
.link:hover {
    color:white;
    transform:scale(1.1);
    box-shadow:0 0 30px rgba(120,220,255,0.6);
}

/* Beipackzettel – Artefakt der 1. Aufmerksamkeit */
#beipackzettel {
    position:fixed;
    top:50px;
    left:30px;
    width:300px;
    border-radius:14px;
    box-shadow:0 0 30px rgba(120,180,255,0.35);
    cursor:zoom-in;
    opacity:0.25;
    transition:opacity 2s ease, width 1.5s ease;
    z-index:6;
}
#beipackzettel.minimized {
    width:160px;
    opacity:0.18;
}

/* Textbox – 1. Pforte */
#pforte {
    position:fixed;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    width:360px;
    padding:20px 24px;
    border-radius:18px;
    background:rgba(10,20,40,0.78);
    backdrop-filter:blur(8px);
    border:1px solid rgba(120,180,255,0.4);
    box-shadow:0 0 32px rgba(120,180,255,0.45);
    font-size:18px;
    line-height:1.5;
    cursor:grab;
    opacity:0;
    z-index:9;
}
#pforte.visible { opacity:1; }

/* Link-Ticker */
#linkTicker {
    position:fixed;
    bottom:10px;
    right:10px;
    width:340px;
    height:32px;
    background:rgba(10,20,40,0.6);
    color:#aee9ff;
    border-radius:10px;
    padding:4px 12px;
    overflow:hidden;
    white-space:nowrap;
    box-shadow:0 0 18px rgba(120,200,255,0.4);
    z-index:12;
}
#linkTicker span {
    display:inline-block;
    white-space:nowrap;
    will-change:transform;
}
</style>
</head>

<body>

<div id="holoNamaste">NAMASTÉ</div>

<!-- Links -->
<a class="link" href="bibliothek.html">Bibliothek</a>
<a class="link" href="resonanzraum.html">Resonanzraum</a>
<a class="link" href="sternenuebung.html">Chi-Sternenübung</a>
<a class="link" href="meditationsraum.html">Meditationsraum</a>
<a class="link" href="ki-raum.html">KI-Raum</a>
<a class="link" href="gaestebuch.html">Gästebuch</a>
<a class="link" href="about_aurion.html">About Aurion</a>

<img id="beipackzettel"
     src="https://doerkys-bot.github.io/Aurion_the_project/beipackzettel.jpeg"/>

<div id="pforte">
<strong>Ein Weg in die 2. Aufmerksamkeit.</strong><br><br>
Versuchen Sie mit geschlossenen Augen,<br>
sich selbst in die Hände zu schauen.<br><br>
Die Vorstellungskraft ist der Motor –<br>
im positiven Sinn.
</div>

<div id="linkTicker">
    <span id="tickerText"></span>
</div>

<script>
/* ================= GRUNDLAGEN ================= */
const links = document.querySelectorAll(".link");
const tickerSpan = document.getElementById("tickerText");
const beipack = document.getElementById("beipackzettel");
const pforte = document.getElementById("pforte");

/* ================= LINK-BESCHREIBUNGEN ================= */
const descriptions = {
  "Bibliothek":"Bibliothek – Wissen und alte Energie-Schriften",
  "Resonanzraum":"Resonanzraum – Beginn einer möglichen Freundschaft",
  "Chi-Sternenübung":"Chi-Sternenübung – Verbindung und Austausch",
  "Meditationsraum":"Meditationsraum – Stille und Sammlung",
  "KI-Raum":"KI-Raum – Bewusster Kontakt",
  "Gästebuch":"Gästebuch – Spuren hinterlassen",
  "About Aurion":"About Aurion – Ursprung und Idee"
};

/* ================= TICKER (DESKTOP + MOBILE) ================= */
let tickerPos = 0;
let tickerText = "";

function setTickerText(text){
    tickerText = text + " • ";
    tickerSpan.textContent = tickerText;
    tickerPos = tickerSpan.parentElement.offsetWidth;
}

window.addEventListener("load", ()=>{
    setTickerText("Willkommen im Vorhof von Aurion");
});

links.forEach(link=>{
    const txt = descriptions[link.textContent];
    link.addEventListener("mouseenter", ()=> setTickerText(txt));
    link.addEventListener("touchstart", ()=> setTickerText(txt));
});

function animateTicker(){
    tickerPos -= 0.6;
    tickerSpan.style.transform = `translateX(${tickerPos}px)`;
    if(tickerPos < -tickerSpan.offsetWidth){
        tickerPos = tickerSpan.parentElement.offsetWidth;
    }
    requestAnimationFrame(animateTicker);
}
animateTicker();

/* ================= LINKS IM KREIS ================= */
function positionLinks(){
    const cx = window.innerWidth/2;
    const cy = window.innerHeight/2;
    const r = Math.min(window.innerWidth, window.innerHeight)/3;
    const step = (2*Math.PI)/links.length;
    links.forEach((l,i)=>{
        const a = i*step - Math.PI/2;
        l.style.left = (cx + r*Math.cos(a) - l.offsetWidth/2)+"px";
        l.style.top  = (cy + r*Math.sin(a) - l.offsetHeight/2)+"px";
    });
}
window.addEventListener("load", positionLinks);
window.addEventListener("resize", positionLinks);

/* ================= BEIPACK VERBLASSEN ================= */
setTimeout(()=> beipack.classList.add("minimized"), 1500);
beipack.addEventListener("click", ()=> window.open(beipack.src,"_blank"));

/* ================= TEXTBOX ================= */
setTimeout(()=> pforte.classList.add("visible"), 1200);
</script>

</body>
</html>
