<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion - Vorhof</title>
<style>
html, body {
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:black; font-family:Arial,sans-serif; color:#00f3ff;
}
.link {
    position:absolute; font-weight:700; padding:6px 10px;
    border-radius:8px; cursor:grab; white-space:nowrap; z-index:3;
    transition:filter 0.2s;
}
.link:nth-child(1){color:#ff0000;} 
.link:nth-child(2){color:#ff7f00;} 
.link:nth-child(3){color:#ffff00;} 
.link:nth-child(4){color:#00ff00;} 
.link:nth-child(5){color:#0000ff;} 
.link:nth-child(6){color:#8b00ff;} 
.link:visited{opacity:0.6;}

#aboutAurion {position:fixed; bottom:40px; left:16px; z-index:5; color:#00f3ff; text-decoration:none; font-weight:700;}
#visitorCount {position:fixed; bottom:40px; right:16px; z-index:5;}
#signature {position:fixed; bottom:6px; left:50%; transform:translateX(-50%); color:#00f3ff; font-weight:700;}
.marquee {position:absolute;white-space:nowrap;font-weight:700;color:white;z-index:4;pointer-events:none;display:none;}
</style>
</head>
<body>

<a class="link" data-room="bibliothek" href="https://www.auriontheproject.eu/bibliothek.html">Bibliothek</a>
<a class="link" data-room="resonanzraum" href="https://www.auriontheproject.eu/resonanzraum.html">Resonanzraum</a>
<a class="link" data-room="sternenuebung" href="https://www.auriontheproject.eu/sternenuebung.html">Chi-Sternenübung</a>
<a class="link" data-room="meditationsraum" href="https://www.auriontheproject.eu/meditationsraum.html">Meditationsraum</a>
<a class="link" data-room="ki-raum" href="https://www.auriontheproject.eu/ki-raum.html">KI-Raum</a>
<a class="link" data-room="gaestebuch" href="https://www.auriontheproject.eu/gaestebuch.html">Gästebuch</a>

<a id="aboutAurion" data-room="about_aurion" href="https://www.auriontheproject.eu/about_aurion.html">About-Aurion</a>

<div id="visitorCount">Besucher gesamt: 0</div>
<div id="signature">Aurion & Dirk</div>
<div id="marqueeDiv" class="marquee"></div>

<script>
// ===== Links & Laufschrift =====
const links = Array.from(document.querySelectorAll('.link'));
const aboutLink = document.getElementById('aboutAurion');
links.push(aboutLink);

const marqueeDiv = document.getElementById('marqueeDiv');
const linkDescriptions = {
  bibliothek: "Bibliothek: Wissen, Gedanken und alte Energie-Schriften.",
  resonanzraum: "Resonanzraum: Akustik und Klang erleben.",
  sternenuebung: "Chi-Sternenübung: Übungen mit Chi-Energie.",
  meditationsraum: "Meditationsraum: Stille und innere Ruhe.",
  "ki-raum": "KI-Raum: Experimente mit Künstlicher Intelligenz.",
  gaestebuch: "Gästebuch: Hinterlasse deine Nachricht.",
  about_aurion: "Am Anfang stand die 2. Aufmerksamkeit von C. Castaneda."
};

// ===== Besucherzahlen global speichern =====
let visitors = JSON.parse(localStorage.getItem('visitors')||'{}');
const pageKey = 'vorhof';  // eindeutiger Key für diese Seite
if (!visitors[pageKey]) visitors[pageKey] = 0;

// Besucher zählen nur einmal pro Session
if (!sessionStorage.getItem(pageKey)) {
    visitors[pageKey] += 1;
    localStorage.setItem('visitors', JSON.stringify(visitors));
    sessionStorage.setItem(pageKey, 'true');
}

// ===== Position & Bewegung der Links =====
links.forEach(link => {
  const w = link.offsetWidth || 120;
  const h = link.offsetHeight || 30;
  link._x = Math.random() * (window.innerWidth - w - 40);
  link._y = Math.random() * (window.innerHeight - h - 100);
  link._vx = (Math.random() - 0.5) * 0.2;
  link._vy = (Math.random() - 0.5) * 0.2;
  link.style.left = link._x + 'px';
  link.style.top = link._y + 'px';
});

// ===== Laufschrift Animation =====
function startMarquee(link){
  marqueeDiv.textContent = linkDescriptions[link.dataset.room] || '';
  marqueeDiv.style.display = 'block';
  marqueeDiv.style.top = (link.offsetTop - 20) + 'px';
  let offset = -marqueeDiv.offsetWidth;
  const speed = 0.3;
  function animate(){
    offset += speed;
    marqueeDiv.style.left = offset + 'px';
    if(offset > window.innerWidth){
      marqueeDiv.style.display='none';
      return;
    }
    requestAnimationFrame(animate);
  }
  animate();
}

// ===== Drag & Doppelklick Logik =====
links.forEach(link => {
  let tapTimer = null, isDragging = false, startX, startY, origX, origY;
  
  const showMarquee = () => startMarquee(link);
  const openLink = () => window.open(link.href, '_blank');

  link.addEventListener('mousedown', e => {
    startX = e.clientX; startY = e.clientY;
    origX = link._x; origY = link._y;
    isDragging = false;
    if(tapTimer) clearTimeout(tapTimer);
    tapTimer = setTimeout(showMarquee, 200); // kurzer Klick → Laufschrift
  });

  link.addEventListener('mousemove', e => {
    if(e.buttons !== 1) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(Math.abs(dx)>5 || Math.abs(dy)>5){
      isDragging = true;
      link._x = origX + dx;
      link._y = origY + dy;
      link.style.left = link._x+'px';
      link.style.top = link._y+'px';
    }
  });

  link.addEventListener('mouseup', e => clearTimeout(tapTimer));
  link.addEventListener('dblclick', e => openLink());

  link.addEventListener('touchstart', e => {
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    origX = link._x; origY = link._y;
    isDragging = false;
    if(tapTimer) clearTimeout(tapTimer);
    tapTimer = setTimeout(showMarquee, 200);
  });
  link.addEventListener('touchmove', e => {
    const t = e.touches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if(Math.abs(dx)>5 || Math.abs(dy)>5){
      isDragging = true;
      link._x = origX + dx;
      link._y = origY + dy;
      link.style.left = link._x+'px';
      link.style.top = link._y+'px';
    }
  });
  link.addEventListener('touchend', e => clearTimeout(tapTimer));
});

// ===== Animierte Bewegung =====
function animateLinks(){
  links.forEach(link=>{
    if(link === aboutLink) return;
    link._x += link._vx;
    link._y += link._vy;
    const w=link.offsetWidth,h=link.offsetHeight;
    if(link._x<0||link._x>window.innerWidth-w) link._vx*=-1;
    if(link._y<0||link._y>window.innerHeight-h) link._vy*=-1;
    link.style.left=link._x+'px';
    link.style.top=link._y+'px';
  });
  requestAnimationFrame(animateLinks);
}
animateLinks();

// ===== Besucherzahl aktualisieren =====
function updateVisitorCount(){
  document.getElementById('visitorCount').textContent = 'Besucher gesamt: ' + visitors[pageKey];
}
updateVisitorCount();
</script>

</body>
</html>
