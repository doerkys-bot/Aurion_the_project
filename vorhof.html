html,body{

}

/* Raum-Atmung */
body::before{
    content:"";
    position:fixed; inset:0;
    background:rgba(120,180,255,0.08);
    z-index:0;
    animation:spaceBreath 14s ease-in-out infinite;
    pointer-events:none;
}
@keyframes spaceBreath{0%{opacity:0.05;}30%{opacity:0.14;}60%{opacity:0.14;}100%{opacity:0.05;}}

/* NAMASTÉ */
#holoNamaste{
    position:fixed;
    left:50%;
    top:0;
    transform:translateX(-50%);
    z-index:4;
    font-size:42px;
    font-weight:800;
    letter-spacing:4px;
    color:rgba(180,220,255,0.9);
    text-shadow:0 0 14px rgba(120,180,255,0.7),0 0 28px rgba(120,180,255,0.45),0 0 48px rgba(120,180,255,0.25);
    pointer-events:none;
}

/* LINKS */
.link{
    position:absolute; z-index:3;
    padding:12px 18px; border-radius:16px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(6px);
    font-weight:700;
    cursor:grab;
    box-shadow:0 0 22px rgba(80,160,255,0.18);
    transition:transform 0.3s ease, box-shadow 0.4s ease, background 0.4s ease;
    color:#fff; /* unbesucht */
}
.link.visited{ color: grey; }

/* Drift Animation */
@keyframes driftX{0%{transform:translate(0,0);}25%{transform:translate(20px,-15px);}50%{transform:translate(-25px,20px);}75%{transform:translate(15px,25px);}100%{transform:translate(0,0);}}

.link:nth-of-type(2){top:35%; left:55%; animation:driftX 50s ease-in-out infinite;}
.link:nth-of-type(3){top:50%; left:30%; animation:driftX 45s ease-in-out infinite;}
.link:nth-of-type(4){top:65%; left:60%; animation:driftX 60s ease-in-out infinite;}
.link:nth-of-type(5){top:75%; left:25%; animation:driftX 55s ease-in-out infinite;}
.link:nth-of-type(6){top:80%; left:55%; animation:driftX 50s ease-in-out infinite;}
.link:nth-of-type(7){top:90%; left:40%; animation:driftX 58s ease-in-out infinite;}

/* BEIPACKZETTEL */
#beipackzettel{
    position:fixed; top:8%; right:6%;
    width:320px; z-index:6;
    border-radius:14px;
    box-shadow:0 0 30px rgba(120,180,255,0.35);
    transition:all 0.6s ease;
    cursor:zoom-in;
}
#beipackzettel.minimized{ width:160px; opacity:0.6; }
#beipackzettel:hover{ transform:scale(2); z-index:10; cursor:zoom-in; }

/* TEXTBOX */
#pforte{
    position:fixed; left:50%; top:55%;
    transform:translate(-50%,-50%);
    width:360px; padding:20px 24px;
    border-radius:18px; background:rgba(10,20,40,0.78);
    backdrop-filter:blur(8px); border:1px solid rgba(120,180,255,0.4);
    box-shadow:0 0 32px rgba(120,180,255,0.45);
    z-index:7; font-size:17px; line-height:1.5;
    opacity:0; pointer-events:auto;
    text-align:center;
}
#pforte.visible{opacity:1;}
</style>
</head>

<script>
const beipack = document.getElementById("beipackzettel");
const pforte = document.getElementById("pforte");

// Beipackzettel minimieren nach 10s, Textbox 1s danach
setTimeout(()=>{
    beipack.classList.add("minimized");
    setTimeout(()=>{pforte.style.opacity = 1;},1000);
},10000);

// Klick auf Beipackzettel, toggle Größe
beipack.addEventListener("click", ()=>{
    if(beipack.classList.contains("minimized")){
        beipack.classList.remove("minimized");
    } else{
        beipack.classList.add("minimized");
    }
});

// ===== Links verschiebbar =====
let draggingLink = null, offsetX=0, offsetY=0;
document.querySelectorAll(".link").forEach(link=>{
    // Zufällige Startposition
    link.style.top = (Math.random()*70+10)+"%";
    link.style.left = (Math.random()*70+10)+"%";

    link.addEventListener("pointerdown", e=>{
        draggingLink = link;
        offsetX = e.clientX - link.getBoundingClientRect().left;
        offsetY = e.clientY - link.getBoundingClientRect().top;
        link.style.cursor = "grabbing";
        link.setPointerCapture(e.pointerId);
    });
});

document.addEventListener("pointermove", e=>{
    if(!draggingLink) return;
    draggingLink.style.left = (e.clientX - offsetX)+"px";
    draggingLink.style.top = (e.clientY - offsetY)+"px";
});

document.addEventListener("pointerup", e=>{
    if(draggingLink){
        draggingLink.style.cursor = "grab";
        draggingLink = null;
    }
});

// ===== Textbox verschiebbar =====
let dragText = false, txtOffsetX=0, txtOffsetY=0;
pforte.addEventListener("pointerdown", e=>{
    dragText = true;
    txtOffsetX = e.clientX - pforte.getBoundingClientRect().left;
    txtOffsetY = e.clientY - pforte.getBoundingClientRect().top;
    pforte.setPointerCapture(e.pointerId);
    pforte.style.cursor="grabbing";
});
document.addEventListener("pointermove", e=>{
    if(!dragText) return;
    pforte.style.left = (e.clientX - txtOffsetX)+"px";
    pforte.style.top  = (e.clientY - txtOffsetY)+"px";
});
document.addEventListener("pointerup", ()=>{
    dragText=false;
    pforte.style.cursor="grab";
});
</script>
