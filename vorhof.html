<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
html, body {
    margin:0; padding:0; height:100%; width:100%;
    overflow:hidden;
    background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpeg")
               center/cover no-repeat fixed;
    color:white;
    font-family:system-ui, Segoe UI, Roboto, sans-serif;
}

body::before{
    content:"";
    position:fixed; inset:0;
    background:rgba(120,180,255,0.08);
    animation:spaceBreath 18s ease-in-out infinite;
    pointer-events:none;
}
@keyframes spaceBreath{
    0%{opacity:0.05;}
    50%{opacity:0.14;}
    100%{opacity:0.05;}
}

#holoNamaste{
    position:fixed;
    top:0;
    left:50%;
    transform:translateX(-50%);
    font-size:42px;
    font-weight:800;
    letter-spacing:4px;
    color:rgba(180,220,255,0.9);
    text-shadow:0 0 14px rgba(120,180,255,0.7);
    z-index:4;
    pointer-events:none;
}

.link{
    position:absolute;
    padding:12px 18px;
    border-radius:16px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(6px);
    color:white;
    font-weight:700;
    text-decoration:none;
    cursor:grab;
    box-shadow:0 0 18px rgba(80,160,255,0.18);
    user-select:none;
}
.link.visited{ color:gray; }

#beipackzettel{
    position:fixed;
    top:53px;
    left:38px;
    width:320px;
    border-radius:14px;
    box-shadow:0 0 30px rgba(120,180,255,0.35);
    cursor:zoom-in;
    z-index:7;
    transition:opacity 2s ease, width .4s ease;
}
#beipackzettel.minimized{
    width:160px;
    opacity:0.15;
}

#pforte{
    position:fixed;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    width:380px;
    padding:22px 26px;
    border-radius:18px;
    background:rgba(10,20,40,0.78);
    border:1px solid rgba(120,180,255,0.4);
    box-shadow:0 0 32px rgba(120,180,255,0.45);
    font-size:18px;
    line-height:1.5;
    cursor:grab;
    opacity:0;
    z-index:6;
}
#pforte.visible{ opacity:1; }
</style>
</head>

<body>

<div id="holoNamaste">NAMASTÉ</div>

<a class="link" href="bibliothek.html">Bibliothek</a>
<a class="link" href="resonanzraum.html">Resonanzraum</a>
<a class="link" href="sternenuebung.html">Chi-Sternenübung</a>
<a class="link" href="meditationsraum.html">Meditationsraum</a>
<a class="link" href="ki-raum.html">KI-Raum</a>
<a class="link" href="gaestebuch.html">Gästebuch</a>
<a class="link" href="about_aurion.html">About Aurion</a>

<img id="beipackzettel"
     src="https://doerkys-bot.github.io/Aurion_the_project/b_1_p.jpeg">

<div id="pforte">
<strong>Ein Weg in die 2. Aufmerksamkeit.<br>
Beschreiten Sie die erste Pforte der Zauberer.</strong><br><br>
Versuchen Sie mit geschlossenen Augen<br>
sich selber in die Hände zu schauen.<br>
Finden Sie im Geist Ihre Hände.
</div>

<script>
/* Beipackzettel */
const beipack=document.getElementById("beipackzettel");
setTimeout(()=>{
    beipack.classList.add("minimized");
    setTimeout(()=>document.getElementById("pforte").classList.add("visible"),1000);
},10000);
beipack.onclick=()=>window.open(beipack.src,'_blank');

/* Textbox Drag */
let tDrag=false, tx=0, ty=0;
const p=document.getElementById("pforte");
p.onpointerdown=e=>{
    tDrag=true;
    tx=e.clientX-p.offsetLeft;
    ty=e.clientY-p.offsetTop;
};
document.onpointermove=e=>{
    if(tDrag){
        p.style.left=(e.clientX-tx)+'px';
        p.style.top =(e.clientY-ty)+'px';
    }
};
document.onpointerup=()=>tDrag=false;

/* ---------- Sternentor-Physik ---------- */
const center=()=>({x:innerWidth/2,y:innerHeight/2});
const innerR=180;
const outerR=Math.min(innerWidth,innerHeight)/2-60;

const links=[...document.querySelectorAll('.link')].map(el=>{
    const a=Math.random()*Math.PI*2;
    const r=innerR+Math.random()*(outerR-innerR);
    const c=center();
    return{
        el,
        x:c.x+Math.cos(a)*r,
        y:c.y+Math.sin(a)*r,
        vx:(Math.random()-.5)*0.6,
        vy:(Math.random()-.5)*0.6,
        drag:false
    };
});

/* Drag Links */
links.forEach(l=>{
    l.el.onpointerdown=e=>{
        l.drag=true;
        l.ox=e.clientX-l.x;
        l.oy=e.clientY-l.y;
    };
    l.el.onpointermove=e=>{
        if(l.drag){
            l.x=e.clientX-l.ox;
            l.y=e.clientY-l.oy;
        }
    };
    l.el.onpointerup=()=>{
        l.drag=false;
        l.el.classList.add("visited");
    };
});

/* Bewegung */
function animate(){
    const c=center();
    links.forEach(l=>{
        if(!l.drag){
            l.x+=l.vx;
            l.y+=l.vy;

            const dx=l.x-c.x;
            const dy=l.y-c.y;
            const d=Math.hypot(dx,dy);

            if(d<innerR || d>outerR){
                l.vx*=-1;
                l.vy*=-1;
            }
        }
        l.el.style.left=l.x+"px";
        l.el.style.top =l.y+"px";
    });
    requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
