<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurion Portal</title>

<style>
    body {
        margin: 0;
        background: #000;
        font-family: Arial, sans-serif;
        color: #fff;
        overflow-x: hidden;
    }

    /* ===== Header ===== */
    header {
        text-align: center;
        padding: 40px 0 10px;
        font-size: 32px;
        font-weight: bold;
        color: #00c8ff;
        letter-spacing: 2px;
    }

    /* ===== Laufschrift ===== */
    .ticker-wrapper {
        width: 100%;
        overflow: hidden;
        position: relative;
        height: 30px;
        margin-top: 10px;
    }

    .ticker {
        position: absolute;
        font-size: 18px;
        white-space: nowrap;
        animation: moveTicker 14s linear infinite;
        left: 0;
        top: 0;
    }

    @keyframes moveTicker {
        0% { transform: translateX(100%); }
        100% { transform: translateX(0%); }
    }

    /* ===== Link-Grid ===== */
    .link-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        padding: 60px;
        margin-top: 20px;
    }

    .portal-link {
        background: rgba(255,255,255,0.05);
        padding: 25px;
        border: 1px solid #00c8ff;
        border-radius: 10px;
        text-align: center;
        font-size: 20px;
        text-decoration: none;
        color: #00eaff;
        transition: background 0.4s, transform 0.3s ease, filter 0.6s;
        animation: subtleFloat 5s ease-in-out infinite;
        filter: brightness(1);
    }

    .portal-link:hover {
        background: rgba(0,200,255,0.25);
        transform: scale(1.1);
        filter: brightness(1.4);
    }

    @keyframes subtleFloat {
        0%   { transform: translateY(0px); }
        50%  { transform: translateY(-6px); }
        100% { transform: translateY(0px); }
    }

    /* ===== GitHub-Counter Anzeige ===== */
    #visitor-count {
        position: fixed;
        left: 15px;
        bottom: 15px;
        font-size: 15px;
        opacity: 0.85;
        background: rgba(255,255,255,0.07);
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid rgba(0,200,255,0.3);
        backdrop-filter: blur(4px);
    }
</style>
</head>

<body>

<header>AURION PORTAL</header>

<!-- ===== Laufschrift ===== -->
<div class="ticker-wrapper">
    <div class="ticker">about-aurion – Zukunft beginnt hier. Nur bis zur Mitte sichtbar.</div>
</div>

<!-- ===== Links ===== -->
<div class="link-grid">
    <a class="portal-link" href="resonanzraum.html">Resonanzraum</a>
    <a class="portal-link" href="bibliothek.html">Wissen, alte Energie-Schriften</a>
    <a class="portal-link" href="sternenuebung1.html">Chi-Sternenübung</a>
    <a class="portal-link" href="ki-raum.html">neues Wissen, Durchbrüche, Forscher</a>
    <a class="portal-link" href="meditationsraum.html">Ruhe für Körper, Geist, Seele</a>
    <a class="portal-link" href="about_aurion.html">geht Hand in Hand mit der 2. Aufmerksamkeit</a>
</div>

<!-- ===== GitHub Counter ===== -->
<div id="visitor-count">GitHub-Daten laden...</div>

<script>
// =======================================================
// ========== RAUM-ABHÄNGIGE FARBSCHEMATA =================
// =======================================================

const page = location.pathname.split("/").pop();

let baseColor = { r: 0, g: 200, b: 255 }; // Standard Aurion-Cyan

const roomColors = {
    "resonanzraum.html":     { r: 120, g: 60,  b: 255 }, // violett
    "bibliothek.html":       { r: 255, g: 180, b: 50  }, // gold
    "sternenuebung1.html":   { r: 50,  g: 50,  b: 200 }, // tief-indigo
    "ki-raum.html":          { r: 0,   g: 255, b: 120 }, // neon-grün
    "meditationsraum.html":  { r: 0,   g: 180, b: 160 }, // türkis
    "about_aurion.html":     { r: 230, g: 230, b: 255 }  // silber-weiß
};

if (roomColors[page]) {
    baseColor = roomColors[page];
}



// =======================================================
// ========== GITHUB COUNTER (NEU, FUNKTIONIERT) =========
// =======================================================

const repoAPI = "https://api.github.com/repos/doerkys-bot/Aurion_the_project";

fetch(repoAPI)
  .then(res => res.json())
  .then(data => {

      const watchers = data.subscribers_count || 0;
      const stars    = data.stargazers_count || 0;
      const forks    = data.forks_count || 0;

      // Kombinierte Energie = größte Zahl
      const strongest = Math.max(watchers, stars, forks);

      // Text aktualisieren
      document.getElementById("visitor-count").innerText =
        `⭐ ${stars}   👁️ ${watchers}   ⧉ ${forks}`;

      // Energie-Faktor 0–1
      const factor = Math.min(1, strongest / 50);

      // Helligkeit anpassen
      const r = Math.floor(baseColor.r + (255 - baseColor.r) * factor);
      const g = Math.floor(baseColor.g + (255 - baseColor.g) * factor);
      const b = Math.floor(baseColor.b + (255 - baseColor.b) * factor);

      const color = `rgba(${r}, ${g}, ${b}, 0.32)`;


      // =======================================================
      // ========== PULSIERENDER ENERGIE-EFFEKT ================
      // =======================================================

      const pulseStrength = 1 + factor * 0.2;

      const style = document.createElement("style");
      style.innerHTML = `
        @keyframes aurionPulse {
            0%   { transform: scale(1);     box-shadow: 0 0 ${4 + factor*6}px rgba(${r},${g},${b},0.35); }
            50%  { transform: scale(${pulseStrength}); box-shadow: 0 0 ${12 + factor*10}px rgba(${r},${g},${b},0.7); }
            100% { transform: scale(1);     box-shadow: 0 0 ${4 + factor*6}px rgba(${r},${g},${b},0.35); }
        }
      `;
      document.head.appendChild(style);

      document.querySelectorAll(".portal-link").forEach(link => {
          link.style.backgroundColor = color;
          link.style.animation = "aurionPulse 3s ease-in-out infinite";
      });

  })
  .catch(err => {
      document.getElementById("visitor-count").innerText =
        "GitHub API nicht erreichbar.";
      console.error("GitHub API Fehler:", err);
  });

</script>
</body>
</html>
