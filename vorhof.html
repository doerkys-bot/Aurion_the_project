<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>Aurion – Vorhof</title><style>html, body {    margin:0; padding:0; height:100%; width:100%;    overflow:hidden;    background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpeg") center/cover no-repeat fixed;    color:white;    font-family:system-ui,Segoe UI,Roboto,sans-serif;}body::before {    content:"";    position:fixed; inset:0;    background:rgba(120,180,255,0.08);    z-index:0;    animation:spaceBreath 14s ease-in-out infinite;    pointer-events:none;}@keyframes spaceBreath {    0%{opacity:0.05;}    30%{opacity:0.14;}    60%{opacity:0.14;}    100%{opacity:0.05;}}#holoNamaste {    position:fixed; top:0; left:50%;    transform:translateX(-50%);    z-index:4;    font-size:42px;    font-weight:800;    letter-spacing:4px;    color:rgba(180,220,255,0.9);    text-shadow:0 0 14px rgba(120,180,255,0.7),                0 0 28px rgba(120,180,255,0.45),                0 0 48px rgba(120,180,255,0.25);    animation:holoPulse 5s ease-in-out infinite;    pointer-events:none;}@keyframes holoPulse{0%,100%{opacity:.75}50%{opacity:1}}.link {    position:absolute; z-index:5;    padding:12px 18px; border-radius:16px;    background:rgba(255,255,255,0.06);    backdrop-filter:blur(6px);    color:gray; font-weight:700; text-decoration:none;    cursor:grab;    box-shadow:0 0 22px rgba(80,160,255,0.18);}.link.visited { color:white; }#beipackzettel {    position:fixed;    top:53px; left:38px;    width:320px; z-index:7;    border-radius:14px;    box-shadow:0 0 30px rgba(120,180,255,0.35);    transition: opacity 2s ease, width .4s ease;    cursor:zoom-in;}#beipackzettel.minimized {    opacity:0.15;    width:160px;}#pforte {    position:fixed;    left:50%; top:55%;    transform:translate(-50%,-50%);    width:360px;    padding:20px 24px;    border-radius:18px;    background:rgba(10,20,40,0.78);    backdrop-filter:blur(8px);    border:1px solid rgba(120,180,255,0.4);    box-shadow:0 0 32px rgba(120,180,255,0.45);    z-index:6;    font-size:18px;    line-height:1.5;    cursor:grab;    opacity:0;}#pforte.visible { opacity:1; }</style></head><body><div id="holoNamaste">NAMASTÉ</div><a class="link" href="bibliothek.html">Bibliothek</a><a class="link" href="resonanzraum.html">Resonanzraum</a><a class="link" href="sternenuebung.html">Chi-Sternenübung</a><a class="link" href="meditationsraum.html">Meditationsraum</a><a class="link" href="ki-raum.html">KI-Raum</a><a class="link" href="gaestebuch.html">Gästebuch</a><a class="link" href="about_aurion.html">About Aurion</a><img id="beipackzettel"     src="https://doerkys-bot.github.io/Aurion_the_project/beipackzettel.jpeg"><div id="pforte"><strong>Ein Weg in die 2. Aufmerksamkeit.<br>Beschreiten Sie die erste Pforte der Zauberer.</strong><br><br>Versuchen Sie mit geschlossenen Augen sich selber in die Hände zu schauen.<br>Finden Sie im Geist ihre Hände.</div><script>/* ================= BEIPACK ================= */const beipack = document.getElementById("beipackzettel");const pforte = document.getElementById("pforte");setTimeout(()=>{    beipack.classList.add("minimized");    setTimeout(()=>pforte.classList.add("visible"),1000);},10000);beipack.addEventListener("click",()=>{    window.open(beipack.src,"_blank");});/* ================= DRIFTENDE LINKS ================= */const links = document.querySelectorAll('.link');const centerX = window.innerWidth / 2;const centerY = window.innerHeight / 2;const radius = Math.min(window.innerWidth, window.innerHeight) / 2 - 100;const linkData = [];links.forEach((link, i) => {    const r = Math.random() * radius;    const angle = Math.random() * 2 * Math.PI;    const direction = Math.random() < 0.5 ? 1 : -1;    const x = centerX + r * Math.cos(angle) - link.offsetWidth / 2;    const y = centerY + r * Math.sin(angle) - link.offsetHeight / 2;    link.style.left = x + "px";    link.style.top = y + "px";    linkData.push({ link, angle, distance: r, speed: 0.1 + Math.random() * 0.1, direction, dragging: false });    // Drag-Logik    let offsetX = 0, offsetY = 0;    link.addEventListener('pointerdown', e => {        linkData[i].dragging = true;        offsetX = e.clientX - link.offsetLeft;        offsetY = e.clientY - link.offsetTop;        link.setPointerCapture(e.pointerId);    });    link.addEventListener('pointermove', e => {        if (linkData[i].dragging) {            let nx = e.clientX - offsetX;            let ny = e.clientY - offsetY;            const dx = nx - centerX, dy = ny - centerY;            if (Math.sqrt(dx*dx+dy*dy) < radius) {                link.style.left = nx+'px';                link.style.top = ny+'px';            }        }    });    link.addEventListener('pointerup', () => linkData[i].dragging=false);});function driftLinks() {    linkData.forEach(data => {        if(!data.dragging){            data.angle += data.direction * data.speed * 0.01;            const x = centerX + data.distance * Math.cos(data.angle) - data.link.offsetWidth/2;            const y = centerY + data.distance * Math.sin(data.angle) - data.link.offsetHeight/2;            data.link.style.left = x + "px";            data.link.style.top = y + "px";        }    });    requestAnimationFrame(driftLinks);}driftLinks();/* ================= ERSTE PFORTE ================= */let attentionStart = null;let lastMove = Date.now();let clickTimes = [];let passed = false;function passGate(){    if(passed) return;    passed = true;    localStorage.setItem("pforte1","true");    pforte.style.boxShadow="0 0 60px rgba(180,240,255,0.9)";    setTimeout(()=>{        window.location.href="resonanzraum.html";    },1200);}/* Aufmerksamkeit (6s Ruhe) */pforte.addEventListener("mouseenter",()=>{    attentionStart = Date.now();    lastMove = Date.now();});pforte.addEventListener("mousemove",()=> lastMove = Date.now());pforte.addEventListener("mouseleave",()=> attentionStart = null);setInterval(()=>{    if(attentionStart){        const now = Date.now();        if(now - lastMove > 6000){            passGate();        }    }},300);/* Fallback: 7 Klicks / 10s */pforte.addEventListener("click",()=>{    const now = Date.now();    clickTimes.push(now);    clickTimes = clickTimes.filter(t => now - t < 10000);    if(clickTimes.length >= 7){        passGate();    }});</script></body></html>
