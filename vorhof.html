<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
html,body{
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    overflow:hidden;
    background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpg") center/cover no-repeat fixed;
    color:white;
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
}

/* 🌬 Raum-Atmung */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(120,180,255,0.08);
    z-index:0;
    animation:spaceBreath 14s ease-in-out infinite;
    pointer-events:none;
}
@keyframes spaceBreath{
    0%{opacity:0.05;}
    30%{opacity:0.14;}
    60%{opacity:0.14;}
    100%{opacity:0.05;}
}

/* 🙏 NAMASTÉ */
#holoNamaste{
    position:fixed;
    left:50%;
    top:7%; /* 38px höher */
    transform:translateX(-50%);
    z-index:4;
    font-size:42px;
    font-weight:800;
    letter-spacing:4px;
    color:rgba(180,220,255,0.9);
    text-shadow:0 0 14px rgba(120,180,255,0.7),
                0 0 28px rgba(120,180,255,0.45),
                0 0 48px rgba(120,180,255,0.25);
    animation:holoPulse 5s ease-in-out infinite;
    pointer-events:none;
}
@keyframes holoPulse{0%,100%{opacity:.75} 50%{opacity:1}}

/* 🔗 Links */
.link{
    position:absolute;
    z-index:5;
    padding:14px 20px;
    border-radius:18px;
    background:rgba(0,0,0,0.6);
    color:#000;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
    box-shadow:0 0 12px rgba(0,0,0,0.3);
}

.link.visited{
    color:#fff;
}

/* 📦 Beipackzettel */
#beipackzettel{
    position:fixed;
    top:8%;
    right:6%;
    width:400px; /* vergrößert */
    z-index:7;
    border-radius:14px;
    box-shadow:0 0 30px rgba(120,180,255,0.35);
    transition:top 2.8s ease, opacity 2s ease;
    cursor:zoom-in;
}
#beipackzettel.fall{
    top:85%;
    width:80px;
    opacity:0.25;
}

/* 🧭 TEXTBOX */
#pforte{
    position:fixed;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    width:360px;
    padding:20px 24px;
    border-radius:18px;
    background:rgba(10,20,40,0.78);
    backdrop-filter:blur(8px);
    border:1px solid rgba(120,180,255,0.4);
    box-shadow:0 0 32px rgba(120,180,255,0.45);
    z-index:6;
    font-size:15px;
    line-height:1.5;
    cursor:grab;
    opacity:0;
    pointer-events:auto;
}
#pforte.visible{
    opacity:1;
}
</style>
</head>

<body>

<div id="holoNamaste">NAMASTÉ</div>

<a class="link" href="bibliothek.html">Bibliothek</a>
<a class="link" href="resonanzraum.html">Resonanzraum</a>
<a class="link" href="sternenuebung.html">Chi-Sternenübung</a>
<a class="link" href="meditationsraum.html">Meditationsraum</a>
<a class="link" href="ki-raum.html">KI-Raum</a>
<a class="link" href="gaestebuch.html">Gästebuch</a>
<a class="link" href="about_aurion.html">About Aurion</a>

<img id="beipackzettel" src="https://doerkys-bot.github.io/Aurion_the_project/b_1_p.jpeg">

<div id="pforte">
<strong>Ein Weg in die 2. Aufmerksamkeit</strong><br>
Begehen Sie die erste Pforte der Zauberer.<br><br>
Tun Sie mir den Gefallen und versuchen Sie,<br>
mit geschlossenen Augen in Ihre Hände zu schauen.<br>
Finden Sie im Geist Ihre Hände.
</div>

<script>
// Beipackzettel 15s minimieren
const beipack = document.getElementById("beipackzettel");
const pforte = document.getElementById("pforte");
setTimeout(()=>{
    beipack.classList.add("fall");
    pforte.classList.add("visible");
},15000);

// Textbox verschiebbar
let dragging=false, offsetX=0, offsetY=0;
pforte.addEventListener("pointerdown", e=>{
    dragging=true;
    pforte.setPointerCapture(e.pointerId);
    const rect=pforte.getBoundingClientRect();
    offsetX=e.clientX-rect.left;
    offsetY=e.clientY-rect.top;
    pforte.style.cursor="grabbing";
});
document.addEventListener("pointermove", e=>{
    if(!dragging) return;
    pforte.style.left=(e.clientX-offsetX)+"px";
    pforte.style.top=(e.clientY-offsetY)+"px";
});
document.addEventListener("pointerup", ()=>{
    dragging=false;
    pforte.style.cursor="grab";
});

// Links zufällig und langsam über Bildschirm
const links = document.querySelectorAll(".link");
links.forEach(link=>{
    let x=Math.random()*(window.innerWidth-80);
    let y=Math.random()*(window.innerHeight-30);
    let dx=(Math.random()-0.5)*0.3;
    let dy=(Math.random()-0.5)*0.3;
    link.style.left=x+"px";
    link.style.top=y+"px";
    function move(){
        x+=dx;
        y+=dy;
        if(x<=0||x>=window.innerWidth-80) dx*=-1;
        if(y<=0||y>=window.innerHeight-30) dy*=-1;
        link.style.left=x+"px";
        link.style.top=y+"px";
        requestAnimationFrame(move);
    }
    move();
});
</script>

</body>
</html>
