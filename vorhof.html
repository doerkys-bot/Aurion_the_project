<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
html,body{
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    overflow:hidden;
    background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpg")
               center/cover no-repeat fixed;
    color:white;
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
}

/* 🌬 Raum-Atmung */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(120,180,255,0.08);
    z-index:0;
    animation:spaceBreath 14s ease-in-out infinite;
    pointer-events:none;
}

body.attuned::before{
    background:rgba(120,180,255,0.04);
    animation-duration:20s;
}

@keyframes spaceBreath{
    0%{opacity:0.05;}
    30%{opacity:0.14;}
    60%{opacity:0.14;}
    100%{opacity:0.05;}
}

/* 🙏 NAMASTÉ */
#holoNamaste{
    position:fixed;
    left:50%;
    top:10%;
    transform:translateX(-50%);
    z-index:4;
    font-size:42px;
    font-weight:800;
    letter-spacing:4px;
    color:rgba(180,220,255,0.9);
    text-shadow:
        0 0 14px rgba(120,180,255,0.7),
        0 0 28px rgba(120,180,255,0.45),
        0 0 48px rgba(120,180,255,0.25);
    animation:holoPulse 5s ease-in-out infinite;
    pointer-events:none;
}

@keyframes holoPulse{
    0%,100%{opacity:.75}
    50%{opacity:1}
}

/* 🔗 Links */
.link{
    position:absolute;
    z-index:5;
    padding:14px 20px;
    border-radius:18px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(6px);
    box-shadow:0 0 22px rgba(80,160,255,0.18);
}

.link span{
    display:inline-block;
    color:#7ecbff;
    font-weight:700;
}

/* Drifting Links – individuelle Geschwindigkeiten & Richtungen */
@keyframes drift1{0%{transform:translate(0,0)}50%{transform:translate(30px,-18px)}100%{transform:translate(0,0)}}
@keyframes drift2{0%{transform:translate(0,0)}50%{transform:translate(-25px,22px)}100%{transform:translate(0,0)}}
@keyframes drift3{0%{transform:translate(0,0)}50%{transform:translate(28px,26px)}100%{transform:translate(0,0)}}
@keyframes drift4{0%{transform:translate(0,0)}50%{transform:translate(-20px,-28px)}100%{transform:translate(0,0)}}
@keyframes drift5{0%{transform:translate(0,0)}50%{transform:translate(22px,-26px)}100%{transform:translate(0,0)}}
@keyframes drift6{0%{transform:translate(0,0)}50%{transform:translate(-18px,30px)}100%{transform:translate(0,0)}}
@keyframes drift7{0%{transform:translate(0,0)}50%{transform:translate(26px,20px)}100%{transform:translate(0,0)}}

/* 🌊 Links Positionen & individuelle Animationen */
.link:nth-of-type(1){top:32%; left:20%; animation:drift1 26s ease-in-out infinite;}
.link:nth-of-type(2){top:40%; left:55%; animation:drift2 30s ease-in-out infinite;}
.link:nth-of-type(3){top:50%; left:28%; animation:drift3 28s ease-in-out infinite;}
.link:nth-of-type(4){top:58%; left:60%; animation:drift4 32s ease-in-out infinite;}
.link:nth-of-type(5){top:68%; left:22%; animation:drift5 27s ease-in-out infinite;}
.link:nth-of-type(6){top:72%; left:55%; animation:drift6 31s ease-in-out infinite;}
.link:nth-of-type(7){top:84%; left:40%; animation:drift7 29s ease-in-out infinite;}

/* 📦 Beipackzettel – minimierbar */
#beipackzettel{
    position:fixed;
    top:8%;
    right:6%;
    width:320px;
    z-index:7;
    border-radius:14px;
    box-shadow:0 0 30px rgba(120,180,255,0.35);
    transition: all 0.8s ease;
    cursor:pointer;
}
#beipackzettel.minimized{
    width:80px;
    top:auto;
    bottom:6%;
    right:6%;
    opacity:0.6;
}

/* 🧭 TEXTBOX der 1. Pforte */
#pforte{
    position:fixed;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    width:360px;
    padding:20px 24px;
    border-radius:18px;
    background:rgba(10,20,40,0.78);
    backdrop-filter:blur(8px);
    border:1px solid rgba(120,180,255,0.4);
    box-shadow:0 0 32px rgba(120,180,255,0.45);
    z-index:6;
    font-size:15px;
    line-height:1.5;
    cursor:grab;
    opacity:0;
    pointer-events:auto;
    transition:opacity 1s ease;
}
#pforte.visible{
    opacity:1;
}
</style>
</head>

<body>

<div id="holoNamaste">NAMASTÉ</div>

<a class="link" href="bibliothek.html"><span>Bibliothek</span></a>
<a class="link" href="resonanzraum.html"><span>Resonanzraum</span></a>

<a class="link" href="gaestebuch.html"><span>Gästebuch</span></a>
<a class="link" href="about_aurion.html"><span>About Aurion</span></a>

<img id="beipackzettel"
     src="https://doerkys-bot.github.io/Aurion_the_project/b_1_p.jpeg"
     title="Klicken zum Vergrößern">

<div id="pforte">
<strong>Ein Weg in die 2. Aufmerksamkeit</strong><br><br>
Tun Sie mir den Gefallen und versuchen Sie,<br>
mit geschlossenen Augen in Ihre Hände zu schauen.<br>
Finden Sie im Geist Ihre Hände.
</div>

<script>
const pforte = document.getElementById("pforte");
const beipack = document.getElementById("beipackzettel");

let dragging = false;
let offsetX = 0, offsetY = 0;
let firstMove = false;

// Nach 15 Sekunden: Beipackzettel minimieren & Textbox einblenden
setTimeout(() => {
    beipack.classList.add("minimized");
    pforte.classList.add("visible");
}, 15000);

// Klick auf Beipackzettel: Vergrößern/Minimieren
beipack.addEventListener("click", () => {
    beipack.classList.toggle("minimized");
});

// 🖐 Textbox verschiebbar
pforte.addEventListener("pointerdown", e => {
    dragging = true;
    pforte.setPointerCapture(e.pointerId);
    pforte.style.cursor = "grabbing";

    const rect = pforte.getBoundingClientRect();
    pforte.style.left = rect.left + "px";
    pforte.style.top  = rect.top + "px";
    pforte.style.transform = "none";

    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
});

document.addEventListener("pointermove", e => {
    if (!dragging) return;
    pforte.style.left = (e.clientX - offsetX) + "px";
    pforte.style.top  = (e.clientY - offsetY) + "px";

    if (!firstMove){
        firstMove = true;
        document.body.classList.add("attuned");
    }
});

document.addEventListener("pointerup", () => {
    dragging = false;
    pforte.style.cursor = "grab";
});
</script>

</body>
