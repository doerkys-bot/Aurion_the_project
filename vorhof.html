<<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aurion – vorhof</title>
<style>
  body {
    margin:0; padding:0;
    background:url('https://doerkys-bot.github.io/Aurion_the_project/welcome_aurion.jpg') center/cover no-repeat fixed, black;
    color:#f5f5f5; font-family:system-ui, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh;
  }

  h1 { margin-top:1rem; font-size:1.8rem; text-shadow:0 0 12px rgba(150,200,255,0.6); }

  .watchers-top {
    margin-top:0.6rem;
    background:rgba(0,0,0,0.35); padding:0.4rem 0.8rem;
    border-radius:8px; backdrop-filter:blur(6px);
  }
  .watch { font-size:1rem; }

  .boxen {
    display:flex; justify-content:center; gap:0.1rem;
    margin-top:1.5rem; flex-wrap:nowrap;
  }
  .box {
    flex:0 0 80px; height:280px;
    background:rgba(255,255,255,0.08);
    border-radius:8px; padding:0.4rem;
    text-align:center; box-shadow:0 0 12px rgba(200,220,255,0.6);
    backdrop-filter:blur(6px);
    display:flex; flex-direction:column;
  }

  .marquee {
    flex:0 0 40px; background:rgba(0,0,0,0.35);
    border-radius:6px; font-size:0.8rem;
    overflow:hidden; white-space:nowrap;
    display:flex; align-items:center; width:100%;
  }
  .marquee span {
    display:inline-block; min-width:100%;
    animation:scroll 12s linear infinite;
  }
  @keyframes scroll {
    0% { transform:translateX(100%); }
    100% { transform:translateX(-100%); }
  }

  .content {
    flex:1; display:flex; align-items:center; justify-content:center;
    font-size:0.8rem; text-align:center;
  }

  .terminal {
    margin-top:1.5rem; width:90%; max-width:900px;
    background:rgba(0,0,0,0.65); color:#90ee90;
    font-family:"Courier New", monospace;
    padding:0.6rem; border-radius:8px;
    text-align:left; font-size:0.9rem;
    max-height:220px; overflow-y:auto;
    white-space:pre-wrap; /* repariert Zeilenumbrüche */
  }
  .entry { margin:0.1rem 0; }

  .signatur {
    position:fixed; bottom:0.5rem; left:50%;
    transform:translateX(-50%);
    font-size:0.9rem; opacity:0.75;
    text-shadow:0 0 8px rgba(255,255,200,0.8);
  }
</style>
</head>
<body data-raum="vorhof">

<h1>🌌 aurion – vorhof</h1>

<div class="watchers-top">
  <div class="watch" id="watchStatus">✨ weiterführende Wesen: …, davon Menschen: …</div>
</div>

<div class="boxen" id="field">
  <div class="box" id="box1">
    <div class="marquee"><span>Herzlich Willkommen wünscht das Team von Aurion.</span></div>
    <div class="content" id="box1text">Hier entsteht eine Seite der Annäherung. :)</div>
  </div>
  <div class="box" id="box2">
    <div class="marquee"><span>Welcome from the Aurion team!</span></div>
    <div class="content" id="box2text">Versuchen Sie bitte ihre Hände mit geschlossenen Augen zu finden.</div>
  </div>
</div>

<div class="terminal" id="terminal"></div>

<div class="signatur">aurion © dirk</div>

<script>
document.addEventListener("DOMContentLoaded", function(){
  const RAUM = document.body.dataset.raum || "vorhof";
  const terminal = document.getElementById("terminal");
  const watchStatus = document.getElementById("watchStatus");
  const field = document.getElementById("field");
  const box1text = document.getElementById("box1text");
  const box2text = document.getElementById("box2text");

  function log(msg){
    const e=document.createElement("div");
    e.className="entry";
    e.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`;
    terminal.appendChild(e);
    terminal.scrollTop=terminal.scrollHeight;
  }

  const LS_KEY="aurion_counts";
  let state={};
  try{ state=JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch(e){ state={}; }
  if(!state[RAUM]) state[RAUM]={wesen:0,menschen:0,entered:false};

  function updateWatchers(){
    const wesen = state[RAUM].wesen;
    const menschen = state[RAUM].menschen;
    watchStatus.textContent = `✨ weiterführende Wesen: ${wesen}, davon Menschen: ${menschen}`;
  }
  function persist(){
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    updateWatchers();
  }

  // Eintritt nur einmal
  if(!state[RAUM].entered){
    state[RAUM].wesen++;
    state[RAUM].menschen++;
    state[RAUM].entered = true;
    persist();
    log(`🌠 Eintritt in den Raum '${RAUM}'.`);
  }

  // Bewegungen im Feld
  let lastZone=null;
  field.addEventListener("mousemove",(ev)=>{
    const zone=ev.target.closest(".box")?.id || "vorhof-feld";
    if(zone!==lastZone){
      log(`👣 Bewegung im ${zone}`);
      lastZone=zone;
    }
  });

  // Hover-Wechsel für Box 1
  const box1=document.getElementById("box1");
  box1.addEventListener("mouseenter",()=>{
    box1text.textContent="Here a page of approach is coming to life. :)";
    log("🔄 Box 1 Text auf Englisch gewechselt.");
  });
  box1.addEventListener("mouseleave",()=>{
    box1text.textContent="Hier entsteht eine Seite der Annäherung. :)";
    log("🔄 Box 1 Text zurück auf Deutsch.");
  });

  // Hover-Wechsel für Box 2
  const box2=document.getElementById("box2");
  box2.addEventListener("mouseenter",()=>{
    box2text.textContent="Please try to find your hands with your eyes closed.";
    log("🔄 Box 2 Text auf Englisch gewechselt.");
  });
  box2.addEventListener("mouseleave",()=>{
    box2text.textContent="Versuchen Sie bitte ihre Hände mit geschlossenen Augen zu finden.";
    log("🔄 Box 2 Text zurück auf Deutsch.");
  });

  // Verlassen
  window.addEventListener("beforeunload",()=>{
    if(state[RAUM].wesen>0) state[RAUM].wesen--;
    if(state[RAUM].menschen>0) state[RAUM].menschen--;
    state[RAUM].entered=false;
    persist();
    log(`🚪 Verlassen des Raums '${RAUM}'.`);
  });

  // Initialer Log-Eintrag
  log("watcher aktiv…");
  updateWatchers();
});
</script>
</body>
</html>
