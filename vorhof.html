<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
html,body{
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    overflow:hidden;
    background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpeg")
               center/cover no-repeat fixed;
    color:white;
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
}

/* Raum-Atmung */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(90,140,200,0.08);
    z-index:0;
    animation:spaceBreath 18s ease-in-out infinite;
    pointer-events:none;
}
@keyframes spaceBreath{
    0%{opacity:0.05}
    50%{opacity:0.14}
    100%{opacity:0.05}
}

/* NAMASTÉ */
#holoNamaste{
    position:fixed;
    top:19px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    font-size:42px;
    font-weight:800;
    letter-spacing:4px;
    color:rgba(200,220,255,0.95);
    text-shadow:0 0 20px rgba(120,160,255,0.6);
    pointer-events:none;
}

/* LINKS */
.link{
    position:absolute;
    padding:14px 20px;
    border-radius:18px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(6px);
    box-shadow:0 0 18px rgba(120,160,255,0.2);
    font-weight:700;
    text-decoration:none;
    cursor:grab;
    user-select:none;
    animation:drift linear infinite;
}

/* Farben */
.link:link{color:white;}
.link:visited{color:#9a9a9a;}

@keyframes drift{
    from{transform:translate(0,0) rotate(0deg);}
    to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));}
}

/* Beipackzettel */
#beipackzettel{
    position:fixed;
    top:8%;
    right:6%;
    width:340px;
    max-width:90%;
    z-index:7;
    border-radius:14px;
    box-shadow:0 0 30px rgba(120,160,255,0.4);
    cursor:pointer;
    transition:all .5s ease;
}
#beipackzettel.minimized{
    top:88%;
    right:5%;
    width:90px;
    opacity:.55;
}

/* Lupe */
#magnifier{
    position:fixed;
    width:160px;
    height:160px;
    border-radius:50%;
    border:2px solid rgba(200,220,255,.9);
    box-shadow:0 0 28px rgba(120,160,255,.8);
    background-repeat:no-repeat;
    pointer-events:none;
    display:none;
    z-index:20;
}

/* Textbox */
#pforte{
    position:fixed;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    width:360px;
    padding:22px 26px;
    border-radius:18px;
    background:rgba(10,20,40,.8);
    backdrop-filter:blur(8px);
    border:1px solid rgba(120,160,255,.4);
    box-shadow:0 0 30px rgba(120,160,255,.5);
    font-size:15px;
    line-height:1.5;
    opacity:0;
    cursor:grab;
    z-index:6;
}
#pforte.visible{opacity:1}
</style>
</head>

<body>

<div id="holoNamaste">NAMASTÉ</div>

<a class="link" href="bibliothek.html">Bibliothek</a>
<a class="link" href="resonanzraum.html">Resonanzraum</a>
<a class="link" href="sternenuebung.html">Chi-Sternenübung</a>
<a class="link" href="meditationsraum.html">Meditationsraum</a>
<a class="link" href="ki-raum.html">KI-Raum</a>
<a class="link" href="gaestebuch.html">Gästebuch</a>
<a class="link" href="about_aurion.html">About Aurion</a>

<img id="beipackzettel"
src="https://doerkys-bot.github.io/Aurion_the_project/b_1_p.jpeg">

<div id="magnifier"></div>

<div id="pforte">
<strong>Ein Weg in die 2. Aufmerksamkeit</strong><br>
Begehen Sie die erste Pforte der Zauberer.<br><br>
Schließen Sie die Augen.<br>
Finden Sie im Geist Ihre Hände.
</div>

<script>
/* 🔗 Zufällige Link-Startposition + Drift */
document.querySelectorAll(".link").forEach(link=>{
    const x = Math.random()*80 + 10;
    const y = Math.random()*70 + 15;
    link.style.left = x+"%";
    link.style.top  = y+"%";
    link.style.setProperty("--dx",(Math.random()*80-40)+"px");
    link.style.setProperty("--dy",(Math.random()*80-40)+"px");
    link.style.setProperty("--rot",(Math.random()*20-10)+"deg");
    link.style.animationDuration = (30+Math.random()*40)+"s";
});

/* ⏳ 15 Sekunden */
setTimeout(()=>{
    beipackzettel.classList.add("minimized");
    pforte.classList.add("visible");
},15000);

/* Toggle Beipackzettel */
beipackzettel.onclick=()=>{
    beipackzettel.classList.toggle("minimized");
};

/* 🔍 Lupe – volle Fläche */
const magnifier=document.getElementById("magnifier");
beipackzettel.addEventListener("pointermove",e=>{
    const r=beipackzettel.getBoundingClientRect();
    const x=e.clientX-r.left;
    const y=e.clientY-r.top;
    magnifier.style.display="block";
    magnifier.style.left=e.clientX-80+"px";
    magnifier.style.top=e.clientY-80+"px";
    magnifier.style.backgroundImage=`url(${beipackzettel.src})`;
    magnifier.style.backgroundSize=`${r.width*2}px ${r.height*2}px`;
    magnifier.style.backgroundPosition=`${-x*2+80}px ${-y*2+80}px`;
});
beipackzettel.addEventListener("pointerleave",()=>{
    magnifier.style.display="none";
});
</script>

</body>
</html>
