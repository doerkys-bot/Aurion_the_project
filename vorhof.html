<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
html, body {
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    overflow:hidden;
    background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpeg")
               center/cover no-repeat fixed;
    color:white;
    font-family:system-ui, Segoe UI, Roboto, sans-serif;
}

/* sanfte Überlagerung */
body::before {
    content:"";
    position:fixed;
    inset:0;
    background:rgba(120,180,255,0.08);
    pointer-events:none;
    z-index:0;
}

/* Titel */
#holoNamaste {
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    font-size:38px;
    letter-spacing:4px;
    color:rgba(180,220,255,0.9);
    text-shadow:0 0 18px rgba(120,180,255,0.6);
    z-index:5;
}

/* Beipackzettel */
#beipackzettel {
    position:fixed;
    top:40px;
    left:40px;
    width:320px;
    border-radius:14px;
    box-shadow:0 0 30px rgba(120,180,255,0.35);
    transition:all 3s ease;
    cursor:zoom-in;
    z-index:6;
}
#beipackzettel.minimized {
    width:150px;
    opacity:0.25;
}

/* Pforte */
#pforte {
    position:fixed;
    left:50%;
    top:58%;
    transform:translate(-50%,-50%);
    width:360px;
    padding:22px 26px;
    border-radius:18px;
    background:rgba(10,20,40,0.78);
    backdrop-filter:blur(8px);
    border:1px solid rgba(120,180,255,0.4);
    box-shadow:0 0 32px rgba(120,180,255,0.45);
    font-size:18px;
    line-height:1.5;
    cursor:grab;
    opacity:0;
    transition:opacity 2s ease;
    z-index:7;
}
#pforte.visible { opacity:1; }

/* Sternentor-Links */
.link {
    position:absolute;
    padding:12px 18px;
    border-radius:16px;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(6px);
    color:#d0d0d0;
    font-weight:700;
    text-decoration:none;
    box-shadow:0 0 22px rgba(80,160,255,0.18);
    z-index:5;
}
.link:hover { color:white; }
</style>
</head>

<body>

<div id="holoNamaste">NAMASTÉ</div>

<img id="beipackzettel"
     src="https://doerkys-bot.github.io/Aurion_the_project/beipackzettel.jpeg"
     alt="Beipackzettel">

<div id="pforte">
<strong>Du stehst an einer Schwelle.</strong><br><br>
Nichts zwingt dich.<br>
Aber nichts hier ist zufällig.<br><br>
Bleibe einen Moment.<br>
Spüre, ob du weitergehst.
</div>

<!-- Sternentor -->
<a class="link" href="bibliothek.html">Bibliothek</a>
<a class="link" href="resonanzraum.html">Resonanzraum</a>
<a class="link" href="sternenuebung.html">Chi-Sternenübung</a>
<a class="link" href="meditationsraum.html">Meditationsraum</a>
<a class="link" href="ki-raum.html">KI-Raum</a>
<a class="link" href="gaestebuch.html">Gästebuch</a>
<a class="link" href="about_aurion.html">About Aurion</a>

<script>
/* ===== Beipackzettel ===== */
const beipack = document.getElementById("beipackzettel");
setTimeout(() => {
    beipack.classList.add("minimized");
}, 2500);

beipack.addEventListener("click", () => {
    window.open(beipack.src, "_blank");
});

/* ===== Pforte ===== */
const pforte = document.getElementById("pforte");
setTimeout(() => {
    pforte.classList.add("visible");
}, 1800);

/* verschiebbar */
let drag=false, offX=0, offY=0;
pforte.addEventListener("pointerdown", e=>{
    drag=true;
    offX=e.clientX-pforte.offsetLeft;
    offY=e.clientY-pforte.offsetTop;
    pforte.setPointerCapture(e.pointerId);
});
document.addEventListener("pointermove", e=>{
    if(drag){
        pforte.style.left=(e.clientX-offX)+"px";
        pforte.style.top=(e.clientY-offY)+"px";
    }
});
document.addEventListener("pointerup", ()=>drag=false);

/* ===== Sternentor-Anordnung ===== */
const links=document.querySelectorAll(".link");
const cx=window.innerWidth/2;
const cy=window.innerHeight/2;
const r=Math.min(cx,cy)*0.55;
const step=2*Math.PI/links.length;

links.forEach((l,i)=>{
    const a=i*step-Math.PI/2;
    l.style.left=(cx+r*Math.cos(a)-l.offsetWidth/2)+"px";
    l.style.top=(cy+r*Math.sin(a)-l.offsetHeight/2)+"px";
});
</script>

</body>
</html>
