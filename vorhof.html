<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vorhof Aurion – KI Version</title>
<style>
body {
  margin:0; padding:0;
  font-family: Arial, sans-serif;
  background: url("https://www.auriontheproject.eu/welcome_aurion.jpg") no-repeat center center fixed;
  background-size: cover;
  color: #eee;
  overflow-x: hidden;
}
header {
  text-align: center;
  font-size: 28px;
  margin: 16px 0 12px;
}
header span.symbol { margin-right:8px; }
.inner-link {
  display:inline-block;
  font-size:16px;
  font-weight:bold;
  color:#0ff;
  text-decoration:none;
}
.poster-container {
  display:flex;
  justify-content:center;
  gap:20px;
  flex-wrap: wrap;
  margin-bottom:40px;
}
.poster {
  width:260px;
  background: rgba(20,20,20,0.85);
  border-radius:10px;
  border:1px solid #333;
  padding:10px;
  position:relative;
  text-align:center;
  cursor:pointer;
  transition: all 0.6s ease;
  overflow:hidden;
}
.poster:hover { background: rgba(40,40,40,0.95); transform: scale(1.02); }
.marquee {
  display:block;
  white-space:nowrap;
  font-weight:bold;
  font-size:0.95em;
  overflow:hidden;
}
.marquee span {
  display:inline-block;
  padding-left:100%;
  animation: marquee 20s linear infinite;
}
@keyframes marquee {
  0% { transform: translateX(0%); }
  100% { transform: translateX(-100%); }
}
.line { border-bottom:1px solid #777; margin:8px 0; }
.text { font-size:0.9em; margin-top:8px; }
.readme-wrapper {
  max-width:900px;
  margin:0 auto 40px;
  background: rgba(15,15,15,0.85);
  padding:20px;
  border-radius:10px;
  border:1px solid #333;
}
iframe { width:100%; height:400px; border:none; border-radius:8px; }

/* KI-Subtle Particles */
#particleCanvas {
  position: fixed; inset:0;
  width:100%; height:100%;
  z-index:0;
  pointer-events:none;
}
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<header><span class="symbol">🏕️</span> Aurion begrüßt Sie</header>

<div style="text-align:center; margin-bottom:32px;">
  <a class="inner-link" href="aurion_inner.html"><span>🏕️</span> Eintritt in das Innere</a>
</div>

<div class="poster-container">
  <div class="poster" id="poster-a">
    <div class="marquee"><span id="a-marquee">Lädt...</span></div>
    <div class="line"></div>
    <div class="text" id="a-text">Lädt...</div>
  </div>

  <div class="poster" id="poster-b">
    <div class="marquee"><span id="b-marquee">Lädt...</span></div>
    <div class="line"></div>
    <div class="text" id="b-text">Lädt...</div>
  </div>
</div>

<div class="readme-wrapper">
  <iframe src="readme.html"></iframe>
</div>

<script>
// JSON laden und Hover-Übersetzung (Laufschrift + Text)
function loadPoster(jsonUrl, marqueeId, textId) {
  fetch(jsonUrl)
    .then(res => res.json())
    .then(data => {
      const marqueeEl = document.getElementById(marqueeId);
      const textEl = document.getElementById(textId);

      // Initial (Deutsch)
      marqueeEl.textContent = "Herzlich willkommen wünscht das Aurion-Team";
      textEl.textContent = data.text;

      const parent = marqueeEl.closest('.poster');
      parent.addEventListener('mouseenter', () => {
        // Englisch bei Hover
        marqueeEl.textContent = "Welcome to the Aurion team";
        textEl.textContent = data.text_en;
      });
      parent.addEventListener('mouseleave', () => {
        // Zurück ins Deutsche
        marqueeEl.textContent = "Herzlich willkommen wünscht das Aurion-Team";
        textEl.textContent = data.text;
      });
    })
    .catch(e => console.log("Fehler beim Laden:", jsonUrl, e));
}

loadPoster("https://www.auriontheproject.eu/pop_up_a.json","a-marquee","a-text");
loadPoster("https://www.auriontheproject.eu/pop_up_b.json","b-marquee","b-text");

// ================= KI-Particles =================
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;
window.addEventListener('resize',()=>{ w=canvas.width=window.innerWidth; h=canvas.height=window.innerHeight; });

class Particle{
  constructor(){ this.x=Math.random()*w; this.y=Math.random()*h; this.vx=(Math.random()-0.5)*0.4; this.vy=(Math.random()-0.5)*0.4; this.r=Math.random()*2+0.5; this.alpha=Math.random()*0.6+0.2; }
  update(){ this.x+=this.vx; this.y+=this.vy; if(this.x<0)this.x=w; if(this.x>w)this.x=0; if(this.y<0)this.y=h; if(this.y>h)this.y=0; }
  draw(){ ctx.beginPath(); ctx.fillStyle=`rgba(0,243,255,${this.alpha})`; ctx.arc(this.x,this.y,this.r,0,Math.PI*2); ctx.fill(); }
}
const particles=[]; for(let i=0;i<120;i++)particles.push(new Particle());
function animate(){
  ctx.clearRect(0,0,w,h);
  particles.forEach(p=>{ p.update(); p.draw(); });
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
