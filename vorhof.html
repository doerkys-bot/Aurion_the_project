<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vorhof</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;

        /* Hintergrundbild */
        background: url("welcome_aurion.jpg") no-repeat center center fixed;
        background-size: cover;

        color: #eee;
    }

    /* Dunkle, transparente Ebene über dem Bild */
    .overlay {
        background: rgba(0, 0, 0, 0.65);
        min-height: 100vh;
        width: 100%;
        padding: 20px;
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px;
    }

    h1 {
        text-align: center;
        color: #f0f0f0;
        font-weight: 300;
        margin-bottom: 30px;
        font-size: 2.2em;
        text-shadow: 0 0 10px rgba(0,0,0,0.6);
    }

    .vorhof-box {
        background: rgba(20, 20, 20, 0.85);
        padding: 20px;
        border-radius: 10px;
        border: 1px solid #333;
        margin-bottom: 40px;
    }

    /* Link ins Innere */
    .innere-link {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 20px;
        background: rgba(40, 40, 40, 0.85);
        border: 1px solid #555;
        border-radius: 8px;
        color: #ddd;
        text-decoration: none;
        font-size: 1.1em;
        transition: all 0.3s ease;
    }

    .innere-link:hover {
        background: rgba(60, 60, 60, 0.9);
        border-color: #777;
        color: #fff;
    }

    /* README Box */
    .readme-wrapper {
        background: rgba(15, 15, 15, 0.85);
        padding: 20px;
        border-radius: 10px;
        border: 1px solid #333;
    }

    .readme-wrapper h2 {
        margin-top: 0;
        font-weight: 300;
        font-size: 1.6em;
        color: #e0e0e0;
    }

    iframe {
        width: 100%;
        height: 500px;
        border: none;
        border-radius: 8px;
        background: #fff;
    }

    @media(max-width: 600px) {
        iframe {
            height: 350px;
        }
    }
</style>
</head>

<body>
<div class="overlay">
<div class="container">

    <h1>Der Vorhof</h1>

    <!-- Oberer Bereich -->
    <div class="vorhof-box">
        <p>
            Willkommen im Vorhof von Aurion.<br>
            Dieser Raum ist rein, still und ohne Watcher.<br>
            Ein Übergangsort – weder außen noch innen.
        </p>

        <!-- Link ins Innere -->
        <a class="innere-link" href="innere.hr5">Zum inneren Bereich</a>
    </div>

    <!-- Untere Box: README -->
    <div class="readme-wrapper">
        <h2>README</h2>
        <iframe src="readme.html"></iframe>
    </div>

</div>
</div>
</body>
</html>
