<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aurion – vorhof</title>
<style>
  body {
    margin:0; padding:0;
    background:url('https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpg') 
               no-repeat center center fixed;
    background-size:cover;
    color:#f5f5f5; font-family:system-ui, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh;
  }

  h1 { margin-top:2rem; font-size:1.8rem; text-shadow:0 0 12px rgba(150,200,255,0.6); }

  .laufschrift {
    margin-top:2rem;
    font-size:1.4rem;
    text-align:center;
    text-shadow:0 0 8px rgba(255,255,200,0.8);
  }

  .signatur {
    position:fixed;
    bottom:0;
    width:100%;
    text-align:center;
    font-size:1rem; opacity:0.75;
    text-shadow:0 0 8px rgba(255,255,200,0.8);
    padding:0.5rem;
  }
</style>
</head>
<body>

<h1>🌌 aurion – vorhof</h1>

<div class="laufschrift">Willkommen</div>

<div class="signatur">aurion © dirk</div>

<script>
document.addEventListener("DOMContentLoaded", function(){
  const texte = ["Willkommen", "Welcome", "Bienvenido", "Bienvenue", "Benvenuto"];
  let index = 0;
  const element = document.querySelector(".laufschrift");
  let locked = false;

  function wechselText(){
    if (locked) return; // wenn gesperrt, kein Wechsel
    index = (index + 1) % texte.length;
    element.textContent = texte[index];
    locked = true;
    setTimeout(()=>{ locked = false; }, 4000); // 4 Sekunden Sperrzeit
  }

  // automatischer Wechsel alle 6 Sekunden
  setInterval(wechselText, 6000);
});
</script>
</body>
</html>
