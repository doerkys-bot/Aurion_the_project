<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurion – Vorhof</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpeg")
        center/cover no-repeat fixed;
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
    color:white;
}

/* Raum-Atmung */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(120,180,255,0.08);
    animation:breath 18s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
}
body.attuned::before{
    background:rgba(120,180,255,0.04);
    animation-duration:26s;
}
@keyframes breath{
    0%{opacity:.05}
    50%{opacity:.14}
    100%{opacity:.05}
}

/* NAMASTÉ */
#namaste{
    position:fixed;
    top:0;
    left:50%;
    transform:translateX(-50%);
    padding-top:14px;
    font-size:42px;
    font-weight:800;
    letter-spacing:4px;
    z-index:10;
    text-shadow:0 0 28px rgba(120,180,255,.65);
}

/* Links */
.link{
    position:absolute;
    padding:12px 18px;
    border-radius:16px;
    backdrop-filter:blur(6px);
    background:rgba(255,255,255,.06);
    box-shadow:0 0 22px rgba(80,160,255,.18);
    cursor:grab;
    user-select:none;
    z-index:5;
    transition:color .4s;
}
.link:active{cursor:grabbing}

/* Beipackzettel */
#beipackzettel{
    position:fixed;
    top:8%;
    right:6%;
    width:340px;
    border-radius:14px;
    box-shadow:0 0 30px rgba(120,180,255,.4);
    z-index:8;
    transition:all .8s ease;
    cursor:pointer;
}
#beipackzettel.minimized{
    width:90px;
    top:6px;
    right:6px;
    opacity:.7;
}

/* Textbox */
#pforte{
    position:fixed;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    width:360px;
    padding:20px;
    border-radius:18px;
    background:rgba(10,20,40,.8);
    backdrop-filter:blur(8px);
    border:1px solid rgba(120,180,255,.4);
    box-shadow:0 0 32px rgba(120,180,255,.45);
    opacity:0;
    z-index:7;
    cursor:grab;
}
#pforte.visible{opacity:1}
#pforte:active{cursor:grabbing}
</style>
</head>

<body>

<div id="namaste">NAMASTÉ</div>

<a class="link" href="bibliothek.html">Bibliothek</a>
<a class="link" href="resonanzraum.html">Resonanzraum</a>
<a class="link" href="sternenuebung.html">Chi-Sternenübung</a>
<a class="link" href="meditationsraum.html">Meditationsraum</a>
<a class="link" href="ki-raum.html">KI-Raum</a>
<a class="link" href="gaestebuch.html">Gästebuch</a>
<a class="link" href="about_aurion.html">About Aurion</a>

<img id="beipackzettel"
src="https://doerkys-bot.github.io/Aurion_the_project/b_1_p.jpeg">

<div id="pforte">
<strong>Ein Weg in die 2. Aufmerksamkeit</strong><br>
<em>Begehen Sie die erste Pforte der Zauberer.</em><br><br>
Tun Sie mir den Gefallen und versuchen Sie,<br>
mit geschlossenen Augen in Ihre Hände zu schauen.
</div>

<script>
/* ---------------- Sternentor-Geometrie ---------------- */
function tor(){
    return {
        cx: innerWidth/2,
        cy: innerHeight/2,
        r: Math.min(innerWidth,innerHeight)*0.38
    };
}

/* ---------------- Links ---------------- */
const links=[...document.querySelectorAll(".link")];
const store=localStorage;

links.forEach(l=>{
    const k="visited_"+l.href;
    l.style.color=store.getItem(k)?"#b0b0b0":"#ffffff";
    l.onclick=()=>store.setItem(k,"yes");

    const t=tor();
    const a=Math.random()*Math.PI*2;
    const d=Math.random()*t.r*0.85;

    l.x=t.cx+Math.cos(a)*d;
    l.y=t.cy+Math.sin(a)*d;

    l.vx=(Math.random()*.12+.03)*(Math.random()<.5?-1:1);
    l.vy=(Math.random()*.12+.03)*(Math.random()<.5?-1:1);
    l.rot=(Math.random()*.004-.002);
    l.a=0;
    l.drag=false;

    l.style.left=l.x+"px";
    l.style.top=l.y+"px";

    l.onpointerdown=e=>{
        l.drag=true;
        l.ox=e.clientX-l.x;
        l.oy=e.clientY-l.y;
        l.setPointerCapture(e.pointerId);
    };
});

addEventListener("pointermove",e=>{
    links.forEach(l=>{
        if(!l.drag)return;
        l.x=e.clientX-l.ox;
        l.y=e.clientY-l.oy;
        l.style.left=l.x+"px";
        l.style.top=l.y+"px";
    });
});
addEventListener("pointerup",()=>links.forEach(l=>l.drag=false));

function drift(){
    const t=tor();
    links.forEach(l=>{
        if(l.drag)return;

        l.x+=l.vx;
        l.y+=l.vy;
        l.a+=l.rot;

        const dx=l.x-t.cx;
        const dy=l.y-t.cy;
        const dist=Math.hypot(dx,dy);

        if(dist>t.r){
            const nx=dx/dist;
            const ny=dy/dist;
            const dot=l.vx*nx+l.vy*ny;
            l.vx-=2*dot*nx;
            l.vy-=2*dot*ny;
            l.x=t.cx+nx*(t.r-8);
            l.y=t.cy+ny*(t.r-8);
        }

        l.style.left=l.x+"px";
        l.style.top=l.y+"px";
        l.style.transform=`rotate(${l.a}rad)`;
    });
    requestAnimationFrame(drift);
}
drift();

/* ---------------- Beipackzettel ---------------- */
const b=document.getElementById("beipackzettel");
setTimeout(()=>{
    b.classList.add("minimized");
    document.getElementById("pforte").classList.add("visible");
},15000);
b.onclick=()=>b.classList.toggle("minimized");

/* ---------------- Textbox Drag ---------------- */
const p=document.getElementById("pforte");
let drag=false,ox,oy,first=false;

p.onpointerdown=e=>{
    drag=true;
    const r=p.getBoundingClientRect();
    p.style.left=r.left+"px";
    p.style.top=r.top+"px";
    p.style.transform="none";
    ox=e.clientX-r.left;
    oy=e.clientY-r.top;
    p.setPointerCapture(e.pointerId);
};

addEventListener("pointermove",e=>{
    if(!drag)return;
    p.style.left=e.clientX-ox+"px";
    p.style.top=e.clientY-oy+"px";
    if(!first){
        first=true;
        document.body.classList.add("attuned");
    }
});
addEventListener("pointerup",()=>drag=false);
</script>

</body>
</html>
