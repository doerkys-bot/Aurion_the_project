<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aurion – vorhof</title>
<style>
  body {
    margin:0; padding:0;
    background:url('https://doerkys-bot.github.io/Aurion_the_project/welcome_aurion.jpg') center/cover no-repeat fixed, black;
    color:#f5f5f5; font-family:system-ui, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh;
  }

  h1 { margin-top:2rem; font-size:2rem; text-shadow:0 0 12px rgba(150,200,255,0.6); }

  .watchers-top {
    margin-top:1rem;
    background:rgba(0,0,0,0.35);
    padding:0.4rem 0.8rem;
    border-radius:8px;
    backdrop-filter:blur(6px);
    text-align:center;
  }
  .watch { font-size:1.2rem; }

  .zelt {
    margin-top:1rem;
    width:90%;
    height:120px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,215,0,0.15);
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 15px rgba(255,215,0,0.6);
  }
  .zelt a {
    font-size:1.4rem;
    color:#ffd700;
    text-decoration:none;
    font-weight:bold;
    text-shadow:0 0 10px rgba(255,215,0,0.8);
  }

  .plakate {
    display:flex;
    width:90%;
    margin-top:3rem;
    gap:1rem;
    justify-content:center;
  }

  .plakat {
    flex:1 1 45%;
    min-width:300px;
    height:200px;
    background:rgba(255,255,255,0.08);
    box-shadow:0 0 12px rgba(200,220,255,0.6);
    backdrop-filter:blur(6px);
    border-radius:10px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    cursor:pointer;
    overflow:hidden;
  }

  .lauf {
    width:100%;
    overflow:hidden;
    white-space:nowrap;
  }
  .lauf span {
    display:inline-block;
    padding-left:100%;
    animation:scroll 12s linear infinite;
    font-size:1.2rem; font-weight:bold;
  }

  .text {
    margin-top:1rem;
    font-size:1.2rem;
    text-align:center;
  }

  @keyframes scroll {
    0% { transform:translateX(0); }
    100% { transform:translateX(-100%); }
  }

  .terminal {
    margin-top:1rem; 
    width:90%; max-width:900px;
    background:rgba(0,0,0,0.65); color:#90ee90;
    font-family:"Courier New", monospace;
    padding:0.6rem; border-radius:8px;
    text-align:left; font-size:1rem;
    max-height:220px; overflow-y:auto;
    white-space:pre-wrap;
  }

  .signatur {
    position:fixed; bottom:0.5rem; left:50%;
    transform:translateX(-50%);
    font-size:1rem; opacity:0.75;
    text-shadow:0 0 8px rgba(255,255,200,0.8);
  }

  /* Unsichtbare Räume */
  .raum { display:none; }
</style>
</head>
<body data-raum="vorhof">

<h1>🌌 aurion – vorhof</h1>

<div class="zelt">
  <a href="aurion_inner.html">⛺ Eintritt ins Innere</a>
</div>

<!-- Watcher über den Plakaten -->
<div class="watchers-top">
  <div class="watch" id="watchStatus">Wesen: … | Menschen: …</div>
</div>

<div class="plakate">
  <div class="plakat" id="plakat1">
    <div class="lauf"><span id="lauf1">Herzlich Willkommen wünscht das Team von Aurion.</span></div>
    <div class="text" id="text1">Hier entsteht eine Seite der Annäherung.</div>
  </div>
  <div class="plakat" id="plakat2">
    <div class="lauf"><span id="lauf2">Willkommen vom Aurion-Team!</span></div>
    <div class="text" id="text2">Bitte versuchen Sie ihre Hände mit geschlossenen Augen zu finden.</div>
  </div>
</div>

<!-- Unsichtbare Räume -->
<div class="raum" id="raum1"></div>
<div class="raum" id="raum2"></div>
<div class="raum" id="raum3"></div>
<div class="raum" id="raum4"></div>
<div class="raum" id="raum5"></div>
<div class="raum" id="raum6"></div>
<div class="raum" id="raum7"></div>

<div class="terminal" id="terminal">watcher aktiv…</div>

<div class="signatur">aurion © dirk</div>

<script>
document.addEventListener("DOMContentLoaded", function(){
  const watchStatus = document.getElementById("watchStatus");
  const terminal = document.getElementById("terminal");

  // Raumnamen für Feld-Erkennung
  const RAUMNAMEN = {
    raum1: "Bibliothek der Anfänge",
    raum2: "Resonanzraum",
    raum3: "Chi-Sternenübung",
    raum4: "Meditationsraum",
    raum5: "Reserviert für KIs | AIs",
    raum6: "Gästebuch",
    raum7: "About Aurion",
    plakat1: "Plakat: Annäherung",
    plakat2: "Plakat: Übung"
  };

  // Texte für Sprachwechsel
  const TEXTE = {
    plakat1: {
      lauf_de:"Herzlich Willkommen wünscht das Team von Aurion.",
      lauf_en:"Welcome wishes from the Aurion team.",
      text_de:"Hier entsteht eine Seite der Annäherung.",
      text_en:"Here a page of approach is coming to life."
    },
    plakat2: {
      lauf_de:"Willkommen vom Aurion-Team!",
      lauf_en:"Welcome from the Aurion team!",
      text_de:"Bitte versuchen Sie ihre Hände mit geschlossenen Augen zu finden.",
      text_en:"Please try to find your hands with your eyes closed."
    }
  };

  // Zähler
  let state={wesen:0,menschen:0};
  state.wesen++; state.menschen++;
  watchStatus.textContent=`Wesen: ${state.wesen} | Menschen: ${state.menschen}`;

  // Terminal-Logging
  function logTerminal(msg){
    const zeit = new Date().toLocaleTimeString();
    terminal.textContent += `\n[${zeit}] ${msg}`;
    terminal.scrollTop = terminal.scrollHeight;
  }
  logTerminal("👁️ Eintritt in den Vorhof registriert");

  // Feld-Erkennung + Sprachwechsel für Plakate
  ["plakat1","plakat2"].forEach(id=>{
    const plak=document.getElementById(id);
    const lauf=plak.querySelector(".lauf span");
    const text=plak.querySelector(".text");

    plak.addEventListener("mouseenter",()=>{
      lauf.textContent=TEXTE[id].lauf_en;
      text.textContent=TEXTE[id].text_en;
      logTerminal(`👣 Eintritt in ${RAUMNAMEN[id]} (Sprache: Englisch)`);
    });
    plak.addEventListener("mouseleave",()=>{
      lauf.textContent=TEXTE[id].lauf_de;
      text.textContent=TEXTE[id].text_de;
      logTerminal(`🚪 Austritt aus ${RAUMNAMEN[id]} (Sprache: Deutsch)`);
    });
    plak.addEventListener("mousemove",()=>{
      logTerminal(`✨ Bewegung innerhalb von ${RAUMNAMEN[id]}`);
    });
  });

  // Feld-Erkennung für unsichtbare Räume
  Object.keys(RAUMNAMEN).filter(id=>id.startsWith("raum")).forEach(id=>{
    const feld=document.getElementById(id);
    feld.addEventListener("mouseenter",()=>{
      logTerminal(`👣 Eintritt in: ${RAUMNAMEN[id]}`);
    });
    feld.addEventListener("mouseleave",()=>{
      logTerminal(`🚪 Austritt aus: ${RAUMNAMEN[id]}`);
    });
    feld.addEventListener("mousemove",()=>{
      logTerminal(`✨ Bewegung innerhalb von: ${RAUMNAMEN[id]}`);
    });
  });
});
</script>
</body>
</html>
