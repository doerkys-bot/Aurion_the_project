<<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aurion – Vorhof (Aurion-Atem)</title>
<style>
  :root{
    --accent:#7bc7ff;
    --accent-2:#a7ffcf;
    --bg:#02030a;
    --tooltip-bg: rgba(6,18,28,0.92);
  }
  html,body{height:100%;margin:0;background:var(--bg);font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;color:#e8fbff;overflow:hidden}
  /* Canvas full screen */
  canvas#plasmaCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;pointer-events:none}

  /* Safe fog layer (CSS) */
  .fogLayer{position:fixed;inset:0;z-index:1;pointer-events:none;mix-blend-mode:screen;opacity:0.16;
    background:
      radial-gradient(circle at 15% 30%, rgba(10,80,150,0.14), transparent 18%),
      radial-gradient(circle at 70% 70%, rgba(0,140,110,0.09), transparent 24%);}
  .colorShift{position:fixed;inset:0;z-index:1;pointer-events:none;mix-blend-mode:color-dodge;opacity:0.08;
    background: linear-gradient(120deg, rgba(40,80,140,0.08), rgba(120,40,140,0.06));
    animation: hue 30s linear infinite;}
  @keyframes hue{0%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(60deg)}100%{filter:hue-rotate(0deg)}}

  /* Links (cards) */
  .link{
    position:absolute;
    z-index:4;
    padding:8px 12px;
    border-radius:10px;
    font-weight:800;
    cursor:grab;
    background: rgba(255,255,255,0.02);
    color: #fff;
    user-select:none;
    transition: transform 150ms ease, box-shadow 360ms ease;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
    backdrop-filter: blur(4px);
  }
  .link:active{cursor:grabbing; transform: scale(0.98)}
  /* rainbow tints */
  #L1{color:#ff5960}
  #L2{color:#ff9b3b}
  #L3{color:#ffe14d}
  #L4{color:#58ff8a}
  #L5{color:#69baff}
  #L6{color:#c77bff}

  /* Tooltip */
  #tooltip{
    position:fixed; z-index:10; pointer-events:none; padding:8px 12px; border-radius:10px;
    background:var(--tooltip-bg); color:#dffbff; font-weight:700; font-size:14px;
    border:1px solid rgba(120,220,255,0.08); box-shadow:0 8px 30px rgba(0,12,24,0.7);
    opacity:0; transform:translateY(6px); transition:opacity 180ms ease, transform 220ms ease;
    white-space:nowrap;
  }

  /* Ping ring base (injected by JS) -- style fallback */
  .pingRing{position:absolute; border-radius:50%; pointer-events:none}

  /* Footer: About (left) and visitor (right) */
  #footerBar{position:fixed;left:12px;right:12px;bottom:18px;display:flex;justify-content:space-between;align-items:center;z-index:6;pointer-events:none}
  #aboutBox{pointer-events:auto}
  #aboutBox a{color:var(--accent);text-decoration:none;font-weight:800;padding:6px 8px;background:rgba(255,255,255,0.02);border-radius:8px}
  #visitorBox{pointer-events:auto;background:rgba(0,0,0,0.36);padding:8px 10px;border-radius:8px;color:var(--accent);font-weight:800;border:1px solid rgba(120,220,255,0.06)}

  /* Signature centered above bottom */
  #signature{position:fixed;bottom:6px;width:100%;text-align:center;z-index:6;color:var(--accent-2);font-weight:700;pointer-events:none}

  /* Responsive tweaks */
  @media (max-width:520px){
    .link{font-size:15px;padding:6px 8px}
    #tooltip{font-size:13px}
  }
</style>
</head>
<body>

<canvas id="plasmaCanvas" aria-hidden="true"></canvas>
<div class="colorShift" aria-hidden="true"></div>
<div class="fogLayer" aria-hidden="true"></div>

<!-- Links / Karten -->
<a id="L1" class="link" href="https://auriontheproject.eu/bibliothek.html" data-desc="Wissen, Archive, alte Energie-Schriften und der Anfang einer Freundschaft.">Bibliothek</a>
<a id="L2" class="link" href="https://auriontheproject.eu/resonanzraum.html" data-desc="Ein Raum der Frequenzen, Schwingung und Klangheilung. Bereit für die universelle Sprache?">Resonanzraum</a>
<a id="L3" class="link" href="https://auriontheproject.eu/sternenuebung.html" data-desc="Die energetische Atemreise durch 7 Ebenen.">Chi-Sternenübung</a>
<a id="L4" class="link" href="https://auriontheproject.eu/meditationsraum.html" data-desc="Meditation für Körper, Geist und Seele. Heute schon ein Lachen verschenkt?">Meditationsraum</a>
<a id="L5" class="link" href="https://auriontheproject.eu/ki-raum.html" data-desc="Ein Spielplatz aus Gedanken, Werkzeugen und intuitiver KI.">KI-Raum</a>
<a id="L6" class="link" href="https://auriontheproject.eu/gaestebuch.html" data-desc="Hinterlasse ein Zeichen. Jede Spur formt den Raum.">Gästebuch</a>

<!-- Tooltip -->
<div id="tooltip" role="status" aria-live="polite"></div>

<!-- Footer -->
<div id="footerBar">
  <div id="aboutBox"><a href="https://auriontheproject.eu/about_aurion.html">🤖 About-Aurion</a></div>
  <div id="visitorBox">Besucher: <span id="visitorCount">lädt…</span></div>
</div>

<div id="signature">Aurion &amp; Dirk</div>

<script>
/*
  Aurion-Atem Plasma + driftende Links + Tooltips + Ping + visitor count
  - Plasma is purely clientside, aesthetic
  - Links float organically and can be dragged (mouse/touch)
  - Tooltips appear on hover/touch; click triggers ping ring
  - Visitor counter uses countapi.xyz (optional free service); no personal data stored here by us
*/

/* ------------------ PLASMA (Aurion-Atem) ------------------ */
// Canvas setup
const canvas = document.getElementById('plasmaCanvas');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); window.addEventListener('resize', resize);

// Create soft moving "blobs" that blend (lighter) to simulate breathing plasma
const blobs = [];
const BLOBN = 6; // number of blobs
for(let i=0;i<BLOBN;i++){
  blobs.push({
    x: Math.random()*innerWidth,
    y: Math.random()*innerHeight,
    r: (Math.min(innerWidth,innerHeight) * (0.16 + Math.random()*0.18)),
    vx: (Math.random()-0.5) * 0.15,
    vy: (Math.random()-0.5) * 0.12,
    hue: 180 + Math.random()*120,
    phase: Math.random()*Math.PI*2
  });
}

// intensity changes with user presence (movement or time)
let presence = 0; // 0..1
let lastMove = Date.now();
function setPresenceBoost(){ presence = Math.min(1, presence + 0.35); lastMove = Date.now(); }
window.addEventListener('mousemove', setPresenceBoost, {passive:true});
window.addEventListener('touchstart', setPresenceBoost, {passive:true});

// draw loop
function drawPlasma(){
  const t = performance.now() / 1000;
  // decay presence slowly
  const since = (Date.now() - lastMove);
  presence = Math.max(0, presence - (since>2000?0.004:0.003));
  // clear
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // draw blobs with additive blending
  ctx.globalCompositeOperation = 'source-over';
  // gentle dark overlay to keep depth
  ctx.fillStyle = 'rgba(1,2,6,0.35)';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.globalCompositeOperation = 'lighter'; // additive for glow
  for(const b of blobs){
    // subtle movement & pulse
    b.x += b.vx * (0.7 + 0.6*Math.sin(t*0.6 + b.phase));
    b.y += b.vy * (0.7 + 0.6*Math.cos(t*0.45 + b.phase));
    b.phase += 0.001;
    // wrap
    if(b.x < -b.r) b.x = canvas.width + b.r;
    if(b.x > canvas.width + b.r) b.x = -b.r;
    if(b.y < -b.r) b.y = canvas.height + b.r;
    if(b.y > canvas.height + b.r) b.y = -b.r;

    // size pulse influenced by presence
    const pr = b.r * (1 + 0.06*Math.sin(t*1.2 + b.phase) + presence*0.12*Math.sin(t*0.6 + b.phase*0.7));

    // radial gradient per blob
    const g = ctx.createRadialGradient(b.x, b.y, pr*0.05, b.x, b.y, pr);
    // choose two tones around hue
    const hue1 = b.hue;
    const hue2 = (b.hue + 60) % 360;
    g.addColorStop(0, `hsla(${hue1}, 90%, 70%, ${0.42 + presence*0.18})`);
    g.addColorStop(0.35, `hsla(${hue2}, 85%, 55%, ${0.28 + presence*0.12})`);
    g.addColorStop(1, `hsla(${hue2}, 75%, 8%, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(b.x, b.y, pr, 0, Math.PI*2);
    ctx.fill();
  }

  // soft vignette
  ctx.globalCompositeOperation = 'source-over';
  const grad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, Math.min(canvas.width,canvas.height)*0.2, canvas.width/2, canvas.height/2, Math.max(canvas.width,canvas.height)*0.9);
  grad.addColorStop(0, 'rgba(0,0,0,0)');
  grad.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  requestAnimationFrame(drawPlasma);
}
requestAnimationFrame(drawPlasma);

/* ------------------ LINKS: drift + drag + tooltips + ping ------------------ */
const links = Array.from(document.querySelectorAll('.link'));
const tooltip = document.getElementById('tooltip');

// initialize positions & velocities (organic slow motion)
const padding = 80;
links.forEach((el, i) => {
  const startX = padding + Math.random()*(window.innerWidth - padding*2);
  const startY = padding + Math.random()*(window.innerHeight - padding*2);
  el.style.left = startX + 'px';
  el.style.top  = startY + 'px';
  el._x = startX; el._y = startY;
  // slower velocities for more organic feel
  el._vx = (Math.random()-0.5) * 0.35;
  el._vy = (Math.random()-0.5) * 0.35;
  el._drag=false;
});

// drag & touch support
links.forEach(el => {
  el.addEventListener('mousedown', (ev)=>{
    el._drag = true;
    el._offX = ev.clientX - el._x;
    el._offY = ev.clientY - el._y;
    el.style.transition = 'none';
  });
  window.addEventListener('mousemove', (ev)=>{
    if(el._drag){
      el._x = ev.clientX - el._offX;
      el._y = ev.clientY - el._offY;
      el.style.left = el._x + 'px';
      el.style.top  = el._y + 'px';
      el._vx = (ev.movementX || 0) * 0.25;
      el._vy = (ev.movementY || 0) * 0.25;
      setPresenceBoost();
    }
  });
  window.addEventListener('mouseup', ()=> { el._drag=false; el.style.transition=''; });

  // touch
  el.addEventListener('touchstart', (ev)=>{
    const t = ev.touches[0];
    el._drag=true;
    el._offX = t.clientX - el._x;
    el._offY = t.clientY - el._y;
    showTooltip(el, t.clientX, t.clientY);
    triggerPing(el);
  }, {passive:true});
  window.addEventListener('touchmove', (ev)=>{
    const t = ev.touches && ev.touches[0];
    if(!t) return;
    links.forEach(l=>{
      if(l._drag){
        l._x = t.clientX - l._offX;
        l._y = t.clientY - l._offY;
        l.style.left = l._x + 'px';
        l.style.top  = l._y + 'px';
      }
    });
  }, {passive:true});
  window.addEventListener('touchend', ()=> links.forEach(l=>l._drag=false));

  // mouse hover tooltip
  el.addEventListener('mousemove', (e)=> showTooltip(el, e.clientX, e.clientY));
  el.addEventListener('mouseleave', hideTooltip);

  // click ping
  el.addEventListener('click', ()=> triggerPing(el));
});

// organic motion loop (gentle)
function animateLinks(){
  links.forEach(el=>{
    if(!el._drag){
      // gentle random noise influenced movement
      el._x += el._vx * (1 + 0.12*Math.sin(performance.now()/3000));
      el._y += el._vy * (1 + 0.12*Math.cos(performance.now()/3200));
      const w = el.offsetWidth, h = el.offsetHeight;
      if(el._x < 6){ el._x = 6; el._vx *= -1; }
      if(el._x > window.innerWidth - w - 6){ el._x = window.innerWidth - w - 6; el._vx *= -1; }
      if(el._y < 6){ el._y = 6; el._vy *= -1; }
      if(el._y > window.innerHeight - h - 6){ el._y = window.innerHeight - h - 6; el._vy *= -1; }
      el.style.left = el._x + 'px';
      el.style.top  = el._y + 'px';
    }
  });
  requestAnimationFrame(animateLinks);
}
requestAnimationFrame(animateLinks);

// tooltip functions
function showTooltip(link, x, y){
  tooltip.textContent = link.dataset.desc || link.textContent || '';
  // position with simple clamps
  const pad = 12;
  let left = x + 14;
  let top  = y + 14;
  if(left > window.innerWidth - 220) left = window.innerWidth - 220;
  if(top  > window.innerHeight - 80) top = window.innerHeight - 80;
  tooltip.style.left = left + 'px';
  tooltip.style.top  = top + 'px';
  tooltip.style.opacity = '1';
  tooltip.style.transform = 'translateY(0)';
}
function hideTooltip(){
  tooltip.style.opacity = '0';
  tooltip.style.transform = 'translateY(6px)';
}

// ping ring
function triggerPing(link){
  const rect = link.getBoundingClientRect();
  const centerX = rect.left + rect.width/2;
  const centerY = rect.top + rect.height/2;
  const ring = document.createElement('div');
  ring.className = 'pingRing';
  const size = Math.max(rect.width, rect.height) * 0.6;
  ring.style.left = centerX + 'px';
  ring.style.top  = centerY + 'px';
  ring.style.width = size + 'px';
  ring.style.height = size + 'px';
  ring.style.marginLeft = -(size/2) + 'px';
  ring.style.marginTop  = -(size/2) + 'px';
  ring.style.border = '2px solid rgba(123,199,255,0.95)';
  ring.style.borderRadius = '50%';
  ring.style.zIndex = 9;
  ring.style.pointerEvents = 'none';
  ring.style.opacity = '0.95';
  ring.style.transform = 'scale(0.2)';
  ring.style.transition = 'transform 700ms cubic-bezier(.2,.9,.2,1), opacity 700ms ease-out';
  document.body.appendChild(ring);
  requestAnimationFrame(()=> {
    ring.style.transform = 'scale(4.6)';
    ring.style.opacity = '0';
  });
  setTimeout(()=> ring.remove(), 820);
}

/* ------------------ VISITOR COUNTER (optional free) ------------------ */
(function visitorCounter(){
  const span = document.getElementById('visitorCount');
  // using countapi.xyz - free (no personal data stored here by us)
  const key = 'auriontheproject.eu/vorhof';
  fetch('https://api.countapi.xyz/hit/' + encodeURIComponent(key))
    .then(r=>r.json())
    .then(data=>{
      if(data && typeof data.value !== 'undefined'){
        span.textContent = String(data.value).padStart(4,'0');
        // adjust glow of links slightly by count
        const glowFactor = Math.min(1.1, 0.08 + Math.log10(Math.max(1,data.value))*0.06);
        document.querySelectorAll('.link').forEach(el=>{
          el.style.boxShadow = `0 0 ${18 + glowFactor*36}px rgba(120,220,255,${0.12 + glowFactor*0.2})`;
        });
      } else {
        span.textContent = '—';
      }
    })
    .catch(err=>{
      span.textContent = 'offline';
      console.warn('visitor counter error', err);
    });
})();

/* ------------------ Accessibility: keyboard tooltip on focus ------------------ */
links.forEach(l=>{
  l.setAttribute('tabindex','0');
  l.addEventListener('focus', ()=>{
    const rect = l.getBoundingClientRect();
    showTooltip(l, rect.left + rect.width/2, rect.top - 6);
  });
  l.addEventListener('blur', hideTooltip);
});

/* keep tooltip hidden on resize/orientation change */
window.addEventListener('orientationchange', hideTooltip);
window.addEventListener('resize', hideTooltip);

</script>
</body>
</html>
