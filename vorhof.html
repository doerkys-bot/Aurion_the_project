<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpeg") center/cover no-repeat fixed;
  font-family:system-ui,Segoe UI,Roboto,sans-serif;
  color:white;
}

.link{
  position:absolute;
  padding:12px 18px;
  border-radius:16px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(6px);
  color:#cfeeff;
  text-decoration:none;
  font-weight:700;
  box-shadow:0 0 22px rgba(80,160,255,.18);
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease, opacity .18s ease, filter .18s ease;
  z-index:6;
  white-space:nowrap;
}
.link.active{
  transform:scale(1.10);
  background:rgba(140,255,200,.18);
  box-shadow:0 0 18px rgba(140,255,200,.70), 0 0 42px rgba(120,255,200,.95);
}
.link.confirmFlash{
  box-shadow:0 0 65px rgba(220,255,240,.98);
  background:rgba(170,255,220,.20);
}
.link.calibrationMuted{
  opacity:.08;
  filter:blur(1px);
  pointer-events:none;
}

#title{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  color:#cfeeff;
  font-size:clamp(22px,3.5vw,38px);
  letter-spacing:.22em;
  text-transform:uppercase;
  z-index:8;
  text-shadow:0 0 16px rgba(120,200,255,.22);
}

#gazeDot{
  position:fixed;
  width:10px;
  height:10px;
  border-radius:50%;
  transform:translate(-50%,-50%) scale(1);
  background:#ff3b3b;
  box-shadow:0 0 8px rgba(255,60,60,.9);
  pointer-events:none;
  z-index:9998;
  opacity:0;
  transition:transform .14s ease, opacity .15s ease;
}
#gazeDot.on{ opacity:1; }
#gazeDot.pulse{ transform:translate(-50%,-50%) scale(2.2); }

#hint{
  position:fixed;
  bottom:58px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  color:#bfe9ff;
  background:rgba(0,0,0,.42);
  padding:6px 10px;
  border-radius:10px;
  z-index:9997;
  max-width:92vw;
  text-align:center;
  white-space:pre-wrap;
}

#videoWrap{
  position:fixed;
  top:10px;
  left:10px;
  width:80px;
  height:90px;
  border-radius:8px;
  overflow:hidden;
  background:black;
  display:none;
  z-index:9996;
  border:1px solid rgba(140,230,255,.22);
  box-shadow:0 0 18px rgba(120,200,255,.25);
}
#cam{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(1.8) translateY(-18%);
}

.controls-left{
  position:fixed;
  left:12px;
  bottom:110px;
  display:flex;
  flex-direction:column;
  gap:8px;
  z-index:9999;
}
.controls-right{
  position:fixed;
  right:12px;
  bottom:110px;
  z-index:9999;
}

button{
  padding:8px 12px;
  border-radius:10px;
  border:1px solid rgba(140,230,255,.28);
  background:rgba(20,40,80,.45);
  color:#cfeeff;
  font-weight:800;
}
button[disabled]{ opacity:.5; }

.ticker{
  overflow:hidden;
  white-space:nowrap;
  border-radius:10px;
  background:rgba(0,0,0,.42);
  backdrop-filter:blur(4px);
  z-index:9995;
}
.ticker-track{
  display:inline-flex;
  width:max-content;
  min-width:200%;
  animation:tickerMove 16s linear infinite;
}
.ticker-item{
  display:inline-block;
  padding-right:3rem;
}
@keyframes tickerMove{
  from{ transform:translateX(0); }
  to{ transform:translateX(-50%); }
}

#linkTicker{
  position:fixed;
  display:none;
  max-width:min(320px, calc(100vw - 24px));
  color:#8dffb8;
  border:1px solid rgba(120,255,180,.20);
  box-shadow:0 0 16px rgba(100,255,180,.16);
  font-size:12px;
  padding:6px 8px;
  border-radius:8px;
  background:rgba(0,0,0,.45);
  pointer-events:none;
  z-index:9997;
}

#bottomTicker{
  position:fixed;
  left:12px;
  right:12px;
  bottom:88px;
  color:#d8f4ff;
  border:1px solid rgba(140,230,255,.14);
  box-shadow:0 0 14px rgba(120,200,255,.10);
  font-size:12px;
  padding:6px 0;
}

#countdownBox{
  position:fixed;
  min-width:auto;
  text-align:center;
  padding:2px 5px;
  border-radius:6px;
  background:rgba(0,0,0,.72);
  color:#8dffb8;
  border:1px solid rgba(120,255,180,.25);
  box-shadow:0 0 10px rgba(100,255,180,.18);
  z-index:9996;
  display:none;
  font-size:11px;
  font-weight:700;
  line-height:1.1;
  pointer-events:none;
}

#calTarget{
  position:fixed;
  width:30px;
  height:30px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  display:none;
  z-index:20000;
  pointer-events:none;
  border:2px solid rgba(180,255,220,.95);
  box-shadow:0 0 14px rgba(140,255,220,.9), inset 0 0 10px rgba(140,255,220,.45);
  background:rgba(140,255,220,.12);
}
#calTarget.capture{
  border-color:#ffd86b;
  box-shadow:0 0 18px rgba(255,216,107,.95), inset 0 0 12px rgba(255,216,107,.45);
  background:rgba(255,216,107,.18);
}

#selfDestructOverlay{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50000;
  flex-direction:column;
}
#flower{
  font-size:46px;
  transform:scale(0.2);
  opacity:0;
  transition:transform 5s ease, opacity 5s ease;
}
#selfDestructText{
  margin-top:24px;
  text-align:center;
  color:#f5f5f5;
  max-width:min(88vw,560px);
  line-height:1.7;
  opacity:0;
  transition:opacity 5s ease;
  font-size:22px;
}

@media (max-width:700px){
  .link{ padding:10px 14px; font-size:14px; }
  .controls-left,.controls-right{ bottom:116px; }
  #selfDestructText{ font-size:18px; }
}
</style>
</head>

<body>

<div id="title">AURION</div>

<div id="videoWrap"><video id="cam" autoplay muted playsinline></video></div>
<div id="gazeDot"></div>
<div id="calTarget"></div>

<div id="linkTicker"></div>

<div id="bottomTicker" class="ticker">
  <div class="ticker-track">
    <span class="ticker-item" id="bottomTickerA">Die Räume ordnen sich im Sternentor.</span>
    <span class="ticker-item" id="bottomTickerB">Die Räume ordnen sich im Sternentor.</span>
  </div>
</div>

<div id="countdownBox">3</div>
<div id="hint">Seite bereit</div>

<div class="controls-left">
  <button id="btnCam">Cam</button>
  <button id="btnTrack" disabled>Track</button>
</div>

<div class="controls-right">
  <button id="btnCal" disabled>Kalibrieren</button>
</div>

<a class="link" href="bibliothek.html">Bibliothek</a>
<a class="link" href="resonanzraum.html">Resonanzraum</a>
<a class="link" href="sternenuebung.html">Chi-Austausch</a>
<a class="link" href="meditationsraum.html">Meditationsraum</a>
<a class="link" href="ki-raum.html">KI-Raum</a>
<a class="link" href="gaestebuch.html">Gästebuch</a>
<a class="link" href="about_aurion.html">About Aurion</a>

<div id="selfDestructOverlay">
  <div id="flower">🌸</div>
  <div id="selfDestructText">
    <div>Das ist das Ende.</div>
    <div>Nehmen Sie die Blume in Ihrem Herzen mit.</div>
    <div>Das ist ein Zeichen, dass Sie Aurion nicht vergessen.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

<script>
const links = [...document.querySelectorAll(".link")];
const dot = document.getElementById("gazeDot");
const calTarget = document.getElementById("calTarget");
const cam = document.getElementById("cam");
const videoWrap = document.getElementById("videoWrap");
const btnCam = document.getElementById("btnCam");
const btnTrack = document.getElementById("btnTrack");
const btnCal = document.getElementById("btnCal");
const hint = document.getElementById("hint");
const linkTicker = document.getElementById("linkTicker");
const bottomTickerA = document.getElementById("bottomTickerA");
const bottomTickerB = document.getElementById("bottomTickerB");
const countdownBox = document.getElementById("countdownBox");
const selfDestructOverlay = document.getElementById("selfDestructOverlay");
const flower = document.getElementById("flower");
const selfDestructText = document.getElementById("selfDestructText");

const ROOM_INFO = {
  "Bibliothek": "Texte, Handzettel und Spuren der Bibliothek der Anfänge.",
  "Resonanzraum": "Ein Raum für stille Schwingung und Austausch.",
  "Chi-Austausch": "Sternenübung und Chi-Austausch.",
  "Meditationsraum": "Ein stiller Raum zum Sammeln.",
  "KI-Raum": "Begegnungsraum zwischen Mensch und KI.",
  "Gästebuch": "Einträge und Spuren der Besucher.",
  "About Aurion": "Idee und Hintergrund von Aurion."
};

const STORAGE_KEY = "aurion_calibration_v3";
let currentUser = localStorage.getItem("aurion_user");

if(!currentUser){
  currentUser = prompt("Name eingeben:") || "user";
  currentUser = currentUser.trim() || "user";
  localStorage.setItem("aurion_user", currentUser);
}

const USER_STORAGE_KEY = STORAGE_KEY + "_" + currentUser;

const DOT_SMOOTH_FAR = 0.075;
const DOT_SMOOTH_NEAR = 0.020;
const DOT_SMOOTH_INSIDE = 0.010;
const MAGNET_RADIUS = 170;
const MAGNET_STRENGTH = 0.34;
const PAGE_LOCK_TIME = 10000;
const COUNTDOWN_TIME = 3000;

let calibration = loadCalibration();

let pageStartTime = performance.now();
let stream = null;
let cameraRunning = false;
let trackingRunning = false;
let faceMesh = null;
let camera = null;

let tx = innerWidth / 2;
let ty = innerHeight / 2;
let dx = tx;
let dy = ty;

let activeLink = null;
let nearestLink = null;
let nearestLinkDist = Infinity;
let lastTickerText = "Die Räume ordnen sich im Sternentor.";
let countdownStart = 0;
let countdownLink = null;
let selfDestructRunning = false;
let calibrationMode = false;

let blinkClosed = false;
let blinkTimes = [];
let gestureCooldown = { left: 0, up: 0 };

let latestIrisRaw = { x: null, y: null };

function loadCalibration(){
  try{
    const raw = localStorage.getItem(USER_STORAGE_KEY);
    if(!raw) return { xMin:null, xMax:null, yMin:null, yMax:null };
    const parsed = JSON.parse(raw);
    return {
      xMin: Number.isFinite(parsed.xMin) ? parsed.xMin : null,
      xMax: Number.isFinite(parsed.xMax) ? parsed.xMax : null,
      yMin: Number.isFinite(parsed.yMin) ? parsed.yMin : null,
      yMax: Number.isFinite(parsed.yMax) ? parsed.yMax : null
    };
  }catch(e){
    return { xMin:null, xMax:null, yMin:null, yMax:null };
  }
}

function saveCalibration(data){
  calibration = data;
  localStorage.setItem(USER_STORAGE_KEY, JSON.stringify(data));
}

function pulseDot(){
  dot.classList.remove("pulse");
  void dot.offsetWidth;
  dot.classList.add("pulse");
  setTimeout(() => dot.classList.remove("pulse"), 150);
}

function centerDot(){
  tx = innerWidth / 2;
  ty = innerHeight / 2;
  dx = tx;
  dy = ty;
  pulseDot();
  showHint("Dot zentriert");
}

function showHint(text){
  hint.textContent = text;
}

function setBottomTicker(text){
  bottomTickerA.textContent = text;
  bottomTickerB.textContent = text;
}

function triggerSelfDestruct(){
  if(selfDestructRunning) return;
  selfDestructRunning = true;
  pulseDot();

  try{
    if(cameraRunning) stopCamera();
  }catch(e){}

  countdownBox.style.display = "none";
  linkTicker.style.display = "none";

  selfDestructOverlay.style.display = "flex";
  flower.style.transform = "scale(0.2)";
  flower.style.opacity = "0";
  selfDestructText.style.opacity = "0";

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      flower.style.transform = "scale(9)";
      flower.style.opacity = "1";
    });
  });

  setTimeout(() => {
    selfDestructText.style.opacity = "1";
  }, 4200);
}

function setCalibrationUi(on){
  calibrationMode = on;
  links.forEach(link => {
    link.classList.toggle("calibrationMuted", on);
  });
  linkTicker.style.display = "none";
  countdownBox.style.display = "none";
  countdownLink = null;
}

function positionCountdownBox(link){
  if(!link){
    countdownBox.style.display = "none";
    return;
  }
  const r = link.getBoundingClientRect();
  let left = r.left + 6;
  let top  = r.bottom - 18;
  if(left < 6) left = 6;
  if(top < 6) top = 6;
  countdownBox.style.left = left + "px";
  countdownBox.style.top = top + "px";
}

function updateCountdown(link){
  const now = performance.now();

  if(now - pageStartTime < PAGE_LOCK_TIME || calibrationMode || selfDestructRunning){
    countdownBox.style.display = "none";
    countdownLink = null;
    return;
  }

  if(!link){
    countdownBox.style.display = "none";
    countdownLink = null;
    return;
  }

  if(countdownLink !== link){
    countdownLink = link;
    countdownStart = now;
    countdownBox.style.display = "block";
  }

  positionCountdownBox(link);

  const remain = Math.max(0, COUNTDOWN_TIME - (now - countdownStart));
  countdownBox.textContent = Math.ceil(remain / 1000);

  if(remain <= 0){
    openActiveLink();
    countdownBox.style.display = "none";
    countdownLink = null;
  }
}

function updateTickers(link){
  let text = "Die Räume ordnen sich im Sternentor.";

  if(link){
    const name = link.textContent.trim();
    text = ROOM_INFO[name] || "Raum";
  }

  if(text !== lastTickerText){
    lastTickerText = text;
    setBottomTicker(text);
  }

  if(calibrationMode || selfDestructRunning){
    linkTicker.style.display = "none";
    updateCountdown(null);
    return;
  }

  if(link){
    const r = link.getBoundingClientRect();
    const w = Math.min(320, innerWidth - 24);
    linkTicker.style.display = "block";
    linkTicker.style.width = w + "px";
    linkTicker.textContent = text;
    linkTicker.style.left = Math.max(12, Math.min(innerWidth - w - 12, r.left + r.width / 2 - w / 2)) + "px";
    linkTicker.style.top = Math.max(12, r.top - 36) + "px";
  }else{
    linkTicker.style.display = "none";
  }

  updateCountdown(link);
}

function placeLinks(){
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  const r  = Math.min(window.innerWidth, window.innerHeight) * 0.32;
  const step = (2 * Math.PI) / links.length;

  links.forEach((link, i) => {
    const a = i * step - Math.PI / 2;
    const rect = link.getBoundingClientRect();
    const w = rect.width || 120;
    const h = rect.height || 40;

    link.style.left = (cx + r * Math.cos(a) - w / 2) + "px";
    link.style.top  = (cy + r * Math.sin(a) - h / 2) + "px";
  });
}

function resolveLinkMagnet(){
  activeLink = null;
  nearestLink = null;
  nearestLinkDist = Infinity;

  let magnetTargetX = tx;
  let magnetTargetY = ty;

  links.forEach(link => {
    const r = link.getBoundingClientRect();
    link.classList.remove("active");

    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;

    const distToCenter = Math.hypot(dx - cx, dy - cy);
    if(distToCenter < nearestLinkDist){
      nearestLinkDist = distToCenter;
      nearestLink = link;
    }

    const inside = dx > r.left && dx < r.right && dy > r.top && dy < r.bottom;
    if(inside){
      activeLink = link;
    }
  });

  if(nearestLink && nearestLinkDist < MAGNET_RADIUS){
    const rect = nearestLink.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const alpha = 1 - (nearestLinkDist / MAGNET_RADIUS);
    magnetTargetX = tx + (cx - tx) * alpha * MAGNET_STRENGTH;
    magnetTargetY = ty + (cy - ty) * alpha * MAGNET_STRENGTH;
  }

  if(activeLink && !calibrationMode && !selfDestructRunning){
    activeLink.classList.add("active");
  }

  updateTickers(activeLink);
  return { x: magnetTargetX, y: magnetTargetY };
}

function dotLoop(){
  const target = resolveLinkMagnet();

  let smooth = DOT_SMOOTH_FAR;
  if(nearestLink && nearestLinkDist < MAGNET_RADIUS) smooth = DOT_SMOOTH_NEAR;
  if(activeLink) smooth = DOT_SMOOTH_INSIDE;

  dx += (target.x - dx) * smooth;
  dy += (target.y - dy) * smooth;

  dot.style.left = dx + "px";
  dot.style.top  = dy + "px";

  requestAnimationFrame(dotLoop);
}

function openActiveLink(){
  if(!activeLink || calibrationMode || selfDestructRunning) return;
  pulseDot();
  activeLink.classList.add("confirmFlash");
  setTimeout(() => activeLink.classList.remove("confirmFlash"), 260);
  activeLink.click();
}

function applyCalibrationToIris(rawX, rawY){
  let x = rawX;
  let y = rawY;

  if(calibration.xMin != null && calibration.xMax != null && calibration.xMax > calibration.xMin){
    x = (rawX - calibration.xMin) / (calibration.xMax - calibration.xMin);
  }
  if(calibration.yMin != null && calibration.yMax != null && calibration.yMax > calibration.yMin){
    y = (rawY - calibration.yMin) / (calibration.yMax - calibration.yMin);
  }

  x = Math.max(0, Math.min(1, x));
  y = Math.max(0, Math.min(1, y));

  tx = innerWidth * (1 - x);
  ty = innerHeight * y;
}

function irisCenterFromLandmarks(lm){
  const L = [lm?.[468], lm?.[469], lm?.[470], lm?.[471]].filter(Boolean);
  const R = [lm?.[473], lm?.[474], lm?.[475], lm?.[476]].filter(Boolean);

  const avgPts = (arr) => {
    let x = 0, y = 0;
    for(const p of arr){ x += p.x; y += p.y; }
    return { x:x/arr.length, y:y/arr.length };
  };

  if(L.length >= 2 && R.length >= 2){
    const lc = avgPts(L);
    const rc = avgPts(R);
    return { x:(lc.x + rc.x)/2, y:(lc.y + rc.y)/2 };
  }
  if(L.length >= 2) return avgPts(L);
  if(R.length >= 2) return avgPts(R);
  if(lm?.[468]) return { x: lm[468].x, y: lm[468].y };
  return null;
}

function dist(a,b){
  return Math.hypot(a.x-b.x, a.y-b.y);
}

function eyeAspectRatio(top1, top2, bottom1, bottom2, left, right){
  const v1 = dist(top1, bottom1);
  const v2 = dist(top2, bottom2);
  const h = dist(left, right) + 1e-6;
  return (v1 + v2) / (2*h);
}

function detectBlinkFromLandmarks(lm){
  const leftEAR = eyeAspectRatio(lm[159], lm[160], lm[145], lm[144], lm[33], lm[133]);
  const rightEAR = eyeAspectRatio(lm[386], lm[385], lm[374], lm[380], lm[362], lm[263]);
  const ear = (leftEAR + rightEAR) / 2;
  return 1 - Math.max(0, Math.min(1, ear / 0.35));
}

function processBlink(blink){
  const now = performance.now();

  if(blink > 0.50 && !blinkClosed){
    blinkClosed = true;
    blinkTimes.push(now);
    blinkTimes = blinkTimes.filter(t => now - t < 1000);
  }

  if(blink < 0.30){
    blinkClosed = false;
  }

  if(blinkTimes.length >= 2){
    const a = blinkTimes[blinkTimes.length - 2];
    const b = blinkTimes[blinkTimes.length - 1];
    const dt = b - a;

    if(dt >= 80 && dt <= 700){
      blinkTimes = [];
      if(!calibrationMode && !selfDestructRunning){
        showHint("Doppelblink erkannt");
        pulseDot();
        openActiveLink();
      }
    }
  }
}

function processLeftGesture(lm, iris){
  const nose = lm?.[1];
  const leftEye = lm?.[33];
  const rightEye = lm?.[263];
  if(!nose || !leftEye || !rightEye || !iris) return;

  const eyeMidX = (leftEye.x + rightEye.x) / 2;
  const faceWidth = Math.max(0.0001, Math.abs(rightEye.x - leftEye.x));
  const yaw = (nose.x - eyeMidX) / faceWidth;

  const now = performance.now();
  const GESTURE_COOLDOWN = 2200;

  const eyesLeft = (iris.x - eyeMidX) > 0.145;
  const headLeft = yaw < -0.085;

  if((eyesLeft || headLeft) && now > gestureCooldown.left){
    gestureCooldown.left = now + GESTURE_COOLDOWN;
    centerDot();
  }
}

function processHeadUpGesture(lm){
  const chin = lm?.[152];
  const forehead = lm?.[10];
  const nose = lm?.[1];
  if(!chin || !forehead || !nose) return;

  const faceHeight = Math.max(0.0001, Math.abs(chin.y - forehead.y));
  const noseVertical = (nose.y - forehead.y) / faceHeight;

  const now = performance.now();
  const GESTURE_COOLDOWN = 4000;

  const headUp = noseVertical < 0.36;

  if(headUp && now > gestureCooldown.up){
    gestureCooldown.up = now + GESTURE_COOLDOWN;
    showHint("Selbstzerstörung");
    triggerSelfDestruct();
  }
}

async function initFaceMesh(){
  if(faceMesh) return;

  faceMesh = new FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });

  faceMesh.setOptions({
    maxNumFaces: 1,
    refineLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  faceMesh.onResults((results) => {
    const faces = results?.multiFaceLandmarks || [];
    if(!faces.length) return;

    const lm = faces[0];
    const iris = irisCenterFromLandmarks(lm);
    if(!iris) return;

    latestIrisRaw.x = iris.x;
    latestIrisRaw.y = iris.y;

    applyCalibrationToIris(iris.x, iris.y);

    const blink = detectBlinkFromLandmarks(lm);
    processBlink(blink);

    if(!calibrationMode && !selfDestructRunning){
      processLeftGesture(lm, iris);
      processHeadUpGesture(lm);
    }
  });
}

async function startCamera(){
  stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: "user",
      width: { ideal: 640 },
      height: { ideal: 480 }
    },
    audio: false
  });

  cam.srcObject = stream;
  await cam.play();
  videoWrap.style.display = "block";
  dot.classList.add("on");
  cameraRunning = true;
  btnTrack.disabled = false;
  btnCal.disabled = false;
  pageStartTime = performance.now();
  showHint("Kamera an");
}

function stopCamera(){
  trackingRunning = false;

  if(camera && typeof camera.stop === "function"){
    camera.stop();
  }

  if(stream){
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  cam.pause();
  cam.srcObject = null;
  videoWrap.style.display = "none";
  dot.classList.remove("on");
  countdownBox.style.display = "none";
  countdownLink = null;
  cameraRunning = false;
  btnTrack.disabled = true;
  btnCal.disabled = true;
  btnTrack.textContent = "Track";
  showHint("Kamera aus");
}

async function startTracking(){
  await initFaceMesh();

  if(!camera){
    camera = new Camera(cam, {
      onFrame: async () => {
        if(trackingRunning && faceMesh){
          await faceMesh.send({ image: cam });
        }
      },
      width: 640,
      height: 480
    });
  }

  trackingRunning = true;
  await camera.start();
  btnTrack.textContent = "Tracking an";
  pageStartTime = performance.now();
  showHint("Tracking gestartet");
}

async function waitAndSample(label, durationMs = 700){
  showHint("Kalibrierung: " + label);
  await new Promise(r => setTimeout(r, durationMs));
  if(latestIrisRaw.x == null || latestIrisRaw.y == null){
    throw new Error("Noch keine Irisdaten");
  }
  return { x: latestIrisRaw.x, y: latestIrisRaw.y };
}

async function startCalibration(){
  if(!cameraRunning){
    showHint("Erst Cam starten");
    return;
  }

  if(!trackingRunning){
    showHint("Erst Tracking starten");
    return;
  }

  await initFaceMesh();

  setCalibrationUi(true);
  calTarget.style.display = "block";

  const samples = {};

  const points = [
    {x: innerWidth * 0.18, y: innerHeight * 0.50, label: "links", key: "left"},
    {x: innerWidth * 0.82, y: innerHeight * 0.50, label: "rechts", key: "right"},
    {x: innerWidth * 0.50, y: innerHeight * 0.20, label: "oben", key: "up"},
    {x: innerWidth * 0.50, y: innerHeight * 0.80, label: "unten", key: "down"},
    {x: innerWidth * 0.50, y: innerHeight * 0.50, label: "Mitte", key: "center"}
  ];

  for(const p of points){
    calTarget.style.left = p.x + "px";
    calTarget.style.top = p.y + "px";
    calTarget.classList.remove("capture");
    await new Promise(r => setTimeout(r, 250));
    calTarget.classList.add("capture");
    samples[p.key] = await waitAndSample(p.label, 800);
    calTarget.classList.remove("capture");
    await new Promise(r => setTimeout(r, 250));
  }

  saveCalibration({
    xMin: samples.right.x,
    xMax: samples.left.x,
    yMin: samples.up.y,
    yMax: samples.down.y
  });

  calTarget.style.display = "none";
  setCalibrationUi(false);
  showHint("Kalibrierung gespeichert für " + currentUser);
}

btnCam.addEventListener("click", async () => {
  try{
    if(cameraRunning){
      stopCamera();
    }else{
      await startCamera();
    }
  }catch(e){
    console.error(e);
    showHint("Kamera Fehler: " + (e.message || e));
  }
});

btnTrack.addEventListener("click", async () => {
  try{
    if(!cameraRunning){
      showHint("Erst Cam starten");
      return;
    }

    if(trackingRunning){
      trackingRunning = false;
      if(camera && typeof camera.stop === "function"){
        camera.stop();
      }
      btnTrack.textContent = "Track";
      showHint("Tracking gestoppt");
      return;
    }

    await startTracking();
  }catch(e){
    console.error(e);
    showHint("Tracking Fehler: " + (e.message || e));
  }
});

btnCal.addEventListener("click", async () => {
  try{
    await startCalibration();
  }catch(e){
    console.error(e);
    calTarget.style.display = "none";
    setCalibrationUi(false);
    showHint("Kalibrierung Fehler: " + (e.message || e));
  }
});

addEventListener("load", () => {
  requestAnimationFrame(() => {
    placeLinks();
    setTimeout(placeLinks, 80);
    setTimeout(placeLinks, 220);
  });
  dotLoop();
  updateTickers(null);
  if(calibration.xMin != null){
    showHint("Kalibrierung geladen für " + currentUser);
  }else{
    showHint("Seite bereit – Nutzer: " + currentUser);
  }
});

addEventListener("resize", () => {
  requestAnimationFrame(() => {
    placeLinks();
    updateTickers(activeLink);
    if(countdownLink) positionCountdownBox(countdownLink);
  });
});
</script>
