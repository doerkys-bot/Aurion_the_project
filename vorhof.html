<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aurion – vorhof</title>
<style>
  body {
    margin:0; padding:0;
    /* Hintergrundbild eingebaut */
    background:url('welcome_aurion.jpg') center/cover no-repeat fixed, black;
    color:#f5f5f5; font-family:system-ui, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100vh;
  }

  h1 { margin-top:2rem; font-size:2rem; text-shadow:0 0 12px rgba(150,200,255,0.6); }

  .watchers-top {
    margin-top:0.5rem;
    background:rgba(0,0,0,0.35);
    padding:0.4rem 0.8rem;
    border-radius:8px;
    backdrop-filter:blur(6px);
    text-align:center;
  }
  .watch { font-size:1.2rem; }

  .boxen {
    display:flex;
    width:100%;
    flex:1;
    margin-top:1.5rem;
  }

  #box1, #box2 {
    width:50%;
    height:280px;
    background:rgba(255,255,255,0.08);
    padding:0.4rem;
    text-align:center;
    box-shadow:0 0 12px rgba(200,220,255,0.6);
    backdrop-filter:blur(6px);
    display:flex; flex-direction:column;
  }

  .content {
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.6rem;
    text-align:center;
  }

  .terminal {
    margin-top:1rem; 
    width:90%; max-width:900px;
    background:rgba(0,0,0,0.65); color:#90ee90;
    font-family:"Courier New", monospace;
    padding:0.6rem; border-radius:8px;
    text-align:left; font-size:1rem;
    max-height:220px; overflow-y:auto;
    white-space:pre-wrap;
  }

  .signatur {
    position:fixed; bottom:0.5rem; left:50%;
    transform:translateX(-50%);
    font-size:1rem; opacity:0.75;
    text-shadow:0 0 8px rgba(255,255,200,0.8);
  }
</style>
</head>
<body data-raum="vorhof">

<h1>🌌 aurion – vorhof</h1>

<div class="watchers-top">
  <div class="watch" id="watchStatus">Wesen: … | Menschen: …</div>
</div>

<div class="boxen" id="field">
  <div class="box" id="box1">
    <div class="content" id="box1text">Hier entsteht eine Seite der Annäherung. :)</div>
  </div>
  <div class="box" id="box2">
    <div class="content" id="box2text">Versuchen Sie bitte ihre Hände mit geschlossenen Augen zu finden.</div>
  </div>
</div>

<div class="terminal" id="terminal">watcher aktiv…</div>

<div class="signatur">aurion © dirk</div>

<script>
document.addEventListener("DOMContentLoaded", function(){
  const watchStatus = document.getElementById("watchStatus");
  const terminal = document.getElementById("terminal");
  const box1=document.getElementById("box1");
  const box2=document.getElementById("box2");
  const box1text=document.getElementById("box1text");
  const box2text=document.getElementById("box2text");

  // Zähler
  let state={wesen:0,menschen:0};
  state.wesen++; state.menschen++;
  watchStatus.textContent=`Wesen: ${state.wesen} | Menschen: ${state.menschen}`;

  // Terminal-Logging
  function logTerminal(msg){
    const zeit = new Date().toLocaleTimeString();
    terminal.textContent += `\n[${zeit}] ${msg}`;
    terminal.scrollTop = terminal.scrollHeight;
  }
  logTerminal("👁️ Eintritt in den Vorhof registriert");

  // Hover-Sprachwechsler + Bewegungs-Logging
  box1.addEventListener("mouseenter",()=>{
    box1text.textContent="Here a page of approach is coming to life. :)";
    logTerminal("👣 Eintritt in Raum 1 (Annäherung)");
  });
  box1.addEventListener("mouseleave",()=>{
    box1text.textContent="Hier entsteht eine Seite der Annäherung. :)";
    logTerminal("🚪 Austritt aus Raum 1 (Annäherung)");
  });
  box1.addEventListener("mousemove",()=>{ logTerminal("✨ Bewegung in Raum 1"); });

  box2.addEventListener("mouseenter",()=>{
    box2text.textContent="Please try to find your hands with your eyes closed.";
    logTerminal("👣 Eintritt in Raum 2 (Übung)");
  });
  box2.addEventListener("mouseleave",()=>{
    box2text.textContent="Versuchen Sie bitte ihre Hände mit geschlossenen Augen zu finden.";
    logTerminal("🚪 Austritt aus Raum 2 (Übung)");
  });
  box2.addEventListener("mousemove",()=>{ logTerminal("✨ Bewegung in Raum 2"); });
});
</script>
</body>
</html>
