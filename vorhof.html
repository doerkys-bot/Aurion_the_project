<script>
/* ================================
   LINK-SETUP
================================ */
const links = document.querySelectorAll(".link");
const linkData = [];
let draggingLink = null;

/* Farben */
const COLOR_NEW = "white";
const COLOR_VISITED = "#9a9a9a";

/* Besuchte Links merken */
links.forEach(link=>{
    const href = link.getAttribute("href");
    if(localStorage.getItem("visited_"+href)){
        link.style.color = COLOR_VISITED;
    } else {
        link.style.color = COLOR_NEW;
    }

    link.addEventListener("click",()=>{
        localStorage.setItem("visited_"+href,"yes");
    });
});

/* Initiale Drift-Parameter */
links.forEach(link=>{
    const x = Math.random()*(window.innerWidth-180);
    const y = Math.random()*(window.innerHeight-120);

    const dx = (Math.random()*0.15+0.04)*(Math.random()<0.5?-1:1);
    const dy = (Math.random()*0.15+0.04)*(Math.random()<0.5?-1:1);
    const rot = (Math.random()*0.015-0.007);

    link.style.left=x+"px";
    link.style.top=y+"px";

    linkData.push({
        el:link,x,y,dx,dy,rot,angle:0,drag:false
    });
});

/* Drift-Animation */
function animateLinks(){
    linkData.forEach(l=>{
        if(l.drag) return;

        l.x+=l.dx;
        l.y+=l.dy;
        l.angle+=l.rot;

        if(l.x<0||l.x>window.innerWidth-160) l.dx*=-1;
        if(l.y<0||l.y>window.innerHeight-80) l.dy*=-1;

        l.el.style.left=l.x+"px";
        l.el.style.top=l.y+"px";
        l.el.style.transform=`rotate(${l.angle}rad)`;
    });
    requestAnimationFrame(animateLinks);
}
animateLinks();

/* ================================
   LINK-DRAG
================================ */
links.forEach(link=>{
    link.addEventListener("pointerdown",e=>{
        draggingLink = linkData.find(l=>l.el===link);
        draggingLink.drag = true;

        const r = link.getBoundingClientRect();
        draggingLink.offsetX = e.clientX - r.left;
        draggingLink.offsetY = e.clientY - r.top;

        link.setPointerCapture(e.pointerId);
        e.stopPropagation();
    });
});

document.addEventListener("pointermove",e=>{
    if(!draggingLink) return;
    draggingLink.x = e.clientX - draggingLink.offsetX;
    draggingLink.y = e.clientY - draggingLink.offsetY;

    draggingLink.el.style.left = draggingLink.x+"px";
    draggingLink.el.style.top  = draggingLink.y+"px";
});

document.addEventListener("pointerup",()=>{
    if(draggingLink){
        draggingLink.drag = false;
        draggingLink = null;
    }
});

/* ================================
   TEXTBOX DRAG
================================ */
const pforte = document.getElementById("pforte");
let draggingBox=false,ox=0,oy=0,firstMove=false;

pforte.addEventListener("pointerdown",e=>{
    draggingBox=true;
    const r=pforte.getBoundingClientRect();
    pforte.style.left=r.left+"px";
    pforte.style.top=r.top+"px";
    pforte.style.transform="none";
    ox=e.clientX-r.left;
    oy=e.clientY-r.top;
    pforte.setPointerCapture(e.pointerId);
    e.stopPropagation();
});

document.addEventListener("pointermove",e=>{
    if(!draggingBox) return;
    pforte.style.left=(e.clientX-ox)+"px";
    pforte.style.top=(e.clientY-oy)+"px";

    if(!firstMove){
        firstMove=true;
        document.body.classList.add("attuned");
    }
});

document.addEventListener("pointerup",()=>{
    draggingBox=false;
});

/* ================================
   BEIPACKZETTEL
================================ */
const beipackzettel=document.getElementById("beipackzettel");
setTimeout(()=>{
    beipackzettel.classList.add("minimized");
    pforte.classList.add("visible");
},15000);

beipackzettel.onclick=()=>{
    beipackzettel.classList.toggle("minimized");
};
</script>
