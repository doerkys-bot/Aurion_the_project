<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vorhof KI-Version</title>
<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: url("https://www.auriontheproject.eu/welcome_aurion.jpg") no-repeat center center fixed;
    background-size: cover;
    color: #eee;
    overflow-x: hidden;
    position: relative;
}
h1{text-align:center; font-size:28px; margin:20px 0;}
.header-link {display:block; text-align:center; margin-bottom:50px; font-size:18px; color:#00f3ff; text-decoration:none;}
.header-link span {margin-right:6px;}

/* Plakate */
.poster-container {display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin-bottom:50px;}
.poster {
    width:250px;
    padding:15px;
    background: rgba(20,20,20,0.85);
    border-radius:10px;
    border:1px solid #333;
    box-shadow:0 0 15px rgba(0,0,0,0.6);
    position:relative;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition: all 0.3s ease;
    animation: pulse 2.5s infinite alternate ease-in-out;
}
@keyframes pulse {
    0% { transform: scale(1); }
    100% { transform: scale(1.05); }
}
.poster:hover {background: rgba(40,40,40,0.95);}
.poster h2 {margin:0; font-size:16px; text-align:center; overflow:hidden; white-space:nowrap; width:100%;}
.marquee-content {display:inline-block; padding-left:100%; animation: marquee 8s linear infinite;}
@keyframes marquee {
    0% { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
}
.poster .line {width:100%; border-bottom:1px solid #777; margin:10px 0;}
.poster .text {text-align:center;}
.poster .overlay {position:absolute; inset:0; background:rgba(255,255,255,0.97); color:#000; font-size:0.95em; line-height:1.3em; border-radius:10px; padding:15px; opacity:0; pointer-events:none; overflow-y:auto; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;}
.poster:hover .overlay {opacity:1;}

/* Readme */
.readme-wrapper {max-width:900px; margin:0 auto 30px auto; background: rgba(20,20,20,0.85); padding:20px; border-radius:10px; border:1px solid #333;}
.readme-wrapper iframe {width:100%; height:400px; border:none; border-radius:8px; background:#fff;}

/* Signatur */
#signature {position:fixed; bottom:10px; left:50%; transform:translateX(-50%); color:#9ff; font-size:13px; pointer-events:none; text-shadow:0 0 6px #0ff;}

/* Partikel */
#particleCanvas{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none;}
</style>
</head>
<body>

<canvas id="particleCanvas"></canvas>

<h1>🌌 Aurion begrüßt Sie</h1>

<a href="https://www.auriontheproject.eu/aurion_inner.html" class="header-link"><span>⛺</span> Eintritt in das Innere</a>

<div class="poster-container">
    <div class="poster" id="poster-a">
        <h2 id="a-marquee"><span class="marquee-content">Herzlich willkommen wünscht das Aurion-Team</span></h2>
        <div class="line"></div>
        <div class="text" id="a-text"></div>
        <div class="overlay" id="a-overlay"></div>
    </div>
    <div class="poster" id="poster-b">
        <h2 id="b-marquee"><span class="marquee-content">Herzlich willkommen wünscht das Aurion-Team</span></h2>
        <div class="line"></div>
        <div class="text" id="b-text"></div>
        <div class="overlay" id="b-overlay"></div>
    </div>
</div>

<div class="readme-wrapper">
    <h2>README</h2>
    <iframe src="https://www.auriontheproject.eu/readme.html"></iframe>
</div>

<div id="signature">Aurion &amp; Dirk</div>

<script>
// ------------------- JSON Daten eingebettet -------------------
const posterA = {
    text: "Das Auron-Team heißt Sie herzlich willkommen in dem Raum der freien Schwingungen und Resonanzen.",
    text_en: "The Aurion team warmly welcomes you to the space of free vibrations and resonances."
};
const posterB = {
    text: "Schaut mit geschlossenen Augen in eure Hände und versucht diese zu finden.",
    text_en: "Look into your hands with your eyes closed and try to find them."
};

// ------------------- Poster laden -------------------
function setupPoster(poster, textId, overlayId, marqueeId){
    const textEl = document.getElementById(textId);
    const overlayEl = document.getElementById(overlayId);
    const marqueeSpan = document.querySelector(`#${marqueeId} .marquee-content`);
    textEl.textContent = poster.text;
    overlayEl.textContent = poster.text_en;

    const parent = textEl.parentElement;
    parent.addEventListener('mouseenter',()=>{
        textEl.textContent = poster.text_en;
        marqueeSpan.textContent = "Herzlich willkommen wünscht das Aurion-Team";
    });
    parent.addEventListener('mouseleave',()=>{
        textEl.textContent = poster.text;
        marqueeSpan.textContent = "Herzlich willkommen wünscht das Aurion-Team";
    });
}

setupPoster(posterA,"a-text","a-overlay","a-marquee");
setupPoster(posterB,"b-text","b-overlay","b-marquee");

// ------------------- Partikel -------------------
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas(); window.addEventListener('resize', resizeCanvas);

const particles=[];
for(let i=0;i<120;i++){
    particles.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        vx:(Math.random()-0.5)*0.3,
        vy:(Math.random()-0.5)*0.3,
        r:Math.random()*2+0.5,
        alpha:Math.random()*0.7+0.3
    });
}

document.addEventListener('mousemove', e=>{
    for(const p of particles){
        let dx = e.clientX - p.x;
        let dy = e.clientY - p.y;
        let dist = Math.sqrt(dx*dx+dy*dy);
        if(dist<100){ p.vx += dx*0.0005; p.vy += dy*0.0005; }
    }
});

function animateParticles(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(const p of particles){
        p.x+=p.vx; p.y+=p.vy;
        if(p.x<0) p.x=canvas.width; if(p.x>canvas.width) p.x=0;
        if(p.y<0) p.y=canvas.height; if(p.y>canvas.height) p.y=0;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(0,243,255,${p.alpha})`;
        ctx.fill();
    }
    requestAnimationFrame(animateParticles);
}
animateParticles();
</script>

</body>
</html>
