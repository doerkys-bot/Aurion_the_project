<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
html,body{
  margin:0;height:100%;overflow:hidden;
  background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpeg") center/cover no-repeat fixed;
  font-family:system-ui,Segoe UI,Roboto,sans-serif;
  color:white;
}

/* Links */
.link{
  position:absolute;
  padding:12px 18px;
  border-radius:16px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(6px);
  color:#cfeeff;
  text-decoration:none;
  font-weight:700;
  box-shadow:0 0 22px rgba(80,160,255,.18);
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  z-index:6;
}
.link.glow{
  transform:scale(1.10);
  background:rgba(140,255,200,.15);
  box-shadow:0 0 45px rgba(120,255,200,.90);
}
.link.confirmFlash{
  box-shadow:0 0 65px rgba(220,255,240,.98);
  background:rgba(170,255,220,.20);
}

/* Dot */
#gazeDot{
  position:fixed;
  width:8px;height:8px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:#ff3b3b;
  box-shadow:0 0 6px rgba(255,60,60,.85);
  pointer-events:none;
  z-index:9998;
  opacity:0;
  transition:transform .10s ease, box-shadow .10s ease, opacity .15s ease;
}
#gazeDot.on{opacity:1;}
#gazeDot.blink{
  transform:translate(-50%,-50%) scale(1.7);
}
#gazeDot.double{
  transform:translate(-50%,-50%) scale(2.1);
}

/* Camera */
#videoWrap{
  position:fixed;
  top:10px;
  left:10px;
  width:220px;
  height:165px;
  border-radius:12px;
  overflow:hidden;
  background:rgba(0,0,0,.35);
  display:none;
  z-index:9996;
  border:1px solid rgba(140,230,255,.22);
}
#cam{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

/* Buttons */
.controls-left, .controls-right{
  position:fixed;
  bottom:38px;
  display:flex;
  flex-direction:column;
  gap:8px;
  z-index:9999;
}
.controls-left{ left:12px; }
.controls-right{ right:12px; }

button{
  padding:8px 12px;
  border-radius:10px;
  border:1px solid rgba(140,230,255,.28);
  background:rgba(20,40,80,.45);
  color:#cfeeff;
  font-weight:800;
}
</style>
</head>

<body>

<div id="videoWrap"><video id="cam" autoplay muted playsinline></video></div>
<div id="gazeDot"></div>

<div class="controls-left">
  <button id="btnCam">Kamera</button>
  <button id="btnTrack">Tracking</button>
</div>

<div class="controls-right">
  <button id="btnCal">Kalibrieren</button>
  <button id="btnBlink">Blink: 2×</button>
</div>

<!-- Links -->
<a class="link" href="bibliothek.html">Bibliothek</a>
<a class="link" href="resonanzraum.html">Resonanzraum</a>
<a class="link" href="sternenuebung.html">Chi-Austausch</a>
<a class="link" href="meditationsraum.html">Meditationsraum</a>
<a class="link" href="ki-raum.html">KI-Raum</a>
<a class="link" href="gaestebuch.html">Gästebuch</a>
<a class="link" href="about_aurion.html">About Aurion</a>

<script type="module">
import AurionEyeTrackingEngine from "./EyeTrackingEngine.js";

const cam = document.getElementById("cam");
const videoWrap = document.getElementById("videoWrap");
const dot = document.getElementById("gazeDot");

const btnCam = document.getElementById("btnCam");
const btnTrack = document.getElementById("btnTrack");
const btnCal = document.getElementById("btnCal");
const btnBlink = document.getElementById("btnBlink");

const links=[...document.querySelectorAll(".link")];

let tx = innerWidth/2;
let ty = innerHeight/2;
let dx = tx;
let dy = ty;

let hoverLink=null;
let blinkMode=2;

/* Links im Kreis */
function placeLinks(){
  const cx=innerWidth/2, cy=innerHeight/2;
  const r=Math.min(innerWidth,innerHeight)*0.32;
  const step=(2*Math.PI)/links.length;

  links.forEach((l,i)=>{
    const a=i*step-Math.PI/2;
    l.style.left=(cx+r*Math.cos(a)-l.offsetWidth/2)+"px";
    l.style.top =(cy+r*Math.sin(a)-l.offsetHeight/2)+"px";
  });
}
addEventListener("load",()=>setTimeout(placeLinks,140));
addEventListener("resize",()=>setTimeout(placeLinks,140));

function center(el){
  const r=el.getBoundingClientRect();
  return {x:r.left+r.width/2,y:r.top+r.height/2};
}

function dotLoop(){
  dx += (tx-dx)*0.20;
  dy += (ty-dy)*0.20;

  dot.style.left=dx+"px";
  dot.style.top =dy+"px";

  hoverLink=document.elementFromPoint(dx,dy)?.closest?.(".link") || null;
  links.forEach(l=>l.classList.toggle("glow", l===hoverLink));

  requestAnimationFrame(dotLoop);
}
dotLoop();

/* Engine */
const engine = new AurionEyeTrackingEngine({
  video: cam,
  dotSpeed: 0.28,

  onGaze: gaze=>{
    tx=gaze.x;
    ty=gaze.y;
  },

  onBlink: ()=>{
    if(blinkMode!==1) return;
    clickLink();
  },

  onDoubleBlink: ()=>{
    if(blinkMode!==2) return;
    clickLink();
  },

  onDotEnabledChange: enabled=>{
    dot.classList.toggle("on", enabled);
  }
});

function clickLink(){
  const link = hoverLink;
  if(!link) return;
  link.classList.add("confirmFlash");
  setTimeout(()=>link.classList.remove("confirmFlash"), 260);
  link.click();
}

/* Buttons */
btnCam.onclick=async()=>{
  if(engine.isCameraRunning()){
    engine.stopTracking();
    engine.stopCamera();
    videoWrap.style.display="none";
    return;
  }
  await engine.startCamera();
  videoWrap.style.display="block";
};

btnTrack.onclick=async()=>{
  if(engine.isTrackingRunning()) return;
  await engine.startTracking();
};

btnBlink.onclick=()=>{
  blinkMode = blinkMode===1 ? 2 : 1;
  btnBlink.textContent = "Blink: "+blinkMode+"×";
};

/* Vorhof Grundkalibrierung 8 Sekunden */
btnCal.onclick=async()=>{
  const CAL_KEY="aurion_cal_"+navigator.userAgent;

  const end=Date.now()+8000;
  let minX=1,maxX=0,minY=1,maxY=0;

  const vision=await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest");
  const fs=await vision.FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
  );
  const fl=await vision.FaceLandmarker.createFromOptions(fs,{
    baseOptions:{
      modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"
    },
    runningMode:"VIDEO",
    numFaces:1
  });

  async function loop(){
    while(Date.now()<end){
      const res=fl.detectForVideo(cam, performance.now());
      const lm=res?.faceLandmarks?.[0];
      if(lm?.[468]){
        minX=Math.min(minX,lm[468].x);
        maxX=Math.max(maxX,lm[468].x);
        minY=Math.min(minY,lm[468].y);
        maxY=Math.max(maxY,lm[468].y);
      }
      await new Promise(r=>requestAnimationFrame(r));
    }

    localStorage.setItem(CAL_KEY, JSON.stringify({minX,maxX,minY,maxY}));
    localStorage.setItem("aurion_calibration", JSON.stringify({minX,maxX,minY,maxY}));
    alert("Kalibrierung gespeichert");
  }

  loop();
};

engine.setDotEnabled(true);

</script>
</body>
</html>
