<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vorhof – Erste Pforte</title>

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  background:radial-gradient(circle at center,#050816,#02030a);
  font-family:Segoe UI,sans-serif;
  color:#cfeef6;
  overflow:hidden;
}

/* TORBEREICH */
.field-visual{
  position:absolute;
  top:25%;
  left:50%;
  transform:translateX(-50%);
  width:70%;
  height:30%;
  border-radius:22px;
  background:radial-gradient(circle at center,
    rgba(140,230,255,0.12),
    rgba(80,150,220,0.03));
  border:1px solid rgba(140,230,255,0.12);
  box-shadow:0 0 60px rgba(120,200,255,0.25);
}

/* TEXT */
.link{
  position:absolute;
  padding:10px 14px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(140,230,255,0.2);
  border-radius:8px;
  cursor:pointer;
  user-select:none;
  color:#8fe4ff;
  backdrop-filter:blur(4px);
}

/* HINWEIS */
.hint{
  position:fixed;
  bottom:20px;
  width:100%;
  text-align:center;
  font-size:0.85rem;
  opacity:.6;
}
</style>
</head>

<body>

<div class="field-visual" id="tor"></div>

<div class="link">Du bist bereits hier</div>
<div class="link">Der Vorhof erkennt dich</div>
<div class="link">Schenke Aufmerksamkeit</div>

<div class="hint">
  Aufmerksamkeit genügt. Kein Tun. Kein Drücken.
</div>

<script>
/* ===== STATUS ===== */
const TARGET_URL = "resonanzraum.html";
let attentionTime = 0;
let passed = false;

/* ===== TOR ===== */
const tor = document.getElementById("tor");
const torRect = tor.getBoundingClientRect();
const links = document.querySelectorAll(".link");

const data = [];

/* ===== POSITIONIERUNG ===== */
links.forEach((link,i)=>{
  const pad = 24;
  const x = torRect.left + pad +
    Math.random() * (torRect.width - link.offsetWidth - pad*2);
  const y = torRect.top + pad +
    Math.random() * (torRect.height - link.offsetHeight - pad*2);

  link.style.left = x+"px";
  link.style.top  = y+"px";

  data.push({
    el:link,
    vx:(Math.random()-0.5)*0.25,
    vy:(Math.random()-0.5)*0.25,
    drag:false
  });

  /* ===== DRAG ===== */
  let ox=0,oy=0;
  link.addEventListener("pointerdown",e=>{
    ox = e.clientX - link.offsetLeft;
    oy = e.clientY - link.offsetTop;
    data[i].drag=true;
    link.setPointerCapture(e.pointerId);
  });

  link.addEventListener("pointermove",e=>{
    if(!data[i].drag) return;
    let nx = e.clientX - ox;
    let ny = e.clientY - oy;

    nx = Math.max(torRect.left,
         Math.min(nx, torRect.right-link.offsetWidth));
    ny = Math.max(torRect.top,
         Math.min(ny, torRect.bottom-link.offsetHeight));

    link.style.left = nx+"px";
    link.style.top  = ny+"px";
  });

  link.addEventListener("pointerup",()=>{
    data[i].drag=false;
  });

  /* ===== AUFMERKSAMKEIT ===== */
  let hoverTimer=null;

  link.addEventListener("mouseenter",()=>{
    hoverTimer = setInterval(()=>{
      attentionTime += 100;
      if(attentionTime >= 5000) passGate();
    },100);
  });

  link.addEventListener("mouseleave",()=>{
    clearInterval(hoverTimer);
    hoverTimer=null;
  });

  /* ===== FALLBACK KLICK ===== */
  let taps = [];
  link.addEventListener("click",()=>{
    const now = Date.now();
    taps.push(now);
    taps = taps.filter(t=> now - t < 1500);

    // 2x – 1x – 2x
    if(taps.length === 5){
      passGate();
    }
  });
});

/* ===== DRIFT ===== */
function drift(){
  data.forEach(d=>{
    if(d.drag) return;
    let x = d.el.offsetLeft + d.vx;
    let y = d.el.offsetTop  + d.vy;

    if(x <= torRect.left || x >= torRect.right-d.el.offsetWidth)
      d.vx *= -1;
    if(y <= torRect.top || y >= torRect.bottom-d.el.offsetHeight)
      d.vy *= -1;

    d.el.style.left = (x+d.vx)+"px";
    d.el.style.top  = (y+d.vy)+"px";
  });
  requestAnimationFrame(drift);
}
drift();

/* ===== DURCHSCHREITEN ===== */
function passGate(){
  if(passed) return;
  passed = true;

  localStorage.setItem("pforte1","true");

  document.body.style.opacity = "0.2";

  setTimeout(()=>{
    window.location.href = TARGET_URL;
  },1200);
}
</script>

</body>
</html>
