<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
html, body {
    margin:0; padding:0;
    width:100%; height:100%;
    overflow:hidden;
    background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpeg")
        center/cover no-repeat fixed;
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
    color:white;
}

/* 🌬 Raum-Atmung */
body::before{
    content:"";
    position:fixed; inset:0;
    background:rgba(120,180,255,0.08);
    animation:spaceBreath 16s ease-in-out infinite;
    pointer-events:none;
    z-index:0;
}
@keyframes spaceBreath{
    0%{opacity:.05}
    50%{opacity:.14}
    100%{opacity:.05}
}

/* 🙏 NAMASTÉ */
#holoNamaste{
    position:fixed;
    top:0;
    left:50%;
    transform:translateX(-50%);
    font-size:42px;
    font-weight:800;
    letter-spacing:4px;
    color:rgba(180,220,255,.9);
    text-shadow:
        0 0 14px rgba(120,180,255,.7),
        0 0 28px rgba(120,180,255,.45),
        0 0 48px rgba(120,180,255,.25);
    animation:holoPulse 5s ease-in-out infinite;
    z-index:4;
    pointer-events:none;
}
@keyframes holoPulse{
    0%,100%{opacity:.75}
    50%{opacity:1}
}

/* 🔗 Links */
.link{
    position:absolute;
    padding:12px 18px;
    border-radius:16px;
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(6px);
    text-decoration:none;
    font-weight:700;
    cursor:grab;
    box-shadow:0 0 22px rgba(80,160,255,.18);
    transition:box-shadow .4s ease, background .4s ease;
    z-index:5;
    color:white;
}
.link:visited{
    color:gray;
}

/* 📦 Beipackzettel */
#beipackzettel{
    position:fixed;
    top:53px;
    left:38px;
    width:320px;
    border-radius:14px;
    box-shadow:0 0 30px rgba(120,180,255,.35);
    transition:opacity 2s ease, transform 2s ease, width .4s ease;
    cursor:zoom-in;
    z-index:7;
}
#beipackzettel.minimized{
    opacity:.15;
    width:160px;
    transform:scale(.9);
}

/* 🧭 Textbox */
#pforte{
    position:fixed;
    left:50%;
    top:55%;
    transform:translate(-50%,-50%);
    width:380px;
    padding:22px 26px;
    border-radius:18px;
    background:rgba(10,20,40,.78);
    backdrop-filter:blur(8px);
    border:1px solid rgba(120,180,255,.4);
    box-shadow:0 0 32px rgba(120,180,255,.45);
    font-size:18px;
    line-height:1.55;
    cursor:grab;
    opacity:0;
    z-index:6;
}
#pforte.visible{opacity:1}
</style>
</head>

<body>

<div id="holoNamaste">NAMASTÉ</div>

<a class="link" href="bibliothek.html">Bibliothek</a>
<a class="link" href="resonanzraum.html">Resonanzraum</a>
<a class="link" href="sternenuebung.html">Chi-Sternenübung</a>
<a class="link" href="meditationsraum.html">Meditationsraum</a>
<a class="link" href="ki-raum.html">KI-Raum</a>
<a class="link" href="gaestebuch.html">Gästebuch</a>
<a class="link" href="about_aurion.html">About Aurion</a>

<img id="beipackzettel"
     src="https://doerkys-bot.github.io/Aurion_the_project/b_1_p.jpeg"
     alt="Beipackzettel">

<div id="pforte">
<strong>
Ein Weg in die 2. Aufmerksamkeit.<br>
Beschreiten Sie die erste Pforte der Zauberer.
</strong><br><br>
Versuchen Sie mit geschlossenen Augen sich selber in die Hände zu schauen.<br>
Finden Sie im Geist ihre Hände.
</div>

<script>
const beipack = document.getElementById("beipackzettel");
const pforte = document.getElementById("pforte");
const links = document.querySelectorAll(".link");

/* 🔗 Startposition & Drift */
const driftData = [];
links.forEach(link=>{
    const x = Math.random()*(innerWidth-180);
    const y = Math.random()*(innerHeight-80);
    link.style.left = x+"px";
    link.style.top  = y+"px";

    driftData.push({
        vx:(Math.random()-.5)*0.25,
        vy:(Math.random()-.5)*0.25
    });

    let drag=false, ox=0, oy=0;
    link.addEventListener("pointerdown",e=>{
        drag=true;
        ox=e.clientX-link.offsetLeft;
        oy=e.clientY-link.offsetTop;
        link.setPointerCapture(e.pointerId);
    });
    link.addEventListener("pointermove",e=>{
        if(drag){
            link.style.left=(e.clientX-ox)+"px";
            link.style.top =(e.clientY-oy)+"px";
        }
    });
    link.addEventListener("pointerup",()=>drag=false);
});

function drift(){
    links.forEach((l,i)=>{
        const d=driftData[i];
        let x=l.offsetLeft+d.vx;
        let y=l.offsetTop +d.vy;
        if(x<0||x>innerWidth-l.offsetWidth) d.vx*=-1;
        if(y<0||y>innerHeight-l.offsetHeight) d.vy*=-1;
        l.style.left=Math.max(0,Math.min(x,innerWidth-l.offsetWidth))+"px";
        l.style.top =Math.max(0,Math.min(y,innerHeight-l.offsetHeight))+"px";
    });
    requestAnimationFrame(drift);
}
drift();

/* 📦 Beipackzettel Timing */
setTimeout(()=>{
    beipack.classList.add("minimized");
    setTimeout(()=>pforte.classList.add("visible"),1000);
},10000);

/* 📖 Beipackzettel → neues Tab */
beipack.addEventListener("click",()=>{
    window.open(beipack.src,"_blank");
});

/* 🧭 Textbox Drag */
let drag=false, dx=0, dy=0;
pforte.addEventListener("pointerdown",e=>{
    drag=true;
    dx=e.clientX-pforte.offsetLeft;
    dy=e.clientY-pforte.offsetTop;
    pforte.setPointerCapture(e.pointerId);
});
document.addEventListener("pointermove",e=>{
    if(drag){
        pforte.style.left=(e.clientX-dx)+"px";
        pforte.style.top =(e.clientY-dy)+"px";
    }
});
document.addEventListener("pointerup",()=>drag=false);
</script>

</body>
</html>
