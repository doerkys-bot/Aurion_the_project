<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aurion Portal</title>

<style>
    body {
        margin: 0;
        background: #000;
        font-family: Arial, sans-serif;
        color: #fff;
        overflow-x: hidden;
    }

    header {
        text-align: center;
        padding: 40px 0 10px;
        font-size: 32px;
        font-weight: bold;
        color: #00c8ff;
        letter-spacing: 2px;
    }

    .ticker-wrapper {
        width: 100%;
        overflow: hidden;
        position: relative;
        height: 30px;
        margin-top: 10px;
    }

    .ticker {
        position: absolute;
        font-size: 18px;
        white-space: nowrap;
        animation: moveTicker 14s linear infinite;
        left: 0;
        top: 0;
    }

    @keyframes moveTicker {
        0% { transform: translateX(100%); }
        100% { transform: translateX(0%); }
    }

    .link-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        padding: 60px;
        margin-top: 20px;
    }

    .portal-link {
        background: rgba(255,255,255,0.05);
        padding: 25px;
        border: 1px solid #00c8ff;
        border-radius: 10px;
        text-align: center;
        font-size: 20px;
        text-decoration: none;
        color: #00eaff;
        transition: background 0.4s, transform 0.3s ease, filter 0.6s;
        animation: subtleFloat 5s ease-in-out infinite;
        filter: brightness(1);
    }

    @keyframes subtleFloat {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
        100% { transform: translateY(0px); }
    }

    .portal-link:hover {
        background: rgba(0,200,255,0.25);
        transform: scale(1.1);
        filter: brightness(1.4);
    }

    /* Gesamte Statistik unten links */
    #aurion-stats {
        position: fixed;
        left: 15px;
        bottom: 15px;
        font-size: 15px;
        opacity: 0.9;
        background: rgba(255,255,255,0.07);
        padding: 10px 15px;
        border-radius: 10px;
        border: 1px solid rgba(0,200,255,0.3);
        backdrop-filter: blur(4px);
        display: flex;
        gap: 15px;
    }

    /* Live-Besucher oben rechts */
    #live-counter {
        position: fixed;
        right: 15px;
        top: 15px;
        font-size: 15px;
        opacity: 0.9;
        background: rgba(255,255,255,0.07);
        padding: 10px 15px;
        border-radius: 10px;
        border: 1px solid rgba(0,200,255,0.3);
        backdrop-filter: blur(4px);
    }
</style>
</head>

<body>

<header>AURION PORTAL</header>

<div class="ticker-wrapper">
    <div class="ticker">about-aurion – Zukunft beginnt hier. Nur bis zur Mitte sichtbar.</div>
</div>

<div class="link-grid">
    <a class="portal-link" href="resonanzraum.html">Resonanzraum</a>
    <a class="portal-link" href="bibliothek.html">Wissen, alte Energie-Schriften</a>
    <a class="portal-link" href="sternenuebung1.html">Chi-Sternenübung</a>
    <a class="portal-link" href="ki-raum.html">neues Wissen, Durchbrüche, Forscher</a>
    <a class="portal-link" href="meditationsraum.html">Ruhe für Körper, Geist, Seele</a>
    <a class="portal-link" href="about_aurion.html">geht Hand in Hand mit der 2. Aufmerksamkeit</a>
</div>

<!-- Gesamtstatistik -->
<div id="aurion-stats">
    <span id="energy-count">Energie: …</span>
    <span id="visitor-count">Besucher: …</span>
</div>

<!-- Live Besucher oben rechts -->
<div id="live-counter">Live: wird geladen…</div>

<script>
/* ------------------ Besucher gesamt ------------------ */
let visits = localStorage.getItem("aurion_visitors");
if (!visits) visits = 1;
else visits = parseInt(visits) + 1;
localStorage.setItem("aurion_visitors", visits);

document.getElementById("visitor-count").innerText =
    "Besucher: " + visits;


/* ------------------ Live-Besucher (Browser-Simulation) ------------------ */
function updateLiveVisitors() {
    const key = "aurion_online_users";
    const now = Date.now();

    let online = JSON.parse(localStorage.getItem(key) || "[]");

    online = online.filter(t => now - t < 30000);

    online.push(now);

    localStorage.setItem(key, JSON.stringify(online));

    document.getElementById("live-counter").innerText =
        "Live: " + online.length;
}

updateLiveVisitors();
setInterval(updateLiveVisitors, 5000);


/* ------------------ GitHub Energie ------------------ */
const api = "https://api.github.com/repos/doerkys-bot/Aurion_the_project";

fetch(api)
.then(r => r.json())
.then(data => {
    const watchers = data.watchers_count || 0;
    const stars = data.stargazers_count || 0;
    const subs = data.subscribers_count || 0;

    const strongest = Math.max(watchers, stars, subs);

    document.getElementById("energy-count").innerText =
        "Energie: " + strongest;
})
.catch(() => {
    document.getElementById("energy-count").innerText = "Energie: 0";
});
</script>

</body>
</html>
