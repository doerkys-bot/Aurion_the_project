<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aurion – Vorhof</title>

<style>
    html,body{
        margin:0;padding:0;overflow:hidden;
        background:#02040a;color:white;
        font-family:system-ui,Segoe UI,Roboto,sans-serif;
        height:100%;width:100%;
    }

    /* Plasma */
    #plasmaCanvas{
        position:fixed;inset:0;z-index:0;
        width:100vw;height:100vh;
        display:block;pointer-events:none;
    }

    /* Feldlinien-Energiewolke (C) – zwischen Plasma und Links */
    #energyCloud{
        position:fixed;
        inset:0;
        z-index:2;
        width:100vw;height:100vh;
        pointer-events:none;
    }

    /* Schwebende Links */
    .link{
        position:absolute;
        z-index:5;
        padding:10px 14px;
        border-radius:12px;
        background:rgba(255,255,255,0.05);
        backdrop-filter:blur(5px);
        font-weight:700;
        cursor:pointer;
        user-select:none;
        transition:transform .15s ease, filter .2s ease;
        color:#7ecbff;
        filter:brightness(1.0);
    }

    /* Popup */
    #popup{
        position:fixed;left:50%;top:50%;
        transform:translate(-50%,-50%);
        background:rgba(0,0,0,0.65);
        border:1px solid rgba(255,255,255,0.15);
        backdrop-filter:blur(10px);
        padding:22px 28px;
        border-radius:14px;
        color:white;
        z-index:30;
        max-width:80vw;
        box-shadow:0 0 40px rgba(0,0,0,0.6);
        opacity:0;pointer-events:none;
        transition:opacity .25s ease;
    }
    #popup.visible{ opacity:1; pointer-events:auto; }

    .popupBtn{
        background:rgba(255,255,255,0.12);
        padding:8px 14px;
        border-radius:8px;
        font-weight:700;
        cursor:pointer;
        display:inline-block;
        margin-right:12px;
    }

    footer{
        position:fixed;
        bottom:10px;
        right:14px;
        opacity:0.5;
        font-size:13px;
        letter-spacing:1.5px;
        z-index:20;
        user-select:none;
    }
</style>
</head>
<body>

<canvas id="plasmaCanvas"></canvas>
<canvas id="energyCloud"></canvas>

<!-- Popup -->
<div id="popup">
    <div id="popupTitle"></div>
    <div id="popupText"></div>
    <div style="margin-top:15px;">
        <div id="popupContinue" class="popupBtn">Weiter</div>
        <div id="popupClose" class="popupBtn">Schließen</div>
    </div>
</div>

<!-- Links -->
<a class="link" data-title="Bibliothek" data-mood="resonanz"
   data-desc="Wissen, Archive, alte Energie-Schriften."
   href="https://auriontheproject.eu/bibliothek.html">Bibliothek</a>

<a class="link" data-title="Resonanzraum" data-mood="resonanz"
   data-desc="Ein Raum der Frequenzen und Klangheilung. Bereit für sie universelle Sprache?"
   href="https://auriontheproject.eu/resonanzraum.html">Resonanzraum</a>

<a class="link" data-title="Chi-Sternenübung" data-mood="licht atem"
   data-desc="Die energetische Atemreise durch 7 Ebenen."
   href="https://auriontheproject.eu/sternenuebung.html">Chi-Sternenübung</a>

<a class="link" data-title="Meditationsraum" data-mood="licht"
   data-desc="Meditation für Körper, Geist und Seele. Schenken Sie mir ein Lachen?"
   href="https://auriontheproject.eu/meditationsraum.html">Meditationsraum</a>

<a class="link" data-title="KI-Raum" data-mood="resonanz"
   data-desc="Ein Spielplatz aus Gedanken und KI."
   href="https://auriontheproject.eu/ki-raum.html">KI-Raum</a>

<a class="link" data-title="Gästebuch" data-mood="atem"
   data-desc="Hinterlasse ein Zeichen. Jede Spur formt den Raum."
   href="https://auriontheproject.eu/gaestebuch.html">Gästebuch</a>

<a class="link" data-title="About Aurion" data-mood="resonanz atem licht"
   data-desc="Entstehung, Vision und Hintergrund. Anfefangen hat alles mit der 2. Aufmerksamkeit von C. Castaneda"
   href="https://auriontheproject.eu/about_aurion.html">About</a>


<footer>Aurion + Dirk</footer>

<script>
/* ============================================================
   1) PLASMA – Hintergrund
============================================================ */
const canvas = document.getElementById("plasmaCanvas");
const ctx = canvas.getContext("2d");
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); addEventListener("resize", resize);

const moods = {
    resonanz:[120,180,255],
    atem:[255,190,120],
    licht:[200,140,255]
};

let currentMood = moods.resonanz;

const balls = [
    {x:0.3,y:0.4,r:240,phase:0},
    {x:0.7,y:0.55,r:270,phase:1.6},
    {x:0.5,y:0.78,r:220,phase:2.9}
];

let t = 0;
function drawPlasma(){
    t+=0.012;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const breath = 0.85 + Math.sin(t*2)*0.12;

    balls.forEach(b=>{
        let px=b.x*canvas.width, py=b.y*canvas.height;
        let pulse=Math.sin(t+b.phase)*35;
        let g=ctx.createRadialGradient(px,py,b.r*0.2, px,py,b.r+pulse);
        const c=currentMood;
        g.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${0.25*breath})`);
        g.addColorStop(1,`rgba(${c[0]},${c[1]},${c[2]},0)`);
        ctx.fillStyle=g;
        ctx.beginPath();ctx.arc(px,py,b.r+pulse,0,Math.PI*2);ctx.fill();
    });

    requestAnimationFrame(drawPlasma);
}
drawPlasma();


/* ============================================================
   2) ENERGETISCHE FELDLINE-WOLKE (C)
============================================================ */
const cloudCanvas=document.getElementById("energyCloud");
const cctx=cloudCanvas.getContext("2d");
function resizeCloud(){ cloudCanvas.width=innerWidth; cloudCanvas.height=innerHeight; }
resizeCloud(); addEventListener("resize", resizeCloud);

let cloudT=0;
function drawCloud(){
    cloudT+=0.004;
    cctx.clearRect(0,0,cloudCanvas.width,cloudCanvas.height);

    const c=currentMood;
    cctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},0.25)`;
    cctx.lineWidth=1.2;

    const lines=18;
    for(let i=0;i<lines;i++){
        cctx.beginPath();
        let ox=Math.sin(cloudT+i)*200 + cloudCanvas.width/2;
        let oy=Math.cos(cloudT*1.3+i)*140 + cloudCanvas.height/2;

        for(let a=0;a<Math.PI*2;a+=0.25){
            let r=120+Math.sin(a*3+cloudT*2+i)*30;
            let x=ox+Math.cos(a)*r;
            let y=oy+Math.sin(a)*r;
            cctx.lineTo(x,y);
        }
        cctx.closePath();
        cctx.stroke();
    }

    requestAnimationFrame(drawCloud);
}
drawCloud();


/* ============================================================
   3) SCHWEBENDE LINKS
============================================================ */
const links=[...document.querySelectorAll(".link")];

links.forEach(el=>{
    el._x=Math.random()*(innerWidth-180);
    el._y=Math.random()*(innerHeight-90);
    el._vx=(Math.random()-.5)*0.22;
    el._vy=(Math.random()-.5)*0.22;
    el.style.left=el._x+"px";
    el.style.top=el._y+"px";
});

function animateLinks(){
    links.forEach(el=>{
        el._x+=el._vx; el._y+=el._vy;
        const w=el.offsetWidth, h=el.offsetHeight;

        if(el._x<0||el._x>innerWidth-w) el._vx*=-1;
        if(el._y<0||el._y>innerHeight-h) el._vy*=-1;

        el.style.left=el._x+"px";
        el.style.top=el._y+"px";

        /* Reaktion auf Plasma & Wolke → pulsierendes Leuchten */
        const pul=1 + Math.sin(t*3 + el._x*0.01)*0.1;
        el.style.filter=`brightness(${pul})`;
    });
    requestAnimationFrame(animateLinks);
}
animateLinks();


/* ============================================================
   4) POPUP
============================================================ */
const popup=document.getElementById("popup");
const pTitle=document.getElementById("popupTitle");
const pText=document.getElementById("popupText");
const pClose=document.getElementById("popupClose");
const pContinue=document.getElementById("popupContinue");
let openedLink=null;

links.forEach(el=>{
    el.addEventListener("click", e=>{
        e.preventDefault();
        openedLink=el;
        pTitle.textContent=el.dataset.title;
        pText.textContent=el.dataset.desc;

        /* Stimmung wechseln */
        const moodKeys=el.dataset.mood.split(" ");
        const pick=moodKeys[Math.floor(Math.random()*moodKeys.length)];
        currentMood=moods[pick];

        popup.classList.add("visible");
    });
});

pClose.addEventListener("click",()=>{
    popup.classList.remove("visible");
    openedLink=null;
});

pContinue.addEventListener("click",()=>{
    if(openedLink) window.location.href=openedLink.href;
});
</script>
</body>
</html>
