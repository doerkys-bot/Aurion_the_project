<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurion 4-Felder Irissteuerung</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

<style>
body{
  margin:0;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#07111f;
  color:white;
  font-family:Arial,sans-serif;
}

#top{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:72px;
  background:#08111f;
  border-bottom:6px solid #16a34a;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  z-index:20;
}

button{
  padding:12px 24px;
  border:0;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
  background:#63ffd8;
  color:#06111a;
}

#board{
  position:fixed;
  left:0;
  right:0;
  top:78px;
  bottom:48px;
  border:8px solid #fbbf24;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  background:#0b1223;
}

.field{
  border:4px solid #334155;
  background:#1e293b;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  font-weight:bold;
  user-select:none;
  transition:.16s;
}

.field.focused{
  background:#2a5f9f;
  border-color:#63ffd8;
  box-shadow:inset 0 0 40px rgba(99,255,216,.6);
}

.symbol{
  font-size:clamp(60px,12vw,140px);
}

.word{
  font-size:clamp(30px,6vw,72px);
  letter-spacing:1px;
}

#dot{
  position:fixed;
  width:32px;
  height:32px;
  margin-left:-16px;
  margin-top:-16px;
  background:red;
  border:3px solid white;
  border-radius:50%;
  box-shadow:0 0 28px red;
  pointer-events:none;
  z-index:9999;
  left:50%;
  top:50%;
}

#dot.pulse{
  width:66px;
  height:66px;
  margin-left:-33px;
  margin-top:-33px;
  background:#ffd166;
  box-shadow:0 0 60px #ffd166;
}

#status{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:48px;
  background:#08111f;
  color:#b8c7d8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  z-index:20;
}
</style>
</head>

<body>

<div id="top">
  <button id="startBtn" onclick="engine.start()">START</button>
  <button id="calBtn" onclick="engine.calibrate()">KALIBRIERUNG</button>
  <button onclick="location.reload()">STOPP</button>
</div>

<div id="board">

  <div class="field" data-text="Ich möchte trinken">
    <div class="symbol">🥤</div>
    <div class="word">TRINKEN</div>
  </div>

  <div class="field" data-text="Ich muss zur Toilette">
    <div class="symbol">🚽</div>
    <div class="word">TOILETTE</div>
  </div>

  <div class="field" data-text="Ich brauche eine Pause">
    <div class="symbol">😴</div>
    <div class="word">PAUSE</div>
  </div>

  <div class="field" data-text="Ich brauche Hilfe">
    <div class="symbol">🆘</div>
    <div class="word">HILFE</div>
  </div>

</div>

<div id="dot"></div>
<div id="status">Bereit.</div>

<video id="cam" autoplay playsinline muted style="display:none"></video>

<script>
class FourFieldEyeBoard{

constructor(){

this.running=false;

this.x=innerWidth/2;
this.y=innerHeight/2;

this.tx=this.x;
this.ty=this.y;

this.smoothing=0.08;

this.current=null;

this.eyeClosed=false;
this.lastClose=0;
this.lastAction=0;

this.BLINK_CLOSE=0.30;
this.BLINK_OPEN=0.34;

this.DOUBLE_MS=1100;
this.COOLDOWN=900;

this.centerX=0.5;
this.centerY=0.5;

this.lastIrisX=0.5;
this.lastIrisY=0.5;

this.lastFaceX=0.5;
this.lastFaceY=0.5;

/*
  95% Irissteuerung:
  - 95% Irisposition
  - 5% Gesicht/Nase als minimale Stabilisierung
*/
this.IRIS_WEIGHT=0.95;
this.FACE_WEIGHT=0.05;

/*
  Reichweite der Steuerung.
  Höher = Dot bewegt sich stärker.
  Wenn zu nervös: 2.8
  Wenn zu langsam/kommt nicht in Ecken: 3.5
*/
this.IRIS_GAIN=3.2;

setInterval(()=>this.loop(),30);
}

status(t){
document.getElementById("status").innerText=t;
}

async start(){

const startBtn=document.getElementById("startBtn");

startBtn.style.background="#ffd166";
startBtn.innerText="STARTET...";

this.status("Kamera wird gestartet...");

if(this.running){

startBtn.style.background="#16a34a";
startBtn.innerText="AKTIV";

this.status("System läuft bereits.");
return;
}

const video=document.getElementById("cam");

try{

const stream=
await navigator.mediaDevices.getUserMedia({
video:{facingMode:"user"},
audio:false
});

video.srcObject=stream;

await video.play();

this.faceMesh=new FaceMesh({
locateFile:file=>
`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
});

this.faceMesh.setOptions({
maxNumFaces:1,
refineLandmarks:true,
minDetectionConfidence:.6,
minTrackingConfidence:.6
});

this.faceMesh.onResults(r=>this.process(r));

this.camera=new Camera(video,{

onFrame:async()=>{

if(this.running){

await this.faceMesh.send({
image:video
});
}
},

width:640,
height:480
});

await this.camera.start();

this.running=true;

startBtn.style.background="#16a34a";
startBtn.innerText="AKTIV";

this.status("Augensteuerung aktiv. Bitte kalibrieren.");

}catch(e){

startBtn.style.background="#ef4444";
startBtn.innerText="FEHLER";

this.status("Kamera-Fehler: "+e.message);
}
}

calibrate(){

if(!this.running){
this.status("Bitte zuerst START drücken.");
return;
}

this.status("Kalibrierung: ruhig in die Mitte schauen.");

const board=
document.getElementById("board")
.getBoundingClientRect();

this.x=board.left+board.width/2;
this.y=board.top+board.height/2;

this.tx=this.x;
this.ty=this.y;

this.centerX=this.lastIrisX || 0.5;
this.centerY=this.lastIrisY || 0.5;

const btn=document.getElementById("calBtn");

btn.style.background="#ffd166";
btn.innerText="GESPEICHERT";

setTimeout(()=>{

btn.style.background="#16a34a";
btn.innerText="KALIBRIERUNG";

this.status("Kalibrierung gespeichert. 95% Irissteuerung aktiv.");

},1200);
}

clampToScreen(x,y){

const margin=22;

return{

x:Math.max(
margin,
Math.min(innerWidth-margin,x)
),

y:Math.max(
78+margin,
Math.min(innerHeight-48-margin,y)
)
};
}

avgPoint(lm,ids){

let x=0;
let y=0;

ids.forEach(i=>{
x+=lm[i].x;
y+=lm[i].y;
});

return{
x:x/ids.length,
y:y/ids.length
};
}

process(res){

if(
!res.multiFaceLandmarks ||
!res.multiFaceLandmarks.length
)return;

const lm=res.multiFaceLandmarks[0];

/*
  Irispunkte:
  links 468–472
  rechts 473–477
*/
const leftIris=this.avgPoint(lm,[468,469,470,471,472]);
const rightIris=this.avgPoint(lm,[473,474,475,476,477]);

const irisX=(leftIris.x+rightIris.x)/2;
const irisY=(leftIris.y+rightIris.y)/2;

/*
  Gesichtspunkt als Mini-Stabilisierung
*/
const faceX=lm[4].x;
const faceY=lm[4].y;

this.lastIrisX=irisX;
this.lastIrisY=irisY;

this.lastFaceX=faceX;
this.lastFaceY=faceY;

/*
  95% Iris + 5% Face
*/
const mixX=
irisX*this.IRIS_WEIGHT +
faceX*this.FACE_WEIGHT;

const mixY=
irisY*this.IRIS_WEIGHT +
faceY*this.FACE_WEIGHT;

const cx=this.centerX || 0.5;
const cy=this.centerY || 0.5;

/*
  Blickrichtung:
  X gespiegelt, weil Frontkamera.
*/
let rawX=
(0.5-(mixX-cx)*this.IRIS_GAIN)
*innerWidth;

let rawY=
(0.5+(mixY-cy)*this.IRIS_GAIN)
*innerHeight;

const c=this.clampToScreen(rawX,rawY);

this.tx=c.x;
this.ty=c.y;

const dist=(a,b)=>{

const dx=lm[a].x-lm[b].x;
const dy=lm[a].y-lm[b].y;

return Math.sqrt(dx*dx+dy*dy);
};

const leftEAR=
dist(159,145)/
Math.max(.001,dist(33,133));

const rightEAR=
dist(386,374)/
Math.max(.001,dist(362,263));

const ear=(leftEAR+rightEAR)/2;

this.detectBlink(ear);
}

detectBlink(ear){

const now=Date.now();

if(
now-this.lastAction<
this.COOLDOWN
)return;

if(
ear<this.BLINK_CLOSE &&
!this.eyeClosed
){

this.eyeClosed=true;

if(
now-this.lastClose<
this.DOUBLE_MS
){

this.lastAction=now;
this.lastClose=0;

this.activate(this.current);

return;
}

this.lastClose=now;
}

if(
ear>this.BLINK_OPEN &&
this.eyeClosed
){
this.eyeClosed=false;
}
}

loop(){

const c=this.clampToScreen(
this.tx,
this.ty
);

this.x+=
(c.x-this.x)
*this.smoothing;

this.y+=
(c.y-this.y)
*this.smoothing;

const dot=document.getElementById("dot");

dot.style.left=this.x+"px";
dot.style.top=this.y+"px";

const el=
document.elementFromPoint(
this.x,
this.y
);

document
.querySelectorAll(".field")
.forEach(f=>f.classList.remove("focused"));

if(
el &&
el.closest(".field")
){

this.current=el.closest(".field");

this.current.classList.add("focused");

}else{

this.current=null;
}
}

activate(el){

if(!el){

this.status("Doppelblink erkannt, aber kein Feld fokussiert.");

return;
}

const text=
el.dataset.text ||
el.innerText.trim();

this.pulse();

this.status(text);

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(text);

u.lang="de-DE";
u.rate=.95;

speechSynthesis.speak(u);
}

pulse(){

const d=document.getElementById("dot");

d.classList.remove("pulse");

void d.offsetWidth;

d.classList.add("pulse");

setTimeout(()=>{
d.classList.remove("pulse");
},260);
}
}

const engine=new FourFieldEyeBoard();

document
.querySelectorAll(".field")
.forEach(f=>{

f.addEventListener(
"click",
()=>engine.activate(f)
);
});
</script>

</body>
</html>
