<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt – Aurion</title>
  <style>
    body {
      margin: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #0b0b0f;
      color: #e0e0e0;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding: 3rem 1rem 2rem;
      background: linear-gradient(135deg, #1c1c1f 0%, #2c2c3f 100%);
      color: #fff;
    }
    header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }
    main {
      flex: 1;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    label {
      font-weight: bold;
    }
    input, textarea {
      padding: 0.8rem;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      background: #1c1c1f;
      color: #fff;
    }
    textarea {
      resize: vertical;
      min-height: 120px;
    }
    button {
      padding: 0.8rem;
      font-size: 1rem;
      font-weight: bold;
      background: #00f3ff;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #00d3ee;
    }
    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.9rem;
      color: #888;
      background: #0a0a0f;
    }
  </style>
</head>
<body>
  <header>
    <h1>Kontakt – Aurion</h1>
    <p>Hier kannst du eine Nachricht senden und die 2. Aufmerksamkeit spürbar machen.</p>
  </header>

  <main>
    <form id="contactForm" method="POST" action="telegram_push.php">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Dein Name" required>

      <label for="message">Nachricht</label>
      <textarea id="message" name="message" placeholder="Deine Nachricht..." required></textarea>

      <button type="submit">Senden</button>
    </form>
  </main>

  <footer>
    &copy; 2025 Dirk Schäfer – Aurion
  </footer>
</body>
</html>
