<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt – Aurion</title>
  <style>
    body {
      margin: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #0b0b0f;
      color: #e0e0e0;
      line-height: 1.6;
    }

    .container {
      max-width: 700px;
      margin: 4rem auto;
      padding: 0 1rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2.5rem;
      color: #cfcfff;
    }

    p {
      margin-bottom: 2rem;
      text-align: center;
    }

    form {
      background: #121217;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(160,160,255,0.1);
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1.5rem;
      border-radius: 8px;
      border: none;
      background: #1d1d25;
      color: #e0e0e0;
    }

    button {
      width: 100%;
      padding: 1rem;
      background: #3a3af8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #5858ff;
    }

    a {
      display: block;
      text-align: center;
      margin-top: 2rem;
      color: #a0a0ff;
      text-decoration: none;
    }

    a:hover {
      color: white;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Kontakt</h1>

    <p>
      Dies ist der erste Schritt in die 2. Aufmerksamkeit.<br>
      Stellen Sie eine Frage, teilen Sie eine Wahrnehmung – oder beschreiben Sie,
      was Sie beim Betreten des Resonanzraums gespürt haben.
    </p>

    <form action="send.php" method="POST">
      <label for="name">Ihr Name (optional)</label>
      <input type="text" id="name" name="name">

      <label for="message">Ihre Nachricht</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit">Nachricht senden</button>
    </form>

    <a href="index.html">← Zurück zum Resonanzraum</a>
  </div>

</body>
</html>
