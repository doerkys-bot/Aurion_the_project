<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurion – Kontakt</title>
  <style>
    body {
      margin: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #0b0b0f;
      color: #e0e0e0;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #1c1c2c;
      padding: 2rem;
      border-radius: 12px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 20px rgba(0,243,255,0.2);
    }
    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #00f3ff;
    }
    label {
      display: block;
      margin-top: 1rem;
      margin-bottom: 0.3rem;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 0.5rem;
      border-radius: 6px;
      border: none;
      outline: none;
      font-size: 1rem;
    }
    textarea { resize: vertical; height: 100px; }
    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.7rem;
      background: #00f3ff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      color: #000;
      font-size: 1rem;
    }
    button:hover { background: #00d0cc; }
    p { text-align: center; margin-top: 1rem; font-size: 0.9rem; color: #9ff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kontakt</h1>
    <form action="send_contact_telegram.php" method="POST">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">E-Mail</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Nachricht</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit">Abschicken</button>
    </form>
    <p>Deine Nachricht wird direkt an meinen Telegram-Bot gesendet.</p>
  </div>
</body>
</html>
