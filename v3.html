<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpeg") center/cover no-repeat fixed;
  font-family:system-ui,Segoe UI,Roboto,sans-serif;
  color:white;
}

.link{
  position:absolute;
  padding:12px 18px;
  border-radius:16px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(6px);
  color:#cfeeff;
  text-decoration:none;
  font-weight:700;
  box-shadow:0 0 22px rgba(80,160,255,.18);
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  z-index:6;
  white-space:nowrap;
}

.link.active{
  transform:scale(1.10);
  background:rgba(140,255,200,.18);
  box-shadow:
    0 0 18px rgba(140,255,200,.70),
    0 0 42px rgba(120,255,200,.95);
}

.link.confirmFlash{
  box-shadow:0 0 65px rgba(220,255,240,.98);
  background:rgba(170,255,220,.20);
}

#title{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  color:#cfeeff;
  font-size:clamp(22px,3.5vw,38px);
  letter-spacing:.22em;
  text-transform:uppercase;
  z-index:8;
  text-shadow:0 0 16px rgba(120,200,255,.22);
}

#gazeDot{
  position:fixed;
  width:10px;
  height:10px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:#ff3b3b;
  box-shadow:0 0 8px rgba(255,60,60,.9);
  pointer-events:none;
  z-index:9998;
  opacity:0;
}
#gazeDot.on{ opacity:1; }
#gazeDot.blink{
  transform:translate(-50%,-50%) scale(1.7);
}
#gazeDot.double{
  transform:translate(-50%,-50%) scale(2.1);
}

#hint{
  position:fixed;
  bottom:58px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  color:#bfe9ff;
  background:rgba(0,0,0,.42);
  padding:6px 10px;
  border-radius:10px;
  z-index:9997;
  max-width:92vw;
  text-align:center;
  white-space:pre-wrap;
}

#videoWrap{
  position:fixed;
  top:10px;
  left:10px;
  width:80px;
  height:90px;
  border-radius:8px;
  overflow:hidden;
  background:black;
  display:none;
  z-index:9996;
  border:1px solid rgba(140,230,255,.22);
  box-shadow:0 0 18px rgba(120,200,255,.25);
}
#cam{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(1.8) translateY(-18%);
}

.controls-left{
  position:fixed;
  bottom:108px;
  left:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
  z-index:9999;
}

.controls-row{
  display:flex;
  gap:8px;
}

#btnTrack{
  flex:0 0 auto;
}

#btnCal{
  flex:1 1 auto;
}

button{
  padding:8px 12px;
  border-radius:10px;
  border:1px solid rgba(140,230,255,.28);
  background:rgba(20,40,80,.45);
  color:#cfeeff;
  font-weight:800;
}
button[disabled]{
  opacity:.5;
}

#calTarget{
  position:fixed;
  width:30px;
  height:30px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  display:none;
  z-index:20000;
  pointer-events:none;
  border:2px solid rgba(180,255,220,.95);
  box-shadow:
    0 0 14px rgba(140,255,220,.9),
    inset 0 0 10px rgba(140,255,220,.45);
  background:rgba(140,255,220,.12);
}
#calTarget::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:8px;
  height:8px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:rgba(220,255,240,.95);
  box-shadow:0 0 10px rgba(220,255,240,.95);
}

.ticker{
  overflow:hidden;
  white-space:nowrap;
  border-radius:10px;
  background:rgba(0,0,0,.42);
  backdrop-filter:blur(4px);
  z-index:9995;
}

.ticker-track{
  display:inline-flex;
  width:max-content;
  min-width:200%;
  animation:tickerMove 16s linear infinite;
}

.ticker-item{
  display:inline-block;
  padding-right:3rem;
}

@keyframes tickerMove{
  from{ transform:translateX(0); }
  to{ transform:translateX(-50%); }
}

#linkTicker{
  position:fixed;
  display:none;
  max-width:min(320px, calc(100vw - 24px));
  color:#8dffb8;
  border:1px solid rgba(120,255,180,.20);
  box-shadow:0 0 16px rgba(100,255,180,.16);
  font-size:12px;
  padding:6px 0;
  pointer-events:none;
}

#bottomTicker{
  position:fixed;
  left:12px;
  right:12px;
  bottom:88px;
  color:#d8f4ff;
  border:1px solid rgba(140,230,255,.14);
  box-shadow:0 0 14px rgba(120,200,255,.10);
  font-size:12px;
  padding:6px 0;
}

#countdownBox{
  position:fixed;
  min-width:auto;
  text-align:center;
  padding:2px 5px;
  border-radius:6px;
  background:rgba(0,0,0,.62);
  color:#8dffb8;
  border:1px solid rgba(120,255,180,.20);
  box-shadow:0 0 8px rgba(100,255,180,.10);
  z-index:9996;
  display:none;
  font-size:11px;
  font-weight:700;
  line-height:1.1;
  pointer-events:none;
}

#overload{
  position:fixed;
  inset:0;
  background:rgba(2,4,10,.92);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:30000;
  padding:18px;
}

#overloadBox{
  background:#102033;
  padding:20px;
  border-radius:14px;
  width:90%;
  max-width:390px;
  text-align:center;
  line-height:1.6;
}

@media (max-width:700px){
  .link{
    padding:10px 14px;
    font-size:14px;
  }
  .controls-left{
    bottom:116px;
  }
}
</style>
</head>

<body>

<div id="overload">
  <div id="overloadBox">
    Willkommen im Vorhof.<br><br>
    Schaue einen Link an, er beginnt zu glühen.<br>
    Doppelblink öffnet den aktiven Raum.<br><br>
    <button
      id="overloadBtn"
      type="button"
      onclick="document.getElementById('overload').style.display='none';return false;"
      ontouchend="event.preventDefault();document.getElementById('overload').style.display='none';return false;"
    >Verstanden</button>
  </div>
</div>

<script>
(function () {
  const overload = document.getElementById("overload");
  const btn = document.getElementById("overloadBtn");
  if (!overload || !btn) return;

  function closeOverload(e){
    if(e) e.preventDefault();
    overload.style.display = "none";
  }

  btn.addEventListener("click", closeOverload);
  btn.addEventListener("touchend", closeOverload, { passive:false });
})();
</script>

<div id="title">AURION</div>

<div id="videoWrap"><video id="cam" autoplay muted playsinline></video></div>
<div id="gazeDot"></div>
<div id="calTarget"></div>

<div id="linkTicker" class="ticker">
  <div class="ticker-track">
    <span class="ticker-item" id="linkTickerA"></span>
    <span class="ticker-item" id="linkTickerB"></span>
  </div>
</div>

<div id="bottomTicker" class="ticker">
  <div class="ticker-track">
    <span class="ticker-item" id="bottomTickerA">Die Räume ordnen sich um das Sternentor.</span>
    <span class="ticker-item" id="bottomTickerB">Die Räume ordnen sich um das Sternentor.</span>
  </div>
</div>

<div id="countdownBox">3</div>

<div id="hint">Seite bereit</div>

<div class="controls-left">
  <button id="btnCam">Cam</button>
  <div class="controls-row">
    <button id="btnTrack" disabled>Track</button>
    <button id="btnCal" disabled>Kalibrieren</button>
  </div>
</div>

<a class="link" href="bibliothek.html">Bibliothek</a>
<a class="link" href="resonanzraum.html">Resonanzraum</a>
<a class="link" href="sternenuebung.html">Chi-Austausch</a>
<a class="link" href="meditationsraum.html">Meditationsraum</a>
<a class="link" href="ki-raum.html">KI-Raum</a>
<a class="link" href="gaestebuch.html">Gästebuch</a>
<a class="link" href="about_aurion.html">About Aurion</a>

<script type="module">
import AurionEyeTrackingEngine from "./EyeTrackingEngine.js";

const links = [...document.querySelectorAll(".link")];
const dot = document.getElementById("gazeDot");
const calTarget = document.getElementById("calTarget");
const cam = document.getElementById("cam");
const videoWrap = document.getElementById("videoWrap");
const btnCam = document.getElementById("btnCam");
const btnTrack = document.getElementById("btnTrack");
const btnCal = document.getElementById("btnCal");
const hint = document.getElementById("hint");

const linkTicker = document.getElementById("linkTicker");
const linkTickerA = document.getElementById("linkTickerA");
const linkTickerB = document.getElementById("linkTickerB");
const bottomTickerA = document.getElementById("bottomTickerA");
const bottomTickerB = document.getElementById("bottomTickerB");
const countdownBox = document.getElementById("countdownBox");

const ROOM_INFO = {
  "Bibliothek": "Texte, Handzettel und Spuren der Bibliothek der Anfänge.",
  "Resonanzraum": "Ein Raum für stille Schwingung und Austausch.",
  "Chi-Austausch": "Sternenübung und Chi-Austausch.",
  "Meditationsraum": "Ein stiller Raum zum Sammeln.",
  "KI-Raum": "Begegnungsraum zwischen Mensch und KI.",
  "Gästebuch": "Einträge und Spuren der Besucher.",
  "About Aurion": "Idee und Hintergrund von Aurion."
};

/* deine Werte */
const DOT_SMOOTH_FAR = 0.075;
const DOT_SMOOTH_NEAR = 0.045;
const DOT_SMOOTH_INSIDE = 0.035;
const MAGNET_RADIUS = 170;
const MAGNET_STRENGTH = 0.20;
const ACTIVE_LOCK_RADIUS = 65;

const PAGE_LOCK_TIME = 10000;
const COUNTDOWN_TIME = 3000;

let pageStartTime = performance.now();

let tx = innerWidth / 2;
let ty = innerHeight / 2;
let dx = tx;
let dy = ty;

let activeLink = null;
let nearestLink = null;
let nearestLinkDist = Infinity;
let lastTickerText = "Die Räume ordnen sich um das Sternentor.";

let countdownStart = 0;
let countdownLink = null;

function showHint(text){
  hint.textContent = text;
}

function setBottomTicker(text){
  bottomTickerA.textContent = text;
  bottomTickerB.textContent = text;
}

function setLinkTicker(text){
  linkTickerA.textContent = text;
  linkTickerB.textContent = text;
}

function positionCountdownBox(link){
  if(!link){
    countdownBox.style.display = "none";
    return;
  }

  const r = link.getBoundingClientRect();
  let left = r.left + 6;
  let top  = r.bottom - 18;

  if(left < 6) left = 6;
  if(top < 6) top = 6;

  countdownBox.style.left = left + "px";
  countdownBox.style.top = top + "px";
}

function updateCountdown(link){
  const now = performance.now();

  if(now - pageStartTime < PAGE_LOCK_TIME){
    countdownBox.style.display = "none";
    countdownLink = null;
    return;
  }

  if(!link){
    countdownBox.style.display = "none";
    countdownLink = null;
    return;
  }

  if(countdownLink !== link){
    countdownLink = link;
    countdownStart = now;
    countdownBox.style.display = "block";
  }

  positionCountdownBox(link);

  const remain = Math.max(0, COUNTDOWN_TIME - (now - countdownStart));
  countdownBox.textContent = Math.ceil(remain / 1000);

  if(remain <= 0){
    countdownBox.style.display = "none";
    countdownLink = null;
    openActiveLink();
  }
}

function updateTickers(link){
  let text = "Die Räume ordnen sich um das Sternentor.";

  if(link){
    const name = link.textContent.trim();
    text = ROOM_INFO[name] || "Raum";
  }

  if(text !== lastTickerText){
    lastTickerText = text;
    setBottomTicker(text);
  }

  if(link){
    setLinkTicker(text);
    const r = link.getBoundingClientRect();
    const w = Math.min(320, innerWidth - 24);
    linkTicker.style.display = "block";
    linkTicker.style.width = w + "px";
    linkTicker.style.left = Math.max(12, Math.min(innerWidth - w - 12, r.left + r.width / 2 - w / 2)) + "px";
    linkTicker.style.top = Math.max(12, r.top - 36) + "px";
  }else{
    linkTicker.style.display = "none";
  }

  updateCountdown(link);
}

function placeLinks(){
  const cx = innerWidth / 2;
  const cy = innerHeight / 2;
  const r = Math.min(innerWidth, innerHeight) * 0.32;
  const step = (2 * Math.PI) / links.length;

  links.forEach((link, i) => {
    const a = i * step - Math.PI / 2;
    const w = link.offsetWidth || 120;
    const h = link.offsetHeight || 40;

    link.style.left = (cx + r * Math.cos(a) - w / 2) + "px";
    link.style.top  = (cy + r * Math.sin(a) - h / 2) + "px";
  });
}

function resolveLinkMagnet(){
  activeLink = null;
  nearestLink = null;
  nearestLinkDist = Infinity;

  let magnetTargetX = tx;
  let magnetTargetY = ty;

  links.forEach(link => {
    const r = link.getBoundingClientRect();
    link.classList.remove("active");

    const cx = r.left + r.width / 2;
    const cy = r.top + r.height / 2;
    const distToCenter = Math.hypot(tx - cx, ty - cy);

    if(distToCenter < nearestLinkDist){
      nearestLinkDist = distToCenter;
      nearestLink = link;
    }

    const inside = tx > r.left && tx < r.right && ty > r.top && ty < r.bottom;
    if(inside){
      activeLink = link;
    }
  });

  if(!activeLink && nearestLink && nearestLinkDist < ACTIVE_LOCK_RADIUS){
    activeLink = nearestLink;
  }

  if(nearestLink && nearestLinkDist < MAGNET_RADIUS){
    const rect = nearestLink.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    const alpha = 1 - (nearestLinkDist / MAGNET_RADIUS);
    magnetTargetX = tx + (cx - tx) * alpha * MAGNET_STRENGTH;
    magnetTargetY = ty + (cy - ty) * alpha * MAGNET_STRENGTH;
  }

  if(activeLink){
    activeLink.classList.add("active");
  }

  updateTickers(activeLink);
  return { x: magnetTargetX, y: magnetTargetY };
}

function dotLoop(){
  const target = resolveLinkMagnet();

  let smooth = DOT_SMOOTH_FAR;
  if(nearestLink && nearestLinkDist < MAGNET_RADIUS){
    smooth = DOT_SMOOTH_NEAR;
  }
  if(activeLink){
    smooth = DOT_SMOOTH_INSIDE;
  }

  dx += (target.x - dx) * smooth;
  dy += (target.y - dy) * smooth;

  dot.style.left = dx + "px";
  dot.style.top  = dy + "px";

  requestAnimationFrame(dotLoop);
}

function openActiveLink(){
  if(!activeLink) return;
  activeLink.classList.add("confirmFlash");
  setTimeout(() => activeLink.classList.remove("confirmFlash"), 260);
  activeLink.click();
}

function pulse(kind){
  dot.classList.remove("blink","double");
  void dot.offsetWidth;
  dot.classList.add(kind);
  setTimeout(() => dot.classList.remove("blink","double"), 140);
}

const engine = new AurionEyeTrackingEngine({
  video: cam,
  storagePrefix: "aurion_engine",

  onStatus: text => showHint(text),

  onGaze: gaze => {
    tx = innerWidth * (1 - gaze.x);
    ty = innerHeight * gaze.y;
  },

  onBlink: () => {
    pulse("blink");
  },

  onDoubleBlink: () => {
    pulse("double");
    countdownBox.style.display = "none";
    countdownLink = null;
    if(activeLink){
      openActiveLink();
    }
  },

  onFaceFound: () => {
    showHint("Gesicht erkannt");
  },

  onFaceLost: () => {
    showHint("Kein Gesicht");
  },

  onUserLoaded: (name) => {
    showHint("Willkommen zurück, " + name);
  },

  onCalibrationSaved: () => {
    showHint("Kalibrierung gespeichert");
  }
});

window.AURION_ENGINE = engine;

btnCam.addEventListener("click", async () => {
  try{
    if(engine.isCameraRunning()){
      engine.stopCamera();
      videoWrap.style.display = "none";
      dot.classList.remove("on");
      btnTrack.disabled = true;
      btnCal.disabled = true;
      countdownBox.style.display = "none";
      countdownLink = null;
      calTarget.style.display = "none";
      return;
    }

    await engine.startCamera();
    videoWrap.style.display = "block";
    dot.classList.add("on");
    btnTrack.disabled = false;
    btnCal.disabled = false;
    pageStartTime = performance.now();
  }catch(e){
    console.error(e);
    showHint("Kamera Fehler: " + (e.message || e));
  }
});

btnTrack.addEventListener("click", async () => {
  try{
    if(!engine.isCameraRunning()){
      showHint("Erst Cam starten");
      return;
    }

    if(engine.isTrackingRunning()){
      engine.stopTracking();
      countdownBox.style.display = "none";
      countdownLink = null;
      calTarget.style.display = "none";
      return;
    }

    await engine.startTracking();
    pageStartTime = performance.now();

    if(!engine.activeUserName){
      const name = prompt("Dein Name?");
      if(name && name.trim()){
        engine.registerOrLoadUser(name.trim());
      }
    }
  }catch(e){
    console.error(e);
    showHint("Tracking Fehler: " + (e.message || e));
  }
});

btnCal.addEventListener("click", async () => {
  try {
    if (!engine.isCameraRunning()) {
      showHint("Erst Cam starten");
      return;
    }

    if (!engine.isTrackingRunning()) {
      showHint("Erst Tracking starten");
      return;
    }

    if (!engine.activeUserName) {
      const name = prompt("Dein Name?");
      if (!name || !name.trim()) {
        showHint("Kein Name eingegeben");
        return;
      }
      engine.registerOrLoadUser(name.trim());
    }

    const points = [
      { name: "links oben",   x: innerWidth * 0.18, y: innerHeight * 0.22 },
      { name: "rechts oben",  x: innerWidth * 0.82, y: innerHeight * 0.22 },
      { name: "links unten",  x: innerWidth * 0.18, y: innerHeight * 0.78 },
      { name: "rechts unten", x: innerWidth * 0.82, y: innerHeight * 0.78 },
      { name: "mitte",        x: innerWidth * 0.50, y: innerHeight * 0.50 }
    ];

    await engine.runGuidedCalibration({
      points,
      timeoutMs: 7000,
      minSamples: 8,

      onPointStart: async (point) => {
        calTarget.style.display = "block";
        calTarget.style.left = point.x + "px";
        calTarget.style.top = point.y + "px";
        showHint("Fixiere " + point.name + " und Doppelblink");
      },

      onPointEnd: async () => {}
    });

    calTarget.style.display = "none";
    showHint("Kalibrierung gespeichert");
  } catch (e) {
    calTarget.style.display = "none";
    console.error(e);
    showHint(e.message || "Kalibrierung abgebrochen");
  }
});

addEventListener("load", () => {
  setTimeout(() => {
    placeLinks();
    updateTickers(null);
  }, 120);

  setTimeout(placeLinks, 300);
  setTimeout(placeLinks, 700);

  dotLoop();
});

addEventListener("resize", () => {
  setTimeout(() => {
    placeLinks();
    updateTickers(activeLink);
    if(countdownLink){
      positionCountdownBox(countdownLink);
    }
  }, 120);
});
</script>

</body>
</html>
