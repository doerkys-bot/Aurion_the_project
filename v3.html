<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpeg") center/cover no-repeat fixed;
  font-family:system-ui,Segoe UI,Roboto,sans-serif;
  color:white;
}

/* Links */
.link{
  position:absolute;
  padding:12px 18px;
  border-radius:16px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(6px);
  color:#cfeeff;
  text-decoration:none;
  font-weight:700;
  box-shadow:0 0 22px rgba(80,160,255,.18);
  transition:.18s;
  z-index:6;
  white-space:nowrap;
}
.link.active{
  transform:scale(1.10);
  background:rgba(140,255,200,.15);
  box-shadow:0 0 45px rgba(120,255,200,.90);
}

/* Titel */
#title{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  font-size:34px;
  letter-spacing:.2em;
}

/* Dot */
#gazeDot{
  position:fixed;
  width:10px;
  height:10px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:#ff3b3b;
  box-shadow:0 0 8px rgba(255,60,60,.9);
  pointer-events:none;
  z-index:9998;
  opacity:0;
}
#gazeDot.on{ opacity:1; }

/* Hint */
#hint{
  position:fixed;
  bottom:100px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  color:#bfe9ff;
  background:rgba(0,0,0,.45);
  padding:6px 10px;
  border-radius:10px;
  z-index:9997;
}

/* Cam */
#videoWrap{
  position:fixed;
  top:10px;
  left:10px;
  width:80px;
  height:90px;
  border-radius:8px;
  overflow:hidden;
  background:black;
  display:none;
}
#cam{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(1.8) translateY(-18%);
}

/* Buttons */
.controls-left{
  position:fixed;
  bottom:30px;
  left:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
button{
  padding:8px 12px;
  border-radius:10px;
  border:1px solid rgba(140,230,255,.28);
  background:rgba(20,40,80,.45);
  color:#cfeeff;
  font-weight:800;
}
</style>
</head>

<body>

<!-- OVERLOAD -->
<div id="overload" style="
  position:fixed;
  inset:0;
  background:rgba(2,4,10,.92);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:30000;
">
  <div style="
    background:#102033;
    padding:20px;
    border-radius:14px;
    width:90%;
    max-width:390px;
    text-align:center;
  ">
    Willkommen im Vorhof.<br><br>
    Schaue einen Link an, er beginnt zu glühen.<br>
    Doppelblink öffnet den Raum.<br><br>

    <button
      onclick="document.getElementById('overload').style.display='none';"
      ontouchend="document.getElementById('overload').style.display='none';"
    >Verstanden</button>
  </div>
</div>

<div id="title">AURION</div>

<div id="videoWrap"><video id="cam" autoplay muted playsinline></video></div>
<div id="gazeDot"></div>
<div id="hint">Seite bereit</div>

<div class="controls-left">
  <button id="btnCam">Cam</button>
  <button id="btnTrack" disabled>Track</button>
</div>

<a class="link" href="bibliothek.html">Bibliothek</a>
<a class="link" href="resonanzraum.html">Resonanzraum</a>
<a class="link" href="sternenuebung.html">Chi-Austausch</a>
<a class="link" href="meditationsraum.html">Meditationsraum</a>
<a class="link" href="ki-raum.html">KI-Raum</a>
<a class="link" href="gaestebuch.html">Gästebuch</a>
<a class="link" href="about_aurion.html">About Aurion</a>

<script type="module">
import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs";

const links = [...document.querySelectorAll(".link")];
const dot = document.getElementById("gazeDot");
const cam = document.getElementById("cam");
const videoWrap = document.getElementById("videoWrap");
const btnCam = document.getElementById("btnCam");
const btnTrack = document.getElementById("btnTrack");
const hint = document.getElementById("hint");

let stream = null;
let faceLandmarker = null;
let cameraRunning = false;
let trackingRunning = false;
let lastVideoTime = -1;

let tx = innerWidth/2;
let ty = innerHeight/2;
let dx = tx;
let dy = ty;
let activeLink = null;

function showHint(t){ hint.textContent = t; }

function placeLinks(){
  const cx = innerWidth/2;
  const cy = innerHeight/2;
  const r = Math.min(innerWidth, innerHeight)*0.32;
  const step = (2*Math.PI)/links.length;

  links.forEach((l,i)=>{
    const a = i*step - Math.PI/2;
    l.style.left = (cx + r*Math.cos(a) - l.offsetWidth/2)+"px";
    l.style.top  = (cy + r*Math.sin(a) - l.offsetHeight/2)+"px";
  });
}

function dotLoop(){
  dx += (tx-dx)*0.15;
  dy += (ty-dy)*0.15;
  dot.style.left = dx+"px";
  dot.style.top  = dy+"px";

  activeLink=null;
  links.forEach(link=>{
    const r=link.getBoundingClientRect();
    link.classList.remove("active");
    if(dx>r.left && dx<r.right && dy>r.top && dy<r.bottom){
      activeLink=link;
    }
  });
  if(activeLink) activeLink.classList.add("active");

  requestAnimationFrame(dotLoop);
}

async function initMediaPipe(){
  showHint("MediaPipe lädt");

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
  );

  faceLandmarker = await FaceLandmarker.createFromOptions(vision,{
    baseOptions:{
      modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"
    },
    runningMode:"VIDEO",
    numFaces:1
  });

  showHint("MediaPipe bereit");
}

btnCam.onclick = async ()=>{
  if(cameraRunning){
    stream.getTracks().forEach(t=>t.stop());
    videoWrap.style.display="none";
    btnTrack.disabled=true;
    cameraRunning=false;
    showHint("Kamera aus");
    return;
  }

  stream = await navigator.mediaDevices.getUserMedia({video:true});
  cam.srcObject = stream;
  await cam.play();
  videoWrap.style.display="block";
  dot.classList.add("on");
  btnTrack.disabled=false;
  cameraRunning=true;
  showHint("Kamera an");
};

btnTrack.onclick = async ()=>{
  if(!cameraRunning){
    showHint("Erst Cam starten");
    return;
  }

  if(!faceLandmarker){
    await initMediaPipe();
  }

  trackingRunning=true;
  showHint("Tracking gestartet");

  const loop=()=>{
    if(trackingRunning && cam.readyState>=2){
      if(cam.currentTime!==lastVideoTime){
        lastVideoTime=cam.currentTime;

        const res = faceLandmarker.detectForVideo(cam,performance.now());
        if(res.faceLandmarks.length){
          const p=res.faceLandmarks[0][468];
          tx = p.x * innerWidth;
          ty = p.y * innerHeight;
        }
      }
    }
    requestAnimationFrame(loop);
  };
  loop();
};

addEventListener("load",()=>{
  placeLinks();
  dotLoop();
});
addEventListener("resize",placeLinks);
</script>

</body>
</html>
