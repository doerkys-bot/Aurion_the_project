<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpeg") center/cover no-repeat fixed;
  font-family:system-ui,Segoe UI,Roboto,sans-serif;
  color:white;
}

.link{
  position:absolute;
  padding:12px 18px;
  border-radius:16px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(6px);
  color:#cfeeff;
  text-decoration:none;
  font-weight:700;
  box-shadow:0 0 22px rgba(80,160,255,.18);
  transition:.18s;
  z-index:6;
  white-space:nowrap;
}

.link.active{
  transform:scale(1.10);
  background:rgba(140,255,200,.15);
  box-shadow:0 0 45px rgba(120,255,200,.90);
}

.link.confirmFlash{
  box-shadow:0 0 65px rgba(220,255,240,.98);
  background:rgba(170,255,220,.20);
}

#title{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:8;
  color:#cfeeff;
  font-size:clamp(22px,3.5vw,38px);
  letter-spacing:.22em;
  text-transform:uppercase;
}

#gazeDot{
  position:fixed;
  width:8px;
  height:8px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:#ff3b3b;
  box-shadow:0 0 6px rgba(255,60,60,.85);
  pointer-events:none;
  z-index:9998;
  opacity:0;
}
#gazeDot.on{ opacity:1; }

#hint{
  position:fixed;
  bottom:104px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  color:#bfe9ff;
  background:rgba(0,0,0,.38);
  padding:6px 10px;
  border-radius:10px;
  z-index:9997;
}

#roomInfo{
  position:fixed;
  right:14px;
  bottom:24px;
  width:260px;
  padding:10px;
  border-radius:12px;
  background:rgba(0,0,0,.42);
  font-size:13px;
}

#videoWrap{
  position:fixed;
  top:10px;
  left:10px;
  width:80px;
  height:90px;
  border-radius:8px;
  overflow:hidden;
  background:black;
  display:none;
  z-index:9996;
}
#cam{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(1.8) translateY(-18%);
}

.controls-left{
  position:fixed;
  bottom:38px;
  left:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

button{
  padding:8px 12px;
  border-radius:10px;
  border:1px solid rgba(140,230,255,.28);
  background:rgba(20,40,80,.45);
  color:#cfeeff;
  font-weight:800;
}

#overload{
  position:fixed;
  inset:0;
  background:rgba(2,4,10,.92);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:30000;
}
#overloadBox{
  background:#102033;
  padding:20px;
  border-radius:14px;
  width:90%;
  max-width:390px;
  text-align:center;
}
</style>
</head>

<body>

<div id="overload">
  <div id="overloadBox">
    Willkommen im Vorhof.<br><br>
    Doppelblink öffnet den aktiven Raum.<br>
    <button id="overloadBtn">Verstanden</button>
  </div>
</div>

<div id="title">AURION</div>

<div id="videoWrap"><video id="cam" autoplay muted playsinline></video></div>
<div id="gazeDot"></div>

<div id="hint">Seite bereit</div>

<div class="controls-left">
  <button id="btnCam">Cam</button>
  <button id="btnTrack" disabled>Track</button>
</div>

<div id="roomInfo">
  <div id="roomInfoTitle">Vorhof</div>
  <div id="roomInfoText">Die Räume ordnen sich um das Sternentor.</div>
</div>

<a class="link" href="bibliothek.html">Bibliothek</a>
<a class="link" href="resonanzraum.html">Resonanzraum</a>
<a class="link" href="sternenuebung.html">Chi-Austausch</a>
<a class="link" href="meditationsraum.html">Meditationsraum</a>
<a class="link" href="ki-raum.html">KI-Raum</a>
<a class="link" href="gaestebuch.html">Gästebuch</a>
<a class="link" href="about_aurion.html">About Aurion</a>

<script>
const links = [...document.querySelectorAll(".link")];
const dot = document.getElementById("gazeDot");
const cam = document.getElementById("cam");
const videoWrap = document.getElementById("videoWrap");
const btnCam = document.getElementById("btnCam");
const btnTrack = document.getElementById("btnTrack");
const hint = document.getElementById("hint");

let engine = null;
let camStream = null;
let tx = innerWidth/2;
let ty = innerHeight/2;
let dx = tx;
let dy = ty;

function showHint(t){
  hint.textContent = t;
}

function placeLinks(){
  const cx = innerWidth/2;
  const cy = innerHeight/2;
  const r = Math.min(innerWidth, innerHeight)*0.32;
  const step = (2*Math.PI)/links.length;

  links.forEach((l,i)=>{
    const a = i*step - Math.PI/2;
    l.style.left = (cx + r*Math.cos(a) - l.offsetWidth/2)+"px";
    l.style.top  = (cy + r*Math.sin(a) - l.offsetHeight/2)+"px";
  });
}

function dotLoop(){
  dx += (tx-dx)*0.12;
  dy += (ty-dy)*0.12;
  dot.style.left = dx+"px";
  dot.style.top  = dy+"px";
  requestAnimationFrame(dotLoop);
}

async function startBasicCamera(){
  camStream = await navigator.mediaDevices.getUserMedia({video:true});
  cam.srcObject = camStream;
  await cam.play();
  videoWrap.style.display="block";
  dot.classList.add("on");
  btnTrack.disabled=false;
  showHint("Kamera an");
}

btnCam.onclick = async ()=>{
  if(engine){
    if(engine.isCameraRunning()){
      engine.stopCamera();
      videoWrap.style.display="none";
      showHint("Kamera aus");
      return;
    }
    await engine.startCamera();
    videoWrap.style.display="block";
    btnTrack.disabled=false;
    showHint("Engine Kamera an");
    return;
  }
  await startBasicCamera();
};

btnTrack.onclick = async ()=>{
  if(!engine){
    showHint("Engine fehlt");
    return;
  }
  await engine.startTracking();
  showHint("Tracking gestartet");
};

addEventListener("load",()=>{
  placeLinks();
  dotLoop();
});

addEventListener("resize", placeLinks);

document.getElementById("overloadBtn").onclick=()=>{
  document.getElementById("overload").style.display="none";
};
</script>

<script type="module">
const hint = document.getElementById("hint");
const btnTrack = document.getElementById("btnTrack");

function msg(t){ hint.textContent = t; }

try{
  msg("Engine Import startet");

  const mod = await import("https://doerkys-bot.github.io/Aurion_the_project/EyeTrackingEngine.js?v=4");
  msg("Engine Datei geladen");

  const EngineClass = mod.default;
  const engineInstance = new EngineClass({
    video: document.getElementById("cam"),
    onStatus: msg,
    onGaze: g=>{
      tx = g.x;
      ty = g.y;
    }
  });

  window.engine = engineInstance;
  engine = engineInstance;
  btnTrack.disabled=false;

  msg("Engine bereit");
}
catch(e){
  console.error(e);
  msg("Engine Fehler: "+e.message);
}
</script>

</body>
</html>
