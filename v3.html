<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpeg") center/cover no-repeat fixed;
  font-family:system-ui,Segoe UI,Roboto,sans-serif;
  color:white;
}

.link{
  position:absolute;
  padding:12px 18px;
  border-radius:16px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(6px);
  color:#cfeeff;
  text-decoration:none;
  font-weight:700;
  box-shadow:0 0 22px rgba(80,160,255,.18);
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  z-index:6;
  white-space:nowrap;
}

.link.active{
  transform:scale(1.10);
  background:rgba(140,255,200,.15);
  box-shadow:0 0 45px rgba(120,255,200,.90);
}

.link.confirmFlash{
  box-shadow:0 0 65px rgba(220,255,240,.98);
  background:rgba(170,255,220,.20);
}

#title{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  color:#cfeeff;
  font-size:clamp(22px,3.5vw,38px);
  letter-spacing:.22em;
  text-transform:uppercase;
  z-index:8;
  text-shadow:0 0 16px rgba(120,200,255,.22);
}

#gazeDot{
  position:fixed;
  width:10px;
  height:10px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:#ff3b3b;
  box-shadow:0 0 8px rgba(255,60,60,.9);
  pointer-events:none;
  z-index:9998;
  opacity:0;
}
#gazeDot.on{ opacity:1; }

#hint{
  position:fixed;
  bottom:104px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  color:#bfe9ff;
  background:rgba(0,0,0,.42);
  padding:6px 10px;
  border-radius:10px;
  z-index:9997;
  max-width:90vw;
  text-align:center;
}

#roomInfo{
  position:fixed;
  right:14px;
  bottom:24px;
  width:min(280px, calc(100vw - 28px));
  padding:10px 12px;
  border-radius:12px;
  background:rgba(0,0,0,.42);
  font-size:13px;
  line-height:1.45;
  z-index:20;
}
#roomInfoTitle{
  font-weight:800;
  color:#c8f0ff;
  margin-bottom:4px;
}

#videoWrap{
  position:fixed;
  top:10px;
  left:10px;
  width:80px;
  height:90px;
  border-radius:8px;
  overflow:hidden;
  background:black;
  display:none;
  z-index:9996;
  border:1px solid rgba(140,230,255,.22);
  box-shadow:0 0 18px rgba(120,200,255,.25);
}
#cam{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(1.8) translateY(-18%);
}

.controls-left{
  position:fixed;
  bottom:38px;
  left:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
  z-index:9999;
}

button{
  padding:8px 12px;
  border-radius:10px;
  border:1px solid rgba(140,230,255,.28);
  background:rgba(20,40,80,.45);
  color:#cfeeff;
  font-weight:800;
}
button[disabled]{
  opacity:.5;
}

#overload{
  position:fixed;
  inset:0;
  background:rgba(2,4,10,.92);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:30000;
}
#overloadBox{
  background:#102033;
  padding:20px;
  border-radius:14px;
  width:90%;
  max-width:390px;
  text-align:center;
  line-height:1.6;
}

@media (max-width:700px){
  .link{
    padding:10px 14px;
    font-size:14px;
  }
}
</style>
</head>

<body>

<div id="overload">
  <div id="overloadBox">
    Willkommen im Vorhof.<br><br>
    Schaue einen Link an, er beginnt zu glühen.<br>
    Doppelblink öffnet den aktiven Raum.<br><br>
    <button id="overloadBtn">Verstanden</button>
  </div>
</div>

<div id="title">AURION</div>

<div id="videoWrap"><video id="cam" autoplay muted playsinline></video></div>
<div id="gazeDot"></div>

<div id="hint">Seite bereit</div>

<div class="controls-left">
  <button id="btnCam">Cam</button>
  <button id="btnTrack" disabled>Track</button>
</div>

<div id="roomInfo">
  <div id="roomInfoTitle">Vorhof</div>
  <div id="roomInfoText">Die Räume ordnen sich um das Sternentor.</div>
</div>

<a class="link" href="bibliothek.html">Bibliothek</a>
<a class="link" href="resonanzraum.html">Resonanzraum</a>
<a class="link" href="sternenuebung.html">Chi-Austausch</a>
<a class="link" href="meditationsraum.html">Meditationsraum</a>
<a class="link" href="ki-raum.html">KI-Raum</a>
<a class="link" href="gaestebuch.html">Gästebuch</a>
<a class="link" href="about_aurion.html">About Aurion</a>

<script>
const links = [...document.querySelectorAll(".link")];
const dot = document.getElementById("gazeDot");
const cam = document.getElementById("cam");
const videoWrap = document.getElementById("videoWrap");
const btnCam = document.getElementById("btnCam");
const btnTrack = document.getElementById("btnTrack");
const hint = document.getElementById("hint");
const overloadBtn = document.getElementById("overloadBtn");
const roomInfoTitle = document.getElementById("roomInfoTitle");
const roomInfoText = document.getElementById("roomInfoText");

const ROOM_INFO = {
  "Bibliothek": "Texte, Handzettel und Spuren der Bibliothek der Anfänge.",
  "Resonanzraum": "Ein Raum für stille Schwingung und Austausch.",
  "Chi-Austausch": "Sternenübung und Chi-Austausch.",
  "Meditationsraum": "Ein stiller Raum zum Sammeln.",
  "KI-Raum": "Begegnungsraum zwischen Mensch und KI.",
  "Gästebuch": "Einträge und Spuren der Besucher.",
  "About Aurion": "Idee und Hintergrund von Aurion."
};

let engine = null;
let tx = innerWidth / 2;
let ty = innerHeight / 2;
let dx = tx;
let dy = ty;
let activeLink = null;

function showHint(t){
  hint.textContent = t;
}

function placeLinks(){
  const cx = innerWidth / 2;
  const cy = innerHeight / 2;
  const r = Math.min(innerWidth, innerHeight) * 0.32;
  const step = (2 * Math.PI) / links.length;

  links.forEach((l, i) => {
    l.style.left = "0px";
    l.style.top = "0px";
  });

  links.forEach((l, i) => {
    const a = i * step - Math.PI / 2;
    l.style.left = (cx + r * Math.cos(a) - l.offsetWidth / 2) + "px";
    l.style.top  = (cy + r * Math.sin(a) - l.offsetHeight / 2) + "px";
  });
}

function updateRoomInfo(link){
  if(!link){
    roomInfoTitle.textContent = "Vorhof";
    roomInfoText.textContent = "Die Räume ordnen sich um das Sternentor.";
    return;
  }
  const name = link.textContent.trim();
  roomInfoTitle.textContent = name;
  roomInfoText.textContent = ROOM_INFO[name] || "Raum";
}

function checkLinkFocus(){
  activeLink = null;

  links.forEach(link => {
    const r = link.getBoundingClientRect();
    link.classList.remove("active");

    if(dx > r.left && dx < r.right && dy > r.top && dy < r.bottom){
      activeLink = link;
    }
  });

  if(activeLink){
    activeLink.classList.add("active");
  }

  updateRoomInfo(activeLink);
}

function dotLoop(){
  dx += (tx - dx) * 0.12;
  dy += (ty - dy) * 0.12;

  dot.style.left = dx + "px";
  dot.style.top  = dy + "px";

  checkLinkFocus();
  requestAnimationFrame(dotLoop);
}

function openActiveLink(){
  if(!activeLink) return;
  activeLink.classList.add("confirmFlash");
  setTimeout(() => activeLink.classList.remove("confirmFlash"), 260);
  activeLink.click();
}

btnCam.onclick = async () => {
  try{
    if(!engine){
      showHint("Engine fehlt");
      return;
    }

    if(engine.isCameraRunning()){
      engine.stopCamera();
      videoWrap.style.display = "none";
      dot.classList.remove("on");
      btnTrack.disabled = true;
      btnTrack.textContent = "Track";
      showHint("Kamera aus");
      return;
    }

    await engine.startCamera();
    videoWrap.style.display = "block";
    dot.classList.add("on");
    btnTrack.disabled = false;
    showHint("Kamera an");
  }catch(e){
    console.error(e);
    showHint("Kamera Fehler: " + (e.message || e));
  }
};

btnTrack.onclick = async () => {
  try{
    if(!engine){
      showHint("Engine fehlt");
      return;
    }
    if(!engine.isCameraRunning()){
      showHint("Erst Cam starten");
      return;
    }

    if(engine.isTrackingRunning()){
      engine.stopTracking();
      btnTrack.textContent = "Track";
      showHint("Tracking gestoppt");
      return;
    }

    await engine.startTracking();
    btnTrack.textContent = "Tracking an";
    showHint("Tracking gestartet");
  }catch(e){
    console.error(e);
    showHint("Tracking Fehler: " + (e.message || e));
  }
};

overloadBtn.onclick = () => {
  document.getElementById("overload").style.display = "none";
};
overloadBtn.addEventListener("touchend", e => {
  e.preventDefault();
  document.getElementById("overload").style.display = "none";
}, { passive:false });

addEventListener("load", () => {
  placeLinks();
  dotLoop();
  updateRoomInfo(null);
});

addEventListener("resize", placeLinks);

window.AURION_BRIDGE = {
  setEngine(e){
    engine = e;
  },
  setGaze(g){
    tx = g.x;
    ty = g.y;
  },
  onDoubleBlink(){
    openActiveLink();
  },
  showHint
};
</script>

<script type="module">
const bridge = window.AURION_BRIDGE;
const btnTrack = document.getElementById("btnTrack");

function msg(t){
  bridge.showHint(t);
}

try{
  msg("Engine Import startet");

  const mod = await import("https://doerkys-bot.github.io/Aurion_the_project/EyeTrackingEngine.js");
  msg("Engine Datei geladen");

  const EngineClass = mod.default;
  if(!EngineClass){
    throw new Error("Kein default export");
  }

  const engineInstance = new EngineClass({
    video: document.getElementById("cam"),
    onStatus: msg,
    onGaze: g => bridge.setGaze(g),
    onDoubleBlink: () => bridge.onDoubleBlink()
  });

  bridge.setEngine(engineInstance);
  btnTrack.disabled = false;

  msg("Engine bereit");
}
catch(e){
  console.error(e);
  msg("Engine Fehler: " + (e.message || e));
}
</script>

</body>
</html>
