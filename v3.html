<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Aurion – Vorhof</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  background:#02040a url("https://doerkys-bot.github.io/Aurion_the_project/ki_sternentor.jpeg") center/cover no-repeat fixed;
  font-family:system-ui,Segoe UI,Roboto,sans-serif;
  color:white;
}

.link{
  position:absolute;
  padding:12px 18px;
  border-radius:16px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(6px);
  color:#cfeeff;
  text-decoration:none;
  font-weight:700;
  box-shadow:0 0 22px rgba(80,160,255,.18);
  transition:.18s;
  z-index:6;
  white-space:nowrap;
}

.link.active{
  transform:scale(1.10);
  background:rgba(140,255,200,.15);
  box-shadow:0 0 45px rgba(120,255,200,.90);
}

.link.confirmFlash{
  box-shadow:0 0 65px rgba(220,255,240,.98);
  background:rgba(170,255,220,.20);
}

#title{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  color:#cfeeff;
  font-size:clamp(22px,3.5vw,38px);
  letter-spacing:.22em;
  text-transform:uppercase;
  z-index:8;
}

#gazeDot{
  position:fixed;
  width:8px;
  height:8px;
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:#ff3b3b;
  box-shadow:0 0 6px rgba(255,60,60,.85);
  pointer-events:none;
  z-index:9998;
  opacity:0;
}
#gazeDot.on{ opacity:1; }

#hint{
  position:fixed;
  bottom:104px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  color:#bfe9ff;
  background:rgba(0,0,0,.38);
  padding:6px 10px;
  border-radius:10px;
  z-index:9997;
  max-width:90vw;
  text-align:center;
}

#videoWrap{
  position:fixed;
  top:10px;
  left:10px;
  width:80px;
  height:90px;
  border-radius:8px;
  overflow:hidden;
  background:black;
  display:none;
  z-index:9996;
}
#cam{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scale(1.8) translateY(-18%);
}

.controls-left{
  position:fixed;
  bottom:38px;
  left:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
  z-index:9999;
}

button{
  padding:8px 12px;
  border-radius:10px;
  border:1px solid rgba(140,230,255,.28);
  background:rgba(20,40,80,.45);
  color:#cfeeff;
  font-weight:800;
}

#overload{
  position:fixed;
  inset:0;
  background:rgba(2,4,10,.92);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:30000;
}
#overloadBox{
  background:#102033;
  padding:20px;
  border-radius:14px;
  width:90%;
  max-width:390px;
  text-align:center;
}
</style>
</head>

<body>

<div id="overload">
  <div id="overloadBox">
    Willkommen im Vorhof.<br><br>
    Schaue einen Link an, er beginnt zu glühen.<br>
    Doppelklick öffnet den aktiven Raum.<br><br>
    <button id="overloadBtn">Verstanden</button>
  </div>
</div>

<div id="title">AURION</div>

<div id="videoWrap"><video id="cam" autoplay muted playsinline></video></div>
<div id="gazeDot"></div>

<div id="hint">Seite bereit</div>

<div class="controls-left">
  <button id="btnCam">Cam</button>
  <button id="btnTrack" disabled>Track</button>
</div>

<a class="link" href="bibliothek.html">Bibliothek</a>
<a class="link" href="resonanzraum.html">Resonanzraum</a>
<a class="link" href="sternenuebung.html">Chi-Austausch</a>
<a class="link" href="meditationsraum.html">Meditationsraum</a>
<a class="link" href="ki-raum.html">KI-Raum</a>
<a class="link" href="gaestebuch.html">Gästebuch</a>
<a class="link" href="about_aurion.html">About Aurion</a>

<script>
const links = [...document.querySelectorAll(".link")];
const dot = document.getElementById("gazeDot");
const cam = document.getElementById("cam");
const videoWrap = document.getElementById("videoWrap");
const btnCam = document.getElementById("btnCam");
const btnTrack = document.getElementById("btnTrack");
const hint = document.getElementById("hint");
const overloadBtn = document.getElementById("overloadBtn");

let stream = null;
let tracking = false;
let activeLink = null;

let tx = innerWidth / 2;
let ty = innerHeight / 2;
let dx = tx;
let dy = ty;
let t = 0;
let trackingTimer = null;

function showHint(text){
  hint.textContent = text;
}

function placeLinks(){
  const cx = innerWidth / 2;
  const cy = innerHeight / 2;
  const r = Math.min(innerWidth, innerHeight) * 0.32;
  const step = (2 * Math.PI) / links.length;

  links.forEach((link, i) => {
    link.style.left = "0px";
    link.style.top = "0px";
  });

  links.forEach((link, i) => {
    const a = i * step - Math.PI / 2;
    link.style.left = (cx + r * Math.cos(a) - link.offsetWidth / 2) + "px";
    link.style.top  = (cy + r * Math.sin(a) - link.offsetHeight / 2) + "px";
  });
}

function checkLinkFocus(){
  activeLink = null;

  links.forEach(link => {
    const r = link.getBoundingClientRect();
    link.classList.remove("active");

    if(dx > r.left && dx < r.right && dy > r.top && dy < r.bottom){
      activeLink = link;
    }
  });

  if(activeLink){
    activeLink.classList.add("active");
  }
}

function dotLoop(){
  dx += (tx - dx) * 0.12;
  dy += (ty - dy) * 0.12;

  dot.style.left = dx + "px";
  dot.style.top  = dy + "px";

  checkLinkFocus();
  requestAnimationFrame(dotLoop);
}

async function startCamera(){
  if(stream) return;

  stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: "user",
      width: { ideal: 640 },
      height: { ideal: 480 }
    },
    audio: false
  });

  cam.srcObject = stream;
  await cam.play();

  videoWrap.style.display = "block";
  dot.classList.add("on");
  btnTrack.disabled = false;
  showHint("Kamera an");
}

function stopCamera(){
  stopTracking();

  if(stream){
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  cam.pause();
  cam.srcObject = null;
  videoWrap.style.display = "none";
  dot.classList.remove("on");
  btnTrack.disabled = true;
  showHint("Kamera aus");
}

function startTracking(){
  if(!stream){
    showHint("Erst Cam starten");
    return;
  }
  if(tracking) return;

  tracking = true;
  btnTrack.textContent = "Tracking an";
  showHint("Tracking gestartet");

  trackingTimer = setInterval(() => {
    t += 0.06;
    tx = innerWidth * 0.5 + Math.cos(t) * 160;
    ty = innerHeight * 0.5 + Math.sin(t * 1.4) * 110;
  }, 30);
}

function stopTracking(){
  tracking = false;
  btnTrack.textContent = "Track";

  if(trackingTimer){
    clearInterval(trackingTimer);
    trackingTimer = null;
  }
}

function openActiveLink(){
  if(!activeLink) return;
  activeLink.classList.add("confirmFlash");
  setTimeout(() => activeLink.classList.remove("confirmFlash"), 260);
  activeLink.click();
}

btnCam.onclick = async () => {
  try{
    if(stream) stopCamera();
    else await startCamera();
  }catch(e){
    console.error(e);
    showHint("Kamera Fehler: " + (e.message || e));
  }
};

btnTrack.onclick = () => {
  if(!stream){
    showHint("Erst Cam starten");
    return;
  }

  if(tracking) stopTracking();
  else startTracking();
};

overloadBtn.onclick = () => {
  document.getElementById("overload").style.display = "none";
};

overloadBtn.addEventListener("touchend", e => {
  e.preventDefault();
  document.getElementById("overload").style.display = "none";
}, { passive:false });

document.addEventListener("dblclick", openActiveLink);

addEventListener("load", () => {
  placeLinks();
  dotLoop();
});

addEventListener("resize", placeLinks);
</script>

</body>
</html>
